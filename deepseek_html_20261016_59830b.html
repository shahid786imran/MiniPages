const COL = "Test1", DOC = "global";

<fieldset>

  <div id="list" style="border:1px solid #ccc;padding:6px;margin-top:6px;min-height:40px">—</div>

  <div id="editBox" style="display:none;margin-top:10px">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getFirestore(app);
const ref = doc(db, COL, DOC);

signInAnonymously(auth);
onAuthStateChanged(auth, u => document.getElementById("auth").textContent = u ? "OK" : "…");

const $ = id => document.getElementById(id);
const log = m => $("out").textContent = typeof m === "string" ? m : JSON.stringify(m, null, 2);
const esc = s => (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

$("bSave").onclick = async () => {
  const n = $("n").value.trim(); if (!n) return alert("Name?");
  await setDoc(ref, { name:n, note:$("note").value.trim(), updatedAt: serverTimestamp() }, { merge:true });
  alert("Saved"); $("bLoad").click();
};
$("bLoad").onclick = async () => {
  const s = await getDoc(ref);
  $("fsOut").textContent = s.exists()
    ? "Name: "+(s.data().name||"")+"\nNote: "+(s.data().note||"")+"\nUpdated: "+(s.data().updatedAt?s.data().updatedAt.toDate().toLocaleString():"-")
    : "No document.";
};
$("bDel").onclick = async () => { if (confirm("Delete?")) { await deleteDoc(ref); alert("Deleted"); $("bLoad").click(); } };
</script>

<script>
/* ============ DRIVE ============ */
const $ = id => document.getElementById(id);
const log = m => $("out").textContent = typeof m === "string" ? m : JSON.stringify(m, null, 2);
const esc = s => (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function waitGapi(max=6000){
  return new Promise(r=>{const t=Date.now();(function c(){
    if(typeof gapi!=="undefined"&&typeof gapi.client!=="undefined")return r(true);
    if(Date.now()-t>max)return r(false); setTimeout(c,150);
  })();});
}
async function initGapi(){
  if(typeof gapi==="undefined"){ $("gapiSt").textContent="✘ gapi missing"; return; }
  await new Promise(r=>gapi.load("client",r));
  if(!(await waitGapi())){ $("gapiSt").textContent="✘ gapi.client missing"; return; }
  try{
    await gapi.client.init({ apiKey:DRIVE_CONFIG.apiKey, discoveryDocs:["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"]});
    $("gapiSt").textContent="✔ ready";
  }catch(e){ $("gapiSt").textContent="✘ init failed"; console.error(e); }
}
function initToken(){
  if(typeof google==="undefined"||!google.accounts||!google.accounts.oauth2) return setTimeout(initToken,300);
  window._tokenClient = google.accounts.oauth2.initTokenClient({
    client_id:DRIVE_CONFIG.oauthClientId, scope:DRIVE_CONFIG.scope,
    callback:r=>{ if(r.access_token){ window._accessToken=r.access_token; gapi.client.setToken({access_token:r.access_token}); } }
  });
}
function ensureToken(){
  return new Promise((res,rej)=>{
    if(window._accessToken) return res();
    if(!window._tokenClient) return rej(new Error("Token client not ready"));
    const old=window._tokenClient.callback;
    window._tokenClient.callback=r=>{ old(r); res(); };
    window._tokenClient.requestAccessToken({prompt:"consent"});
  });
}
async function subFolder(){
  if(window._subId) return window._subId;
  const q=`'${DRIVE_CONFIG.parentFolderId}' in parents and name='${DRIVE_CONFIG.subFolderName}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
  const l=await gapi.client.drive.files.list({q,fields:"files(id)"});
  if(l.result.files&&l.result.files.length) return window._subId=l.result.files[0].id;
  const c=await gapi.client.drive.files.create({resource:{name:DRIVE_CONFIG.subFolderName,mimeType:"application/vnd.google-apps.folder",parents:[DRIVE_CONFIG.parentFolderId]},fields:"id"});
  return window._subId=c.result.id;
}
async function refresh(){
  try{
    await ensureToken();
    const sid=await subFolder();
    const r=await gapi.client.drive.files.list({q:`'${sid}' in parents and trashed=false`,fields:"files(id,name,mimeType,webViewLink)",orderBy:"modifiedTime desc"});
    const f=r.result.files||[];
    $("list").innerHTML = f.length ? f.map(x=>`<div style="padding:4px;border-bottom:1px solid #eee">
      <b>${esc(x.name)}</b><br><small>${x.id}</small><br>
      <button data-id="${x.id}" data-n="${esc(x.name)}" data-m="${x.mimeType}">Open</button>
      <a href="${x.webViewLink}" target="_blank">View</a></div>`).join("") : "<i>Empty</i>";
    $("list").querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>open_(b.dataset.id,b.dataset.n,b.dataset.m));
    log("Files: "+f.length);
  }catch(e){ log("Error: "+e.message); }
}
async function upload(){
  const fi=$("fInput"); if(!fi.files.length) return alert("Choose file");
  try{
    await ensureToken(); const sid=await subFolder();
    const fd=new FormData();
    fd.append("metadata",new Blob([JSON.stringify({name:fi.files[0].name,parents:[sid]})],{type:"application/json"}));
    fd.append("file",fi.files[0]);
    const r=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name",
      {method:"POST",headers:{Authorization:"Bearer "+window._accessToken},body:fd});
    const d=await r.json(); if(d.error) return log(d.error);
    log("Uploaded: "+d.name); fi.value=""; refresh();
  }catch(e){ log("Error: "+e.message); }
}
async function createNew(){
  const name=prompt("Name:","New_"+Date.now()+".txt"); if(!name) return;
  try{
    await ensureToken(); const sid=await subFolder();
    const fd=new FormData();
    fd.append("metadata",new Blob([JSON.stringify({name,parents:[sid],mimeType:"text/plain"})],{type:"application/json"}));
    fd.append("file",new Blob([""],{type:"text/plain"}));
    const r=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name",
      {method:"POST",headers:{Authorization:"Bearer "+window._accessToken},body:fd});
    const d=await r.json(); if(d.error) return log(d.error);
    log("Created: "+d.name); refresh();
  }catch(e){ log("Error: "+e.message); }
}
async function open_(id,name,mime){
  window._fileId=id; window._mime=mime;
  $("editBox").style.display="block"; $("edName").textContent=name; $("edNewName").value=name; $("edContent").value="(loading…)";
  try{
    await ensureToken();
    const r=await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,{headers:{Authorization:"Bearer "+window._accessToken}});
    $("edContent").value=await r.text();
    log("Opened: "+name);
  }catch(e){ log("Error: "+e.message); }
}
async function saveContent(){
  if(!window._fileId) return;
  try{
    await ensureToken();
    const r=await fetch(`https://www.googleapis.com/upload/drive/v3/files/${window._fileId}?uploadType=media`,
      {method:"PATCH",headers:{Authorization:"Bearer "+window._accessToken,"Content-Type":window._mime||"text/plain"},body:$("edContent").value});
    const d=await r.json(); if(d.error) return log(d.error);
    log("Content saved");
  }catch(e){ log("Error: "+e.message); }
}
async function rename(){
  if(!window._fileId) return;
  const nn=$("edNewName").value.trim(); if(!nn) return;
  try{
    await ensureToken();
    const r=await fetch(`https://www.googleapis.com/drive/v3/files/${window._fileId}`,
      {method:"PATCH",headers:{Authorization:"Bearer "+window._accessToken,"Content-Type":"application/json"},body:JSON.stringify({name:nn})});
    const d=await r.json(); if(d.error) return log(d.error);
    log("Renamed to: "+d.name); refresh();
  }catch(e){ log("Error: "+e.message); }
}
async function trash(){
  if(!window._fileId||!confirm("Move to Trash?")) return;
  try{
    await ensureToken();
    await fetch(`https://www.googleapis.com/drive/v3/files/${window._fileId}`,
      {method:"DELETE",headers:{Authorization:"Bearer "+window._accessToken}});
    log("Moved to Trash"); $("editBox").style.display="none"; window._fileId=null; refresh();
  }catch(e){ log("Error: "+e.message); }
}
async function listTrash(){
  try{
    await ensureToken(); const sid=await subFolder();
    const r=await gapi.client.drive.files.list({q:`'${sid}' in parents and trashed=true`,fields:"files(id,name)"});
    const f=r.result.files||[];
    $("trash").innerHTML = f.length ? f.map(x=>`<div><b>${esc(x.name)}</b> <button data-r="${x.id}">Restore</button></div>`).join("") : "<i>Empty</i>";
    $("trash").querySelectorAll("button[data-r]").forEach(b=>b.onclick=()=>restore(b.dataset.r));
    log("Trash: "+f.length);
  }catch(e){ log("Error: "+e.message); }
}
async function restore(id){
  try{
    await ensureToken();
    const r=await fetch(`https://www.googleapis.com/drive/v3/files/${id}`,
      {method:"PATCH",headers:{Authorization:"Bearer "+window._accessToken,"Content-Type":"application/json"},body:JSON.stringify({trashed:false})});
    const d=await r.json(); if(d.error) return log(d.error);
    log("Restored"); listTrash(); refresh();
  }catch(e){ log("Error: "+e.message); }
}

/* bind */
$("bRefresh").onclick=refresh;
$("bCreate").onclick=createNew;
$("bUp").onclick=upload;
$("bRen").onclick=rename;
$("bSaveC").onclick=saveContent;
$("bTrash").onclick=trash;
$("bTrashList").onclick=listTrash;
$("bAuth").onclick=()=>{ if(window._tokenClient) window._tokenClient.requestAccessToken({prompt:"consent"}); else alert("Not ready"); };

initGapi();
initToken();
</script>
