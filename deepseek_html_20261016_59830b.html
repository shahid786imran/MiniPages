<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firebase + Drive Test</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 16px; background: #f7f8fa; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin: 16px 0; }
    h1 { margin-bottom: 4px; }
    .sub { color: #666; font-size: 14px; margin-top: 0; }
    button { padding: 9px 16px; margin: 3px 4px 3px 0; cursor: pointer; border-radius: 6px; border: 1px solid #c8c8c8; background: #fff; font-size: 14px; }
    button:hover:not(:disabled) { background: #eef2ff; border-color: #8aa4ff; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
    button.primary:hover:not(:disabled) { background: #1557b0; }
    pre { background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 6px; max-height: 300px; overflow: auto; font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
    .ok { color: #7ee787; }
    .err { color: #ff7b72; }
    .info { color: #79c0ff; }
    input[type="file"] { margin: 8px 0; font-size: 13px; }
    #status { font-weight: 600; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; margin-left: 6px; }
    .badge.pass { background: #d4f4dd; color: #0a6b2e; }
    .badge.fail { background: #fdd8d8; color: #a00; }
    .badge.pending { background: #fff3cd; color: #856404; }
  </style>
</head>
<body>

  <h1>🧪 Firebase + Drive Test</h1>
  <p class="sub">Firestore collection: <b>test1</b> &nbsp;|&nbsp; Drive sub folder: <b>test1</b></p>

  <div class="card">
    <h2>Session <span id="authBadge" class="badge pending">NOT SIGNED IN</span></h2>
    <p>Status: <span id="status">Loading…</span></p>
    <button id="loginBtn" class="primary">Sign in with Google</button>
    <button id="logoutBtn" disabled>Sign out</button>
  </div>

  <div class="card">
    <h2>1. Firestore Test <span id="fbBadge" class="badge pending">PENDING</span></h2>
    <button id="fbWriteBtn" disabled>Write Test Doc</button>
    <button id="fbReadBtn" disabled>Read Test Docs</button>
    <pre id="fbOut">—</pre>
  </div>

  <div class="card">
    <h2>2. Drive Test <span id="driveBadge" class="badge pending">PENDING</span></h2>
    <button id="driveListBtn" disabled>List Files in Sub Folder</button>
    <br />
    <input type="file" id="uploadInput" disabled />
    <button id="uploadBtn" disabled>Upload Selected File</button>
    <pre id="driveOut">—</pre>
  </div>

  <script type="module">
    // ============================================================
    // CONFIGURATION — EDIT HERE ONLY
    // ============================================================
    const FIREBASE_CONFIG = {
      apiKey:            "AIzaSyAFiJNThb3TJsqiPLIcqk20XU9ag59wdOs",
      authDomain:        "mywebapps-e3b63.firebaseapp.com",
      projectId:         "mywebapps-e3b63",
      storageBucket:     "mywebapps-e3b63.firebasestorage.app",
      messagingSenderId: "46681415809",
      appId:             "1:46681415809:web:c4528b9da97abc310a2d80"
    };

    const FIRESTORE_COLLECTION = "test1";

    const DRIVE_CONFIG = {
      oauthClientId: "203025420924-uvlehfup39hj4st7tpv7vud8uedafr9k.apps.googleusercontent.com",
      apiKey:        "AIzaSyBSf3HKUR652Kja3l65D91VfCkQSoxgZDY",
      parentFolderId: "1LFkmK8l6dB6HtFlcApI0TW2jgp7cGEGT",
      subFolderName: "test1",
      scope:         "https://www.googleapis.com/auth/drive.file"
    };

    // ============================================================
    // IMPORTS
    // ============================================================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import {
      getAuth, signInWithPopup, GoogleAuthProvider,
      onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, getDocs, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    // ============================================================
    // INIT
    // ============================================================
    const app  = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    const provider = new GoogleAuthProvider();
    provider.addScope(DRIVE_CONFIG.scope);
    provider.setCustomParameters({ prompt: "consent select_account" });

    // ============================================================
    // STATE
    // ============================================================
    let accessToken = null;
    let currentUser = null;
    let cachedSubFolderId = null;

    // ============================================================
    // DOM
    // ============================================================
    const $ = id => document.getElementById(id);
    const statusEl   = $("status");
    const authBadge  = $("authBadge");
    const loginBtn   = $("loginBtn");
    const logoutBtn  = $("logoutBtn");
    const fbBadge    = $("fbBadge");
    const fbWriteBtn = $("fbWriteBtn");
    const fbReadBtn  = $("fbReadBtn");
    const fbOut      = $("fbOut");
    const driveBadge = $("driveBadge");
    const driveListBtn = $("driveListBtn");
    const uploadInput = $("uploadInput");
    const uploadBtn  = $("uploadBtn");
    const driveOut   = $("driveOut");

    function setBadge(el, state, text) {
      el.className = "badge " + state;
      el.textContent = text;
    }

    function log(el, lines) {
      const arr = Array.isArray(lines) ? lines : [lines];
      el.innerHTML = arr.map(l => {
        if (typeof l === "string") return escapeHtml(l);
        return `<span class="${l.type || ""}">${escapeHtml(l.text)}</span>`;
      }).join("\n");
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // ============================================================
    // AUTH
    // ============================================================
    loginBtn.onclick = async () => {
      try {
        statusEl.textContent = "Signing in…";
        const result = await signInWithPopup(auth, provider);
        const cred   = GoogleAuthProvider.credentialFromResult(result);
        accessToken  = cred.accessToken;
        currentUser  = result.user;
        statusEl.textContent = `Signed in: ${currentUser.displayName} <${currentUser.email}>`;
        setBadge(authBadge, "pass", "SIGNED IN");
      } catch (err) {
        statusEl.textContent = "Sign-in failed: " + err.message;
        setBadge(authBadge, "fail", "FAILED");
        console.error(err);
      }
    };

    logoutBtn.onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        loginBtn.disabled  = true;
        logoutBtn.disabled = false;
        setBadge(authBadge, "pass", "SIGNED IN");
        fbWriteBtn.disabled = false;
        fbReadBtn.disabled  = false;
        driveListBtn.disabled = false;
        uploadInput.disabled  = false;
      } else {
        currentUser = null;
        accessToken = null;
        cachedSubFolderId = null;
        loginBtn.disabled  = false;
        logoutBtn.disabled = true;
        setBadge(authBadge, "pending", "NOT SIGNED IN");
        fbWriteBtn.disabled = true;
        fbReadBtn.disabled  = true;
        driveListBtn.disabled = true;
        uploadInput.disabled  = true;
        uploadBtn.disabled    = true;
      }
    });

    uploadInput.onchange = () => {
      uploadBtn.disabled = !uploadInput.files.length;
    };

    // ============================================================
    // FIRESTORE TEST
    // ============================================================
    fbWriteBtn.onclick = async () => {
      setBadge(fbBadge, "pending", "RUNNING…");
      const lines = ["Firestore write test…"];
      try {
        const ref = await addDoc(collection(db, FIRESTORE_COLLECTION), {
          message: "Test entry",
          createdAt: serverTimestamp(),
          rand: Math.floor(Math.random() * 999999)
        });
        lines.push({ text: `✔ WRITE OK — ID: ${ref.id}`, type: "ok" });
        setBadge(fbBadge, "pass", "PASS");
      } catch (err) {
        lines.push({ text: `✘ WRITE FAILED: ${err.message}`, type: "err" });
        setBadge(fbBadge, "fail", "FAIL");
      }
      log(fbOut, lines);
    };

    fbReadBtn.onclick = async () => {
      setBadge(fbBadge, "pending", "RUNNING…");
      const lines = ["Firestore read test…"];
      try {
        const snap = await getDocs(collection(db, FIRESTORE_COLLECTION));
        lines.push({ text: `✔ READ OK — ${snap.size} document(s)`, type: "ok" });
        snap.forEach(d => lines.push(`   • ${d.id}: ${JSON.stringify(d.data())}`));
        setBadge(fbBadge, "pass", "PASS");
      } catch (err) {
        lines.push({ text: `✘ READ FAILED: ${err.message}`, type: "err" });
        setBadge(fbBadge, "fail", "FAIL");
      }
      log(fbOut, lines);
    };

    // ============================================================
    // DRIVE HELPERS
    // ============================================================
    async function driveFetch(url, options = {}) {
      if (!accessToken) throw new Error("No access token. Sign in again.");
      const headers = Object.assign(
        { "Authorization": "Bearer " + accessToken },
        options.headers || {}
      );
      const res = await fetch(url, { ...options, headers });
      const text = await res.text();
      let json = null;
      try { json = JSON.parse(text); } catch (_) {}
      return { ok: res.ok, status: res.status, statusText: res.statusText, json, text };
    }

    async function getOrCreateSubFolder() {
      if (cachedSubFolderId) return cachedSubFolderId;

      const q = encodeURIComponent(
        `'${DRIVE_CONFIG.parentFolderId}' in parents ` +
        `and name='${DRIVE_CONFIG.subFolderName}' ` +
        `and mimeType='application/vnd.google-apps.folder' ` +
        `and trashed=false`
      );
      const search = await driveFetch(
        `https://www.googleapis.com/drive/v3/files` +
        `?q=${q}&fields=files(id,name)&supportsAllDrives=true&includeItemsFromAllDrives=true&key=${DRIVE_CONFIG.apiKey}`
      );
      if (!search.ok) throw new Error(`Search failed [${search.status}]: ${search.text}`);
      if (search.json.files && search.json.files.length) {
        cachedSubFolderId = search.json.files[0].id;
        return cachedSubFolderId;
      }

      const create = await driveFetch(
        `https://www.googleapis.com/drive/v3/files?fields=id,name&supportsAllDrives=true&key=${DRIVE_CONFIG.apiKey}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: DRIVE_CONFIG.subFolderName,
            mimeType: "application/vnd.google-apps.folder",
            parents: [DRIVE_CONFIG.parentFolderId]
          })
        }
      );
      if (!create.ok) throw new Error(`Create folder failed [${create.status}]: ${create.text}`);
      cachedSubFolderId = create.json.id;
      return cachedSubFolderId;
    }

    // ============================================================
    // DRIVE — LIST
    // ============================================================
    driveListBtn.onclick = async () => {
      setBadge(driveBadge, "pending", "RUNNING…");
      const lines = ["Drive list test…"];
      try {
        const folderId = await getOrCreateSubFolder();
        lines.push({ text: `✔ Sub Folder ID: ${folderId}`, type: "ok" });

        const q = encodeURIComponent(`'${folderId}' in parents and trashed=false`);
        const res = await driveFetch(
          `https://www.googleapis.com/drive/v3/files` +
          `?q=${q}&fields=files(id,name,mimeType,size,createdTime)` +
          `&supportsAllDrives=true&includeItemsFromAllDrives=true&key=${DRIVE_CONFIG.apiKey}`
        );
        if (!res.ok) throw new Error(`[${res.status}] ${res.text}`);

        const files = res.json.files || [];
        lines.push({ text: `✔ LIST OK — ${files.length} file(s)`, type: "ok" });
        files.forEach(f => lines.push(`   • ${f.name} (${f.id})`));
        setBadge(driveBadge, "pass", "PASS");
      } catch (err) {
        lines.push({ text: `✘ LIST FAILED: ${err.message}`, type: "err" });
        setBadge(driveBadge, "fail", "FAIL");
      }
      log(driveOut, lines);
    };

    // ============================================================
    // DRIVE — UPLOAD (multipart with real CRLF bytes)
    // ============================================================
    uploadBtn.onclick = async () => {
      const file = uploadInput.files[0];
      if (!file) return;

      setBadge(driveBadge, "pending", "RUNNING…");
      const lines = [`Uploading: ${file.name} (${file.size} bytes)`];

      try {
        const folderId = await getOrCreateSubFolder();
        lines.push({ text: `✔ Folder: ${folderId}`, type: "ok" });

        const boundary = "-------314159265358979323846";
        const CRLF = "\r\n";
        const delimiter  = CRLF + "--" + boundary + CRLF;
        const closeDelim = CRLF + "--" + boundary + "--";

        const buf = await file.arrayBuffer();
        const head =
          delimiter +
          "Content-Type: application/json; charset=UTF-8" + CRLF + CRLF +
          JSON.stringify({ name: file.name, parents: [folderId] }) +
          delimiter +
          "Content-Type: " + (file.type || "application/octet-stream") + CRLF + CRLF;

        const headBytes  = new TextEncoder().encode(head);
        const fileBytes  = new Uint8Array(buf);
        const closeBytes = new TextEncoder().encode(closeDelim);

        const body = new Uint8Array(headBytes.length + fileBytes.length + closeBytes.length);
        body.set(headBytes, 0);
        body.set(fileBytes, headBytes.length);
        body.set(closeBytes, headBytes.length + fileBytes.length);

        const res = await fetch(
          `https://www.googleapis.com/upload/drive/v3/files` +
          `?uploadType=multipart&fields=id,name,size&supportsAllDrives=true&key=${DRIVE_CONFIG.apiKey}`,
          {
            method: "POST",
            headers: {
              "Authorization": "Bearer " + accessToken,
              "Content-Type": "multipart/related; boundary=" + boundary
            },
            body: body
          }
        );

        const text = await res.text();
        let json = null;
        try { json = JSON.parse(text); } catch (_) {}

        if (!res.ok) {
          lines.push({ text: `✘ UPLOAD FAILED [${res.status} ${res.statusText}]`, type: "err" });
          lines.push({ text: text, type: "err" });
          setBadge(driveBadge, "fail", "FAIL");
        } else {
          lines.push({ text: `✔ UPLOAD OK`, type: "ok" });
          lines.push({ text: JSON.stringify(json, null, 2), type: "ok" });
          setBadge(driveBadge, "pass", "PASS");
        }
      } catch (err) {
        lines.push({ text: `✘ UPLOAD ERROR: ${err.message}`, type: "err" });
        setBadge(driveBadge, "fail", "FAIL");
      }
      log(driveOut, lines);
    };
  </script>
</body>
</html>
