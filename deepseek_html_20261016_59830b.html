<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Debug</title></head>
<body>
  <h2>Debug Page</h2>
  <input type="file" id="fileInput" />
  <button id="driveUploadBtn">Test Upload Button</button>

  <script>
    document.getElementById("driveUploadBtn").addEventListener("click", () => {
      const fi = document.getElementById("fileInput");
      console.log("fileInput element:", fi);
      console.log("fileInput.files:", fi ? fi.files : "NULL");
      if (!fi) { alert("fileInput NOT FOUND in the page!"); return; }
      if (!fi.files || fi.files.length === 0) { alert("No file selected."); return; }
      alert("File selected: " + fi.files[0].name);
    });
  </script>
</body>
</html>
