<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firebase + Drive API Test</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 16px; }
    button { padding: 10px 18px; margin: 4px; cursor: pointer; border-radius: 6px; border: 1px solid #ccc; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { font-weight: bold; color: #333; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 6px; max-height: 420px; overflow: auto; }
    .section { border: 1px solid #ddd; padding: 14px; border-radius: 8px; margin-top: 16px; }
    input[type="file"] { margin: 8px 0; }
    .ok { color: green; }
    .err { color: red; }
  </style>
</head>
<body>

  <h1>Firebase + Google Drive API Test</h1>
  <p>Status: <span id="status">Loading...</span></p>

  <button id="loginBtn">Sign in with Google</button>
  <button id="logoutBtn" disabled>Sign out</button>

  <!-- ================= Firebase Test Section ================= -->
  <div class="section">
    <h3>1. Firebase Firestore Test (Collection: <code>Test1</code>)</h3>
    <button id="fbWriteBtn" disabled>Write Test Doc</button>
    <button id="fbReadBtn" disabled>Read Test Docs</button>
    <pre id="fbOutput">—</pre>
  </div>

  <!-- ================= Drive Test Section ================= -->
  <div class="section">
    <h3>2. Google Drive Test (Sub Folder: <code>Test1</code>)</h3>
    <button id="driveListBtn" disabled>List Files in Sub Folder</button>
    <input type="file" id="driveUploadInput" disabled />
    <button id="driveUploadBtn" disabled>Upload Selected File</button>
    <pre id="driveOutput">—</pre>
  </div>

  <script type="module">
    // ============================================================
    // CONFIGURATION SECTION — EDIT HERE ONLY
    // ============================================================

    // --- Firebase Config ---
    const firebaseConfig = {
      apiKey: "AIzaSyAFiJNThb3TJsqiPLIcqk20XU9ag59wdOs",
      authDomain: "mywebapps-e3b63.firebaseapp.com",
      projectId: "mywebapps-e3b63",
      storageBucket: "mywebapps-e3b63.firebasestorage.app",
      messagingSenderId: "46681415809",
      appId: "1:46681415809:web:c4528b9da97abc310a2d80"
    };

    // --- Firestore ---
    const FIRESTORE_COLLECTION = "Test1";   // <-- fixed as you said

    // --- Google Drive ---
    const DRIVE_PARENT_FOLDER_ID = "1LFkmK8l6dB6HtFlcApI0TW2jgp7cGEGT";
    const DRIVE_SUB_FOLDER_NAME  = "Test1"; // <-- fixed as you said
    const DRIVE_SCOPE            = "https://www.googleapis.com/auth/drive.file";
    const DRIVE_API_KEY          = "AIzaSyBSf3HKUR652Kja3l65D91VfCkQSoxgZDY";

    // ============================================================
    // IMPORTS
    // ============================================================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import {
      getAuth,
      signInWithPopup,
      GoogleAuthProvider,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    // ============================================================
    // INIT
    // ============================================================
    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    const provider = new GoogleAuthProvider();
    provider.addScope(DRIVE_SCOPE);

    // ============================================================
    // STATE
    // ============================================================
    let accessToken = null;
    let currentUser = null;
    let cachedSubFolderId = null;

    // ============================================================
    // DOM
    // ============================================================
    const statusEl       = document.getElementById("status");
    const loginBtn       = document.getElementById("loginBtn");
    const logoutBtn      = document.getElementById("logoutBtn");
    const fbWriteBtn     = document.getElementById("fbWriteBtn");
    const fbReadBtn      = document.getElementById("fbReadBtn");
    const fbOutput       = document.getElementById("fbOutput");
    const driveListBtn   = document.getElementById("driveListBtn");
    const driveUploadInput = document.getElementById("driveUploadInput");
    const driveUploadBtn = document.getElementById("driveUploadBtn");
    const driveOutput    = document.getElementById("driveOutput");

    // ============================================================
    // HELPERS
    // ============================================================
    function enableAppButtons(enabled) {
      fbWriteBtn.disabled      = !enabled;
      fbReadBtn.disabled       = !enabled;
      driveListBtn.disabled    = !enabled;
      driveUploadInput.disabled = !enabled;
      driveUploadBtn.disabled  = !enabled || !driveUploadInput.files.length;
    }

    function log(el, msg, isError = false) {
      el.textContent = msg;
      el.className = isError ? "err" : "ok";
    }

    // ============================================================
    // AUTH
    // ============================================================
    loginBtn.onclick = async () => {
      try {
        statusEl.textContent = "Signing in...";
        const result = await signInWithPopup(auth, provider);
        const credential = GoogleAuthProvider.credentialFromResult(result);
        accessToken = credential.accessToken;
        currentUser = result.user;
        statusEl.textContent = `Signed in: ${currentUser.displayName} (${currentUser.email})`;
      } catch (err) {
        statusEl.textContent = "Sign-in failed: " + err.message;
        console.error(err);
      }
    };

    logoutBtn.onclick = async () => {
      await signOut(auth);
      accessToken = null;
      currentUser = null;
      cachedSubFolderId = null;
      fbOutput.textContent = "—";
      driveOutput.textContent = "—";
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        loginBtn.disabled  = true;
        logoutBtn.disabled = false;
        if (!statusEl.textContent.startsWith("Signed in")) {
          statusEl.textContent = `Signed in: ${user.displayName || user.email}`;
        }
        enableAppButtons(true);
      } else {
        loginBtn.disabled  = false;
        logoutBtn.disabled = true;
        statusEl.textContent = "Not signed in";
        enableAppButtons(false);
      }
    });

    // ============================================================
    // FIRESTORE TEST  (no per-user paths — single shared collection)
    // ============================================================
    fbWriteBtn.onclick = async () => {
      try {
        fbOutput.textContent = "Writing...";
        const docRef = await addDoc(collection(db, FIRESTORE_COLLECTION), {
          message: "Test entry from HTML page",
          createdAt: serverTimestamp(),
          testNumber: Math.floor(Math.random() * 10000)
        });
        log(fbOutput, `✅ Document written with ID: ${docRef.id}`);
      } catch (err) {
        log(fbOutput, "❌ Write failed: " + err.message, true);
        console.error(err);
      }
    };

    fbReadBtn.onclick = async () => {
      try {
        fbOutput.textContent = "Reading...";
        const snap = await getDocs(collection(db, FIRESTORE_COLLECTION));
        const rows = [];
        snap.forEach(d => rows.push({ id: d.id, ...d.data() }));
        log(fbOutput, `✅ Read ${rows.length} document(s):\n\n` + JSON.stringify(rows, null, 2));
      } catch (err) {
        log(fbOutput, "❌ Read failed: " + err.message, true);
        console.error(err);
      }
    };

    // ============================================================
    // GOOGLE DRIVE TEST
    // ============================================================
    async function driveFetch(url, options = {}) {
      if (!accessToken) throw new Error("No access token. Please sign in again.");
      const headers = Object.assign(
        { "Authorization": "Bearer " + accessToken },
        options.headers || {}
      );
      const res = await fetch(url, { ...options, headers });
      if (!res.ok) {
        const text = await res.text();
        throw new Error(`Drive API ${res.status}: ${text}`);
      }
      return res.json();
    }

    // Find (or create) the Test1 subfolder under the parent folder
    async function getOrCreateSubFolder() {
      if (cachedSubFolderId) return cachedSubFolderId;

      // 1. Search for existing subfolder
      const q = encodeURIComponent(
        `'${DRIVE_PARENT_FOLDER_ID}' in parents ` +
        `and name='${DRIVE_SUB_FOLDER_NAME}' ` +
        `and mimeType='application/vnd.google-apps.folder' ` +
        `and trashed=false`
      );
      const search = await driveFetch(
        `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&key=${DRIVE_API_KEY}`
      );

      if (search.files && search.files.length > 0) {
        cachedSubFolderId = search.files[0].id;
        return cachedSubFolderId;
      }

      // 2. Create it if not found
      const created = await driveFetch(
        `https://www.googleapis.com/drive/v3/files?fields=id,name&key=${DRIVE_API_KEY}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: DRIVE_SUB_FOLDER_NAME,
            mimeType: "application/vnd.google-apps.folder",
            parents: [DRIVE_PARENT_FOLDER_ID]
          })
        }
      );
      cachedSubFolderId = created.id;
      return cachedSubFolderId;
    }

    driveListBtn.onclick = async () => {
      try {
        driveOutput.textContent = "Locating sub folder...";
        const folderId = await getOrCreateSubFolder();

        driveOutput.textContent = "Listing files...";
        const q = encodeURIComponent(`'${folderId}' in parents and trashed=false`);
        const data = await driveFetch(
          `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,mimeType,size,createdTime)&key=${DRIVE_API_KEY}`
        );

        log(
          driveOutput,
          `✅ Sub Folder ID: ${folderId}\n` +
          `✅ Files found: ${(data.files || []).length}\n\n` +
          JSON.stringify(data.files || [], null, 2)
        );
      } catch (err) {
        log(driveOutput, "❌ List failed: " + err.message, true);
        console.error(err);
      }
    };

    driveUploadInput.onchange = () => {
      driveUploadBtn.disabled = !driveUploadInput.files.length;
    };

    driveUploadBtn.onclick = async () => {
      const file = driveUploadInput.files[0];
      if (!file) return;

      try {
        driveOutput.textContent = "Preparing upload...";
        const folderId = await getOrCreateSubFolder();

        // Multipart upload (metadata + file)
        const metadata = {
          name: file.name,
          parents: [folderId]
        };

        const boundary = "-------314159265358979323846";
        const delimiter = "\r\n--" + boundary + "\r\n";
        const closeDelim = "\r\n--" + boundary + "--";

        const reader = new FileReader();
        const fileBytes = await new Promise((resolve, reject) => {
          reader.onload = () => resolve(new Uint8Array(reader.result));
          reader.onerror = reject;
          reader.readAsArrayBuffer(file);
        });

        const body =
          delimiter +
          "Content-Type: application/json; charset=UTF-8\r\n\r\n" +
          JSON.stringify(metadata) +
          delimiter +
          "Content-Type: " + (file.type || "application/octet-stream") + "\r\n\r\n";

        // Build Blob parts (text + binary)
        const parts = [
          new Blob([body], { type: "text/plain" }),
          new Blob([fileBytes], { type: file.type || "application/octet-stream" }),
          new Blob([closeDelim], { type: "text/plain" })
        ];
        const blob = new Blob(parts);

        driveOutput.textContent = "Uploading...";
        const res = await fetch(
          `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size&key=${DRIVE_API_KEY}`,
          {
            method: "POST",
            headers: {
              "Authorization": "Bearer " + accessToken,
              "Content-Type": "multipart/related; boundary=" + boundary
            },
            body: blob
          }
        );

        if (!res.ok) {
          const text = await res.text();
          throw new Error(`Upload ${res.status}: ${text}`);
        }

        const data = await res.json();
        log(
          driveOutput,
          `✅ Uploaded to sub folder "${DRIVE_SUB_FOLDER_NAME}"\n` +
          `Folder ID: ${folderId}\n\n` +
          JSON.stringify(data, null, 2)
        );
      } catch (err) {
        log(driveOutput, "❌ Upload failed: " + err.message, true);
        console.error(err);
      }
    };
  </script>
</body>
</html>
