<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drive + Picker Test — Naye Credentials</title>

<script>
  /* ============================================================
     NAYE CREDENTIALS — mywebapps-drive-511900
     ============================================================ */
  const DRIVE_CONFIG = {
    oauthClientId:  "103334413601-4msa4v80kgdir5k6c9kjj4m17h4f9djr.apps.googleusercontent.com",
    apiKey:         "AIzaSyCzCtOAOk5mrh1WYw98f-IeqkhSzUyAY9s",
    parentFolderId: "1LFkmK8l6dB6HtFlcApI0TW2jgp7cGEGT",
    folderName:     "MyWebApps Attachments",
    subFolderName:  "Test1",
    scope:          "https://www.googleapis.com/auth/drive.file",
    appId:          "103334413601"
  };

  window._accessToken  = null;
  window._tokenClient  = null;
  window._subFolderId  = null;
  window._currentFileId = null;
  window._currentMime   = null;
</script>

<script src="https://apis.google.com/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
  body { font-family: Arial; max-width: 900px; margin: 20px auto; padding: 0 12px; color:#222; }
  fieldset { margin-bottom: 14px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; }
  legend { font-weight: bold; padding: 0 6px; }
  button { padding: 6px 12px; margin: 4px 2px; cursor: pointer; }
  input[type=text], input[type=file], textarea { padding: 6px; margin: 3px 0; width: 100%; box-sizing: border-box; }
  pre { background: #f4f4f4; padding: 8px; border: 1px solid #ddd; white-space: pre-wrap; font-size: 13px; max-height: 240px; overflow: auto; }
  .ok { color: green; font-weight: bold; }
  .fail { color: red; font-weight: bold; }
  .file-row { padding: 6px; border-bottom: 1px solid #eee; }
</style>
</head>
<body>

<h2>Drive + Picker Test — Naye Credentials</h2>
<p><b>Project:</b> mywebapps-drive-511900 &nbsp;|&nbsp; <b>App ID:</b> 103334413601</p>

<!-- ================= STATUS ================= -->
<fieldset>
  <legend>1. Status</legend>
  <div id="statusBox">Checking…</div>
  <button id="authBtn">🔐 Authorize Google Drive</button>
  <button id="recheckBtn">🔄 Re-check</button>
</fieldset>

<!-- ================= UPLOAD ================= -->
<fieldset>
  <legend>2. Upload File</legend>
  <input type="file" id="fileInput">
  <button id="uploadBtn">⬆ Upload</button>
  <pre id="uploadOut">-</pre>
</fieldset>

<!-- ================= CREATE ================= -->
<fieldset>
  <legend>3. Create New File</legend>
  <input type="text" id="createName" placeholder="NewFile.txt">
  <textarea id="createContent" placeholder="Initial content (optional)" style="height:60px;"></textarea>
  <button id="createBtn">➕ Create</button>
  <pre id="createOut">-</pre>
</fieldset>

<!-- ================= LIST ================= -->
<fieldset>
  <legend>4. List Files</legend>
  <button id="listBtn">🔄 Refresh List</button>
  <div id="fileList" style="border:1px solid #ddd; padding:8px; margin-top:6px; min-height:60px; background:#fafafa;">
    <i>No files loaded.</i>
  </div>
</fieldset>

<!-- ================= EDIT ================= -->
<fieldset>
  <legend>5. Open / Edit / Rename / Delete</legend>
  <div id="editBox" style="display:none;">
    <b>Editing:</b> <span id="editName">—</span>
    <input type="text" id="editNewName" placeholder="New name">
    <textarea id="editContent" style="height:140px; font-family:monospace;"></textarea>
    <button id="saveContentBtn">💾 Save Content</button>
    <button id="renameBtn">✏ Rename</button>
    <button id="deleteBtn" style="color:#b00;">🗑 Delete (Trash)</button>
  </div>
  <pre id="editOut">-</pre>
</fieldset>

<!-- ================= TRASH ================= -->
<fieldset>
  <legend>6. Trash</legend>
  <button id="listTrashBtn">📂 List Trashed</button>
  <div id="trashList" style="border:1px solid #ddd; padding:8px; margin-top:6px; background:#fff5f5;">
    <i>No trash loaded.</i>
  </div>
</fieldset>

<!-- ================= PICKER ================= -->
<fieldset>
  <legend>7. Google Picker</legend>
  <button id="pickerBtn">📁 Open Picker</button>
  <pre id="pickerOut">-</pre>
</fieldset>

<script>
  const $ = id => document.getElementById(id);
  const log = (id, m) => $(id).textContent = (typeof m === "string") ? m : JSON.stringify(m, null, 2);
  const esc = s => (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  /* ---------- gapi init ---------- */
  function waitGapi(max=6000) {
    return new Promise(r => {
      const t = Date.now();
      (function c() {
        if (typeof gapi !== "undefined" && typeof gapi.client !== "undefined") return r(true);
        if (Date.now() - t > max) return r(false);
        setTimeout(c, 150);
      })();
    });
  }

  async function initGapi() {
    if (typeof gapi === "undefined") return false;
    await new Promise(r => gapi.load("client", r));
    if (!(await waitGapi())) return false;
    try {
      await gapi.client.init({
        apiKey: DRIVE_CONFIG.apiKey,
        discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"]
      });
      return true;
    } catch (e) {
      console.error("gapi.client.init error:", e);
      return false;
    }
  }

  /* ---------- token ---------- */
  function initToken() {
    if (typeof google === "undefined" || !google.accounts || !google.accounts.oauth2) {
      return setTimeout(initToken, 300);
    }
    window._tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: DRIVE_CONFIG.oauthClientId,
      scope: DRIVE_CONFIG.scope,
      callback: (r) => {
        if (r.access_token) {
          window._accessToken = r.access_token;
          gapi.client.setToken({ access_token: r.access_token });
        }
      }
    });
  }
  initToken();

  function ensureToken() {
    return new Promise((res, rej) => {
      if (window._accessToken) return res();
      if (!window._tokenClient) return rej(new Error("Token client not ready"));
      const old = window._tokenClient.callback;
      window._tokenClient.callback = (r) => { old(r); res(); };
      window._tokenClient.requestAccessToken({ prompt: "consent" });
    });
  }

  /* ---------- subfolder ---------- */
  async function subFolder() {
    if (window._subFolderId) return window._subFolderId;
    const q = `'${DRIVE_CONFIG.parentFolderId}' in parents and name='${DRIVE_CONFIG.subFolderName}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
    const l = await gapi.client.drive.files.list({ q, fields: "files(id)" });
    if (l.result.files && l.result.files.length) {
      window._subFolderId = l.result.files[0].id;
      return window._subFolderId;
    }
    const c = await gapi.client.drive.files.create({
      resource: {
        name: DRIVE_CONFIG.subFolderName,
        mimeType: "application/vnd.google-apps.folder",
        parents: [DRIVE_CONFIG.parentFolderId]
      },
      fields: "id"
    });
    window._subFolderId = c.result.id;
    return window._subFolderId;
  }

  /* ---------- status ---------- */
  function updateStatus() {
    const gapiOk = typeof gapi !== "undefined" && typeof gapi.client !== "undefined";
    const gsiOk  = typeof google !== "undefined" && google.accounts && google.accounts.oauth2;
    let html = "";
    html += gapiOk ? '<div class="ok">✔ gapi.client loaded</div>' : '<div class="fail">✘ gapi.client missing</div>';
    html += gsiOk  ? '<div class="ok">✔ GSI OAuth2 loaded</div>' : '<div class="fail">✘ GSI OAuth2 missing</div>';
    html += window._accessToken ? '<div class="ok">✔ Access token acquired</div>' : '<div class="fail">✘ No access token — Authorize dabayein</div>';
    html += window._subFolderId ? '<div class="ok">✔ Subfolder: ' + window._subFolderId + '</div>' : '<div>⚠ Subfolder not resolved yet</div>';
    $("statusBox").innerHTML = html;
  }

  /* ---------- upload ---------- */
  async function upload() {
    const fi = $("fileInput");
    if (!fi || !fi.files || fi.files.length === 0) return alert("Choose a file first.");
    try {
      await ensureToken();
      const sid = await subFolder();
      const file = fi.files[0];
      const form = new FormData();
      form.append("metadata", new Blob([JSON.stringify({ name: file.name, parents: [sid] })], { type: "application/json" }));
      form.append("file", file);
      const res = await fetch(
        "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name",
        { method: "POST", headers: { Authorization: "Bearer " + window._accessToken }, body: form }
      );
      const data = await res.json();
      if (data.error) return log("uploadOut", "Error: " + JSON.stringify(data.error));
      log("uploadOut", "Uploaded: " + data.name + " (ID: " + data.id + ")");
      fi.value = "";
      updateStatus();
    } catch (e) { log("uploadOut", "Error: " + e.message); }
  }

  /* ---------- create ---------- */
  async function createNew() {
    const name = $("createName").value.trim();
    if (!name) return alert("File name required.");
    try {
      await ensureToken();
      const sid = await subFolder();
      const content = $("createContent").value || "";
      const form = new FormData();
      form.append("metadata", new Blob([JSON.stringify({ name, parents: [sid], mimeType: "text/plain" })], { type: "application/json" }));
      form.append("file", new Blob([content], { type: "text/plain" }));
      const res = await fetch(
        "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name",
        { method: "POST", headers: { Authorization: "Bearer " + window._accessToken }, body: form }
      );
      const data = await res.json();
      if (data.error) return log("createOut", "Error: " + JSON.stringify(data.error));
      log("createOut", "Created: " + data.name + " (ID: " + data.id + ")");
    } catch (e) { log("createOut", "Error: " + e.message); }
  }

  /* ---------- list ---------- */
  async function refreshList() {
    try {
      await ensureToken();
      const sid = await subFolder();
      const res = await gapi.client.drive.files.list({
        q: `'${sid}' in parents and trashed=false`,
        fields: "files(id,name,mimeType,webViewLink)",
        orderBy: "modifiedTime desc"
      });
      const files = res.result.files || [];
      const box = $("fileList");
      if (!files.length) { box.innerHTML = "<i>Folder is empty.</i>"; return; }
      box.innerHTML = files.map(f => `
        <div class="file-row">
          <b>${esc(f.name)}</b><br>
          <small>${f.id}</small><br>
          <button data-id="${f.id}" data-n="${esc(f.name)}" data-m="${f.mimeType}">Open</button>
          <a href="${f.webViewLink}" target="_blank">View</a>
        </div>`).join("");
      box.querySelectorAll("button[data-id]").forEach(b => {
        b.onclick = () => openFile(b.dataset.id, b.dataset.n, b.dataset.m);
      });
      log("uploadOut", files.length + " files loaded.");
      updateStatus();
    } catch (e) { log("uploadOut", "Error: " + e.message); }
  }

  /* ---------- open / edit ---------- */
  async function openFile(id, name, mime) {
    window._currentFileId = id;
    window._currentMime = mime;
    $("editBox").style.display = "block";
    $("editName").textContent = name;
    $("editNewName").value = name;
    $("editContent").value = "(loading…)";
    try {
      await ensureToken();
      const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,
        { headers: { Authorization: "Bearer " + window._accessToken } });
      $("editContent").value = await r.text();
      log("editOut", "Loaded: " + name);
    } catch (e) { log("editOut", "Error: " + e.message); }
  }

  async function saveContent() {
    if (!window._currentFileId) return;
    try {
      await ensureToken();
      const r = await fetch(
        `https://www.googleapis.com/upload/drive/v3/files/${window._currentFileId}?uploadType=media`,
        { method: "PATCH",
          headers: { Authorization: "Bearer " + window._accessToken, "Content-Type": window._currentMime || "text/plain" },
          body: $("editContent").value });
      const d = await r.json();
      if (d.error) return log("editOut", "Error: " + JSON.stringify(d.error));
      log("editOut", "Content saved.");
    } catch (e) { log("editOut", "Error: " + e.message); }
  }

  async function renameFile() {
    if (!window._currentFileId) return;
    const nn = $("editNewName").value.trim();
    if (!nn) return alert("Enter new name.");
    try {
      await ensureToken();
      const r = await fetch(`https://www.googleapis.com/drive/v3/files/${window._currentFileId}`,
        { method: "PATCH",
          headers: { Authorization: "Bearer " + window._accessToken, "Content-Type": "application/json" },
          body: JSON.stringify({ name: nn }) });
      const d = await r.json();
      if (d.error) return log("editOut", "Error: " + JSON.stringify(d.error));
      log("editOut", "Renamed to: " + d.name);
      refreshList();
    } catch (e) { log("editOut", "Error: " + e.message); }
  }

  async function deleteFile() {
    if (!window._currentFileId) return;
    if (!confirm("Move to Trash?")) return;
    try {
      await ensureToken();
      await fetch(`https://www.googleapis.com/drive/v3/files/${window._currentFileId}`,
        { method: "DELETE", headers: { Authorization: "Bearer " + window._accessToken } });
      log("editOut", "Moved to Trash.");
      $("editBox").style.display = "none";
      window._currentFileId = null;
      refreshList();
    } catch (e) { log("editOut", "Error: " + e.message); }
  }

  /* ---------- trash ---------- */
  async function listTrash() {
    try {
      await ensureToken();
      const sid = await subFolder();
      const r = await gapi.client.drive.files.list({
        q: `'${sid}' in parents and trashed=true`, fields: "files(id,name)" });
      const files = r.result.files || [];
      const box = $("trashList");
      if (!files.length) { box.innerHTML = "<i>Trash is empty.</i>"; return; }
      box.innerHTML = files.map(f => `
        <div><b>${esc(f.name)}</b> <small>(${f.id})</small>
        <button data-r="${f.id}">Restore</button></div>`).join("");
      box.querySelectorAll("button[data-r]").forEach(b => {
        b.onclick = () => restoreFile(b.dataset.r);
      });
    } catch (e) { log("editOut", "Error: " + e.message); }
  }

  async function restoreFile(id) {
    try {
      await ensureToken();
      const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}`,
        { method: "PATCH",
          headers: { Authorization: "Bearer " + window._accessToken, "Content-Type": "application/json" },
          body: JSON.stringify({ trashed: false }) });
      const d = await r.json();
      if (d.error) return log("editOut", "Error: " + JSON.stringify(d.error));
      log("editOut", "Restored: " + id);
      listTrash();
      refreshList();
    } catch (e) { log("editOut", "Error: " + e.message); }
  }

  /* ---------- picker ---------- */
  function openPicker() {
    try {
      if (!window._accessToken) return alert("Authorize first.");
      gapi.load("picker", {
        callback: () => {
          if (!window.google || !window.google.picker) {
            return log("pickerOut", "Picker library not loaded.");
          }
          const view = new google.picker.DocsView(google.picker.ViewId.DOCS)
            .setIncludeFolders(true)
            .setSelectFolderEnabled(false);
          const picker = new google.picker.PickerBuilder()
            .addView(view)
            .setOAuthToken(window._accessToken)
            .setDeveloperKey(DRIVE_CONFIG.apiKey)
            .setAppId(DRIVE_CONFIG.appId)
            .setCallback((data) => {
              if (data.action === google.picker.Action.PICKED) {
                const f = data.docs[0];
                log("pickerOut", "Picked: " + f.name + "\nID: " + f.id);
              } else if (data.action === google.picker.Action.CANCEL) {
                log("pickerOut", "Picker cancelled.");
              }
            })
            .build();
          picker.setVisible(true);
          log("pickerOut", "Picker opened.");
        },
        onerror: () => log("pickerOut", "Picker load error. Picker API enabled hai?")
      });
    } catch (e) {
      log("pickerOut", "Error: " + e.message);
    }
  }

  /* ---------- bind ---------- */
  document.addEventListener("DOMContentLoaded", () => {
    $("authBtn").onclick = () => {
      if (!window._tokenClient) return alert("Token client not ready. Refresh.");
      window._tokenClient.requestAccessToken({ prompt: "consent" });
    };
    $("recheckBtn").onclick = updateStatus;
    $("uploadBtn").onclick = upload;
    $("createBtn").onclick = createNew;
    $("listBtn").onclick = refreshList;
    $("saveContentBtn").onclick = saveContent;
    $("renameBtn").onclick = renameFile;
    $("deleteBtn").onclick = deleteFile;
    $("listTrashBtn").onclick = listTrash;
    $("pickerBtn").onclick = openPicker;

    initGapi().then(updateStatus);
    setTimeout(updateStatus, 1000);
  });
</script>

</body>
</html>
