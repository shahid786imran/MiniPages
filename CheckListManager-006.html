<head>

<meta name="theme-color" content="#2fa79b"><title>Nested Checklist Manager</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<style>
:root{--bg:#f4f6fb;--panel:#fff;--text:#202638;--muted:#778096;--line:#e5e9f2;--accent:#5267d9;--accent2:#e9edff;--danger:#d94343;--green:#21865b;--shadow:0 8px 28px #26345b12}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#eef2ff,#e6f7f5 60%,#f4f6fb);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial;min-height:100vh}
body.dark{--bg:#141824;--panel:#1d2433;--text:#eef1fa;--muted:#a1abc0;--line:#30394c;--accent:#91a0ff;--accent2:#303958;--shadow:0 8px 28px #0003;background:#141824}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:8px 12px;background:var(--accent);color:#fff;font-weight:600}
button.secondary{background:var(--accent2);color:var(--text)}
button.ghost{background:rgba(255,255,255,.6);color:var(--text);border:1px solid rgba(255,255,255,.8)}
body.dark button.ghost{background:#232b3c;border-color:#30394c}
button.danger{background:#ffe8e8;color:#a82020}
.hidden{display:none!important}
.app{max-width:1100px;margin:auto;padding:14px}

.glassbar{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:10px;
  background:linear-gradient(135deg,rgba(82,103,217,.28),rgba(47,167,155,.22));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.55);border-radius:14px;
  box-shadow:0 8px 24px rgba(82,103,217,.18),inset 0 1px 0 rgba(255,255,255,.6)}
.brandline{display:flex;align-items:center;gap:9px;min-width:0;flex-wrap:nowrap;overflow:hidden}
.logo{width:34px;height:34px;flex:none;border-radius:4px;background:linear-gradient(135deg,#2fa79b,#1f7f7a);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;box-shadow:0 3px 10px #1f7f7a55}
.brand{font-size:18px;font-weight:800;white-space:nowrap;color:var(--text)}
.brand span{color:#3b4fc4}
.divider{color:rgba(120,128,150,.5)}
.status{font-size:12px;color:#1a7a52;white-space:nowrap;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.status.offline{color:var(--danger)}
.pageTitle{font-size:14px;font-weight:700;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding:8px 10px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);border-radius:12px;backdrop-filter:blur(8px)}
body.dark .toolbar{background:#1d2433;border-color:#30394c}
.toolbar button{padding:8px 11px;font-size:16px}

.layout{display:grid;grid-template-columns:230px 1fr;gap:14px}
.sidebar,.main{background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.8);border-radius:14px;box-shadow:var(--shadow);padding:12px}
body.dark .sidebar,body.dark .main{background:#1d2433;border-color:#30394c}
.nav{width:100%;display:flex;gap:8px;margin:2px 0;background:transparent;color:var(--text);text-align:left;border:0;padding:8px;border-radius:9px;font-weight:400;font-size:14px}
.nav.active{background:var(--accent2);color:var(--accent);font-weight:600}
.sechead{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:12px 5px 5px}
.typebtn{width:100%;display:flex;justify-content:space-between;align-items:center;margin:2px 0;background:transparent;color:var(--text);border:1px solid var(--line);padding:7px 9px;border-radius:9px;font-weight:400;font-size:13px;text-align:left}
.typebtn:hover{background:var(--accent2)}
.typebtn.active{background:var(--accent2);color:var(--accent);border-color:var(--accent)}
.count{font-size:10px;background:var(--accent2);color:var(--accent);border-radius:20px;padding:2px 6px}

.sideFilters{margin-top:6px}
.sideFilters .field{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px 9px;width:100%;font-size:12px;margin:3px 0;min-width:0}

.mainhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.muted{color:var(--muted);font-size:12px}

.item{border:1px solid var(--line);border-radius:11px;margin:6px 0;background:var(--panel);overflow:hidden}
.itemline{display:flex;align-items:center;gap:8px;padding:8px 10px;min-width:0}
.itemline:hover{background:var(--accent2)}
.check{width:16px;height:16px;accent-color:var(--accent);flex:none}
.row{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px;white-space:nowrap;overflow:hidden}
.title{font-weight:500;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.title.done{text-decoration:line-through;color:var(--muted)}
.desc{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.desc.done{text-decoration:line-through}
.meta{font-size:10px;color:var(--muted);flex:none;white-space:nowrap}
.plus{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:2px 6px;font-size:13px;flex:none}
.plus:hover{background:var(--accent2);color:var(--accent)}
.iconbtn{background:transparent;color:var(--muted);padding:3px 5px;font-size:13px;border-radius:6px}
.iconbtn:hover{background:var(--accent2);color:var(--accent)}
.children{padding:0 0 4px 18px}
.children.collapsed{display:none}
.progress{height:5px;background:var(--line);border-radius:10px;overflow:hidden;margin:0 10px 6px 34px}
.progress i{display:block;height:100%;background:var(--accent)}
.tag{font-size:9px;padding:1px 4px;border-radius:4px;background:var(--accent2);color:var(--accent);margin-left:3px;display:inline-block}
.overdue{color:var(--danger)!important;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:24px}

.modal{position:fixed;inset:0;background:#11182788;display:flex;align-items:center;justify-content:center;padding:14px;z-index:60}
.modal-card{width:min(620px,100%);max-height:92vh;overflow:auto;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.modal-card h3{margin:0 0 12px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formgrid label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.formgrid .wide{grid-column:1/-1}
.actions{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;margin-top:15px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.choicebtn{background:var(--accent2);color:var(--text);padding:12px 16px;border-radius:10px;font-weight:600}

.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13px}
.switch{position:relative;width:40px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#cfd5e6;border-radius:20px;transition:.2s;cursor:pointer}
.slider:before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .slider{background:var(--accent)}
.switch input:checked + .slider:before{transform:translateX(18px)}
.switch input:disabled + .slider{opacity:.55;cursor:not-allowed}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
.stat{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.stat strong{font-size:22px;display:block}
.split{display:flex;gap:7px;flex-wrap:wrap}
.smalltext{font-size:12px;color:var(--muted)}

.overlay{position:fixed;inset:0;background:#11182766;z-index:50;opacity:0;pointer-events:none;transition:.2s}
.overlay.show{opacity:1;pointer-events:auto}

@media(max-width:760px){
  body{font-size:12px}
  .app{padding:10px}
  .glassbar{padding:7px 9px;border-radius:10px;gap:6px}
  .logo{width:26px;height:26px;font-size:14px}
  .brand{font-size:14px}
  .status{font-size:10px}
  .pageTitle{font-size:11px}
  .toolbar{padding:6px 7px;gap:4px;margin-bottom:10px}
  .toolbar button{padding:6px 8px;font-size:14px}
  button{padding:6px 9px;font-size:11px;border-radius:8px}
  .layout{grid-template-columns:1fr;gap:10px}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:230px;max-width:85%;border-radius:0 12px 12px 0;z-index:55;transform:translateX(-105%);transition:transform .25s ease;overflow-y:auto;background:var(--panel)}
  .sidebar.open{transform:translateX(0)}
  .nav{font-size:12px;padding:7px}
  .typebtn{font-size:11px;padding:6px 8px}
  .title{max-width:50%}
  .desc{font-size:10px}
  .meta{font-size:9px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .formgrid{grid-template-columns:1fr}
  .formgrid .wide{grid-column:auto}
  .modal-card{padding:14px}
}
</style></head><body>

<div id="app" class="app hidden">
  <header class="glassbar">
    <div class="brandline">
      <div class="logo">☑</div>
      <div class="brand">Nested <span>Checklist</span></div>
      <span class="divider">|</span>
      <div class="pageTitle" id="headerTitle">Tree View</div>
      <span class="divider">|</span>
      <div class="status" id="sync">● Firebase: connecting…</div>
    </div>
  </header>

  <div class="toolbar">
    <button id="addRoot" title="Add">＋</button>
    <button class="secondary" id="undoBtn" title="Undo">↶</button>
    <button class="secondary" id="redoBtn" title="Redo">↷</button>
    <button class="secondary" id="editModeBtn" title="Edit Mode">✎</button>
    <button class="ghost" id="themeBtn" title="Theme">◐</button>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <button class="nav active" data-view="tree">🌳 Tree View</button>
      <button class="nav" data-view="dashboard">▦ Dashboard</button>
      <button class="nav" data-view="all">☷ All Tasks</button>
      <button class="nav" data-view="completed">✓ Completed</button>
      <button class="nav" data-view="overdue">⚠ Overdue</button>
      <button class="nav" data-view="favorites">⭐ Favorites</button>
      <button class="nav" data-view="pinned">📌 Pinned</button>
      <button class="nav" data-view="calendar">▦ Calendar</button>
      <button class="nav" data-view="trash">🗑 Recycle Bin</button>
      <button class="nav" data-view="settings">⚙ Settings</button>

      <div id="filters" class="sideFilters">
        <div class="sechead">Filters</div>
        <input id="search" class="field" placeholder="Search…">
        <select id="filterStatus" class="field"><option value="all">All status</option><option value="pending">Pending</option><option value="completed">Completed</option><option value="overdue">Overdue</option></select>
        <select id="filterPriority" class="field"><option value="all">All priority</option><option>Urgent</option><option>High</option><option>Medium</option><option>Low</option></select>
        <select id="sort" class="field"><option value="manual">Manual order</option><option value="az">Name A–Z</option><option value="za">Name Z–A</option><option value="priority">Priority</option><option value="due">Due date</option><option value="created">Created date</option><option value="updated">Last updated</option></select>
      </div>

      <div class="sechead">Types</div>
      <div id="typesList"></div>
    </aside>

    <main class="main">
      <div class="mainhead">
        <div class="toolbar" style="margin:0;padding:0;background:none;border:0">
          <button id="addChecklist" class="secondary">＋ Checklist</button>
          <button id="addTask">＋ Task</button>
          <button id="quickAdd" class="secondary">⚡ Quick Add</button>
        </div>
      </div>
      <div id="content"></div>
    </main>
  </div>
</div>

<div id="modal" class="modal hidden"><div class="modal-card"><h3 id="modalTitle">Add item</h3><div id="modalBody"></div><div class="actions"><button class="ghost" id="cancelModal">Cancel</button><button id="saveModal">Save</button></div></div></div>
<div id="confirmModal" class="modal hidden"><div class="modal-card"><h3 id="confirmTitle">Confirm</h3><p id="confirmMsg" class="muted"></p><div class="actions"><button class="ghost" id="confirmNo">Cancel</button><button id="confirmYes">OK</button></div></div></div>
<div id="choiceModal" class="modal hidden"><div class="modal-card"><h3 id="choiceTitle">Choose</h3><div class="btnrow" id="choiceBtns"></div><div class="actions"><button class="ghost" id="choiceCancel">Cancel</button></div></div></div>
<div class="overlay" id="overlay"></div>

<script>
const firebaseConfig={apiKey:"AIzaSyAFiJNThb3TJsqiPLIcqk20XU9ag59wdOs",authDomain:"mywebapps-e3b63.firebaseapp.com",projectId:"mywebapps-e3b63",storageBucket:"mywebapps-e3b63.firebasestorage.app",messagingSenderId:"46681415809",appId:"1:46681415809:web:c4528b9da97abc310a2d80",measurementId:"G-72NM0QDE46"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();
const DOC=db.collection('Check List Manager').doc('NestedChecklistApp');
const $=id=>document.getElementById(id);
const now=()=>new Date().toISOString(),uidGen=()=>crypto.randomUUID?crypto.randomUUID():('id'+Date.now()+Math.random().toString(16).slice(2));

let uid=null;
let data={items:[],trash:[],settings:{
  theme:'light',retention:30,dateFormat:'DD-MMM-YYYY',timeFormat:'12h',
  categories:[],tags:[],customTypes:['Shopping','Maintenance','Reminder','Event','General'],
  display:{checkbox:true,description:true,progress:true,count:true,due:true,priority:true,overdue:true,timeSpent:true,tags:true,progressbar:true,addbtn:true}
}};
let view='tree',editing=null,parentForAdd=null,addKind='task',undoStack=[],redoStack=[],saveTimer=null,remoteReady=false,editMode=false,currentType='';

function find(idv){let out=null;walk(data.items,x=>{if(x.id===idv)out=x});return out||(data.trash||[]).find(x=>x.id===idv)}
function walk(list,fn){list.forEach(x=>{fn(x);walk(x.children||[],fn)})}
function countTasks(x){let n=x.type==='task'?1:0;(x.children||[]).forEach(c=>n+=countTasks(c));return n}
function doneTasks(x){let n=x.type==='task'&&x.completed?1:0;(x.children||[]).forEach(c=>n+=doneTasks(c));return n}
function pct(x){let n=countTasks(x);return n?Math.round(doneTasks(x)/n*100):0}
function updateParents(list){list.forEach(x=>{updateParents(x.children||[]);if(x.type==='checklist'){let tasks=countTasks(x);x.completed=tasks>0&&doneTasks(x)===tasks}})}
function dateText(v){if(!v)return '';let d=new Date(v);if(isNaN(d))return '';return d.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})}
function isOverdue(x){return x.type==='task'&&!x.completed&&x.due&&new Date(x.due)<new Date()}
function fmtTime(sec){let h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return(h?h+'h ':'')+m+'m'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function split(s){return s.split(',').map(x=>x.trim()).filter(Boolean)}
function locate(list,idv,parent=null){for(let i=0;i<list.length;i++){if(list[i].id===idv)return{list,index:i,item:list[i],parent};let r=locate(list[i].children||[],idv,list[i]);if(r)return r}return null}
function parentPath(idv){let path=[];function rec(list){for(let x of list){if(x.id===idv){path.push(x.name);return true}if(rec(x.children||[])){path.unshift(x.name);return true}}return false}rec(data.items);return path.join(' > ')}
function collect(pred){let out=[];walk(data.items,x=>{if(pred(x))out.push(x)});return out}

function snapshot(){undoStack.push(JSON.stringify(data));if(undoStack.length>40)undoStack.shift();redoStack=[];updateUndoButtons()}
function updateUndoButtons(){$('undoBtn').disabled=!undoStack.length;$('redoBtn').disabled=!redoStack.length}
function changed(){scheduleSave();render()}
function scheduleSave(){try{localStorage.setItem('nestedChecklistCache',JSON.stringify(data))}catch(e){};$('sync').textContent=navigator.onLine?'● syncing…':'● Offline: saved on device';$('sync').className='status'+(navigator.onLine?'':' offline');clearTimeout(saveTimer);saveTimer=setTimeout(saveRemote,650)}
async function saveRemote(){if(!uid||!navigator.onLine)return;try{await DOC.set({owner:uid,appData:data,updatedAt:now()},{merge:true});$('sync').textContent='● synced';$('sync').className='status'}catch(e){$('sync').textContent='● Sync pending';$('sync').className='status offline'}}

function customConfirm(title,msg,cb){$('confirmTitle').textContent=title;$('confirmMsg').textContent=msg;$('confirmModal').classList.remove('hidden');$('confirmYes').onclick=()=>{$('confirmModal').classList.add('hidden');cb(true)};$('confirmNo').onclick=()=>{$('confirmModal').classList.add('hidden');cb(false)}}
function customChoice(title,options,cb){$('choiceTitle').textContent=title;let box=$('choiceBtns');box.innerHTML='';options.forEach(o=>{let b=document.createElement('button');b.className='choicebtn';b.textContent=o.label;b.onclick=()=>{$('choiceModal').classList.add('hidden');cb(o.value)};box.appendChild(b)});$('choiceModal').classList.remove('hidden');$('choiceCancel').onclick=()=>$('choiceModal').classList.add('hidden')}

function applyTheme(){document.body.classList.toggle('dark',data.settings.theme==='dark')}

function itemForm(item,parentId,kind){
  editing=item?item.id:null;parentForAdd=parentId||null;addKind=item?item.type:kind;
  $('modalTitle').textContent=item?'Edit '+item.type:'Add '+kind;
  let types=(data.settings.customTypes||[]);
  $('modalBody').innerHTML=`<div class="formgrid">
    <div class="wide"><label>Name *</label><input id="fName" class="field" maxlength="250" value="${esc(item?.name||'')}"></div>
    <div class="wide"><label>Description</label><textarea id="fDesc" class="field" rows="3">${esc(item?.description||'')}</textarea></div>
    <div><label>Priority</label><select id="fPriority" class="field"><option value="">None</option>${['Low','Medium','High','Urgent'].map(p=>`<option ${item?.priority===p?'selected':''}>${p}</option>`).join('')}</select></div>
    <div><label>Due date & time</label><input id="fDue" class="field" type="datetime-local" value="${item?.due?new Date(item.due).toISOString().slice(0,16):''}"></div>
    <div><label>Categories</label><input id="fCats" class="field" value="${esc((item?.categories||[]).join(', '))}" placeholder="comma separated"></div>
    <div><label>Tags</label><input id="fTags" class="field" value="${esc((item?.tags||[]).join(', '))}" placeholder="comma separated"></div>
    <div><label>Type</label><select id="fType" class="field"><option value="">None</option>${types.map(t=>`<option ${item?.customType===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
    <div><label>Icon</label><input id="fIcon" class="field" maxlength="8" value="${esc(item?.icon||(item?.type==='checklist'?'📁':'☑'))}"></div>
    <div><label>Color</label><input id="fColor" class="field" type="color" value="${item?.color||'#5267d9'}"></div>
    <div><label>Recurrence</label><select id="fRepeat" class="field"><option value="">None</option>${['Daily','Weekly','Monthly','Yearly','Custom'].map(p=>`<option ${item?.recurrence===p?'selected':''}>${p}</option>`).join('')}</select></div>
  </div>`;
  $('modal').classList.remove('hidden');
  $('saveModal').onclick=saveItem;
}

function saveItem(){
  let name=$('fName').value.trim();if(!name){$('fName').focus();return}
  let item=editing?find(editing):null;snapshot();let t=now();
  let fields={name,description:$('fDesc').value,priority:$('fPriority').value,due:$('fDue').value?new Date($('fDue').value).toISOString():'',categories:split($('fCats').value),tags:split($('fTags').value),customType:$('fType').value,icon:$('fIcon').value||'☑',color:$('fColor').value,recurrence:$('fRepeat').value,updatedAt:t};
  if(item){Object.assign(item,fields)}
  else{let fresh=Object.assign({id:uidGen(),type:addKind,createdAt:t,completed:false,history:[],comments:[],children:[],favorite:false,pinned:false,hidden:false,archived:false,deletedAt:null,timeSpent:0,timerRunning:false,dependencies:[]},fields);let p=parentForAdd?find(parentForAdd):null;(p?p.children:data.items).push(fresh)}
  updateParents(data.items);$('modal').classList.add('hidden');changed();
}

function setComplete(item,val){snapshot();item.completed=val;item.updatedAt=now();item.history=item.history||[];item.history.push({status:val?'Completed':'Uncompleted',at:now()});updateParents(data.items);changed()}
function removeItem(idv){let r=locate(data.items,idv);if(!r)return;snapshot();r.item.deletedAt=now();r.item.updatedAt=now();r.list.splice(r.index,1);data.trash=data.trash||[];data.trash.push(r.item);changed()}
function restoreItem(idv){let i=(data.trash||[]).findIndex(x=>x.id===idv);if(i<0)return;snapshot();let x=data.trash.splice(i,1)[0];x.deletedAt=null;data.items.push(x);changed()}
function moveItem(idv,dir){let r=locate(data.items,idv);if(!r)return;let j=r.index+dir;if(j<0||j>=r.list.length)return;snapshot();[r.list[r.index],r.list[j]]=[r.list[j],r.list[r.index]];changed()}
function toggleFlag(idv,key){let x=find(idv);if(!x)return;snapshot();x[key]=!x[key];x.updatedAt=now();changed()}

function itemMatches(x){
  let q=$('search').value.toLowerCase().trim(),st=$('filterStatus').value,pr=$('filterPriority').value;
  if(q&&!(`${x.name} ${x.description||''} ${(x.tags||[]).join(' ')} ${(x.categories||[]).join(' ')}`.toLowerCase().includes(q)))return false;
  if(st==='pending'&&x.completed)return false;
  if(st==='completed'&&!x.completed)return false;
  if(st==='overdue'&&!isOverdue(x))return false;
  if(pr!=='all'&&x.priority!==pr)return false;
  if(currentType&&x.customType!==currentType)return false;
  return true;
}
function sortList(list){let mode=$('sort').value;return [...list].sort((a,b)=>{if(a.pinned!==b.pinned)return a.pinned?-1:1;if(mode==='az')return a.name.localeCompare(b.name);if(mode==='za')return b.name.localeCompare(a.name);if(mode==='priority')return ['Urgent','High','Medium','Low',''].indexOf(a.priority)-['Urgent','High','Medium','Low',''].indexOf(b.priority);if(mode==='due')return (a.due||'9999').localeCompare(b.due||'9999');if(mode==='created')return (b.createdAt||'').localeCompare(a.createdAt||'');if(mode==='updated')return (b.updatedAt||'').localeCompare(a.updatedAt||'');return 0})}

function itemMeta(x,progress){
  const d=data.settings.display;let parts=[];
  if(x.type==='checklist'){if(d.progress||d.count){let p=[];if(d.progress)p.push(progress+'%');if(d.count)p.push(doneTasks(x)+'/'+countTasks(x));parts.push(p.join(' · '))}}
  if(d.due&&x.due)parts.push('Due: '+dateText(x.due));
  if(d.priority&&x.priority)parts.push(x.priority);
  if(d.overdue&&isOverdue(x))parts.push('<span class="overdue">OVERDUE</span>');
  if(d.timeSpent&&x.timeSpent)parts.push('⏱ '+fmtTime(x.timeSpent));
  return parts.join(' · ');
}
function itemTags(x){const d=data.settings.display;let s='';if(d.tags){(x.categories||[]).forEach(t=>s+=`<i class="tag">${esc(t)}</i>`);(x.tags||[]).forEach(t=>s+=`<i class="tag">#${esc(t)}</i>`);}return s}
function renderItem(x,depth){
  const d=data.settings.display;let progress=pct(x);
  let meta=itemMeta(x,progress),tags=itemTags(x);
  let chk=(x.type==='task'&&d.checkbox)?`<input class="check" type="checkbox" data-act="complete" data-id="${x.id}" ${x.completed?'checked':''}>`:'';
  let icon=x.type==='checklist'?'📁':'';
  let editBtns=editMode?`<button class="iconbtn" data-act="favorite" data-id="${x.id}">${x.favorite?'⭐':'☆'}</button><button class="iconbtn" data-act="pin" data-id="${x.id}">${x.pinned?'📌':'⌖'}</button><button class="iconbtn" data-act="edit" data-id="${x.id}">✎</button><button class="iconbtn" data-act="up" data-id="${x.id}">↑</button><button class="iconbtn" data-act="down" data-id="${x.id}">↓</button><button class="iconbtn" data-act="hide" data-id="${x.id}">◉</button><button class="iconbtn" data-act="delete" data-id="${x.id}">🗑</button>`:'';
  let plusBtn=d.addbtn?`<button class="plus" data-act="child" data-id="${x.id}">＋</button>`:'';
  let collapsible=x.type==='checklist'||(x.children&&x.children.length);
  let toggle=collapsible?`<button class="iconbtn" data-act="collapse" data-id="${x.id}">${x.collapsed?'▸':'▾'}</button>`:'<span style="width:18px;display:inline-block"></span>';
  let desc=(d.description&&x.description)?`<span class="desc ${x.completed?'done':''}">${esc(x.description)}</span>`:'';
  return `<div class="item" data-id="${x.id}"><div class="itemline">${toggle}${chk}${icon?`<span>${icon}</span>`:''}<div class="row"><span class="title ${x.completed?'done':''}">${esc(x.icon||'')} ${esc(x.name)}</span>${desc}${meta?`<span class="meta">${meta}</span>`:''}${tags}</div>${plusBtn}${editBtns}</div>${(d.progressbar&&x.type==='checklist')?`<div class="progress"><i style="width:${progress}%"></i></div>`:''}<div class="children ${x.collapsed?'collapsed':''}">${(x.children||[]).map(c=>renderItem(c,depth+1)).join('')}</div></div>`;
}
function renderTree(list){return sortList(list.filter(x=>!x.hidden&&!x.archived&&itemMatches(x))).map(x=>renderItem(x,0)).join('')}
function renderFlat(list){return list.map(x=>{const d=data.settings.display;let meta=itemMeta(x,pct(x)),tags=itemTags(x);let desc=(d.description&&x.description)?`<span class="desc ${x.completed?'done':''}">${esc(x.description)}</span>`:'';let editBtns=editMode?`<button class="iconbtn" data-act="edit" data-id="${x.id}">✎</button><button class="iconbtn" data-act="delete" data-id="${x.id}">🗑</button>`:'';return `<div class="item"><div class="itemline">${d.checkbox?`<input class="check" type="checkbox" data-act="complete" data-id="${x.id}" ${x.completed?'checked':''}>`:''}<div class="row"><span class="title ${x.completed?'done':''}">${esc(x.icon||'☑')} ${esc(x.name)}</span>${desc}${meta?`<span class="meta">${meta}</span>`:''}${tags}</div>${editBtns}</div></div>`}).join('')}

function renderDashboard(){
  let tasks=collect(x=>x.type==='task'),completed=tasks.filter(x=>x.completed),over=tasks.filter(isOverdue),upcoming=tasks.filter(x=>x.due&&new Date(x.due)>new Date()&&!x.completed);
  return `<div class="stats"><div class="stat"><span class="muted">Total</span><strong>${tasks.length}</strong></div><div class="stat"><span class="muted">Completed</span><strong>${completed.length}</strong></div><div class="stat"><span class="muted">Pending</span><strong>${tasks.length-completed.length}</strong></div><div class="stat"><span class="muted">Overdue</span><strong class="overdue">${over.length}</strong></div></div><h3>Main Checklist Progress</h3>${data.items.filter(x=>x.type==='checklist').map(x=>`<div class="item" style="padding:10px"><b>${esc(x.name)}</b><span style="float:right">${pct(x)}%</span><div class="progress"><i style="width:${pct(x)}%"></i></div></div>`).join('')||'<div class="empty">No main checklists yet.</div>'}<h3>Today's Tasks</h3>${renderFlat(tasks.filter(x=>x.due&&new Date(x.due).toDateString()===new Date().toDateString()))||'<div class="empty">None today.</div>'}<h3>Upcoming</h3>${renderFlat(upcoming.slice(0,5))||'<div class="empty">None upcoming.</div>'}`;
}
function renderTrash(){if(!data.trash||!data.trash.length)return '<div class="empty">Recycle Bin is empty.</div>';return data.trash.map(x=>`<div class="item"><div class="itemline"><div class="row"><span class="title">${esc(x.name)}</span><span class="meta">${parentPath(x.id)||'(root)'} · Deleted: ${dateText(x.deletedAt)}</span></div><button data-act="restore" data-id="${x.id}">Restore</button><button class="danger" data-act="purge" data-id="${x.id}">Delete forever</button></div></div>`).join('')}
function renderSettings(){
  const d=data.settings.display;
  const sw=(key,label,disabled)=>`<div class="setrow"><span>${label}</span><label class="switch"><input type="checkbox" data-disp="${key}" ${d[key]?'checked':''} ${disabled?'disabled':''}><span class="slider"></span></label></div>`;
  return `<div class="card" style="padding:14px"><h3>Settings</h3>
    <label>Theme</label><select id="settingTheme" class="field"><option value="light" ${data.settings.theme==='light'?'selected':''}>Light</option><option value="dark" ${data.settings.theme==='dark'?'selected':''}>Dark</option></select>
    <br><br><label>Recycle Bin retention (days, 0 = forever)</label><input id="retention" class="field" type="number" min="0" value="${data.settings.retention??30}">
    <br><br><label>Date format</label><select id="dateFormat" class="field"><option ${data.settings.dateFormat==='DD-MMM-YYYY'?'selected':''}>DD-MMM-YYYY</option><option ${data.settings.dateFormat==='MM/DD/YYYY'?'selected':''}>MM/DD/YYYY</option><option ${data.settings.dateFormat==='YYYY-MM-DD'?'selected':''}>YYYY-MM-DD</option></select>
    <br><br><label>Time format</label><select id="timeFormat" class="field"><option value="12h" ${data.settings.timeFormat==='12h'?'selected':''}>12-hour</option><option value="24h" ${data.settings.timeFormat==='24h'?'selected':''}>24-hour</option></select>
    <br><br><label>Categories (comma separated)</label><input id="catManage" class="field" value="${esc((data.settings.categories||[]).join(', '))}">
    <br><br><label>Tags (comma separated)</label><input id="tagManage" class="field" value="${esc((data.settings.tags||[]).join(', '))}">
    <br><br><label>Types (comma separated)</label><input id="typeManage" class="field" value="${esc((data.settings.customTypes||[]).join(', '))}">
    <h3 style="margin-top:16px">Display in each item</h3>
    ${sw('checkbox','Checkbox')}${sw('name','Name (always visible)',true)}${sw('description','Description')}${sw('progress','Progress %')}${sw('count','Tasks count')}${sw('due','Due date')}${sw('priority','Priority')}${sw('overdue','Overdue badge')}${sw('timeSpent','Time spent')}${sw('tags','Tags / Categories')}${sw('progressbar','Progress bar')}${sw('addbtn','＋ Add button')}
    <div class="split" style="margin-top:14px"><button id="exportJson" class="secondary">JSON Backup</button><button id="exportExcel" class="secondary">Excel Export</button><button id="exportPdf" class="secondary">Print / PDF</button><button id="deleteAll" class="danger">Delete All Data</button></div>
  </div>`;
}
function renderCalendar(){return `<div class="card" style="padding:14px"><h3>Calendar</h3><div id="calWrap"></div></div>`}
function drawCalendar(){let m=new Date().toISOString().slice(0,7);let y=+m.slice(0,4),mo=+m.slice(5,7)-1;let list=collect(x=>x.type==='task'&&x.due&&x.due.slice(0,7)===m);let first=new Date(y,mo,1),start=first.getDay(),days=new Date(y,mo+1,0).getDate();let cells=[];let today=new Date().toDateString();for(let i=0;i<start;i++)cells.push('<div></div>');for(let d=1;d<=days;d++){let ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;let evs=list.filter(x=>x.due.slice(0,10)===ds);let isT=new Date(y,mo,d).toDateString()===today;cells.push(`<div style="border:1px solid var(--line);border-radius:8px;padding:4px;min-height:46px;font-size:11px;${isT?'border-color:var(--accent)':''}"><b>${d}</b>${evs.map(x=>`<div style="background:var(--accent2);color:var(--accent);border-radius:4px;padding:1px 3px;margin:1px 0;font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.name)}</div>`).join('')}</div>`)}let wk=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(w=>`<div style="font-weight:600;font-size:10px;text-align:center">${w}</div>`).join('');let wrap=$('calWrap');if(wrap)wrap.innerHTML=`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">${wk}${cells.join('')}</div>`}

function render(){
  applyTheme();
  let titles={tree:'Tree View',dashboard:'Dashboard',all:'All Tasks',completed:'Completed',overdue:'Overdue',favorites:'Favorites',pinned:'Pinned',calendar:'Calendar',trash:'Recycle Bin',settings:'Settings'};
  $('headerTitle').textContent=titles[view]||'Tree View';
  $('filters').classList.toggle('hidden',['dashboard','calendar','settings','trash'].includes(view));
  $('addChecklist').classList.toggle('hidden',view!=='tree');
  $('addTask').classList.toggle('hidden',view!=='tree');
  $('editModeBtn').classList.toggle('secondary',editMode);
  renderTypes();
  let html='';
  if(view==='tree')html=renderTree(data.items)||'<div class="empty">یہاں ابھی کوئی آئٹم موجود نہیں۔ ＋ بٹن سے نیا Checklist یا Task بنائیں۔</div>';
  else if(view==='dashboard')html=renderDashboard();
  else if(view==='trash')html=renderTrash();
  else if(view==='settings')html=renderSettings();
  else if(view==='calendar')html=renderCalendar();
  else{let list=collect(x=>x.type==='task'&&(view==='all'||(view==='completed'&&x.completed)||(view==='overdue'&&isOverdue(x))||(view==='favorites'&&x.favorite)||(view==='pinned'&&x.pinned)));list=list.filter(itemMatches);html=renderFlat(list)||'<div class="empty">کوئی آئٹم نہیں۔</div>'}
  $('content').innerHTML=html;
  if(view==='calendar')drawCalendar();
}
function renderTypes(){let types=data.settings.customTypes||[];let counts={};collect(x=>x.type==='task').forEach(x=>{if(x.customType)counts[x.customType]=(counts[x.customType]||0)+1});$('typesList').innerHTML=types.map(t=>`<button class="typebtn ${currentType===t?'active':''}" data-type="${esc(t)}">${esc(t)} <span class="count">${counts[t]||0}</span></button>`).join('')}

$('content').addEventListener('click',e=>{
  let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act,idv=b.dataset.id,x=find(idv);
  if(a==='collapse'){x.collapsed=!x.collapsed;render()}
  if(a==='child'){customChoice('Add inside this item',[{label:'Checklist',value:'checklist'},{label:'Task',value:'task'}],v=>itemForm(null,idv,v))}
  if(a==='edit')itemForm(x,null,x.type);
  if(a==='favorite')toggleFlag(idv,'favorite');
  if(a==='pin')toggleFlag(idv,'pinned');
  if(a==='hide'){snapshot();x.hidden=!x.hidden;changed()}
  if(a==='delete')customConfirm('Move to Recycle Bin','Yeh item recycle bin mein chala jayega?',ok=>{if(ok)removeItem(idv)});
  if(a==='up')moveItem(idv,-1);
  if(a==='down')moveItem(idv,1);
  if(a==='restore')restoreItem(idv);
  if(a==='purge')customConfirm('Delete forever','Yeh item hamesha ke liye delete ho jayega?',ok=>{if(ok){data.trash=data.trash.filter(t=>t.id!==idv);changed()}});
});
$('content').addEventListener('change',e=>{
  let el=e.target;
  if(el.dataset.act==='complete'){let x=find(el.dataset.id);if(x)setComplete(x,el.checked)}
  if(el.dataset.disp){data.settings.display[el.dataset.disp]=el.checked;changed()}
  if(el.id==='settingTheme'){data.settings.theme=el.value;changed()}
  if(el.id==='retention'){data.settings.retention=Number(el.value)||0;changed()}
  if(el.id==='dateFormat'){data.settings.dateFormat=el.value;changed()}
  if(el.id==='timeFormat'){data.settings.timeFormat=el.value;changed()}
  if(el.id==='catManage'){data.settings.categories=split(el.value);changed()}
  if(el.id==='tagManage'){data.settings.tags=split(el.value);changed()}
  if(el.id==='typeManage'){data.settings.customTypes=split(el.value);changed()}
});
$('content').addEventListener('click',e=>{
  let b=e.target.closest('button');if(!b)return;
  if(b.id==='exportJson')download('nested-checklist-backup.json',JSON.stringify(data,null,2),'application/json');
  if(b.id==='exportExcel'){let rows=[];walk(data.items,x=>rows.push({ID:x.id,Type:x.type,Name:x.name,Description:x.description,Completed:x.completed,Priority:x.priority,Due:x.due,Categories:(x.categories||[]).join(', '),Tags:(x.tags||[]).join(', '),Created:x.createdAt,Updated:x.updatedAt,Path:parentPath(x.id)}));let ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Tasks');XLSX.writeFile(wb,'NestedChecklist.xlsx')}
  if(b.id==='exportPdf')window.print();
  if(b.id==='deleteAll')customConfirm('Delete ALL data','Sab kuch hamesha ke liye delete ho jayega. Pakka?',ok=>{if(ok){snapshot();data.items=[];data.trash=[];changed()}});
});
$('typesList').addEventListener('click',e=>{let b=e.target.closest('[data-type]');if(!b)return;currentType=(currentType===b.dataset.type)?'':b.dataset.type;if(currentType){view='all';document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'))}render()});

$('addRoot').onclick=()=>customChoice('Add new item',[{label:'Checklist',value:'checklist'},{label:'Task',value:'task'}],v=>itemForm(null,null,v));
$('addChecklist').onclick=()=>itemForm(null,null,'checklist');
$('addTask').onclick=()=>itemForm(null,null,'task');
$('quickAdd').onclick=()=>customQuickAdd();
$('cancelModal').onclick=()=>$('modal').classList.add('hidden');
$('editModeBtn').onclick=()=>{editMode=!editMode;render()};
$('themeBtn').onclick=()=>{data.settings.theme=data.settings.theme==='dark'?'light':'dark';changed()};
$('undoBtn').onclick=()=>{if(!undoStack.length)return;redoStack.push(JSON.stringify(data));data=JSON.parse(undoStack.pop());scheduleSave();render();updateUndoButtons()};
$('redoBtn').onclick=()=>{if(!redoStack.length)return;undoStack.push(JSON.stringify(data));data=JSON.parse(redoStack.pop());scheduleSave();render();updateUndoButtons()};
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{view=b.dataset.view;currentType='';document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n===b));render()});
$('search').oninput=render;$('filterStatus').onchange=render;$('filterPriority').onchange=render;$('sort').onchange=render;

function customQuickAdd(){
  $('modalTitle').textContent='Quick Add';
  $('modalBody').innerHTML=`<div class="formgrid"><div class="wide"><label>Type a line (e.g. "Buy milk tomorrow at 5 PM high priority")</label><input id="qText" class="field" placeholder="..."></div></div>`;
  $('modal').classList.remove('hidden');
  $('saveModal').onclick=()=>{
    let s=$('qText').value.trim();if(!s)return;
    let priority='',due='';
    let pm=s.match(/(urgent|high|medium|low)\s*priority/i);if(pm)priority=pm[1][0].toUpperCase()+pm[1].slice(1).toLowerCase();
    let dm=s.match(/(\d{4}-\d{2}-\d{2})/);if(dm)due=dm[1];
    let tm=s.match(/(\d{1,2})\s*(am|pm)/i);
    if(tm){let h=+tm[1];if(/pm/i.test(tm[2])&&h<12)h+=12;if(/am/i.test(tm[2])&&h===12)h=0;let base=due?new Date(due+'T00:00'):new Date();base.setHours(h,0,0,0);due=base.toISOString()}
    if(/tomorrow/i.test(s)){let d=new Date();d.setDate(d.getDate()+1);due=d.toISOString()}
    let clean=s.replace(/(urgent|high|medium|low)\s*priority/i,'').replace(/\d{4}-\d{2}-\d{2}/,'').replace(/\d{1,2}\s*(am|pm)/i,'').replace(/\btomorrow\b/i,'').trim();
    snapshot();let t=now();
    let fresh={id:uidGen(),type:'task',name:clean,description:'',priority,due,categories:[],tags:[],customType:'',icon:'☑',color:'#5267d9',recurrence:'',createdAt:t,updatedAt:t,completed:false,history:[],comments:[],children:[],favorite:false,pinned:false,hidden:false,archived:false,deletedAt:null,timeSpent:0,timerRunning:false,dependencies:[]};
    data.items.push(fresh);updateParents(data.items);$('modal').classList.add('hidden');changed();
  };
}

/* ===== ANONYMOUS AUTH ===== */
function startAnonymous(){
  auth.signInAnonymously().then(()=>{}).catch(e=>{
    $('app').classList.remove('hidden');
    $('sync').textContent='● Login error: '+e.message;
    $('sync').className='status offline';
    render();
  });
}
auth.onAuthStateChanged(async user=>{
  if(!user){uid=null;startAnonymous();return}
  uid=user.uid;$('app').classList.remove('hidden');
  try{
    let doc=await DOC.get();
    if(doc.exists&&doc.data().owner===uid&&doc.data().appData){data=doc.data().appData}
    else{let c=localStorage.getItem('nestedChecklistCache');if(c)data=JSON.parse(c);await saveRemote()}
    if(!data.settings.display)data.settings.display={checkbox:true,description:true,progress:true,count:true,due:true,priority:true,overdue:true,timeSpent:true,tags:true,progressbar:true,addbtn:true};
    remoteReady=true;$('sync').textContent='● synced';$('sync').className='status';
  }catch(e){
    let c=localStorage.getItem('nestedChecklistCache');if(c)data=JSON.parse(c);
    $('sync').textContent='● Offline';$('sync').className='status offline';
  }
  render();
});
window.addEventListener('online',saveRemote);
window.addEventListener('offline',()=>{$('sync').textContent='● Offline: saved on device';$('sync').className='status offline'});

/* Sidebar swipe + bahar click */
const sidebar=$('sidebar'),overlay=$('overlay');
function openSidebar(){sidebar.classList.add('open');overlay.classList.add('show')}
function closeSidebar(){sidebar.classList.remove('open');overlay.classList.remove('show')}
overlay.onclick=closeSidebar;
let tx=0,ty=0,tracking=false;
document.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return;
  const t=e.touches[0];tx=t.clientX;ty=t.clientY;tracking=true;
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!tracking)return;const t=e.touches[0];const dx=t.clientX-tx,dy=Math.abs(t.clientY-ty);
  if(dy>60){tracking=false;return;}
  if(dx>60&&!sidebar.classList.contains('open')){openSidebar();tracking=false;}
},{passive:true});
document.addEventListener('touchend',()=>{tracking=false});
let sx=0,sy=0;
sidebar.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
sidebar.addEventListener('touchend',e=>{const t=e.changedTouches[0];const dx=t.clientX-sx,dy=Math.abs(t.clientY-sy);if(dx<-50&&dy<60)closeSidebar();},{passive:true});

function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}

startAnonymous();
