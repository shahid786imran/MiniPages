<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b4fc4"><title>Nested Checklist Manager</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--text:#202638;--muted:#778096;--line:#e5e9f2;--accent:#5267d9;--accent2:#e9edff;--danger:#d94343;--green:#21865b;--shadow:0 8px 28px #26345b12}
*{box-sizing:border-box}
body{margin:0;background:#eef2fb;color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial;min-height:100vh;overflow-x:hidden}
body.dark{--bg:#141824;--panel:#1d2433;--text:#eef1fa;--muted:#a1abc0;--line:#30394c;--accent:#91a0ff;--accent2:#303958;--shadow:0 8px 28px #0003;background:#141824}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:8px 12px;background:var(--accent);color:#fff;font-weight:600}
button.secondary{background:var(--accent2);color:var(--text)}
button.ghost{background:rgba(255,255,255,.6);color:var(--text);border:1px solid rgba(255,255,255,.8)}
body.dark button.ghost{background:#232b3c;border-color:#30394c}
button.danger{background:#ffe8e8;color:#a82020}
.hidden{display:none!important}
.app{max-width:1100px;margin:auto;padding:14px}

/* HEADER */
.glassbar{display:flex;align-items:center;gap:8px;padding:6px 10px;margin-bottom:10px;
  background:linear-gradient(135deg,#3b4fc4,#1f7f7a);
  border:1px solid #2a3a99;border-radius:10px;
  box-shadow:0 4px 12px rgba(59,79,196,.28)}
.brandline{display:flex;align-items:center;gap:7px;min-width:0;flex-wrap:nowrap;overflow:hidden;flex:1}
.logo{width:26px;height:26px;flex:none;border-radius:4px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px}
.brand{font-size:14px;font-weight:800;white-space:nowrap;color:#fff}
.brand span{color:#c8d2ff}
.divider{color:rgba(255,255,255,.35)}
.status{font-size:10px;color:#b6f0d0;white-space:nowrap;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.status.offline{color:#ffb4b4}
.pageTitle{font-size:11px;font-weight:700;color:#e6ebff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.layout{display:grid;grid-template-columns:230px 1fr;gap:14px;align-items:start}
.sidebar,.main{background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.8);border-radius:14px;box-shadow:var(--shadow);padding:10px}
body.dark .sidebar,body.dark .main{background:#1d2433;border-color:#30394c}
.sidebar{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto}
.main{min-height:0}

/* SIDEBAR grouped cards, bari padding */
.s5group{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.sechead{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:2px 6px 8px;font-weight:600}
.nav{width:100%;display:flex;gap:10px;align-items:center;margin:4px 0;background:transparent;color:var(--text);text-align:left;border:0;padding:12px 14px;border-radius:9px;font-weight:400;font-size:14px}
.nav:hover{background:rgba(82,103,217,.06)}
.nav.active{background:var(--accent2);color:var(--accent);font-weight:600}
.field{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px 12px;width:100%;font-size:13px;margin:2px 0;min-width:0}

.listWrap{background:#fff;border:1px solid #dde3f5;border-radius:12px;padding:6px}
body.dark .listWrap{background:#1d2433;border-color:#30394c}
.item{border:1px solid #e5e9f2;border-radius:8px;margin:3px 0;overflow:hidden;background:#fff}
body.dark .item{background:#232b3c;border-color:#30394c}
.task .line{background:#e8edff;padding:4px 8px}
body.dark .task .line{background:#2a3350}
.checklist .line{background:#e6f7ee;padding:4px 8px}
body.dark .checklist .line{background:#1f3a2d}
.lineTop{display:flex;gap:5px;align-items:center;font-weight:600;font-size:13px;flex-wrap:wrap}
.name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name.done{text-decoration:line-through;color:var(--muted)}
.plus{background:#fff;border:1px solid #c5cdf0;color:#5267d9;border-radius:5px;padding:0 5px;font-weight:700;font-size:12px;line-height:18px;flex:none}
.plus.cl{border-color:#a9d9c2;color:#21865b}
body.dark .plus{background:#232b3c;border-color:#3a4a6a}
.editBtn{background:transparent;color:var(--muted);border:0;padding:2px 5px;font-size:13px;border-radius:5px;flex:none}
.editBtn:hover{background:var(--accent2);color:var(--accent)}
.children{padding:2px 0 2px 12px;background:#fbfcff}
body.dark .children{background:#1a2130}
.children.collapsed{display:none}
.check{width:14px;height:14px;accent-color:var(--accent);flex:none}
.progressLine{margin-top:3px}
.progress{height:4px;background:#d6dcf0;border-radius:10px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.doneChecklist{background:#e3e6ee;border-top:2px solid #b9c0d0;padding:4px 8px;margin:3px 0;border-radius:6px;font-size:13px;color:#778096;text-decoration:line-through}
.inlineInput{display:flex;gap:6px;padding:3px 8px 5px 8px}
.inlineInput input{flex:1;border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:12px;min-width:0;background:var(--panel);color:var(--text)}
.toggle{background:transparent;border:0;color:var(--muted);font-size:12px;cursor:pointer;padding:1px 3px;flex:none}
.muted{color:var(--muted);font-size:12px}
.empty{text-align:center;color:var(--muted);padding:20px}
.pageFoot{text-align:center;font-size:11px;color:var(--muted);padding:14px 0 6px}
.clearFilterBar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.clearFilterBar button{background:var(--accent2);color:var(--accent);padding:5px 10px;font-size:12px;border-radius:7px}

.modal{position:fixed;inset:0;background:#11182788;display:flex;align-items:center;justify-content:center;padding:14px;z-index:60}
.modal-card{width:min(620px,100%);max-height:92vh;overflow:auto;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.modal-card h3{margin:0 0 12px}

/* SETTINGS modal — bottom sheet style, 70% width, single border, no horiz scroll */
#settingsWrap{position:fixed;inset:0;background:#11182788;z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:0}
.settingsModal{background:var(--panel);border-radius:16px 16px 0 0;box-shadow:0 -8px 28px #26345b33;
  width:70%;max-width:70%;max-height:80vh;display:flex;flex-direction:column;
  border:1px solid var(--line);border-bottom:0}
.settingsModal .head{background:linear-gradient(135deg,#5267d9,#2fa79b);color:#fff;padding:14px 18px;font-weight:700;font-size:15px;flex:none;display:flex;justify-content:space-between;align-items:center;border-radius:15px 15px 0 0}
.settingsModal .head button{background:rgba(255,255,255,.25);border:0;color:#fff;border-radius:8px;padding:4px 10px;font-weight:700}
.settingsModal .body{padding:12px 16px;overflow-y:auto;overflow-x:hidden;flex:1 1 auto;box-sizing:border-box}
.setItem{border:1px solid #d5dbee;border-radius:10px;padding:6px 10px;margin:5px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;background:var(--panel);flex-wrap:nowrap;min-width:0}
body.dark .setItem{border-color:#30394c}
.setItem:first-child{margin-top:0}
.setItem:last-child{margin-bottom:0}
.setItem span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.exportRow{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.miniBtn{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:5px 10px;font-weight:600;font-size:12px;white-space:nowrap}
.stepper{display:inline-flex;align-items:center;gap:4px;flex:none}
.stepper button{background:var(--accent2);color:var(--text);border:0;border-radius:6px;width:24px;height:24px;font-weight:700;font-size:14px;padding:0}
.stepper span{min-width:26px;text-align:center;font-weight:600;font-size:13px}
.switch{position:relative;width:38px;height:20px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#cfd5e6;border-radius:20px;transition:.2s;cursor:pointer}
.slider:before{content:"";position:absolute;height:14px;width:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .slider{background:var(--accent)}
.switch input:checked + .slider:before{transform:translateX(18px)}

/* toast with decreasing bar */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:#1b2340;color:#fff;padding:10px 16px 8px;border-radius:10px;
  box-shadow:0 8px 24px #0005;display:flex;flex-direction:column;gap:6px;
  font-size:13px;z-index:90;opacity:0;pointer-events:none;transition:.25s;min-width:200px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast .row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.toast button{background:#91a0ff;color:#10152a;border:0;border-radius:7px;padding:5px 10px;font-weight:700;font-size:12px}
.toast .bar{height:4px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
.toast .bar i{display:block;height:100%;background:#91a0ff;width:100%}
.toast .bar.anim i{animation:shrink var(--dur,5s) linear forwards}
@keyframes shrink{from{width:100%}to{width:0%}}

.logBox{max-height:360px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
.logDay{background:var(--accent2);font-weight:700;font-size:12px;color:var(--accent);padding:6px 10px;position:sticky;top:0}
.logRow{display:flex;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;align-items:flex-start}
.logRow:last-child{border-bottom:0}
.logTime{color:var(--muted);flex:none;width:56px;font-size:11px}
.logAct{flex:none;font-weight:700;font-size:10px;padding:1px 6px;border-radius:5px}
.logAct.add{background:#e6f7ee;color:#21865b}
.logAct.edit{background:#fff4e0;color:#a07a1a}
.logAct.remove{background:#ffe8e8;color:#a82020}
.logText{flex:1;min-width:0}

.overlay{position:fixed;inset:0;background:#11182766;z-index:50;opacity:0;pointer-events:none;transition:.2s}
.overlay.show{opacity:1;pointer-events:auto}

@media(max-width:760px){
  body{font-size:12px}
  .app{padding:8px}
  .glassbar{padding:5px 8px;border-radius:8px;gap:5px}
  .logo{width:22px;height:22px;font-size:12px}
  .brand{font-size:12px}
  .status{font-size:9px}
  .pageTitle{font-size:9px}
  .layout{grid-template-columns:1fr;gap:8px}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:250px;max-width:88%;border-radius:0 12px 12px 0;z-index:55;transform:translateX(-105%);transition:transform .25s ease;overflow-y:auto;background:var(--panel);max-height:100vh}
  .sidebar.open{transform:translateX(0)}
  .settingsModal{width:94%;max-width:94%;max-height:85vh}
  .lineTop{font-size:12px}
}
</style></head><body>

<div id="app" class="app hidden">
  <header class="glassbar">
    <div class="brandline">
      <div class="logo">☑</div>
      <div class="brand">Nested <span>Checklist</span></div>
      <span class="divider">|</span>
      <div class="pageTitle" id="headerTitle">My Lists</div>
      <span class="divider">|</span>
      <div class="status" id="sync">● syncing…</div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="s5group">
        <div class="sechead">Menu</div>
        <button class="nav active" data-view="home">🏠 Home</button>
        <button class="nav" data-view="favorites">⭐ Favorites</button>
        <button class="nav" data-view="pinned">📌 Pinned</button>
        <button class="nav" data-view="trash">🗑 Recycle Bin</button>
        <button class="nav" data-view="settings">⚙ Settings</button>
      </div>
      <div class="s5group">
        <div class="sechead">Search</div>
        <input id="search" class="field" placeholder="Search…">
      </div>
    </aside>

    <main class="main">
      <div id="clearFilterWrap"></div>
      <div id="content"></div>
    </main>
  </div>

  <div class="pageFoot" id="pageFoot">Page Creation date: 03-Nov-2026</div>
</div>

<div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"><h3 id="modalTitle">Title</h3><div id="modalBody"></div><div class="actions" id="modalActions"><button class="ghost" id="cancelModal">Cancel</button><button id="saveModal">Save</button></div></div></div>
<div id="confirmModal" class="modal hidden"><div class="modal-card"><h3 id="confirmTitle">Confirm</h3><p id="confirmMsg" class="muted"></p><div class="actions"><button class="ghost" id="confirmNo">Cancel</button><button id="confirmYes">OK</button></div></div></div>
<div id="settingsWrap" class="hidden"></div>
<div class="overlay" id="overlay"></div>

<div class="toast" id="undoToast">
  <div class="row"><span id="undoMsg">Deleted</span><button id="undoAction">Undo</button></div>
  <div class="bar" id="undoBar"><i></i></div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyAFiJNThb3TJsqiPLIcqk20XU9ag59wdOs",authDomain:"mywebapps-e3b63.firebaseapp.com",projectId:"mywebapps-e3b63",storageBucket:"mywebapps-e3b63.firebasestorage.app",messagingSenderId:"46681415809",appId:"1:46681415809:web:c4528b9da97abc310a2d80",measurementId:"G-72NM0QDE46"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();
const DOC=db.collection('Check List Manager').doc('NestedChecklistApp');
const $=id=>document.getElementById(id);
const now=()=>new Date().toISOString(),uidGen=()=>crypto.randomUUID?crypto.randomUUID():('id'+Date.now()+Math.random().toString(16).slice(2));
const BUILD_DATE=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).replace(/ /g,'-');

let uid=null;
let data={items:[],trash:[],changelog:[],settings:{
  theme:'light',undoSeconds:5,editMode:false,display:{progressbar:true,addbtn:true}
}};
let view='home',activeInput=null,activeType='task';
let undoToastTimer=null,lastUndoSnapshot=null,longPressTimer=null;

$('pageFoot').textContent='Page Creation date: '+BUILD_DATE;

function find(idv){let out=null;walk(data.items,x=>{if(x.id===idv)out=x});return out}
function walk(list,fn){list.forEach(x=>{fn(x);walk(x.children||[],fn)})}
function countTasks(x){let n=x.type==='task'?1:0;(x.children||[]).forEach(c=>n+=countTasks(c));return n}
function doneTasks(x){let n=x.type==='task'&&x.completed?1:0;(x.children||[]).forEach(c=>n+=doneTasks(c));return n}
function pct(x){let n=countTasks(x);return n?Math.round(doneTasks(x)/n*100):0}
function updateParents(list){list.forEach(x=>{updateParents(x.children||[]);if(x.children&&x.children.length){let t=x.children.length,d=x.children.filter(c=>c.completed).length;x.completed=(d===t)}})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function locate(list,idv,parent=null){for(let i=0;i<list.length;i++){if(list[i].id===idv)return{list,index:i,item:list[i],parent};let r=locate(list[i].children||[],idv,list[i]);if(r)return r}return null}
function collect(pred){let out=[];walk(data.items,x=>{if(pred(x))out.push(x)});return out}
function changed(){scheduleSave();render()}
function scheduleSave(){try{localStorage.setItem('nestedChecklistCache',JSON.stringify(data))}catch(e){};$('sync').textContent=navigator.onLine?'● syncing…':'● Offline';$('sync').className='status'+(navigator.onLine?'':' offline');clearTimeout(window._saveTimer);window._saveTimer=setTimeout(saveRemote,650)}
async function saveRemote(){if(!uid||!navigator.onLine)return;try{await DOC.set({owner:uid,appData:data,updatedAt:now()},{merge:true});$('sync').textContent='● synced';$('sync').className='status'}catch(e){$('sync').textContent='● Sync pending';$('sync').className='status offline'}}
function customConfirm(title,msg,cb){$('confirmTitle').textContent=title;$('confirmMsg').textContent=msg;$('confirmModal').classList.remove('hidden');$('confirmYes').onclick=()=>{$('confirmModal').classList.add('hidden');cb(true)};$('confirmNo').onclick=()=>{$('confirmModal').classList.add('hidden');cb(false)}}
function applyTheme(){document.body.classList.toggle('dark',data.settings.theme==='dark')}
function logChange(act,text){data.changelog=data.changelog||[];data.changelog.push({at:now(),act,text});if(data.changelog.length>500)data.changelog.shift();}
function newItem(name,type){let t=now();return{id:uidGen(),type:type||'task',name:name,createdAt:t,updatedAt:t,completed:false,history:[],children:[],favorite:false,pinned:false,hidden:false,archived:false,deletedAt:null}}

/* toast with decreasing bar */
function showToast(msg,secs,onUndo){
  let t=$('undoToast');
  $('undoMsg').textContent=msg;
  let bar=$('undoBar');
  bar.style.setProperty('--dur',secs+'s');
  bar.classList.remove('anim');void bar.offsetWidth;bar.classList.add('anim');
  $('undoAction').style.display=onUndo?'':'none';
  $('undoAction').onclick=()=>{if(onUndo)onUndo();t.classList.remove('show');clearTimeout(undoToastTimer)};
  t.classList.add('show');
  clearTimeout(undoToastTimer);
  undoToastTimer=setTimeout(()=>{t.classList.remove('show');lastUndoSnapshot=null},secs*1000);
}
function showUndoToast(snapshot){lastUndoSnapshot=snapshot;showToast('Item deleted',data.settings.undoSeconds||5,()=>{if(lastUndoSnapshot){data=JSON.parse(lastUndoSnapshot);lastUndoSnapshot=null;changed()}})}

function editBtns(x){if(!data.settings.editMode)return '';return `<button class="editBtn" data-act="editname" data-id="${x.id}" title="Rename">✎</button><button class="editBtn" data-act="togglefav" data-id="${x.id}">${x.favorite?'⭐':'☆'}</button><button class="editBtn" data-act="togglepin" data-id="${x.id}">${x.pinned?'📌':'⌖'}</button><button class="editBtn" data-act="delitem" data-id="${x.id}">🗑</button>`}

function renderItem(x){
  const d=data.settings.display;
  let has=x.children&&x.children.length>0;
  let chk=(x.type==='task')?`<input class="check" type="checkbox" data-act="complete" data-id="${x.id}" ${x.completed?'checked':''}>`:'';
  let toggle=has?`<button class="toggle" data-act="collapse" data-id="${x.id}">${x.collapsed?'▸':'▾'}</button>`:'<span style="width:14px;display:inline-block"></span>';
  let progressLine=(x.type==='task'&&d.progressbar)?`<div class="progressLine"><div class="progress"><i style="width:${pct(x)}%"></i></div></div>`:'';
  let plusTask=(x.type==='task'&&d.addbtn)?`<button class="plus" data-act="plustask" data-id="${x.id}">＋</button>`:'';
  let plusCl=(x.type==='task'&&d.addbtn)?`<button class="plus cl" data-act="pluscl" data-id="${x.id}">＋</button>`:'';
  let kids=(x.children||[]);
  let undone=kids.filter(c=>!c.completed),done=kids.filter(c=>c.completed);
  let undoneHtml=undone.map(c=>renderItem(c)).join('');
  let doneHtml=done.length?done.map(c=>c.type==='checklist'?`<div class="doneChecklist">${esc(c.name)}</div>`:renderItem(c)).join(''):'';
  let childrenHtml=x.type==='checklist'?'':(undoneHtml+doneHtml);
  return `<div class="item ${x.type}"><div class="line"><div class="lineTop">${x.type==='checklist'?'':toggle}${chk}<span class="name ${x.completed?'done':''}">${esc(x.name)}</span>${plusTask}${plusCl}${editBtns(x)}</div>${progressLine}</div>${activeInput===x.id?`<div class="inlineInput"><input id="inp_${x.id}" data-parent="${x.id}" placeholder="Type and press Enter…"></div>`:''}<div class="children ${x.collapsed?'collapsed':''}">${childrenHtml}</div></div>`;
}
function matchSearch(x){let q=$('search').value.toLowerCase().trim();if(!q)return true;return (x.name||'').toLowerCase().includes(q)}
function renderTree(list){return list.filter(x=>!x.hidden&&!x.archived&&matchSearch(x)).map(x=>renderItem(x)).join('')}
function renderFlat(list){return list.map(x=>`<div class="item ${x.type}"><div class="line"><div class="lineTop">${x.type==='task'?`<input class="check" type="checkbox" data-act="complete" data-id="${x.id}" ${x.completed?'checked':''}>`:''}<span class="name ${x.completed?'done':''}">${esc(x.name)}</span>${editBtns(x)}</div></div></div>`).join('')}
function renderTrash(){if(!data.trash||!data.trash.length)return '<div class="empty">Recycle Bin is empty.</div>';return data.trash.map(x=>`<div class="item"><div class="line"><div class="lineTop"><span class="name">${esc(x.name)}</span><button data-act="restore" data-id="${x.id}">Restore</button><button class="danger" data-act="purge" data-id="${x.id}">Delete</button></div></div></div>`).join('')}

function render(){
  applyTheme();
  let titles={home:'My Lists',favorites:'Favorites',pinned:'Pinned',trash:'Recycle Bin',settings:'Settings'};
  $('headerTitle').textContent=titles[view]||'My Lists';
  if(view==='settings'){openSettings();return}
  // clear filter
  let filterActive=($('search').value||'').trim()!=='';
  $('clearFilterWrap').innerHTML=filterActive&&view==='home'?`<div class="clearFilterBar"><span class="muted">Filter active</span><button id="clearFilter">✕ Clear Filter</button></div>`:'';
  let html='';
  if(view==='home')html=`<div class="listWrap">${renderTree(data.items)||'<div class="empty">کوئی آئٹم نہیں۔ نیچے سے swipe up کریں نیا Task بنانے کے لیے۔</div>'}</div>`;
  else if(view==='trash')html=renderTrash();
  else if(view==='favorites'){let list=collect(x=>x.favorite);html=`<div class="listWrap">${renderFlat(list)||'<div class="empty">کوئی favorite نہیں۔</div>'}</div>`}
  else if(view==='pinned'){let list=collect(x=>x.pinned);html=`<div class="listWrap">${renderFlat(list)||'<div class="empty">کوئی pinned نہیں۔</div>'}</div>`}
  $('content').innerHTML=html;
  let cf=$('clearFilter');if(cf)cf.onclick=()=>{$('search').value='';render()};
}

function openSettings(){
  closeSidebar();
  $('settingsWrap').classList.remove('hidden');
  $('settingsWrap').innerHTML=`<div class="settingsModal">
    <div class="head"><span>⚙ Settings</span><button id="closeSettingsTop">✕</button></div>
    <div class="body">
      <div class="setItem"><span>Theme (Dark)</span><label class="switch"><input type="checkbox" data-disp="theme" ${data.settings.theme==='dark'?'checked':''}><span class="slider"></span></label></div>
      <div class="setItem"><span>Progress bar</span><label class="switch"><input type="checkbox" data-disp="progressbar" ${data.settings.display.progressbar?'checked':''}><span class="slider"></span></label></div>
      <div class="setItem"><span>＋ Add buttons</span><label class="switch"><input type="checkbox" data-disp="addbtn" ${data.settings.display.addbtn?'checked':''}><span class="slider"></span></label></div>
      <div class="setItem"><span>Undo toast seconds (1–10)</span><div class="stepper"><button id="undoMinus">−</button><span id="undoVal">${data.settings.undoSeconds||5}</span><button id="undoPlus">+</button></div></div>
      <div class="setItem"><span>Change Log</span><button class="miniBtn" id="viewLog">View</button></div>
      <div class="setItem"><span>Export</span><div class="exportRow"><button class="miniBtn" id="exportJson">JSON</button><button class="miniBtn" id="exportExcel">Excel</button><button class="miniBtn" id="exportPdf">PDF</button></div></div>
      <div id="logBoxWrap"></div>
    </div>
  </div>`;
  let m=$('settingsWrap').querySelector('.settingsModal');
  $('closeSettingsTop').onclick=closeSettings;
  m.querySelectorAll('[data-disp]').forEach(inp=>{
    inp.onchange=()=>{
      let key=inp.dataset.disp;
      if(key==='theme'){data.settings.theme=inp.checked?'dark':'light';applyTheme()}
      else{data.settings.display[key]=inp.checked}
      changed();
    };
  });
  m.querySelector('#undoMinus').onclick=()=>{data.settings.undoSeconds=Math.max(1,(data.settings.undoSeconds||5)-1);m.querySelector('#undoVal').textContent=data.settings.undoSeconds;changed()};
  m.querySelector('#undoPlus').onclick=()=>{data.settings.undoSeconds=Math.min(10,(data.settings.undoSeconds||5)+1);m.querySelector('#undoVal').textContent=data.settings.undoSeconds;changed()};
  m.querySelector('#viewLog').onclick=()=>renderLogBox(m.querySelector('#logBoxWrap'));
  m.querySelector('#exportJson').onclick=()=>download('backup.json',JSON.stringify(data,null,2),'application/json');
  m.querySelector('#exportExcel').onclick=()=>{let rows=[];walk(data.items,x=>rows.push({ID:x.id,Name:x.name,Completed:x.completed}));let ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Tasks');XLSX.writeFile(wb,'Checklist.xlsx')};
  m.querySelector('#exportPdf').onclick=()=>window.print();
}
function closeSettings(){$('settingsWrap').classList.add('hidden');$('settingsWrap').innerHTML='';view='home';document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view==='home'));render()}
function renderLogBox(wrap){
  let logs=(data.changelog||[]).slice().sort((a,b)=>new Date(b.at)-new Date(a.at));
  if(!logs.length){wrap.innerHTML='<div class="logBox"><div class="empty">No changes yet.</div></div>';return}
  let groups={};logs.forEach(c=>{let k=new Date(c.at).toDateString();(groups[k]=groups[k]||[]).push(c)});
  let html='<div class="logBox">';
  Object.keys(groups).forEach(day=>{
    html+=`<div class="logDay">${day}</div>`;
    groups[day].forEach(c=>{
      let t=new Date(c.at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
      html+=`<div class="logRow"><span class="logTime">${t}</span><span class="logAct ${c.act}">${c.act.toUpperCase()}</span><span class="logText">${esc(c.text)}</span></div>`;
    });
  });
  html+='</div>';wrap.innerHTML=html;
}

function startInline(idv,type){activeInput=idv;activeType=type;render();setTimeout(()=>{let i=$('inp_'+idv);if(i)i.focus()},10)}

$('content').addEventListener('click',e=>{
  let b=e.target.closest('[data-act]');if(!b)return;
  let a=b.dataset.act,idv=b.dataset.id,x=find(idv);
  if(a==='collapse'){x.collapsed=!x.collapsed;render()}
  if(a==='plustask'){if(x.type!=='task')return;startInline(idv,'task')}
  if(a==='pluscl'){if(x.type!=='task')return;startInline(idv,'checklist')}
  if(a==='togglefav'){x.favorite=!x.favorite;changed()}
  if(a==='togglepin'){x.pinned=!x.pinned;changed()}
  if(a==='editname'){editName(x)}
  if(a==='delitem'){customConfirm('Delete','Recycle bin mein bhej dein?',ok=>{if(ok)removeItem(idv)})}
  if(a==='restore')restoreItem(idv);
  if(a==='purge'){let snap=JSON.stringify(data);data.trash=data.trash.filter(t=>t.id!==idv);logChange('remove',`"${x?x.name:'item'}" permanently deleted`);changed();showUndoToast(snap)}
});
$('content').addEventListener('change',e=>{
  let el=e.target;
  if(el.dataset.act==='complete'){let x=find(el.dataset.id);if(x)setComplete(x,el.checked)}
});
$('content').addEventListener('keydown',e=>{
  if(e.target.dataset.parent&&e.key==='Enter'){
    let idv=e.target.dataset.parent,val=e.target.value.trim();
    if(val){
      let x=find(idv);if(!x||x.type!=='task')return;
      let ni=newItem(val,activeType);x.children=x.children||[];x.children.push(ni);x.collapsed=false;
      logChange('add',`${activeType==='checklist'?'Checklist':'Task'} "${val}" added under "${x.name}"`);
      activeInput=idv;changed();render();
      setTimeout(()=>{let i=$('inp_'+idv);if(i)i.focus()},10);
    }
  }
});
document.addEventListener('click',e=>{
  if(activeInput){
    let box=e.target.closest('.inlineInput');
    let isPlus=e.target.closest('[data-act="plustask"],[data-act="pluscl"]');
    if(!box&&!isPlus){
      let i=$('inp_'+activeInput);
      if(i&&i.value.trim()){
        let x=find(activeInput);
        if(x&&x.type==='task'){
          let ni=newItem(i.value.trim(),activeType);x.children=x.children||[];x.children.push(ni);x.collapsed=false;
          logChange('add',`${activeType==='checklist'?'Checklist':'Task'} "${ni.name}" added under "${x.name}"`);
          changed();
        }
      }
      activeInput=null;render();
    }
  }
});

/* SWIPE UP to add task */
let swipeStartY=null;
document.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return;
  swipeStartY=e.touches[0].clientY;
},{passive:true});
document.addEventListener('touchend',e=>{
  if(swipeStartY==null)return;
  let dy=swipeStartY-e.changedTouches[0].clientY;
  swipeStartY=null;
  if(dy>80 && !activeInput && !e.target.closest('.modal')&&!e.target.closest('#settingsWrap')){
    openAddTaskModal();
  }
},{passive:true});

function openAddTaskModal(){
  $('modalTitle').textContent='New Task';
  $('modalBody').innerHTML=`<input id="newTaskName" class="field" placeholder="Task name…" style="width:100%">`;
  $('modalCard').classList.remove('settings');$('modalActions').style.display='';$('saveModal').style.display='';$('cancelModal').textContent='Cancel';
  $('modal').classList.remove('hidden');setTimeout(()=>$('newTaskName').focus(),50);
  $('saveModal').onclick=()=>{
    let v=$('newTaskName').value.trim();
    if(v){let ni=newItem(v,'task');data.items.push(ni);logChange('add',`Task "${v}" added`);}
    $('modal').classList.add('hidden');$('modalBody').innerHTML='';changed();
  };
}

/* long press to enter edit mode */
document.addEventListener('touchstart',e=>{
  if(e.target.closest('.item')||e.target.closest('.modal')||e.target.closest('.sidebar')||e.target.closest('.glassbar')||e.target.closest('.toast')||e.target.closest('button')||e.target.closest('input')||e.target.closest('#settingsWrap'))return;
  longPressTimer=setTimeout(()=>{data.settings.editMode=true;changed();if(navigator.vibrate)navigator.vibrate(30)},500);
},{passive:true});
document.addEventListener('touchend',()=>{clearTimeout(longPressTimer)},{passive:true});
document.addEventListener('touchmove',()=>{clearTimeout(longPressTimer)},{passive:true});
document.addEventListener('mousedown',e=>{
  if(e.target.closest('.item')||e.target.closest('.modal')||e.target.closest('.sidebar')||e.target.closest('.glassbar')||e.target.closest('.toast')||e.target.closest('button')||e.target.closest('input')||e.target.closest('#settingsWrap'))return;
  longPressTimer=setTimeout(()=>{data.settings.editMode=true;changed()},500);
});
document.addEventListener('mouseup',()=>{clearTimeout(longPressTimer)});

/* click blank => edit mode off */
document.addEventListener('click',e=>{
  if(!data.settings.editMode)return;
  if(e.target.closest('.item')||e.target.closest('.modal')||e.target.closest('.sidebar')||e.target.closest('.glassbar')||e.target.closest('.toast')||e.target.closest('button')||e.target.closest('input')||e.target.closest('#settingsWrap'))return;
  data.settings.editMode=false;changed();
});

$('cancelModal').onclick=()=>$('modal').classList.add('hidden');
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n===b));render()});
$('search').oninput=render;

function setComplete(item,val){item.completed=val;item.updatedAt=now();item.history=item.history||[];item.history.push({status:val?'Completed':'Uncompleted',at:now()});updateParents(data.items);changed()}
function removeItem(idv){let r=locate(data.items,idv);if(!r)return;let snap=JSON.stringify(data);r.item.deletedAt=now();r.list.splice(r.index,1);data.trash=data.trash||[];data.trash.push(r.item);logChange('remove',`"${r.item.name}" moved to Recycle Bin`);changed();showUndoToast(snap)}
function restoreItem(idv){let i=(data.trash||[]).findIndex(x=>x.id===idv);if(i<0)return;let x=data.trash.splice(i,1)[0];x.deletedAt=null;data.items.push(x);logChange('add',`"${x.name}" restored from Recycle Bin`);changed()}
function editName(item){
  $('modalTitle').textContent='Rename';
  $('modalBody').innerHTML=`<input id="renameVal" class="field" value="${esc(item.name)}" style="width:100%">`;
  $('modalCard').classList.remove('settings');$('modalActions').style.display='';$('saveModal').style.display='';$('cancelModal').textContent='Cancel';
  $('modal').classList.remove('hidden');setTimeout(()=>$('renameVal').focus(),50);
  $('saveModal').onclick=()=>{
    let v=$('renameVal').value.trim();
    if(v&&v!==item.name){let old=item.name;item.name=v;item.updatedAt=now();logChange('edit',`"${old}" renamed to "${v}"`);}
    $('modal').classList.add('hidden');$('modalBody').innerHTML='';changed();
  };
}

function startAnon(){auth.signInAnonymously().catch(e=>{$('app').classList.remove('hidden');$('sync').textContent='● error';$('sync').className='status offline';render()})}
auth.onAuthStateChanged(async user=>{
  if(!user){uid=null;startAnon();return}
  uid=user.uid;$('app').classList.remove('hidden');
  try{let doc=await DOC.get();if(doc.exists&&doc.data().owner===uid&&doc.data().appData){data=doc.data().appData}else{let c=localStorage.getItem('nestedChecklistCache');if(c)data=JSON.parse(c);await saveRemote()}
    if(!data.settings.display)data.settings.display={progressbar:true,addbtn:true};
    if(!data.settings.undoSeconds)data.settings.undoSeconds=5;
    if(!data.changelog)data.changelog=[];
    $('sync').textContent='● synced';$('sync').className='status';
  }catch(e){let c=localStorage.getItem('nestedChecklistCache');if(c)data=JSON.parse(c);$('sync').textContent='● Offline';$('sync').className='status offline'}
  render();
  // show "Swipe up to add Task" toast on load (5 sec)
  setTimeout(()=>showToast('Swipe up to add Task',5,null),300);
});
window.addEventListener('online',saveRemote);
window.addEventListener('offline',()=>{$('sync').textContent='● Offline';$('sync').className='status offline'});

const sidebar=$('sidebar'),overlay=$('overlay');
function openSidebar(){sidebar.classList.add('open');overlay.classList.add('show')}
function closeSidebar(){sidebar.classList.remove('open');overlay.classList.remove('show')}
overlay.onclick=closeSidebar;
let tx=0,ty=0,tracking=false;
document.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const t=e.touches[0];tx=t.clientX;ty=t.clientY;tracking=true},{passive:true});
document.addEventListener('touchmove',e=>{if(!tracking)return;const t=e.touches[0];const dx=t.clientX-tx,dy=Math.abs(t.clientY-ty);if(dy>60){tracking=false;return}if(dx>60&&!sidebar.classList.contains('open')){openSidebar();tracking=false}},{passive:true});
document.addEventListener('touchend',()=>{tracking=false});
let sx=0,sy=0;
sidebar.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});
sidebar.addEventListener('touchend',e=>{const t=e.changedTouches[0];const dx=t.clientX-sx,dy=Math.abs(t.clientY-sy);if(dx<-50&&dy<60)closeSidebar()},{passive:true});

function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}

startAnon();
</script></body></html>
