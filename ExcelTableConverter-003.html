<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Table Converter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f1f5f9;--surface:#fff;--surface-2:#f8fafc;--border:#e2e8f0;--text:#0f172a;--text-2:#475569;--text-3:#94a3b8;--primary:#3b82f6;--primary-hover:#2563eb;--green:#22c55e;--green-hover:#16a34a;--red:#ef4444;--yellow:#eab308;--shadow:0 1px 3px rgba(0,0,0,0.03)}
body.night{--bg:#0f172a;--surface:#1e293b;--surface-2:#334155;--border:#334155;--text:#f1f5f9;--text-2:#cbd5e1;--text-3:#94a3b8;--shadow:0 1px 3px rgba(0,0,0,0.3)}
body.theme-glass{--surface:rgba(255,255,255,0.7);--surface-2:rgba(248,250,252,0.5);--border:rgba(203,213,225,0.6)}
body.theme-glass .topbar,body.theme-glass .table-wrap,body.theme-glass .menu,body.theme-glass .modal,body.theme-glass .history-inner,body.theme-glass .qr-preview{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 4px 20px rgba(0,0,0,0.06)}
body.night.theme-glass{--surface:rgba(30,41,59,0.7);--surface-2:rgba(51,65,85,0.5);--border:rgba(71,85,105,0.6)}
body.theme-gradient{background:linear-gradient(135deg,#e0e7ff 0%,#f0f9ff 50%,#fef3c7 100%)}
body.night.theme-gradient{background:linear-gradient(135deg,#1e1b4b 0%,#0f172a 50%,#172554 100%)}
body.theme-bold{--primary:#7c3aed;--green:#059669}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;min-height:100vh;transition:background .3s,color .3s}
.topbar{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 10px;display:flex;align-items:center;justify-content:center;gap:6px;overflow-x:auto;box-shadow:var(--shadow);flex-wrap:wrap}
.topbar button{width:38px;height:38px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;font-size:1rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:.1s;color:var(--text);padding:0}
.topbar button:hover{background:var(--border)}
.topbar button:active{transform:scale(.93)}
.btn-add{width:38px;height:38px;border-radius:10px;font-size:1.15rem;font-weight:700;cursor:pointer;border:1px solid;transition:.2s;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-add.nodata{background:#e2e8f0;border-color:#cbd5e1;color:#64748b}
.btn-add.online{background:var(--green);border-color:var(--green-hover);color:#fff;animation:pulseGreen 2s infinite}
.btn-add.saving{background:var(--yellow);border-color:#ca8a04;color:#fff;animation:pulseYellow .6s infinite}
.btn-add.offline{background:var(--red);border-color:#dc2626;color:#fff}
@keyframes pulseGreen{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.7)}50%{box-shadow:0 0 0 8px rgba(34,197,94,0)}}
@keyframes pulseYellow{0%,100%{box-shadow:0 0 0 0 rgba(234,179,8,.7)}50%{box-shadow:0 0 0 6px rgba(234,179,8,0)}}
.table-wrap{margin:10px;background:var(--surface);border-radius:14px;border:1px solid var(--border);overflow:hidden}
.table-scroll{overflow:auto;max-height:60vh;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:auto;font-size:.85rem}
th,td{border:1px solid var(--border);padding:7px 9px;vertical-align:top;word-break:break-word;position:relative}
th{background:var(--surface-2);font-weight:600;text-align:left;position:sticky;top:0;z-index:5;font-size:.8rem;color:var(--text)}
td[contenteditable="true"]:focus{outline:2px solid var(--primary);outline-offset:-2px;background:rgba(59,130,246,.08)}
.row-num{background:var(--surface-2);color:var(--text-2);text-align:center;font-size:.75rem;width:38px;min-width:38px;font-weight:600;cursor:pointer;user-select:none;-webkit-user-select:none}
.col-head{display:flex;align-items:center;gap:4px}
.col-head .h-label{flex:1;cursor:pointer;padding:2px 4px;border-radius:4px}
.toggle-mini{background:0 0;border:0;padding:2px 4px;font-size:.75rem;cursor:pointer;border-radius:4px;opacity:.7;flex-shrink:0;color:var(--text)}
.excluded{opacity:.35}
.excluded .row-num{text-decoration:line-through}
.pagination{display:flex;justify-content:center;align-items:center;gap:10px;padding:8px;background:var(--surface-2);border-top:1px solid var(--border);font-size:.8rem;color:var(--text-2)}
.pagination button{background:var(--surface);border:1px solid var(--border);padding:5px 12px;border-radius:8px;font-size:.8rem;cursor:pointer;color:var(--text)}
.empty-msg{text-align:center;color:var(--text-3);padding:50px 20px;font-style:italic;font-size:.9rem}
.menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:6px;z-index:1000;min-width:220px;display:none;max-height:75vh;overflow-y:auto}
.menu.open{display:block}
.menu-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:.88rem;cursor:pointer;border:0;background:0 0;width:100%;text-align:left;white-space:nowrap;color:var(--text)}
.menu-item:hover{background:var(--surface-2)}
.menu-item.danger{color:var(--red)}
.menu-item .mi-icon{font-size:1rem;width:20px;text-align:center}
.menu-item .mi-label{flex:1}
.menu-item .mi-value{font-size:.75rem;color:var(--text-3);font-family:monospace}
.menu-sep{height:1px;background:var(--border);margin:4px 0}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1500;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);color:var(--text);border-radius:16px;padding:20px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
.modal h3{font-size:1rem;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.modal input,.modal select,.modal textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:.9rem;margin-bottom:12px;background:var(--surface);color:var(--text)}
.modal-actions{display:flex;gap:8px;margin-top:6px}
.modal-actions button{flex:1;padding:11px;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer;border:0}
.export-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.export-grid button{padding:12px 8px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface-2);color:var(--text);cursor:pointer;font-size:.82rem;font-weight:600;text-align:center}
.export-grid button:hover{background:var(--border)}
.export-grid button:active{transform:scale(.97)}
.setting-row{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border-bottom:0}
.setting-lock{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
.setting-lock.locked{background:#fee2e2;border-color:#fca5a5}
.setting-body{flex:1}
.setting-label{font-size:.85rem;font-weight:600;margin-bottom:8px;display:block}
.setting-options{display:flex;flex-wrap:wrap;gap:6px}
.setting-options label{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:.78rem;cursor:pointer;background:var(--surface)}
.setting-options label:has(input:checked){border-color:var(--primary);background:rgba(59,130,246,.1);color:var(--primary)}
.setting-options input[type=radio]{display:none}
.setting-row.locked .setting-options,.setting-row.locked .slider-wrap{opacity:.4;pointer-events:none}
.slider-labels{display:flex;justify-content:space-between;font-size:.7rem;color:var(--text-3);margin-bottom:4px}
input[type=range]{width:100%;-webkit-appearance:none;height:6px;border-radius:3px;background:linear-gradient(to right,#000,#808080,#fff);outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--surface);border:2px solid var(--primary);cursor:pointer}
.wh-current{text-align:center;margin:8px 0 16px;font-size:.85rem;color:var(--text-2)}
.wh-value{font-size:1.6rem;font-weight:700;color:var(--text);font-family:monospace;display:block;margin-top:4px}
.wh-steps{display:flex;gap:8px;margin-bottom:16px}
.wh-steps label{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;border:2px solid var(--border);border-radius:10px;cursor:pointer;font-size:.9rem;font-weight:600;background:var(--surface)}
.wh-steps label:has(input:checked){border-color:var(--primary);background:rgba(59,130,246,.1);color:var(--primary)}
.wh-steps input[type=radio]{display:none}
.wh-plusminus{display:flex;gap:10px;margin-bottom:16px}
.wh-plusminus button{flex:1;padding:16px;border-radius:12px;border:2px solid var(--border);background:var(--surface);font-size:1.1rem;font-weight:700;cursor:pointer;color:var(--text)}
.wh-reset{width:100%;padding:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;font-size:.85rem;color:var(--text-2);cursor:pointer;margin-top:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-size:.85rem;z-index:2000;opacity:0;transition:.25s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.history-panel{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1600;display:none;align-items:flex-end;justify-content:center}
.history-panel.open{display:flex}
.history-inner{background:var(--surface);color:var(--text);width:100%;max-width:560px;max-height:85vh;border-radius:20px 20px 0 0;padding:18px;overflow-y:auto}
.history-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);gap:8px}
.history-header h3{font-size:1.05rem;flex:1}
.history-header button{background:var(--surface-2);border:1px solid var(--border);font-size:.8rem;cursor:pointer;color:var(--text);padding:6px 10px;border-radius:8px}
.history-header .del-all{background:#fee2e2;border-color:#fca5a5;color:#b91c1c;font-weight:600}
.history-item{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--surface-2)}
.history-item .hi-date{font-size:.72rem;color:var(--text-3);margin-bottom:4px;font-family:monospace}
.history-item .hi-meta{font-size:.78rem;color:var(--text-2);margin-bottom:8px}
.history-item .hi-preview{font-size:.72rem;color:var(--text-2);font-family:monospace;background:var(--surface);padding:8px;border-radius:6px;margin-bottom:8px;border:1px solid var(--border);overflow-x:auto;max-height:90px;white-space:pre;line-height:1.5}
.history-item .hi-actions{display:flex;gap:6px}
.history-item .hi-actions button{flex:1;padding:7px;border-radius:8px;font-size:.8rem;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.history-item .hi-actions .hi-recall{background:rgba(59,130,246,.1);border-color:var(--primary);color:var(--primary);font-weight:600}
.history-item .hi-actions .hi-delete{color:var(--red);border-color:#fecaca}
.qr-preview{margin:10px;padding:12px;background:var(--surface-2);border:1px dashed var(--border);border-radius:12px}
.qr-grid{display:flex;flex-wrap:wrap;gap:10px}
.qr-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;text-align:center;min-width:80px}
.qr-card .qr-ref{font-size:.75rem;font-weight:700;color:var(--text);font-family:monospace;margin-bottom:5px}
.qr-card img{width:60px;height:60px;display:block;margin:0 auto}
@media(max-width:480px){body{font-size:14px}.topbar button,.btn-add{width:34px;height:34px;font-size:.9rem}th,td{padding:5px 7px;font-size:.78rem}.row-num{width:32px;min-width:32px}}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body>
<div class="topbar">
  <button class="btn-add nodata" id="addBtn" title="Click: paste | Long-press: status">➕</button>
  <button id="clearBtn" title="Clear">🧹</button>
  <button id="copyBtn" title="Copy">📋</button>
  <button id="exportBtn" title="Export">⬇</button>
  <button id="moreBtn" title="More">⋮</button>
</div>
<div class="table-wrap">
  <div class="empty-msg" id="emptyMsg">📭 No table — paste data with ➕</div>
  <div class="table-scroll" id="tableScroll" style="display:none">
    <table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table>
  </div>
  <div class="pagination" id="pagination" style="display:none">
    <button id="prevPage">◀</button><span id="pageInfo">1 / 1</span><button id="nextPage">▶</button>
  </div>
</div>
<div class="qr-preview" id="qrPreview" style="display:none"><div class="qr-grid" id="qrGrid"></div></div>
<div class="menu" id="rowMenu"></div>
<div class="menu" id="colMenu"></div>
<div class="menu" id="moreMenu"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="history-panel" id="historyPanel">
  <div class="history-inner">
    <div class="history-header">
      <h3>📜 History</h3>
      <button class="del-all" id="deleteAllHistory">🗑️ Delete All</button>
      <button id="closeHistory">✕</button>
    </div>
    <div id="historyList"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,signInAnonymously,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,setDoc,getDoc,updateDoc,deleteDoc,collection,getDocs,query,orderBy,limit,writeBatch}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const FIREBASE_CONFIG={apiKey:"AIzaSyAFiJNThb3TJsqiPLIcqk20XU9ag59wdOs",authDomain:"mywebapps-e3b63.firebaseapp.com",projectId:"mywebapps-e3b63",storageBucket:"mywebapps-e3b63.firebasestorage.app",messagingSenderId:"46681415809",appId:"1:46681415809:web:c4528b9da97abc310a2d80"};
const FIRESTORE_COLLECTION_NAME="Excel Sheet Table Export";
const GLOBAL_DOC="global";
const app=initializeApp(FIREBASE_CONFIG);
const auth=getAuth(app);
const db=getFirestore(app);
let currentUser=null,globalDocRef=null;

let S={headers:[],rows:[],includedRows:[],includedCols:[],colWidths:[],rowHeights:[],headerRowIndex:-1,currentPage:1,rowsPerPage:50,qrCol:!1,qrSection:!1,stepSize:5,lastQrRef:1000};
let undoStack=[],redoStack=[];
let SETTINGS={theme:'flat',dayNight:'day',exportFontSize:12,exportFontStyle:'system',qrPrintSize:2,borderColour:'#000000',screenFontSize:15,stepSize:5,locks:{theme:!1,dayNight:!1,exportFontSize:!1,exportFontStyle:!1,qrPrintSize:!1,borderColour:!1}};
let fbStatus={online:!0,dirty:!1,saving:!1,savingTimer:null,_histTimer:null,_lastHistId:null,lastSave:null};
let historyRecords=[];

const $=id=>document.getElementById(id);
const tableScroll=$('tableScroll'),tableHead=$('tableHead'),tableBody=$('tableBody'),emptyMsg=$('emptyMsg'),pagination=$('pagination'),pageInfo=$('pageInfo'),addBtn=$('addBtn'),toastEl=$('toast'),rowMenu=$('rowMenu'),colMenu=$('colMenu'),moreMenu=$('moreMenu'),modalBg=$('modalBg'),modalBox=$('modalBox'),historyPanel=$('historyPanel'),historyList=$('historyList'),qrPreview=$('qrPreview'),qrGrid=$('qrGrid');

function toast(m,ms=1900){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.classList.remove('show'),ms)}
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function snapshot(){return{headers:[...S.headers],rows:S.rows.map(r=>[...r]),includedRows:[...S.includedRows],includedCols:[...S.includedCols],colWidths:[...S.colWidths],rowHeights:[...S.rowHeights],headerRowIndex:S.headerRowIndex,qrCol:S.qrCol,qrSection:S.qrSection,lastQrRef:S.lastQrRef}}
function pushUndo(){undoStack.push(snapshot());if(undoStack.length>80)undoStack.shift();redoStack=[];markDirty()}
function restore(s){S.headers=[...s.headers];S.rows=s.rows.map(r=>[...r]);S.includedRows=[...s.includedRows];S.includedCols=[...s.includedCols];S.colWidths=[...(s.colWidths||[])];S.rowHeights=[...(s.rowHeights||[])];S.headerRowIndex=s.headerRowIndex;S.qrCol=s.qrCol;S.qrSection=s.qrSection;S.lastQrRef=s.lastQrRef||1000;S.currentPage=1;render()}

function applyTheme(){document.body.classList.remove('night','theme-flat','theme-glass','theme-gradient','theme-bold');if(SETTINGS.dayNight==='night')document.body.classList.add('night');else if(SETTINGS.dayNight==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)document.body.classList.add('night');document.body.classList.add('theme-'+(SETTINGS.theme||'flat'));document.body.style.fontSize=(SETTINGS.screenFontSize||15)+'px'}

function setAddStatus(s){addBtn.classList.remove('online','saving','offline','nodata');if(s==='online'){addBtn.classList.add('online');addBtn.title='Connected'}else if(s==='saving'){addBtn.classList.add('saving');addBtn.title='Saving…'}else if(s==='offline'){addBtn.classList.add('offline');addBtn.title='Offline'}else{addBtn.classList.add('nodata');addBtn.title='Click to paste'}}

async function initFirebase(){onAuthStateChanged(auth,async u=>{if(u){currentUser=u;globalDocRef=doc(db,FIRESTORE_COLLECTION_NAME,GLOBAL_DOC);await ensureGlobalDoc();await loadSettings();await loadCurrent();await loadHistory();setAddStatus('online')}else{try{await signInAnonymously(auth)}catch(e){console.error(e);setAddStatus('offline')}}})}
async function ensureGlobalDoc(){const snap=await getDoc(globalDocRef);if(!snap.exists())await setDoc(globalDocRef,{createdAt:new Date().toISOString(),settings:SETTINGS,current:null,lastQrRef:1000})}
async function loadSettings(){try{const snap=await getDoc(globalDocRef);if(snap.exists()&&snap.data().settings){SETTINGS={...SETTINGS,...snap.data().settings};SETTINGS.locks={...SETTINGS.locks,...(snap.data().settings.locks||{})};applyTheme()}}catch(e){console.error(e)}}
async function saveSettings(){if(!globalDocRef)return;try{setAddStatus('saving');await updateDoc(globalDocRef,{settings:SETTINGS});setAddStatus('online')}catch(e){setAddStatus('offline')}}
async function loadCurrent(){try{const snap=await getDoc(globalDocRef);if(snap.exists()){const d=snap.data();S.lastQrRef=d.lastQrRef||1000;if(d.current&&d.current.json){const c=JSON.parse(d.current.json);S.headers=c.headers||[];S.rows=c.rows||[];S.includedRows=c.includedRows||[];S.includedCols=c.includedCols||[];S.colWidths=c.colWidths||[];S.rowHeights=c.rowHeights||[];S.headerRowIndex=c.headerRowIndex??-1;S.qrCol=c.qrCol||!1;S.qrSection=c.qrSection||!1;S.currentPage=1;render()}}}catch(e){console.error(e)}}
async function saveCurrentState(){if(!globalDocRef)return;try{setAddStatus('saving');fbStatus.saving=!0;await updateDoc(globalDocRef,{current:{json:JSON.stringify({headers:S.headers,rows:S.rows,includedRows:S.includedRows,includedCols:S.includedCols,colWidths:S.colWidths,rowHeights:S.rowHeights,headerRowIndex:S.headerRowIndex,qrCol:S.qrCol,qrSection:S.qrSection})},lastQrRef:S.lastQrRef,currentUpdatedAt:new Date().toISOString()});fbStatus.saving=!1;fbStatus.dirty=!1;fbStatus.lastSave=new Date();setAddStatus('online')}catch(e){console.error(e);fbStatus.saving=!1;setAddStatus('offline')}}

async function saveHistoryRecord(updateExisting=false){if(!globalDocRef||!S.headers.length)return;try{const recordsRef=collection(db,FIRESTORE_COLLECTION_NAME,GLOBAL_DOC,'records');const recId=updateExisting&&fbStatus._lastHistId?fbStatus._lastHistId:'rec_'+Date.now();const recRef=doc(recordsRef,recId);await setDoc(recRef,{timestamp:new Date().toISOString(),json:JSON.stringify({headers:S.headers,rows:S.rows,includedRows:S.includedRows,includedCols:S.includedCols,headerRowIndex:S.headerRowIndex,lastQrRef:S.lastQrRef})});fbStatus._lastHistId=recId}catch(e){console.error(e)}}
async function loadHistory(){if(!globalDocRef)return;try{const recordsRef=collection(db,FIRESTORE_COLLECTION_NAME,GLOBAL_DOC,'records');const q=query(recordsRef,orderBy('timestamp','desc'),limit(50));const snap=await getDocs(q);historyRecords=[];snap.forEach(d=>{try{const p=JSON.parse(d.data().json);historyRecords.push({id:d.id,timestamp:d.data().timestamp,...p})}catch(e){}})}catch(e){console.error(e)}}
async function deleteHistoryRecord(id){try{await deleteDoc(doc(db,FIRESTORE_COLLECTION_NAME,GLOBAL_DOC,'records',id));historyRecords=historyRecords.filter(r=>r.id!==id)}catch(e){console.error(e)}}
async function deleteAllHistoryRecords(){if(!globalDocRef)return;try{const recordsRef=collection(db,FIRESTORE_COLLECTION_NAME,GLOBAL_DOC,'records');const snap=await getDocs(recordsRef);const batch=writeBatch(db);snap.forEach(d=>batch.delete(d.ref));await batch.commit();historyRecords=[];fbStatus._lastHistId=null}catch(e){console.error(e)}}

function markDirty(){fbStatus.dirty=!0;setAddStatus('saving');clearTimeout(fbStatus.savingTimer);fbStatus.savingTimer=setTimeout(()=>{if(fbStatus.online&&currentUser)saveCurrentState()},1000)}
function saveHistoryNow(updateExisting=false){if(!currentUser||!S.headers.length)return;clearTimeout(fbStatus._histTimer);fbStatus._histTimer=setTimeout(()=>{saveHistoryRecord(updateExisting).then(()=>loadHistory())},3000)}

function getRowQrRefs(gi){const row=S.rows[gi];if(!row)return[];const items=[];S.headers.forEach((_,ci)=>{if(!S.includedCols[ci])return;const v=(row[ci]||'').trim();if(/^https?:\/\//i.test(v))items.push(v)});if(!items.length)return[];let counter=1000;S.rows.forEach((r,ri)=>{if(!S.includedRows[ri])return;S.headers.forEach((_,ci)=>{if(!S.includedCols[ci])return;const v=(r[ci]||'').trim();if(/^https?:\/\//i.test(v)){counter++;if(ri===gi){const idx=items.indexOf(v);if(idx>-1)items[idx]={ref:String(counter),url:v}}}})});return items.filter(x=>typeof x==='object').map(x=>x)}

function doClear(){pushUndo();S.headers=[];S.rows=[];S.includedRows=[];S.includedCols=[];S.colWidths=[];S.rowHeights=[];S.headerRowIndex=-1;S.currentPage=1;S.qrCol=!1;S.qrSection=!1;render();saveCurrentState();toast('Cleared')}

$('moreBtn').addEventListener('click',e=>{e.stopPropagation();const allRowsIncluded=S.includedRows.length&&S.includedRows.every(x=>x);const allColsIncluded=S.includedCols.length&&S.includedCols.every(x=>x);const rect=e.currentTarget.getBoundingClientRect();openMenu(moreMenu,rect.left,rect.bottom+4,[{act:'settings',icon:'⚙️',label:'Settings'},{sep:1},{act:'toggleAllRows',icon:allRowsIncluded?'🚫':'✅',label:allRowsIncluded?'Exclude all rows':'Include all rows'},{act:'toggleAllCols',icon:allColsIncluded?'🚫':'✅',label:allColsIncluded?'Exclude all columns':'Include all columns'},{sep:1},{act:'fontDec',icon:'A−',label:'Decrease screen font'},{act:'fontInc',icon:'A+',label:'Increase screen font'},{sep:1},{act:'toggleQrCol',icon:S.qrCol?'☑️':'🔲',label:'QR column '+(S.qrCol?'ON':'OFF')},{act:'toggleQrSec',icon:S.qrSection?'☑️':'🔳',label:'QR section '+(S.qrSection?'ON':'OFF')},{sep:1},{act:'undo',icon:'↩',label:'Undo'},{act:'redo',icon:'↪',label:'Redo'},{sep:1},{act:'history',icon:'📜',label:'History'}])});

moreMenu.addEventListener('click',e=>{const btn=e.target.closest('[data-act]');if(!btn)return;const act=btn.dataset.act;closeMenus();if(act==='settings')openSettingsModal();else if(act==='toggleAllRows'){pushUndo();const allInc=S.includedRows.every(x=>x);S.includedRows=S.includedRows.map(()=>!allInc);render();markDirty();toast(allInc?'All rows excluded':'All rows included')}else if(act==='toggleAllCols'){pushUndo();const allInc=S.includedCols.every(x=>x);S.includedCols=S.includedCols.map(()=>!allInc);render();markDirty();toast(allInc?'All columns excluded':'All columns included')}else if(act==='fontDec'){SETTINGS.screenFontSize=Math.max(SETTINGS.screenFontSize-1,11);applyTheme();saveSettings()}else if(act==='fontInc'){SETTINGS.screenFontSize=Math.min(SETTINGS.screenFontSize+1,22);applyTheme();saveSettings()}else if(act==='toggleQrCol'){S.qrCol=!S.qrCol;render();markDirty()}else if(act==='toggleQrSec'){S.qrSection=!S.qrSection;render();markDirty()}else if(act==='undo')doUndo();else if(act==='redo')doRedo();else if(act==='history')openHistory()});

function doUndo(){if(!undoStack.length){toast('Nothing to undo');return}redoStack.push(snapshot());restore(undoStack.pop());markDirty();toast('Undone')}
function doRedo(){if(!redoStack.length){toast('Nothing to redo');return}undoStack.push(snapshot());restore(redoStack.pop());markDirty();toast('Redone')}

function openSettingsModal(){modalBox.innerHTML='';const h3=document.createElement('h3');h3.innerHTML='⚙️ Settings';modalBox.appendChild(h3);modalBox.appendChild(settingRow('dayNight','☀️/🌙 Day / Night',[{v:'day',l:'☀️ Day'},{v:'night',l:'🌙 Night'},{v:'auto',l:'🔄 Auto'}],SETTINGS.dayNight,v=>{SETTINGS.dayNight=v;applyTheme();saveSettings()}));modalBox.appendChild(settingRow('theme','🎨 UI Theme',[{v:'flat',l:'Flat'},{v:'glass',l:'Glass'},{v:'gradient',l:'Gradient'},{v:'bold',l:'Bold'}],SETTINGS.theme,v=>{SETTINGS.theme=v;applyTheme();saveSettings()}));modalBox.appendChild(settingRow('exportFontSize','📄 Export Font Size',[{v:10,l:'10pt'},{v:12,l:'12pt'},{v:14,l:'14pt'},{v:16,l:'16pt'}],SETTINGS.exportFontSize,v=>{SETTINGS.exportFontSize=parseInt(v);saveSettings()}));modalBox.appendChild(settingRow('exportFontStyle','🔤 Export Font Style',[{v:'system',l:'System'},{v:'serif',l:'Serif'},{v:'sans-serif',l:'Sans-Serif'},{v:'monospace',l:'Monospace'}],SETTINGS.exportFontStyle,v=>{SETTINGS.exportFontStyle=v;saveSettings()}));modalBox.appendChild(settingRow('qrPrintSize','🔲 QR Print Size (inches)',[{v:1,l:'1×1"'},{v:1.5,l:'1.5×1.5"'},{v:2,l:'2×2"'},{v:2.5,l:'2.5×2.5"'},{v:3,l:'3×3"'}],SETTINGS.qrPrintSize,v=>{SETTINGS.qrPrintSize=parseFloat(v);saveSettings()}));modalBox.appendChild(settingRow('borderColour','🎨 Border Colour',null,SETTINGS.borderColour,v=>{SETTINGS.borderColour=v;saveSettings()},'slider'));const actions=document.createElement('div');actions.className='modal-actions';const closeBtn=document.createElement('button');closeBtn.textContent='Close';closeBtn.style.background='#3b82f6';closeBtn.style.color='#fff';actions.appendChild(closeBtn);modalBox.appendChild(actions);closeBtn.onclick=closeModal;modalBg.classList.add('open')}

function settingRow(key,label,options,currentValue,onChange,type){const row=document.createElement('div');row.className='setting-row';const isLocked=SETTINGS.locks[key];const lock=document.createElement('button');lock.className='setting-lock'+(isLocked?' locked':'');lock.textContent=isLocked?'🔒':'🔓';lock.onclick=()=>{SETTINGS.locks[key]=!SETTINGS.locks[key];saveSettings();openSettingsModal()};row.appendChild(lock);const body=document.createElement('div');body.className='setting-body';const lbl=document.createElement('span');lbl.className='setting-label';lbl.textContent=label;body.appendChild(lbl);if(type==='slider'){const wrap=document.createElement('div');const labels=document.createElement('div');labels.className='slider-labels';labels.innerHTML='<span>Black</span><span>White</span>';wrap.appendChild(labels);const input=document.createElement('input');input.type='range';input.min=0;input.max=255;input.value=hexToVal(currentValue||'#000000');input.oninput=e=>onChange(valToHex(parseInt(e.target.value)));wrap.appendChild(input);body.appendChild(wrap)}else{const opts=document.createElement('div');opts.className='setting-options';options.forEach(o=>{const l=document.createElement('label');const r=document.createElement('input');r.type='radio';r.name='set_'+key;r.value=o.v;if(String(currentValue)===String(o.v))r.checked=!0;r.onchange=()=>onChange(o.v);const s=document.createElement('span');s.textContent=o.l;l.appendChild(r);l.appendChild(s);opts.appendChild(l)});body.appendChild(opts)}row.appendChild(body);if(isLocked)row.classList.add('locked');return row}
function hexToVal(hex){hex=(hex||'#000000').replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');const r=parseInt(hex.substr(0,2),16),g=parseInt(hex.substr(2,2),16),b=parseInt(hex.substr(4,2),16);return Math.round((r+g+b)/3)}
function valToHex(v){const h=Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0');return'#'+h+h+h}

$('prevPage').addEventListener('click',()=>{if(S.currentPage>1){S.currentPage--;render()}});
$('nextPage').addEventListener('click',()=>{const p=Math.ceil(S.rows.length/S.rowsPerPage);if(S.currentPage<p){S.currentPage++;render()}});

$('copyBtn').addEventListener('click',()=>{if(!S.headers.length){toast('No table');return}const cols=S.includedCols.map((x,i)=>x?i:-1).filter(i=>i>=0);const rows=S.includedRows.map((x,i)=>x?i:-1).filter(i=>i>=0);let out='',ser=0;rows.forEach(ri=>{ser++;out+=`Ser: ${ser}\n.\n`;cols.forEach(ci=>{const h=S.headers[ci]||`Column ${ci+1}`;const v=S.rows[ri][ci]??'';out+=`${h}: ${v}\n.\n`});out+=`.\n.\n.\n**********\n.\n.\n.\n`});copyToClipboard(out,'Copied')});
function copyToClipboard(text,msg){if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast(msg)).catch(()=>fallbackCopy(text,msg));else fallbackCopy(text,msg)}
function fallbackCopy(text,msg){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(msg)}catch(e){toast('Copy failed')}ta.remove()}

function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}

$('exportBtn').addEventListener('click',()=>{if(!S.headers.length){toast('No table');return}modalBox.innerHTML='';const h3=document.createElement('h3');h3.textContent='⬇ Export as';modalBox.appendChild(h3);const grid=document.createElement('div');grid.className='export-grid';const opts=[['xlsx','📊 Excel (.xlsx)'],['csv','📄 CSV (.csv)'],['pdf','📕 PDF (.pdf)'],['pdf_qr','📕 PDF + QR'],['docx','📝 Word (.docx)'],['txt','📃 Text (.txt)'],['jpg','🖼️ JPG (.jpg)'],['jpg_qr','🖼️ JPG + QR']];opts.forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{closeModal();doExport(v)};grid.appendChild(b)});modalBox.appendChild(grid);const actions=document.createElement('div');actions.className='modal-actions';const cancelBtn=document.createElement('button');cancelBtn.textContent='Cancel';cancelBtn.style.background='#f1f5f9';cancelBtn.style.color='#334155';actions.appendChild(cancelBtn);modalBox.appendChild(actions);cancelBtn.onclick=closeModal;modalBg.classList.add('open')});

function getIncludedData(){const incRows=S.includedRows.map((x,i)=>x?i:-1).filter(i=>i>=0);const incCols=S.includedCols.map((x,i)=>x?i:-1).filter(i=>i>=0);const headers=incCols.map(c=>S.headers[c]||`Column ${c+1}`);const rows=incRows.map(ri=>incCols.map(c=>S.rows[ri][c]||''));return{headers,rows}}

async function doExport(fmt){const{headers,rows}=getIncludedData();if(fmt==='csv'||fmt==='txt'){const delim=fmt==='csv'?',':'\t';let content=headers.map(h=>fmt==='csv'?`"${h.replace(/"/g,'""')}"`:h).join(delim)+'\n';rows.forEach(r=>{content+=r.map(v=>fmt==='csv'?`"${String(v).replace(/"/g,'""')}"`:v).join(delim)+'\n'});downloadBlob(content,`table.${fmt}`,'text/plain;charset=utf-8');toast(`.${fmt} downloaded`)}else if(fmt==='xlsx'){await loadScript('https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js');const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Sheet1');XLSX.writeFile(wb,'table.xlsx');toast('.xlsx downloaded')}else if(fmt==='docx'){let html='<html><head><meta charset="utf-8"></head><body><table border="1" style="border-collapse:collapse;font-family:'+SETTINGS.exportFontStyle+';font-size:'+SETTINGS.exportFontSize+'pt"><tr>';headers.forEach(h=>{html+=`<th style="padding:6px;background:#f0f0f0">${esc(h)}</th>`});html+='</tr>';rows.forEach(r=>{html+='<tr>';r.forEach(v=>{html+=`<td style="padding:6px">${esc(v)}</td>`});html+='</tr>'});html+='</table></body></html>';downloadBlob(html,'table.doc','application/msword');toast('Word file downloaded (.doc)')}else if(fmt==='pdf'){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');await exportPdfOrJpg('pdf')}else if(fmt==='pdf_qr'){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');await exportPdfOrJpg('pdf_qr')}else if(fmt==='jpg'||fmt==='jpg_qr'){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');await exportPdfOrJpg(fmt==='jpg_qr'?'jpg_qr':'jpg')}}

async function exportPdfOrJpg(mode){toast('Generating… please wait');const{headers,rows}=getIncludedData();const isLandscape=headers.length>6;const wrapper=document.createElement('div');wrapper.style.cssText=`position:fixed;left:-9999px;top:0;background:#fff;padding:20px;font-family:${SETTINGS.exportFontStyle};font-size:${SETTINGS.exportFontSize}pt;width:${isLandscape?'277mm':'190mm'}`;let html='<table style="border-collapse:collapse;width:100%"><thead><tr>';headers.forEach(h=>{html+=`<th style="border:1px solid ${SETTINGS.borderColour};padding:6px;background:#f0f0f0;text-align:left">${esc(h)}</th>`});html+='</tr></thead><tbody>';rows.forEach(r=>{html+='<tr>';r.forEach(v=>{html+=`<td style="border:1px solid ${SETTINGS.borderColour};padding:6px">${esc(v)}</td>`});html+='</tr>'});html+='</tbody></table>';if((mode==='jpg_qr'||mode==='pdf_qr')&&(S.qrSection||S.qrCol)){const entries=getAllQrEntries();if(entries.length){const qrSizePx=SETTINGS.qrPrintSize*96;html+=`<div style="margin-top:20px;border-top:2px solid ${SETTINGS.borderColour};padding-top:12px"><div style="font-weight:bold;margin-bottom:10px">QR Codes</div><div style="display:flex;flex-wrap:wrap;gap:12px">`;entries.forEach(e=>{html+=`<div style="text-align:center"><div style="font-family:monospace;font-weight:bold;font-size:0.8em;margin-bottom:4px">${e.ref}</div><img src="https://api.qrserver.com/v1/create-qr-code/?size=${Math.round(qrSizePx)}x${Math.round(qrSizePx)}&data=${encodeURIComponent(e.url)}" crossorigin="anonymous" style="width:${SETTINGS.qrPrintSize}in;height:${SETTINGS.qrPrintSize}in"></div>`});html+='</div></div>'}}wrapper.innerHTML=html;document.body.appendChild(wrapper);const imgs=wrapper.querySelectorAll('img');await Promise.all([...imgs].map(img=>new Promise(res=>{if(img.complete)res();else{img.onload=res;img.onerror=res}})));const canvas=await html2canvas(wrapper,{scale:2,backgroundColor:'#ffffff'});document.body.removeChild(wrapper);const imgData=canvas.toDataURL('image/jpeg',0.92);if(mode==='jpg'||mode==='jpg_qr'){const link=document.createElement('a');link.href=imgData;link.download='table.jpg';link.click();toast('.jpg downloaded')}else if(mode==='pdf'||mode==='pdf_qr'){const{jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:isLandscape?'landscape':'portrait',unit:'mm',format:'a4'});const pageW=pdf.internal.pageSize.getWidth();const pageH=pdf.internal.pageSize.getHeight();const imgW=pageW-20;const imgH=(canvas.height/canvas.width)*imgW;let y=10,remaining=imgH;while(remaining>0){pdf.addImage(imgData,'JPEG',10,y,imgW,imgH);remaining-=(pageH-20);if(remaining>0){pdf.addPage();y=10-(imgH-remaining)}}pdf.save('table.pdf');toast('.pdf downloaded')}}

function downloadBlob(content,filename,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}

function openConfirmModal(title,message,buttons,onChoice){modalBox.innerHTML='';const h3=document.createElement('h3');h3.textContent=title;modalBox.appendChild(h3);const p=document.createElement('p');p.textContent=message;p.style.cssText='color:#475569;font-size:0.88rem;margin-bottom:14px';modalBox.appendChild(p);const actions=document.createElement('div');actions.className='modal-actions';actions.style.flexDirection='column';buttons.forEach(b=>{const btn=document.createElement('button');btn.textContent=b.label;btn.style.background=b.color;btn.style.color='#fff';btn.style.marginBottom='6px';btn.onclick=()=>{closeModal();onChoice(b.action)};actions.appendChild(btn)});modalBox.appendChild(actions);modalBg.classList.add('open')}

function openHistory(){renderHistoryList();historyPanel.classList.add('open')}
$('closeHistory').addEventListener('click',()=>historyPanel.classList.remove('open'));
historyPanel.addEventListener('click',e=>{if(e.target===historyPanel)historyPanel.classList.remove('open')});
$('deleteAllHistory').addEventListener('click',()=>{openConfirmModal('Delete all history?','This will permanently delete all saved records. This cannot be undone.',[{label:'Delete All',color:'#ef4444',action:'deleteAll'},{label:'Cancel',color:'#94a3b8',action:'cancel'}],async choice=>{if(choice!=='deleteAll')return;await deleteAllHistoryRecords();renderHistoryList();toast('All history deleted')})});

function renderHistoryList(){if(!historyRecords.length){historyList.innerHTML='<div style="text-align:center;color:#94a3b8;padding:40px 20px;font-style:italic">No saved records yet</div>';return}historyList.innerHTML=historyRecords.map((rec,idx)=>{const dateStr=new Date(rec.timestamp).toLocaleString();const headers=(rec.headers||[]).slice(0,4).map(h=>h||'Col');let preview=headers.join(' | ')+'\n'+'─'.repeat(28)+'\n';(rec.rows||[]).slice(0,3).forEach(r=>{preview+=r.slice(0,4).map(v=>(v||'').substring(0,12)).join(' | ')+'\n'});if((rec.rows||[]).length>3)preview+='...';return`<div class="history-item" data-idx="${idx}"><div class="hi-date">${dateStr}</div><div class="hi-meta">${(rec.rows||[]).length} rows · ${(rec.headers||[]).length} cols</div><div class="hi-preview">${esc(preview)}</div><div class="hi-actions"><button class="hi-recall" data-recall="${idx}">📂 Recall</button><button class="hi-delete" data-delete="${idx}">🗑️ Delete</button></div></div>`}).join('')}

historyList.addEventListener('click',async e=>{const recall=e.target.closest('[data-recall]'),del=e.target.closest('[data-delete]');if(recall){const rec=historyRecords[parseInt(recall.dataset.recall)];if(!rec)return;pushUndo();S.headers=[...(rec.headers||[])];S.rows=(rec.rows||[]).map(r=>[...r]);S.includedRows=[...(rec.includedRows||[])];S.includedCols=[...(rec.includedCols||[])];S.colWidths=new Array(S.headers.length).fill(null);S.rowHeights=new Array(S.rows.length).fill(null);S.headerRowIndex=rec.headerRowIndex??-1;S.currentPage=1;render();markDirty();historyPanel.classList.remove('open');toast('Recalled')}if(del){const rec=historyRecords[parseInt(del.dataset.delete)];if(!rec)return;if(!confirm('Delete this record?'))return;await deleteHistoryRecord(rec.id);renderHistoryList();toast('Deleted')}});

document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.shiftKey){e.preventDefault();doUndo()}if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.key==='z'&&e.shiftKey))){e.preventDefault();doRedo()}if(e.key==='Escape')closeMenus()});

(function init(){applyTheme();setAddStatus('nodata');initFirebase()})();
</script>
