<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b4fc4"><title>Nested Checklist Manager</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<style>
:root{--bg:#f4f6fb;--panel:#fff;--text:#0f172a;--muted:#778096;--line:#e5e9f2;--accent:#5267d9;--accent2:#e9edff;--danger:#d94343;--green:#21865b;--shadow:0 8px 28px #26345b12;--font-size:14px;--task-h:30px;
  --page-bg:radial-gradient(circle at 25% 30%,rgba(125,211,252,.7),transparent 45%),radial-gradient(circle at 75% 25%,rgba(134,239,172,.7),transparent 45%),radial-gradient(circle at 50% 85%,rgba(196,181,253,.7),transparent 50%),#ecfeff;
  --task-bg:linear-gradient(135deg,#0e7490,#14b8a6);--task-border:#0f172a;--task-text:#fff;
  --task-pct:#fff;--task-date:rgba(255,255,255,.85);--task-handle:rgba(255,255,255,.85);
  --task-plus-bg:rgba(255,255,255,.15);--task-plus-border:rgba(255,255,255,.3);--task-plus-text:#fff;
  --cl-bg:linear-gradient(135deg,#ccfbf1,#ecfccb);--cl-border:#0f172a;--cl-text:#0f172a;
  --cl-handle:#1e293b;--cl-plus-bg:#fff;--cl-plus-border:#0f172a;--cl-plus-text:#0f172a;
  --prog-bg:rgba(255,255,255,.2);--prog-fill:#0e7490;
  --line-dark:1px solid #0f172a;
}
*{box-sizing:border-box}
html,body{margin:0;height:auto}
body{background:var(--page-bg);background-attachment:fixed;color:var(--text);font:var(--font-size)/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial;min-height:100dvh;overflow-x:hidden;-webkit-user-select:none;user-select:none}
body.locked{overflow:hidden}
body.dark{background:#0f172a;color:#eef1fa}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:8px 12px;background:var(--accent);color:#fff;font-weight:600}
button.secondary{background:var(--accent2);color:var(--text)}
button.ghost{background:rgba(255,255,255,.6);color:var(--text);border:1px solid rgba(255,255,255,.8)}
button.danger{background:#ffe8e8;color:#a82020}
.hidden{display:none!important}

#fbPill{position:fixed;top:10px;left:50%;transform:translateX(-50%) translateY(-40px);background:#21865b;color:#fff;padding:6px 16px;border-radius:999px;font-size:12px;font-weight:700;box-shadow:0 6px 18px #21865b55;z-index:120;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
#fbPill.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fbPill.sync{background:#c07a1a;box-shadow:0 6px 18px #c07a1a55}
#fbPill.off{background:#d94343;box-shadow:0 6px 18px #d9434355}

#loader{position:fixed;inset:0;background:var(--page-bg);background-attachment:fixed;display:flex;align-items:center;justify-content:center;z-index:200;transition:opacity .3s}
#loader.hide{opacity:0;pointer-events:none}
.dots{display:flex;gap:8px}
.dots span{width:12px;height:12px;background:#5267d9;border-radius:50%;animation:dotBounce .6s ease-in-out infinite alternate}
.dots span:nth-child(2){animation-delay:.15s;background:#3b4fc4}
.dots span:nth-child(3){animation-delay:.3s;background:#2fa79b}
@keyframes dotBounce{from{transform:translateY(0);opacity:.6}to{transform:translateY(-14px);opacity:1}}

.app{max-width:1100px;margin:0 auto;padding:14px;padding-top:52px;min-height:100dvh;display:flex;flex-direction:column;justify-content:flex-start}
.main{background:transparent;padding:0;width:100%;max-width:760px;margin:0 auto}
.field{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:11px 12px;width:100%;font-size:var(--font-size);margin:2px 0;min-width:0}

.listWrap{background:transparent;border:0;padding:0}
.titem{margin:6px 0;position:relative;transition:opacity .3s ease}

.titem.task > .line{
  display:flex;align-items:center;gap:4px;
  padding:4px 4px 4px 10px;border-radius:4px;min-height:var(--task-h);
  background:var(--task-bg);border:var(--line-dark);color:var(--task-text);
  box-shadow:0 4px 14px rgba(15,23,42,.2);min-width:0;transition:box-shadow .3s;
}
.titem.checklist > .line{
  display:flex;align-items:center;gap:4px;
  padding:4px 4px 4px 10px;border-radius:4px;
  background:var(--cl-bg);border:var(--line-dark);color:var(--cl-text);
  box-shadow:0 2px 8px rgba(15,23,42,.12);min-width:0;transition:box-shadow .3s;
}
.line.flash{animation:flashPulse 2s ease forwards}
@keyframes flashPulse{
  0%{box-shadow:0 0 0 0 #ffe28a00,0 4px 14px rgba(15,23,42,.2)}
  20%{box-shadow:0 0 0 5px #ffe28a99,0 4px 14px rgba(15,23,42,.2)}
  100%{box-shadow:0 0 0 0 #ffe28a00,0 4px 14px rgba(15,23,42,.2)}
}

.handle{color:var(--task-handle);font-size:14px;flex:none;padding:0;margin:0;width:16px;text-align:center;display:inline-flex;align-items:center;justify-content:center;line-height:1;cursor:grab;touch-action:none}
.titem.checklist .handle{color:var(--cl-handle)}
.handle:active{cursor:grabbing}
.toggle{background:transparent;border:0;color:inherit;opacity:.8;font-size:12px;padding:0 2px;flex:none;transition:transform .3s;width:16px;text-align:center}
.toggle.collapsed{transform:rotate(-90deg)}

.check{width:15px;height:15px;accent-color:#0f172a;flex:none;margin:0}
.check.hidden-check{display:none}

.nameBlock{flex:1;min-width:0;display:flex;align-items:baseline;gap:4px;overflow:hidden;margin-left:2px}
.name{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:var(--font-size);color:inherit}
.name.done{text-decoration:line-through;opacity:.7}
.titem.task .name{color:var(--task-text)}
.titem.checklist .name{color:var(--cl-text)}
.lastDate{color:var(--task-date);font-size:10px;font-weight:600;flex:none;opacity:.85}
.titem.checklist .lastDate{color:var(--cl-text);opacity:.7}
.pct{color:var(--task-pct);font-weight:700;font-size:8px;flex:none;line-height:1}

.endGroup{display:flex;align-items:center;gap:3px;flex:none}
.plus{
  background:var(--task-plus-bg);border:1px solid var(--task-plus-border);color:var(--task-plus-text);
  border-radius:4px;padding:0 6px;font-weight:700;font-size:12px;flex:none;height:22px;line-height:20px;
  display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;
}
.titem.checklist .plus{background:var(--cl-plus-bg);border-color:var(--cl-plus-border);color:var(--cl-plus-text)}

.editBtn{background:transparent;color:inherit;opacity:.8;border:0;padding:2px 5px;font-size:12px;border-radius:4px;flex:none;cursor:pointer;margin-left:2px}
.editBtn:hover{background:rgba(255,255,255,.3)}
.unblod{color:inherit;opacity:.8;font-size:10px;font-weight:700;flex:none;margin-left:2px;cursor:pointer}

.taskProg{height:4px;overflow:hidden;width:100%;margin-top:2px;background:var(--prog-bg);border-radius:0 0 4px 4px}
.taskProg i{display:block;height:100%;background:var(--prog-fill);width:0;transition:width .8s cubic-bezier(.22,1,.36,1);will-change:width}

.childrenWrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .4s cubic-bezier(.22,1,.36,1),opacity .35s ease}
.childrenWrap.collapsed{grid-template-rows:0fr;opacity:0}
.childrenInner{overflow:hidden;min-height:0;padding:2px 0 4px 0}

.flyClone{position:fixed;z-index:9999;pointer-events:none;box-shadow:0 12px 30px rgba(15,23,42,.25);will-change:transform,opacity;border-radius:4px}
.placeholder{border:1px dashed rgba(15,23,42,.3);background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden;transition:height .5s cubic-bezier(.22,1,.36,1),opacity .3s ease,margin .5s cubic-bezier(.22,1,.36,1)}

.titem.fadeIn{animation:fadeIn .7s ease forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.inlineInput{display:flex;gap:6px;padding:3px 8px 5px 8px}
.inlineInput input{flex:1;border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-size:12px;min-width:0;background:var(--panel);color:var(--text)}
.floating{position:fixed;pointer-events:none;box-shadow:0 12px 28px #0005;z-index:9999;transform:scale(1.03);border:1px solid #c5cdf0;opacity:.95;border-radius:4px}
.placeholder2{border:2px dashed var(--accent);border-radius:4px;margin:4px 0;background:var(--accent2)}
.muted{color:var(--muted);font-size:12px}
.empty{text-align:center;color:var(--muted);padding:20px}
.pageFoot{text-align:center;font-size:11px;color:var(--muted);padding:14px 0 6px}

.modal{position:fixed;inset:0;background:#11182788;display:flex;align-items:flex-end;justify-content:center;padding:0 0 5px 0;z-index:60}
.modal-card{width:80%;max-width:80%;max-height:80vh;overflow:auto;background:#fff;border:1px solid #e5e9f2;border-radius:14px;box-shadow:0 -8px 28px #26345b33}
.modal-head{background:linear-gradient(135deg,#5267d9,#2fa79b);color:#fff;padding:5px 14px;font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.modal-head button{background:rgba(255,255,255,.25);border:0;color:#fff;border-radius:6px;padding:2px 8px;font-weight:700;font-size:12px;cursor:pointer}
.modal-body{padding:14px 16px}
.modal-actions{display:flex;gap:6px;padding:0 16px 14px}
.modal-actions button{flex:1;padding:9px 10px;border:0;border-radius:9px;font-weight:700;font-size:12px;cursor:pointer}
.modal-actions .s{background:#e9edff;color:#0f172a}
.modal-actions .p{background:#5267d9;color:#fff}

.optList{display:flex;flex-direction:column;gap:10px}
.optList button{width:100%;background:#fff;color:#0f172a;border:1px solid #d5dbee;border-radius:10px;padding:14px 16px;text-align:left;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.optList button:hover{background:#f7f9ff;border-color:#b9c2e0}

.moveTree{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow:auto}
.moveItem{background:#fff;border:1px solid #d5dbee;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center}
.moveItem:hover{background:#f7f9ff;border-color:#5267d9}
.moveItem.indent1{margin-left:16px}
.moveItem.indent2{margin-left:32px}
.moveItem.indent3{margin-left:48px}

.cdTable{width:100%;border-collapse:collapse;font-size:12px}
.cdTable th,.cdTable td{border:1px solid #d5dbee;padding:5px 8px;text-align:left}
.cdTable th{background:#dbe3ff;color:#3b4fc4;font-weight:700}
.cdTable td.sr{text-align:center;width:36px;color:#3b4fc4;font-weight:700}
.cdTable td.type.checked{color:#21865b;font-weight:700}
.cdTable td.type.unchecked{color:#c07a1a;font-weight:700}
.cdTable td.del{width:36px;text-align:center}
.delEntryBtn{background:transparent;border:0;color:#a82020;font-size:14px;cursor:pointer;padding:2px 6px;border-radius:4px}
.delEntryBtn:hover{background:#ffe8e8}

.settingsModal{background:#fff;border-radius:14px;box-shadow:0 -8px 28px #26345b33;width:80%;max-width:80%;max-height:80vh;display:flex;flex-direction:column;border:1px solid #e5e9f2;overflow:hidden}
.settingsModal .head{background:linear-gradient(135deg,#5267d9,#2fa79b);color:#fff;padding:5px 14px;font-weight:700;font-size:13px;flex:none;display:flex;justify-content:space-between;align-items:center}
.settingsModal .head button{background:rgba(255,255,255,.25);border:0;color:#fff;border-radius:4px;padding:2px 8px;font-weight:700;font-size:12px;cursor:pointer}
.settingsModal .body{padding:12px 16px;overflow-y:auto;overflow-x:hidden;flex:1 1 auto;box-sizing:border-box}
.setItem{border:1px solid #d5dbee;border-radius:4px;padding:6px 10px;margin:5px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;background:#fff;min-width:0;color:#0f172a}
.setItem span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.exportRow{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.miniBtn{background:#5267d9;color:#fff;border:0;border-radius:4px;padding:5px 10px;font-weight:600;font-size:12px;white-space:nowrap}
.stepper{display:inline-flex;align-items:center;gap:4px;flex:none}
.stepper button{background:#e9edff;color:#0f172a;border:0;border-radius:4px;width:24px;height:24px;font-weight:700;font-size:14px;padding:0}
.stepper span{min-width:36px;text-align:center;font-weight:600;font-size:13px}
.numInput{width:60px;border:1px solid #e5e9f2;border-radius:4px;padding:5px 8px;font-size:13px;background:#fff;color:#0f172a;text-align:center}
.switch{position:relative;width:38px;height:20px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#cfd5e6;border-radius:20px;transition:.2s;cursor:pointer}
.slider:before{content:"";position:absolute;height:14px;width:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .slider{background:#5267d9}
.switch input:checked + .slider:before{transform:translateX(18px)}

.themeSection{border:1px solid #d5dbee;border-radius:8px;padding:10px;margin:5px 0;background:#fbfcff}
.themeTitle{font-size:12px;font-weight:700;color:#3b4fc4;margin-bottom:8px}
.shipRow{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.shipRow::-webkit-scrollbar{height:5px}
.shipRow::-webkit-scrollbar-thumb{background:#c9d0e0;border-radius:3px}
.ship{flex:none;width:110px;scroll-snap-align:center;border:2px solid transparent;border-radius:12px;background:#fff;padding:6px 6px 8px;cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.1);transition:border-color .2s,transform .15s;text-align:center}
.ship:hover{transform:translateY(-2px)}
.ship.active{border-color:#5267d9;box-shadow:0 4px 14px rgba(82,103,217,.35)}
.preview{height:56px;border-radius:8px;position:relative;overflow:hidden;margin-bottom:6px}
.preview .mini{position:absolute;inset:8px;display:flex;flex-direction:column;gap:3px;justify-content:center}
.preview .mtask{height:8px;border-radius:3px}
.preview .mcl{height:6px;border-radius:3px;width:80%}
.shipLabel{font-size:10px;font-weight:600;color:#1b2340;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ship.active .shipLabel{color:#5267d9}

/* CHANGE LOG with collapse + delete */
.logBox{border:1px solid #c9d0e0;border-radius:10px;margin-top:10px;background:#fff;overflow:hidden}
.logDayRow{display:flex;align-items:center;gap:6px;background:#dbe3ff;padding:6px 10px;border-bottom:1px solid #5267d9}
.logDayRow:not(:first-child){border-top:1px solid #5267d9}
.logToggle{background:transparent;border:0;color:#3b4fc4;font-weight:700;font-size:12px;padding:0;cursor:pointer;width:16px;text-align:center}
.logDayText{flex:1;font-weight:700;font-size:12px;color:#3b4fc4}
.logVTag{font-weight:700;color:#3b4fc4;font-size:11px;margin-left:4px}
.logDelDay{background:transparent;border:0;color:#a82020;font-size:13px;cursor:pointer;padding:0 4px}
.logDelDay:hover{background:#ffe8e8;border-radius:4px}
.logEntries{overflow:hidden;transition:max-height .35s ease,opacity .25s ease}
.logEntries.collapsed{max-height:0!important;opacity:0}
.logEntry{padding:5px 10px;border-bottom:1px solid #eef0f5;font-size:12.5px;line-height:1.45;display:flex;gap:6px}
.logEntry:last-child{border-bottom:0}
.logNum{flex:none;color:#3b4fc4;font-weight:700}
.logEmpty{padding:16px;text-align:center;color:#778096;font-size:12px}
.logTopBar{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 8px;font-size:12px;color:#5267d9;font-weight:700}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1b2340;color:#fff;padding:10px 16px 8px;border-radius:10px;box-shadow:0 8px 24px #0005;display:flex;flex-direction:column;gap:6px;font-size:13px;z-index:90;opacity:0;pointer-events:none;transition:.25s;min-width:200px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast .row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.toast button{background:#91a0ff;color:#10152a;border:0;border-radius:7px;padding:5px 10px;font-weight:700;font-size:12px}
.toast .bar{height:4px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
.toast .bar i{display:block;height:100%;background:#91a0ff;width:100%}
.toast .bar.anim i{animation:shrink var(--dur,5s) linear forwards}
@keyframes shrink{from{width:100%}to{width:0%}}

@media(max-width:760px){
  body{font-size:12px}
  .app{padding:8px;padding-top:48px}
  .main{max-width:100%}
  .modal-card,.settingsModal{width:80%;max-width:80%;max-height:85vh}
  .modal-body{padding:10px 12px}
  .optList button{padding:12px 14px;font-size:13px}
  #fbPill{font-size:11px;padding:5px 13px}
}

function showFbPill(text,type){let p=$('fbPill');p.textContent=text;p.className='show'+(type?' '+type:'');clearTimeout(p._t);p._t=setTimeout(()=>{p.className=''},2000)}
function find(idv){let out=null;walk(data.items,x=>{if(x.id===idv)out=x});return out}
function walk(list,fn){list.forEach(x=>{fn(x);walk(x.children||[],fn)})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function locate(list,idv,parent=null){for(let i=0;i<list.length;i++){if(list[i].id===idv)return{list,index:i,item:list[i],parent};let r=locate(list[i].children||[],idv,list[i]);if(r)return r}return null}
function changed(){scheduleSave();render()}
function scheduleSave(){try{localStorage.setItem('nestedChecklistCache',JSON.stringify(data))}catch(e){};showFbPill(navigator.onLine?'Syncing…':'Offline',navigator.onLine?'sync':'off');clearTimeout(window._saveTimer);window._saveTimer=setTimeout(saveRemote,650)}
async function saveRemote(){if(!uid||!navigator.onLine)return;try{await DOC.set({owner:uid,appData:data,updatedAt:now()},{merge:true});showFbPill('Synced')}catch(e){showFbPill('Sync pending','off')}}

function newItem(name,type){let t=now();return{id:uidGen(),type:type||'checklist',name:name,createdAt:t,updatedAt:t,completed:false,completedAt:null,favorite:false,pinned:false,checkCount:0,history:[],children:[],collapsed:false,deletedAt:null}}
const CURRENT_CHANGES=[
  "Check/uncheck: item task ke andar hi rehta hai (drop/rise animation)",
  "Har load par next theme, Freeze switch",
  "Progress bar ka rang theme shade",
  "Change Log: date expand/collapse, state save, expand all, date delete bina confirm (5s undo)",
  "Task header par sirf + buttons; baqi jagah click se expand/collapse",
  "Task header height stepper (1px jump, default 30, min -5%, max +50%)"
];
function autoSeedChangelog(){data.changelog=data.changelog||[];let today=new Date().toDateString();let has=data.changelog.some(c=>new Date(c.at).toDateString()===today&&CURRENT_CHANGES.includes(c.text));if(has)return;CURRENT_CHANGES.forEach(text=>{data.changelog.push({at:now(),text})});if(data.changelog.length>500)data.changelog=data.changelog.slice(-500)}

function countTasks(x){let n=x.type==='checklist'?1:0;(x.children||[]).forEach(c=>n+=countTasks(c));return n}
function doneTasks(x){let n=x.type==='checklist'&&x.completed?1:0;(x.children||[]).forEach(c=>n+=doneTasks(c));return n}
function pct(x){let n=countTasks(x);return n?Math.round(doneTasks(x)/n*100):0}

function showToast(msg,secs,onUndo){
  let t=$('undoToast');$('undoMsg').textContent=msg;
  let bar=$('undoBar');bar.style.setProperty('--dur',secs+'s');bar.classList.remove('anim');void bar.offsetWidth;bar.classList.add('anim');
  $('undoAction').style.display=onUndo?'':'none';
  $('undoAction').onclick=()=>{if(onUndo)onUndo();t.classList.remove('show');clearTimeout(undoToastTimer)};
  t.classList.add('show');clearTimeout(undoToastTimer);
  undoToastTimer=setTimeout(()=>{t.classList.remove('show');lastUndoSnapshot=null},secs*1000);
}
function showUndoToast(snapshot){lastUndoSnapshot=snapshot;showToast('Item deleted',data.settings.undoSeconds||5,()=>{if(lastUndoSnapshot){data=JSON.parse(lastUndoSnapshot);lastUndoSnapshot=null;changed()}})}

function autoCleanup(){let days=data.settings.autoDeleteDays||0;if(days<=0)return;let cutoff=Date.now()-days*86400000;function clean(list){for(let i=list.length-1;i>=0;i--){let x=list[i];clean(x.children||[]);if(x.completed&&x.completedAt&&new Date(x.completedAt).getTime()<cutoff)list.splice(i,1)}}let before=JSON.stringify(data.items);clean(data.items);if(before!==JSON.stringify(data.items))scheduleSave()}

function matchSearch(x){let q=(window._searchQ||'').toLowerCase().trim();if(!q)return true;return (x.name||'').toLowerCase().includes(q)||(x.type||'').toLowerCase().includes(q)}

function editBtns(x){if(!data.settings.editMode)return '';return `<button class="editBtn" data-act="rename" data-id="${x.id}" title="Rename">✎</button><button class="editBtn" data-act="fav" data-id="${x.id}" title="Favorite">${x.favorite?'⭐':'☆'}</button><button class="editBtn" data-act="pin" data-id="${x.id}" title="Pin">${x.pinned?'📌':'⌖'}</button><button class="editBtn" data-act="del" data-id="${x.id}" title="Delete">🗑</button>`}

function renderItem(x){
  let has=x.children&&x.children.length>0;
  let canHaveChildren=x.type==='task';
  let chkHide=data.settings.showCheckboxes===false;
  let chk=x.type==='checklist'?`<input class="check ${chkHide?'hidden-check':''}" type="checkbox" data-act="complete" data-id="${x.id}" ${x.completed?'checked':''}>`:'';
  let toggle=has?`<button class="toggle ${x.collapsed?'collapsed':''}" data-act="collapse" data-id="${x.id}">▾</button>`:'<span style="width:16px;display:inline-block"></span>';
  let plusTask=canHaveChildren&&data.settings.display.addbtn?`<button class="plus" data-act="plustask" data-id="${x.id}" title="Add Task">＋</button>`:'';
  let plusCl=canHaveChildren&&data.settings.display.addbtn?`<button class="plus cl" data-act="pluscl" data-id="${x.id}" title="Add Checklist">＋</button>`:'';
  let flashClass=x.id===flashingId?(flashType==='toDone'?'flash':'flashBack'):'';
  let count=(x.checkCount||0)>0?`<span class="unblod" data-act="showHistory" data-id="${x.id}" title="Check count">(${x.checkCount})</span>`:'';
  let pctHtml=(x.type==='task')?`<span class="pct">(${pct(x)}%)</span>`:'';
  let dateHtml=x.updatedAt?`<span class="lastDate">${shortDate(x.updatedAt)}</span>`:'';
  let kids=x.children||[];let undone=kids.filter(c=>!c.completed);let done=kids.filter(c=>c.completed);
  let childrenHtml='';
  if(x.type!=='checklist'&&has){childrenHtml=undone.map(c=>renderItem(c)).join('')+done.map(c=>renderItem(c)).join('')}
  let progHtml='';
  if(x.type==='task'&&data.settings.display.progressbar){let p=pct(x);progHtml=`<div class="taskProg"><i data-prog-id="${x.id}" style="width:${p}%"></i></div>`}
  let childrenBlock='';
  if(x.type!=='checklist'&&has){childrenBlock=`<div class="childrenWrap ${x.collapsed?'collapsed':''}" data-children-id="${x.id}"><div class="childrenInner">${childrenHtml}</div></div>`}
  return `<div class="titem ${x.type} ${x.completed?'done':''}" data-id="${x.id}">
    <div class="line ${flashClass}">
      <span class="handle" data-handle="1">⠿</span>
      ${toggle}${chk}
      <div class="nameBlock">
        <span class="name ${x.completed?'done':''}">${esc(x.name)}</span>
        ${dateHtml}
      </div>
      ${count}
      <div class="endGroup">${pctHtml}${plusTask}${plusCl}</div>
      ${editBtns(x)}
    </div>
    ${progHtml}
    ${activeInput===x.id?`<div class="inlineInput"><input id="inp_${x.id}" data-parent="${x.id}" placeholder="Type and press Enter…"></div>`:''}
    ${childrenBlock}
  </div>`;
}

function renderHome(){
  let activeList=[],doneList=[];
  data.items.forEach(i=>{if(i.id===flashingId){if(flashType==='toDone')activeList.push(i);else doneList.push(i)}else{(i.completed?doneList:activeList).push(i)}});
  let activeHtml=activeList.filter(matchSearch).map(i=>renderItem(i)).join('');
  let doneHtml=doneList.filter(matchSearch).map(i=>renderItem(i)).join('');
  let html='<div class="listWrap" id="listWrap">'+activeHtml;
  if(!activeHtml&&!doneHtml)html+='<div class="empty">No items yet. Swipe up to add a new one.</div>';
  if(doneHtml)html+='<div class="doneArea" data-done>'+doneHtml+'</div>';
  else html+='<div class="doneArea" data-done></div>';
  html+='</div>';
  $('content').innerHTML=html;
  attachHomeHandlers();
}

/* DROP/RISE animation */
function animateMove(cb){
  let item=cb.closest('.titem');
  if(item.dataset.moving)return;
  item.dataset.moving='1';
  cb.disabled=true;
  let isCheck=cb.checked;

  let line=item.querySelector(':scope > .line');
  line.classList.add('flash');

  setTimeout(()=>{
    let from=item.getBoundingClientRect();
    let ph=document.createElement('div');
    ph.className='placeholder';
    ph.style.height=from.height+'px';
    item.parentNode.insertBefore(ph,item);
    item.style.visibility='hidden';

    // keep item in same parent always; reorder inside its own parent only
    let parentList=item.parentNode;
    if(isCheck){
      item.classList.add('done');
      parentList.appendChild(item);
    } else {
      item.classList.remove('done');
      parentList.insertBefore(item,parentList.firstChild);
    }
    line.classList.remove('flash');

    let to=item.getBoundingClientRect();
    let clone=item.cloneNode(true);
    clone.classList.add('flyClone');
    clone.style.left=from.left+'px';clone.style.top=from.top+'px';
    clone.style.width=from.width+'px';clone.style.height=from.height+'px';
    document.body.appendChild(clone);

    let dx=to.left-from.left, dy=to.top-from.top;
    let kf;
    if(isCheck){
      kf=[
        {transform:`translate(0px, -40px) scale(.95)`,opacity:0},
        {transform:`translate(${dx}px, ${dy}px) scale(1)`,opacity:1,offset:.7},
        {transform:`translate(${dx}px, ${dy}px) scale(.96)`,opacity:.1}
      ];
    } else {
      kf=[
        {transform:`translate(0px, 40px) scale(.95)`,opacity:0},
        {transform:`translate(${dx}px, ${dy}px) scale(1)`,opacity:1,offset:.7},
        {transform:`translate(${dx}px, ${dy}px) scale(.96)`,opacity:.1}
      ];
    }
    let dur=900;
    clone.animate(kf,{duration:dur,easing:'cubic-bezier(.22,1,.36,1)',fill:'forwards'});
    setTimeout(()=>{ph.style.height='0px';ph.style.opacity='0';ph.style.marginTop='-4px'},50);
    setTimeout(()=>{
      ph.remove();clone.remove();
      item.style.visibility='';
      item.classList.add('fadeIn');
      setTimeout(()=>item.classList.remove('fadeIn'),800);
      cb.disabled=false;
      delete item.dataset.moving;
    },dur+100);
  },2000);
}

function attachHomeHandlers(){
  document.querySelectorAll('.titem .check').forEach(cb=>{
    cb.onchange=()=>{
      let id=cb.dataset.id,it=find(id);if(!it)return;
      let goingToDone=cb.checked;
      it.completed=goingToDone;it.completedAt=goingToDone?now():null;it.updatedAt=now();
      it.checkCount=(it.checkCount||0)+1;
      it.history=it.history||[];it.history.push({status:goingToDone?'Checked':'Unchecked',at:now()});

      let taskEl=cb.closest('.titem.task');
      if(taskEl){
        let task=find(taskEl.dataset.id);
        if(task){
          let p=pct(task);
          let barEl=taskEl.querySelector('[data-prog-id]');
          if(barEl)barEl.style.width=p+'%';
          let pctEl=taskEl.querySelector('.pct');
          if(pctEl)pctEl.textContent='('+p+'%)';
        }
      }
      let countEl=cb.closest('.titem').querySelector('.unblod');
      if(countEl){countEl.textContent='('+it.checkCount+')'}
      else {
        let line=cb.closest('.line');
        let endGroup=line.querySelector('.endGroup');
        if(endGroup){
          let sp=document.createElement('span');
          sp.className='unblod';sp.dataset.act='showHistory';sp.dataset.id=it.id;
          sp.textContent='('+it.checkCount+')';
          line.insertBefore(sp,endGroup);
        }
      }

      animateMove(cb);
      clearTimeout(timers[id]);
      timers[id]=setTimeout(()=>{scheduleSave()},5200);
    };
  });

  // checklist line click -> toggle checkbox
  document.querySelectorAll('.titem.checklist > .line').forEach(line=>{
    line.addEventListener('click',e=>{
      if(e.target.closest('.check,.plus,.editBtn,.handle,.toggle,.unblod'))return;
      let cb=line.querySelector('.check');
      if(cb){cb.checked=!cb.checked;cb.dispatchEvent(new Event('change'))}
    });
  });

  // task header click -> expand/collapse (only if not on any button/control)
  document.querySelectorAll('.titem.task > .line').forEach(line=>{
    line.addEventListener('click',e=>{
      if(e.target.closest('.check,.plus,.editBtn,.handle,.toggle,.unblod'))return;
      let id=line.closest('.titem').dataset.id;
      let x=find(id);
      if(x&&(x.children&&x.children.length)){
        x.collapsed=!x.collapsed;
        let wrap=document.querySelector('[data-children-id="'+x.id+'"]');
        if(wrap)wrap.classList.toggle('collapsed',x.collapsed);
        let tg=document.querySelector('.toggle[data-id="'+x.id+'"]');
        if(tg)tg.classList.toggle('collapsed',x.collapsed);
        scheduleSave();
      }
    });
  });

  document.querySelectorAll('.titem .toggle').forEach(b=>{b.onclick=(e)=>{
    e.stopPropagation();
    let x=find(b.dataset.id);if(x){
      x.collapsed=!x.collapsed;
      let wrap=document.querySelector('[data-children-id="'+x.id+'"]');
      if(wrap)wrap.classList.toggle('collapsed',x.collapsed);
      b.classList.toggle('collapsed',x.collapsed);
      scheduleSave();
    }
  }});
  document.querySelectorAll('.titem .plus').forEach(b=>{b.onclick=(e)=>{e.stopPropagation();let id=b.dataset.id,x=find(id);if(!x||x.type!=='task')return;let type=b.classList.contains('cl')?'checklist':'task';startInline(id,type)}});
  document.querySelectorAll('.titem [data-act="del"]').forEach(b=>{b.onclick=(e)=>{e.stopPropagation();deleteItem(b.dataset.id)}});
  document.querySelectorAll('.titem [data-act="rename"]').forEach(b=>{b.onclick=(e)=>{e.stopPropagation();openRenameModal(b.dataset.id)}});

function attachDrag(handle,el){
  let active=false,floating=null,placeholder=null,offsetY=0;
  function onDown(e){
    e.preventDefault();e.stopPropagation();active=true;
    let rect=el.getBoundingClientRect();let cy=(e.touches?e.touches[0].clientY:e.clientY);offsetY=cy-rect.top;
    floating=el.cloneNode(true);floating.classList.add('floating');
    floating.style.width=rect.width+'px';floating.style.left=rect.left+'px';floating.style.top=rect.top+'px';
    document.body.appendChild(floating);
    placeholder=document.createElement('div');placeholder.className='placeholder2';placeholder.style.height=rect.height+'px';
    el.style.display='none';el.parentNode.insertBefore(placeholder,el.nextSibling);
    window.addEventListener('touchmove',onMove,{passive:false});window.addEventListener('touchend',onUp);
    window.addEventListener('mousemove',onMove);window.addEventListener('mouseup',onUp);
  }
  function onMove(e){
    if(!active)return;if(e.cancelable)e.preventDefault();
    let cy=(e.touches?e.touches[0].clientY:e.clientY);floating.style.top=(cy-offsetY)+'px';
    let parent=el.parentNode;let all=[...parent.querySelectorAll(':scope > .titem')].filter(x=>x!==el);let target=null;
    all.forEach(x=>{let r=x.getBoundingClientRect();if(cy>r.top&&cy<r.bottom)target=x});
    if(target){let r=target.getBoundingClientRect();let mid=(r.top+r.bottom)/2;if(cy<mid)parent.insertBefore(placeholder,target);else parent.insertBefore(placeholder,target.nextSibling)}
  }
  function onUp(){
    if(!active)return;active=false;
    let parent=el.parentNode;let siblings=[...parent.children];let pos=siblings.indexOf(placeholder);
    let before=siblings.slice(0,pos).filter(n=>n.dataset&&n.dataset.id).map(n=>n.dataset.id);
    let after=siblings.slice(pos).filter(n=>n.dataset&&n.dataset.id).map(n=>n.dataset.id);
    let id=el.dataset.id;before=before.filter(x=>x!==id);after=after.filter(x=>x!==id);
    let finalIds=[...before,id,...after];
    let parentId=parent.closest('.titem')?.dataset.id;
    let arr=parentId?find(parentId).children:data.items;
    arr.sort((a,b)=>finalIds.indexOf(a.id)-finalIds.indexOf(b.id));
    floating.remove();placeholder.remove();
    window.removeEventListener('touchmove',onMove);window.removeEventListener('touchend',onUp);
    window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);
    changed();
  }
  handle.addEventListener('touchstart',onDown,{passive:false});
  handle.addEventListener('mousedown',onDown);
}

function doMove(idv,targetId){

  else{
    html='<table class="cdTable"><thead><tr><th>Sr</th><th>Type</th><th>Date</th><th></th></tr></thead><tbody>';
    hist.forEach((h,i)=>{
      let cls=h.status==='Checked'?'checked':'unchecked';
      html+=`<tr><td class="sr">${i+1}</td><td class="type ${cls}">${esc(h.status)}</td><td>${new Date(h.at).toLocaleString()}</td><td class="del"><button class="delEntryBtn" data-del-entry="${i}">🗑</button></td></tr>`;
    });

  }
  $('modalBody').innerHTML=html;
  $('modalActions').style.display='none';$('modalActions').innerHTML='';
  $('modal').classList.remove('hidden');
  $('modalBody').querySelectorAll('[data-del-entry]').forEach(btn=>{
    btn.onclick=()=>{
      let idx=+btn.dataset.delEntry;

function exportTablePdf(){
  let w=window.open('','_blank');
  let styles='body{font-family:system-ui,Arial;padding:24px}h1{font-size:18px}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}th,td{border:1px solid #999;padding:6px 9px;text-align:left;vertical-align:top}th{background:#dbe3ff;color:#3b4fc4;font-weight:700}td.sr{text-align:center;width:40px}.pend{display:block;line-height:1.6}.done{display:block;line-height:1.6;color:#21865b;text-decoration:line-through}.taskHead{font-size:15px;font-weight:800;margin:18px 0 6px}';
  let html='<html><head><title>Export</title><style>'+styles+'</style></head><body>';
  function walkVisibleTasks(list){
    list.forEach(x=>{
      if(x.hidden||x.archived)return;
      if(x.type==='task'){
        let kids=x.children||[];
        let pend=kids.filter(c=>c.type==='checklist'&&!c.completed);
        let done=kids.filter(c=>c.type==='checklist'&&c.completed);
        html+=`<div class="taskHead">Task Name: ${esc(x.name)}</div>`;
        html+='<table><thead><tr><th class="sr">Ser</th><th>Pend</th><th>Done</th></tr></thead><tbody>';
        if(!pend.length&&!done.length){html+='<tr><td class="sr">1</td><td>—</td><td>—</td></tr>'}
        else{let maxRows=Math.max(pend.length,done.length);for(let i=0;i<maxRows;i++){html+=`<tr><td class="sr">${i+1}</td><td>${pend[i]?`<span class="pend">${esc(pend[i].name)}</span>`:''}</td><td>${done[i]?`<span class="done">${esc(done[i].name)}</span>`:''}</td></tr>`}}
        html+='</tbody></table>';
      }
      walkVisibleTasks(x.children||[]);
    });
  }
  walkVisibleTasks(data.items);
  html+='</body></html>';
  w.document.write(html);w.document.close();
  setTimeout(()=>{w.print()},300);
}

$('settingsWrap').addEventListener('click',e=>{if(e.target===$('settingsWrap'))closeSettings()});

function openLogModal(){
  document.body.classList.add('locked');
  $('logModalWrap').classList.remove('hidden');
  $('logModalWrap').innerHTML=`<div class="settingsModal">
    <div class="head"><span>📅 Change Log</span><button id="closeLogTop">✕</button></div>
    <div class="body">
      <div class="logTopBar">
        <span>Total entries: ${(data.changelog||[]).length}</span>
        <button class="miniBtn" id="expandAllLog">Expand All</button>
      </div>
      <div id="logBoxWrap"></div>
    </div>
  </div>`;
  $('closeLogTop').onclick=closeLogModal;
  let allExpanded=false;
  $('expandAllLog').onclick=()=>{
    allExpanded=!allExpanded;
    data.logCollapsed={};
    let logs=(data.changelog||[]).slice().sort((a,b)=>new Date(b.at)-new Date(a.at));
    let days=new Set(logs.map(c=>new Date(c.at).toDateString()));
    days.forEach(d=>{data.logCollapsed[d]=!allExpanded});
    $('expandAllLog').textContent=allExpanded?'Collapse All':'Expand All';
    scheduleSave();renderLogBox($('logBoxWrap'));
  };
  renderLogBox($('logBoxWrap'));
}
function closeLogModal(){document.body.classList.remove('locked');$('logModalWrap').classList.add('hidden');$('logModalWrap').innerHTML='';view='home';render()}
$('logModalWrap').addEventListener('click',e=>{if(e.target===$('logModalWrap'))closeLogModal()});

function renderLogBox(wrap){
  let logs=(data.changelog||[]).slice().sort((a,b)=>new Date(b.at)-new Date(a.at));
  if(!logs.length){wrap.innerHTML='<div class="logBox"><div class="logEmpty">No changes yet.</div></div>';return}
  let groups={},order=[];
  logs.forEach(c=>{let k=new Date(c.at).toDateString();if(!groups[k]){groups[k]=[];order.push(k)}groups[k].push(c)});
  let html='<div class="logBox">';
  order.forEach((day,i)=>{
    let collapsed=data.logCollapsed[day]||false;
    html+=`<div class="logDayRow">
      <button class="logToggle" data-toggle-day="${esc(day)}">${collapsed?'▸':'▾'}</button>
      <span class="logDayText">${day} <span class="logVTag">(V${i+1})</span></span>
      <button class="logDelDay" data-del-day="${esc(day)}" title="Delete this day">🗑</button>
    </div>`;
    html+=`<div class="logEntries ${collapsed?'collapsed':''}" data-entries-day="${esc(day)}">`;
    groups[day].forEach((c,idx)=>{html+=`<div class="logEntry"><span class="logNum">${idx+1}.</span><span>${esc(c.text)}</span></div>`});
    html+='</div>';
  });
  html+='</div>';wrap.innerHTML=html;
  // apply max-height for collapse
  wrap.querySelectorAll('.logEntries').forEach(el=>{
    if(!el.classList.contains('collapsed'))el.style.maxHeight=el.scrollHeight+'px';
  });
  wrap.querySelectorAll('[data-toggle-day]').forEach(btn=>{
    btn.onclick=()=>{
      let day=btn.dataset.toggleDay;
      let ent=wrap.querySelector('[data-entries-day="'+CSS.escape(day)+'"]');
      if(!ent)return;
      let nowCollapsed=!ent.classList.contains('collapsed');
      ent.classList.toggle('collapsed',nowCollapsed);
      data.logCollapsed[day]=nowCollapsed;
      if(nowCollapsed){ent.style.maxHeight='0px'}
      else{ent.style.maxHeight=ent.scrollHeight+'px'}
      btn.textContent=nowCollapsed?'▸':'▾';
      scheduleSave();
    };
  });
  wrap.querySelectorAll('[data-del-day]').forEach(btn=>{
    btn.onclick=()=>{
      let day=btn.dataset.delDay;
      let before=data.changelog.slice();
      let removed=data.changelog.filter(c=>new Date(c.at).toDateString()===day).length;
      data.changelog=data.changelog.filter(c=>new Date(c.at).toDateString()!==day);
      lastUndoSnapshot=JSON.stringify({changelog:before});
      scheduleSave();
      renderLogBox(wrap);
      showToast(`Removed ${removed} entries`,5,()=>{
        let s=JSON.parse(lastUndoSnapshot);data.changelog=s.changelog;lastUndoSnapshot=null;scheduleSave();renderLogBox(wrap);
      });
    };
  });
}

$('content').addEventListener('click',e=>{
  let b=e.target.closest('[data-act]');if(!b)return;
  let a=b.dataset.act,idv=b.dataset.id;
  if(a==='restore')restoreItem(idv);
  if(a==='purge'){let snap=JSON.stringify(data);let x=data.trash.find(t=>t.id===idv);data.trash=data.trash.filter(t=>t.id!==idv);changed();showUndoToast(snap)}
});
function restoreItem(idv){let i=(data.trash||[]).findIndex(x=>x.id===idv);if(i<0)return;let x=data.trash.splice(i,1)[0];x.deletedAt=null;data.items.push(x);changed()}

function startAnon(){auth.signInAnonymously().catch(e=>{$('app').classList.remove('hidden');$('loader').classList.add('hide');showFbPill('Offline','off');render()})}
auth.onAuthStateChanged(async user=>{
  if(!user){uid=null;startAnon();return}
  uid=user.uid;
  try{let doc=await DOC.get();if(doc.exists&&doc.data().owner===uid&&doc.data().appData){data=doc.data().appData}else{let c=localStorage.getItem('nestedChecklistCache');if(c)data=JSON.parse(c);await saveRemote()}
    if(!data.settings.display)data.settings.display={progressbar:true,addbtn:true};
    if(!data.settings.fontSize)data.settings.fontSize=14;
    if(!data.settings.undoSeconds)data.settings.undoSeconds=5;
    if(!data.settings.autoDeleteDays)data.settings.autoDeleteDays=7;
    if(!data.settings.taskHeaderHeight)data.settings.taskHeaderHeight=30;
    if(!data.logCollapsed)data.logCollapsed={};
    if(data.settings.pageTheme===undefined)data.settings.pageTheme='t1';
    if(data.settings.showCheckboxes===undefined)data.settings.showCheckboxes=true;

    // Auto-advance theme if not frozen
    if(!data.settings.themeFreeze){
      let keys=Object.keys(THEMES);
      let idx=keys.indexOf(data.settings.pageTheme);
      if(idx<0)idx=0;
      idx=(idx+1)%keys.length;
      data.settings.pageTheme=keys[idx];
    }

    if(!data.changelog)data.changelog=[];
    autoSeedChangelog();
    showFbPill('Synced');
  }catch(e){let c=localStorage.getItem('nestedChecklistCache');if(c)data=JSON.parse(c);showFbPill('Offline','off')}
  autoCleanup();
  $('app').classList.remove('hidden');$('loader').classList.add('hide');render();
});
window.addEventListener('online',saveRemote);
window.addEventListener('offline',()=>showFbPill('Offline','off'));

function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}

startAnon();
