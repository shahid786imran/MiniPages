<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Google Drive Link Manager</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root {
  --grad-1: #e6f0ff; --grad-2: #e4f2ee; --grad-3: #e9f0f8;
  --surface: #ffffff; --surface-2: #eef1f7;
  --border: #d9dee8; --divider-strong: #a0a8b8;
  --text: #1a1d23; --muted: #667085;
  --accent: #4f8cff; --danger: #ef4444;
  --green: #22c55e; --amber: #f59e0b; --grey: #9ca3af;
  --shadow: 0 2px 10px rgba(0,0,0,0.08);
  --radius: 12px;
  --left-bar-width: 250px;
  --right-bar-width: 250px;
  --bar-bg: linear-gradient(160deg, #ebf3fc 0%, #e6f2ed 100%);
  --tag-bg: rgba(0,0,0,0.05);
  --tag-text: #5a6272;
  --tag-border: rgba(0,0,0,0.08);
  --modal-border: #d9dee8;
  --card-border-width: 1px;
  --card-border-color: #d9dee8;
  --timer-color: #000000;
  --settings-modal-height: 50vh;
}
html[data-theme="night"] {
  --grad-1: #000000; --grad-2: #000000; --grad-3: #000000;
  --surface: #000000; --surface-2: #0a0a0a;
  --border: #1a1a1a; --divider-strong: #30363f;
  --text: #e7ebf3; --muted: #8b93a3;
  --shadow: 0 2px 10px rgba(0,0,0,0.6);
  --bar-bg: #000000;
  --tag-bg: rgba(255,255,255,0.05);
  --tag-text: #9099a8;
  --tag-border: rgba(255,255,255,0.08);
  --modal-border: #4a4a4a;
  --card-border-color: #1a1a1a;
  --timer-color: #ffffff;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  background: linear-gradient(135deg, var(--grad-1) 0%, var(--grad-2) 50%, var(--grad-3) 100%);
  background-attachment: fixed;
  min-height: 100vh;
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
}
input, textarea { user-select: text; -webkit-user-select: text; }

/* ========== HEADER ========== */
header.app-header {
  position: sticky; top: 0; z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 10px;
  display: flex; align-items: center; gap: 6px;
}
html[data-theme="day"] header.app-header {
  background: rgba(255,255,255,0.82);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
header.app-header .icon-btn {
  background: transparent; border: 1px solid var(--border);
  color: var(--text);
  width: 36px; height: 36px;
  border-radius: 10px;
  font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  touch-action: manipulation;
}
header.app-header .icon-btn.hidden { display: none; }
header.app-header .search-wrap {
  flex: 1;
  display: flex; align-items: center;
  margin: 0 4px;
  min-width: 0;
  justify-content: center;
}
header.app-header .search-wrap input {
  width: 50%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 10px;
  border-radius: 10px;
  font-size: 13px;
  outline: none;
  transition: width 0.2s ease;
}
header.app-header .search-wrap input:focus { border-color: var(--accent); width: 100%; }
header.app-header .timer {
  font-size: 12px; font-weight: bold;
  color: var(--timer-color);
  white-space: nowrap;
  margin-right: 4px;
  cursor: pointer; user-select: none;
}
header.app-header #searchBack { display: none; }
header.app-header.search-active > *:not(.search-wrap):not(#searchBack) { display: none; }
header.app-header.search-active #searchBack { display: flex; }
header.app-header.search-active .search-wrap { margin: 0 6px; }
header.app-header.search-active .search-wrap input { width: 100%; }

#addBtn { border: 1px solid var(--border); transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
#addBtn.status-green { background: var(--green); color: #fff; border-color: var(--green); animation: breatheGreen 2s ease-in-out infinite; }
#addBtn.status-amber { background: var(--amber); color: #fff; border-color: var(--amber); animation: breatheAmber 1.2s ease-in-out infinite; }
#addBtn.status-grey  { background: var(--grey);  color: #fff; border-color: var(--grey);  animation: none; }
#addBtn[disabled] { cursor: not-allowed; }
@keyframes breatheGreen { 0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.6); } 50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); } }
@keyframes breatheAmber { 0%,100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.7); } 50% { box-shadow: 0 0 0 6px rgba(245,158,11,0); } }

main { max-width: 900px; margin: 0 auto; padding: 12px; padding-bottom: 40px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--muted); padding: 5px 10px;
  border-radius: 999px; font-size: 12px;
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  touch-action: manipulation; user-select: none; white-space: nowrap;
}
.chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.tag {
  background: var(--tag-bg);
  color: var(--tag-text);
  border: 1px solid var(--tag-border);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.2px;
}

.card {
  background: var(--surface);
  border-style: solid;
  border-width: var(--card-border-width);
  border-color: var(--card-border-color);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  cursor: pointer; position: relative;
  transition: border-color 0.15s ease;
}
.card.edit-mode { border-color: var(--accent); cursor: default; }
.card .line-title { font-size: 15px; font-weight: 700; word-break: break-word; }
.card .line-desc  { font-size: 13px; color: var(--muted); word-break: break-word; }
.card .line-link  {
  font-size: 11px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 100%; direction: ltr; display: block;
}
.card .line-tags  { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.card .line-cat   { font-size: 11px; color: var(--muted); margin-top: 4px; }
.card .edit-actions { display: none; position: absolute; top: 6px; right: 6px; gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 12px); }
.card.edit-mode .edit-actions { display: flex; }

#linksList.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
#linksList.grid .card { margin-bottom: 0; }

.empty { text-align: center; color: var(--muted); padding: 40px 12px; font-size: 14px; }

footer.app-footer {
  text-align: center;
  padding: 20px 12px 10px;
  font-size: 10px;
  color: #000;
  font-weight: 500;
  letter-spacing: 0.3px;
}
html[data-theme="night"] footer.app-footer { color: #e7ebf3; }

/* ========== SIDE BARS ========== */
.side-bar {
  position: fixed; top: 0; bottom: 0;
  width: var(--left-bar-width);
  background: var(--bar-bg);
  border-right: 1px solid var(--border);
  z-index: 90;
  transform: translateX(-100%);
  transition: transform 0.25s ease;
  overflow-y: auto;
  padding: 16px 12px 16px;
  box-shadow: 4px 0 20px rgba(0,0,0,0.25);
  display: flex; flex-direction: column;
  touch-action: pan-y;
  overscroll-behavior: contain;
}
.side-bar.right {
  right: 0; left: auto;
  width: var(--right-bar-width);
  border-right: none; border-left: 1px solid var(--border);
  transform: translateX(100%);
  box-shadow: -4px 0 20px rgba(0,0,0,0.25);
}
.side-bar.open { transform: translateX(0); }
.side-bar h3 {
  font-size: 12px; text-transform: uppercase;
  letter-spacing: 0.8px; color: var(--muted);
  margin: 14px 0 8px;
}
.side-bar h3.section-divider {
  border-top: 1px solid var(--border);
  padding-top: 14px;
}
.side-bar .side-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 10px; border-radius: 8px;
  font-size: 14px; cursor: pointer; color: var(--text);
  touch-action: manipulation; user-select: none;
}
.side-bar .side-item:hover,
.side-bar .side-item.active { background: var(--surface-2); }
.side-bar .side-item.disabled { opacity: 0.4; pointer-events: none; }
.side-bar .side-item.system {
  font-style: italic;
  color: var(--muted);
}
.bar-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 80; display: none;
}
.bar-overlay.show { display: block; }

.left-bottom {
  margin-top: auto;
  border-top: 1px solid var(--divider-strong);
}
.left-bottom .plain-link {
  display: block;
  padding: 14px 14px;
  font-size: 15px;
  color: var(--text);
  cursor: pointer;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--border);
  width: 100%;
  text-align: left;
  min-height: 48px;
  touch-action: manipulation; user-select: none;
}
.left-bottom .plain-link:last-child { border-bottom: none; }
.left-bottom .plain-link:hover,
.left-bottom .plain-link:active { background: var(--surface-2); }

/* ========== MODALS ========== */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 100; display: none;
  align-items: flex-end; justify-content: center;
  touch-action: manipulation;
}
.modal-backdrop.show { display: flex; }
.modal {
  background: var(--surface);
  width: 100%; max-width: 600px;
  max-height: 92vh; overflow-y: auto;
  border-top-left-radius: 16px; border-top-right-radius: 16px;
  border: 1px solid var(--modal-border);
  padding: 16px;
  touch-action: manipulation;
  overscroll-behavior: contain;
}
.modal.settings-modal { max-height: var(--settings-modal-height); }
.modal h2 { margin: 0 0 12px; font-size: 17px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.field input, .field textarea, .field select {
  width: 100%; background: var(--surface-2);
  border: 1px solid var(--border); color: var(--text);
  padding: 10px 12px; border-radius: 10px;
  font-size: 14px; font-family: inherit; outline: none;
}
.field textarea { resize: vertical; min-height: 70px; }
.field .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.inline-add { display: flex; gap: 6px; margin-top: 6px; }
.inline-add input { flex: 1; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--accent); color: #fff;
  border: none; padding: 10px 14px;
  border-radius: var(--radius); font-size: 14px; font-weight: 500;
  cursor: pointer;
  touch-action: manipulation; user-select: none;
}
.btn.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn.danger { background: var(--danger); color: #fff; }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn.icon { padding: 6px 9px; font-size: 14px; }

.manage-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 6px; border-bottom: 1px solid var(--border);
}
.manage-row .name { flex: 1; font-size: 14px; word-break: break-word; cursor: pointer; }
.manage-row .btn { padding: 6px 10px; font-size: 12px; }
.manage-row .name.system { font-style: italic; color: var(--muted); cursor: default; }

.cat-list { display: flex; flex-direction: column; gap: 4px; }
.cat-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 8px;
  cursor: pointer; font-size: 13px;
  border: 1px solid transparent;
  touch-action: manipulation; user-select: none;
}
.cat-row:hover { background: var(--surface-2); }
.cat-row.selected { background: rgba(79,140,255,0.15); border-color: rgba(79,140,255,0.4); }
.cat-row .checkbox {
  width: 18px; height: 18px;
  border: 2px solid var(--border);
  border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 12px; color: transparent;
}
.cat-row.selected .checkbox { background: var(--accent); border-color: var(--accent); color: #fff; }
.cat-row .cat-name { flex: 1; }

.toast {
  position: fixed; left: 50%; bottom: 30px;
  transform: translateX(-50%);
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border);
  padding: 10px 16px; border-radius: 10px;
  font-size: 13px; z-index: 200;
  box-shadow: var(--shadow);
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
  display: flex; align-items: center; gap: 10px;
}
.toast.show { opacity: 1; pointer-events: auto; }
.toast .undo-btn {
  background: var(--accent); color: #fff;
  border: none; padding: 5px 10px;
  border-radius: 6px; font-size: 12px;
  cursor: pointer; font-weight: 600;
}

.tooltip {
  position: fixed; top: 46px; right: 10px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px; border-radius: 8px;
  font-size: 12px; z-index: 300;
  box-shadow: var(--shadow);
  opacity: 0; transition: opacity 0.2s ease;
  pointer-events: none;
}
.tooltip.show { opacity: 1; }

.log-item {
  font-size: 12px; color: var(--muted);
  padding: 6px 0; border-bottom: 1px dashed var(--border);
}
.log-item b { color: var(--text); font-weight: 500; }

.setting-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.setting-row .lock-btn {
  background: transparent; border: 1px solid var(--border);
  color: var(--muted); width: 34px; height: 34px;
  border-radius: 8px; font-size: 15px;
  cursor: pointer; flex-shrink: 0;
  touch-action: manipulation;
}
.setting-row .lock-btn.locked { color: var(--danger); border-color: var(--danger); }
.setting-row .setting-label { flex: 1; font-size: 14px; }
.setting-row .setting-control { display: flex; align-items: center; gap: 6px; }
.setting-row.disabled { opacity: 0.55; }
.setting-row.disabled .setting-control { pointer-events: none; }

.lr-toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); user-select: none; }
.lr-toggle .track {
  position: relative; width: 54px; height: 28px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 999px; cursor: pointer;
  touch-action: manipulation;
}
.lr-toggle .thumb {
  position: absolute; top: 2px; left: 2px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent); transition: left 0.18s ease;
}
.lr-toggle .track.right .thumb { left: 28px; }

.chips-line { display: flex; gap: 4px; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; max-width: 100%; }
.chips-line::-webkit-scrollbar { display: none; }
.chips-line .chip { flex-shrink: 0; padding: 4px 8px; font-size: 11px; white-space: nowrap; word-break: keep-all; }
.lines-chips { display: flex; gap: 6px; flex-wrap: wrap; }

.width-ctrl { display: inline-flex; align-items: center; gap: 4px; }
.width-ctrl .w-btn {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 16px; font-weight: 600;
  cursor: pointer; touch-action: manipulation;
  display: flex; align-items: center; justify-content: center;
}
.width-ctrl .w-val {
  min-width: 52px; text-align: center;
  font-size: 12px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.color-dots { display: flex; gap: 6px; flex-wrap: wrap; }
.color-dot {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer; touch-action: manipulation;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
}
.color-dot.active { border-color: var(--text); }

/* ========== QUICK ACTIONS ========== */
.qa-menu {
  position: fixed; left: 0; right: 0; bottom: 0;
  background: var(--surface);
  border-top-left-radius: 18px; border-top-right-radius: 18px;
  border-top: 1px solid var(--border);
  padding: 16px; z-index: 150;
  transform: translateY(100%); transition: transform 0.28s ease;
  max-width: 600px; margin: 0 auto;
  box-shadow: 0 -6px 30px rgba(0,0,0,0.35);
  max-height: 70vh; overflow-y: auto;
  overscroll-behavior: contain;
}
.qa-menu.open { transform: translateY(0); }
.qa-menu .handle { width: 40px; height: 4px; background: var(--border); border-radius: 999px; margin: 0 auto 12px; }
.qa-menu h3 { margin: 0 0 12px; font-size: 15px; }
.qa-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.qa-item {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 14px 6px; background: var(--surface-2);
  border-radius: 10px; font-size: 12px;
  color: var(--text); cursor: pointer;
  border: 1px solid var(--border);
  touch-action: manipulation;
}
.qa-item .ico { font-size: 22px; }

.cat-node { padding-left: 0; }
.cat-node .cat-label {
  display: flex; align-items: center; gap: 6px;
  padding: 9px 10px; border-radius: 8px;
  font-size: 14px; cursor: pointer;
  touch-action: manipulation; user-select: none;
}
.cat-node .cat-label:hover { background: var(--surface-2); }
.cat-node .cat-label .cat-name { flex: 1; }
.cat-node .cat-label .toggle-icon {
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px;
  color: var(--muted); font-size: 14px; font-weight: 600;
  user-select: none;
}
.cat-node .cat-label .toggle-icon:hover { background: var(--surface); }
.cat-node .cat-children { display: none; padding-left: 16px; }
.cat-node .cat-children.open { display: block; }

.quick-link {
  padding: 8px 10px; border-radius: 8px;
  cursor: pointer; position: relative;
  border-bottom: 1px solid var(--border);
  touch-action: manipulation; user-select: none;
}
.quick-link .ql-main { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.quick-link .ql-title { font-size: 14px; font-weight: 500; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quick-link .ql-tags { display: flex; gap: 3px; flex-shrink: 0; }
.quick-link .ql-tags .tag { font-size: 9px; padding: 0px 4px; }
.quick-link .ql-actions { display: none; position: absolute; top: 6px; right: 6px; gap: 3px; background: var(--surface); padding: 2px; border-radius: 6px; }
.quick-link.edit-mode { background: var(--surface-2); }
.quick-link.edit-mode .ql-actions { display: flex; }
.quick-sep { display: flex; align-items: center; gap: 8px; padding: 6px 0; color: var(--muted); font-size: 11px; }
.quick-sep .line { flex: 1; height: 1px; background: var(--border); }

.picker-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 6px; border-bottom: 1px solid var(--border);
}
.picker-row .name { flex: 1; font-size: 13px; }
.picker-row .picker-tags { font-size: 10px; color: var(--muted); }
.picker-row .btn.icon { width: 32px; height: 32px; padding: 0; font-size: 18px; }

.confirm-modal { padding: 20px 16px; }
.confirm-modal .cm-msg { font-size: 14px; margin-bottom: 16px; }

/* ========== STATS ========== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-top: 8px;
}
.stats-item {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 4px; text-align: center;
}
.stats-item .num { font-size: 16px; font-weight: 700; color: var(--accent); }
.stats-item .lbl { font-size: 9px; color: var(--muted); margin-top: 2px; }

.tags-count-section { margin-top: 16px; }
.tags-count-section h3 {
  font-size: 12px; text-transform: uppercase;
  letter-spacing: 0.8px; color: var(--muted);
  margin: 0 0 8px;
}
.tag-count-row {
  font-size: 13px; padding: 6px 0;
  border-bottom: 1px dashed var(--border);
  display: flex; justify-content: space-between;
}
.tag-count-row .cnt { color: var(--muted); font-variant-numeric: tabular-nums; }

@media (min-width: 640px) {
  .modal-backdrop { align-items: center; }
  .modal { border-radius: 16px; }
}
</style>
</head>
<body>

<header class="app-header" id="appHeader">
  <button class="icon-btn" id="openLeft" title="Toggle left bar">☰</button>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const firebaseConfig = {

  authDomain: "mywebapps-e3b63.firebaseapp.com",
  projectId: "mywebapps-e3b63",
  storageBucket: "mywebapps-e3b63.firebasestorage.app",

};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const COLLECTION = "Google Drive Link Manager";
const ROOT_DOC   = db.collection(COLLECTION).doc("app");
const RECYCLE_NAMES = ["Recycle Bin", "Trash", "Bin", "Discarded", "Deleted"];
const COLOR_PRESETS = [
  { name: "Blue",  value: "#4f8cff" },
  { name: "Green", value: "#22c55e" },
  { name: "Amber", value: "#f59e0b" },
  { name: "Red",   value: "#ef4444" },
  { name: "Grey",  value: "#9ca3af" }
];
const LS_THEME_KEY = "dlm_theme";
const SYS_UNCAT_NAME = "Uncategory";
const SYS_UNTAG_NAME = "UnTag";

/* ============================================================
   STATE
   ============================================================ */
const state = {
  links: [], categories: [], tags: [], logs: [], recycle: [], quickLinks: [],
  settings: {
    theme: localStorage.getItem(LS_THEME_KEY) || "night",
    recycleName: RECYCLE_NAMES[0],
    showBarButtons: false,
    visibleLines: { desc: true, link: true, tag: true, cat: true },
    leftBarWidth: 250,
    rightBarWidth: 250,
    timerColor: "black",
    cardBorderWidth: 1,
    cardBorderColor: "default",
    viewMode: "list",
    manageExpand: {},
    settingsModalHeight: 50,
    lock_theme: false, lock_recycleName: false, lock_showBarButtons: false,
    lock_visibleLines: false, lock_leftBarWidth: false, lock_rightBarWidth: false,
    lock_timerColor: false, lock_cardBorderWidth: false, lock_cardBorderColor: false,
    lock_viewMode: false, lock_settingsModalHeight: false
  },
  search: "", filterCategoryId: "", filterTagId: "",
  editingLinkId: null, editingCardId: null,
  blockedOpenId: null,
  connection: "connecting",
  expandedCats: {}
};

/* ============================================================
   UTILITIES
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const now = () => Date.now();
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function truncateMiddle(str, max = 48){
  if(!str || str.length <= max) return str;
  const half = Math.floor((max - 3)/2);
  return str.slice(0, half) + "..." + str.slice(str.length - half);
}
function normalizeUrl(url){
  url = (url||"").trim();
  if(!url) return "";
  if(/^[a-z][a-z0-9+.-]*:\/\//i.test(url)) return url;
  if(url.startsWith("//")) return "https:" + url;
  return "https://" + url;
}
function toast(msg, undoFn){
  const t = $("#toast");
  t.innerHTML = `<span>${esc(msg)}</span>`;
  if(undoFn){
    const b = document.createElement("button");
    b.className = "undo-btn";
    b.textContent = "Undo";
    b.onclick = ()=>{ undoFn(); t.classList.remove("show"); };
    t.appendChild(b);
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("show"), 5000);
  } else {
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("show"), 2000);
  }
  t.classList.add("show");
}
function findCat(id){ return state.categories.find(c=>c.id===id)||null; }
function findTag(id){ return state.tags.find(t=>t.id===id)||null; }
function findLink(id){ return state.links.find(l=>l.id===id)||null; }
function getSysUncat(){ return state.categories.find(c=>c.name === SYS_UNCAT_NAME) || null; }
function getSysUntag(){ return state.tags.find(t=>t.name === SYS_UNTAG_NAME) || null; }
function isSystemCat(c){ return c && c.name === SYS_UNCAT_NAME; }
function isSystemTag(t){ return t && t.name === SYS_UNTAG_NAME; }
function catPath(id){
  const parts=[]; let cur=findCat(id), g=0;
  while(cur && g++<20){ parts.unshift(cur.name); cur = cur.parentId?findCat(cur.parentId):null; }
  return parts.join(" > ");
}
function catDescendants(rootId){
  const out=new Set([rootId]); let added=true;
  while(added){ added=false;
    for(const c of state.categories){
      if(c.parentId && out.has(c.parentId) && !out.has(c.id)){ out.add(c.id); added=true; }
    }
  }
  return out;
}
function fmtRelative(ts){
  if(!ts) return "—";
  const diff = Math.floor((Date.now() - ts)/1000);
  if(diff < 60) return "Just now";
  const units = [
    { s: 31536000, suf: "yr" }, { s: 2592000, suf: "m" },
    { s: 604800, suf: "w" }, { s: 86400, suf: "d" },
    { s: 3600, suf: "hr" }, { s: 60, suf: "min" }
  ];
  let rem = diff; const parts = [];
  for(const u of units){
    const v = Math.floor(rem / u.s);
    if(v > 0){ parts.push(v + u.suf); rem -= v * u.s; }
  }
  return parts.slice(0,3).join(", ");
}
function fmtExact(ts){
  if(!ts) return "—";
  return new Date(ts).toLocaleString(undefined, { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit", second:"2-digit" });
}

/* ============================================================
   SYSTEM CATS/TAGS — ensure they exist + auto assign/remove
   ============================================================ */
function ensureSystemEntries(){
  let changed = false;
  if(!state.categories.some(c => c.name === SYS_UNCAT_NAME)){
    state.categories.push({ id: uid(), name: SYS_UNCAT_NAME, parentId: "", system: true });
    changed = true;
  }
  if(!state.tags.some(t => t.name === SYS_UNTAG_NAME)){
    state.tags.push({ id: uid(), name: SYS_UNTAG_NAME, system: true });
    changed = true;
  }
  return changed;
}
function applyAutoAssign(){
  const uncat = getSysUncat();
  const untag = getSysUntag();
  if(!uncat || !untag) return false;
  let changed = false;
  state.links.forEach(l => {
    const cats = (l.categoryIds || []).filter(id => id !== uncat.id && findCat(id));
    const tags = (l.tagIds || []).filter(id => id !== untag.id && findTag(id));
    const newCats = cats.length ? cats : [uncat.id];
    const newTags = tags.length ? tags : [untag.id];
    const sameCats = JSON.stringify(newCats) === JSON.stringify(l.categoryIds || []);
    const sameTags = JSON.stringify(newTags) === JSON.stringify(l.tagIds || []);
    if(!sameCats || !sameTags){
      l.categoryIds = newCats;
      l.tagIds = newTags;
      changed = true;
    }
  });
  return changed;
}

/* ============================================================
   CONNECTION
   ============================================================ */
let lastConnectedAt = 0;
function setConnection(c){
  if(state.connection === c) return;
  state.connection = c;
  const btn = $("#addBtn");
  if(!btn) return;
  btn.classList.remove("status-green","status-amber","status-grey");
  if(c==="connected"){ btn.classList.add("status-green"); btn.disabled=false; }
  else if(c==="connecting"){ btn.classList.add("status-amber"); btn.disabled=true; }
  else { btn.classList.add("status-grey"); btn.disabled=true; }
  if(c==="connected") lastConnectedAt = Date.now();
}
function refreshConnection(){
  if(!navigator.onLine){ setConnection("disconnected"); return; }
  if(lastConnectedAt && (Date.now() - lastConnectedAt) > 30000) setConnection("connecting");
}
window.addEventListener("online", ()=>{ setConnection("connecting"); pingFirestore(); });
window.addEventListener("offline", ()=>{ setConnection("disconnected"); });
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible"){
    if(!navigator.onLine){ setConnection("disconnected"); return; }
    setConnection("connecting");
    pingFirestore();
  }
});
async function pingFirestore(){
  if(!navigator.onLine){ setConnection("disconnected"); return; }
  try { setConnection("connecting"); await ROOT_DOC.get({ source: "server" }); setConnection("connected"); }
  catch(e){ setConnection("disconnected"); }
}

/* ============================================================
   FIRESTORE
   ============================================================ */
async function loadAll(){
  if(!navigator.onLine){ setConnection("disconnected"); return; }
  try {
    const snap = await ROOT_DOC.get();
    const data = snap.exists ? snap.data() : {};
    state.links      = data.links      || [];
    state.categories = data.categories || [];
    state.tags       = data.tags       || [];
    state.logs       = data.logs       || [];
    state.recycle    = data.recycle    || [];
    state.quickLinks = data.quickLinks || [];
    state.settings   = Object.assign(state.settings, data.settings || {});
    if(!state.settings.visibleLines) state.settings.visibleLines = { desc:true, link:true, tag:true, cat:true };
    if(!state.settings.leftBarWidth) state.settings.leftBarWidth = 250;
    if(!state.settings.rightBarWidth) state.settings.rightBarWidth = 250;
    if(state.settings.cardBorderWidth == null) state.settings.cardBorderWidth = 1;
    if(!state.settings.manageExpand) state.settings.manageExpand = {};
    if(!state.settings.settingsModalHeight) state.settings.settingsModalHeight = 50;
    localStorage.setItem(LS_THEME_KEY, state.settings.theme);

    // Ensure system entries + migrate
    const addedSys = ensureSystemEntries();
    const autoChanged = applyAutoAssign();
    if(addedSys || autoChanged){ await persist(); }

    setConnection("connected");
  } catch(e){
    console.error("loadAll failed", e);
    setConnection("disconnected");
  }
}
async function persist(){
  if(!navigator.onLine){ setConnection("disconnected"); }
  try {
    await ROOT_DOC.set({
      links: state.links, categories: state.categories, tags: state.tags,
      logs: state.logs.slice(0,300), recycle: state.recycle, quickLinks: state.quickLinks,
      settings: state.settings, updatedAt: now()
    }, { merge: true });
    setConnection("connected");
  } catch(e){
    console.error("persist failed", e);
    if(navigator.onLine) setConnection("disconnected");
  }
}
async function logAction(type, detail){
  state.logs.unshift({ id: uid(), type, detail, at: now() });
  if(state.logs.length>300) state.logs.length=300;
}

/* ============================================================
   THEME
   ============================================================ */
function applyTheme(){
  document.documentElement.setAttribute("data-theme", state.settings.theme);
  localStorage.setItem(LS_THEME_KEY, state.settings.theme);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", state.settings.theme==="night"?"#000000":"#e6f0ff");
  applyVisualSettings();
}
function applyVisualSettings(){
  const s = state.settings;
  document.documentElement.style.setProperty("--left-bar-width", (s.leftBarWidth||250) + "px");
  document.documentElement.style.setProperty("--right-bar-width", (s.rightBarWidth||250) + "px");
  document.documentElement.style.setProperty("--card-border-width", (s.cardBorderWidth ?? 1) + "px");
  let borderCol = "var(--border)";
  if(s.cardBorderColor && s.cardBorderColor !== "default"){
    const preset = COLOR_PRESETS.find(c=>c.name===s.cardBorderColor);
    if(preset) borderCol = preset.value;
  }
  document.documentElement.style.setProperty("--card-border-color", borderCol);
  let timerCol = "#000000";
  if(s.theme === "night") timerCol = "#ffffff";
  if(s.timerColor && s.timerColor !== "black"){
    const preset = COLOR_PRESETS.find(c=>c.name===s.timerColor);
    if(preset) timerCol = preset.value;
  }
  document.documentElement.style.setProperty("--timer-color", timerCol);
  document.documentElement.style.setProperty("--settings-modal-height", (s.settingsModalHeight || 50) + "vh");
  const list = $("#linksList");
  if(list) list.classList.toggle("grid", s.viewMode === "grid");
}

/* ============================================================
   MODAL STACK
   ============================================================ */
const modalStack = [];
let modalRenderPending = false;
function pushModal(html, onMount, onOutside, kind){
  modalStack.push({ html, onMount, onOutside, kind: kind || "default" });
  scheduleModalRender(); syncBodyScrollLock();
}
function popModal(){
  if(!modalStack.length) return;
  modalStack.pop();
  scheduleModalRender(); syncBodyScrollLock();
  const top = modalStack[modalStack.length-1];
  if(top && top.onMount) top.onMount();
}
function closeAllModals(){
  if(!modalStack.length) return;
  modalStack.length = 0;
  renderTopModal(); syncBodyScrollLock();
}
function scheduleModalRender(){
  if(modalRenderPending) return;
  modalRenderPending = true;
  requestAnimationFrame(()=>{ modalRenderPending = false; renderTopModal(); });
}
function renderTopModal(){
  const top = modalStack[modalStack.length-1];
  const mb = $("#modalBody");
  if(!top){
    $("#modalBackdrop").classList.remove("show");
    mb.innerHTML = ""; mb.className = "modal";
    return;
  }
  mb.innerHTML = top.html;
  mb.className = "modal" + (top.kind === "settings" ? " settings-modal" : "");
  $("#modalBackdrop").classList.add("show");
  if(top.onMount) top.onMount();
}
function handleBackdropClick(e){
  if(e.target !== $("#modalBackdrop")) return;
  const top = modalStack[modalStack.length-1];
  if(!top) return;
  if(top.onOutside){ top.onOutside(); } else { popModal(); }
}
function openModal(html, onMount, onOutside, kind){ pushModal(html, onMount, onOutside, kind); }
function syncBodyScrollLock(){
  const locked = modalStack.length > 0 ||
                 $("#leftBar")?.classList.contains("open") ||
                 $("#rightBar")?.classList.contains("open") ||
                 $("#qaMenu")?.classList.contains("open");
  document.body.style.overflow = locked ? "hidden" : "";
  document.documentElement.style.overflow = locked ? "hidden" : "";
}

/* ============================================================
   CUSTOM DIALOGS
   ============================================================ */
function customConfirm(message){
  return new Promise((resolve)=>{
    let resolved = false;
    const finish = (v)=>{ if(resolved) return; resolved = true; resolve(v); };
    openModal(`
      <div class="confirm-modal">
        <div class="cm-msg">${esc(message)}</div>
        <div class="modal-actions">
          <button class="btn ghost" id="cnfNo">Cancel</button>
          <button class="btn danger" id="cnfYes">Confirm</button>
        </div>
      </div>
    `, ()=>{
      $("#cnfNo").onclick = ()=>{ popModal(); finish(false); };
      $("#cnfYes").onclick = ()=>{ popModal(); finish(true); };
    }, ()=>{ popModal(); finish(false); });
  });
}
function customPrompt(message, defaultValue = ""){
  return new Promise((resolve)=>{
    let resolved = false;
    const finish = (v)=>{ if(resolved) return; resolved = true; resolve(v); };
    openModal(`
      <div class="confirm-modal">
        <div class="cm-msg">${esc(message)}</div>
        <div class="field" style="margin-bottom:0"><input id="prmInput" value="${esc(defaultValue)}" /></div>
        <div class="modal-actions">
          <button class="btn ghost" id="prmNo">Cancel</button>
          <button class="btn" id="prmYes">OK</button>
        </div>
      </div>
    `, ()=>{
      const inp = $("#prmInput");
      if(inp){ inp.focus(); inp.select(); }
      $("#prmNo").onclick = ()=>{ popModal(); finish(null); };
      $("#prmYes").onclick = ()=>{ popModal(); finish(inp.value); };
      if(inp) inp.onkeydown = (e)=>{ if(e.key === "Enter"){ popModal(); finish(inp.value); } };
    }, ()=>{ popModal(); finish(null); });
  });
}
function customAlert(message){
  return new Promise((resolve)=>{
    let resolved = false;
    const finish = ()=>{ if(resolved) return; resolved = true; resolve(true); };
    openModal(`
      <div class="confirm-modal">
        <div class="cm-msg">${esc(message)}</div>
        <div class="modal-actions"><button class="btn" id="alrOk">OK</button></div>
      </div>
    `, ()=>{ $("#alrOk").onclick = ()=>{ popModal(); finish(); }; }, ()=>{ popModal(); finish(); });
  });
}

/* ============================================================
   LINK actions
   ============================================================ */
async function saveLink(payload){
  if(state.connection !== "connected" && !navigator.onLine){ toast("Offline — cannot add"); return; }
  const isEdit = !!payload.id;
  const uncat = getSysUncat();
  const untag = getSysUntag();

  let categoryIds = (payload.categoryIds || []).filter(id => id !== (uncat?.id || "") && findCat(id));
  let tagIds      = (payload.tagIds || []).filter(id => id !== (untag?.id || "") && findTag(id));
  if(categoryIds.length === 0 && uncat) categoryIds = [uncat.id];
  if(tagIds.length === 0 && untag) tagIds = [untag.id];

  const link = {
    id: payload.id || uid(),
    title: payload.title.trim(),
    description: (payload.description||"").trim(),
    url: normalizeUrl(payload.url),
    categoryIds, tagIds,
    createdAt: isEdit ? (findLink(payload.id)?.createdAt||now()) : now(),
    updatedAt: now()
  };
  const i = state.links.findIndex(l=>l.id===link.id);
  if(i>=0) state.links[i]=link; else state.links.unshift(link);
  await logAction(isEdit?"edit":"add", `${link.title} — ${link.url}`);
  await persist();
  toast(isEdit?"Link updated":"Link added");
  renderLinks();
}
async function removeLink(id){
  const link = findLink(id); if(!link) return;
  const ok = await customConfirm(`Move "${link.title}" to ${state.settings.recycleName}?`);
  if(!ok) return;
  const snapLinks = state.links.slice();
  const snapRecycle = state.recycle.slice();
  const snapQuick = state.quickLinks.slice();
  state.links = state.links.filter(l=>l.id!==id);
  link.deletedAt = now();
  state.recycle.unshift(link);
  if(state.recycle.length>200) state.recycle.length=200;
  state.quickLinks = state.quickLinks.filter(q => q.linkId !== id);
  await logAction("delete", link.title);
  await persist(); renderLinks();
  toast(`Moved to ${state.settings.recycleName}`, async ()=>{
    state.links = snapLinks; state.recycle = snapRecycle; state.quickLinks = snapQuick;
    await logAction("undo-delete", link.title);
    await persist(); renderLinks();
  });
}
async function restoreFromRecycle(id){
  const i = state.recycle.findIndex(l=>l.id===id);
  if(i<0) return;
  const [link] = state.recycle.splice(i,1);
  delete link.deletedAt;
  // Auto-assign if needed
  const uncat = getSysUncat(), untag = getSysUntag();
  if(uncat && !(link.categoryIds||[]).some(id => findCat(id) && id !== uncat.id)) link.categoryIds = [uncat.id];
  if(untag && !(link.tagIds||[]).some(id => findTag(id) && id !== untag.id)) link.tagIds = [untag.id];
  state.links.unshift(link);
  await logAction("restore", link.title);
  await persist(); toast("Restored"); renderLinks(); refreshModalList("bin");
}
async function purgeFromRecycle(id){
  const ok = await customConfirm("Permanently delete this item?");
  if(!ok) return;
  const item = state.recycle.find(l=>l.id===id);
  state.recycle = state.recycle.filter(l=>l.id!==id);
  await logAction("purge", item?.title || "");
  await persist(); refreshModalList("bin");
}
function openDrive(id){
  const link = findLink(id); if(!link) return;
  window.open(link.url, "_blank", "noopener,noreferrer");
  logAction("open", link.title); persist();
}
async function moveLink(id, dir){
  const i = state.links.findIndex(l=>l.id===id);
  if(i<0) return;
  const j = dir === "up" ? i-1 : i+1;
  if(j<0 || j>=state.links.length) return;
  const tmp = state.links[i]; state.links[i] = state.links[j]; state.links[j] = tmp;
  await persist(); renderLinks();
}
async function copyLinkUrl(id){
  const link = findLink(id); if(!link) return;
  try { await navigator.clipboard.writeText(link.url); toast("URL copied"); }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = link.url; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("URL copied"); } catch(_){ toast("Copy failed"); }
    document.body.removeChild(ta);
  }
}
async function shareLink(id){
  const link = findLink(id); if(!link) return;
  if(navigator.share){
    try { await navigator.share({ title: link.title, text: link.description || "", url: link.url }); }
    catch(e){ /* cancelled */ }
  } else { copyLinkUrl(id); }
}

/* ============================================================
   QUICK LINKS
   ============================================================ */
async function addQuickLink(linkId){
  if(state.quickLinks.some(q => q.linkId === linkId)) return;
  state.quickLinks.push({ id: uid(), type:"link", linkId });
  await logAction("quick-add", findLink(linkId)?.title || "");
  await persist(); renderQuickLinks();
}
async function removeQuickLink(linkId){
  state.quickLinks = state.quickLinks.filter(q => !(q.type==="link" && q.linkId===linkId));
  await logAction("quick-remove", findLink(linkId)?.title || "");
  await persist(); renderQuickLinks();
}
async function addQuickSeparator(title){
  state.quickLinks.push({ id: uid(), type:"sep", title: (title||"").trim() });
  await persist(); renderQuickLinks();
}
async function removeQuickItem(id){
  state.quickLinks = state.quickLinks.filter(q => q.id !== id);
  await persist(); renderQuickLinks();
}
async function moveQuickItem(id, dir){
  const i = state.quickLinks.findIndex(q => q.id === id);
  if(i<0) return;
  const j = dir === "up" ? i-1 : i+1;
  if(j<0 || j>=state.quickLinks.length) return;
  const tmp = state.quickLinks[i]; state.quickLinks[i] = state.quickLinks[j]; state.quickLinks[j] = tmp;
  await persist(); renderQuickLinks();
}

   ============================================================ */
function refreshModalList(kind){
  if(kind === "cat"){
    const el = $("#mngCatList");
    if(el){ el.innerHTML = renderManageCats(); bindManageCats(); }
  } else if(kind === "tag"){
    const el = $("#mngTagList");
    if(el){ el.innerHTML = renderManageTags(); bindManageTags(); }
  } else if(kind === "bin"){
    const el = $("#binList");
    if(el){ el.innerHTML = renderBinList(); bindBinList(); }
  }
}
async function addCategory(name, parentId){
  name=(name||"").trim(); if(!name) return;
  const cat={ id: uid(), name, parentId: parentId||"" };
  state.categories.push(cat);
  await logAction("add-category", catPath(cat.id));
  await persist(); toast("Category added");
  renderLeftBar(); refreshModalList("cat");
}
async function removeCategory(id){
  const cat=findCat(id); if(!cat) return;
  if(isSystemCat(cat)){ toast("Uncategory cannot be deleted"); return; }
  const ok = await customConfirm(`Delete category "${cat.name}" and sub-categories?`);
  if(!ok) return;
  const del = catDescendants(id);
  state.categories = state.categories.filter(c=>!del.has(c.id));
  const uncat = getSysUncat();
  state.links.forEach(l=>{
    l.categoryIds = (l.categoryIds||[]).filter(c=>!del.has(c));
    if(!l.categoryIds.length && uncat) l.categoryIds = [uncat.id];
  });
  await logAction("delete-category", cat.name);
  await persist(); toast("Category deleted");
  renderLeftBar(); renderLinks(); refreshModalList("cat");
}
async function editCategory(id){
  const cat = findCat(id); if(!cat) return;
  if(isSystemCat(cat)){ toast("Uncategory cannot be renamed"); return; }
  const newName = await customPrompt("Edit category name:", cat.name);
  if(newName === null) return;
  const trimmed = newName.trim(); if(!trimmed) return;
  cat.name = trimmed;
  await logAction("edit-category", trimmed);
  await persist(); toast("Category updated");
  renderLeftBar(); renderLinks(); refreshModalList("cat");
}
async function addTag(name){
  name=(name||"").trim(); if(!name) return;
  if(state.tags.some(t=>t.name.toLowerCase()===name.toLowerCase())){ toast("Tag already exists"); return; }
  const tag={ id: uid(), name };
  state.tags.push(tag);
  await logAction("add-tag", name);
  await persist(); toast("Tag added");
  renderLeftBar(); refreshModalList("tag");
}
async function removeTag(id){
  const tag=findTag(id); if(!tag) return;
  if(isSystemTag(tag)){ toast("UnTag cannot be deleted"); return; }
  const ok = await customConfirm(`Delete tag "${tag.name}"?`);
  if(!ok) return;
  state.tags = state.tags.filter(t=>t.id!==id);
  const untag = getSysUntag();
  state.links.forEach(l=>{
    l.tagIds = (l.tagIds||[]).filter(t=>t!==id);
    if(!l.tagIds.length && untag) l.tagIds = [untag.id];
  });
  await logAction("delete-tag", tag.name);
  await persist(); toast("Tag deleted");
  renderLeftBar(); renderLinks(); refreshModalList("tag");
}
async function editTag(id){
  const tag = findTag(id); if(!tag) return;
  if(isSystemTag(tag)){ toast("UnTag cannot be renamed"); return; }
  const newName = await customPrompt("Edit tag name:", tag.name);
  if(newName === null) return;
  const trimmed = newName.trim(); if(!trimmed) return;
  tag.name = trimmed;
  await logAction("edit-tag", trimmed);
  await persist(); toast("Tag updated");
  renderLeftBar(); renderLinks(); refreshModalList("tag");
}

/* ============================================================
   FILTER + SEARCH
   ============================================================ */
function visibleLinks(){
  const q=state.search.trim().toLowerCase();
  let list=state.links.slice();
  if(q){
    list=list.filter(l=>{
      if(l.title.toLowerCase().includes(q)) return true;
      if((l.description||"").toLowerCase().includes(q)) return true;
      if((l.url||"").toLowerCase().includes(q)) return true;
      for(const tid of (l.tagIds||[])){ const tag = findTag(tid); if(tag && tag.name.toLowerCase().includes(q)) return true; }
      for(const cid of (l.categoryIds||[])){ if(catPath(cid).toLowerCase().includes(q)) return true; }
      return false;
    });
  }
  if(state.filterCategoryId){ const set=catDescendants(state.filterCategoryId); list=list.filter(l=>(l.categoryIds||[]).some(c=>set.has(c))); }
  if(state.filterTagId) list=list.filter(l=>(l.tagIds||[]).includes(state.filterTagId));
  return list;
}

/* ============================================================
   RENDER
   ============================================================ */
let renderPending = false;
function render(){
  if(renderPending) return;
  renderPending = true;
  requestAnimationFrame(()=>{
    renderPending = false;
    applyTheme();
    applyHeaderButtonVisibility();
    renderLinks();
    renderFilters();
    renderLeftBar();
    renderQuickLinks();
    updateTimer();
    setConnection(state.connection);
  });
}
function applyHeaderButtonVisibility(){
  const show = !!state.settings.showBarButtons;
  const l = $("#openLeft"), r = $("#openRight");
  if(l) l.classList.toggle("hidden", !show);
  if(r) r.classList.toggle("hidden", !show);
}
function renderFilters(){
  const bits=[];
  if(state.search) bits.push(`search: "${esc(state.search)}"`);
  if(state.filterCategoryId) bits.push(`📁 ${esc(catPath(state.filterCategoryId))}`);
  if(state.filterTagId) bits.push(`🏷 ${esc(findTag(state.filterTagId)?.name||"")}`);
  const el=$("#filterChips");
  if(!el) return;
  if(!bits.length){ el.innerHTML=""; return; }
  el.innerHTML = bits.map(b=>`<span class="chip active">${b}</span>`).join("") +
    `<span class="chip" id="clearFilters">Clear ×</span>`;
  $("#clearFilters").onclick = ()=>{ state.search=""; state.filterCategoryId=""; state.filterTagId=""; $("#searchInput").value=""; renderLinks(); renderFilters(); };
}
function renderLinks(){
  const list=visibleLinks();
  const el=$("#linksList");
  if(!el) return;
  el.classList.toggle("grid", state.settings.viewMode === "grid");
  if(!list.length){
    el.innerHTML = `<div class="empty">No saved links yet.<br>Tap ＋ in the header to add one.</div>`;
    return;
  }
  const vl = state.settings.visibleLines || { desc:true, link:true, tag:true, cat:true };
  el.innerHTML = list.map(link=>{
    const cats=(link.categoryIds||[]).map(catPath).filter(Boolean).map(esc).join(" > ");
    const tags=(link.tagIds||[]).map(findTag).filter(Boolean).map(t=>`<span class="tag">${esc(t.name)}</span>`).join("");
    const edit = state.editingCardId === link.id;
    return `
      <div class="card ${edit?"edit-mode":""}" data-card="${link.id}">
        <div class="edit-actions">
          <button class="btn secondary icon" data-edit="${link.id}" title="Edit">✏️</button>
          <button class="btn secondary icon" data-copy="${link.id}" title="Copy URL">📋</button>
          <button class="btn secondary icon" data-share="${link.id}" title="Share">🔗</button>
          <button class="btn secondary icon" data-up="${link.id}" title="Move up">⬆️</button>
          <button class="btn secondary icon" data-down="${link.id}" title="Move down">⬇️</button>
          <button class="btn danger icon" data-del="${link.id}" title="Delete">🗑</button>
        </div>
        <div class="line-title">${esc(link.title)}</div>
        ${vl.desc && link.description ? `<div class="line-desc">${esc(link.description)}</div>` : ""}
        ${vl.link ? `<div class="line-link">${esc(truncateMiddle(link.url, 48))}</div>` : ""}
        ${vl.tag && tags ? `<div class="line-tags">${tags}</div>` : ""}
        ${vl.cat && cats ? `<div class="line-cat">📁 ${cats}</div>` : ""}
      </div>
    `;
  }).join("");
  el.querySelectorAll(".card").forEach(card=>{
    const id = card.dataset.card;
    let pressTimer = null, longPressed = false;
    const start = ()=>{ longPressed = false; pressTimer = setTimeout(()=>{ longPressed = true; state.editingCardId = id; renderLinks(); }, 500); };
    const cancel = ()=>{ clearTimeout(pressTimer); pressTimer = null; };
    card.addEventListener("touchstart", start, { passive: true });
    card.addEventListener("touchend", cancel);
    card.addEventListener("touchcancel", cancel);
    card.addEventListener("mousedown", (e)=>{ if(e.button === 0) start(); });
    card.addEventListener("mouseup", cancel);
    card.addEventListener("mouseleave", cancel);
    card.addEventListener("contextmenu", (e)=>{ e.preventDefault(); state.editingCardId = id; renderLinks(); });
    card.addEventListener("click", (e)=>{
      if(e.target.closest(".edit-actions")) return;
      if(state.editingCardId === id) return;
      if(longPressed) return;
      if(state.blockedOpenId === id){ state.blockedOpenId = null; return; }
      openDrive(id);
    });
  });
  el.querySelectorAll("[data-edit]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); state.editingCardId=null; openLinkModal(b.dataset.edit); });
  el.querySelectorAll("[data-copy]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); copyLinkUrl(b.dataset.copy); });
  el.querySelectorAll("[data-share]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); shareLink(b.dataset.share); });
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); state.editingCardId=null; removeLink(b.dataset.del); });
  el.querySelectorAll("[data-up]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); moveLink(b.dataset.up, "up"); });
  el.querySelectorAll("[data-down]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); moveLink(b.dataset.down, "down"); });

  document.removeEventListener("click", closeEditOnOutside, true);
  document.addEventListener("click", closeEditOnOutside, true);
}
function closeEditOnOutside(e){
  if(!state.editingCardId) return;
  const card = e.target.closest(".card");
  if(card && card.dataset.card === state.editingCardId) return;
  if(e.target.closest(".edit-actions")) return;
  if(card && card.dataset.card){ state.blockedOpenId = card.dataset.card; }
  state.editingCardId = null;
  renderLinks();
}
function renderLeftBar(){
  const catEl = $("#leftCatList");
  const tagEl = $("#leftTagList");
  if(!catEl || !tagEl) return;

  // Categories — non-system first, then Uncategory at end
  const nonSysCats = state.categories.filter(c => !c.parentId && !isSystemCat(c)).sort((a,b)=>a.name.localeCompare(b.name));
  const sysCat = getSysUncat();
  let catHtml = nonSysCats.map(c=>renderCatNode(c,0)).join("");
  if(sysCat){
    catHtml += `<div class="cat-node"><div class="cat-label" style="padding-left:10px">
      <span class="cat-name system" data-cat-id="${sysCat.id}">📁 ${esc(sysCat.name)}</span>
    </div></div>`;
  }
  catEl.innerHTML = catHtml || `<div style="font-size:12px;color:var(--muted);padding:4px">No categories yet</div>`;

  // Tags — non-system first, then UnTag at end
  const nonSysTags = state.tags.filter(t => !isSystemTag(t));
  const sysTag = getSysUntag();
  let tagHtml = nonSysTags.map(t=>`<div class="side-item" data-tag-filter="${t.id}">🏷 ${esc(t.name)}</div>`).join("");
  if(sysTag){
    tagHtml += `<div class="side-item system" data-tag-filter="${sysTag.id}">🏷 ${esc(sysTag.name)}</div>`;
  }
  tagEl.innerHTML = tagHtml || `<div style="font-size:12px;color:var(--muted);padding:4px">No tags yet</div>`;

  $$("#leftCatList .cat-name").forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const id = el.dataset.catId;
      state.filterCategoryId = id; state.filterTagId = ""; closeBars(); renderLinks(); renderFilters();
    };
  });
  $$("#leftCatList .toggle-icon").forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const id = el.dataset.toggleId;
      state.expandedCats[id] = !state.expandedCats[id];
      renderLeftBar();
    };
  });
  $$("#leftTagList [data-tag-filter]").forEach(el=>{
    el.onclick = ()=>{ state.filterTagId=el.dataset.tagFilter; state.filterCategoryId=""; closeBars(); renderLinks(); renderFilters(); };
  });
}
function renderCatNode(cat, depth){
  const children = state.categories.filter(c=>c.parentId===cat.id).sort((a,b)=>a.name.localeCompare(b.name));
  const open = !!state.expandedCats[cat.id];
  const hasChildren = children.length > 0;
  return `
    <div class="cat-node">
      <div class="cat-label" style="padding-left:${10+depth*12}px">
        <span class="cat-name" data-cat-id="${cat.id}">📁 ${esc(cat.name)}</span>
        ${hasChildren ? `<span class="toggle-icon" data-toggle-id="${cat.id}">${open ? "−" : "+"}</span>` : ""}
      </div>
      ${hasChildren?`<div class="cat-children ${open?"open":""}">${children.map(c=>renderCatNode(c,depth+1)).join("")}</div>`:""}
    </div>
  `;
}
function renderQuickLinks(){
  const el = $("#quickLinksList");
  if(!el) return;
  if(!state.quickLinks.length){
    el.innerHTML = `<div style="font-size:12px;color:var(--muted);padding:6px 10px">No quick links yet</div>`;
  } else {
    el.innerHTML = state.quickLinks.map(q=>{
      if(q.type === "sep"){
        return `<div class="quick-sep" data-sep="${q.id}"><span class="line"></span><span class="sep-title">${esc(q.title || "—")}</span><span class="line"></span></div>`;
      }
      const link = findLink(q.linkId); if(!link) return "";
      const tags = (link.tagIds||[]).map(findTag).filter(Boolean).map(t=>`<span class="tag">${esc(t.name)}</span>`).join("");
      return `<div class="quick-link" data-ql="${q.id}" data-ql-link="${q.linkId}">
        <div class="ql-actions">
          <button class="btn danger icon" data-ql-remove="${q.id}" title="Remove">×</button>
          <button class="btn secondary icon" data-ql-up="${q.id}" title="Up">⬆️</button>
          <button class="btn secondary icon" data-ql-down="${q.id}" title="Down">⬇️</button>
        </div>
        <div class="ql-main"><div class="ql-title">${esc(link.title)}</div>${tags?`<div class="ql-tags">${tags}</div>`:""}</div>
      </div>`;
    }).join("");
  }
  el.querySelectorAll("[data-ql]").forEach(node=>{
    const linkId = node.dataset.qlLink;
    let pressTimer = null, longPressed = false;
    const start = ()=>{ longPressed=false; pressTimer=setTimeout(()=>{ longPressed=true; node.classList.add("edit-mode"); }, 500); };
    const cancel = ()=>{ clearTimeout(pressTimer); };
    node.addEventListener("touchstart", start, { passive: true });
    node.addEventListener("touchend", cancel);
    node.addEventListener("touchcancel", cancel);
    node.addEventListener("mousedown", (e)=>{ if(e.button === 0) start(); });
    node.addEventListener("mouseup", cancel);
    node.addEventListener("mouseleave", cancel);
    node.addEventListener("contextmenu", (e)=>{ e.preventDefault(); node.classList.add("edit-mode"); });
    node.addEventListener("click", (e)=>{
      if(e.target.closest(".ql-actions")) return;
      if(longPressed) return;
      if(linkId) openDrive(linkId);
    });
  });
  el.querySelectorAll("[data-ql-remove]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); removeQuickItem(b.dataset.qlRemove); });
  el.querySelectorAll("[data-ql-up]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); moveQuickItem(b.dataset.qlUp, "up"); });
  el.querySelectorAll("[data-ql-down]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); moveQuickItem(b.dataset.qlDown, "down"); });
  el.querySelectorAll("[data-sep]").forEach(node=>{
    const id = node.dataset.sep;
    let pressTimer=null;
    const removeSep = async ()=>{ const ok = await customConfirm("Remove separator?"); if(ok) removeQuickItem(id); };
    node.addEventListener("touchstart", ()=>{ pressTimer=setTimeout(removeSep, 500); }, { passive:true });
    node.addEventListener("touchend", ()=>clearTimeout(pressTimer));
    node.addEventListener("touchcancel", ()=>clearTimeout(pressTimer));
    node.addEventListener("mousedown", ()=>{ pressTimer=setTimeout(removeSep, 500); });
    node.addEventListener("mouseup", ()=>clearTimeout(pressTimer));
    node.addEventListener("mouseleave", ()=>clearTimeout(pressTimer));
  });
}

   ============================================================ */
function exportJSON(){
  const dateStr = new Date().toISOString().slice(0,10);
  const payload = {
    exportedAt: new Date().toISOString(),
    links: state.links, categories: state.categories, tags: state.tags,
    recycle: state.recycle, quickLinks: state.quickLinks,
    logs: state.logs, settings: state.settings
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `DriveLinks_${dateStr}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("JSON exported");
}

/* ============================================================
   EXPORT PDF — redesign
   ============================================================ */
function exportPDF(){
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: "a4" });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const margin = 12;
    const contentW = pageW - margin*2;
    const topY = 14;
    const bottomY = pageH - 18;
    let y = topY;
    const dateStr = new Date().toISOString().slice(0,10);
    const newPage = () => { doc.addPage(); y = topY; };
    const checkY = (needed) => { if(y + needed > bottomY) newPage(); };

    // Heading — top, capital
    doc.setFontSize(18); doc.setFont(undefined, "bold"); doc.setTextColor(0,0,0);
    doc.text("DRIVE LINK MANAGER", pageW/2, y + 4, { align: "center" });
    y += 12;

    // Stats cards (4 per line, two rows)
    const stats = [
      { num: state.links.length, lbl: "Links" },
      { num: state.categories.filter(c=>!isSystemCat(c)).length, lbl: "Categories" },
      { num: state.tags.filter(t=>!isSystemTag(t)).length, lbl: "Tags" },
      { num: state.recycle.length, lbl: "Bin" },
      { num: state.quickLinks.filter(q=>q.type==="link").length, lbl: "Quick Links" }
    ];
    const statGap = 2;
    const statW = (contentW - statGap*(stats.length-1)) / stats.length;
    const statH = 14;
    checkY(statH + 6);
    const statY = y;
    stats.forEach((s, i) => {
      const x = margin + i*(statW + statGap);
      doc.setDrawColor(0); doc.setLineWidth(0.4);
      doc.roundedRect(x, statY, statW, statH, 2, 2);
      doc.setFontSize(12); doc.setFont(undefined, "bold"); doc.setTextColor(0,0,0);
      doc.text(String(s.num), x + statW/2, statY + 6, { align: "center" });
      doc.setFontSize(7); doc.setFont(undefined, "normal");
      doc.text(s.lbl, x + statW/2, statY + 11, { align: "center" });
    });
    y = statY + statH + 6;

    // Thick black divider
    doc.setDrawColor(0); doc.setLineWidth(1.5);
    doc.line(margin, y, pageW - margin, y);
    y += 8;

    // Links heading
    doc.setFontSize(13); doc.setFont(undefined, "bold"); doc.setTextColor(0,0,0);
    doc.text("Links", margin, y); y += 6;

    // Link cards
    const cardGap = 2;
    state.links.forEach((link) => {
      const titleText = link.title || "(untitled)";
      const urlText = link.url;
      const tagsStr = (link.tagIds||[]).map(findTag).filter(Boolean)
        .filter(t => !isSystemTag(t)).map(t => t.name).join(", ");
      const catsStr = (link.categoryIds||[]).map(catPath).filter(Boolean)
        .filter(c => c !== SYS_UNCAT_NAME).join(" > ");
      const pathStr = catsStr ? ("> " + catsStr) : "";

      doc.setFontSize(11); doc.setFont(undefined, "bold");
      const titleLines = doc.splitTextToSize(titleText, contentW - 8);
      doc.setFontSize(9); doc.setFont(undefined, "normal");
      const urlLines = doc.splitTextToSize(urlText, contentW - 8);
      const tagsLines = tagsStr ? doc.splitTextToSize("Tags: " + tagsStr, contentW - 8) : [];
      const pathLines = pathStr ? doc.splitTextToSize("Path: " + pathStr, contentW - 8) : [];

      // exact height: padding top 4 + title + gap + url + gap + tags + gap + path + padding bottom 4
      let cardH = 4 + titleLines.length*5.5 + 1 + urlLines.length*4.5 + (tagsLines.length?1:0) + (tagsLines.length? tagsLines.length*4.5 : 0) + (pathLines.length?1:0) + (pathLines.length? pathLines.length*4.5 : 0) + 4;
      checkY(cardH + cardGap);

      // Card border — 2px, slightly rounded corners
      doc.setDrawColor(0); doc.setLineWidth(0.7);
      doc.roundedRect(margin, y, contentW, cardH, 2, 2);

      let cy = y + 5;
      doc.setFontSize(11); doc.setFont(undefined, "bold"); doc.setTextColor(0,0,0);
      doc.text(titleLines, margin + 4, cy); cy += titleLines.length * 5.5 + 1;

      // URL — blue, clickable, no underline
      doc.setFontSize(9); doc.setFont(undefined, "normal"); doc.setTextColor(0,0,255);
      urlLines.forEach((line) => {
        doc.textWithLink(line, margin + 4, cy, { url: link.url });
        cy += 4.5;
      });
      doc.setTextColor(0,0,0);

      if(tagsLines.length){
        cy += 1;
        doc.setFontSize(9); doc.setFont(undefined, "normal");
        doc.text(tagsLines, margin + 4, cy); cy += tagsLines.length * 4.5;
      }
      if(pathLines.length){
        cy += 1;
        doc.setFontSize(9); doc.setFont(undefined, "normal");
        doc.text(pathLines, margin + 4, cy); cy += pathLines.length * 4.5;
      }
      y += cardH + cardGap;
    });

    // Header + Footer on each page
    const total = doc.getNumberOfPages();
    const webUrl = window.location.href;
    for(let p = 1; p <= total; p++){
      doc.setPage(p);
      // Header — center
      doc.setFontSize(8); doc.setFont(undefined, "normal");
      const label = "Page Path: ";
      const lw = doc.getTextWidth(label);
      const uw = doc.getTextWidth(webUrl);
      const totalW = lw + uw;
      const sx = (pageW - totalW) / 2;
      doc.setTextColor(0,0,0); doc.text(label, sx, 8);
      doc.setTextColor(0,0,255);
      doc.textWithLink(webUrl, sx + lw, 8, { url: webUrl });
      doc.setTextColor(0,0,0);
      // Footer — center, black
      doc.setFontSize(9);
      doc.text(`Page ${p} of ${total}`, pageW/2, pageH - 8, { align: "center" });
    }

    doc.save(`DriveLinks_${dateStr}.pdf`);
    toast("PDF exported");
  } catch(e){
    console.error("PDF failed", e);
    toast("PDF export failed");
  }
}

function renderManageCats(){
  if(!state.categories.length) return `<div class="empty">No categories yet</div>`;
  const expand = state.settings.manageExpand || {};
  let html="";
  const walk = (parentId, depth)=>{
    state.categories
      .filter(c=>(c.parentId||"")===(parentId||"") && !isSystemCat(c))
      .sort((a,b)=>a.name.localeCompare(b.name))
      .forEach(c=>{
        const children = state.categories.filter(x=>x.parentId === c.id);
        const hasChildren = children.length > 0;
        const open = !!expand[c.id];
        html += `<div class="manage-row" style="padding-left:${6+depth*14}px">
          <div class="name" data-mng-toggle="${c.id}">
            ${hasChildren ? (open ? "▼" : "▶") : "&nbsp;&nbsp;"} 📁 ${esc(c.name)}
          </div>
          <button class="btn secondary" data-cat-add-sub="${c.id}">+</button>
          <button class="btn secondary" data-cat-edit="${c.id}">Edit</button>
          <button class="btn danger" data-cat-del="${c.id}">Remove</button>
        </div>`;
        if(open && hasChildren) walk(c.id, depth+1);
      });
  };
  walk("",0);
  // Add Uncategory at end (no edit/delete)
  const sysCat = getSysUncat();
  if(sysCat){
    html += `<div class="manage-row">
      <div class="name system">📁 ${esc(sysCat.name)}</div>
    </div>`;
  }
  return html || `<div class="empty">No categories yet</div>`;
}
function bindManageCats(){

    el.onclick = async ()=>{

      if(!state.settings.manageExpand) state.settings.manageExpand = {};
      state.settings.manageExpand[id] = !state.settings.manageExpand[id];

    const name = await customPrompt("Sub-category name:");
    if(name) await addCategory(name, b.dataset.catAddSub);

function openLinkModal(linkId){

  const sysTagId = getSysUntag()?.id || "";

  const selTags = new Set((link?.tagIds || []).filter(id => id !== sysTagId));

  openModal(`
    <h2>${link?"Edit link":"Add link"}</h2>
    <div class="field"><label>Title</label><input id="f_title" value="${esc(link?.title||"")}" placeholder="e.g. March invoices" /></div>

      <input id="f_url" value="${esc(link?.url||"")}" placeholder="drive.google.com/drive/folders/…" />

    <div class="field">
      <label style="display:flex;justify-content:space-between;align-items:center"><span>Categories</span>
        <button class="btn secondary icon" id="mngCatFromLink" style="font-size:11px">⚙️</button></label>

    </div>
    <div class="field">
      <label style="display:flex;justify-content:space-between;align-items:center"><span>Tags</span>
        <button class="btn secondary icon" id="mngTagFromLink" style="font-size:11px">⚙️</button></label>
      <div id="tagToggles" class="chips">
        ${state.tags.filter(t=>!isSystemTag(t)).map(t=>`<span class="chip ${selTags.has(t.id)?"active":""}" data-tag-toggle="${t.id}">${esc(t.name)}</span>`).join("") || `<span style="font-size:12px;color:var(--muted)">No tags yet</span>`}
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="cancelBtn">Cancel</button>
      <button class="btn" id="saveBtn">${link?"Save":"Add"}</button>
    </div>
  `, ()=>{
    $("#cancelBtn").onclick = ()=>{ state.editingLinkId = null; popModal(); };
    const bindTagClicks = ()=>{
      $$("#tagToggles .chip").forEach(chip=>{
        chip.onclick = ()=>{
          const id = chip.dataset.tagToggle;
          if(selTags.has(id)) selTags.delete(id); else selTags.add(id);
          chip.classList.toggle("active");
        };
      });
    };
    const bindCatChecks = ()=>{
      $$("#catChecks .cat-row").forEach(row=>{
        row.onclick = ()=>{
          const id = row.dataset.cat;
          if(selCats.has(id)) selCats.delete(id); else selCats.add(id);
          row.classList.toggle("selected");
          row.querySelector(".checkbox").textContent = selCats.has(id) ? "✓" : "";
        };
      });
    };
    bindTagClicks(); bindCatChecks();
    $("#mngCatFromLink").onclick = (e)=>{ e.preventDefault(); openManageCategoriesModal(); };
    $("#mngTagFromLink").onclick = (e)=>{ e.preventDefault(); openManageTagsModal(); };
    $("#saveBtn").onclick = async ()=>{
      const title = $("#f_title").value.trim();
      const description = $("#f_desc").value;
      const urlRaw = $("#f_url").value;
      if(!title) return toast("Title required");
      if(!urlRaw.trim()) return toast("URL required");
      await saveLink({ id: link?.id, title, description, url: urlRaw,
        categoryIds: Array.from(selCats), tagIds: Array.from(selTags) });
      state.editingLinkId = null;
      popModal();
    };
  }, ()=>{ state.editingLinkId = null; });
}
function renderCatChecks(selSet){
  let html="";
  const walk=(parentId,depth)=>{
    state.categories.filter(c=>(c.parentId||"")===(parentId||"") && !isSystemCat(c)).sort((a,b)=>a.name.localeCompare(b.name))
      .forEach(c=>{
        const selected = selSet.has(c.id);
        html += `<div class="cat-row ${selected?"selected":""}" data-cat="${c.id}" style="padding-left:${8+depth*14}px">
          <span class="checkbox">${selected?"✓":""}</span>
          <span class="cat-name">${esc(c.name)}</span>
        </div>`;
        walk(c.id, depth+1);
      });
  };
  walk("",0);
  return html || `<span style="font-size:12px;color:var(--muted)">No categories yet</span>`;
}

    <div style="max-height:55vh;overflow:auto" id="pickerList">${renderQuickLinksPicker()}</div>
    <div style="margin-top:10px;display:flex;gap:6px">
      <input id="sepTitle" placeholder="Separator title (optional)" style="flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:10px;font-size:14px;outline:none" />
      <button class="btn secondary" id="addSepBtn">Add separator</button>
    </div>
    <div class="modal-actions"><button class="btn" id="closePicker">Close</button></div>
  `, ()=>{
    bindQuickLinksPicker();
    $("#addSepBtn").onclick = async ()=>{ await addQuickSeparator($("#sepTitle").value); popModal(); openQuickLinksPicker(); };
    $("#closePicker").onclick = popModal;
  });
}
function renderQuickLinksPicker(){
  if(!state.links.length) return `<div class="empty">No links to add</div>`;
  const added = new Set(state.quickLinks.filter(q=>q.type==="link").map(q=>q.linkId));
  return state.links.map(l=>{
    const isAdded = added.has(l.id);
    const tags = (l.tagIds||[]).map(findTag).filter(Boolean).filter(t=>!isSystemTag(t)).map(t=>esc(t.name)).join(", ");
    return `<div class="picker-row">
      <div style="flex:1"><div class="name">${esc(l.title)}</div>${tags?`<div class="picker-tags">${tags}</div>`:""}</div>
      <button class="btn ${isAdded?"danger":"secondary"} icon" data-pick="${l.id}" data-added="${isAdded?1:0}">${isAdded ? "−" : "+"}</button>
    </div>`;
  }).join("");
}
function bindQuickLinksPicker(){
  $$("#pickerList [data-pick]").forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.pick;
      const isAdded = b.dataset.added === "1";
      if(isAdded) await removeQuickLink(id); else await addQuickLink(id);
      popModal(); openQuickLinksPicker();
    };
  });
}

/* ============================================================
   BARS + Quick Actions + swipe
   ============================================================ */
function openBar(side){
  closeBars();
  const bar = side==="left"?$("#leftBar"):$("#rightBar");
  bar.classList.add("open");
  $("#barOverlay").classList.add("show");
  syncBodyScrollLock();
}
function closeBars(){
  $("#leftBar").classList.remove("open");
  $("#rightBar").classList.remove("open");
  $("#barOverlay").classList.remove("show");
  syncBodyScrollLock();
}
function openQA(){ $("#qaMenu").classList.add("open"); syncBodyScrollLock(); }
function closeQA(){ $("#qaMenu").classList.remove("open"); syncBodyScrollLock(); }

let tx=0, ty=0, tt=0, gestureActive=false;
let ignoreClickUntil = 0;
function onStart(x, y){ tx = x; ty = y; tt = Date.now(); gestureActive = true; }
function onEnd(x, y){
  if(!gestureActive) return;
  gestureActive = false;
  const dx = x - tx, dy = y - ty, dt = Date.now() - tt;
  if(dt > 800) return;
  const leftOpen  = $("#leftBar").classList.contains("open");
  const rightOpen = $("#rightBar").classList.contains("open");
  const qaOpen = $("#qaMenu").classList.contains("open");
  const modalOpen = $("#modalBackdrop").classList.contains("show");
  if(modalOpen) return;
  let swipeHandled = false;
  if(qaOpen){
    if(dy > 60 && Math.abs(dy) > Math.abs(dx)){ closeQA(); swipeHandled = true; }
    if(swipeHandled) ignoreClickUntil = Date.now() + 300;
    return;
  }
  if(!leftOpen && !rightOpen && Math.abs(dy)>80 && Math.abs(dy)>Math.abs(dx) && dy<0){
    openQA(); ignoreClickUntil = Date.now() + 300; return;
  }
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){
    if(leftOpen){ if(dx < 0){ closeBars(); swipeHandled = true; } }
    else if(rightOpen){ if(dx > 0){ closeBars(); swipeHandled = true; } }
    else { if(dx > 0) openBar("left"); else openBar("right"); swipeHandled = true; }
  }
  if(swipeHandled) ignoreClickUntil = Date.now() + 300;
}
document.addEventListener("touchstart", (e)=>{ const t=e.touches[0]; onStart(t.clientX, t.clientY); }, { passive: true });
document.addEventListener("touchend", (e)=>{ const t=e.changedTouches[0]; onEnd(t.clientX, t.clientY); }, { passive: true });
document.addEventListener("mousedown", (e)=>{
  if(e.button !== 0) return;
  if(e.target.closest("input, textarea, select")) return;
  if(e.target.closest(".qa-menu") || e.target.closest(".side-bar") || e.target.closest(".modal")) return;
  onStart(e.clientX, e.clientY);
});
document.addEventListener("mouseup", (e)=>{
  if(e.button !== 0) return;
  if(e.target.closest("input, textarea, select")) return;
  if(e.target.closest(".qa-menu") || e.target.closest(".side-bar") || e.target.closest(".modal")) return;
  onEnd(e.clientX, e.clientY);
});
document.addEventListener("click", (e)=>{
  if(Date.now() < ignoreClickUntil){
    e.stopPropagation(); e.preventDefault();
    return false;
  }
}, true);
document.addEventListener("keydown", (e)=>{
  if(e.key === "Escape"){
    if($("#modalBackdrop").classList.contains("show")){ closeAllModals(); return; }
    if($("#qaMenu").classList.contains("open")){ closeQA(); return; }
    if(state.editingCardId){ state.editingCardId = null; renderLinks(); return; }
    if($("#leftBar").classList.contains("open") || $("#rightBar").classList.contains("open")){ closeBars(); return; }
  }
});
document.addEventListener("click", e=>{
  const qa = $("#qaMenu");
  if(qa.classList.contains("open") && !qa.contains(e.target) && !e.target.closest("#addBtn")){
    closeQA();
  }
});
document.addEventListener("gesturestart", e=>e.preventDefault());
document.addEventListener("touchmove", e=>{ if(e.touches.length>1) e.preventDefault(); }, { passive: false });
document.addEventListener("touchmove", (e)=>{
  if($("#qaMenu").classList.contains("open") && !e.target.closest(".qa-menu")){
    e.preventDefault();
  }
}, { passive: false });

/* ============================================================
   TOP-LEVEL BINDINGS
   ============================================================ */
$("#openLeft").onclick = ()=>{ const isOpen = $("#leftBar").classList.contains("open"); closeBars(); if(!isOpen) openBar("left"); };
$("#openRight").onclick = ()=>{ const isOpen = $("#rightBar").classList.contains("open"); closeBars(); if(!isOpen) openBar("right"); };
$("#barOverlay").onclick = closeBars;
$("#addBtn").onclick = ()=>openLinkModal();
$("#qlAddBtn").onclick = ()=>openQuickLinksPicker();

const searchInput = $("#searchInput");
const appHeader = $("#appHeader");
searchInput.addEventListener("focus", ()=>{ appHeader.classList.add("search-active"); });
searchInput.addEventListener("blur", ()=>{
  setTimeout(()=>{
    if(document.activeElement !== searchInput){
      appHeader.classList.remove("search-active");
    }
  }, 120);
});
searchInput.oninput = (e)=>{ state.search=e.target.value; renderLinks(); renderFilters(); };
$("#searchBack").onclick = ()=>{
  searchInput.value = "";
  state.search = "";
  renderLinks(); renderFilters();
  searchInput.blur();
  appHeader.classList.remove("search-active");
};

$$("[data-bottom-action]").forEach(btn=>{
  let handled = false;
  const handler = (e)=>{
    if(handled) return;
    handled = true;
    setTimeout(()=>handled = false, 400);
    e.preventDefault(); e.stopPropagation();
    const action = btn.dataset.bottomAction;
    closeBars();
    setTimeout(()=>{
      if(action === "mngCat") openManageCategoriesModal();
      if(action === "mngTag") openManageTagsModal();
      if(action === "bin") openBinModal();
      if(action === "stats") openStatsModal();
      if(action === "settings") openSettingsModal();
    }, 60);
  };
  btn.addEventListener("pointerup", handler);
});
$("#leftActivityBtn").onclick = ()=>{ closeBars(); setTimeout(openActivityModal, 60); };

$$(".qa-item").forEach(item=>{
  item.onclick = ()=>{
    const action = item.dataset.qa;
    closeQA();
    setTimeout(()=>{
      if(action === "addLink") openLinkModal();
      if(action === "addCat") openManageCategoriesModal();
      if(action === "addTag") openManageTagsModal();
      if(action === "bin") openBinModal();
      if(action === "stats") openStatsModal();
      if(action === "settings") openSettingsModal();
    }, 80);
  };
});

$("#lastTimer").onclick = ()=>{
  const tip = $("#timeTooltip");
  tip.textContent = fmtExact(state.logs[0]?.at);
  tip.classList.add("show");
  clearTimeout(tip._t);
  tip._t = setTimeout(()=>tip.classList.remove("show"), 3000);
};
$("#modalBackdrop").onclick = handleBackdropClick;

/* ============================================================
   AUTH + BOOT
   ============================================================ */
async function ensureAuth(){
  return new Promise((resolve)=>{
    const unsub = auth.onAuthStateChanged(async (u)=>{
      if(u){ unsub(); resolve(u); }
      else {
        try { await auth.signInAnonymously(); }
        catch(e){ console.error("anon signin failed", e); unsub(); resolve(null); }
      }
    });
  });
}
function updateTimer(){
  const el = $("#lastTimer");
  if(el) el.textContent = fmtRelative(state.logs[0]?.at);
}
async function boot(){
  applyTheme();
  setConnection("connecting");
  await ensureAuth();
  try {
    const snap = await ROOT_DOC.get();
    if(!snap.exists){
      await ROOT_DOC.set({
        links: [], categories: [], tags: [], logs: [], recycle: [], quickLinks: [],
        settings: state.settings, updatedAt: now()
      }, { merge: true });
    }
  } catch(e){ console.error("init failed", e); }
  await loadAll();
  applyTheme();
  render();
  ROOT_DOC.onSnapshot(snap=>{
    setConnection("connected");
    if(!snap.exists) return;
    const d = snap.data();
    if(state.editingLinkId) return;
    state.links      = d.links      || state.links;
    state.categories = d.categories || state.categories;
    state.tags       = d.tags       || state.tags;
    state.logs       = d.logs       || state.logs;
    state.recycle    = d.recycle    || state.recycle;
    state.quickLinks = d.quickLinks || state.quickLinks;
    state.settings   = Object.assign(state.settings, d.settings || {});
    localStorage.setItem(LS_THEME_KEY, state.settings.theme);
    applyTheme();
    render();
  }, err=>{
    console.error("snapshot error", err);
    setConnection("disconnected");
  });
  setInterval(()=>{ updateTimer(); refreshConnection(); }, 5000);
}
boot();
</script>
