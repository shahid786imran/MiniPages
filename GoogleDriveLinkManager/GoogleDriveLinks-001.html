<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Google Drive Link Manager</title>

<!-- Firebase Web SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
/* =========================================================
   THEME VARIABLES
   ========================================================= */
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --surface-2: #eef1f7;
  --border: #d9dee8;
  --text: #1a1d23;
  --muted: #667085;
  --accent: #4f8cff;
  --accent-2: #6ee7b7;
  --danger: #ef4444;
  --shadow: 0 2px 10px rgba(0,0,0,0.08);
  --radius: 12px;
  --bar-width: 280px;
}

html[data-theme="night"] {
  --bg: #000000;
  --surface: #000000;
  --surface-2: #0a0a0a;
  --border: #1a1a1a;
  --text: #e7ebf3;
  --muted: #8b93a3;
  --accent: #4f8cff;
  --accent-2: #6ee7b7;
  --danger: #ff6b6b;
  --shadow: 0 2px 10px rgba(0,0,0,0.6);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  touch-action: pan-y;
}

/* =========================================================
   HEADER
   ========================================================= */
header.app-header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}

header.app-header h1 {
  font-size: 16px;
  margin: 0;
  flex: 1;
  font-weight: 600;
}

header.app-header .icon-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  width: 36px;
  height: 36px;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* =========================================================
   MAIN
   ========================================================= */
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 12px;
  padding-bottom: 140px;
}

.toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.toolbar input[type="search"] {
  flex: 1;
  min-width: 140px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 12px;
  border-radius: var(--radius);
  font-size: 14px;
  outline: none;
}

.toolbar input[type="search"]:focus { border-color: var(--accent); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}

.btn:active { transform: scale(0.97); }
.btn.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.btn.danger { background: var(--danger); color: #fff; }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }

.chip {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 12px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  user-select: none;
}

.chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.chip .x { opacity: 0.7; font-weight: bold; }

/* =========================================================
   CARDS
   ========================================================= */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
}

.card .title-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
.card .title-row h3 { margin: 0; font-size: 15px; flex: 1; word-break: break-word; }
.card .desc { color: var(--muted); font-size: 13px; margin: 4px 0 8px; word-break: break-word; }
.card .path { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.card .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }

.tag {
  background: rgba(79,140,255,0.15);
  color: var(--accent);
  border: 1px solid rgba(79,140,255,0.35);
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 11px;
}

.card .actions { display: flex; gap: 6px; flex-wrap: wrap; }
.card .actions .btn { padding: 7px 10px; font-size: 12px; }

.empty { text-align: center; color: var(--muted); padding: 40px 12px; font-size: 14px; }

/* =========================================================
   FAB
   ========================================================= */
.fab {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  border: none;
  font-size: 28px;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(79,140,255,0.45);
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* =========================================================
   MODAL
   ========================================================= */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
}

.modal-backdrop.show { display: flex; }

.modal {
  background: var(--surface);
  width: 100%;
  max-width: 600px;
  max-height: 92vh;
  overflow-y: auto;
  border-top-left-radius: 16px;
  border-top-right-radius: 16px;
  padding: 16px;
}

.modal h2 { margin: 0 0 12px; font-size: 17px; }

.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }

.field input,
.field textarea,
.field select {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
}

.field input:focus,
.field textarea:focus,
.field select:focus { border-color: var(--accent); }

.field textarea { resize: vertical; min-height: 70px; }
.field .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 16px;
  flex-wrap: wrap;
}

.inline-add { display: flex; gap: 6px; margin-top: 6px; }
.inline-add input { flex: 1; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 90px;
  transform: translateX(-50%);
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 13px;
  z-index: 200;
  box-shadow: var(--shadow);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.toast.show { opacity: 1; }

.banner {
  background: rgba(251,191,36,0.12);
  border: 1px solid rgba(251,191,36,0.4);
  color: #b8860b;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 12px;
  margin-bottom: 12px;
}

.section-title {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--muted);
  margin: 18px 0 8px;
}

.log-item {
  font-size: 12px;
  color: var(--muted);
  padding: 6px 0;
  border-bottom: 1px dashed var(--border);
}

.log-item b { color: var(--text); font-weight: 500; }

/* =========================================================
   LEFT BAR & RIGHT BAR
   ========================================================= */
.side-bar {
  position: fixed;
  top: 0;
  bottom: 0;
  width: var(--bar-width);
  background: var(--surface);
  border-right: 1px solid var(--border);
  z-index: 90;
  transform: translateX(-100%);
  transition: transform 0.25s ease;
  overflow-y: auto;
  padding: 16px 12px 90px;
  box-shadow: 4px 0 20px rgba(0,0,0,0.25);
}

.side-bar.right {
  right: 0;
  left: auto;
  border-right: none;
  border-left: 1px solid var(--border);
  transform: translateX(100%);
  box-shadow: -4px 0 20px rgba(0,0,0,0.25);
}

.side-bar.open { transform: translateX(0); }

.side-bar h3 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--muted);
  margin: 14px 0 8px;
}

.side-bar .side-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 10px;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  color: var(--text);
}

.side-bar .side-item:hover,
.side-bar .side-item.active { background: var(--surface-2); }

.side-bar .side-item .x {
  margin-left: auto;
  color: var(--muted);
  font-size: 16px;
  padding: 0 4px;
}

.bar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 80;
  display: none;
}

.bar-overlay.show { display: block; }

/* =========================================================
   SETTINGS
   ========================================================= */
.setting-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}

.setting-row .lock-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  width: 34px;
  height: 34px;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
  flex-shrink: 0;
}

.setting-row .lock-btn.locked { color: var(--danger); border-color: var(--danger); }

.setting-row .setting-label { flex: 1; font-size: 14px; }
.setting-row .setting-control { display: flex; align-items: center; gap: 6px; }

.setting-row.disabled { opacity: 0.55; }
.setting-row.disabled .setting-control { pointer-events: none; }

/* =========================================================
   SWIPE-UP CONTACT MENU
   ========================================================= */
.contact-menu {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--surface);
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
  border-top: 1px solid var(--border);
  padding: 16px;
  z-index: 150;
  transform: translateY(100%);
  transition: transform 0.28s ease;
  max-width: 600px;
  margin: 0 auto;
  box-shadow: 0 -6px 30px rgba(0,0,0,0.35);
}

.contact-menu.open { transform: translateY(0); }

.contact-menu .handle {
  width: 40px;
  height: 4px;
  background: var(--border);
  border-radius: 999px;
  margin: 0 auto 12px;
}

.contact-menu h3 { margin: 0 0 12px; font-size: 15px; }

.contact-menu .contact-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.contact-menu .contact-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 6px;
  background: var(--surface-2);
  border-radius: 10px;
  font-size: 12px;
  color: var(--text);
  text-decoration: none;
  cursor: pointer;
  border: 1px solid var(--border);
}

.contact-menu .contact-item .ico { font-size: 20px; }

@media (min-width: 640px) {
  .modal-backdrop { align-items: center; }
  .modal { border-radius: 16px; }
}
</style>
</head>
<body>

<!-- ============ LEFT BAR ============ -->
<aside class="side-bar" id="leftBar">
  <h3>Menu</h3>
  <div class="side-item active" data-left-action="all-links">🔗 All Links</div>

  <h3>Categories</h3>
  <div id="leftCatList"></div>

  <h3>Tags</h3>
  <div id="leftTagList"></div>

  <div style="margin-top:16px">
    <button class="btn secondary" id="leftAddCategoryBtn" style="width:100%;margin-bottom:6px">+ Add Category</button>
    <button class="btn secondary" id="leftAddTagBtn" style="width:100%">+ Add Tag</button>
  </div>
</aside>

<!-- ============ RIGHT BAR ============ -->
<aside class="side-bar right" id="rightBar">
  <h3>Settings</h3>
  <div id="settingsList"></div>

  <h3>Activity</h3>
  <div id="activityList" style="font-size:12px;color:var(--muted)"></div>
</aside>

<!-- ============ OVERLAY ============ -->
<div class="bar-overlay" id="barOverlay"></div>

<!-- ============ APP ============ -->
<div id="app"></div>

<!-- ============ CONTACT MENU (swipe up) ============ -->
<div class="contact-menu" id="contactMenu">
  <div class="handle"></div>
  <h3>Quick Contact</h3>
  <div class="contact-grid">
    <a class="contact-item" href="https://wa.me/" target="_blank" rel="noopener">
      <span class="ico">💬</span> WhatsApp
    </a>
    <a class="contact-item" href="mailto:" target="_blank" rel="noopener">
      <span class="ico">✉️</span> Email
    </a>
    <a class="contact-item" href="tel:" target="_blank" rel="noopener">
      <span class="ico">📞</span> Call
    </a>
    <a class="contact-item" href="https://t.me/" target="_blank" rel="noopener">
      <span class="ico">📨</span> Telegram
    </a>
    <a class="contact-item" href="#" id="aboutBtn">
      <span class="ico">ℹ️</span> About
    </a>
    <a class="contact-item" href="#" id="helpBtn">
      <span class="ico">❓</span> Help
    </a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyAFiJNThb3TJsqiPLIcqk20XU9ag59wdOs",
  authDomain: "mywebapps-e3b63.firebaseapp.com",
  projectId: "mywebapps-e3b63",
  storageBucket: "mywebapps-e3b63.firebasestorage.app",
  messagingSenderId: "46681415809",
  appId: "1:46681415809:web:c4528b9da97abc310a2d80"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* Global shared document — no per-user UID paths (as per binding instruction) */
const COLLECTION = "Google Drive Link Manager";
const ROOT_DOC   = db.collection(COLLECTION).doc("app");

/* ============================================================
   STATE
   ============================================================ */
const state = {
  links: [],
  categories: [],
  tags: [],
  logs: [],
  settings: {
    theme: "night",
    swipeBars: true,
    lockSettings: false
  },
  search: "",
  filterCategoryId: "",
  filterTagId: "",
  editingLinkId: null
};

/* ============================================================
   UTILITIES
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const now = () => Date.now();

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

function findCat(id) { return state.categories.find(c => c.id === id) || null; }
function findTag(id) { return state.tags.find(t => t.id === id) || null; }
function findLink(id) { return state.links.find(l => l.id === id) || null; }

function catPath(id) {
  const parts = [];
  let cur = findCat(id), guard = 0;
  while (cur && guard++ < 20) {
    parts.unshift(cur.name);
    cur = cur.parentId ? findCat(cur.parentId) : null;
  }
  return parts.join(" / ");
}

function catDescendants(rootId) {
  const out = new Set([rootId]);
  let added = true;
  while (added) {
    added = false;
    for (const c of state.categories) {
      if (c.parentId && out.has(c.parentId) && !out.has(c.id)) {
        out.add(c.id); added = true;
      }
    }
  }
  return out;
}

/* ============================================================
   FIRESTORE — read / write (global shared paths only)
   ============================================================ */

async function loadAll() {
  try {
    const snap = await ROOT_DOC.get();
    const data = snap.exists ? snap.data() : {};
    state.links      = data.links      || [];
    state.categories = data.categories || [];
    state.tags       = data.tags       || [];
    state.logs       = data.logs       || [];
    state.settings   = Object.assign(state.settings, data.settings || {});
  } catch (e) {
    console.error("loadAll failed", e);
    toast("Firestore read failed");
  }
}

async function persist() {
  try {
    await ROOT_DOC.set({
      links: state.links,
      categories: state.categories,
      tags: state.tags,
      logs: state.logs.slice(0, 300),
      settings: state.settings,
      updatedAt: now()
    }, { merge: true });
  } catch (e) {
    console.error("persist failed", e);
    toast("Firestore write failed");
  }
}

async function logAction(type, detail) {
  state.logs.unshift({ id: uid(), type, detail, at: now() });
  if (state.logs.length > 300) state.logs.length = 300;
  await persist();
}

/* ============================================================
   THEME
   ============================================================ */
function applyTheme() {
  document.documentElement.setAttribute("data-theme", state.settings.theme);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", state.settings.theme === "night" ? "#000000" : "#f4f6fb");
}

/* ============================================================
   ACTION HANDLERS
   ============================================================ */
async function saveLink(payload) {
  const isEdit = !!payload.id;
  const link = {
    id: payload.id || uid(),
    title: payload.title.trim(),
    description: (payload.description || "").trim(),
    url: payload.url.trim(),
    categoryIds: payload.categoryIds || [],
    tagIds: payload.tagIds || [],
    createdAt: isEdit ? (findLink(payload.id)?.createdAt || now()) : now(),
    updatedAt: now()
  };

  const i = state.links.findIndex(l => l.id === link.id);
  if (i >= 0) state.links[i] = link; else state.links.unshift(link);

  await persist();
  await logAction(isEdit ? "edit" : "add", `${link.title} — ${link.url}`);
  toast(isEdit ? "Link updated" : "Link added");
  render();
}

async function removeLink(id) {
  const link = findLink(id);
  if (!link) return;
  if (!confirm(`Delete link "${link.title}"?`)) return;
  state.links = state.links.filter(l => l.id !== id);
  await persist();
  await logAction("delete", link.title);
  toast("Link deleted");
  render();
}

function openDrive(id) {
  const link = findLink(id);
  if (!link) return;
  window.open(link.url, "_blank", "noopener,noreferrer");
  logAction("open", link.title);
}

async function addCategory(name, parentId) {
  name = (name || "").trim();
  if (!name) return;
  const cat = { id: uid(), name, parentId: parentId || "" };
  state.categories.push(cat);
  await persist();
  await logAction("add-category", catPath(cat.id));
  toast("Category added");
  render();
}

async function removeCategory(id) {
  const cat = findCat(id);
  if (!cat) return;
  if (!confirm(`Delete category "${cat.name}" and its sub-categories?`)) return;
  const del = catDescendants(id);
  state.categories = state.categories.filter(c => !del.has(c.id));
  state.links.forEach(l => {
    l.categoryIds = (l.categoryIds || []).filter(cid => !del.has(cid));
  });
  await persist();
  await logAction("delete-category", cat.name);
  toast("Category deleted");
  render();
}

async function addTag(name) {
  name = (name || "").trim();
  if (!name) return;
  if (state.tags.some(t => t.name.toLowerCase() === name.toLowerCase())) {
    toast("Tag already exists"); return;
  }
  const tag = { id: uid(), name };
  state.tags.push(tag);
  await persist();
  await logAction("add-tag", name);
  toast("Tag added");
  render();
}

async function removeTag(id) {
  const tag = findTag(id);
  if (!tag) return;
  if (!confirm(`Delete tag "${tag.name}"?`)) return;
  state.tags = state.tags.filter(t => t.id !== id);
  state.links.forEach(l => { l.tagIds = (l.tagIds || []).filter(t => t !== id); });
  await persist();
  await logAction("delete-tag", tag.name);
  toast("Tag deleted");
  render();
}

/* ============================================================
   FILTER
   ============================================================ */
function visibleLinks() {
  const q = state.search.trim().toLowerCase();
  let list = state.links.slice().sort((a,b) => b.updatedAt - a.updatedAt);

  if (q) {
    list = list.filter(l =>
      l.title.toLowerCase().includes(q) ||
      (l.description || "").toLowerCase().includes(q)
    );
  }
  if (state.filterCategoryId) {
    const set = catDescendants(state.filterCategoryId);
    list = list.filter(l => (l.categoryIds || []).some(c => set.has(c)));
  }
  if (state.filterTagId) {
    list = list.filter(l => (l.tagIds || []).includes(state.filterTagId));
  }
  return list;
}

/* ============================================================
   RENDER — MAIN
   ============================================================ */
function render() {
  applyTheme();
  const app = $("#app");
  app.innerHTML = `
    <header class="app-header">
      <button class="icon-btn" id="openLeft" title="Menu">☰</button>
      <h1>Drive Link Manager</h1>
      <button class="icon-btn" id="themeToggle" title="Theme">${state.settings.theme === "night" ? "☀️" : "🌙"}</button>
      <button class="icon-btn" id="openRight" title="Settings">⚙️</button>
    </header>

    <main>
      <div class="toolbar">
        <input type="search" id="searchInput" placeholder="Search title or description…" value="${esc(state.search)}" />
      </div>

      ${renderActiveFilters()}

      <div id="linksList">${renderLinks()}</div>

      <div class="section-title">Recent Activity</div>
      <div class="card">
        ${state.logs.slice(0, 20).map(l =>
          `<div class="log-item"><b>${esc(l.type)}</b> — ${esc(l.detail)} <span style="float:right">${new Date(l.at).toLocaleString()}</span></div>`
        ).join("") || `<div class="empty">No activity yet</div>`}
      </div>
    </main>

    <button class="fab" id="fabAdd" title="Add link">+</button>

    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal" id="modalBody"></div>
    </div>
  `;
  bindMain();
  renderLeftBar();
  renderRightBar();
}

function renderActiveFilters() {
  const bits = [];
  if (state.search) bits.push(`search: "${esc(state.search)}"`);
  if (state.filterCategoryId) bits.push(`📁 ${esc(catPath(state.filterCategoryId))}`);
  if (state.filterTagId) bits.push(`🏷 ${esc(findTag(state.filterTagId)?.name || "")}`);
  if (!bits.length) return "";
  return `<div class="chips">
    ${bits.map(b => `<span class="chip active">${b}</span>`).join("")}
    <span class="chip" id="clearFilters">Clear ×</span>
  </div>`;
}

function renderLinks() {
  const list = visibleLinks();
  if (!list.length) {
    return `<div class="empty">No saved links yet.<br>Tap the + button to add one.</div>`;
  }
  return list.map(link => {
    const cats = (link.categoryIds || []).map(catPath).filter(Boolean).map(esc).join(", ");
    const tags = (link.tagIds || []).map(findTag).filter(Boolean)
      .map(t => `<span class="tag">${esc(t.name)}</span>`).join("");
    return `
      <div class="card">
        <div class="title-row"><h3>${esc(link.title)}</h3></div>
        ${link.description ? `<div class="desc">${esc(link.description)}</div>` : ""}
        ${cats ? `<div class="path">📁 ${cats}</div>` : ""}
        ${tags ? `<div class="tags">${tags}</div>` : ""}
        <div class="actions">
          <button class="btn" data-open="${link.id}">Open in Drive</button>
          <button class="btn secondary" data-edit="${link.id}">Edit</button>
          <button class="btn danger" data-del="${link.id}">Delete</button>
        </div>
      </div>
    `;
  }).join("");
}

function renderLeftBar() {
  $("#leftCatList").innerHTML = state.categories
    .filter(c => !c.parentId)
    .sort((a,b) => a.name.localeCompare(b.name))
    .map(c => renderCatNode(c, 0))
    .join("") || `<div style="font-size:12px;color:var(--muted);padding:4px">No categories yet</div>`;

  $("#leftTagList").innerHTML = state.tags
    .map(t => `<div class="side-item" data-tag-filter="${t.id}">🏷 ${esc(t.name)} <span class="x" data-del-tag="${t.id}">×</span></div>`)
    .join("") || `<div style="font-size:12px;color:var(--muted);padding:4px">No tags yet</div>`;

  // BIND left bar events
  $$("#leftCatList [data-cat-filter]").forEach(el => {
    el.onclick = (e) => {
      if (e.target.matches("[data-del-cat]")) return;
      state.filterCategoryId = el.dataset.catFilter;
      state.filterTagId = "";
      closeBars();
      render();
    };
  });
  $$("#leftCatList [data-del-cat]").forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); removeCategory(el.dataset.delCat); };
  });
  $$("#leftCatList [data-add-sub]").forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const name = prompt("Sub-category name:");
      if (name) addCategory(name, el.dataset.addSub);
    };
  });
  $$("#leftTagList [data-del-tag]").forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); removeTag(el.dataset.delTag); };
  });
  $$("#leftTagList [data-tag-filter]").forEach(el => {
    el.onclick = () => {
      state.filterTagId = el.dataset.tagFilter;
      state.filterCategoryId = "";
      closeBars();
      render();
    };
  });

  $("#leftAddCategoryBtn").onclick = () => {
    const name = prompt("Category name:");
    if (name) addCategory(name, "");
  };
  $("#leftAddTagBtn").onclick = () => {
    const name = prompt("Tag name:");
    if (name) addTag(name);
  };
}

function renderCatNode(cat, depth) {
  const children = state.categories
    .filter(c => c.parentId === cat.id)
    .sort((a,b) => a.name.localeCompare(b.name));
  return `
    <div class="side-item" data-cat-filter="${cat.id}" style="padding-left:${10 + depth*14}px">
      📁 ${esc(cat.name)}
      <button class="x" data-add-sub="${cat.id}" title="Add sub" style="border:none;background:transparent;color:var(--muted);cursor:pointer">+</button>
      <span class="x" data-del-cat="${cat.id}" title="Delete">×</span>
    </div>
    ${children.map(c => renderCatNode(c, depth + 1)).join("")}
  `;
}

function renderRightBar() {
  const s = state.settings;
  const lock = s.lockSettings;

  $("#settingsList").innerHTML = `
    ${renderSettingRow("theme", "Theme (Day / Night)", `
      <select id="setTheme" ${lock ? "disabled" : ""}>
        <option value="night" ${s.theme==="night"?"selected":""}>Night (AMOLED black)</option>
        <option value="day" ${s.theme==="day"?"selected":""}>Day</option>
      </select>
    `, lock)}

    ${renderSettingRow("swipeBars", "Swipe to show/hide bars", `
      <input type="checkbox" id="setSwipe" ${s.swipeBars?"checked":""} ${lock?"disabled":""} />
    `, lock)}

    ${renderSettingRow("lockSettings", "Lock all settings (master)", `
      <input type="checkbox" id="setLock" ${s.lockSettings?"checked":""} />
    `, false)}
  `;

  // Lock buttons (independent per row)
  $$("#settingsList .lock-btn").forEach(btn => {
    btn.onclick = async () => {
      const key = btn.dataset.lockFor;
      state.settings["lock_" + key] = !state.settings["lock_" + key];
      await persist();
      render();
    };
  });

  const setTheme = $("#setTheme");
  if (setTheme) setTheme.onchange = async (e) => {
    state.settings.theme = e.target.value;
    await persist();
    applyTheme(); render();
  };

  const setSwipe = $("#setSwipe");
  if (setSwipe) setSwipe.onchange = async (e) => {
    state.settings.swipeBars = e.target.checked;
    await persist();
  };

  const setLock = $("#setLock");
  if (setLock) setLock.onchange = async (e) => {
    state.settings.lockSettings = e.target.checked;
    await persist();
    render();
  };

  $("#activityList").innerHTML = state.logs.slice(0, 15).map(l =>
    `<div class="log-item"><b>${esc(l.type)}</b> — ${esc(l.detail)}</div>`
  ).join("") || `<div style="padding:4px">No activity</div>`;
}

function renderSettingRow(key, label, controlHtml, locked) {
  const lockedByBtn = !!state.settings["lock_" + key];
  const isLocked = locked || lockedByBtn;
  return `
    <div class="setting-row ${isLocked ? "disabled" : ""}">
      <button class="lock-btn ${lockedByBtn ? "locked" : ""}" data-lock-for="${key}" title="Lock this setting">
        ${lockedByBtn ? "🔒" : "🔓"}
      </button>
      <div class="setting-label">${esc(label)}</div>
      <div class="setting-control">${controlHtml}</div>
    </div>
  `;
}

/* ============================================================
   MAIN BINDINGS
   ============================================================ */
function bindMain() {
  $("#openLeft").onclick = () => openBar("left");
  $("#openRight").onclick = () => openBar("right");
  $("#barOverlay").onclick = closeBars;

  $("#themeToggle").onclick = async () => {
    state.settings.theme = state.settings.theme === "night" ? "day" : "night";
    await persist();
    applyTheme(); render();
  };

  $("#searchInput").oninput = (e) => {
    state.search = e.target.value;
    const list = $("#linksList");
    if (list) list.innerHTML = renderLinks();
  };

  const clear = $("#clearFilters");
  if (clear) clear.onclick = () => {
    state.search = ""; state.filterCategoryId = ""; state.filterTagId = "";
    render();
  };

  $("#fabAdd").onclick = () => openLinkModal();

  const list = $("#linksList");
  if (list) list.addEventListener("click", (e) => {
    const o = e.target.closest("[data-open]");
    const ed = e.target.closest("[data-edit]");
    const d = e.target.closest("[data-del]");
    if (o) openDrive(o.dataset.open);
    if (ed) openLinkModal(ed.dataset.edit);
    if (d) removeLink(d.dataset.del);
  });
}

/* ============================================================
   MODAL — Add / Edit link (with inline category & tag add)
   ============================================================ */
function closeModal() {
  $("#modalBackdrop").classList.remove("show");
  state.editingLinkId = null;
}

function openLinkModal(linkId) {
  const link = linkId ? findLink(linkId) : null;
  state.editingLinkId = linkId || null;

  const selCats = new Set(link?.categoryIds || []);
  const selTags = new Set(link?.tagIds || []);

  $("#modalBody").innerHTML = `
    <h2>${link ? "Edit link" : "Add link"}</h2>

    <div class="field">
      <label>Title</label>
      <input id="f_title" value="${esc(link?.title || "")}" placeholder="e.g. March invoices" />
    </div>

    <div class="field">
      <label>Description</label>
      <textarea id="f_desc" placeholder="Short note…">${esc(link?.description || "")}</textarea>
    </div>

    <div class="field">
      <label>Google Drive folder URL</label>
      <input id="f_url" value="${esc(link?.url || "")}" placeholder="https://drive.google.com/drive/folders/…" />
      <div class="hint">Copy &amp; paste from Google Drive.</div>
    </div>

    <div class="field">
      <label>Categories (tap to select)</label>
      <div id="catChecks" style="max-height:180px;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:8px">
        ${renderCatChecks(selCats)}
      </div>
      <div class="inline-add">
        <input id="modalNewCat" placeholder="New category…" />
        <button class="btn secondary" id="modalAddCat">Add</button>
      </div>
    </div>

    <div class="field">
      <label>Tags (tap to toggle)</label>
      <div id="tagToggles" class="chips">
        ${state.tags.map(t => `<span class="chip ${selTags.has(t.id)?"active":""}" data-tag-toggle="${t.id}">${esc(t.name)}</span>`).join("") || `<span class="muted" style="font-size:12px">No tags yet</span>`}
      </div>
      <div class="inline-add">
        <input id="modalNewTag" placeholder="New tag…" />
        <button class="btn secondary" id="modalAddTag">Add</button>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn ghost" id="cancelBtn">Cancel</button>
      <button class="btn" id="saveBtn">${link ? "Save changes" : "Add link"}</button>
    </div>
  `;

  $("#modalBackdrop").classList.add("show");

  $("#cancelBtn").onclick = closeModal;

  $$("#tagToggles .chip").forEach(chip => {
    chip.onclick = () => {
      const id = chip.dataset.tagToggle;
      if (selTags.has(id)) selTags.delete(id); else selTags.add(id);
      chip.classList.toggle("active");
    };
  });

  $$("#catChecks input[data-cat]").forEach(cb => {
    cb.onchange = () => {
      if (cb.checked) selCats.add(cb.dataset.cat); else selCats.delete(cb.dataset.cat);
    };
  });

  $("#modalAddCat").onclick = async () => {
    const name = $("#modalNewCat").value.trim();
    if (!name) return;
    const cat = { id: uid(), name, parentId: "" };
    state.categories.push(cat);
    await persist();
    selCats.add(cat.id);
    $("#catChecks").innerHTML = renderCatChecks(selCats);
    $$("#catChecks input[data-cat]").forEach(cb => {
      cb.onchange = () => {
        if (cb.checked) selCats.add(cb.dataset.cat); else selCats.delete(cb.dataset.cat);
      };
    });
    $("#modalNewCat").value = "";
    toast("Category added");
  };

  $("#modalAddTag").onclick = async () => {
    const name = $("#modalNewTag").value.trim();
    if (!name) return;
    if (state.tags.some(t => t.name.toLowerCase() === name.toLowerCase())) {
      toast("Tag already exists"); return;
    }
    const tag = { id: uid(), name };
    state.tags.push(tag);
    await persist();
    selTags.add(tag.id);
    $("#tagToggles").innerHTML = state.tags.map(t =>
      `<span class="chip ${selTags.has(t.id)?"active":""}" data-tag-toggle="${t.id}">${esc(t.name)}</span>`
    ).join("");
    $$("#tagToggles .chip").forEach(chip => {
      chip.onclick = () => {
        const id = chip.dataset.tagToggle;
        if (selTags.has(id)) selTags.delete(id); else selTags.add(id);
        chip.classList.toggle("active");
      };
    });
    $("#modalNewTag").value = "";
    toast("Tag added");
  };

  $("#saveBtn").onclick = async () => {
    const title = $("#f_title").value;
    const description = $("#f_desc").value;
    const url = $("#f_url").value;
    if (!title.trim()) return toast("Title required");
    if (!/^https?:\/\//i.test(url.trim())) return toast("Valid URL required (http/https)");
    await saveLink({
      id: link?.id,
      title, description, url,
      categoryIds: Array.from(selCats),
      tagIds: Array.from(selTags)
    });
    closeModal();
  };
}

function renderCatChecks(selSet) {
  let html = "";
  const walk = (parentId, depth) => {
    state.categories
      .filter(c => (c.parentId || "") === (parentId || ""))
      .sort((a,b) => a.name.localeCompare(b.name))
      .forEach(c => {
        html += `<label style="display:block;padding:3px 0 3px ${depth*14}px;font-size:13px">
          <input type="checkbox" data-cat="${c.id}" ${selSet.has(c.id)?"checked":""} style="margin-right:6px" />
          ${esc(c.name)}
        </label>`;
        walk(c.id, depth + 1);
      });
  };
  walk("", 0);
  return html;
}

/* ============================================================
   BARS — open / close + swipe gestures
   ============================================================ */
function openBar(side) {
  closeBars();
  const bar = side === "left" ? $("#leftBar") : $("#rightBar");
  bar.classList.add("open");
  $("#barOverlay").classList.add("show");
}

function closeBars() {
  $("#leftBar").classList.remove("open");
  $("#rightBar").classList.remove("open");
  $("#barOverlay").classList.remove("show");
}

/* Swipe gestures:
   - swipe right anywhere (when bars closed) → open left bar
   - swipe left anywhere (when bars closed) → open right bar
   - swipe left on left bar or swipe right on right bar → close
   - swipe up from bottom of main → contact menu
*/
let touchStartX = 0, touchStartY = 0, touchStartT = 0;

document.addEventListener("touchstart", (e) => {
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchStartT = Date.now();
}, { passive: true });

document.addEventListener("touchend", (e) => {
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const dt = Date.now() - touchStartT;

  if (dt > 700) return;
  if (!state.settings.swipeBars) return;

  const leftOpen = $("#leftBar").classList.contains("open");
  const rightOpen = $("#rightBar").classList.contains("open");

  // Swipe up → contact menu (only when bars are closed)
  if (!leftOpen && !rightOpen && Math.abs(dy) > 80 && Math.abs(dy) > Math.abs(dx) && dy < 0) {
    const contact = $("#contactMenu");
    if (!contact.classList.contains("open")) {
      contact.classList.add("open");
      return;
    }
  }

  // Swipe down → close contact menu
  if ($("#contactMenu").classList.contains("open") && dy > 60 && Math.abs(dy) > Math.abs(dx)) {
    $("#contactMenu").classList.remove("open");
    return;
  }

  // Horizontal swipes
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0) {
      // swipe right
      if (leftOpen) closeBars();
      else if (!rightOpen) openBar("left");
    } else {
      // swipe left
      if (rightOpen) closeBars();
      else if (!leftOpen) openBar("right");
    }
  }
}, { passive: true });

// Close contact menu on tap outside
document.addEventListener("click", (e) => {
  const contact = $("#contactMenu");
  if (contact.classList.contains("open") &&
      !contact.contains(e.target) &&
      !e.target.closest("#fabAdd")) {
    contact.classList.remove("open");
  }
});

/* Prevent pinch-zoom (also covered by viewport meta) */
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("touchmove", (e) => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

/* About / Help buttons */
document.addEventListener("click", (e) => {
  if (e.target.closest("#aboutBtn")) { alert("Google Drive Link Manager\nFirestore collection: " + COLLECTION); }
  if (e.target.closest("#helpBtn")) { alert("Swipe right → left bar\nSwipe left → right bar\nSwipe up → contact menu\nTap + to add link"); }
});

/* ============================================================
   BOOT
   ============================================================ */
async function boot() {
  applyTheme();
  await loadAll();
  applyTheme();
  render();
  // Live sync across devices/tabs
  ROOT_DOC.onSnapshot((snap) => {
    if (!snap.exists) return;
    const d = snap.data();
    // Avoid clobbering local edits in progress
    if (state.editingLinkId) return;
    state.links      = d.links      || state.links;
    state.categories = d.categories || state.categories;
    state.tags       = d.tags       || state.tags;
    state.logs       = d.logs       || state.logs;
    state.settings   = Object.assign(state.settings, d.settings || {});
    applyTheme();
    render();
  });
}

boot();
</script>
</body>
</html>
