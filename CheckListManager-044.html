<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b4fc4"><title>Nested Checklist Manager</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--text:#0f172a;--muted:#778096;--line:#e5e9f2;--accent:#5267d9;--accent2:#e9edff;--danger:#d94343;--green:#21865b;--shadow:0 8px 28px #26345b12;--font-size:14px;--task-h:22px;
  --task-bg:linear-gradient(135deg,#0e7490,#14b8a6);--task-border:#0f172a;--task-text:#000;
  --task-pct:#000;--task-date:#000;--task-handle:#000;
  --cl-bg:linear-gradient(135deg,#ccfbf1,#ecfccb);--cl-border:#0f172a;--cl-text:#000;
  --cl-handle:#000;--cl-plus-bg:#fff;--cl-plus-border:#000;--cl-plus-text:#000;
  --cl-done-bg:#cbd5e1;--cl-done-text:#000;
  --prog-bg:rgba(255,255,255,.2);--prog-fill:#06b6d4;
  --done-bg:linear-gradient(135deg,#cfd9e3,#e3ebf1);

  /* Glass tokens */
  --g-text:#000;
  --g-muted:#334155;
  --g-border1:rgba(13,148,136,.5);
  --g-border2:rgba(6,182,212,.5);
  --g-bg1:linear-gradient(90deg,rgba(204,251,241,.55),rgba(236,252,203,.35) 50%,rgba(255,255,255,.6));
  --g-bg2:linear-gradient(90deg,rgba(165,243,252,.5),rgba(187,247,208,.35) 50%,rgba(255,255,255,.6));
  --g-shadow:0 6px 18px rgba(20,184,166,.18),0 2px 6px rgba(15,23,42,.08),inset 0 2px 3px rgba(255,255,255,.85),inset 0 -1px 2px rgba(15,23,42,.08),inset 0 0 0 1px rgba(20,184,166,.15);
  --g-pill-bg:#fff;
  --g-pill-fg:#000;
  --g-pill-border:rgba(20,184,166,.4);
  --g-del-bg:rgba(252,165,165,.3);
  --g-del-fg:#b91c1c;
  --g-del-border:rgba(252,165,165,.5);

  /* Task header dark glass */
  --g-task-bg1:linear-gradient(135deg,rgba(30,27,75,.92),rgba(67,56,202,.88));
  --g-task-bg2:linear-gradient(135deg,rgba(76,29,149,.92),rgba(190,24,93,.85));
  --g-task-border:rgba(255,255,255,.18);
  --g-task-text:#000;
  --g-task-muted:#000;
  --g-task-pill-bg:#fff;
  --g-task-pill-fg:#000;
  --g-task-pill-border:rgba(0,0,0,.25);
  --g-task-shadow:0 8px 22px rgba(30,27,75,.35),inset 0 2px 3px rgba(255,255,255,.25),inset 0 -1px 2px rgba(0,0,0,.25);

  /* Done sub-task */
  --g-done-bg1:linear-gradient(135deg,rgba(203,213,225,.7),rgba(226,232,240,.55));
  --g-done-bg2:linear-gradient(135deg,rgba(214,222,233,.7),rgba(237,242,248,.55));
  --g-done-border:rgba(148,163,184,.6);
  --g-done-text:#000;

  /* Plus glass tokens */
  --plus-glass-bg:rgba(255,255,255,.28);
  --plus-glass-border:rgba(255,255,255,.55);
  --plus-glass-text:#000;
  --plus-glass-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -1px 1px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.15);
  --plus-glass-border-dark:#0d4759;
}
*{box-sizing:border-box}
html,body{margin:0;height:auto}
body{color:var(--g-text);font:var(--font-size)/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial;min-height:100dvh;overflow-x:hidden;-webkit-user-select:none;user-select:none;background:var(--page-bg,#ecfeff);background-attachment:fixed;transition:background .5s ease}
body.locked{overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:8px 12px;background:var(--accent);color:#fff;font-weight:600}
.hidden{display:none!important}

#fbPill{position:fixed;top:10px;left:50%;transform:translateX(-50%) translateY(-40px);background:#21865b;color:#fff;padding:6px 16px;border-radius:999px;font-size:12px;font-weight:700;box-shadow:0 6px 18px #21865b55;z-index:120;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
#fbPill.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fbPill.sync{background:#c07a1a;box-shadow:0 6px 18px #c07a1a55}
#fbPill.off{background:#d94343;box-shadow:0 6px 18px #d9434355}

#loader{position:fixed;inset:0;background:linear-gradient(135deg,#e0e7ff,#fce7f3);display:flex;align-items:center;justify-content:center;z-index:200;transition:opacity .3s}
#loader.hide{opacity:0;pointer-events:none}
.dots{display:flex;gap:8px}
.dots span{width:12px;height:12px;background:#8b5cf6;border-radius:50%;animation:dotBounce .6s ease-in-out infinite alternate}
.dots span:nth-child(2){animation-delay:.15s;background:#ec4899}
.dots span:nth-child(3){animation-delay:.3s;background:#38bdf8}
@keyframes dotBounce{from{transform:translateY(0);opacity:.6}to{transform:translateY(-14px);opacity:1}}

.app{max-width:1100px;margin:0 auto;padding:14px;padding-top:52px;min-height:100dvh;display:flex;flex-direction:column;justify-content:flex-start}
.main{background:transparent;padding:0;width:100%;max-width:480px;margin:0 auto}
.field{background:var(--panel);color:var(--g-text);border:1px solid var(--g-pill-border);border-radius:4px;padding:11px 12px;width:100%;font-size:var(--font-size);margin:2px 0;min-width:0}

.glass,.gRow{
  display:flex;align-items:center;gap:8px;
  padding:6px 8px;border-radius:10px;
  backdrop-filter:blur(18px) saturate(200%);
  -webkit-backdrop-filter:blur(18px) saturate(200%);
  box-shadow:var(--g-shadow);
  border:1.5px solid var(--g-border1);
  background:var(--g-bg1);
  transition:transform .12s ease,filter .15s ease,background .3s ease,color .3s ease;
  min-width:0;
}
.glass:nth-child(even),.gRow:nth-child(even){border-color:var(--g-border2);background:var(--g-bg2)}
.glass:active,.gRow:active{transform:scale(.985);filter:brightness(1.03)}

.listWrap{padding:0;position:relative}
.titem{margin:6px 0 0 0;position:relative;transition:opacity .3s ease;will-change:transform}

.titem.task > .line{
  position:relative;
  display:flex;align-items:center;gap:5px;
  padding:2px 7px 7px 7px;
  border-radius:8px;min-height:var(--task-h);
  backdrop-filter:blur(18px) saturate(200%);
  -webkit-backdrop-filter:blur(18px) saturate(200%);
  box-shadow:var(--g-task-shadow);
  border:1.5px solid var(--g-task-border);
  background:var(--g-task-bg1);
  color:var(--g-task-text);
  overflow:hidden;
  transition:transform .12s ease,filter .15s ease,background .5s ease,color .5s ease;
  cursor:pointer;
}
.titem.task:nth-child(even) > .line{background:var(--g-task-bg2)}
.titem.task > .line:active{transform:scale(.99)}
.titem.task > .line .handle{color:var(--g-task-muted)}
.titem.task > .line .lastDate{color:var(--g-task-muted)}
.titem.task > .line .pct{color:var(--g-task-text);background:transparent;border:0;padding:0 2px}
.titem.task > .line .pencilBtn,.titem.task > .line .editBtn{color:#000}

/* Plus Glass (changes 19 + 22) */
.plus{
  background:var(--plus-glass-bg);
  color:var(--plus-glass-text);
  border:1px solid var(--plus-glass-border);
  border-bottom-color:var(--plus-glass-border-dark);
  border-radius:7px;padding:0 6px;font-weight:800;font-size:11px;flex:none;height:20px;line-height:18px;
  display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;
  backdrop-filter:blur(10px) saturate(180%);
  -webkit-backdrop-filter:blur(10px) saturate(180%);
  box-shadow:var(--plus-glass-shadow);
}
.plus:active{transform:scale(.95)}

.titem.doneSub > .line{
  display:flex;align-items:center;gap:5px;
  padding:2px 7px;border-radius:8px;min-height:calc(var(--task-h) - 2px);
  background:var(--g-done-bg1);
  border:1.5px solid var(--g-done-border);
  box-shadow:0 4px 12px rgba(99,102,241,.12),inset 0 1px 2px rgba(255,255,255,.8);
  color:var(--g-done-text);cursor:pointer;
  transition:transform .12s ease,background .5s ease;
}
.titem.doneSub:nth-child(even) > .line{background:var(--g-done-bg2)}
.titem.doneSub > .line:active{transform:scale(.99)}

.titem.checklist > .line{
  display:flex;align-items:center;gap:6px;
  padding:6px 8px;border-radius:8px;
  backdrop-filter:blur(18px) saturate(200%);
  -webkit-backdrop-filter:blur(18px) saturate(200%);
  box-shadow:var(--g-shadow);
  border:1.5px solid var(--g-border1);
  background:var(--g-bg1);
  color:var(--g-text);
  transition:background .3s ease,color .3s ease,box-shadow .3s ease,border-color .3s ease;
  will-change:transform;
}
.titem.checklist:nth-child(even) > .line{border-color:var(--g-border2);background:var(--g-bg2)}

/* Immediate strike-through + grey (change 1) */
.titem.checklist.completed > .line{
  background:linear-gradient(90deg,rgba(203,213,225,.7),rgba(226,232,240,.55)) !important;
  border-color:rgba(148,163,184,.6) !important;
  color:#475569 !important;
  box-shadow:0 4px 12px rgba(99,102,241,.1),inset 0 1px 2px rgba(255,255,255,.8);
}
.titem.checklist.completed .name{opacity:.75;transition:opacity .3s ease;color:#475569}
.titem.checklist .name{position:relative;display:inline-block}
.titem.checklist .name::after{
  content:"";position:absolute;left:0;top:50%;height:1px;width:0%;
  background:linear-gradient(90deg,transparent,currentColor 20%,currentColor 80%,transparent);
  transform:translateY(-50%);transition:width .25s ease;pointer-events:none;
}
.titem.checklist.completed .name::after{width:100%}

.titem.pending-pulse > .line{
  border-color:#f59e0b !important;
  animation:pendingPulse .5s ease-in-out infinite;
}
@keyframes pendingPulse{
  0%,100%{box-shadow:0 0 0 2px rgba(245,158,11,.35),0 4px 14px rgba(217,119,6,.2),inset 0 1px 2px rgba(255,255,255,.85)}
  50%{box-shadow:0 0 0 5px rgba(245,158,11,.15),0 4px 14px rgba(217,119,6,.25),inset 0 1px 2px rgba(255,255,255,.85)}
}

.handle{color:var(--g-muted);font-size:13px;flex:none;padding:0;margin:0;width:13px;text-align:center;display:inline-flex;align-items:center;justify-content:center;line-height:1;cursor:grab;touch-action:none}
.handle:active{cursor:grabbing}

.iconBox{flex:none;width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;box-shadow:inset 0 1px 2px rgba(255,255,255,.6)}
.ic-purple{background:linear-gradient(135deg,#c4b5fd,#a5b4fc)}
.ic-green{background:linear-gradient(135deg,#86efac,#4ade80)}
.ic-yellow{background:linear-gradient(135deg,#fcd34d,#fbbf24)}
.ic-blue{background:linear-gradient(135deg,#7dd3fc,#38bdf8)}
.ic-pink{background:linear-gradient(135deg,#f9a8d4,#f472b6)}
.ic-slate{background:linear-gradient(135deg,#cbd5e1,#94a3b8)}
.ic-red{background:linear-gradient(135deg,#fca5a5,#f87171)}

.check{width:15px;height:15px;accent-color:#0d9488;flex:none;margin:0}
.check.hidden-check{display:none}

.nameBlock{
  flex:1 1 auto;min-width:0;
  display:inline-flex;align-items:center;gap:4px;
  overflow-x:auto;overflow-y:hidden;white-space:nowrap;
  scrollbar-width:none;-ms-overflow-style:none;
}
.nameBlock::-webkit-scrollbar{display:none;height:0}
.name{display:inline-block;white-space:nowrap;font-weight:700;font-size:var(--font-size);color:inherit;line-height:1.2;position:relative}
.titem.task .name{color:var(--g-task-text)}
.titem.checklist .name{color:var(--g-text)}
.titem.doneSub .name{color:var(--g-done-text)}

.lastDate{font-size:8px;font-weight:600;flex:none;opacity:.75;line-height:1;margin-left:2px;display:inline-flex;align-items:center;color:var(--g-muted)}
.pct{font-weight:800;font-size:9.5px;flex:none;line-height:15px;background:var(--g-pill-bg);color:var(--g-pill-fg);border:1px solid var(--g-pill-border);padding:0 7px;border-radius:99px}

.endGroup{display:flex;align-items:center;gap:4px;flex:none}

.editBtn{background:transparent;color:inherit;opacity:.85;border:0;padding:2px 5px;font-size:12px;border-radius:4px;flex:none;cursor:pointer;margin-left:2px}
.pencilBtn{background:transparent;color:inherit;opacity:.9;border:0;padding:2px 6px;font-size:12px;border-radius:4px;flex:none;cursor:pointer;margin-left:2px}
.pinBtn{background:rgba(255,255,255,.7);color:#4338ca;border:1px solid rgba(99,102,241,.35);border-radius:7px;padding:0 6px;font-size:11px;flex:none;cursor:pointer;height:20px;margin-left:2px;line-height:18px}
.delDoneBtn{background:var(--g-del-bg);color:var(--g-del-fg);border:1px solid var(--g-del-border);border-radius:4px;padding:0 5px;font-size:11px;flex:none;cursor:pointer;margin-left:2px;height:18px;line-height:16px}
.unblod{color:var(--g-muted);opacity:.95;font-size:10px;font-weight:700;flex:none;margin-left:2px;cursor:pointer}

.progIn{
  position:absolute;left:0;right:0;bottom:0;
  height:4px;
  background:rgba(255,255,255,.2);
  overflow:hidden;
  border-bottom-left-radius:8px;border-bottom-right-radius:8px;
  pointer-events:none;
}
.progIn i{
  display:block;height:100%;width:0;
  background:var(--prog-fill);
  position:relative;
  transition:width .8s cubic-bezier(.22,1,.36,1);
  will-change:width;
}
.progIn i::after{
  content:"";position:absolute;left:0;right:0;top:-50%;height:200%;
  background:rgba(255,255,255,.35);border-radius:45%;
  animation:wave 2s linear infinite;
}
@keyframes wave{from{transform:translateX(-100%) rotate(0)}to{transform:translateX(100%) rotate(360deg)}}

.childrenWrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .4s cubic-bezier(.22,1,.36,1),opacity .35s ease}
.childrenWrap.collapsed{grid-template-rows:0fr;opacity:0}
.childrenInner{overflow:hidden;min-height:0;padding:2px 0 4px 0}

/* Done heading tight gap (change 4) */
.doneSubBlock{margin-top:0;padding-top:0}
.doneSubBlock .titem.doneSub{margin-top:0}

.flyClone{position:fixed;z-index:9999;pointer-events:none;box-shadow:0 12px 30px rgba(99,102,241,.25);will-change:transform,opacity;border-radius:10px;overflow:hidden}
.placeholder{border:1px dashed rgba(99,102,241,.35);background:rgba(255,255,255,.3);border-radius:10px;overflow:hidden;transition:height .5s cubic-bezier(.22,1,.36,1),opacity .3s ease,margin .5s cubic-bezier(.22,1,.36,1)}

.titem.fadeIn{animation:fadeIn .7s ease forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.inlineInput{display:flex;gap:6px;padding:4px 8px 6px 8px}
.inlineInput input{flex:1;border:1px solid var(--g-pill-border);border-radius:8px;padding:6px 9px;font-size:12px;min-width:0;background:#fff;color:#000}
.inlineEditRow{display:flex;gap:6px;align-items:center}
.inlineEditRow input{flex:1;border:1px solid var(--g-pill-border);border-radius:8px;padding:6px 9px;font-size:12px;min-width:0;background:#fff;color:#000}
.inlineEditRow.inline{flex:1 1 auto;min-width:0;display:flex;margin:0}
.inlineEditRow.inline input{font-size:var(--font-size);font-weight:700;padding:2px 6px;border-radius:5px;height:calc(var(--font-size) + 6px)}
.floating{position:fixed;pointer-events:none;box-shadow:0 12px 28px #0005;z-index:9999;transform:scale(1.03);border:1px solid #c5cdf0;opacity:.95;border-radius:10px}
.placeholder2{border:2px dashed #8b5cf6;border-radius:10px;margin:4px 0;background:rgba(196,181,253,.25)}
.muted{color:var(--g-muted);font-size:12px}
.empty{text-align:center;color:var(--g-muted);padding:20px}
.pageFoot{text-align:center;font-size:11px;color:var(--g-muted);padding:14px 0 6px}

.modal{position:fixed;inset:0;background:rgba(30,27,75,.45);display:flex;align-items:flex-end;justify-content:center;padding:0;z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s ease}
.modal.open{opacity:1;pointer-events:auto}
.modal-card{width:92%;max-width:480px;max-height:80vh;overflow:auto;background:#fff;border:1px solid rgba(79,70,229,.5);border-radius:20px 20px 0 0;box-shadow:0 -20px 60px rgba(165,180,252,.4);transform:translateY(100%);transition:transform .4s cubic-bezier(.22,1,.36,1)}
.modal.open .modal-card{transform:translateY(0)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;font-weight:800;font-size:13px;color:var(--g-text);backdrop-filter:blur(18px) saturate(200%);-webkit-backdrop-filter:blur(18px) saturate(200%);background:var(--g-bg1);border-bottom:1.5px solid var(--g-border1)}
.modal-head button{flex:none;width:24px;height:24px;background:#fff;color:var(--g-text);border:1px solid var(--g-pill-border);border-radius:8px;font-weight:800;padding:0;display:inline-flex;align-items:center;justify-content:center}
.modal-body{padding:10px;display:flex;flex-direction:column;gap:4px}
.modal-actions{display:flex;gap:6px;padding:0 12px 12px}
.modal-actions button{flex:1;padding:9px 10px;border:0;border-radius:9px;font-weight:700;font-size:12px;cursor:pointer}
.modal-actions .s{background:#e9edff;color:#000}
.modal-actions .p{background:#8b5cf6;color:#fff}

.optList{display:flex;flex-direction:column;gap:4px}
.optList .gRow{width:100%;cursor:pointer;color:var(--g-text);font-weight:700;padding:10px;text-align:left}
.optList .gRow .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}
.optRow{display:flex;gap:4px}
.optRow .gRow{flex:1;justify-content:center}
.optRow .gRow .txt{flex:none}

.moveTree{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow:auto}
.moveItem{display:flex;gap:6px;align-items:center;padding:8px 10px;font-size:13px;cursor:pointer;border-radius:10px;background:#fff;border:1px solid var(--g-pill-border);color:var(--g-text)}
.moveItem:hover{background:#f7f9ff;border-color:#8b5cf6}
.moveItem.indent1{margin-left:16px}
.moveItem.indent2{margin-left:32px}
.moveItem.indent3{margin-left:48px}

.cdTable{width:100%;border-collapse:collapse;font-size:12px}
.cdTable th,.cdTable td{border:1px solid rgba(99,102,241,.3);padding:5px 8px;text-align:left}
.cdTable th{background:rgba(196,181,253,.4);color:#4338ca;font-weight:700}
.cdTable td.sr{text-align:center;width:36px;color:#4338ca;font-weight:700}
.cdTable td.type.checked{color:#21865b;font-weight:700}
.cdTable td.type.unchecked{color:#c07a1a;font-weight:700}
.cdTable td.del{width:36px;text-align:center}
.delEntryBtn{background:transparent;border:0;color:#a82020;font-size:14px;cursor:pointer;padding:2px 6px;border-radius:4px}

.settingsModal{background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -20px 60px rgba(165,180,252,.4);width:92%;max-width:480px;max-height:85vh;display:flex;flex-direction:column;border:1px solid rgba(79,70,229,.5);overflow:hidden}
.settingsModal .head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;font-weight:800;font-size:13px;color:var(--g-text);backdrop-filter:blur(18px) saturate(200%);background:var(--g-bg1);border-bottom:1.5px solid var(--g-border1)}
.settingsModal .head button{flex:none;width:24px;height:24px;background:#fff;color:var(--g-text);border:1px solid var(--g-pill-border);border-radius:8px;font-weight:800;padding:0;display:inline-flex;align-items:center;justify-content:center}
.settingsModal .body{padding:10px;overflow-y:auto;overflow-x:hidden;flex:1 1 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:4px}
.setItem{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:7px 10px;border-radius:10px;color:var(--g-text);
  backdrop-filter:blur(18px) saturate(200%);box-shadow:var(--g-shadow);border:1.5px solid var(--g-border1);background:var(--g-bg1);min-width:0}
.setItem:nth-child(even){border-color:var(--g-border2);background:var(--g-bg2)}
.setItem span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-weight:600}
.exportRow{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.miniBtn{background:#fff;color:#000;border:1px solid var(--g-pill-border);border-radius:8px;padding:5px 10px;font-weight:700;font-size:12px;white-space:nowrap}
.stepper{display:inline-flex;align-items:center;gap:4px;flex:none}
.stepper button{background:#fff;color:#000;border:1px solid var(--g-pill-border);border-radius:6px;width:24px;height:24px;font-weight:800;font-size:14px;padding:0}
.stepper span{min-width:36px;text-align:center;font-weight:700;font-size:13px}

/* Relative time (change 13) */
function relTime(iso){
  let t=new Date(iso).getTime();if(isNaN(t))return '';
  let diff=Math.max(0,Date.now()-t);
  let s=Math.floor(diff/1000);
  if(s<60)return s+'s';
  let m=Math.floor(s/60),sec=s%60;
  if(m<60){
    let parts=[];
    if(m)parts.push(m+'m');
    if(sec&&m<60)parts.push(sec+'s');
    return parts.slice(0,2).join(' ');
  }
  let h=Math.floor(m/60),mm=m%60;
  if(h<24){
    let parts=[];
    if(h)parts.push(h+'h');
    if(mm)parts.push(mm+'m');
    return parts.join(' ');
  }
  let d=Math.floor(h/24),hh=h%24;
  if(d<30){
    let parts=[];
    if(d)parts.push(d+'d');
    if(hh)parts.push(hh+'h');
    return parts.join(' ');
  }
  let mo=Math.floor(d/30),dd=d%30;
  if(mo<12){
    let parts=[];
    if(mo)parts.push(mo+'mo');
    if(dd)parts.push(dd+'d');
    return parts.join(' ');
  }
  let y=Math.floor(mo/12),mo2=mo%12;
  let parts=[];
  if(y)parts.push(y+'y');
  if(mo2)parts.push(mo2+'mo');
  if(dd)parts.push(dd+'d');
  return parts.slice(0,3).join(' ');
}

/* Darken color helper (change 22) */
function darken(hex,amt){
  try{
    let h=hex.replace('#','');
    if(h.length===3)h=h.split('').map(c=>c+c).join('');
    let r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
    r=Math.max(0,Math.floor(r*amt));g=Math.max(0,Math.floor(g*amt));b=Math.max(0,Math.floor(b*amt));
    return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){return hex}
}

function showFbPill(text,type){let p=$('fbPill');p.textContent=text;p.className='show'+(type?' '+type:'');clearTimeout(p._t);p._t=setTimeout(()=>{p.className=''},2000)}
function find(idv){let out=null;walk(data.items,x=>{if(x.id===idv)out=x});return out}
function walk(list,fn){list.forEach(x=>{fn(x);walk(x.children||[],fn)})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function locate(list,idv,parent=null){for(let i=0;i<list.length;i++){if(list[i].id===idv)return{list,index:i,item:list[i],parent};let r=locate(list[i].children||[],idv,list[i]);if(r)return r}return null}

function scheduleSave(){try{localStorage.setItem('nestedChecklistCache',JSON.stringify(data))}catch(e){};showFbPill(navigator.onLine?'Syncing…':'Offline',navigator.onLine?'sync':'off');clearTimeout(window._saveTimer);window._saveTimer=setTimeout(saveRemote,650)}
async function saveRemote(){if(!uid||!navigator.onLine)return;try{await DOC.set({owner:uid,appData:data,updatedAt:now()},{merge:true});showFbPill('Synced')}catch(e){showFbPill('Sync pending','off')}}
function newItem(name,type){let t=now();return{id:uidGen(),type:type||'checklist',name:name,createdAt:t,updatedAt:t,completed:false,completedAt:null,pinned:false,pinnedOrder:null,checkCount:0,history:[],children:[],collapsed:false,doneCollapsed:true,deletedAt:null,deletedParentTask:null}}

function countTasks(x){let n=x.type==='checklist'?1:0;(x.children||[]).forEach(c=>n+=countTasks(c));return n}
function doneTasks(x){let n=x.type==='checklist'&&x.completed?1:0;(x.children||[]).forEach(c=>n+=doneTasks(c));return n}
function pct(x){let n=countTasks(x);return n?Math.round(doneTasks(x)/n*100):0}

function showToast(msg,secs,onUndo){
  let t=$('undoToast');$('undoMsg').textContent=msg;
  let bar=$('undoBar');bar.style.setProperty('--dur',secs+'s');bar.classList.remove('anim');void bar.offsetWidth;bar.classList.add('anim');
  $('undoAction').style.display=onUndo?'':'none';

  t.classList.add('show');clearTimeout(undoToastTimer);
  undoToastTimer=setTimeout(()=>{t.classList.remove('show');lastUndoSnapshot=null},secs*1000);
}
function showUndoToast(snapshot){lastUndoSnapshot=snapshot;showToast('Item deleted',data.settings.undoSeconds||5,()=>{if(lastUndoSnapshot){data=JSON.parse(lastUndoSnapshot);lastUndoSnapshot=null;changed()}})}

function autoCleanup(){let days=data.settings.autoDeleteDays||0;if(days<=0)return;let cutoff=Date.now()-days*86400000;function clean(list){for(let i=list.length-1;i>=0;i--){let x=list[i];clean(x.children||[]);if(x.completed&&x.completedAt&&new Date(x.completedAt).getTime()<cutoff)list.splice(i,1)}}let before=JSON.stringify(data.items);clean(data.items);if(before!==JSON.stringify(data.items))scheduleSave()}

function editBtns(x){if(!data.settings.editMode)return '';return `<button class="editBtn" data-act="rename" data-id="${x.id}" title="Rename">✎</button><button class="editBtn" data-act="pin" data-id="${x.id}" title="Pin">${x.pinned?'📌':'⌖'}</button><button class="editBtn" data-act="del" data-id="${x.id}" title="Delete">🗑</button>`}

function sortItems(list){
  if(!list)return list;
  const pinned=list.filter(x=>x.pinned);
  const rest=list.filter(x=>!x.pinned);
  return [...pinned,...rest];
}
function applyFilterToChildren(list){
  if(activeFilter!=='done')return list;
  return (list||[]).filter(x=>x.type==='checklist'&&x.completed);
}

function renderItem(x){
  let has=x.children&&x.children.length>0;
  let canHaveChildren=x.type==='task';
  let chkHide=data.settings.showCheckboxes===false;
  let chk=x.type==='checklist'?`<input class="check ${chkHide?'hidden-check':''}" type="checkbox" data-act="complete" data-id="${x.id}" ${x.completed?'checked':''}>`:'';
  let plusTask=canHaveChildren&&data.settings.display.addbtn?`<button class="plus" data-act="plustask" data-id="${x.id}" title="Add Task">＋</button>`:'';
  let plusCl=canHaveChildren&&data.settings.display.addbtn?`<button class="plus cl" data-act="pluscl" data-id="${x.id}" title="Add Checklist">＋</button>`:'';
  let count=(x.checkCount||0)>0?`<span class="unblod" data-act="showHistory" data-id="${x.id}" title="Check count">(${x.checkCount})</span>`:'';
  let pctHtml=(x.type==='task')?`<span class="pct">(${pct(x)}%)</span>`:'';
  let dateHtml=x.updatedAt?`<span class="lastDate">${shortDate(x.updatedAt)}</span>`:'';
  let pinMark=x.pinned?'📌':'';
  let kids=applyFilterToChildren(x.children||[]);

  let childrenHtml='';
  let doneSubHtml='';
  if(x.type!=='checklist'&&has){
    if(activeFilter==='done'){
      childrenHtml=kids.map(c=>renderItem(c)).join('');
    } else {
      let pendingNormal=kids.filter(c=>!(c.type==='checklist'&&c.completed));
      let doneCl=kids.filter(c=>c.type==='checklist'&&c.completed);
      childrenHtml=sortItems(pendingNormal).map(c=>renderItem(c)).join('');
      if(doneCl.length){doneSubHtml=renderDoneSub(x,doneCl)}
    }
  }
  let progHtml='';
  if(x.type==='task'&&data.settings.display.progressbar){let p=pct(x);progHtml=`<div class="progIn"><i data-prog-id="${x.id}" style="width:${p}%"></i></div>`}
  let childrenBlock='';
  if(x.type!=='checklist'&&(childrenHtml||doneSubHtml)){
    childrenBlock=`<div class="childrenWrap ${x.collapsed?'collapsed':''}" data-children-id="${x.id}"><div class="childrenInner">${childrenHtml}${doneSubHtml}</div></div>`;
  }
  let completedCls=x.type==='checklist'&&x.completed?'completed':'';
  let rightIcons='';
  if(x.type==='checklist'&&!data.settings.editMode){
    if(x.completed){rightIcons+=`<button class="delDoneBtn" data-act="del" data-id="${x.id}" title="Delete">🗑</button>`}
    else{rightIcons+=`<button class="pencilBtn" data-act="editcl" data-id="${x.id}" title="Edit">✎</button>`}
  }
  /* Inline editing in place of text (change 14) */
  let nameHtml;
  if(x.type==='checklist'&&editingClId===x.id){
    nameHtml=`<div class="inlineEditRow inline"><input id="clinp_${x.id}" data-cledit="${x.id}" value="${esc(x.name)}"></div>`;
  } else {
    nameHtml=`<span class="name ${x.completed?'done':''}">${pinMark}${esc(x.name)}</span>`;
  }
  return `<div class="titem ${x.type} ${x.completed?'done':''} ${completedCls}" data-id="${x.id}">
    <div class="line">
      <span class="handle" data-handle="1">⠿</span>
      ${chk}
      <div class="nameBlock">${nameHtml}${dateHtml}</div>
      ${count}
      <div class="endGroup">${pctHtml}${plusTask}${plusCl}</div>
      ${rightIcons}
      ${editBtns(x)}
      ${progHtml}
    </div>
    ${activeInput===x.id?`<div class="inlineInput"><input id="inp_${x.id}" data-parent="${x.id}" placeholder="Type and press Enter…"></div>`:''}
    ${childrenBlock}
  </div>`;
}

function renderDoneSub(parentTask,doneItems){
  let collapsed=parentTask.doneCollapsed!==false;
  return `<div class="doneSubBlock"><div class="titem doneSub" data-donesub="${parentTask.id}">
    <div class="line">
      <span class="handle">⠿</span>
      <div class="nameBlock"><span class="name">Done (${doneItems.length})</span></div>
    </div>
    <div class="childrenWrap ${collapsed?'collapsed':''}" data-done-children="${parentTask.id}">
      <div class="childrenInner">${doneItems.map(c=>renderItem(c)).join('')}</div>
    </div>
  </div></div>`;
}

/* Done filter same as home format (change 16) */
function renderDoneFilter(){
  let activeList=[],doneList=[];
  data.items.forEach(i=>{(i.completed?doneList:activeList).push(i)});
  let groupsHtml='';
  function collectFromTask(task){
    let doneItems=[];
    (task.children||[]).forEach(c=>{
      if(c.type==='checklist'&&c.completed)doneItems.push(c);
      if(c.type==='task')collectFromTask(c);
    });
    if(doneItems.length){
      groupsHtml+=`<div class="titem task" data-id="${task.id}"><div class="line">
        <span class="handle">⠿</span>
        <div class="nameBlock"><span class="name">${esc(task.name)}</span></div>
        <div class="endGroup"><span class="pct">(${pct(task)}%)</span></div>
      </div>
      <div class="childrenWrap"><div class="childrenInner">${doneItems.map(c=>renderItem(c)).join('')}</div></div>
      </div>`;
    }
  }
  data.items.forEach(i=>{if(i.type==='task')collectFromTask(i)});
  let topDone=doneList.filter(i=>i.type==='checklist').map(c=>renderItem(c)).join('');
  let html=groupsHtml+topDone;
  if(!html)html='<div class="empty">No done items.</div>';
  return html;
}

/* ---------- Global 1s idle timer (changes 5,8) ---------- */
const IDLE_MS=1000;
let idleTimer=null;
let pendingDoneIds=new Set();

function touchIdle(){
  if(idleTimer)clearTimeout(idleTimer);
  if(pendingDoneIds.size===0)return;
  idleTimer=setTimeout(()=>{idleTimer=null;flushDoneBatch()},IDLE_MS);
}

function applyDoneStateToItem(it,goingToDone){
  it.completed=goingToDone;
  it.completedAt=goingToDone?now():null;
  it.updatedAt=now();
  it.checkCount=(it.checkCount||0)+1;
  it.history=it.history||[];
  it.history.push({status:goingToDone?'Checked':'Unchecked',at:now()});
}

function applyPendingVisual(id){
  let row=document.querySelector('.titem[data-id="'+id+'"]');
  if(!row)return;
  let it=find(id);if(!it)return;
  let nextDone=!it.completed;
  row.classList.toggle('completed',nextDone);
  let nameEl=row.querySelector('.name');
  if(nameEl)nameEl.classList.toggle('done',nextDone);
  let cb=row.querySelector('.check');
  if(cb)cb.checked=nextDone;
}

function requestDoneToggle(id){
  let it=find(id);if(!it)return;
  if(pendingDoneIds.has(id)){
    pendingDoneIds.delete(id);
    applyPendingVisual(id); /* revert visually */
    touchIdle();
    return;
  }
  pendingDoneIds.add(id);
  applyPendingVisual(id); /* immediate strike-through + grey (change 1) */
  touchIdle();
}

function flushDoneBatch(){
  if(!pendingDoneIds.size)return;
  const ids=[...pendingDoneIds];
  pendingDoneIds=new Set();
  if(idleTimer){clearTimeout(idleTimer);idleTimer=null}
  ids.forEach(id=>{
    let it=find(id);if(!it)return;
    applyDoneStateToItem(it,!it.completed);
  });
  doViewTransitionRender(()=>render());
  scheduleSave();
}

/* View Transitions API (changes 2,3,6,7,8) */
function doViewTransitionRender(update){
  try{
    if(document.startViewTransition){
      document.documentElement.style.setProperty('--vt-dur','1600ms');
      document.startViewTransition(update);
    } else {
      update();
    }
  }catch(e){update()}
}

function attachHomeHandlers(){
  document.querySelectorAll('.titem .check').forEach(cb=>{
    cb.onchange=()=>{requestDoneToggle(cb.dataset.id)};
  });

  document.querySelectorAll('.titem.checklist > .line').forEach(line=>{
    line.addEventListener('click',e=>{
      if(e.target.closest('.check,.plus,.editBtn,.handle,.unblod,.pencilBtn,.delDoneBtn,.inlineEditRow'))return;
      requestDoneToggle(line.closest('.titem').dataset.id);
    });
  });

  document.querySelectorAll('.titem.task > .line').forEach(line=>{
    line.addEventListener('click',e=>{
      if(e.target.closest('.check,.plus,.editBtn,.handle,.unblod,.pencilBtn,.delDoneBtn'))return;
      let id=line.closest('.titem').dataset.id;
      let x=find(id);
      if(x&&(x.children&&x.children.length)){
        x.collapsed=!x.collapsed;
        let wrap=document.querySelector('[data-children-id="'+x.id+'"]');
        if(wrap)wrap.classList.toggle('collapsed',x.collapsed);
        if(x.collapsed){
          x.doneCollapsed=true;
          let dw=document.querySelector('[data-done-children="'+x.id+'"]');
          if(dw)dw.classList.add('collapsed');
        }
        scheduleSave();
      }
    });
  });

  document.querySelectorAll('.titem.doneSub > .line').forEach(line=>{
    line.addEventListener('click',e=>{
      if(e.target.closest('.handle,.check'))return;
      let parentId=line.closest('.titem.doneSub').dataset.donesub;
      let t=find(parentId);
      if(!t)return;
      t.doneCollapsed=t.doneCollapsed===false?true:false;
      let wrap=document.querySelector('[data-done-children="'+parentId+'"]');
      if(wrap)wrap.classList.toggle('collapsed',t.doneCollapsed!==false);
      scheduleSave();
    });
  });

  document.querySelectorAll('.titem .plus').forEach(b=>{b.onclick=(e)=>{e.stopPropagation();let id=b.dataset.id,x=find(id);if(!x||x.type!=='task')return;let type=b.classList.contains('cl')?'checklist':'task';startInline(id,type)}});

function attachDrag(handle,el){
  let active=false,floating=null,placeholder=null,offsetY=0;
  function onDown(e){
    e.preventDefault();e.stopPropagation();active=true;
    let rect=el.getBoundingClientRect();let cy=(e.touches?e.touches[0].clientY:e.clientY);offsetY=cy-rect.top;
    floating=el.cloneNode(true);floating.classList.add('floating');
    floating.style.width=rect.width+'px';floating.style.left=rect.left+'px';floating.style.top=rect.top+'px';
    document.body.appendChild(floating);
    placeholder=document.createElement('div');placeholder.className='placeholder2';placeholder.style.height=rect.height+'px';
    el.style.display='none';el.parentNode.insertBefore(placeholder,el.nextSibling);
    window.addEventListener('touchmove',onMove,{passive:false});window.addEventListener('touchend',onUp);
    window.addEventListener('mousemove',onMove);window.addEventListener('mouseup',onUp);
  }
  function onMove(e){
    if(!active)return;if(e.cancelable)e.preventDefault();
    let cy=(e.touches?e.touches[0].clientY:e.clientY);floating.style.top=(cy-offsetY)+'px';
    let parent=el.parentNode;let all=[...parent.querySelectorAll(':scope > .titem')].filter(x=>x!==el);let target=null;
    all.forEach(x=>{let r=x.getBoundingClientRect();if(cy>r.top&&cy<r.bottom)target=x});
    if(target){let r=target.getBoundingClientRect();let mid=(r.top+r.bottom)/2;if(cy<mid)parent.insertBefore(placeholder,target);else parent.insertBefore(placeholder,target.nextSibling)}
  }
  function onUp(){
    if(!active)return;active=false;
    let parent=el.parentNode;let siblings=[...parent.children];let pos=siblings.indexOf(placeholder);
    let before=siblings.slice(0,pos).filter(n=>n.dataset&&n.dataset.id).map(n=>n.dataset.id);
    let after=siblings.slice(pos).filter(n=>n.dataset&&n.dataset.id).map(n=>n.dataset.id);
    let id=el.dataset.id;before=before.filter(x=>x!==id);after=after.filter(x=>x!==id);
    let finalIds=[...before,id,...after];
    let parentId=parent.closest('.titem')?.dataset.id;
    let arr=parentId?find(parentId).children:data.items;
    arr.sort((a,b)=>finalIds.indexOf(a.id)-finalIds.indexOf(b.id));
    floating.remove();placeholder.remove();
    window.removeEventListener('touchmove',onMove);window.removeEventListener('touchend',onUp);
    window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);
    changed();
  }
  handle.addEventListener('touchstart',onDown,{passive:false});
  handle.addEventListener('mousedown',onDown);
}

/* Pin with 0.5s delay */
let pinPendingTimers=new Map();
function requestPinToggle(id){
  let it=find(id);if(!it)return;
  if(pinPendingTimers.has(id)){
    clearTimeout(pinPendingTimers.get(id));
    pinPendingTimers.delete(id);
    let row=document.querySelector('.titem[data-id="'+id+'"]');
    if(row)row.classList.remove('pending-pulse');
    return;
  }
  let row=document.querySelector('.titem[data-id="'+id+'"]');
  if(row)row.classList.add('pending-pulse');
  let t=setTimeout(()=>{
    pinPendingTimers.delete(id);
    let it2=find(id);if(!it2)return;
    let r=locate(data.items,id);if(!r)return;
    if(!it2.pinned){
      it2.pinned=true;
      let minOrder=0;
      r.list.forEach(x=>{if(x.pinned&&x.pinnedOrder!=null)minOrder=Math.min(minOrder,x.pinnedOrder)});
      it2.pinnedOrder=minOrder-1;
      r.list.splice(r.index,1);
      r.list.unshift(it2);
    } else {
      it2.pinned=false;
      it2.pinnedOrder=null;
      r.list.splice(r.index,1);
      let inserted=false;
      for(let i=0;i<r.list.length;i++){
        if(!r.list[i].pinned){r.list.splice(i,0,it2);inserted=true;break}
      }
      if(!inserted)r.list.push(it2);
    }
    it2.updatedAt=now();
    doViewTransitionRender(()=>render());
    scheduleSave();
  },500);
  pinPendingTimers.set(id,t);
}

    hist.forEach((h,i)=>{

    });

    btn.onclick=()=>{

      let sorted=(item.history||[]).slice().sort((a,b)=>new Date(b.at)-new Date(a.at));
      let target=sorted[idx];
      item.history=(item.history||[]).filter(h=>h!==target);
      item.checkCount=item.history.length;
      item.updatedAt=now();
      scheduleSave();
      openHistoryModal(idv);
      /* update count in home row immediately (change 17) */
      let row=document.querySelector('.titem[data-id="'+idv+'"]');
      if(row){
        let cntEl=row.querySelector('[data-act="showHistory"]');

      }
    };
  });

/* Delete + trash with deletedAt (change 20) */
function pushTrash(item,parentName){
  let copy=JSON.parse(JSON.stringify(item));
  copy.deletedAt=now();
  copy.deletedParentTask=parentName||null;
  data.trash=data.trash||[];
  data.trash.push(copy);
}

function deleteItem(idv){
  let snap=JSON.stringify(data);
  let r=locate(data.items,idv);if(!r)return;
  let item=r.item;
  if(item.type==='task'){
    let taskName=item.name;
    (function collect(node){
      (node.children||[]).forEach(c=>{
        if(c.type==='checklist'){pushTrash(c,taskName)}
        else if(c.type==='task'){collect(c)}
      });
    })(item);
    r.list.splice(r.index,1);
  } else {
    let parentName=r.parent?r.parent.name:null;
    pushTrash(item,parentName);
    r.list.splice(r.index,1);
  }
  changed();showUndoToast(snap);
}

function openNameModal(type){
  $('modalTitle').textContent=type==='task'?'New Task':'New Checklist';
  $('modalBody').innerHTML=`<input id="newItemName" class="field" placeholder="${type==='task'?'Task':'Checklist'} name…" style="width:100%">`;
  $('modalActions').style.display='flex';$('modalActions').innerHTML=`<button class="s" id="nameCancel">Cancel</button><button class="p" id="nameSave">Save</button>`;
  openModal();setTimeout(()=>$('newItemName')?.focus(),50);
  $('nameCancel').onclick=closeModal;
  $('nameSave').onclick=()=>{let v=$('newItemName').value.trim();if(v){let ni=newItem(v,type);if(type==='task')data.items.unshift(ni);else data.items.push(ni)}closeModal();changed()};
}

function openSettings(){
  document.body.classList.add('locked');
  $('settingsWrap').classList.add('open');
  let ships='';
  Object.keys(THEMES).forEach(k=>{
    let t=THEMES[k];
    ships+=`<div class="ship ${data.settings.pageTheme===k?'active':''}" data-theme="${k}">
      <div class="preview" style="background:${t.bg}">
        <div class="mini"><div class="mtask" style="background:${t.taskBg1}"></div><div class="mcl" style="background:${t.clBg1}"></div></div>
      </div>
      <div class="shipLabel">${t.name}</div>
    </div>`;
  });
  $('settingsSlot').innerHTML=`<div class="head"><span>⚙ Settings</span><button id="closeSettingsTop">✕</button></div>
    <div class="body">
      <div class="themeSection"><div class="themeTitle">🎨 Theme (10 light)</div><div class="shipRow">${ships}</div></div>
      <div class="setItem"><span>Theme Freeze</span><label class="switch"><input type="checkbox" id="themeFreezeSwitch" ${data.settings.themeFreeze?'checked':''}><span class="slider"></span></label></div>
      <div class="setItem"><span>Show checkboxes</span><label class="switch"><input type="checkbox" id="showCheckboxesSwitch" ${data.settings.showCheckboxes!==false?'checked':''}><span class="slider"></span></label></div>
      <div class="setItem"><span>Font size</span><div class="stepper"><button id="fontMinus">−</button><span id="fontVal">${data.settings.fontSize||14}</span><button id="fontPlus">+</button></div></div>
      <div class="setItem"><span>Task header height</span><div class="stepper"><button id="thMinus">−</button><span id="thVal">${data.settings.taskHeaderHeight||22}</span><button id="thPlus">+</button></div></div>
      <div class="setItem"><span>Progress bar</span><label class="switch"><input type="checkbox" data-disp="progressbar" ${data.settings.display.progressbar?'checked':''}><span class="slider"></span></label></div>
      <div class="setItem"><span>＋ Add buttons</span><label class="switch"><input type="checkbox" data-disp="addbtn" ${data.settings.display.addbtn?'checked':''}><span class="slider"></span></label></div>
      <div class="setItem"><span>Undo seconds</span><div class="stepper"><button id="undoMinus">−</button><span id="undoVal">${data.settings.undoSeconds||5}</span><button id="undoPlus">+</button></div></div>
      <div class="setItem"><span>Auto-delete days</span><input id="autoDel" class="numInput" type="number" min="0" max="365" value="${data.settings.autoDeleteDays||0}"></div>
      <div class="setItem"><span>Change Log</span><button class="miniBtn" id="viewLog">View</button></div>
      <div class="setItem"><span>Export</span><div class="exportRow"><button class="miniBtn" id="exportJson">JSON</button><button class="miniBtn" id="exportExcel">Excel</button><button class="miniBtn" id="exportPdf">PDF</button></div></div>
    </div>`;
  let m=$('settingsSlot');
  $('closeSettingsTop').onclick=closeSettings;
  m.querySelectorAll('.ship').forEach(sh=>{
    sh.onclick=()=>{
      data.settings.pageTheme=sh.dataset.theme;
      data.settings.themeFreeze=true;
      m.querySelectorAll('.ship').forEach(s=>s.classList.remove('active'));
      sh.classList.add('active');
      applyPageTheme();scheduleSave();
    };
  });
  m.querySelectorAll('[data-disp]').forEach(inp=>{inp.onchange=()=>{data.settings.display[inp.dataset.disp]=inp.checked;changed()}});
  m.querySelector('#themeFreezeSwitch').onchange=(e)=>{data.settings.themeFreeze=e.target.checked;scheduleSave()};
  m.querySelector('#showCheckboxesSwitch').onchange=(e)=>{data.settings.showCheckboxes=e.target.checked;changed()};
  m.querySelector('#fontMinus').onclick=()=>{data.settings.fontSize=Math.max(5,(data.settings.fontSize||14)-1);m.querySelector('#fontVal').textContent=data.settings.fontSize;applyFontSize();changed()};
  m.querySelector('#fontPlus').onclick=()=>{data.settings.fontSize=Math.min(20,(data.settings.fontSize||14)+1);m.querySelector('#fontVal').textContent=data.settings.fontSize;applyFontSize();changed()};
  m.querySelector('#thMinus').onclick=()=>{data.settings.taskHeaderHeight=Math.max(20,(data.settings.taskHeaderHeight||22)-1);m.querySelector('#thVal').textContent=data.settings.taskHeaderHeight;applyTaskHeight();changed()};
  m.querySelector('#thPlus').onclick=()=>{data.settings.taskHeaderHeight=Math.min(40,(data.settings.taskHeaderHeight||22)+1);m.querySelector('#thVal').textContent=data.settings.taskHeaderHeight;applyTaskHeight();changed()};
  m.querySelector('#undoMinus').onclick=()=>{data.settings.undoSeconds=Math.max(1,(data.settings.undoSeconds||5)-1);m.querySelector('#undoVal').textContent=data.settings.undoSeconds;changed()};
  m.querySelector('#undoPlus').onclick=()=>{data.settings.undoSeconds=Math.min(10,(data.settings.undoSeconds||5)+1);m.querySelector('#undoVal').textContent=data.settings.undoSeconds;changed()};
  m.querySelector('#autoDel').onchange=(e)=>{data.settings.autoDeleteDays=Math.max(0,Number(e.target.value)||0);changed()};
  m.querySelector('#viewLog').onclick=()=>{closeSettings();openLogModal()};
  m.querySelector('#exportJson').onclick=()=>download('backup.json',JSON.stringify(data,null,2),'application/json');
  m.querySelector('#exportExcel').onclick=()=>{let rows=[];walk(data.items,x=>rows.push({ID:x.id,Name:x.name,Type:x.type,Completed:x.completed}));let ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Items');XLSX.writeFile(wb,'Checklist.xlsx')};
  m.querySelector('#exportPdf').onclick=exportTablePdf;
}

function exportTablePdf(){
  let w=window.open('','_blank');
  let html='<html><head><title>Export</title><style>body{font-family:system-ui;padding:24px}table{width:100%;border-collapse:collapse;margin-top:8px}th,td{border:1px solid #999;padding:6px;text-align:left}th{background:#dbe3ff}</style></head><body>';
  function walkV(list){
    list.forEach(x=>{
      if(x.type==='task'){
        html+=`<h3>${esc(x.name)}</h3><table><thead><tr><th>Name</th><th>Done</th></tr></thead><tbody>`;
        (x.children||[]).filter(c=>c.type==='checklist').forEach(c=>{
          html+=`<tr><td>${esc(c.name)}</td><td>${c.completed?'Yes':'No'}</td></tr>`;
        });
        html+='</tbody></table>';
      }
      walkV(x.children||[]);
    });
  }
  walkV(data.items);
  html+='</body></html>';
  w.document.write(html);w.document.close();
  setTimeout(()=>{w.print()},300);
}

function closeSettings(){document.body.classList.remove('locked');$('settingsWrap').classList.remove('open')}
$('settingsWrap').addEventListener('click',e=>{if(e.target===$('settingsWrap'))closeSettings()});

function openLogModal(){
  document.body.classList.add('locked');
  $('logModalWrap').classList.add('open');
  $('logSlot').innerHTML=`<div class="head"><span>📅 Change Log</span><button id="closeLogTop">✕</button></div><div class="body"><div class="logTopBar"><span>Total: ${(data.changelog||[]).length}</span></div><div id="logBoxWrap"></div></div>`;
  $('closeLogTop').onclick=closeLogModal;
  renderLogBox($('logBoxWrap'));
}
function closeLogModal(){document.body.classList.remove('locked');$('logModalWrap').classList.remove('open')}
$('logModalWrap').addEventListener('click',e=>{if(e.target===$('logModalWrap'))closeLogModal()});

function renderLogBox(wrap){
  let logs=(data.changelog||[]).slice().sort((a,b)=>new Date(a.at)-new Date(b.at));
  if(!logs.length){wrap.innerHTML='<div class="logEmpty">No changes yet.</div>';return}
  let groups={},order=[];
  logs.forEach(c=>{let k=new Date(c.at).toDateString();if(!groups[k]){groups[k]=[];order.push(k)}groups[k].push(c)});
  let html='<div class="logBox">';
  order.forEach((day)=>{
    let entries=groups[day];
    let vIndex=order.indexOf(day)+1;
    html+=`<div class="logDayRow"><span class="logDayText">${day} <span class="logVTag">(V${vIndex})</span></span><span class="logCount">${entries.length}</span></div>`;
    html+=`<div class="logEntries">`;
    entries.forEach((c,idx)=>{html+=`<div class="logEntry"><span class="logNum">${idx+1}.</span><span>${esc(c.text)}</span></div>`});
    html+='</div>';
  });
  html+='</div>';wrap.innerHTML=html;
}

/* History (changes 9,10,11,12,13,21) */
let histState={display:'all',year:null,month:null,q:'',dropOpen:false};
const HMONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function collectDeletedChecklists(){
  let out=[];
  (data.trash||[]).forEach(x=>{
    if(x.type==='checklist'){
      out.push({id:x.id,task:x.deletedParentTask||'—',cl:x.name,st:x.completed?'done':'pend',del:new Date(x.deletedAt||now())});
    }
  });
  return out;
}

function openHistoryModal2(){
  document.body.classList.add('locked');
  $('historyWrap').classList.add('open');
  $('histCardSlot').innerHTML=`<div class="histHead"><span class="histTitle">📅 History</span><input class="headSearch" id="histSearch" placeholder="Search…"><button id="histClose">✕</button></div>
    <div class="histFilterBox"><div class="histSwipeRow" id="histYearRow"></div></div>
    <div class="monthFloat" id="monthFloat"><div class="histSwipeRow" id="histMonthRow"></div></div>
    <div class="histStatusChips">
      <div class="chipsLeft">
        <div class="hschip active" data-hstatus="all">All <span id="hcntAll"></span></div>
        <div class="hschip" data-hstatus="done">Done <span id="hcntDone"></span></div>
        <div class="hschip" data-hstatus="pend">Pend <span id="hcntPend"></span></div>
      </div>
      <button class="delFilteredBtn" id="delFilteredBtn">🗑</button>
    </div>
    <div class="histBody" id="histBody2"></div>`;
  $('histClose').onclick=closeHistoryModal2;
  $('histSearch').addEventListener('input',e=>{histState.q=e.target.value;fullRenderHist()});
  document.querySelectorAll('[data-hstatus]').forEach(ch=>{
    ch.onclick=(e)=>{e.stopPropagation();histState.display=ch.dataset.hstatus;document.querySelectorAll('[data-hstatus]').forEach(x=>x.classList.remove('active'));ch.classList.add('active');buildHistList()};
  });
  fullRenderHist();
}
function closeHistoryModal2(){document.body.classList.remove('locked');$('historyWrap').classList.remove('open')}
$('historyWrap').addEventListener('click',e=>{if(e.target===$('historyWrap'))closeHistoryModal2()});

function histMatchQ(r){let q=histState.q.trim().toLowerCase();return !q||(r.task||'').toLowerCase().includes(q)||(r.cl||'').toLowerCase().includes(q)}
function histAllYears(rows){let s=new Set(rows.map(r=>r.del.getFullYear()));return [...s].sort((a,b)=>b-a)}
function histBaseRows(rows){
  return rows.filter(r=>{
    if(!histMatchQ(r))return false;
    if(histState.year!==null && r.del.getFullYear()!==histState.year)return false;
    if(histState.month!==null && histState.year!==null && r.del.getMonth()!==histState.month)return false;
    return true;
  });
}
function histVisibleRows(rows){
  let b=histBaseRows(rows);
  if(histState.display==='all')return b;
  return b.filter(r=>r.st===histState.display);
}
function buildHistYears(rows){
  let years=histAllYears(rows);
  let yc={};
  rows.forEach(r=>{if(!histMatchQ(r))return;let y=r.del.getFullYear();yc[y]=(yc[y]||0)+1});
  let total=Object.values(yc).reduce((s,n)=>s+n,0);
  let yhtml=`<div class="hfchip ${histState.year===null?'active':''}" id="hAllTimeChip">All Time (${total})</div>`;
  years.forEach(y=>{yhtml+=`<div class="hfchip ${histState.year===y?'active':''}" data-hyear="${y}">${y} (${yc[y]||0})</div>`});
  document.getElementById('histYearRow').innerHTML=yhtml;
  document.getElementById('hAllTimeChip').onclick=()=>{histState.year=null;histState.month=null;histState.dropOpen=false;fullRenderHist()};
  document.querySelectorAll('[data-hyear]').forEach(el=>{
    el.onclick=(e)=>{e.stopPropagation();let y=+el.dataset.hyear;if(histState.year===y){histState.dropOpen=!histState.dropOpen}else{histState.year=y;histState.month=null;histState.dropOpen=true}fullRenderHist()};
  });
}
function buildHistMonthDrop(rows){
  let drop=document.getElementById('monthFloat');
  if(histState.year===null||!histState.dropOpen){drop.classList.remove('open');return}
  let mc={};
  rows.forEach(r=>{if(!histMatchQ(r))return;if(r.del.getFullYear()!==histState.year)return;let mm=r.del.getMonth();mc[mm]=(mc[mm]||0)+1});
  let keys=Object.keys(mc).map(Number).sort((a,b)=>a-b);
  let mhtml='';
  keys.forEach(m=>{mhtml+=`<div class="hmchip ${histState.month===m?'active':''}" data-hmonth="${m}">${HMONTHS[m]} (${mc[m]})</div>`});
  document.getElementById('histMonthRow').innerHTML=mhtml;
  drop.classList.add('open');
  document.querySelectorAll('[data-hmonth]').forEach(el=>{
    el.onclick=(e)=>{e.stopPropagation();let m=+el.dataset.hmonth;histState.month=(histState.month===m)?null:m;fullRenderHist()};
  });
}
function buildHistDisplayChips(rows){
  let b=histBaseRows(rows);
  document.getElementById('hcntAll').textContent='('+b.length+')';
  document.getElementById('hcntDone').textContent='('+b.filter(r=>r.st==='done').length+')';
  document.getElementById('hcntPend').textContent='('+b.filter(r=>r.st==='pend').length+')';
}
function buildHistList(){
  let rows=collectDeletedChecklists();
  let list=histVisibleRows(rows);
  let html='';
  if(!list.length){html='<div class="histEmpty">No items.</div>';}
  else{
    list.sort((a,b)=>b.del-a.del);
    list.forEach(r=>{
      html+=`<div class="histRow">
        <span class="histTask">${esc(r.task)}</span>
        <span class="histSep">-</span>
        <div class="histClWrap" data-htext="${esc(r.cl)}"><span class="histCl">${esc(r.cl)}</span></div>
        <span class="histDate">${relTime(r.del.toISOString())}</span>
        <span class="histStatus ${r.st}">${r.st==='done'?'Done':'Pend'}</span>
        <button class="histRestoreBtn" data-hrestore="${r.id}" title="Restore">↩</button>
        <button class="histDeleteBtn" data-hdel="${r.id}" title="Delete">🗑</button>
      </div>`;
    });
  }
  document.getElementById('histBody2').innerHTML=html;
  document.querySelectorAll('[data-hrestore]').forEach(btn=>{btn.onclick=(e)=>{e.stopPropagation();restoreFromHistory(btn.dataset.hrestore)}});
  document.querySelectorAll('[data-hdel]').forEach(btn=>{btn.onclick=(e)=>{
    e.stopPropagation();
    let id=btn.dataset.hdel;
    let snap=JSON.stringify(data);
    data.trash=(data.trash||[]).filter(t=>t.id!==id);
    scheduleSave();
    showToast('Entry deleted',data.settings.undoSeconds||5,()=>{data=JSON.parse(snap);scheduleSave();if($('historyWrap').classList.contains('open'))fullRenderHist()});
    fullRenderHist();
  }});
}
function fullRenderHist(){let rows=collectDeletedChecklists();buildHistDisplayChips(rows);buildHistYears(rows);buildHistMonthDrop(rows);buildHistList()}
function restoreFromHistory(id){
  let idx=(data.trash||[]).findIndex(x=>x.id===id);
  if(idx<0)return;
  let item=data.trash.splice(idx,1)[0];
  item.deletedAt=null;
  let taskName=item.deletedParentTask||null;
  item.deletedParentTask=null;
  let targetTask=null;
  if(taskName){walk(data.items,x=>{if(!targetTask&&x.type==='task'&&x.name===taskName)targetTask=x})}
  if(targetTask){targetTask.children=targetTask.children||[];targetTask.children.push(item);targetTask.collapsed=false;targetTask.updatedAt=now()}
  else if(taskName){let nt=newItem(taskName,'task');nt.children=[item];data.items.unshift(nt)}
  else data.items.push(item);
  changed();
  if($('historyWrap').classList.contains('open'))fullRenderHist();
}
document.addEventListener('click',e=>{
  let btn=e.target.closest('#delFilteredBtn');
  if(!btn)return;
  e.stopPropagation();
  let rows=collectDeletedChecklists();
  let del=histVisibleRows(rows);
  if(!del.length)return;
  let ids=new Set(del.map(r=>r.id));
  let snapshot=JSON.stringify(data);
  data.trash=(data.trash||[]).filter(t=>!ids.has(t.id));
  changed();
  showToast('Deleted '+del.length+' entries',5,()=>{data=JSON.parse(snapshot);changed();if($('historyWrap').classList.contains('open'))fullRenderHist()});
  fullRenderHist();
});

function startAnon(){auth.signInAnonymously().catch(e=>{$('app').classList.remove('hidden');$('loader').classList.add('hide');showFbPill('Offline','off');render()})}
auth.onAuthStateChanged(async user=>{
  if(!user){uid=null;startAnon();return}
  uid=user.uid;
  try{
    let doc=await DOC.get();
    if(doc.exists&&doc.data().owner===uid&&doc.data().appData){data=doc.data().appData}
    else{let c=localStorage.getItem('nestedChecklistCache');if(c)data=JSON.parse(c);await saveRemote()}
    if(!data.settings.display)data.settings.display={progressbar:true,addbtn:true};
    if(!data.settings.fontSize)data.settings.fontSize=14;
    if(!data.settings.undoSeconds)data.settings.undoSeconds=5;
    if(!data.settings.autoDeleteDays)data.settings.autoDeleteDays=7;
    if(!data.settings.taskHeaderHeight)data.settings.taskHeaderHeight=22;
    if(!data.logCollapsed)data.logCollapsed={};
    if(data.settings.pageTheme===undefined)data.settings.pageTheme='t1';
    if(data.settings.showCheckboxes===undefined)data.settings.showCheckboxes=true;
    if(data.settings.themeFreeze===undefined)data.settings.themeFreeze=true;
    if(!data.changelog)data.changelog=[];
    walk(data.items,x=>{ if(x.pinned===undefined)x.pinned=false; if(x.pinnedOrder===undefined)x.pinnedOrder=null; });
    /* Theme Freeze OFF -> random theme each load (change 18) */
    if(!data.settings.themeFreeze){
      let keys=Object.keys(THEMES);
      let pick=keys[Math.floor(Math.random()*keys.length)];
      data.settings.pageTheme=pick;
    }
    showFbPill('Synced');
  }catch(e){let c=localStorage.getItem('nestedChecklistCache');if(c)data=JSON.parse(c);showFbPill('Offline','off')}
  autoCleanup();
  $('app').classList.remove('hidden');$('loader').classList.add('hide');render();
});
window.addEventListener('online',saveRemote);
window.addEventListener('offline',()=>showFbPill('Offline','off'));

function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}

startAnon();
</script></body></html>
