<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b4fc4"><title>Nested Checklist Manager</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--font-size:14px;--task-h:30px;
  --page-bg:linear-gradient(135deg,#e0e7ff,#fce7f3);
  --g-text:#0f172a;--g-muted:#475569;
  --head-bg1:linear-gradient(90deg,rgba(8,75,96,.92),rgba(13,102,124,.85) 50%,rgba(8,75,96,.9));
  --head-bg2:linear-gradient(90deg,rgba(11,90,110,.9),rgba(8,75,96,.85) 50%,rgba(11,90,110,.9));
  --head-border1:rgba(6,45,60,.9);--head-border2:rgba(8,55,70,.9);--head-text:#fff;
  --list-bg1:linear-gradient(90deg,rgba(230,248,255,.75),rgba(220,252,231,.6) 50%,rgba(255,255,255,.85));
  --list-bg2:linear-gradient(90deg,rgba(240,253,250,.7),rgba(236,252,203,.55) 50%,rgba(255,255,255,.85));
  --list-border1:rgba(14,116,144,.3);--list-border2:rgba(20,184,166,.3);
  --g-shadow:0 4px 12px rgba(14,116,144,.1),0 1px 3px rgba(15,23,42,.05),inset 0 2px 3px rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.6);
  --g-pill-bg:rgba(255,255,255,.85);--g-pill-fg:#0e7490;--g-pill-border:rgba(14,116,144,.35);
  --prog-fill:linear-gradient(90deg,#22d3ee,#4ade80);--prog-track:rgba(255,255,255,.18);
  --done-bg:linear-gradient(90deg,rgba(203,213,225,.55),rgba(226,232,240,.4));
  --done-border:rgba(100,116,139,.4);--done-text:#475569;
}
*{box-sizing:border-box}
html,body{margin:0;height:auto}
body{background:var(--page-bg);background-attachment:fixed;color:var(--g-text);font:var(--font-size)/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial;min-height:100dvh;overflow-x:hidden;-webkit-user-select:none;user-select:none}
body.locked{overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:8px 12px;background:#8b5cf6;color:#fff;font-weight:600}
.hidden{display:none!important}

#fbPill{position:fixed;top:10px;left:50%;transform:translateX(-50%) translateY(-40px);background:#21865b;color:#fff;padding:6px 16px;border-radius:999px;font-size:12px;font-weight:700;box-shadow:0 6px 18px #21865b55;z-index:120;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
#fbPill.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fbPill.sync{background:#c07a1a;box-shadow:0 6px 18px #c07a1a55}
#fbPill.off{background:#d94343;box-shadow:0 6px 18px #d9434355}

#loader{position:fixed;inset:0;background:linear-gradient(135deg,#e0e7ff,#fce7f3);display:flex;align-items:center;justify-content:center;z-index:200;transition:opacity .3s}
#loader.hide{opacity:0;pointer-events:none}
.dots{display:flex;gap:8px}
.dots span{width:12px;height:12px;background:#8b5cf6;border-radius:50%;animation:dotBounce .6s ease-in-out infinite alternate}
.dots span:nth-child(2){animation-delay:.15s;background:#ec4899}
.dots span:nth-child(3){animation-delay:.3s;background:#38bdf8}
@keyframes dotBounce{from{transform:translateY(0);opacity:.6}to{transform:translateY(-14px);opacity:1}}

.app{max-width:1100px;margin:0 auto;padding:14px;padding-top:52px;min-height:100dvh;display:flex;flex-direction:column;justify-content:flex-start}
.main{background:transparent;padding:0;width:100%;max-width:480px;margin:0 auto}
.field{background:#fff;color:var(--g-text);border:1px solid var(--g-pill-border);border-radius:8px;padding:11px 12px;width:100%;font-size:var(--font-size);margin:2px 0;min-width:0}

.listWrap{background:transparent;border:0;padding:0}
.titem{margin:6px 0 0 0;position:relative;transition:opacity .3s ease}

/* ===== Task header: dark glass ===== */
.titem.task > .line{
  position:relative;display:flex;align-items:center;gap:6px;
  padding:8px 10px 13px 10px;border-radius:10px;min-height:var(--task-h);
  backdrop-filter:blur(18px) saturate(200%);-webkit-backdrop-filter:blur(18px) saturate(200%);
  box-shadow:0 6px 20px rgba(6,45,60,.35),0 2px 8px rgba(6,45,60,.2),inset 0 1px 2px rgba(255,255,255,.25),inset 0 -1px 2px rgba(0,0,0,.15);
  border:1.5px solid var(--head-border1);
  background:var(--head-bg1);
  color:var(--head-text);overflow:hidden;cursor:pointer;
  transition:transform .12s ease;
}
.titem.task:nth-child(even) > .line{border-color:var(--head-border2);background:var(--head-bg2)}
.titem.task > .line:active{transform:scale(.995)}
.titem.task .name,.titem.doneSub .name{color:var(--head-text);text-shadow:0 1px 1px rgba(0,0,0,.15)}

/* Done sub-task header */
.titem.doneSub > .line{
  display:flex;align-items:center;gap:6px;
  padding:5px 8px;border-radius:10px;min-height:calc(var(--task-h) - 2px);
  background:var(--done-bg);
  border:1.5px solid var(--done-border);
  box-shadow:0 4px 12px rgba(99,102,241,.12),inset 0 1px 2px rgba(255,255,255,.8);
  color:var(--done-text);cursor:pointer;transition:transform .12s ease;
}
.titem.doneSub > .line:active{transform:scale(.99)}
.titem.doneSub .name{color:var(--done-text);text-shadow:none}

/* ===== Checklist row: light glass ===== */
.titem.checklist > .line{
  display:flex;align-items:center;gap:6px;
  padding:6px 8px;border-radius:10px;
  backdrop-filter:blur(18px) saturate(200%);-webkit-backdrop-filter:blur(18px) saturate(200%);
  box-shadow:var(--g-shadow);
  border:1.5px solid var(--list-border1);
  background:var(--list-bg1);
  color:var(--g-text);
  transition:background .5s ease,color .5s ease,border-color .3s ease,box-shadow .3s ease;
}
.titem.checklist:nth-child(even) > .line{border-color:var(--list-border2);background:var(--list-bg2)}

/* Row wrapper for smooth height collapse on check */
.rowWrap{overflow:hidden;transition:height .55s cubic-bezier(.65,0,.35,1),margin .55s cubic-bezier(.65,0,.35,1);will-change:height,margin}

.titem.checklist.completed > .line{
  background:linear-gradient(90deg,rgba(203,213,225,.7),rgba(226,232,240,.55)) !important;
  border-color:rgba(148,163,184,.6) !important;color:#475569 !important;
}
.titem.checklist.completed .handle{color:#475569}

.handle{color:#fff;font-size:14px;flex:none;padding:0;margin:0;width:16px;text-align:center;display:inline-flex;align-items:center;justify-content:center;line-height:1;cursor:grab;touch-action:none}
.titem.checklist .handle{color:#7c3aed}
.handle:active{cursor:grabbing}

.check{width:15px;height:15px;accent-color:#7c3aed;flex:none;margin:0}
.check.hidden-check{display:none}

.nameBlock{flex:1 1 auto;min-width:0;display:inline-flex;align-items:center;gap:4px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none;-ms-overflow-style:none}
.nameBlock::-webkit-scrollbar{display:none;height:0}
.name{display:inline-block;white-space:nowrap;font-weight:700;font-size:var(--font-size);color:inherit;line-height:1.2;position:relative}
/* Strike-through ONLY inside text */
.name span.txt{position:relative;display:inline-block}
.name span.txt::after{content:"";position:absolute;left:0;top:50%;height:2px;width:0%;background:currentColor;transform:translateY(-50%);transition:width 1s cubic-bezier(.65,0,.35,1);pointer-events:none;border-radius:2px}
.titem.checklist.striking .name span.txt::after{width:100%}

.lastDate{font-size:8px;font-weight:600;flex:none;opacity:.7;line-height:1;margin-left:2px;display:inline-flex;align-items:center;color:var(--g-muted)}
.pct{font-weight:800;font-size:10px;flex:none;line-height:1;background:var(--g-pill-bg);color:var(--g-pill-fg);border:1px solid var(--g-pill-border);padding:2px 8px;border-radius:99px}

.endGroup{display:flex;align-items:center;gap:4px;flex:none}
.plus{background:rgba(255,255,255,.8);border:1px solid var(--g-pill-border);color:var(--g-pill-fg);border-radius:7px;padding:0 6px;font-weight:800;font-size:12px;flex:none;height:22px;line-height:20px;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}

.editBtn{background:transparent;color:inherit;opacity:.8;border:0;padding:2px 5px;font-size:12px;border-radius:4px;flex:none;cursor:pointer;margin-left:2px}
.editBtn:hover{background:rgba(99,102,241,.15)}
.pencilBtn{background:transparent;color:inherit;opacity:.85;border:0;padding:2px 6px;font-size:12px;border-radius:4px;flex:none;cursor:pointer;margin-left:2px}
.pencilBtn:hover{background:rgba(99,102,241,.15)}
.favStar{background:transparent;color:#f59e0b;border:0;padding:2px 6px;font-size:13px;border-radius:4px;flex:none;cursor:pointer;margin-left:2px}
.delDoneBtn{background:rgba(252,165,165,.25);color:#b91c1c;border:1px solid rgba(252,165,165,.4);border-radius:7px;padding:2px 6px;font-size:12px;flex:none;cursor:pointer;margin-left:2px}
.unblod{color:var(--g-muted);opacity:.9;font-size:10px;font-weight:700;flex:none;margin-left:2px;cursor:pointer}

/* Progress bar inside task header bottom */
.progIn{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--prog-track);overflow:hidden}
.progIn i{display:block;height:100%;width:0;background:var(--prog-fill);position:relative;transition:width .8s cubic-bezier(.22,1,.36,1);will-change:width}
.progIn i::after{content:"";position:absolute;left:0;right:0;top:-50%;height:200%;background:rgba(255,255,255,.4);border-radius:45%;animation:wave 2s linear infinite}
@keyframes wave{from{transform:translateX(-100%) rotate(0)}to{transform:translateX(100%) rotate(360deg)}}

/* Arc fly keyframes for checking item */
@keyframes arcFly{
  0%{opacity:1;transform:translateY(0) scale(1)}
  25%{opacity:1;transform:translateY(-14px) scale(1.02)}
  55%{opacity:.85;transform:translateY(6px) scale(.99)}
  100%{opacity:0;transform:translateY(28px) scale(.95)}
}
.arcFly{animation:arcFly .85s cubic-bezier(.45,.05,.55,.95) forwards;will-change:transform,opacity}

/* Done area enter animation */
@keyframes rowEnterFromTop{
  0%{opacity:0;transform:translateY(-22px) scale(.96)}
  60%{opacity:1;transform:translateY(4px) scale(1.01)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
.enterFromTop{opacity:0;animation:rowEnterFromTop .65s cubic-bezier(.22,1,.36,1) forwards}

.childrenWrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .4s cubic-bezier(.22,1,.36,1),opacity .35s ease}
.childrenWrap.collapsed{grid-template-rows:0fr;opacity:0}
.childrenInner{overflow:hidden;min-height:0;padding:2px 0 4px 0}

.flyClone{position:fixed;z-index:9999;pointer-events:none;box-shadow:0 12px 30px rgba(99,102,241,.25);will-change:transform,opacity;border-radius:10px}
.placeholder{border:1px dashed rgba(99,102,241,.35);background:rgba(255,255,255,.3);border-radius:10px;overflow:hidden;transition:height .5s cubic-bezier(.22,1,.36,1),opacity .3s ease,margin .5s cubic-bezier(.22,1,.36,1)}
.titem.fadeIn{animation:fadeIn .7s ease forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.inlineInput{display:flex;gap:6px;padding:4px 8px 6px 8px}
.inlineInput input{flex:1;border:1px solid var(--g-pill-border);border-radius:8px;padding:6px 9px;font-size:12px;min-width:0;background:rgba(255,255,255,.85);color:var(--g-text)}
.inlineEditRow{display:flex;gap:6px;align-items:center;padding:4px 8px 6px 8px}
.inlineEditRow input{flex:1;border:1px solid var(--g-pill-border);border-radius:8px;padding:6px 9px;font-size:12px;min-width:0;background:rgba(255,255,255,.85);color:var(--g-text)}
.floating{position:fixed;pointer-events:none;box-shadow:0 12px 28px #0005;z-index:9999;transform:scale(1.03);border:1px solid #c5cdf0;opacity:.95;border-radius:10px}
.placeholder2{border:2px dashed #8b5cf6;border-radius:10px;margin:4px 0;background:rgba(196,181,253,.25)}
.muted{color:var(--g-muted);font-size:12px}
.empty{text-align:center;color:var(--g-muted);padding:20px}
.pageFoot{text-align:center;font-size:11px;color:var(--g-muted);padding:14px 0 6px}

.modal{position:fixed;inset:0;background:rgba(30,27,75,.35);display:flex;align-items:flex-end;justify-content:center;padding:0 0 5px 0;z-index:60}
.modal-card{width:90%;max-width:480px;max-height:80vh;overflow:auto;background:#fff;border:1px solid rgba(79,70,229,.5);border-radius:20px;box-shadow:0 20px 60px rgba(165,180,252,.4)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;font-weight:800;font-size:13px;color:var(--g-text);backdrop-filter:blur(18px) saturate(200%);-webkit-backdrop-filter:blur(18px) saturate(200%);background:var(--list-bg1);border-bottom:1.5px solid var(--list-border1)}
.modal-head button{flex:none;width:24px;height:24px;background:rgba(255,255,255,.6);color:var(--g-text);border:1px solid var(--g-pill-border);border-radius:8px;font-weight:800;padding:0;display:inline-flex;align-items:center;justify-content:center}
.modal-body{padding:10px;display:flex;flex-direction:column;gap:4px}
.modal-actions{display:flex;gap:6px;padding:0 12px 12px}
.modal-actions button{flex:1;padding:9px 10px;border:0;border-radius:9px;font-weight:700;font-size:12px;cursor:pointer}
.modal-actions .s{background:#e9edff;color:var(--g-text)}
.modal-actions .p{background:#8b5cf6;color:#fff}

/* Universal glass row */
.gRow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;backdrop-filter:blur(18px) saturate(200%);-webkit-backdrop-filter:blur(18px) saturate(200%);box-shadow:var(--g-shadow);border:1.5px solid var(--list-border1);background:var(--list-bg1);color:var(--g-text);transition:transform .12s ease,filter .15s ease;min-width:0}
.gRow:nth-child(even){border-color:var(--list-border2);background:var(--list-bg2)}
.gRow:active{transform:scale(.985);filter:brightness(1.03)}

.optList{display:flex;flex-direction:column;gap:4px}
.optList .gRow{width:100%;cursor:pointer;color:var(--g-text);font-weight:700;padding:10px 10px;text-align:left}
.optList .gRow .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}
.optRow{display:flex;gap:4px}
.optRow .gRow{flex:1;justify-content:center}

.iconBox{flex:none;width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;box-shadow:inset 0 1px 2px rgba(255,255,255,.6)}
.ic-purple{background:linear-gradient(135deg,#c4b5fd,#a5b4fc)}
.ic-green{background:linear-gradient(135deg,#86efac,#4ade80)}
.ic-yellow{background:linear-gradient(135deg,#fcd34d,#fbbf24)}
.ic-blue{background:linear-gradient(135deg,#7dd3fc,#38bdf8)}
.ic-pink{background:linear-gradient(135deg,#f9a8d4,#f472b6)}
.ic-slate{background:linear-gradient(135deg,#cbd5e1,#94a3b8)}
.ic-red{background:linear-gradient(135deg,#fca5a5,#f87171)}

.moveTree{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow:auto}
.moveItem{display:flex;gap:6px;align-items:center;padding:8px 10px;font-size:13px;cursor:pointer;border-radius:10px;background:rgba(255,255,255,.7);border:1px solid var(--g-pill-border);color:var(--g-text)}
.moveItem:hover{background:#f7f9ff;border-color:#8b5cf6}
.moveItem.indent1{margin-left:16px}
.moveItem.indent2{margin-left:32px}
.moveItem.indent3{margin-left:48px}

.cdTable{width:100%;border-collapse:collapse;font-size:12px}
.cdTable th,.cdTable td{border:1px solid rgba(99,102,241,.3);padding:5px 8px;text-align:left}
.cdTable th{background:rgba(196,181,253,.4);color:#4338ca;font-weight:700}
.cdTable td.sr{text-align:center;width:36px;color:#4338ca;font-weight:700}
.cdTable td.type.checked{color:#21865b;font-weight:700}
.cdTable td.type.unchecked{color:#c07a1a;font-weight:700}
.cdTable td.del{width:36px;text-align:center}
.delEntryBtn{background:transparent;border:0;color:#a82020;font-size:14px;cursor:pointer;padding:2px 6px;border-radius:4px}
.delEntryBtn:hover{background:#ffe8e8}

.settingsModal{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(165,180,252,.4);width:90%;max-width:480px;max-height:80vh;display:flex;flex-direction:column;border:1px solid rgba(79,70,229,.5);overflow:hidden}
.settingsModal .head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;font-weight:800;font-size:13px;color:var(--g-text);backdrop-filter:blur(18px) saturate(200%);background:var(--list-bg1);border-bottom:1.5px solid var(--list-border1)}
.settingsModal .head button{flex:none;width:24px;height:24px;background:rgba(255,255,255,.6);color:var(--g-text);border:1px solid var(--g-pill-border);border-radius:8px;font-weight:800;padding:0;display:inline-flex;align-items:center;justify-content:center}
.settingsModal .body{padding:10px;overflow-y:auto;overflow-x:hidden;flex:1 1 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:4px}
.setItem{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:7px 10px;border-radius:10px;color:var(--g-text);backdrop-filter:blur(18px) saturate(200%);-webkit-backdrop-filter:blur(18px) saturate(200%);box-shadow:var(--g-shadow);border:1.5px solid var(--list-border1);background:var(--list-bg1);min-width:0}
.setItem:nth-child(even){border-color:var(--list-border2);background:var(--list-bg2)}
.setItem span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-weight:600}
.exportRow{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.miniBtn{background:rgba(255,255,255,.85);color:var(--g-pill-fg);border:1px solid var(--g-pill-border);border-radius:8px;padding:5px 10px;font-weight:700;font-size:12px;white-space:nowrap}
.stepper{display:inline-flex;align-items:center;gap:4px;flex:none}
.stepper button{background:rgba(255,255,255,.85);color:var(--g-pill-fg);border:1px solid var(--g-pill-border);border-radius:6px;width:24px;height:24px;font-weight:800;font-size:14px;padding:0}
.stepper span{min-width:36px;text-align:center;font-weight:700;font-size:13px}
.numInput{width:60px;border:1px solid var(--g-pill-border);border-radius:8px;padding:5px 8px;font-size:13px;background:rgba(255,255,255,.85);color:var(--g-text);text-align:center}
.switch{position:relative;width:38px;height:20px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#cfd5e6;border-radius:20px;transition:.2s;cursor:pointer}
.slider:before{content:"";position:absolute;height:14px;width:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked + .slider{background:linear-gradient(135deg,#8b5cf6,#ec4899)}
.switch input:checked + .slider:before{transform:translateX(18px)}

.themeSection{border:1px solid var(--g-pill-border);border-radius:14px;padding:10px;margin:2px 0;background:rgba(255,255,255,.7)}
.themeTitle{font-size:11px;font-weight:800;color:#4338ca;margin-bottom:8px;letter-spacing:.4px;text-transform:uppercase}
.shipRow{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:thin}
.ship{flex:none;width:110px;border:2px solid transparent;border-radius:12px;background:#fff;padding:6px 6px 8px;cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.1);transition:border-color .2s,transform .15s;text-align:center}
.ship:hover{transform:translateY(-2px)}
.ship.active{border-color:#8b5cf6;box-shadow:0 4px 14px rgba(139,92,246,.35)}
.preview{height:56px;border-radius:8px;position:relative;overflow:hidden;margin-bottom:6px}
.preview .mini{position:absolute;inset:8px;display:flex;flex-direction:column;gap:3px;justify-content:center}
.preview .mtask{height:8px;border-radius:3px}
.preview .mcl{height:6px;border-radius:3px;width:80%}
.shipLabel{font-size:10px;font-weight:700;color:#1b2340;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ship.active .shipLabel{color:#8b5cf6}

.logBox{display:flex;flex-direction:column;gap:4px}
.logDayRow{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--g-text);font-weight:800;font-size:12px;backdrop-filter:blur(18px) saturate(200%);box-shadow:var(--g-shadow);border:1.5px solid var(--list-border1);background:var(--list-bg1)}
.logDayRow:nth-child(even){border-color:var(--list-border2);background:var(--list-bg2)}
.logToggle{background:transparent;border:0;color:#4338ca;font-weight:800;font-size:12px;padding:0;cursor:pointer;width:16px;text-align:center}

function walk(list,fn){list.forEach(x=>{fn(x);walk(x.children||[],fn)})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function countTasks(x){let n=x.type==='checklist'?1:0;(x.children||[]).forEach(c=>n+=countTasks(c));return n}
function doneTasks(x){let n=x.type==='checklist'&&x.completed?1:0;(x.children||[]).forEach(c=>n+=doneTasks(c));return n}
function pct(x){let n=countTasks(x);return n?Math.round(doneTasks(x)/n*100):0}

function showToast(msg,secs,onUndo){

}

function autoCleanup(){let days=data.settings.autoDeleteDays||0;if(days<=0)return;let cutoff=Date.now()-days*86400000;function clean(list){for(let i=list.length-1;i>=0;i--){let x=list[i];clean(x.children||[]);if(x.completed&&x.completedAt&&new Date(x.completedAt).getTime()<cutoff)list.splice(i,1)}}let before=JSON.stringify(data.items);clean(data.items);if(before!==JSON.stringify(data.items))scheduleSave()}

function matchSearch(x){let q=(window._searchQ||'').toLowerCase().trim();if(!q)return true;return (x.name||'').toLowerCase().includes(q)||(x.type||'').toLowerCase().includes(q)}

function editBtns(x){if(!data.settings.editMode)return '';return `<button class="editBtn" data-act="rename" data-id="${x.id}" title="Rename">✎</button><button class="editBtn" data-act="fav" data-id="${x.id}" title="Favorite">${x.favorite?'⭐':'☆'}</button><button class="editBtn" data-act="pin" data-id="${x.id}" title="Pin">${x.pinned?'📌':'⌖'}</button><button class="editBtn" data-act="del" data-id="${x.id}" title="Delete">🗑</button>`}

function sortItems(list){if(!list)return list;return [...list.filter(x=>x.favorite),...list.filter(x=>!x.favorite)]}
function applyFilterToChildren(list){if(activeFilter!=='done')return list;return (list||[]).filter(x=>x.type==='checklist'&&x.completed)}

function renderItem(x){
  let has=x.children&&x.children.length>0;
  let canHaveChildren=x.type==='task';
  let chkHide=data.settings.showCheckboxes===false;
  let chk=x.type==='checklist'?`<input class="check ${chkHide?'hidden-check':''}" type="checkbox" data-act="complete" data-id="${x.id}" ${x.completed?'checked':''}>`:'';
  let plusTask=canHaveChildren&&data.settings.display.addbtn?`<button class="plus" data-act="plustask" data-id="${x.id}" title="Add Task">＋</button>`:'';
  let plusCl=canHaveChildren&&data.settings.display.addbtn?`<button class="plus cl" data-act="pluscl" data-id="${x.id}" title="Add Checklist">＋</button>`:'';
  let count=(x.checkCount||0)>0?`<span class="unblod" data-act="showHistory" data-id="${x.id}" title="Check count">(${x.checkCount})</span>`:'';
  let pctHtml=(x.type==='task')?`<span class="pct">(${pct(x)}%)</span>`:'';
  let dateHtml=x.updatedAt?`<span class="lastDate">${shortDate(x.updatedAt)}</span>`:'';
  let kids=applyFilterToChildren(x.children||[]);

  let childrenHtml='',doneSubHtml='';
  if(x.type!=='checklist'&&has){
    if(activeFilter==='done'){
      childrenHtml=kids.map(c=>renderItem(c)).join('');
    } else {
      let pendingNormal=kids.filter(c=>!(c.type==='checklist'&&c.completed));
      let doneCl=kids.filter(c=>c.type==='checklist'&&c.completed);
      childrenHtml=sortItems(pendingNormal).map(c=>renderItem(c)).join('');
      if(doneCl.length)doneSubHtml=renderDoneSub(x,doneCl);
    }
  }
  let progHtml='';
  if(x.type==='task'&&data.settings.display.progressbar){let p=pct(x);progHtml=`<div class="progIn"><i data-prog-id="${x.id}" style="width:${p}%"></i></div>`}
  let childrenBlock='';
  if(x.type!=='checklist'&&(childrenHtml||doneSubHtml)){
    childrenBlock=`<div class="childrenWrap ${x.collapsed?'collapsed':''}" data-children-id="${x.id}"><div class="childrenInner">${childrenHtml}${doneSubHtml}</div></div>`;
  } else if(x.type!=='checklist'&&has){
    childrenBlock=`<div class="childrenWrap ${x.collapsed?'collapsed':''}" data-children-id="${x.id}"><div class="childrenInner"></div></div>`;
  }
  let completedCls=x.type==='checklist'&&x.completed?'completed':'';
  let rightIcons='';
  if(x.type==='checklist'&&!data.settings.editMode){
    if(x.favorite){rightIcons+=`<span class="favStar" title="Favourite">⭐</span>`}
    if(x.completed){rightIcons+=`<button class="delDoneBtn" data-act="del" data-id="${x.id}" title="Delete">🗑</button>`}
    else {rightIcons+=`<button class="pencilBtn" data-act="editcl" data-id="${x.id}" title="Edit">✎</button>`}
  }
  let editHtml='';
  if(x.type==='checklist'&&editingClId===x.id){
    editHtml=`<div class="inlineEditRow"><input id="clinp_${x.id}" data-cledit="${x.id}" value="${esc(x.name)}"></div>`;
  }
  let strikeCls=(x.id===justCheckedId)?'striking':'';
  return `<div class="titem ${x.type} ${x.completed?'done':''} ${completedCls} ${strikeCls}" data-id="${x.id}">
    <div class="rowWrap"><div class="line">
      <span class="handle" data-handle="1">⠿</span>
      ${chk}
      <div class="nameBlock"><span class="name"><span class="txt">${esc(x.name)}</span></span>${dateHtml}</div>
      ${count}
      <div class="endGroup">${pctHtml}${plusTask}${plusCl}</div>
      ${rightIcons}
      ${editBtns(x)}
    </div></div>
    ${progHtml}
    ${activeInput===x.id?`<div class="inlineInput"><input id="inp_${x.id}" data-parent="${x.id}" placeholder="Type and press Enter…"></div>`:''}
    ${editHtml}
    ${childrenBlock}
  </div>`;
}

function renderDoneSub(parentTask,doneItems){
  let collapsed=parentTask.doneCollapsed!==false;
  return `<div class="titem doneSub" data-donesub="${parentTask.id}">
    <div class="line">
      <span class="handle">⠿</span>
      <div class="nameBlock"><span class="name"><span class="txt">Done (${doneItems.length})</span></span></div>

      <div class="childrenInner">${doneItems.map(c=>renderItem(c)).join('')}</div>
    </div>
  </div>`;
}

/* Check animation: text-only strike → arc fly → height collapse → Done enter from top */
function handleCheck(cb){
  let id=cb.dataset.id,it=find(id);if(!it)return;
  let goingToDone=cb.checked;
  it.completed=goingToDone;it.completedAt=goingToDone?now():null;it.updatedAt=now();
  it.checkCount=(it.checkCount||0)+1;
  it.history=it.history||[];it.history.push({status:goingToDone?'Checked':'Unchecked',at:now()});

  let itemEl=cb.closest('.titem');
  let wrap=itemEl.querySelector('.rowWrap');
  let doneWrap=document.querySelector('.doneArea');

  if(!goingToDone){
    // simple uncheck: just remove completed class
    itemEl.classList.remove('completed','done');
    scheduleSave();
    setTimeout(()=>render(),300);
    return;
  }

  itemEl.classList.add('striking');

  // After strike-through, animate arc fly + collapse + done enter
  setTimeout(()=>{
    itemEl.classList.add('completed','done','arcFly');

    if(wrap){
      const h=wrap.getBoundingClientRect().height;
      wrap.style.height=h+'px';
      void wrap.offsetHeight;
      requestAnimationFrame(()=>{
        wrap.style.height='0px';
        wrap.style.marginBottom='-6px';
      });
    }

    // Insert into Done area with enterFromTop animation
    setTimeout(()=>{
      if(doneWrap){
        let clone=itemEl.cloneNode(true);
        clone.classList.remove('arcFly');
        clone.classList.add('completed','done','enterFromTop');
        doneWrap.insertBefore(clone,doneWrap.firstChild);
      }
      setTimeout(()=>{scheduleSave();render()},700);
    },260);
  },1050);
}

function attachHomeHandlers(){
  document.querySelectorAll('.titem .check').forEach(cb=>{
    cb.onchange=()=>handleCheck(cb);
  });

  document.querySelectorAll('.titem.checklist > .line').forEach(line=>{
    line.addEventListener('click',e=>{
      if(e.target.closest('.check,.plus,.editBtn,.handle,.unblod,.pencilBtn,.delDoneBtn,.favStar,.inlineEditRow'))return;
      let cb=line.querySelector('.check');
      if(cb){cb.checked=!cb.checked;cb.dispatchEvent(new Event('change'))}
    });
  });

  document.querySelectorAll('.titem.task > .line').forEach(line=>{
    line.addEventListener('click',e=>{
      if(e.target.closest('.check,.plus,.editBtn,.handle,.unblod,.pencilBtn,.delDoneBtn,.favStar'))return;
      let id=line.closest('.titem').dataset.id;
      let x=find(id);
      if(x&&(x.children&&x.children.length)){
        x.collapsed=!x.collapsed;
        let wrap=document.querySelector('[data-children-id="'+x.id+'"]');
        if(wrap)wrap.classList.toggle('collapsed',x.collapsed);
        if(x.collapsed){
          x.doneCollapsed=true;
          let dw=document.querySelector('[data-done-children="'+x.id+'"]');
          if(dw)dw.classList.add('collapsed');
        }
        scheduleSave();
      }
    });
  });

  document.querySelectorAll('.titem.doneSub > .line').forEach(line=>{
    line.addEventListener('click',e=>{
      if(e.target.closest('.handle,.check'))return;
      let parentId=line.closest('.titem.doneSub').dataset.donesub;
      let t=find(parentId);if(!t)return;
      t.doneCollapsed=t.doneCollapsed===false?true:false;
      let wrap=document.querySelector('[data-done-children="'+parentId+'"]');
      if(wrap)wrap.classList.toggle('collapsed',t.doneCollapsed!==false);
      scheduleSave();
    });
  });

  document.querySelectorAll('.titem .plus').forEach(b=>{b.onclick=(e)=>{e.stopPropagation();let id=b.dataset.id,x=find(id);if(!x||x.type!=='task')return;let type=b.classList.contains('cl')?'checklist':'task';startInline(id,type)}});
  document.querySelectorAll('.titem [data-act="del"]').forEach(b=>{b.onclick=(e)=>{e.stopPropagation();deleteItem(b.dataset.id)}});
  document.querySelectorAll('.titem [data-act="rename"]').forEach(b=>{b.onclick=(e)=>{e.stopPropagation();openRenameModal(b.dataset.id)}});
  document.querySelectorAll('.titem [data-act="fav"]').forEach(b=>{b.onclick=(e)=>{e.stopPropagation();toggleFav(b.dataset.id)}});
  document.querySelectorAll('.titem [data-act="pin"]').forEach(b=>{b.onclick=(e)=>{e.stopPropagation();let x=find(b.dataset.id);if(x){x.pinned=!x.pinned;changed()}}});
  document.querySelectorAll('.titem [data-act="showHistory"]').forEach(b=>{b.onclick=(e)=>{e.stopPropagation();openHistoryModal(b.dataset.id)}});
  document.querySelectorAll('.titem .pencilBtn').forEach(b=>{b.onclick=(e)=>{
    e.stopPropagation();
    let id=b.dataset.id;
    if(editingClId===id){editingClId=null;render();return}
    if(editingClId){
      let pi=$('clinp_'+editingClId);
      if(pi){let pv=pi.value.trim();if(pv){let px=find(editingClId);if(px&&pv!==px.name){px.name=pv;px.updatedAt=now();scheduleSave()}}}
    }
    editingClId=id;render();
  }});
  document.querySelectorAll('.titem .line').forEach(line=>{
    let lp;
    line.addEventListener('touchstart',e=>{
      if(e.target.closest('.check,.plus,.editBtn,.handle,.unblod,.pencilBtn,.delDoneBtn,.favStar,.inlineEditRow'))return;
      let id=line.closest('.titem').dataset.id;
      if(!id)return;
      lp=setTimeout(()=>{
        let isRoot=data.items.some(r=>r.id===id);
        if(isRoot)openRootTaskMenu(id);else openFullMenu(id);
        if(navigator.vibrate)navigator.vibrate(30);
      },500);
    },{passive:true});
    line.addEventListener('touchend',()=>clearTimeout(lp));
    line.addEventListener('touchmove',()=>clearTimeout(lp));
    line.addEventListener('mousedown',e=>{
      if(e.target.closest('.check,.plus,.editBtn,.handle,.unblod,.pencilBtn,.delDoneBtn,.favStar,.inlineEditRow'))return;
      let id=line.closest('.titem').dataset.id;
      if(!id)return;
      lp=setTimeout(()=>{let isRoot=data.items.some(r=>r.id===id);if(isRoot)openRootTaskMenu(id);else openFullMenu(id)},500);
    });
    line.addEventListener('mouseup',()=>clearTimeout(lp));
  });
  document.querySelectorAll('.titem .handle').forEach(h=>attachDrag(h,h.closest('.titem')));
}

function toggleFav(idv){let r=locate(data.items,idv);if(!r)return;let item=r.item;item.favorite=!item.favorite;item.updatedAt=now();if(item.favorite){r.list.splice(r.index,1);r.list.unshift(item)}changed()}

function startInline(idv,type){activeInput=idv;activeType=type;render();setTimeout(()=>{let i=$('inp_'+idv);if(i)i.focus()},10)}

$('content').addEventListener('keydown',e=>{
  if(e.target.dataset.parent&&e.key==='Enter'){
    let idv=e.target.dataset.parent,val=e.target.value.trim();
    if(val){
      let x=find(idv);if(!x||x.type!=='task')return;
      let ni=newItem(val,activeType);x.children=x.children||[];
      if(activeType==='task')x.children.unshift(ni);else x.children.push(ni);
      x.collapsed=false;x.updatedAt=now();
      activeInput=idv;changed();render();setTimeout(()=>{let i=$('inp_'+idv);if(i)i.focus()},10);
    }
  }
});

document.addEventListener('click',e=>{
  if(editingClId){
    let inEditor=e.target.closest('.inlineEditRow'),onPencil=e.target.closest('.pencilBtn');
    if(!inEditor&&!onPencil){
      let i=$('clinp_'+editingClId);
      if(i){let v=i.value.trim();if(v){let x=find(editingClId);if(x&&v!==x.name){x.name=v;x.updatedAt=now();scheduleSave()}}}
      editingClId=null;render();
    }
  }
  if(activeInput){
    let box=e.target.closest('.inlineInput'),isPlus=e.target.closest('[data-act="plustask"],[data-act="pluscl"]');
    if(!box&&!isPlus){
      let i=$('inp_'+activeInput);
      if(i&&i.value.trim()){
        let x=find(activeInput);
        if(x&&x.type==='task'){
          let ni=newItem(i.value.trim(),activeType);x.children=x.children||[];
          if(activeType==='task')x.children.unshift(ni);else x.children.push(ni);
          x.collapsed=false;x.updatedAt=now();changed();
        }
      }
      activeInput=null;render();
    }
  }
});

function attachDrag(handle,el){
  let active=false,floating=null,placeholder=null,offsetY=0;
  function onDown(e){e.preventDefault();e.stopPropagation();active=true;let rect=el.getBoundingClientRect();let cy=(e.touches?e.touches[0].clientY:e.clientY);offsetY=cy-rect.top;floating=el.cloneNode(true);floating.classList.add('floating');floating.style.width=rect.width+'px';floating.style.left=rect.left+'px';floating.style.top=rect.top+'px';document.body.appendChild(floating);placeholder=document.createElement('div');placeholder.className='placeholder2';placeholder.style.height=rect.height+'px';el.style.display='none';el.parentNode.insertBefore(placeholder,el.nextSibling);window.addEventListener('touchmove',onMove,{passive:false});window.addEventListener('touchend',onUp);window.addEventListener('mousemove',onMove);window.addEventListener('mouseup',onUp)}
  function onMove(e){if(!active)return;if(e.cancelable)e.preventDefault();let cy=(e.touches?e.touches[0].clientY:e.clientY);floating.style.top=(cy-offsetY)+'px';let parent=el.parentNode;let all=[...parent.querySelectorAll(':scope > .titem')].filter(x=>x!==el);let target=null;all.forEach(x=>{let r=x.getBoundingClientRect();if(cy>r.top&&cy<r.bottom)target=x});if(target){let r=target.getBoundingClientRect();let mid=(r.top+r.bottom)/2;if(cy<mid)parent.insertBefore(placeholder,target);else parent.insertBefore(placeholder,target.nextSibling)}}
  function onUp(){if(!active)return;active=false;let parent=el.parentNode;let siblings=[...parent.children];let pos=siblings.indexOf(placeholder);let before=siblings.slice(0,pos).filter(n=>n.dataset&&n.dataset.id).map(n=>n.dataset.id);let after=siblings.slice(pos).filter(n=>n.dataset&&n.dataset.id).map(n=>n.dataset.id);let id=el.dataset.id;before=before.filter(x=>x!==id);after=after.filter(x=>x!==id);let finalIds=[...before,id,...after];let parentId=parent.closest('.titem')?.dataset.id;let arr=parentId?find(parentId).children:data.items;arr.sort((a,b)=>finalIds.indexOf(a.id)-finalIds.indexOf(b.id));floating.remove();placeholder.remove();window.removeEventListener('touchmove',onMove);window.removeEventListener('touchend',onUp);window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);changed()}
  handle.addEventListener('touchstart',onDown,{passive:false});handle.addEventListener('mousedown',onDown);
}

function render(){applyFontSize();applyPageTheme();applyTaskHeight();renderHome()}

function closeModal(){document.body.classList.remove('locked');$('modal').classList.add('hidden')}
$('modalClose').onclick=closeModal;
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});

let swipeStartY=null;
document.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;swipeStartY=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(swipeStartY==null)return;let dy=swipeStartY-e.changedTouches[0].clientY;swipeStartY=null;if(dy>80&&!activeInput&&!editingClId&&!e.target.closest('.modal')&&!e.target.closest('#settingsWrap')&&!e.target.closest('#logModalWrap')&&!e.target.closest('#historyWrap')&&!e.target.closest('.handle'))openMainMenu()},{passive:true});

function glassRow(iconHtml,txt,extra=''){return `<button class="gRow" ${extra}>${iconHtml?`<span class="iconBox ${iconHtml.cls}">${iconHtml.ic}</span>`:''}<span class="txt">${txt}</span></button>`}

function openMainMenu(){
  document.body.classList.add('locked');
  $('modalTitle').textContent='Menu';
  $('modalBody').innerHTML=`<div class="optList">
    ${glassRow({cls:'ic-green',ic:'＋'},'Add Task','data-opt="addtask"')}
    ${glassRow({cls:'ic-yellow',ic:'📁'},'Add Checklist','data-opt="addcl"')}
    ${glassRow({cls:'ic-purple',ic:'✎'},'Edit Mode','data-opt="editmode"')}
    ${glassRow({cls:'ic-blue',ic:'🏠'},'Home','data-opt="home"')}
    ${glassRow({cls:'ic-pink',ic:'🎯'},'Filters','data-opt="filters"')}
    ${glassRow({cls:'ic-slate',ic:'📅'},'History','data-opt="history"')}
    <div class="optRow">${glassRow({cls:'ic-green',ic:'⬇'},'Expand All','data-opt="expandall"')}${glassRow({cls:'ic-red',ic:'⬆'},'Collapse All','data-opt="collapseall"')}</div>
    ${glassRow({cls:'ic-purple',ic:'⚙'},'Settings','data-opt="settings"')}
  </div>`;
  $('modalActions').style.display='none';$('modalActions').innerHTML='';
  $('modal').classList.remove('hidden');
  $('modalBody').querySelectorAll('[data-opt]').forEach(btn=>{
    btn.onclick=()=>{
      let opt=btn.dataset.opt;
      if(opt==='addtask')openNameModal('task');
      else if(opt==='addcl')openNameModal('checklist');
      else if(opt==='editmode'){data.settings.editMode=!data.settings.editMode;closeModal();changed();showToast(data.settings.editMode?'Edit Mode ON':'Edit Mode OFF',2,null)}
      else if(opt==='home'){view='home';closeModal();render()}
      else if(opt==='filters')openFiltersModal();
      else if(opt==='history'){closeModal();openHistoryModal2()}
      else if(opt==='expandall'){expandAll();closeModal();render()}
      else if(opt==='collapseall'){collapseAll();closeModal();render()}
      else if(opt==='settings'){closeModal();openSettings()}
    };
  });
}
function expandAll(){walk(data.items,x=>{if(x.type==='task'){x.collapsed=false;x.doneCollapsed=false}})}
function collapseAll(){walk(data.items,x=>{if(x.type==='task'){x.collapsed=true;x.doneCollapsed=true}})}

function openMoveTree(idv){
  document.body.classList.add('locked');
  $('modalTitle').textContent='Move to…';
  let r=locate(data.items,idv);let isRootLevel=!r||!r.parent;
  let html='<div class="moveTree">';
  if(!isRootLevel){html+=`<div class="moveItem" data-move-root="1" style="background:rgba(196,181,253,.5);font-weight:800;color:#4338ca;border-color:#8b5cf6">🏠 Root (move to top level)</div>`}
  function renderNode(x,depth){if(x.type!=='task')return;if(x.id===idv)return;html+=`<div class="moveItem indent${Math.min(depth,3)}" data-move-target="${x.id}">${'　'.repeat(depth)}☑ ${esc(x.name)}</div>`;(x.children||[]).forEach(c=>renderNode(c,depth+1))}
  data.items.forEach(x=>renderNode(x,0));
  html+='</div><div class="muted" style="margin-top:8px">Kisi task par click karein — item us ke andar move ho jayega.</div>';
  $('modalBody').innerHTML=html;$('modalActions').style.display='none';$('modalActions').innerHTML='';$('modal').classList.remove('hidden');
  $('modalBody').querySelectorAll('[data-move-target]').forEach(el=>{el.onclick=()=>{doMove(idv,el.dataset.moveTarget);closeModal()}});
  let rootEl=$('modalBody').querySelector('[data-move-root]');if(rootEl){rootEl.onclick=()=>{doMoveToRoot(idv);closeModal()}}
}
function doMove(idv,targetId){let r=locate(data.items,idv);if(!r)return;let target=find(targetId);if(!target||target.type!=='task')return;r.list.splice(r.index,1);target.children=target.children||[];target.children.push(r.item);target.collapsed=false;target.updatedAt=now();changed()}
function doMoveToRoot(idv){let r=locate(data.items,idv);if(!r)return;if(!r.parent)return;r.list.splice(r.index,1);data.items.push(r.item);changed()}

function openHistoryModal(idv){
  let item=find(idv);if(!item)return;
  document.body.classList.add('locked');
  $('modalTitle').textContent='Change Dates — '+item.name;
  let hist=(item.history||[]).slice().sort((a,b)=>new Date(b.at)-new Date(a.at));
  let html='';
  if(!hist.length){html='<div class="empty">No check/uncheck history yet.</div>';}
  else{
    html='<table class="cdTable"><thead><tr><th>Sr</th><th>Type</th><th>Date</th><th></th></tr></thead><tbody>';
    hist.forEach((h,i)=>{let cls=h.status==='Checked'?'checked':'unchecked';html+=`<tr><td class="sr">${i+1}</td><td class="type ${cls}">${esc(h.status)}</td><td>${new Date(h.at).toLocaleString()}</td><td class="del"><button class="delEntryBtn" data-del-entry="${i}">🗑</button></td></tr>`});
    html+='</tbody></table>';
  }
  $('modalBody').innerHTML=html;$('modalActions').style.display='none';$('modalActions').innerHTML='';$('modal').classList.remove('hidden');
  $('modalBody').querySelectorAll('[data-del-entry]').forEach(btn=>{btn.onclick=()=>{let idx=+btn.dataset.delEntry;let sorted=(item.history||[]).slice().sort((a,b)=>new Date(b.at)-new Date(a.at));let target=sorted[idx];item.history=(item.history||[]).filter(h=>h!==target);item.checkCount=item.history.length;item.updatedAt=now();let countEl=document.querySelector('.unblod[data-id="'+idv+'"]');if(countEl){if(item.checkCount>0)countEl.textContent='('+item.checkCount+')';else countEl.remove()}scheduleSave();openHistoryModal(idv)}});
}

function openSisterChecklist(idv){let target=find(idv);let loc=locate(data.items,idv);if(!target||!loc)return;document.body.classList.add('locked');$('modalTitle').textContent='Add Sister Checklist';$('modalBody').innerHTML=`<input id="newItemName" class="field" placeholder="Sister checklist name…" style="width:100%">`;$('modalActions').style.display='flex';$('modalActions').innerHTML=`<button class="s" id="nameCancel">Cancel</button><button class="p" id="nameSave">Save</button>`;$('modal').classList.remove('hidden');setTimeout(()=>$('newItemName')?.focus(),50);$('nameCancel').onclick=closeModal;$('nameSave').onclick=()=>{let v=$('newItemName').value.trim();if(v){let ni=newItem(v,'checklist');loc.list.splice(loc.index+1,0,ni)}closeModal();changed()}}

function deleteItem(idv){
  let snap=JSON.stringify(data);
  let r=locate(data.items,idv);if(!r)return;
  let item=r.item;
  if(item.type==='task'){
    let taskName=item.name;let checklists=[];
    (function collect(node){(node.children||[]).forEach(c=>{if(c.type==='checklist'){checklists.push(c)}else if(c.type==='task'){collect(c)}})})(item);
    r.list.splice(r.index,1);
    if(checklists.length>0){checklists.forEach(c=>{let copy=JSON.parse(JSON.stringify(c));copy.deletedAt=now();copy.deletedParentTask=taskName;data.trash=data.trash||[];data.trash.push(copy)})}
  } else {
    item.deletedAt=now();item.deletedParentTask=r.parent?r.parent.name:null;
    r.list.splice(r.index,1);data.trash=data.trash||[];data.trash.push(item);
  }
  changed();showUndoToast(snap);
}

  m.querySelector('#exportExcel').onclick=()=>{let rows=[];walk(data.items,x=>rows.push({ID:x.id,Name:x.name,Type:x.type,Completed:x.completed,CheckCount:x.checkCount}));let ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Items');XLSX.writeFile(wb,'Checklist.xlsx')};
  m.querySelector('#exportPdf').onclick=exportTablePdf;
}

function exportTablePdf(){
  let w=window.open('','_blank');
  let styles='body{font-family:system-ui,Arial;padding:24px}h1{font-size:18px}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}th,td{border:1px solid #999;padding:6px 9px;text-align:left;vertical-align:top}th{background:#dbe3ff;color:#3b4fc4;font-weight:700}td.sr{text-align:center;width:40px}.pend{display:block;line-height:1.6}.done{display:block;line-height:1.6;color:#21865b;text-decoration:line-through}.taskHead{font-size:15px;font-weight:800;margin:18px 0 6px}';
  let html='<html><head><title>Export</title><style>'+styles+'</style></head><body>';
  function walkVisibleTasks(list){list.forEach(x=>{if(x.hidden||x.archived)return;if(x.type==='task'){let kids=x.children||[];let pend=kids.filter(c=>c.type==='checklist'&&!c.completed);let done=kids.filter(c=>c.type==='checklist'&&c.completed);html+=`<div class="taskHead">Task Name: ${esc(x.name)}</div>`;html+='<table><thead><tr><th class="sr">Ser</th><th>Pend</th><th>Done</th></tr></thead><tbody>';if(!pend.length&&!done.length){html+='<tr><td class="sr">1</td><td>—</td><td>—</td></tr>'}else{let maxRows=Math.max(pend.length,done.length);for(let i=0;i<maxRows;i++){html+=`<tr><td class="sr">${i+1}</td><td>${pend[i]?`<span class="pend">${esc(pend[i].name)}</span>`:''}</td><td>${done[i]?`<span class="done">${esc(done[i].name)}</span>`:''}</td></tr>`}}html+='</tbody></table>'}walkVisibleTasks(x.children||[])})}
  walkVisibleTasks(data.items);html+='</body></html>';w.document.write(html);w.document.close();setTimeout(()=>{w.print()},300);
}

function closeSettings(){document.body.classList.remove('locked');$('settingsWrap').classList.add('hidden');$('settingsWrap').innerHTML='';view='home';render()}
$('settingsWrap').addEventListener('click',e=>{if(e.target===$('settingsWrap'))closeSettings()});

function openLogModal(){
  document.body.classList.add('locked');$('logModalWrap').classList.remove('hidden');
  $('logModalWrap').innerHTML=`<div class="settingsModal"><div class="head"><span>📅 Change Log</span><button id="closeLogTop">✕</button></div><div class="body"><div class="logTopBar"><span>Total entries: ${(data.changelog||[]).length}</span><button class="miniBtn" id="expandAllLog">Expand All</button></div><div id="logBoxWrap"></div></div></div>`;
  $('closeLogTop').onclick=closeLogModal;
  let allExpanded=false;
  $('expandAllLog').onclick=()=>{allExpanded=!allExpanded;data.logCollapsed={};let logs=(data.changelog||[]).slice().sort((a,b)=>new Date(a.at)-new Date(b.at));let days=new Set(logs.map(c=>new Date(c.at).toDateString()));days.forEach(d=>{data.logCollapsed[d]=!allExpanded});$('expandAllLog').textContent=allExpanded?'Collapse All':'Expand All';scheduleSave();renderLogBox($('logBoxWrap'))};
  renderLogBox($('logBoxWrap'));

function closeLogModal(){document.body.classList.remove('locked');$('logModalWrap').classList.add('hidden');$('logModalWrap').innerHTML='';view='home';render()}
$('logModalWrap').addEventListener('click',e=>{if(e.target===$('logModalWrap'))closeLogModal()});

function renderLogBox(wrap){
  let logs=(data.changelog||[]).slice().sort((a,b)=>new Date(a.at)-new Date(b.at));
  if(!logs.length){wrap.innerHTML='<div class="logBox"><div class="logEmpty">No changes yet.</div></div>';return}
  let groups={},order=[];
  logs.forEach(c=>{let k=new Date(c.at).toDateString();if(!groups[k]){groups[k]=[];order.push(k)}groups[k].push(c)});
  let html='<div class="logBox">';
  order.forEach((day,i)=>{
    let entries=groups[day];let collapsed=data.logCollapsed[day]||false;
    html+=`<div class="logDayRow" data-dayrow="${esc(day)}"><button class="logToggle" data-toggle-day="${esc(day)}">${collapsed?'▸':'▾'}</button><span class="logDayText">${day} <span class="logVTag">(V${i+1})</span></span><span class="logCount">${entries.length}</span><button class="logDelDay" data-del-day="${esc(day)}" title="Delete this day">🗑</button></div>`;
    html+=`<div class="logEntries ${collapsed?'collapsed':''}" data-entries-day="${esc(day)}">`;
    entries.forEach((c,idx)=>{html+=`<div class="logEntry"><span class="logNum">${idx+1}.</span><span>${esc(c.text)}</span></div>`});
    html+='</div>';
  });
  html+='</div>';wrap.innerHTML=html;
  wrap.querySelectorAll('.logEntries').forEach(el=>{if(!el.classList.contains('collapsed'))el.style.maxHeight=el.scrollHeight+'px'});
  wrap.querySelectorAll('[data-dayrow]').forEach(row=>{row.onclick=(e)=>{if(e.target.closest('[data-del-day]'))return;let day=row.dataset.dayrow;let ent=wrap.querySelector('[data-entries-day="'+CSS.escape(day)+'"]');if(!ent)return;let nowCollapsed=!ent.classList.contains('collapsed');ent.classList.toggle('collapsed',nowCollapsed);data.logCollapsed[day]=nowCollapsed;if(nowCollapsed){ent.style.maxHeight='0px'}else{ent.style.maxHeight=ent.scrollHeight+'px'}let tg=row.querySelector('.logToggle');if(tg)tg.textContent=nowCollapsed?'▸':'▾';scheduleSave()}});
  wrap.querySelectorAll('[data-del-day]').forEach(btn=>{btn.onclick=(e)=>{e.stopPropagation();let day=btn.dataset.delDay;let before=data.changelog.slice();let removed=data.changelog.filter(c=>new Date(c.at).toDateString()===day).length;data.changelog=data.changelog.filter(c=>new Date(c.at).toDateString()!==day);lastUndoSnapshot=JSON.stringify({changelog:before});scheduleSave();renderLogBox(wrap);showToast(`Removed ${removed} entries`,5,()=>{let s=JSON.parse(lastUndoSnapshot);data.changelog=s.changelog;lastUndoSnapshot=null;scheduleSave();renderLogBox(wrap)})}});
}

/* History */
let histState={display:'all',year:null,month:null,q:'',dropOpen:false};
const HMONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function collectDeletedChecklists(){let out=[];(data.trash||[]).forEach(x=>{if(x.type==='checklist'){out.push({id:x.id,task:x.deletedParentTask||'—',cl:x.name,st:x.completed?'done':'pend',del:new Date(x.deletedAt||now())})}});return out}

function openHistoryModal2(){
  document.body.classList.add('locked');$('historyWrap').classList.remove('hidden');
  $('historyWrap').innerHTML=`<div class="histCard">
    <div class="histHead"><span class="histTitle">📅 History</span><input class="headSearch" id="histSearch" placeholder="Search…"><button id="histClose">✕</button></div>
    <div class="histFilterBox"><div class="histSwipeRow" id="histYearRow"></div></div>
    <div class="monthFloat" id="monthFloat"><div class="histSwipeRow" id="histMonthRow" style="width:100%"></div></div>
    <div class="histStatusChips"><div class="chipsLeft"><div class="hschip active" data-hstatus="all">All <span class="cnt" id="hcntAll"></span></div><div class="hschip" data-hstatus="done">Done <span class="cnt" id="hcntDone"></span></div><div class="hschip" data-hstatus="pend">Pend <span class="cnt" id="hcntPend"></span></div></div><button class="delFilteredBtn" id="delFilteredBtn" title="Permanent delete (5s undo)">🗑</button></div>
    <div class="histBody" id="histBody2"></div>
  </div>`;
  $('histClose').onclick=closeHistoryModal2;
  $('histSearch').addEventListener('input',e=>{histState.q=e.target.value;fullRenderHist()});
  document.querySelectorAll('[data-hstatus]').forEach(ch=>{ch.onclick=(e)=>{e.stopPropagation();if(ch.style.display==='none')return;let newSt=ch.dataset.hstatus;if(histState.display===newSt)return;histState.display=newSt;document.querySelectorAll('[data-hstatus]').forEach(x=>x.classList.remove('active'));ch.classList.add('active');buildHistList()}});
  fullRenderHist();
}
function closeHistoryModal2(){document.body.classList.remove('locked');$('historyWrap').classList.add('hidden');$('historyWrap').innerHTML='';view='home';render()}
$('historyWrap').addEventListener('click',e=>{if(e.target===$('historyWrap'))closeHistoryModal2()});

function histMatchQ(r){let q=histState.q.trim().toLowerCase();return !q||(r.task||'').toLowerCase().includes(q)||(r.cl||'').toLowerCase().includes(q)}
function histAllYears(rows){let s=new Set(rows.map(r=>r.del.getFullYear()));return [...s].sort((a,b)=>b-a)}
function histBaseRows(rows){return rows.filter(r=>{if(!histMatchQ(r))return false;if(histState.year!==null&&r.del.getFullYear()!==histState.year)return false;if(histState.month!==null&&histState.year!==null&&r.del.getMonth()!==histState.month)return false;return true})}
function histVisibleRows(rows){let b=histBaseRows(rows);if(histState.display==='all')return b;return b.filter(r=>r.st===histState.display)}
function histYearCounts(rows){let m={};rows.forEach(r=>{if(!histMatchQ(r))return;let y=r.del.getFullYear();m[y]=(m[y]||0)+1});return m}
function histMonthCountsForYear(rows,y){let m={};rows.forEach(r=>{if(!histMatchQ(r))return;if(r.del.getFullYear()!==y)return;let mm=r.del.getMonth();m[mm]=(m[mm]||0)+1});return m}
function histDisplayCounts(rows){let b=histBaseRows(rows);return{all:b.length,done:b.filter(r=>r.st==='done').length,pend:b.filter(r=>r.st==='pend').length}}
function fmtHDate(dt){let dd=String(dt.getDate()).padStart(2,'0');let mmm=dt.toLocaleString('en',{month:'short'});let yy=String(dt.getFullYear()).slice(2);return `(${dd}-${mmm}-${yy})`}

function buildHistYears(rows){
  let years=histAllYears(rows);let yc=histYearCounts(rows);let total=Object.values(yc).reduce((s,n)=>s+n,0);
  let yhtml=`<div class="hfchip ${histState.year===null?'active':''}" id="hAllTimeChip"><span>All Time</span><span class="cnt">(${total})</span></div>`;
  years.forEach(y=>{let n=yc[y]||0;yhtml+=`<div class="hfchip ${histState.year===y?'active':''}" data-hyear="${y}"><span>${y}</span><span class="cnt">(${n})</span></div>`});
  document.getElementById('histYearRow').innerHTML=yhtml;
  document.getElementById('hAllTimeChip').onclick=()=>{histState.year=null;histState.month=null;histState.dropOpen=false;histState.display='all';document.querySelectorAll('[data-hstatus]').forEach(x=>x.classList.remove('active'));let a=document.querySelector('[data-hstatus="all"]');if(a)a.classList.add('active');fullRenderHist()};
  document.querySelectorAll('[data-hyear]').forEach(el=>{el.onclick=(e)=>{e.stopPropagation();let y=+el.dataset.hyear;if(histState.year===y){histState.dropOpen=!histState.dropOpen}else{histState.year=y;histState.month=null;histState.dropOpen=true;histState.display='all';document.querySelectorAll('[data-hstatus]').forEach(x=>x.classList.remove('active'));let a=document.querySelector('[data-hstatus="all"]');if(a)a.classList.add('active')}fullRenderHist()}});
}
function buildHistMonthDrop(rows){
  let drop=document.getElementById('monthFloat');
  if(histState.year===null||!histState.dropOpen){drop.classList.remove('open');document.getElementById('histMonthRow').innerHTML='';return}
  let mc=histMonthCountsForYear(rows,histState.year);let keys=Object.keys(mc).map(Number).sort((a,b)=>a-b);let mhtml='';
  if(!keys.length){mhtml='<span style="font-size:10.5px;color:var(--g-muted);line-height:20px;display:inline-block;height:20px">No months.</span>'}else{keys.forEach(m=>{mhtml+=`<div class="hmchip ${histState.month===m?'active':''}" data-hmonth="${m}"><span>${HMONTHS[m]}</span><span class="cnt">(${mc[m]})</span></div>`})}
  document.getElementById('histMonthRow').innerHTML=mhtml;drop.classList.add('open');
  document.querySelectorAll('[data-hmonth]').forEach(el=>{el.onclick=(e)=>{e.stopPropagation();let m=+el.dataset.hmonth;histState.month=(histState.month===m)?null:m;fullRenderHist()}});
}
function buildHistDisplayChips(rows){
  let c=histDisplayCounts(rows);
  document.getElementById('hcntAll').textContent='('+c.all+')';
  document.getElementById('hcntDone').textContent='('+c.done+')';
  document.getElementById('hcntPend').textContent='('+c.pend+')';
  document.querySelectorAll('[data-hstatus]').forEach(ch=>{let k=ch.dataset.hstatus;let n=c[k];ch.style.display=(k!=='all'&&n===0)?'none':'inline-flex'});
}
function buildHistList(){
  let rows=collectDeletedChecklists();let list=histVisibleRows(rows);let html='';
  if(!list.length){html='<div class="histEmpty">No items.</div>'}
  else{
    list.sort((a,b)=>b.del-a.del);
    let q=histState.q.trim().toLowerCase();
    list.forEach(r=>{let hit=q&&((r.task||'').toLowerCase().includes(q)||(r.cl||'').toLowerCase().includes(q));html+=`<div class="histRow ${hit?'hit':''}"><span class="histTask">${esc(r.task)}</span><span class="histSep">-</span><div class="histClWrap" data-htext="${esc(r.cl)}"><span class="histCl">${esc(r.cl)}</span></div><span class="histDate">${fmtHDate(r.del)}</span><span class="histStatus ${r.st}">${r.st==='done'?'Done':'Pend'}</span><button class="histRestoreBtn" data-hrestore="${r.id}" title="Restore">↩</button></div>`});
  }
  document.getElementById('histBody2').innerHTML=html;
  document.querySelectorAll('.histClWrap').forEach(w=>{let sx=0,moved=false;w.addEventListener('pointerdown',e=>{sx=e.clientX;moved=false});w.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-sx)>6)moved=true});w.addEventListener('click',()=>{if(!moved)openViewer(w.dataset.htext)})});
  document.querySelectorAll('[data-hrestore]').forEach(btn=>{btn.onclick=(e)=>{e.stopPropagation();restoreFromHistory(btn.dataset.hrestore)}});
}
function fullRenderHist(){let rows=collectDeletedChecklists();buildHistDisplayChips(rows);buildHistYears(rows);buildHistMonthDrop(rows);buildHistList()}
document.addEventListener('click',e=>{if(!histState.dropOpen)return;if(e.target.closest('#monthFloat')||e.target.closest('[data-hyear]'))return;if(!$('historyWrap').classList.contains('hidden')){histState.dropOpen=false;let rows=collectDeletedChecklists();buildHistMonthDrop(rows);buildHistList()}});
function restoreFromHistory(id){let idx=(data.trash||[]).findIndex(x=>x.id===id);if(idx<0)return;let item=data.trash.splice(idx,1)[0];item.deletedAt=null;let taskName=item.deletedParentTask||null;item.deletedParentTask=null;let targetTask=null;if(taskName){walk(data.items,x=>{if(!targetTask&&x.type==='task'&&x.name===taskName)targetTask=x})}if(targetTask){targetTask.children=targetTask.children||[];targetTask.children.push(item);targetTask.collapsed=false;targetTask.updatedAt=now()}else if(taskName){let nt=newItem(taskName,'task');nt.children=[item];data.items.unshift(nt)}else data.items.push(item);changed();if(!$('historyWrap').classList.contains('hidden'))fullRenderHist()}
document.addEventListener('click',e=>{let btn=e.target.closest('#delFilteredBtn');if(!btn)return;e.stopPropagation();let rows=collectDeletedChecklists();let del=histVisibleRows(rows);if(!del.length)return;let ids=new Set(del.map(r=>r.id));let snapshot=JSON.stringify(data);data.trash=(data.trash||[]).filter(t=>!ids.has(t.id));changed();showToast('Deleted '+del.length+' entries permanently',5,()=>{data=JSON.parse(snapshot);changed();if(!$('historyWrap').classList.contains('hidden'))fullRenderHist()});fullRenderHist()});

function startAnon(){auth.signInAnonymously().catch(e=>{$('app').classList.remove('hidden');$('loader').classList.add('hide');showFbPill('Offline','off');render()})}
auth.onAuthStateChanged(async user=>{
  if(!user){uid=null;startAnon();return}
  uid=user.uid;
  try{
    let doc=await DOC.get();
    if(doc.exists&&doc.data().owner===uid&&doc.data().appData){data=doc.data().appData}
    else{let c=localStorage.getItem('nestedChecklistCache');if(c)data=JSON.parse(c);await saveRemote()}
    if(!data.settings.display)data.settings.display={progressbar:true,addbtn:true};
    if(!data.settings.fontSize)data.settings.fontSize=14;
    if(!data.settings.undoSeconds)data.settings.undoSeconds=5;
    if(!data.settings.autoDeleteDays)data.settings.autoDeleteDays=7;
    if(!data.settings.taskHeaderHeight)data.settings.taskHeaderHeight=30;
    if(!data.logCollapsed)data.logCollapsed={};
    if(data.settings.pageTheme===undefined)data.settings.pageTheme='t1';
    if(data.settings.showCheckboxes===undefined)data.settings.showCheckboxes=true;
    if(!data.settings.themeFreeze){let keys=Object.keys(THEMES);let idx=keys.indexOf(data.settings.pageTheme);if(idx<0)idx=0;idx=(idx+1)%keys.length;data.settings.pageTheme=keys[idx]}
    if(!data.changelog)data.changelog=[];
    autoSeedChangelog();showFbPill('Synced');
  }catch(e){let c=localStorage.getItem('nestedChecklistCache');if(c)data=JSON.parse(c);showFbPill('Offline','off')}
  autoCleanup();$('app').classList.remove('hidden');$('loader').classList.add('hide');render();
});
window.addEventListener('online',saveRemote);
window.addEventListener('offline',()=>showFbPill('Offline','off'));

function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}

startAnon();
</script></body></html>
