<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0">
<title>Table Converter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f1f5f9;--sur:#fff;--sur2:#f8fafc;--bd:#e2e8f0;--tx:#0f172a;--tx2:#475569;--tx3:#94a3b8;--pr:#3b82f6;--gr:#22c55e;--grh:#16a34a;--rd:#ef4444;--yl:#eab308;--sh:0 1px 3px rgba(0,0,0,.03);--lk:#2563eb}
body.night{--bg:#0f172a;--sur:#1e293b;--sur2:#334155;--bd:#475569;--tx:#f8fafc;--tx2:#e2e8f0;--tx3:#94a3b8;--pr:#60a5fa;--sh:0 1px 3px rgba(0,0,0,.5);--lk:#93c5fd}
body.theme-glass{--sur:rgba(255,255,255,.55);--sur2:rgba(248,250,252,.4);--bd:rgba(203,213,225,.5);background:linear-gradient(135deg,#e0e7ff,#f0f9ff 50%,#fce7f3)}
body.theme-glass .topbar,body.theme-glass .tw,body.theme-glass .menu,body.theme-glass .modal,body.theme-glass .hi,body.theme-glass .qp{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 8px 32px rgba(31,38,135,.12);border:1px solid rgba(255,255,255,.6)}
body.night.theme-glass{--sur:rgba(30,41,59,.6);--sur2:rgba(51,65,85,.4);--bd:rgba(71,85,105,.5);background:linear-gradient(135deg,#1e1b4b,#0f172a 50%,#172554)}
body.theme-gradient{background:linear-gradient(135deg,#e0e7ff,#f0f9ff 50%,#fef3c7)}
body.night.theme-gradient{background:linear-gradient(135deg,#1e1b4b,#0f172a 50%,#172554)}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;min-height:100vh;transition:background .3s,color .3s}
.topbar{position:sticky;top:0;z-index:100;background:var(--sur);border-bottom:1px solid var(--bd);padding:8px 10px;display:flex;align-items:center;justify-content:center;gap:6px;overflow-x:auto;box-shadow:var(--sh);flex-wrap:wrap}
.topbar button{width:38px;height:38px;background:var(--sur2);border:1px solid var(--bd);border-radius:10px;font-size:1rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--tx);padding:0;transition:.1s}
.topbar button:hover{background:var(--bd)}
.topbar button:active{transform:scale(.93)}
.btn-add{width:38px;height:38px;border-radius:10px;font-size:1.15rem;font-weight:700;cursor:pointer;border:1px solid;transition:.2s;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-add.nodata{background:#e2e8f0;border-color:#cbd5e1;color:#64748b}
.btn-add.online{background:var(--gr);border-color:var(--grh);color:#fff;animation:pG 2s infinite}
.btn-add.saving{background:var(--yl);border-color:#ca8a04;color:#fff;animation:pY .6s infinite}
.btn-add.offline{background:var(--rd);border-color:#dc2626;color:#fff}
@keyframes pG{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.7)}50%{box-shadow:0 0 0 8px rgba(34,197,94,0)}}
@keyframes pY{0%,100%{box-shadow:0 0 0 0 rgba(234,179,8,.7)}50%{box-shadow:0 0 0 6px rgba(234,179,8,0)}}
.tw{margin:10px;background:var(--sur);border-radius:14px;border:1px solid var(--bd);overflow:hidden}
.ts{overflow:auto;max-height:60vh;-webkit-overflow-scrolling:touch;width:100%}
table{border-collapse:collapse;width:auto;font-size:.85rem;table-layout:auto}
th,td{border:1px solid var(--bd);padding:7px 9px;vertical-align:top;position:relative;white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
td.expanded{white-space:normal;max-width:none;overflow:visible;text-overflow:clip;word-break:break-word}
th{background:var(--sur2);font-weight:600;text-align:left;position:sticky;top:0;z-index:5;font-size:.8rem;color:var(--tx)}
td[contenteditable="true"]:focus{outline:2px solid var(--pr);outline-offset:-2px;background:rgba(59,130,246,.08);white-space:normal;max-width:none}
a.link{color:var(--lk);text-decoration:none;cursor:pointer;font-weight:500}
.row-num{background:var(--sur2);color:var(--tx2);text-align:center;font-size:.75rem;width:38px;min-width:38px;font-weight:600;cursor:pointer;user-select:none;-webkit-user-select:none}
.row-zero{background:#fef3c7;color:#854d0e;font-weight:700}
body.night .row-zero{background:#78350f;color:#fef3c7}
.col-head{display:flex;align-items:center;gap:4px}
.col-head .h-label{flex:1;cursor:pointer;padding:2px 4px;border-radius:4px}
.excluded{opacity:.35}
.pg{display:flex;justify-content:center;align-items:center;gap:10px;padding:8px;background:var(--sur2);border-top:1px solid var(--bd);font-size:.8rem;color:var(--tx2)}
.pg button{background:var(--sur);border:1px solid var(--bd);padding:5px 12px;border-radius:8px;font-size:.8rem;cursor:pointer;color:var(--tx)}

.menu{position:fixed;background:var(--sur);border:1px solid var(--bd);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:6px;z-index:1000;min-width:240px;display:none;max-height:75vh;overflow-y:auto}
.menu.open{display:block}
.mi{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:.88rem;cursor:pointer;border:0;background:0 0;width:100%;text-align:left;white-space:nowrap;color:var(--tx)}
.mi:hover{background:var(--sur2)}
.mi.danger{color:var(--rd)}
.mi .ic{font-size:1rem;width:20px;text-align:center}
.mi .lb{flex:1}
.mi .vl{font-size:.75rem;color:var(--tx3);font-family:monospace}
.msep{height:1px;background:var(--bd);margin:4px 0}
.mhd{font-size:.7rem;color:var(--tx3);padding:8px 12px 4px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.cg{display:flex;gap:6px;padding:8px 12px;flex-wrap:wrap}
.cs{width:32px;height:32px;border-radius:8px;border:2px solid var(--bd);cursor:pointer;transition:.1s}
.cs:hover{transform:scale(1.1);border-color:var(--pr)}
.cs.active{border-color:var(--pr);border-width:3px}
.cs.none{position:relative;background:repeating-linear-gradient(45deg,#eee,#eee 4px,#ccc 4px,#ccc 8px)}
.cs.none::after{content:'✕';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#666;font-size:14px}
.ctr{display:flex;gap:6px;padding:8px 12px}
.ctr button{flex:1;padding:8px;border-radius:8px;border:1.5px solid var(--bd);background:var(--sur2);color:var(--tx);cursor:pointer;font-size:.78rem;font-weight:600}
.ctr button.active{border-color:var(--pr);background:rgba(59,130,246,.1);color:var(--pr)}
.wc{display:flex;align-items:center;gap:6px;padding:8px 12px}

.wc .wv{font-family:monospace;font-size:.85rem;font-weight:600;color:var(--tx);min-width:50px;text-align:right}
.wc button{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--bd);background:var(--sur2);font-size:1rem;font-weight:700;cursor:pointer;color:var(--tx);padding:0}
.ss{display:flex;gap:4px;padding:0 12px 10px}
.ss label{flex:1;display:flex;align-items:center;justify-content:center;padding:6px;border:1.5px solid var(--bd);border-radius:8px;font-size:.75rem;cursor:pointer;background:var(--sur)}
.ss label:has(input:checked){border-color:var(--pr);background:rgba(59,130,246,.1);color:var(--pr)}
.ss input{display:none}
.mbg{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1500;display:none;align-items:center;justify-content:center;padding:20px}
.mbg.open{display:flex}
.mbox{background:var(--sur);color:var(--tx);border-radius:16px;padding:20px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
.mbox h3{font-size:1rem;margin-bottom:14px}
.mbox input,.mbox select,.mbox textarea{width:100%;padding:10px 12px;border:1.5px solid var(--bd);border-radius:10px;font-size:.9rem;margin-bottom:12px;background:var(--sur);color:var(--tx)}
.mac{display:flex;gap:8px;margin-top:6px}
.mac button{flex:1;padding:11px;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer;border:0}
.eg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.eg button{padding:12px 8px;border-radius:10px;border:1.5px solid var(--bd);background:var(--sur2);color:var(--tx);cursor:pointer;font-size:.82rem;font-weight:600;text-align:center}
.eg button:hover{background:var(--bd)}
.qtr{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--sur2);border:1.5px solid var(--bd);border-radius:10px;margin-bottom:12px}
.qtr span{font-size:.9rem;font-weight:600}
.tgl{position:relative;width:50px;height:26px;background:#cbd5e1;border-radius:20px;cursor:pointer;transition:.2s;flex-shrink:0}
.tgl.on{background:var(--gr)}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
.tgl.on::after{left:27px}
.sr{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}
.sr:last-child{border-bottom:0}
.slk{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd);background:var(--sur2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
.slk.locked{background:#fee2e2;border-color:#fca5a5}
.sb{flex:1}
.slb{font-size:.85rem;font-weight:600;margin-bottom:8px;display:block}
.so{display:flex;flex-wrap:wrap;gap:6px}
.so label{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border:1.5px solid var(--bd);border-radius:8px;font-size:.78rem;cursor:pointer;background:var(--sur)}
.so label:has(input:checked){border-color:var(--pr);background:rgba(59,130,246,.1);color:var(--pr)}
.so input{display:none}
.sr.locked .so{opacity:.4;pointer-events:none}
.sll{display:flex;justify-content:space-between;font-size:.7rem;color:var(--tx3);margin-bottom:4px}
input[type=range]{width:100%;-webkit-appearance:none;height:6px;border-radius:3px;background:linear-gradient(to right,#000,#808080,#fff);outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--sur);border:2px solid var(--pr);cursor:pointer}
.tst{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-size:.85rem;z-index:2000;opacity:0;transition:.25s;pointer-events:none;max-width:92vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.tst.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hp{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1600;display:none;align-items:flex-end;justify-content:center}
.hp.open{display:flex}
.hi{background:var(--sur);color:var(--tx);width:100%;max-width:560px;max-height:85vh;border-radius:20px 20px 0 0;padding:18px;overflow-y:auto}
.hh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--bd);gap:8px}
.hh h3{font-size:1.05rem;flex:1}
.hh button{background:var(--sur2);border:1px solid var(--bd);font-size:.8rem;cursor:pointer;color:var(--tx);padding:6px 10px;border-radius:8px}
.hh .da{background:#fee2e2;border-color:#fca5a5;color:#b91c1c;font-weight:600}
.hit{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--sur2)}
.hit .dt{font-size:.72rem;color:var(--tx3);margin-bottom:4px;font-family:monospace}
.hit .mt{font-size:.78rem;color:var(--tx2);margin-bottom:8px}
.hit .pv{font-size:.72rem;color:var(--tx2);font-family:monospace;background:var(--sur);padding:8px;border-radius:6px;margin-bottom:8px;border:1px solid var(--bd);overflow-x:auto;max-height:90px;white-space:pre;line-height:1.5}
.hit .ac{display:flex;gap:6px}
.hit .ac button{flex:1;padding:7px;border-radius:8px;font-size:.8rem;cursor:pointer;border:1px solid var(--bd);background:var(--sur);color:var(--tx)}
.hit .ac .rc{background:rgba(59,130,246,.1);border-color:var(--pr);color:var(--pr);font-weight:600}
.hit .ac .dl{color:var(--rd);border-color:#fecaca}
.qp{margin:10px;padding:12px;background:var(--sur2);border:1px dashed var(--bd);border-radius:12px}
.qg{display:flex;flex-wrap:wrap;gap:10px}
.qc{background:var(--sur);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;text-align:center;min-width:80px}
.qc .qr{font-size:.75rem;font-weight:700;color:var(--tx);font-family:monospace;margin-bottom:5px}
.qc img{width:60px;height:60px;display:block;margin:0 auto}
.ttd{text-align:center;font-weight:bold;text-transform:uppercase;font-size:1.3rem;padding:14px 10px;letter-spacing:1px;color:var(--tx);cursor:pointer}
.tsp{height:1em}
@media(max-width:480px){body{font-size:14px}.topbar button,.btn-add{width:34px;height:34px;font-size:.9rem}th,td{padding:5px 7px;font-size:.78rem}.row-num{width:32px;min-width:32px}.ttd{font-size:1.1rem}}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
</style>
</head>
<body>
<div class="topbar">
  <button class="btn-add nodata" id="addBtn" title="Click: paste | Long-press: status">➕</button>
  <button id="clearBtn" title="Clear">🧹</button>
  <button id="copyBtn" title="Copy">⧉</button>
  <button id="exportBtn" title="Export">🚀</button>
  <button id="moreBtn" title="More">⋮</button>
</div>
<div class="tw">
  <div class="empty-msg" id="emptyMsg">📭 No table — paste data with ➕</div>
  <div class="ts" id="tableScroll" style="display:none">
    <div class="ttd" id="tableTitle" style="display:none"></div>
    <div class="tsp" id="titleSpacer" style="display:none"></div>
    <table id="mainTable"><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table>
  </div>
  <div class="pg" id="pagination" style="display:none">
    <button id="prevPage">◀</button><span id="pageInfo">1 / 1</span><button id="nextPage">▶</button>
  </div>
</div>
<div class="qp" id="qrPreview" style="display:none"><div class="qg" id="qrGrid"></div></div>
<div class="menu" id="rowMenu"></div>
<div class="menu" id="colMenu"></div>
<div class="menu" id="moreMenu"></div>
<div class="menu" id="cellMenu"></div>
<div class="mbg" id="modalBg"><div class="mbox" id="modalBox"></div></div>
<div class="hp" id="historyPanel">
  <div class="hi">
    <div class="hh">
      <h3>📜 History</h3>
      <button class="da" id="deleteAllHistory">🗑️ Delete All</button>
      <button id="closeHistory">✕</button>
    </div>
    <div id="historyList"></div>
  </div>
</div>
<div class="tst" id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,signInAnonymously,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,setDoc,getDoc,updateDoc,deleteDoc,collection,getDocs,query,orderBy,limit,writeBatch}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const FC={apiKey:"AIzaSyAFiJNThb3TJsqiPLIcqk20XU9ag59wdOs",authDomain:"mywebapps-e3b63.firebaseapp.com",projectId:"mywebapps-e3b63",storageBucket:"mywebapps-e3b63.firebasestorage.app",messagingSenderId:"46681415809",appId:"1:46681415809:web:c4528b9da97abc310a2d80"};
const CN="Excel Sheet Table Export",GD="global";
const app=initializeApp(FC),auth=getAuth(app),db=getFirestore(app);
let CU=null,GDR=null;
const COLORS=['#ffffff','#fef3c7','#dcfce7','#dbeafe','#fee2e2'];
let S={headers:[],rows:[],incR:[],incC:[],colW:[],rowH:[],rowBg:[],colBg:[],cellBg:{},headerColor:'',headerOpacity:100,curPage:1,perPage:50,qrCol:false,qrSec:false,step:5,lastRef:1000,zoom:100,hideHeader:true,skipEmpty:true,title:'',showRowNums:false,sortCol:null,sortDir:null,hasHeader:false};
let uStack=[],rStack=[];
let SET={theme:'flat',dayNight:'day',fontSize:12,fontStyle:'system',qrSize:2,borderColor:'#000000',borderMode:'slider',borderVal:0,screenFont:15,step:5,locks:{}};
let FBS={online:true,dirty:false,histTimer:null,lastHistId:null,lastSave:null};
let hist=[];
let exQr=true;
window._or='portrait';
const $=id=>document.getElementById(id);
const ts=$('tableScroll'),th=$('tableHead'),tb=$('tableBody'),em=$('emptyMsg'),pg=$('pagination'),pi=$('pageInfo'),ab=$('addBtn'),tst=$('toast'),rm=$('rowMenu'),cm=$('colMenu'),mm=$('moreMenu'),clm=$('cellMenu'),mbg=$('modalBg'),mbox=$('modalBox'),hp=$('historyPanel'),hl=$('historyList'),qp=$('qrPreview'),qg=$('qrGrid'),mt=$('mainTable'),tt=$('tableTitle'),tsp=$('titleSpacer');

function toast(m,ms=1900){tst.textContent=m;tst.classList.add('show');clearTimeout(tst._t);tst._t=setTimeout(()=>tst.classList.remove('show'),ms)}
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function isUrl(v){const s=String(v||'').trim();if(!s)return false;if(/^https?:\/\//i.test(s))return true;if(/^www\./i.test(s))return true;if(/^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+(\/[^\s]*)?$/i.test(s)&&/[a-z]{2,}/i.test(s.split('/')[0].split('.').pop()))return true;return false}
function rCell(v){const s=String(v??'');if(isUrl(s)){const u=s.trim();const h=/^https?:\/\//i.test(u)?u:'https://'+u;return '<a class="link" href="'+esc(h)+'" target="_blank" rel="noopener" title="'+esc(u)+'">'+esc(u)+'</a>'}return esc(s)}
function lum(hex){hex=(hex||'#fff').replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');const r=parseInt(hex.substr(0,2),16)/255,g=parseInt(hex.substr(2,2),16)/255,b=parseInt(hex.substr(4,2),16)/255;return 0.2126*r+0.7152*g+0.0722*b}
function cTx(bg){return lum(bg)>0.55?'#0f172a':'#f8fafc'}
function hexRgba(hex,op){hex=(hex||'#fff').replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');return 'rgba('+parseInt(hex.substr(0,2),16)+','+parseInt(hex.substr(2,2),16)+','+parseInt(hex.substr(4,2),16)+','+(op/100)+')'}
function snap(){return{headers:[...S.headers],rows:S.rows.map(r=>[...r]),incR:[...S.incR],incC:[...S.incC],colW:[...S.colW],rowH:[...S.rowH],rowBg:[...S.rowBg],colBg:[...S.colBg],cellBg:JSON.parse(JSON.stringify(S.cellBg)),headerColor:S.headerColor,headerOpacity:S.headerOpacity,qrCol:S.qrCol,qrSec:S.qrSec,lastRef:S.lastRef,hideHeader:S.hideHeader,title:S.title,sortCol:S.sortCol,sortDir:S.sortDir,hasHeader:S.hasHeader}}
function pUndo(){uStack.push(snap());if(uStack.length>80)uStack.shift();rStack=[];mark()}
function restore(s){S.headers=[...s.headers];S.rows=s.rows.map(r=>[...r]);S.incR=[...s.incR];S.incC=[...s.incC];S.colW=[...(s.colW||[])];S.rowH=[...(s.rowH||[])];S.rowBg=[...(s.rowBg||[])];S.colBg=[...(s.colBg||[])];S.cellBg=JSON.parse(JSON.stringify(s.cellBg||{}));S.headerColor=s.headerColor||'';S.headerOpacity=s.headerOpacity||100;S.qrCol=s.qrCol;S.qrSec=s.qrSec;S.lastRef=s.lastRef||1000;S.hideHeader=s.hideHeader!==undefined?s.hideHeader:true;S.title=s.title||'';S.sortCol=s.sortCol||null;S.sortDir=s.sortDir||null;S.hasHeader=s.hasHeader||false;S.curPage=1;render()}

function applyTheme(){document.body.classList.remove('night','theme-flat','theme-glass','theme-gradient');if(SET.dayNight==='night')document.body.classList.add('night');document.body.classList.add('theme-'+(SET.theme||'flat'));document.body.style.fontSize=(SET.screenFont||15)+'px'}
function setAddSt(s){ab.classList.remove('online','saving','offline','nodata');if(s==='online'){ab.classList.add('online');ab.title='Connected'}else if(s==='saving'){ab.classList.add('saving');ab.title='Saving…'}else if(s==='offline'){ab.classList.add('offline');ab.title='Offline'}else{ab.classList.add('nodata');ab.title='Click to paste'}}

async function initFB(){try{onAuthStateChanged(auth,async u=>{if(u){CU=u;GDR=doc(db,CN,GD);try{await ensureGD();await loadSet();await loadCur();await loadHist()}catch(e){console.error(e)}setAddSt('online')}else{try{await signInAnonymously(auth)}catch(e){setAddSt('offline')}}})}catch(e){console.error(e)}}
async function ensureGD(){const snap=await getDoc(GDR);if(!snap.exists())await setDoc(GDR,{createdAt:new Date().toISOString(),settings:SET,current:null,lastQrRef:1000})}

function parseText(text){const lines=text.split(/\r?\n/).filter(l=>l.trim()!=='');if(!lines.length)return null;let d='\t';const f=lines[0];if(f.indexOf('\t')===-1){if(f.indexOf(',')>-1)d=',';else if(f.indexOf(';')>-1)d=';';else if(f.indexOf('|')>-1)d='|'}function split(line){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===d&&!q){out.push(cur.trim());cur=''}else cur+=c}out.push(cur.trim());return out}const m=lines.map(split);const max=Math.max.apply(null,m.map(r=>r.length));return m.map(r=>{while(r.length<max)r.push('');return r})}
function autoQr(){let hu=false;S.rows.forEach((row,gi)=>{if(!S.incR[gi])return;S.headers.forEach((_,ci)=>{if(!S.incC[ci])return;if(isUrl(row[ci]))hu=true})});if(hu){S.qrCol=true;S.qrSec=true}else{S.qrCol=false;S.qrSec=false}}
function loadMatrix(m){if(!m||!m.length)return;const cc=m[0].length;
  if(S.hasHeader){S.headers=m[0].map(v=>v||'');S.rows=m.slice(1).map(r=>{while(r.length<cc)r.push('');return[...r]})}
  else{S.headers=new Array(cc).fill('');S.rows=m.map(r=>{while(r.length<cc)r.push('');return[...r]})}
  S.incR=new Array(S.rows.length).fill(true);S.incC=new Array(cc).fill(true);S.colW=new Array(cc).fill(null);S.rowH=new Array(S.rows.length).fill(null);S.rowBg=new Array(S.rows.length).fill('');S.colBg=new Array(cc).fill('');S.cellBg={};S.curPage=1;S.sortCol=null;S.sortDir=null;autoQr();render();mark();FBS.lastHistId=null;saveHistNow()}

  const vis=[];S.rows.forEach((row,ri)=>{if(S.skipEmpty&&row.every(c=>!String(c||'').trim()))return;vis.push(ri)});
  const tv=vis.length;const st=(S.curPage-1)*S.perPage;const en=Math.min(st+S.perPage,tv);const pIdx=vis.slice(st,en);
  const hBg=S.headerColor?hexRgba(S.headerColor,S.headerOpacity):'';const hSt=hBg?('background:'+hBg+';color:'+cTx(S.headerColor)+';'):'';

      b+='<td contenteditable="true" data-r="'+gi+'" data-c="'+ci+'" style="'+(ci2?'':'opacity:0.5;')+ws+cs+'">'+rCell(v)+'</td>'});
    if(S.qrCol){const refs=getRowQr(gi);b+='<td style="text-align:center;font-family:monospace;font-size:.72rem;'+rs+'">'+(refs.length?refs.map(r=>r.ref).join(', '):'-')+'</td>'}
    b+='</tr>'});
  if(!pIdx.length)b='<tr><td colspan="'+(S.headers.length+(S.showRowNums?1:0)+(S.qrCol?1:0))+'" style="text-align:center;color:#94a3b8;padding:20px">No rows</td></tr>';

}
function getRowQr(gi){const row=S.rows[gi];if(!row)return[];const it=[];S.headers.forEach((_,ci)=>{if(!S.incC[ci])return;if(isUrl(row[ci]))it.push(ci)});if(!it.length)return[];let c=1000;const out=[];S.rows.forEach((r,ri)=>{if(!S.incR[ri])return;S.headers.forEach((_,ci)=>{if(!S.incC[ci])return;if(isUrl(r[ci])){c++;if(ri===gi)out.push({ref:String(c),url:r[ci]})}})});return out}
function getAllQr(){let c=1000;const out=[];S.rows.forEach((row,gi)=>{if(!S.incR[gi])return;S.headers.forEach((_,ci)=>{if(!S.incC[ci])return;if(isUrl(row[ci])){c++;out.push({ref:String(c),url:row[ci],rowIndex:gi})}})});return out}
function renderQr(){if(!S.qrSec){qp.style.display='none';return}qp.style.display='block';const e=getAllQr();if(!e.length){qg.innerHTML='<div style="color:#94a3b8;font-size:.8rem">No QR codes</div>';return}qg.innerHTML=e.map(x=>'<div class="qc"><div class="qr">'+x.ref+'</div><img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data='+encodeURIComponent(x.url)+'" loading="lazy"></div>').join('')}

});

function sortCol(ci){const idx=S.rows.map((r,i)=>i);
  const pv=v=>{const s=String(v||'').trim();if(!s)return{t:4,v:s};const n=parseFloat(s.replace(/,/g,''));if(!isNaN(n)&&/^-?[\d.,]+$/.test(s))return{t:1,v:n};const d=Date.parse(s);if(!isNaN(d)&&/\d/.test(s)&&/[-/]/.test(s))return{t:2,v:d};return{t:3,v:s.toLowerCase()}};
  idx.sort((a,b)=>{const va=pv(S.rows[a][ci]),vb=pv(S.rows[b][ci]);if(va.t!==vb.t)return va.t-vb.t;return va.v<vb.v?-1:va.v>vb.v?1:0});
  if(S.sortDir==='desc')idx.reverse();
  const nR=idx.map(i=>S.rows[i]),nI=idx.map(i=>S.incR[i]),nH=idx.map(i=>S.rowH[i]),nC=idx.map(i=>S.rowBg[i]);
  const nCB={};Object.keys(S.cellBg).forEach(k=>{const p=k.split('_');const ri=parseInt(p[0]),c=p[1];const np=idx.indexOf(ri);if(np>-1)nCB[np+'_'+c]=S.cellBg[k]});
  S.rows=nR;S.incR=nI;S.rowH=nH;S.rowBg=nC;S.cellBg=nCB}

      lines.forEach((ln,li)=>{if(isUrl(s)){const uu=s.trim();const hh=/^https?:\/\//i.test(uu)?uu:'https://'+uu;pdf.setTextColor(37,99,235);pdf.textWithLink(ln,x+pad,y+pad+(li+1)*lh-1,{url:hh});pdf.setTextColor(0,0,0)}else pdf.text(ln,x+pad,y+pad+(li+1)*lh-1)});
      x+=w});
    if(exQr&&(S.qrSec||S.qrCol)){pdf.setDrawColor(bRgb[0],bRgb[1],bRgb[2]);pdf.rect(x,y,qrW,rh);pdf.setFontSize(fs*0.85);pdf.text(rowRefs.length?rowRefs.join(', '):'-',x+pad,y+pad+lh-1);pdf.setFontSize(fs)}
    y+=rh});
  if(exQr&&(S.qrSec||S.qrCol)&&refs.length){
    pdf.addPage();y=m;pdf.setFontSize(fs+2);pdf.setFont(undefined,'bold');pdf.text('QR Codes',m,y+5);y+=10;pdf.setFont(undefined,'normal');pdf.setFontSize(fs);
    const qs=SET.qrSize,qmm=qs*25.4,bp=2,bw=qmm+bp*2,bh=qmm+bp*2+6,gap=3;
    const usableW=pw-m*2;const cols=Math.max(1,Math.floor((usableW+gap)/(bw+gap)));let col=0;
    const urls=await Promise.all(refs.map(async e=>({ref:e.ref,dataURL:await fetchQr(e.url,qs*96)})));
    for(const e of urls){if(col>=cols){col=0;y+=bh+gap}if(y+bh>ph-m){pdf.addPage();y=m;col=0}
      const x=m+col*(bw+gap);pdf.setDrawColor(bRgb[0],bRgb[1],bRgb[2]);pdf.setLineWidth(0.3);pdf.rect(x,y,bw,bh);
      pdf.setFontSize(fs*0.85);pdf.setFont(undefined,'bold');pdf.text(e.ref,x+bw/2,y+4,{align:'center'});pdf.setFont(undefined,'normal');pdf.setLineWidth(0.1);pdf.line(x+2,y+5.5,x+bw-2,y+5.5);
      if(e.dataURL){try{pdf.addImage(e.dataURL,'PNG',x+bp,y+7,qmm,qmm)}catch(er){}}
      col++}}
  pdf.save('table.pdf');toast('.pdf downloaded')
}

function hexRgb(hex){hex=(hex||'#000').replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');return[parseInt(hex.substr(0,2),16),parseInt(hex.substr(2,2),16),parseInt(hex.substr(4,2),16)]}
function dlBlob(c,f,t){const b=new Blob([c],{type:t});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=f;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u)}

function openConfirm(title,msg,btns,onCh){mbox.innerHTML='';const h=document.createElement('h3');h.textContent=title;mbox.appendChild(h);const p=document.createElement('p');p.textContent=msg;p.style.cssText='color:#475569;font-size:.88rem;margin-bottom:14px';mbox.appendChild(p);const a=document.createElement('div');a.className='mac';a.style.flexDirection='column';btns.forEach(b=>{const btn=document.createElement('button');btn.textContent=b.label;btn.style.background=b.color;btn.style.color='#fff';btn.style.marginBottom='6px';btn.onclick=()=>{closeM();onCh(b.action)};a.appendChild(btn)});mbox.appendChild(a);mbg.classList.add('open')}

function openHist(){renderHist();hp.classList.add('open')}
$('closeHistory').addEventListener('click',()=>hp.classList.remove('open'));
hp.addEventListener('click',e=>{if(e.target===hp)hp.classList.remove('open')});
$('deleteAllHistory').addEventListener('click',()=>{openConfirm('Delete all history?','This will permanently delete all saved records. This cannot be undone.',[{label:'Delete All',color:'#ef4444',action:'del'},{label:'Cancel',color:'#94a3b8',action:'c'}],async ch=>{if(ch!=='del')return;await delAllHist();renderHist();toast('All history deleted')})});

function renderHist(){if(!hist.length){hl.innerHTML='<div style="text-align:center;color:#94a3b8;padding:40px 20px;font-style:italic">No saved records yet</div>';return}hl.innerHTML=hist.map((rec,i)=>{const dt=new Date(rec.timestamp).toLocaleString();const hs=(rec.headers||[]).slice(0,4).map(h=>h||'Col');let pv=(rec.title?rec.title.toUpperCase()+'\n':'')+hs.join(' | ')+'\n'+'─'.repeat(28)+'\n';(rec.rows||[]).slice(0,3).forEach(r=>{pv+=r.slice(0,4).map(v=>(v||'').substring(0,12)).join(' | ')+'\n'});if((rec.rows||[]).length>3)pv+='...';return'<div class="hit" data-i="'+i+'"><div class="dt">'+dt+'</div><div class="mt">'+(rec.rows||[]).length+' rows · '+(rec.headers||[]).length+' cols</div><div class="pv">'+esc(pv)+'</div><div class="ac"><button class="rc" data-r="'+i+'">📂 Recall</button><button class="dl" data-d="'+i+'">🗑️ Delete</button></div></div>'}).join('')}

hl.addEventListener('click',async e=>{const r=e.target.closest('[data-r]'),d=e.target.closest('[data-d]');
  if(r){const rec=hist[parseInt(r.dataset.r)];if(!rec)return;pUndo();S.headers=[...(rec.headers||[])];S.rows=(rec.rows||[]).map(x=>[...x]);S.incR=[...(rec.includedRows||[])];S.incC=[...(rec.includedCols||[])];S.colW=new Array(S.headers.length).fill(null);S.rowH=new Array(S.rows.length).fill(null);S.rowBg=new Array(S.rows.length).fill('');S.colBg=new Array(S.headers.length).fill('');S.cellBg={};S.hasHeader=rec.hasHeader||false;S.title=rec.title||'';S.sortCol=null;S.sortDir=null;S.curPage=1;autoQr();render();mark();hp.classList.remove('open');toast('Recalled')}
  if(d){const rec=hist[parseInt(d.dataset.d)];if(!rec)return;if(!confirm('Delete this record?'))return;await delHist(rec.id);renderHist();toast('Deleted')}});

document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.shiftKey){e.preventDefault();doUndo()}if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.key==='z'&&e.shiftKey))){e.preventDefault();doRedo()}if(e.key==='Escape')closeMenus()});

(function init(){applyTheme();setAddSt('nodata');initFB()})();
</script>
