<title>Table Converter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f1f5f9;--surface:#fff;--surface-2:#f8fafc;--border:#e2e8f0;--text:#0f172a;--text-2:#475569;--text-3:#94a3b8;--primary:#3b82f6;--primary-hover:#2563eb;--green:#22c55e;--green-hover:#16a34a;--red:#ef4444;--yellow:#eab308;--shadow:0 1px 3px rgba(0,0,0,0.03);--link:#2563eb}

body.night.theme-gradient{background:linear-gradient(135deg,#1e1b4b 0%,#0f172a 50%,#172554 100%)}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;min-height:100vh;transition:background .3s,color .3s}

.topbar button:hover{background:var(--border)}
.topbar button:active{transform:scale(.93)}
.btn-add{width:38px;height:38px;border-radius:10px;font-size:1.15rem;font-weight:700;cursor:pointer;border:1px solid;transition:.2s;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-add.nodata{background:#e2e8f0;border-color:#cbd5e1;color:#64748b}

.btn-add.saving{background:var(--yellow);border-color:#ca8a04;color:#fff;animation:pulseYellow .6s infinite}
.btn-add.offline{background:var(--red);border-color:#dc2626;color:#fff}

@keyframes pulseYellow{0%,100%{box-shadow:0 0 0 0 rgba(234,179,8,.7)}50%{box-shadow:0 0 0 6px rgba(234,179,8,0)}}
.table-wrap{margin:10px;background:var(--surface);border-radius:14px;border:1px solid var(--border);overflow:hidden}
.table-scroll{overflow:auto;max-height:60vh;-webkit-overflow-scrolling:touch;width:100%}
table{border-collapse:collapse;width:auto;font-size:.85rem;transition:transform .15s;table-layout:auto}
th,td{border:1px solid var(--border);padding:7px 9px;vertical-align:top;position:relative;white-space:nowrap}

a.link{color:var(--link);text-decoration:none;cursor:pointer;font-weight:500}

.row-num{background:var(--surface-2);color:var(--text-2);text-align:center;font-size:.75rem;width:38px;min-width:38px;font-weight:600;cursor:pointer;user-select:none;-webkit-user-select:none}
.row-zero{background:#fef3c7;color:#854d0e;font-weight:700}

.modal-bg.open{display:flex}
.modal{background:var(--surface);color:var(--text);border-radius:16px;padding:20px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
.modal h3{font-size:1rem;margin-bottom:14px;display:flex;align-items:center;gap:8px}

.export-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}

.toggle-switch{position:relative;width:50px;height:26px;background:#cbd5e1;border-radius:20px;cursor:pointer;transition:.2s;flex-shrink:0}
.toggle-switch.on{background:var(--green)}
.toggle-switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
.toggle-switch.on::after{left:27px}
.setting-row{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border-bottom:0}
.setting-lock{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
.setting-lock.locked{background:#fee2e2;border-color:#fca5a5}
.setting-body{flex:1}
.setting-label{font-size:.85rem;font-weight:600;margin-bottom:8px;display:block}

.slider-labels{display:flex;justify-content:space-between;font-size:.7rem;color:var(--text-3);margin-bottom:4px}

.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-size:.85rem;z-index:2000;opacity:0;transition:.25s;pointer-events:none;max-width:92vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}

.history-panel{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1600;display:none;align-items:flex-end;justify-content:center}
.history-panel.open{display:flex}
.history-inner{background:var(--surface);color:var(--text);width:100%;max-width:560px;max-height:85vh;border-radius:20px 20px 0 0;padding:18px;overflow-y:auto}
.history-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);gap:8px}

.history-header button{background:var(--surface-2);border:1px solid var(--border);font-size:.8rem;cursor:pointer;color:var(--text);padding:6px 10px;border-radius:8px}

.history-item{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--surface-2)}

.history-item .hi-preview{font-size:.72rem;color:var(--text-2);font-family:monospace;background:var(--surface);padding:8px;border-radius:6px;margin-bottom:8px;border:1px solid var(--border);overflow-x:auto;max-height:90px;white-space:pre;line-height:1.5}
.history-item .hi-actions{display:flex;gap:6px}
.history-item .hi-actions button{flex:1;padding:7px;border-radius:8px;font-size:.8rem;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.history-item .hi-actions .hi-recall{background:rgba(59,130,246,.1);border-color:var(--primary);color:var(--primary);font-weight:600}
.history-item .hi-actions .hi-delete{color:var(--red);border-color:#fecaca}
.qr-preview{margin:10px;padding:12px;background:var(--surface-2);border:1px dashed var(--border);border-radius:12px}
.qr-grid{display:flex;flex-wrap:wrap;gap:10px}
.qr-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;text-align:center;min-width:80px}
.qr-card .qr-ref{font-size:.75rem;font-weight:700;color:var(--text);font-family:monospace;margin-bottom:5px}
.qr-card img{width:60px;height:60px;display:block;margin:0 auto}
.table-title-display{text-align:center;font-weight:bold;text-transform:uppercase;font-size:1.3rem;padding:14px 10px;letter-spacing:1px;color:var(--text)}
.table-title-spacer{height:1em}
@media(max-width:480px){body{font-size:14px}.topbar button,.btn-add{width:34px;height:34px;font-size:.9rem}th,td{padding:5px 7px;font-size:.78rem}.row-num{width:32px;min-width:32px}.table-title-display{font-size:1.1rem}}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>

<body>
<div class="topbar">
  <button class="btn-add nodata" id="addBtn" title="Click: paste | Long-press: status">➕</button>

</div>

  </div>
</div>

      <button id="closeHistory">✕</button>

  </div>
</div>
<div class="toast" id="toast"></div>

function restore(s){S.headers=[...s.headers];S.rows=s.rows.map(r=>[...r]);S.includedRows=[...s.includedRows];S.includedCols=[...s.includedCols];S.colWidths=[...(s.colWidths||[])];S.rowHeights=[...(s.rowHeights||[])];S.rowColors=[...(s.rowColors||[])];S.colColors=[...(s.colColors||[])];S.cellColors=JSON.parse(JSON.stringify(s.cellColors||{}));S.headerRowIndex=s.headerRowIndex;S.headerColor=s.headerColor||'';S.headerOpacity=s.headerOpacity||100;S.qrCol=s.qrCol;S.qrSection=s.qrSection;S.lastQrRef=s.lastQrRef||1000;S.headerHidden=s.headerHidden||false;S.title=s.title||'';S.currentPage=1;render()}

function applyTheme(){document.body.classList.remove('night','theme-flat','theme-glass','theme-gradient');if(SETTINGS.dayNight==='night')document.body.classList.add('night');document.body.classList.add('theme-'+(SETTINGS.theme||'flat'));document.body.style.fontSize=(SETTINGS.screenFontSize||15)+'px'}

function setAddStatus(s){addBtn.classList.remove('online','saving','offline','nodata');if(s==='online'){addBtn.classList.add('online');addBtn.title='Connected'}else if(s==='saving'){addBtn.classList.add('saving');addBtn.title='Saving…'}else if(s==='offline'){addBtn.classList.add('offline');addBtn.title='Offline'}else{addBtn.classList.add('nodata');addBtn.title='Click to paste'}}

async function initFirebase(){try{onAuthStateChanged(auth,async u=>{if(u){currentUser=u;globalDocRef=doc(db,FIRESTORE_COLLECTION_NAME,GLOBAL_DOC);try{await ensureGlobalDoc();await loadSettings();await loadCurrent();await loadHistory()}catch(e){console.error(e)}setAddStatus('online')}else{try{await signInAnonymously(auth)}catch(e){console.error(e);setAddStatus('offline')}}})}catch(e){console.error(e)}}
async function ensureGlobalDoc(){const snap=await getDoc(globalDocRef);if(!snap.exists())await setDoc(globalDocRef,{createdAt:new Date().toISOString(),settings:SETTINGS,current:null,lastQrRef:1000})}
async function loadSettings(){try{const snap=await getDoc(globalDocRef);if(snap.exists()&&snap.data().settings){SETTINGS=Object.assign({},SETTINGS,snap.data().settings);SETTINGS.locks=Object.assign({},SETTINGS.locks,snap.data().settings.locks||{});applyTheme()}}catch(e){console.error(e)}}
async function saveSettings(){if(!globalDocRef)return;try{setAddStatus('saving');await updateDoc(globalDocRef,{settings:SETTINGS});setAddStatus('online')}catch(e){setAddStatus('offline')}}
async function loadCurrent(){try{const snap=await getDoc(globalDocRef);if(snap.exists()){const d=snap.data();S.lastQrRef=d.lastQrRef||1000;if(d.current&&d.current.json){const c=JSON.parse(d.current.json);S.headers=c.headers||[];S.rows=c.rows||[];S.includedRows=c.includedRows||[];S.includedCols=c.includedCols||[];S.colWidths=c.colWidths||[];S.rowHeights=c.rowHeights||[];S.rowColors=c.rowColors||[];S.colColors=c.colColors||[];S.cellColors=c.cellColors||{};S.headerRowIndex=c.headerRowIndex!==undefined?c.headerRowIndex:0;S.headerColor=c.headerColor||'';S.headerOpacity=c.headerOpacity!==undefined?c.headerOpacity:100;S.qrCol=c.qrCol||false;S.qrSection=c.qrSection||false;S.headerHidden=c.headerHidden||false;S.skipEmpty=c.skipEmpty||false;S.title=c.title||'';S.currentPage=1;render();autoQrSensor()}}}catch(e){console.error(e)}}
async function saveCurrentState(){if(!globalDocRef)return;try{setAddStatus('saving');await updateDoc(globalDocRef,{current:{json:JSON.stringify({headers:S.headers,rows:S.rows,includedRows:S.includedRows,includedCols:S.includedCols,colWidths:S.colWidths,rowHeights:S.rowHeights,rowColors:S.rowColors,colColors:S.colColors,cellColors:S.cellColors,headerRowIndex:S.headerRowIndex,headerColor:S.headerColor,headerOpacity:S.headerOpacity,qrCol:S.qrCol,qrSection:S.qrSection,headerHidden:S.headerHidden,skipEmpty:S.skipEmpty,title:S.title})},lastQrRef:S.lastQrRef,currentUpdatedAt:new Date().toISOString()});fbStatus.dirty=false;fbStatus.lastSave=new Date();setAddStatus('online')}catch(e){setAddStatus('offline')}}

async function saveHistoryRecord(){if(!globalDocRef||!S.headers.length)return;try{const recordsRef=collection(db,FIRESTORE_COLLECTION_NAME,GLOBAL_DOC,'records');const recId=fbStatus._lastHistId||'rec_'+Date.now();const recRef=doc(recordsRef,recId);await setDoc(recRef,{timestamp:new Date().toISOString(),json:JSON.stringify({headers:S.headers,rows:S.rows,includedRows:S.includedRows,includedCols:S.includedCols,headerRowIndex:S.headerRowIndex,lastQrRef:S.lastQrRef,title:S.title})});fbStatus._lastHistId=recId}catch(e){console.error(e)}}
async function loadHistory(){if(!globalDocRef)return;try{const recordsRef=collection(db,FIRESTORE_COLLECTION_NAME,GLOBAL_DOC,'records');const q=query(recordsRef,orderBy('timestamp','desc'),limit(50));const snap=await getDocs(q);historyRecords=[];snap.forEach(d=>{try{const p=JSON.parse(d.data().json);historyRecords.push(Object.assign({id:d.id,timestamp:d.data().timestamp},p))}catch(e){}})}catch(e){console.error(e)}}
async function deleteHistoryRecord(id){try{await deleteDoc(doc(db,FIRESTORE_COLLECTION_NAME,GLOBAL_DOC,'records',id));historyRecords=historyRecords.filter(r=>r.id!==id)}catch(e){console.error(e)}}
async function deleteAllHistoryRecords(){if(!globalDocRef)return;try{const recordsRef=collection(db,FIRESTORE_COLLECTION_NAME,GLOBAL_DOC,'records');const snap=await getDocs(recordsRef);const batch=writeBatch(db);snap.forEach(d=>batch.delete(d.ref));await batch.commit();historyRecords=[];fbStatus._lastHistId=null}catch(e){console.error(e)}}

function markDirty(){fbStatus.dirty=true;setAddStatus('saving');clearTimeout(fbStatus.savingTimer);fbStatus.savingTimer=setTimeout(()=>{if(fbStatus.online&&currentUser)saveCurrentState()},1000)}
function saveHistoryNow(){if(!currentUser||!S.headers.length)return;clearTimeout(fbStatus._histTimer);fbStatus._histTimer=setTimeout(()=>{saveHistoryRecord().then(()=>loadHistory())},3000)}

function parseText(text){const lines=text.split(/\r?\n/).filter(l=>l.trim()!=='');if(!lines.length)return null;let d='\t';const f=lines[0];if(f.indexOf('\t')===-1){if(f.indexOf(',')>-1)d=',';else if(f.indexOf(';')>-1)d=';';else if(f.indexOf('|')>-1)d='|'}function split(line){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===d&&!q){out.push(cur.trim());cur=''}else cur+=c}out.push(cur.trim());return out}const m=lines.map(split);const max=Math.max.apply(null,m.map(r=>r.length));return m.map(r=>{while(r.length<max)r.push('');return r})}

function autoQrSensor(){let hasUrl=false;S.rows.forEach((row,gi)=>{if(!S.includedRows[gi])return;S.headers.forEach((_,ci)=>{if(!S.includedCols[ci])return;const v=(row[ci]||'').trim();if(isUrl(v))hasUrl=true})});if(hasUrl){S.qrCol=true;S.qrSection=true}else{S.qrCol=false;S.qrSection=false}}

function loadMatrix(m){if(!m||!m.length)return;const colCount=m[0].length;
  S.headers=m[0].map(v=>v||'');
  S.rows=m.slice(1).map(r=>{while(r.length<colCount)r.push('');return[...r]});
  S.includedRows=new Array(S.rows.length).fill(true);S.includedCols=new Array(colCount).fill(true);S.colWidths=new Array(colCount).fill(null);S.rowHeights=new Array(S.rows.length).fill(null);S.rowColors=new Array(S.rows.length).fill('');S.colColors=new Array(colCount).fill('');S.cellColors={};S.headerRowIndex=0;S.currentPage=1;S.headerHidden=false;autoQrSensor();render();markDirty();fbStatus._lastHistId=null;saveHistoryNow()}

function applyZoom(){mainTable.style.transform='scale('+(S.zoom/100)+')';mainTable.style.transformOrigin='top left'}

function render(){
  if(!S.headers.length){tableScroll.style.display='none';emptyMsg.style.display='block';pagination.style.display='none';qrPreview.style.display='none';return}
  tableScroll.style.display='block';emptyMsg.style.display='none';
  if(S.title){tableTitle.textContent=S.title;tableTitle.style.display='block';titleSpacer.style.display='block'}else{tableTitle.style.display='none';titleSpacer.style.display='none'}
  const visIdx=[];
  S.rows.forEach((row,ri)=>{if(S.skipEmpty&&row.every(c=>!String(c||'').trim()))return;visIdx.push(ri)});
  const totalVis=visIdx.length;
  const start=(S.currentPage-1)*S.rowsPerPage;
  const end=Math.min(start+S.rowsPerPage,totalVis);
  const pageIdx=visIdx.slice(start,end);
  const hBg=S.headerColor?hexToRgba(S.headerColor,S.headerOpacity):'';
  const hStyle=hBg?('background:'+hBg+';color:'+contrastText(S.headerColor)+';'):'';
  let h='<tr>';
  if(S.showRowNumbers){h+='<th class="row-num" style="'+hStyle+'" data-row-zero="1" title="Long-press for options">#</th>'}
  S.headers.forEach((label,ci)=>{
    const w=S.colWidths[ci];
    const wStyle=w?('width:'+w+'px;min-width:'+w+'px;max-width:'+w+'px;'):'';
    const bg=S.colColors[ci];
    const cStyle=bg?('background:'+bg+';color:'+contrastText(bg)+';'):hStyle;
    h+='<th style="'+wStyle+cStyle+'" data-col-th="'+ci+'"><div class="col-head"><span class="h-label" data-col-head="'+ci+'">'+esc(label||'')+'</span></div></th>';
  });
  if(S.qrCol)h+='<th style="min-width:80px;'+hStyle+'" data-qr-head="1">QR</th>';
  h+='</tr>';
  tableHead.innerHTML=h;
  let b='';
  pageIdx.forEach(gi=>{
    const row=S.rows[gi],inc=S.includedRows[gi];
    const hgt=S.rowHeights[gi],hStyle2=hgt?('height:'+hgt+'px;'):'';
    const rbg=S.rowColors[gi];
    const rStyle=rbg?('background:'+rbg+';color:'+contrastText(rbg)+';'):'';
    b+='<tr class="'+(inc?'':'excluded')+'" data-row="'+gi+'" style="'+hStyle2+rStyle+'">';
    if(S.showRowNumbers){b+='<td class="row-num" data-row-menu="'+gi+'" style="'+rStyle+'">'+(gi+1)+'</td>'}
    S.headers.forEach((_,ci)=>{
      const v=row[ci]!==undefined?row[ci]:'',colInc=S.includedCols[ci],w=S.colWidths[ci];
      const wStyle=w?('width:'+w+'px;min-width:'+w+'px;max-width:'+w+'px;'):'';
      const key=gi+'_'+ci;
      const cbg=S.cellColors[key];
      const cStyle=cbg?('background:'+cbg+';color:'+contrastText(cbg)+';'):(rbg?rStyle:(S.colColors[ci]?('background:'+S.colColors[ci]+';color:'+contrastText(S.colColors[ci])+';'):''));
      b+='<td contenteditable="true" data-r="'+gi+'" data-c="'+ci+'" style="'+(colInc?'':'opacity:0.5;')+wStyle+cStyle+'">'+renderCell(v)+'</td>';
    });
    if(S.qrCol){const refs=getRowQrRefs(gi);b+='<td style="text-align:center;font-family:monospace;font-size:0.72rem;'+rStyle+'">'+(refs.length?refs.map(r=>r.ref).join(', '):'-')+'</td>'}
    b+='</tr>';
  });
  if(!pageIdx.length)b='<tr><td colspan="'+(S.headers.length+(S.showRowNumbers?1:0)+(S.qrCol?1:0))+'" style="text-align:center;color:#94a3b8;padding:20px">No rows</td></tr>';
  tableBody.innerHTML=b;
  const pages=Math.max(1,Math.ceil(totalVis/S.rowsPerPage));if(S.currentPage>pages)S.currentPage=pages;
  pageInfo.textContent=S.currentPage+' / '+pages;
  $('prevPage').disabled=S.currentPage<=1;$('nextPage').disabled=S.currentPage>=pages;
  pagination.style.display=totalVis>0?'flex':'none';
  applyZoom();renderQrPreview();
}

function getRowQrRefs(gi){const row=S.rows[gi];if(!row)return[];const items=[];S.headers.forEach((_,ci)=>{if(!S.includedCols[ci])return;const v=(row[ci]||'').trim();if(isUrl(v))items.push({url:v,ci:ci})});if(!items.length)return[];let counter=1000;const out=[];S.rows.forEach((r,ri)=>{if(!S.includedRows[ri])return;S.headers.forEach((_,ci)=>{if(!S.includedCols[ci])return;const v=(r[ci]||'').trim();if(isUrl(v)){counter++;if(ri===gi)out.push({ref:String(counter),url:v})}})});return out}

function getAllQrEntries(){let counter=1000;const entries=[];S.rows.forEach((row,gi)=>{if(!S.includedRows[gi])return;S.headers.forEach((_,ci)=>{if(!S.includedCols[ci])return;const v=(row[ci]||'').trim();if(isUrl(v)){counter++;entries.push({ref:String(counter),url:v,rowIndex:gi})}})});return entries}

function renderQrPreview(){if(!S.qrSection){qrPreview.style.display='none';return}qrPreview.style.display='block';const entries=getAllQrEntries();if(!entries.length){qrGrid.innerHTML='<div style="color:#94a3b8;font-size:0.8rem">No QR codes</div>';return}qrGrid.innerHTML=entries.map(e=>'<div class="qr-card"><div class="qr-ref">'+e.ref+'</div><img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data='+encodeURIComponent(e.url)+'" alt="QR '+e.ref+'" loading="lazy"></div>').join('')}

function closeMenus(){rowMenu.classList.remove('open');colMenu.classList.remove('open');moreMenu.classList.remove('open');cellMenu.classList.remove('open')}
document.addEventListener('click',e=>{if(!e.target.closest('.menu')&&!e.target.closest('[data-row-menu]')&&!e.target.closest('[data-row-zero]')&&!e.target.closest('[data-col-head]')&&!e.target.closest('[data-col-th]')&&!e.target.closest('[data-qr-head]')&&!e.target.closest('[data-r]')&&!e.target.closest('#moreBtn')&&!e.target.closest('#tableTitle'))closeMenus()});
function openMenu(menu,x,y,items,ctx){closeMenus();menu.innerHTML=items.map(it=>it.sep?'<div class="menu-sep"></div>':(it.html?it.html:'<button class="menu-item '+(it.danger?'danger':'')+'" data-act="'+it.act+'"><span class="mi-icon">'+(it.icon||'')+'</span><span class="mi-label">'+it.label+'</span>'+(it.value?'<span class="mi-value">'+it.value+'</span>':'')+'</button>')).join('');menu.classList.add('open');menu._ctx=ctx;requestAnimationFrame(()=>{const w=menu.offsetWidth,h=menu.offsetHeight,vw=window.innerWidth,vh=window.innerHeight;let left=Math.min(x,vw-w-10),top=Math.min(y,vh-h-10);if(left<10)left=10;if(top<10)top=10;menu.style.left=left+'px';menu.style.top=top+'px'})}

function colorSwatchesHtml(key,type,idx){let html='<div class="color-grid" data-ctarget="'+type+'" data-cidx="'+idx+'" data-ckey="'+key+'">';COLORS.forEach(c=>{const active=(type==='cell'?S.cellColors[key]:type==='row'?S.rowColors[idx]:type==='header'?S.headerColor:S.colColors[idx])===c?' active':'';html+='<div class="color-swatch'+active+'" data-color="'+c+'" style="background:'+c+'"></div>'});html+='<div class="color-swatch none" data-color=""></div></div>';return html}
function opacitySliderHtml(type,idx){const val=type==='header'?S.headerOpacity:100;return '<div class="opacity-ctrl"><span class="oc-label">Opacity: '+val+'%</span><input type="range" min="5" max="100" value="'+val+'" data-optype="'+type+'" data-opidx="'+idx+'" oninput="window._opChange&&window._opChange(this)"></div>'}

function showRowZeroMenu(x,y){openMenu(rowMenu,x,y,[{html:colorSwatchesHtml('','header',0)},{html:opacitySliderHtml('header',0)},{sep:1},{act:'toggleRowNums',icon:S.showRowNumbers?'☑️':'🔲',label:'Show row numbers '+(S.showRowNumbers?'ON':'OFF')},{sep:1},{act:'editTitle',icon:'✏️',label:'Edit table title'},{sep:1},{act:'toggleHeader',icon:S.headerHidden?'👁':'🙈',label:S.headerHidden?'Show header row':'Hide header row'}],{})}

function showRowMenu(gi,x,y){const inc=S.includedRows[gi];openMenu(rowMenu,x,y,[{act:'insAbove',icon:'➕',label:'Insert row above'},{act:'insBelow',icon:'➕',label:'Insert row below'},{sep:1},{act:'moveTop',icon:'⏫',label:'Move to top'},{act:'moveUp',icon:'⬆️',label:'Move up'},{act:'moveDown',icon:'⬇️',label:'Move down'},{act:'moveEnd',icon:'⏬',label:'Move to bottom'},{sep:1},{html:colorSwatchesHtml('', 'row', gi)},{sep:1},{act:'toggleRow',icon:inc?'🚫':'👁',label:inc?'Exclude row':'Include row'},{act:'delRow',icon:'🗑️',label:'Delete row',danger:1}],{gi:gi})}

rowMenu.addEventListener('click',e=>{
  const sw=e.target.closest('.color-swatch');
  if(sw){const grid=sw.closest('.color-grid');if(grid){const type=grid.dataset.ctarget,idx=parseInt(grid.dataset.cidx),col=sw.dataset.color;pushUndo();if(type==='row')S.rowColors[idx]=col;else if(type==='header')S.headerColor=col;else if(type==='col')S.colColors[idx]=col;render();markDirty();closeMenus()}
    return}
  const btn=e.target.closest('[data-act]');if(!btn)return;const act=btn.dataset.act,ctx=rowMenu._ctx;closeMenus();
  if(act==='toggleHeader'){S.headerHidden=!S.headerHidden;render();markDirty();toast(S.headerHidden?'Header hidden':'Header shown');return}
  if(act==='toggleRowNums'){S.showRowNumbers=!S.showRowNumbers;render();markDirty();toast('Row numbers '+(S.showRowNumbers?'ON':'OFF'));return}
  if(act==='editTitle'){openTextModal('Table Title (ALL CAPS display)',S.title,val=>{pushUndo();S.title=val||'';render();markDirty();saveHistoryNow()});return}
  if(!ctx||ctx.gi===undefined)return;const gi=ctx.gi;pushUndo();
  if(act==='insAbove')insertRow(gi,true);
  else if(act==='insBelow')insertRow(gi,false);
  else if(act==='moveTop')moveRowTo(gi,0);
  else if(act==='moveEnd')moveRowTo(gi,S.rows.length-1);
  else if(act==='moveUp'&&gi>0)swapRows(gi,gi-1);
  else if(act==='moveDown'&&gi<S.rows.length-1)swapRows(gi,gi+1);
  else if(act==='toggleRow')S.includedRows[gi]=!S.includedRows[gi];
  else if(act==='delRow'){if(S.rows.length<=1){toast('Last row cannot be deleted');undoStack.pop();return}S.rows.splice(gi,1);S.includedRows.splice(gi,1);S.rowHeights.splice(gi,1);S.rowColors.splice(gi,1)}
  autoQrSensor();render();markDirty();if(['insAbove','insBelow','delRow','moveUp','moveDown','moveTop','moveEnd'].indexOf(act)>-1)saveHistoryNow()
});

window._opChange=function(el){const type=el.dataset.optype;if(type==='header'){S.headerOpacity=parseInt(el.value);render();markDirty()}else if(type==='col'){const idx=parseInt(el.dataset.opidx);/*col opacity not tracked*/}else if(type==='row'){const idx=parseInt(el.dataset.opidx);}/*update label*/const lab=el.previousElementSibling;if(lab)lab.textContent='Opacity: '+el.value+'%'};

function swapRows(a,b){const t=S.rows[a];S.rows[a]=S.rows[b];S.rows[b]=t;const ti=S.includedRows[a];S.includedRows[a]=S.includedRows[b];S.includedRows[b]=ti;const th=S.rowHeights[a];S.rowHeights[a]=S.rowHeights[b];S.rowHeights[b]=th;const tc=S.rowColors[a];S.rowColors[a]=S.rowColors[b];S.rowColors[b]=tc}
function moveRowTo(from,to){if(from===to)return;const r=S.rows.splice(from,1)[0];const i=S.includedRows.splice(from,1)[0];const h=S.rowHeights.splice(from,1)[0];const c=S.rowColors.splice(from,1)[0];S.rows.splice(to,0,r);S.includedRows.splice(to,0,i);S.rowHeights.splice(to,0,h);S.rowColors.splice(to,0,c)}

tableHead.addEventListener('click',e=>{const zero=e.target.closest('[data-row-zero]'),lbl=e.target.closest('[data-col-head]'),qrHead=e.target.closest('[data-qr-head]'),colTh=e.target.closest('[data-col-th]');if(zero){e.stopPropagation();if(S.headerHidden){S.headerHidden=false;render();markDirty();toast('Header shown')}}else if(lbl||colTh){e.stopPropagation();const ci=parseInt((lbl||colTh).dataset.colHead||(lbl||colTh).dataset.colTh);showColMenu(ci,e.clientX,e.clientY)}else if(qrHead){e.stopPropagation();showQrColMenu(e.clientX,e.clientY)}});

tableTitle.addEventListener('click',()=>{openTextModal('Table Title (ALL CAPS display)',S.title,val=>{pushUndo();S.title=val||'';render();markDirty()})});

function showQrColMenu(x,y){openMenu(colMenu,x,y,[{act:'qrInfo',icon:'ℹ️',label:'QR Reference column'},{sep:1},{act:'toggleQrCol',icon:S.qrCol?'🚫':'👁',label:S.qrCol?'Hide QR column':'Show QR column'}],{qr:true})}

function showColMenu(ci,x,y){const inc=S.includedCols[ci];const w=S.colWidths[ci]||100;const widthHtml='<div class="width-ctrl"><span class="wc-label">↔️ Width</span><span class="wc-value" id="wcVal_'+ci+'">'+w+'px</span><button data-wdec="'+ci+'">−</button><button data-winc="'+ci+'">+</button></div>';const stepHtml='<div class="step-selector" data-stepsel="'+ci+'">'+[5,10,15,20].map(n=>'<label><input type="radio" name="ws_'+ci+'" value="'+n+'" '+(S.stepSize===n?'checked':'')+'><span>'+n+'px</span></label>').join('')+'</div>';openMenu(colMenu,x,y,[{act:'editHeader',icon:'✏️',label:'Edit header name'},{sep:1},{html:widthHtml},{html:stepHtml},{sep:1},{act:'insLeft',icon:'➕',label:'Insert column left'},{act:'insRight',icon:'➕',label:'Insert column right'},{sep:1},{act:'colMoveStart',icon:'⏪',label:'Move to start'},{act:'colMoveLeft',icon:'⬅️',label:'Move left'},{act:'colMoveRight',icon:'➡️',label:'Move right'},{act:'colMoveEnd',icon:'⏩',label:'Move to end'},{sep:1},{html:colorSwatchesHtml('', 'col', ci)},{sep:1},{act:'toggleCol',icon:inc?'🚫':'👁',label:inc?'Exclude column':'Include column'},{act:'delCol',icon:'🗑️',label:'Delete column',danger:1}],{ci:ci})}

colMenu.addEventListener('click',e=>{const sw=e.target.closest('.color-swatch');if(sw){const grid=sw.closest('.color-grid');if(grid){const type=grid.dataset.ctarget,idx=parseInt(grid.dataset.cidx),col=sw.dataset.color;pushUndo();if(type==='col')S.colColors[idx]=col;render();markDirty();closeMenus()}return}const t=e.target;if(t.dataset.wdec!==undefined){const ci=parseInt(t.dataset.wdec);const cur=S.colWidths[ci]||100;S.colWidths[ci]=Math.max(40,cur-S.stepSize);const el=$('wcVal_'+ci);if(el)el.textContent=S.colWidths[ci]+'px';render();markDirty();return}if(t.dataset.winc!==undefined){const ci=parseInt(t.dataset.winc);const cur=S.colWidths[ci]||100;S.colWidths[ci]=Math.min(600,cur+S.stepSize);const el=$('wcVal_'+ci);if(el)el.textContent=S.colWidths[ci]+'px';render();markDirty();return}if(t.type==='radio'&&t.name.indexOf('ws_')===0){S.stepSize=parseInt(t.value);SETTINGS.stepSize=S.stepSize;saveSettings();return}const btn=t.closest('[data-act]');if(!btn)return;const act=btn.dataset.act,ctx=colMenu._ctx;closeMenus();if(ctx&&ctx.qr){if(act==='toggleQrCol'){S.qrCol=!S.qrCol;render();markDirty()}return}const ci=ctx.ci;if(act==='editHeader'){editHeaderPrompt(ci);return}pushUndo();
  if(act==='insLeft')insertCol(ci);

async function doExport(fmt){
  if(fmt==='print'){await doPrint();return}
  if(fmt==='html'){doHtmlExport();return}
  const data=getIncludedData();
  const headers=data.headers,rows=data.rows;
  if(fmt==='csv'||fmt==='txt'){
    const delim=fmt==='csv'?',':'\t';
    let content='';
    if(S.title)content+=S.title.toUpperCase()+'\n';
    content+=headers.map(h=>fmt==='csv'?'"'+h.replace(/"/g,'""')+'"':h).join(delim)+'\n';
    rows.forEach(r=>{content+=r.map(v=>fmt==='csv'?'"'+String(v).replace(/"/g,'""')+'"':v).join(delim)+'\n'});
    downloadBlob(content,'table.'+fmt,'text/plain;charset=utf-8');
    toast('.'+fmt+' downloaded');
  }
  else if(fmt==='xlsx'){
    await loadScript('https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js');
    let allRows=[];
    let startRow=1;
    if(S.title){allRows.push([S.title.toUpperCase()]);allRows.push(['']);startRow=3}
    allRows.push(headers);
    rows.forEach(r=>allRows.push(r));
    const ws=XLSX.utils.aoa_to_sheet(allRows);
    rows.forEach((r,ri)=>{r.forEach((v,ci)=>{const cellAddr=XLSX.utils.encode_cell({r:ri+startRow,c:ci});if(isUrl(v)){if(!ws[cellAddr])ws[cellAddr]={v:String(v),t:'s'};const uu=String(v).trim();ws[cellAddr].l={Target:/^https?:\/\//i.test(uu)?uu:'https://'+uu,Tooltip:'Open link'}}})});
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Sheet1');
    XLSX.writeFile(wb,'table.xlsx');
    toast('.xlsx downloaded');
  }
  else if(fmt==='docx'){
    await loadScript('https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js');
    const D=window.docx;
    const border={style:D.BorderStyle.SINGLE,size:6,color:'000000'};
    const tableRows=[new D.TableRow({children:headers.map(h=>new D.TableCell({children:[new D.Paragraph({children:[new D.TextRun({text:h,bold:true})]})],borders:{top:border,bottom:border,left:border,right:border}}))})];
    rows.forEach(r=>{
      const cells=r.map(v=>{
        const s=String(v||'');
        let kids;
        if(isUrl(s)){
          const uu=s.trim();
          kids=[new D.ExternalHyperlink({children:[new D.TextRun({text:s,style:'Hyperlink',color:'2563EB'})],link:/^https?:\/\//i.test(uu)?uu:'https://'+uu})];
        }else{
          kids=[new D.TextRun(s)];
        }
        return new D.TableCell({children:[new D.Paragraph({children:kids})],borders:{top:border,bottom:border,left:border,right:border}});
      });
      tableRows.push(new D.TableRow({children:cells}));
    });
    const children=[];
    if(S.title){children.push(new D.Paragraph({children:[new D.TextRun({text:S.title.toUpperCase(),bold:true,size:32})],alignment:'center'}));children.push(new D.Paragraph(''))}
    children.push(new D.Table({rows:tableRows,width:{size:100,type:D.WidthType.PERCENTAGE}}));
    const doc=new D.Document({sections:[{children:children}]});
    const blob=await D.Packer.toBlob(doc);
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='table.docx';a.click();URL.revokeObjectURL(url);
    toast('.docx downloaded');
  }
  else if(fmt==='pdf'){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    await exportPdfWithQR();
  }
  else if(fmt==='jpg'){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await exportJpg();
  }
}

async function fetchQrDataUrl(url,sizePx){
  try{
    const res=await fetch('https://api.qrserver.com/v1/create-qr-code/?size='+Math.round(sizePx)+'x'+Math.round(sizePx)+'&data='+encodeURIComponent(url));
    const blob=await res.blob();
    return await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onloadend=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob)});
  }catch(e){return ''}
}

async function exportPdfWithQR(){
  toast('Generating PDF… please wait');
  const data=getIncludedData();const headers=data.headers,rows=data.rows,incRows=data.incRows,incCols=data.incCols;
  const _or=window._orPref||'portrait';
  const isLandscape=_or==='landscape'?true:(_or==='portrait'?false:headers.length>6);
  const pageOrientation=isLandscape?'landscape':'portrait';
  const jsPDFctor=window.jspdf.jsPDF;
  const pdf=new jsPDFctor({orientation:pageOrientation,unit:'mm',format:'a4'});
  const pageW=pdf.internal.pageSize.getWidth();
  const pageH=pdf.internal.pageSize.getHeight();
  const margin=10;
  const usableW=pageW-margin*2;
  const fs=SETTINGS.exportFontSize;
  const ptToMm=0.352778;
  const lineH=fs*ptToMm*1.6;
  const cellPad=1.5;
  const colCount=headers.length+(exportQrOn&&(S.qrSection||S.qrCol)?1:0);
  const colW=usableW/colCount;
  const maxChars=Math.max(4,Math.floor((colW-cellPad*2)/(fs*ptToMm*0.5)));
  function wrap(text,max){const s=String(text||'');const out=[];for(let i=0;i<s.length;i+=max)out.push(s.substring(i,i+max));return out.length?out:['']}
  const rowHeights=rows.map(r=>{let maxLines=1;r.forEach(v=>{const lines=wrap(v,maxChars);if(lines.length>maxLines)maxLines=lines.length});return maxLines*lineH+cellPad*2});
  const headerLines=headers.map(h=>wrap(h,maxChars));
  const headerMaxLines=Math.max(1,...headerLines.map(l=>l.length));
  const headerH=headerMaxLines*lineH+cellPad*2;
  let y=margin;
  if(S.title){pdf.setFontSize(fs+4);pdf.setFont(undefined,'bold');pdf.text(S.title.toUpperCase(),pageW/2,y+6,{align:'center'});y+=16;pdf.setFont(undefined,'normal');pdf.setFontSize(fs)}
  function drawHeader(){
    let x=margin;
    pdf.setFontSize(fs);pdf.setFont(undefined,'bold');
    pdf.setFillColor(240,240,240);
    pdf.rect(margin,y,usableW,headerH,'F');
    pdf.setDrawColor(0,0,0);pdf.setLineWidth(0.2);
    headers.forEach((h,ci)=>{
      pdf.rect(x,y,colW,headerH);
      headerLines[ci].forEach((ln,li)=>{pdf.text(ln,x+cellPad,y+cellPad+(li+1)*lineH-1)});
      x+=colW;
    });
    if(exportQrOn&&(S.qrSection||S.qrCol)){pdf.rect(x,y,colW,headerH);pdf.text('QR',x+cellPad,y+cellPad+lineH-1);x+=colW}
    y+=headerH;
    pdf.setFont(undefined,'normal');
  }
  drawHeader();
  let counter=1000;
  const allRefs=[];
  incRows.forEach(ri=>{S.headers.forEach((_,ci)=>{if(!S.includedCols[ci])return;const v=(S.rows[ri][ci]||'').trim();if(isUrl(v)){counter++;allRefs.push({ref:String(counter),url:v,rowIndex:ri})}})});
  rows.forEach((r,idx)=>{
    const rh=rowHeights[idx];
    if(y+rh>pageH-margin){pdf.addPage();y=margin;drawHeader()}
    let x=margin;
    const realRi=incRows[idx];
    const refs=allRefs.filter(rr=>rr.rowIndex===realRi).map(rr=>rr.ref);
    r.forEach((v,ci)=>{
      pdf.rect(x,y,colW,rh);
      const lines=wrap(v,maxChars);
      const s=String(v||'').trim();
      lines.forEach((ln,li)=>{
        if(isUrl(s)){
          const uu=s.trim();const hh=/^https?:\/\//i.test(uu)?uu:'https://'+uu;
          pdf.setTextColor(37,99,235);
          pdf.textWithLink(ln,x+cellPad,y+cellPad+(li+1)*lineH-1,{url:hh});
          pdf.setTextColor(0,0,0);
        }else{
          pdf.text(ln,x+cellPad,y+cellPad+(li+1)*lineH-1);
        }
      });
      x+=colW;
    });
    if(exportQrOn&&(S.qrSection||S.qrCol)){pdf.rect(x,y,colW,rh);const txt=refs.length?refs.join(', '):'-';pdf.setFontSize(fs*0.85);pdf.text(txt,x+cellPad,y+cellPad+lineH-1);pdf.setFontSize(fs)}
    y+=rh;
  });
  if(exportQrOn&&(S.qrSection||S.qrCol)&&allRefs.length){
    pdf.addPage();
    y=margin;
    pdf.setFontSize(fs+2);pdf.setFont(undefined,'bold');
    pdf.text('QR Codes',margin,y+5);
    y+=10;
    pdf.setFont(undefined,'normal');pdf.setFontSize(fs);
    const qrSizeIn=SETTINGS.qrPrintSize;
    const qrSizeMm=qrSizeIn*25.4;
    const boxPad=2;
    const boxW=qrSizeMm+boxPad*2;
    const boxH=qrSizeMm+boxPad*2+6;
    const gap=3;
    const cols=Math.max(1,Math.floor((usableW+gap)/(boxW+gap)));
    let col=0;
    const dataUrls=await Promise.all(allRefs.map(async e=>({ref:e.ref,dataURL:await fetchQrDataUrl(e.url,qrSizeIn*96)})));
    for(const e of dataUrls){
      if(col>=cols){col=0;y+=boxH+gap}
      if(y+boxH>pageH-margin){pdf.addPage();y=margin;col=0}
      const x=margin+col*(boxW+gap);
      pdf.setDrawColor(0,0,0);pdf.setLineWidth(0.3);
      pdf.rect(x,y,boxW,boxH);
      pdf.setFontSize(fs*0.85);pdf.setFont(undefined,'bold');
      pdf.text(e.ref,x+boxW/2,y+4,{align:'center'});
      pdf.setFont(undefined,'normal');
      pdf.setLineWidth(0.1);
      pdf.line(x+2,y+5.5,x+boxW-2,y+5.5);
      if(e.dataURL){try{pdf.addImage(e.dataURL,'PNG',x+boxPad,y+7,qrSizeMm,qrSizeMm)}catch(err){}}
      col++;
    }
  }
  pdf.save('table.pdf');
  toast('.pdf downloaded');
}

function downloadBlob(content,filename,type){const blob=new Blob([content],{type:type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}

function openConfirmModal(title,message,buttons,onChoice){modalBox.innerHTML='';const h3=document.createElement('h3');h3.textContent=title;modalBox.appendChild(h3);const p=document.createElement('p');p.textContent=message;p.style.cssText='color:#475569;font-size:0.88rem;margin-bottom:14px';modalBox.appendChild(p);const actions=document.createElement('div');actions.className='modal-actions';actions.style.flexDirection='column';buttons.forEach(b=>{const btn=document.createElement('button');btn.textContent=b.label;btn.style.background=b.color;btn.style.color='#fff';btn.style.marginBottom='6px';btn.onclick=()=>{closeModal();onChoice(b.action)};actions.appendChild(btn)});modalBox.appendChild(actions);modalBg.classList.add('open')}

function renderHistoryList(){if(!historyRecords.length){historyList.innerHTML='<div style="text-align:center;color:#94a3b8;padding:40px 20px;font-style:italic">No saved records yet</div>';return}historyList.innerHTML=historyRecords.map((rec,idx)=>{const dateStr=new Date(rec.timestamp).toLocaleString();const headers=(rec.headers||[]).slice(0,4).map(h=>h||'Col');let preview=(rec.title?rec.title.toUpperCase()+'\n':'')+headers.join(' | ')+'\n'+'─'.repeat(28)+'\n';(rec.rows||[]).slice(0,3).forEach(r=>{preview+=r.slice(0,4).map(v=>(v||'').substring(0,12)).join(' | ')+'\n'});if((rec.rows||[]).length>3)preview+='...';return'<div class="history-item" data-idx="'+idx+'"><div class="hi-date">'+dateStr+'</div><div class="hi-meta">'+(rec.rows||[]).length+' rows · '+(rec.headers||[]).length+' cols</div><div class="hi-preview">'+esc(preview)+'</div><div class="hi-actions"><button class="hi-recall" data-recall="'+idx+'">📂 Recall</button><button class="hi-delete" data-delete="'+idx+'">🗑️ Delete</button></div></div>'}).join('')}

historyList.addEventListener('click',async e=>{const recall=e.target.closest('[data-recall]'),del=e.target.closest('[data-delete]');if(recall){const rec=historyRecords[parseInt(recall.dataset.recall)];if(!rec)return;pushUndo();S.headers=[...(rec.headers||[])];S.rows=(rec.rows||[]).map(r=>[...r]);S.includedRows=[...(rec.includedRows||[])];S.includedCols=[...(rec.includedCols||[])];S.colWidths=new Array(S.headers.length).fill(null);S.rowHeights=new Array(S.rows.length).fill(null);S.rowColors=new Array(S.rows.length).fill('');S.colColors=new Array(S.headers.length).fill('');S.cellColors={};S.headerRowIndex=rec.headerRowIndex!==undefined?rec.headerRowIndex:0;S.title=rec.title||'';S.currentPage=1;autoQrSensor();render();markDirty();historyPanel.classList.remove('open');toast('Recalled')}if(del){const rec=historyRecords[parseInt(del.dataset.delete)];if(!rec)return;if(!confirm('Delete this record?'))return;await deleteHistoryRecord(rec.id);renderHistoryList();toast('Deleted')}});

document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.shiftKey){e.preventDefault();doUndo()}if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.key==='z'&&e.shiftKey))){e.preventDefault();doRedo()}if(e.key==='Escape')closeMenus()});
