<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0">
<title>Table Converter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f1f5f9;--sur:#fff;--sur2:#f8fafc;--bd:#e2e8f0;--tx:#0f172a;--tx2:#475569;--tx3:#64748b;--pr:#3b82f6;--gr:#22c55e;--grh:#16a34a;--rd:#ef4444;--yl:#eab308;--sh:0 1px 3px rgba(0,0,0,.03);--lk:#2563eb;--sel:#3b82f6}
body.night{--bg:#0f172a;--sur:#1e293b;--sur2:#334155;--bd:#475569;--tx:#f8fafc;--tx2:#e2e8f0;--tx3:#94a3b8;--pr:#60a5fa;--sh:0 1px 3px rgba(0,0,0,.5);--lk:#93c5fd}
body.theme-glass{--sur:rgba(255,255,255,.55);--sur2:rgba(248,250,252,.4);--bd:rgba(203,213,225,.5);background:linear-gradient(135deg,#e0e7ff,#f0f9ff 50%,#fce7f3)}
body.theme-glass .topbar,body.theme-glass .tw,body.theme-glass .menu,body.theme-glass .mbg,body.theme-glass .hi,body.theme-glass .qp{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 8px 32px rgba(31,38,135,.12);border:1px solid rgba(255,255,255,.6)}
body.night.theme-glass{--sur:rgba(30,41,59,.6);--sur2:rgba(51,65,85,.4);--bd:rgba(71,85,105,.5);background:linear-gradient(135deg,#1e1b4b,#0f172a 50%,#172554)}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;min-height:100vh;transition:background .3s,color .3s;overflow-x:hidden}
body.locked{overflow:hidden}
.topbar{position:sticky;top:0;z-index:100;background:var(--sur);border-bottom:1px solid var(--bd);padding:8px 10px;display:flex;align-items:center;justify-content:center;gap:6px;overflow-x:auto;box-shadow:var(--sh);flex-wrap:nowrap}
.topbar button{width:38px;height:38px;background:var(--sur2);border:1px solid var(--bd);border-radius:10px;font-size:1rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--tx);padding:0;transition:.1s}
.topbar button:hover{background:var(--bd)}
.topbar button:active{transform:scale(.93)}
.topbar button:disabled{opacity:.35;cursor:not-allowed}
.btn-add{position:relative;width:54px;height:42px;border-radius:10px;cursor:pointer;border:1px solid;transition:.2s;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;gap:0;padding:3px;overflow:hidden}
.btn-add .plus{font-size:1.05rem;font-weight:700;line-height:1}
.btn-add .add-time{font-size:.6rem;font-weight:700;line-height:1;white-space:nowrap;letter-spacing:.2px}
.btn-add.nodata{background:#e2e8f0;border-color:#cbd5e1;color:#64748b}
.btn-add.online{background:var(--gr);border-color:var(--grh);color:#fff;animation:pG 2s infinite}
.btn-add.saving{background:var(--yl);border-color:#ca8a04;color:#fff;animation:pY .6s infinite}
.btn-add.offline{background:var(--rd);border-color:#dc2626;color:#fff}
@keyframes pG{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.7)}50%{box-shadow:0 0 0 8px rgba(34,197,94,0)}}
@keyframes pY{0%,100%{box-shadow:0 0 0 0 rgba(234,179,8,.7)}50%{box-shadow:0 0 0 6px rgba(234,179,8,0)}}
.tw{margin:10px;background:var(--sur);border-radius:14px;border:1px solid var(--bd);overflow:hidden}
.ts{overflow:auto;max-height:60vh;-webkit-overflow-scrolling:touch;width:100%;touch-action:pan-x pan-y}
table{border-collapse:separate;border-spacing:0;width:auto;font-size:.85rem;table-layout:fixed}
th,td{border:1px solid var(--bd);padding:7px 9px;vertical-align:top;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none;-webkit-user-select:none}
th:not(:first-child),td:not(:first-child){border-left:none}
tr+tr th,tr+tr td{border-top:none}
td.editing{white-space:normal;user-select:text;-webkit-user-select:text;outline:2px solid var(--pr);outline-offset:-2px;background:rgba(59,130,246,.08)}
td.shrink{white-space:nowrap;overflow:hidden;text-overflow:clip}
td.shrink>span,td.shrink>*{display:inline-block;transform-origin:left center;max-width:100%}
th{background:var(--sur2);font-weight:600;text-align:left;position:sticky;top:0;z-index:5;font-size:.8rem;color:var(--tx);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
th:first-child{position:sticky;left:0;z-index:7;background:var(--sur2)}
td:first-child{position:sticky;left:0;z-index:2;background:var(--sur2)}
td.al-left{text-align:left}
td.al-center{text-align:center}
td.al-right{text-align:right}
td.bold{font-weight:700}
td.sel-top{border-top:2px solid var(--sel) !important}
td.sel-bottom{border-bottom:2px solid var(--sel) !important}
td.sel-left{border-left:2px solid var(--sel) !important}
td.sel-right{border-right:2px solid var(--sel) !important}
td.sel-bg{background:rgba(59,130,246,.12)}
td.sel-anchor{outline:3px dashed #f59e0b;outline-offset:-3px;z-index:3}
tr.row-sel td{background:rgba(59,130,246,.14) !important}
th.col-sel{background:rgba(59,130,246,.28) !important}
td.col-sel{background:rgba(59,130,246,.14) !important}
th.hdr-hi{background:rgba(59,130,246,.35) !important;outline:2px solid var(--pr);outline-offset:-2px}
a.link{color:var(--lk);text-decoration:none;cursor:pointer;font-weight:500}
.row-num{background:var(--sur2);color:var(--tx2);text-align:center;font-size:.75rem;width:38px;min-width:38px;font-weight:600;cursor:pointer}
.row-zero{background:#fef3c7;color:#854d0e;font-weight:700}
body.night .row-zero{background:#78350f;color:#fef3c7}
.col-head{display:flex;align-items:center;gap:4px}
.col-head .h-label{flex:1;cursor:pointer;padding:2px 4px;border-radius:4px;user-select:none;-webkit-user-select:none}
.h-label.blank{color:#94a3b8;font-style:italic}
.excluded{opacity:.35}
.empty-cell::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(148,163,184,.08) 6px,rgba(148,163,184,.08) 12px);pointer-events:none}
.pg{display:flex;justify-content:center;align-items:center;gap:8px;padding:8px;background:var(--sur2);border-top:1px solid var(--bd);font-size:.8rem;color:var(--tx2);flex-wrap:nowrap;overflow-x:auto}
.pg button{background:var(--sur);border:1px solid var(--bd);padding:5px 10px;border-radius:8px;font-size:.8rem;cursor:pointer;color:var(--tx)}
.pg button:disabled{opacity:.35;cursor:not-allowed}
.pg .zoom-group{display:flex;align-items:center;gap:4px;background:var(--sur);border:1px solid var(--bd);border-radius:8px;padding:2px 6px}
.pg .zoom-group button{width:26px;height:26px;padding:0;font-size:.9rem;font-weight:700;border-radius:6px}
.pg .zoom-group .zv{font-size:.72rem;font-family:monospace;min-width:36px;text-align:center;color:var(--tx2)}
.pg .ms-toggle{display:flex;align-items:center;gap:6px;background:var(--sur);border:1px solid var(--bd);border-radius:8px;padding:4px 8px;cursor:pointer;font-size:.75rem;user-select:none;transition:.15s}
.pg .ms-toggle.on{border-color:var(--pr);background:rgba(59,130,246,.12);color:var(--pr);font-weight:600}
.pg .ms-toggle .tgl2{position:relative;width:34px;height:18px;background:#cbd5e1;border-radius:10px;transition:.2s;flex-shrink:0}
.pg .ms-toggle .tgl2::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:.2s}
.pg .ms-toggle.on .tgl2{background:var(--pr)}
.pg .ms-toggle.on .tgl2::after{left:18px}
.pg .qr-toggle{display:flex;align-items:center;gap:6px;background:var(--sur);border:1px solid var(--bd);border-radius:8px;padding:4px 8px;cursor:pointer;font-size:.75rem;user-select:none;transition:.15s}
.pg .qr-toggle.on{border-color:var(--pr);background:rgba(59,130,246,.12);color:var(--pr);font-weight:600}
.pg .qr-toggle .tgl2{position:relative;width:34px;height:18px;background:#cbd5e1;border-radius:10px;transition:.2s;flex-shrink:0}
.pg .qr-toggle .tgl2::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:.2s}
.pg .qr-toggle.on .tgl2{background:var(--pr)}
.pg .qr-toggle.on .tgl2::after{left:18px}
.empty-msg{text-align:center;color:var(--tx3);padding:50px 20px;font-style:italic;font-size:.9rem}
.menu{position:fixed;background:var(--sur);border:1px solid var(--bd);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:6px;z-index:1000;min-width:200px;display:none;max-height:75vh;overflow-y:auto;overscroll-behavior:contain}
.menu.open{display:block}
.mi{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:8px;font-size:.85rem;cursor:pointer;border:0;background:0 0;width:100%;text-align:left;white-space:nowrap;color:var(--tx)}
.mi:hover{background:var(--sur2)}
.mi.disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.mi.danger{color:var(--rd)}
.mi .ic{font-size:.95rem;width:18px;text-align:center}
.mi .lb{flex:1}
.mi .vl{font-size:.72rem;color:var(--tx3);font-family:monospace}
.msep{height:1px;background:var(--bd);margin:4px 0}
.mhd{font-size:.68rem;color:var(--tx3);padding:6px 11px 3px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.cg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 11px}
.cs{width:24px;height:24px;border-radius:6px;border:2px solid var(--bd);cursor:pointer;transition:.1s}
.cs:hover{transform:scale(1.1);border-color:var(--pr)}
.cs.active{border-color:var(--pr);border-width:3px}
.cs.none{position:relative;background:repeating-linear-gradient(45deg,#eee,#eee 4px,#ccc 4px,#ccc 8px)}
.cs.none::after{content:'';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#666;font-size:11px}
.ctr{display:flex;gap:4px;padding:6px 11px}
.ctr button{flex:1;padding:6px;border-radius:6px;border:1.5px solid var(--bd);background:var(--sur2);color:var(--tx);cursor:pointer;font-size:.72rem;font-weight:600}
.ctr button.active{border-color:var(--pr);background:rgba(59,130,246,.1);color:var(--pr)}
.opsl{padding:4px 11px 8px}
.opsl label{font-size:.68rem;color:var(--tx2);display:block;margin-bottom:2px}
.wc{display:flex;align-items:center;gap:6px;padding:6px 11px}
.wc .wl{font-size:.78rem;color:var(--tx2);flex:1}
.wc .wv{font-family:monospace;font-size:.82rem;font-weight:600;color:var(--tx);min-width:44px;text-align:right}
.wc button{width:28px;height:28px;border-radius:6px;border:1.5px solid var(--bd);background:var(--sur2);font-size:.9rem;font-weight:700;cursor:pointer;color:var(--tx);padding:0}
.ss{display:flex;gap:4px;padding:0 11px 8px}
.ss label{flex:1;display:flex;align-items:center;justify-content:center;padding:5px;border:1.5px solid var(--bd);border-radius:6px;font-size:.72rem;cursor:pointer;background:var(--sur)}
.ss label:has(input:checked){border-color:var(--pr);background:rgba(59,130,246,.1);color:var(--pr)}
.ss input{display:none}
.numbox{padding:0 11px 8px;display:flex;flex-wrap:wrap;gap:4px}
.numbox button{flex:1;min-width:calc(50% - 2px);padding:7px 6px;border-radius:8px;border:1.5px solid var(--bd);background:var(--sur2);color:var(--tx);cursor:pointer;font-size:.75rem;font-weight:600}
.numbox button:hover{border-color:var(--pr);color:var(--pr)}
.mbg{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1500;display:none;align-items:center;justify-content:center;padding:20px;overscroll-behavior:contain}
.mbg.open{display:flex}
.mbg.top{z-index:1700}
.mbox{background:var(--sur);color:var(--tx);border-radius:16px;padding:20px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto;overscroll-behavior:contain}
.mbox h3{font-size:1rem;margin-bottom:6px}
.mbox .hdr-prev{font-size:.85rem;color:var(--tx2);margin-bottom:10px;font-weight:700;padding:6px 10px;background:var(--sur2);border-radius:8px;border:1px solid var(--bd);word-break:break-word;min-height:20px}
.mbox .hdr-prev .hl{color:var(--pr)}
.mbox input,.mbox select,.mbox textarea{width:100%;padding:10px 12px;border:1.5px solid var(--bd);border-radius:10px;font-size:.9rem;margin-bottom:12px;background:var(--sur);color:var(--tx)}
.mac{display:flex;gap:8px;margin-top:6px}
.mac button{flex:1;padding:11px;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer;border:0}
.eg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.eg button{padding:12px 8px;border-radius:10px;border:1.5px solid var(--bd);background:var(--sur2);color:var(--tx);cursor:pointer;font-size:.82rem;font-weight:600;text-align:center}
.eg button:hover{background:var(--bd)}
.qtr{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--sur2);border:1.5px solid var(--bd);border-radius:10px;margin-bottom:12px}
.qtr span{font-size:.9rem;font-weight:600}
.tgl{position:relative;width:50px;height:26px;background:#cbd5e1;border-radius:20px;cursor:pointer;transition:.2s;flex-shrink:0}
.tgl.on{background:var(--gr)}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
.tgl.on::after{left:27px}
.sr{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}
.sr:last-child{border-bottom:0}
.slk{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd);background:var(--sur2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
.slk.locked{background:#fee2e2;border-color:#fca5a5}
.sb{flex:1}
.slb{font-size:.85rem;font-weight:600;margin-bottom:8px;display:block}
.so{display:flex;flex-wrap:wrap;gap:6px}
.so label{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border:1.5px solid var(--bd);border-radius:8px;font-size:.78rem;cursor:pointer;background:var(--sur)}
.so label:has(input:checked){border-color:var(--pr);background:rgba(59,130,246,.1);color:var(--pr)}
.so input{display:none}
.sr.locked .so{opacity:.4;pointer-events:none}
.sll{display:flex;justify-content:space-between;font-size:.7rem;color:var(--tx3);margin-bottom:4px}
input[type=range]{width:100%;-webkit-appearance:none;height:6px;border-radius:3px;background:linear-gradient(to right,#000,#808080,#fff);outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--sur);border:2px solid var(--pr);cursor:pointer}
.tst{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-size:.85rem;z-index:2000;opacity:0;transition:.25s;pointer-events:none;max-width:92vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.tst.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hp{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1600;display:none;align-items:flex-end;justify-content:center;overscroll-behavior:contain}
.hp.open{display:flex}
.hi{background:var(--sur);color:var(--tx);width:100%;max-width:560px;max-height:85vh;border-radius:20px 20px 0 0;padding:18px;overflow-y:auto;overscroll-behavior:contain}
.hh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--bd);gap:8px}
.hh h3{font-size:1.05rem;flex:1}
.hh button{background:var(--sur2);border:1px solid var(--bd);font-size:.8rem;cursor:pointer;color:var(--tx);padding:6px 10px;border-radius:8px}
.hh .da{background:#fee2e2;border-color:#fca5a5;color:#b91c1c;font-weight:600}
.hit{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--sur2)}
.hit .dt{font-size:.72rem;color:var(--tx3);margin-bottom:4px;font-family:monospace}
.hit .mt{font-size:.78rem;color:var(--tx2);margin-bottom:8px}
.hit .pv{font-size:.72rem;color:var(--tx2);font-family:monospace;background:var(--sur);padding:8px;border-radius:6px;margin-bottom:8px;border:1px solid var(--bd);overflow-x:auto;max-height:90px;white-space:pre;line-height:1.5}
.hit .ac{display:flex;gap:6px}
.hit .ac button{flex:1;padding:7px;border-radius:8px;font-size:.8rem;cursor:pointer;border:1px solid var(--bd);background:var(--sur);color:var(--tx)}
.hit .ac .rc{background:rgba(59,130,246,.1);border-color:var(--pr);color:var(--pr);font-weight:600}
.hit .ac .dl{color:var(--rd);border-color:#fecaca}
.qp{margin:10px;padding:12px;background:var(--sur2);border:1px dashed var(--bd);border-radius:12px}
.qg{display:flex;flex-wrap:wrap;gap:10px}
.qc{background:var(--sur);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;text-align:center;min-width:80px}
.qc .qr{font-size:.75rem;font-weight:700;color:var(--tx);font-family:monospace;margin-bottom:5px}
.qc img{width:60px;height:60px;display:block;margin:0 auto}
.ttd{text-align:center;font-weight:bold;text-transform:uppercase;font-size:1.3rem;padding:14px 10px;letter-spacing:1px;color:var(--tx);transition:font-size .15s}
.tsp{height:1em}
.offline-banner{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:#fef3c7;color:#854d0e;border:1px solid #fcd34d;padding:6px 14px;border-radius:8px;font-size:.78rem;font-weight:600;z-index:1900;display:none;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.offline-banner.show{display:block}
@media(max-width:480px){body{font-size:14px}.topbar button{width:34px;height:34px;font-size:.9rem}.btn-add{width:48px;height:38px}.btn-add .plus{font-size:.95rem}.btn-add .add-time{font-size:.55rem}th,td{padding:5px 7px;font-size:.78rem}.row-num{width:32px;min-width:32px}.ttd{font-size:1.1rem}.pg{gap:6px}}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
</style>
</head>
<body>
<div class="topbar">
  <button class="btn-add nodata" id="addBtn" title="Click: paste | Long-press: status">
    <span class="plus">➕</span>
    <span class="add-time" id="addTime">—</span>
  </button>
  <button id="clearBtn" title="Clear">🧹</button>
  <button id="copyBtn" title="Copy">⧉</button>
  <button id="exportBtn" title="Export">🚀</button>
  <button id="moreBtn" title="More">⋮</button>
</div>
<div class="offline-banner" id="offlineBanner">⚠️ Offline — changes not saved to cloud</div>
<div class="tw">
  <div class="empty-msg" id="emptyMsg">📭 No table — paste data with ➕</div>
  <div class="ts" id="tableScroll" style="display:none">
    <div class="ttd" id="tableTitle" style="display:none"></div>
    <div class="tsp" id="titleSpacer" style="display:none"></div>
    <table id="mainTable"><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table>
  </div>
  <div class="pg" id="pagination" style="display:none">
    <button id="undoBtn" title="Undo (Ctrl+Z)">↩</button>
    <button id="redoBtn" title="Redo (Ctrl+Y)">↪</button>
    <div class="zoom-group" title="Zoom">
      <button id="zoomMinus" title="Zoom out">−</button>
      <span class="zv" id="zoomVal">100%</span>
      <button id="zoomPlus" title="Zoom in">+</button>
    </div>
    <div class="ms-toggle" id="msToggle" title="Multi-select mode">
      <span>Multi</span>
      <div class="tgl2"></div>
    </div>
    <div class="qr-toggle" id="qrToggle" title="Show/hide QR codes on this page">
      <span>QR</span>
      <div class="tgl2"></div>
    </div>
  </div>
</div>
<div class="qp" id="qrPreview" style="display:none"><div class="qg" id="qrGrid"></div></div>
<div class="menu" id="rowMenu"></div>
<div class="menu" id="colMenu"></div>
<div class="menu" id="moreMenu"></div>
<div class="menu" id="cellMenu"></div>
<div class="mbg" id="modalBg"><div class="mbox" id="modalBox"></div></div>
<div class="hp" id="historyPanel">
  <div class="hi">
    <div class="hh">
      <h3>📜 History</h3>
      <button class="da" id="deleteAllHistory">🗑️ Delete All</button>
      <button id="closeHistory">✕</button>
    </div>
    <div id="historyList"></div>
  </div>
</div>
<div class="tst" id="toast"></div>

<script type="module">

function autoFillNumbers(mode){
  const cells=getSelCells();
  if(!cells.length){toast('Select cells first');return}
  pUndo();
  const sorted=cells.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const byRow={},byCol={};
  sorted.forEach(([r,c])=>{if(!byRow[r])byRow[r]=[];byRow[r].push(c);if(!byCol[c])byCol[c]=[];byCol[c].push(r)});
  if(mode==='numSeq'||mode==='alphaSeq'){
    const uniqueRows=Object.keys(byRow).map(Number).sort((a,b)=>a-b);
    uniqueRows.forEach((r,i)=>{const val=mode==='numSeq'?String(i+1):colLetter(i);byRow[r].forEach(c=>{S.rows[r][c]=val})});
  } else if(mode==='numRow'){
    sorted.forEach(([r,c])=>{S.rows[r][c]=String(r+1)});
  } else if(mode==='alphaCol'){
    sorted.forEach(([r,c])=>{S.rows[r][c]=colLetter(c)});
  }
  autoQr();render();mark();toast('Auto-filled')
}

function renderHist(){if(!hist.length){hl.innerHTML='<div style="text-align:center;color:#94a3b8;padding:40px 20px;font-style:italic">No saved records yet</div>';return}hl.innerHTML=hist.map((rec,i)=>{const dt=new Date(rec.timestamp).toLocaleString();const hs=(rec.headers||[]).slice(0,4).map(h=>h||'Col');let pv=(rec.title?rec.title.toUpperCase()+'\n':'')+hs.join(' | ')+'\n'+'─'.repeat(28)+'\n';(rec.rows||[]).slice(0,3).forEach(r=>{pv+=r.slice(0,4).map(v=>(v||'').substring(0,12)).join(' | ')+'\n'});if((rec.rows||[]).length>3)pv+='...';return'<div class="hit" data-i="'+i+'"><div class="dt">'+dt+'</div><div class="mt">'+(rec.rows||[]).length+' rows · '+(rec.headers||[]).length+' cols</div><div class="pv">'+esc(pv)+'</div><div class="ac"><button class="rc" data-r="'+i+'">📂 Recall</button><button class="dl" data-d="'+i+'">🗑️ Delete</button></div></div>'}).join('')}

hl.addEventListener('click',async e=>{const r=e.target.closest('[data-r]'),d=e.target.closest('[data-d]');if(r){const rec=hist[parseInt(r.dataset.r)];if(!rec)return;pUndo();S.headers=[...(rec.headers||[])];S.rows=(rec.rows||[]).map(x=>[...x]);S.incR=[...(rec.includedRows||[])];S.incC=[...(rec.includedCols||[])];S.colW=[...(rec.colWidths||[])].length===S.headers.length?[...rec.colWidths]:new Array(S.headers.length).fill(null);S.rowH=[...(rec.rowHeights||[])].length===S.rows.length?[...rec.rowHeights]:new Array(S.rows.length).fill(null);S.rowBg=[...(rec.rowColors||[])].length===S.rows.length?[...rec.rowColors]:new Array(S.rows.length).fill('');S.colBg=[...(rec.colColors||[])].length===S.headers.length?[...rec.colColors]:new Array(S.headers.length).fill('');S.cellBg=rec.cellColors||{};S.cellAlign=rec.cellAlign||{};S.cellBold=rec.cellBold||{};S.cellShrink=rec.cellShrink||{};S.rowOpacity=rec.rowOpacity||{};S.colOpacity=rec.colOpacity||{};S.cellOpacity=rec.cellOpacity||{};S.headerColor=rec.headerColor||'';S.headerOpacity=rec.headerOpacity!==undefined?rec.headerOpacity:100;S.qrCol=!!rec.qrCol;S.qrSec=!!rec.qrSection;qrAutoSuppress=!!rec.qrAutoSuppress;S.title=rec.title||'';S.sortCol=rec.sortCol||null;S.sortDir=rec.sortDir||null;sel={type:null,r1:null,c1:null,r2:null,c2:null};msAnchor=null;currentRecordId=rec.id;normalizeState();render();mark();hp.classList.remove('open');document.body.classList.remove('locked');toast('Recalled')}if(d){const rec=hist[parseInt(d.dataset.d)];if(!rec)return;if(!confirm('Delete this record?'))return;await delHist(rec.id);renderHist();toast('Deleted')}});

function isEditingCell(){const ae=document.activeElement;return !!(ae&&(ae.isContentEditable||ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))}
document.addEventListener('keydown',e=>{if(isEditingCell())return;if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.shiftKey){e.preventDefault();if(uStack.length)$('undoBtn').click()}else if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.key==='z'&&e.shiftKey))){e.preventDefault();if(rStack.length)$('redoBtn').click()}else if((e.ctrlKey||e.metaKey)&&e.key==='c'&&sel.type){e.preventDefault();copySelection()}else if((e.ctrlKey||e.metaKey)&&e.key==='x'&&sel.type){e.preventDefault();cutSelection()}else if((e.ctrlKey||e.metaKey)&&e.key==='v'){e.preventDefault();onPasteShortcut()}else if(e.key==='Escape'){if(document.querySelector('.menu.open'))closeMenus();else if(sel.type){sel={type:null,r1:null,c1:null,r2:null,c2:null};msAnchor=null;render()}}else if(e.key==='Enter'&&sel.type==='cell'&&sel.r1!==null&&!SET.msOn){const td=tb.querySelector('td[data-r="'+sel.r1+'"][data-c="'+sel.c1+'"]');if(td){e.preventDefault();clearEditingCells();td.contentEditable='true';td.classList.add('editing');td.focus();const r=document.createRange();r.selectNodeContents(td);const s=window.getSelection();s.removeAllRanges();s.addRange(r)}}else if(e.key==='Tab'&&sel.type==='cell'&&sel.r1!==null){e.preventDefault();clearEditingCells();let r=sel.r1,c=sel.c1;if(e.shiftKey){c--;if(c<0){c=S.headers.length-1;r--}}else{c++;if(c>=S.headers.length){c=0;r++}}if(r<0)r=S.rows.length-1;if(r>=S.rows.length)r=0;if(SET.msOn){setCellSel(r,c,r,c);msAnchor={r,c}}else setCellSel(r,c,r,c);const td=tb.querySelector('td[data-r="'+r+'"][data-c="'+c+'"]');if(td)td.scrollIntoView({block:'nearest',inline:'nearest'})}else if((e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowDown')&&sel.type==='cell'&&sel.r1!==null){e.preventDefault();let r=sel.r2,c=sel.c2;if(e.key==='ArrowLeft')c=Math.max(0,c-1);else if(e.key==='ArrowRight')c=Math.min(S.headers.length-1,c+1);else if(e.key==='ArrowUp')r=Math.max(0,r-1);else if(e.key==='ArrowDown')r=Math.min(S.rows.length-1,r+1);if(SET.msOn&&e.shiftKey)setCellSel(sel.r1,sel.c1,r,c);else{setCellSel(r,c,r,c);if(SET.msOn)msAnchor={r,c}}const td=tb.querySelector('td[data-r="'+r+'"][data-c="'+c+'"]');if(td)td.scrollIntoView({block:'nearest',inline:'nearest'})}});

async function onPasteShortcut(){try{if(navigator.clipboard&&navigator.clipboard.readText){const t=await navigator.clipboard.readText();if(t&&t.trim()&&(t.indexOf('\t')>-1||t.indexOf('\n')>-1)){const m=parseText(t);if(m&&m.length){pUndo();if(!S.headers.length){loadMatrix(m);toast('Pasted from clipboard');return}let tr=(sel.type==='cell'&&sel.r1!==null)?Math.min(sel.r1,sel.r2):0;let tc=(sel.type==='cell'&&sel.c1!==null)?Math.min(sel.c1,sel.c2):0;const needR=tr+m.length,needC=tc+m[0].length;while(S.rows.length<needR){S.rows.push(new Array(S.headers.length).fill(''));S.incR.push(true);S.rowH.push(null);S.rowBg.push('')}while(S.headers.length<needC){insCol(S.headers.length)}m.forEach((row,r)=>row.forEach((v,c)=>{const R=tr+r,C=tc+c;if(R<S.rows.length&&C<S.headers.length)S.rows[R][C]=v}));sel={type:'cell',r1:tr,c1:tc,r2:tr+m.length-1,c2:tc+m[0].length-1};msAnchor={r:tr,c:tc};autoQr();render();mark();toast('Pasted '+m.length+'×'+m[0].length+' block');return}}}}catch(e){}if(clipCells&&clipCells.length)pasteIntoRange(false);else toast('Clipboard empty')}
function copySelection(){const cells=getSelCells();if(!cells.length){toast('Nothing selected');return}clipCells=cells.map(([r,c])=>({r:r,c:c,v:S.rows[r][c]}));clipStyles=cells.map(([r,c])=>{const k=selKey(r,c);return{bg:S.cellBg[k],align:S.cellAlign[k],bold:S.cellBold[k],shrink:S.cellShrink[k]}});toast('Copied '+cells.length+' cells')}
function cutSelection(){const cells=getSelCells();if(!cells.length){toast('Nothing selected');return}clipCells=cells.map(([r,c])=>({r:r,c:c,v:S.rows[r][c]}));clipStyles=cells.map(([r,c])=>{const k=selKey(r,c);return{bg:S.cellBg[k],align:S.cellAlign[k],bold:S.cellBold[k],shrink:S.cellShrink[k]}});pUndo();cells.forEach(([r,c])=>{S.rows[r][c]='';const k=selKey(r,c);delete S.cellBg[k];delete S.cellAlign[k];delete S.cellBold[k];delete S.cellShrink[k]});render();mark();toast('Cut '+cells.length+' cells')}
