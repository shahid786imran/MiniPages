<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Drive Test 6</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: #f5f5f5;
        color: #222;
    }

    h1 {
        margin-bottom: 5px;
    }

    .box {
        background: white;
        padding: 16px;
        margin: 12px 0;
        border-radius: 10px;
        box-shadow: 0 1px 5px rgba(0,0,0,.12);
    }

    button {
        padding: 10px 14px;
        margin: 5px 4px 5px 0;
        border: 0;
        border-radius: 7px;
        cursor: pointer;
        background: #1a73e8;
        color: white;
        font-size: 14px;
    }

    button:disabled {
        background: #aaa;
        cursor: not-allowed;
    }

    #log {
        white-space: pre-wrap;
        background: #111;
        color: #eee;
        padding: 14px;
        border-radius: 8px;
        min-height: 180px;
        font-family: Consolas, monospace;
        font-size: 13px;
        overflow-wrap: anywhere;
    }

    .fileInfo {
        line-height: 1.6;
        overflow-wrap: anywhere;
    }

    .success {
        color: green;
        font-weight: bold;
    }

    .error {
        color: #d93025;
        font-weight: bold;
    }

    .warning {
        color: #b06000;
        font-weight: bold;
    }
</style>

<script src="https://apis.google.com/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>
</head>

<body>

<h1>Google Drive Test 6</h1>

<div class="box">
    <b>Target Folder:</b> MyWebApps Attachments<br>
    <b>Folder ID:</b> 1LFkmK8l6dB6HtFlcApI0TW2jgp7cGEGT
</div>

<div class="box">

    <button id="authBtn" onclick="authorizeGoogle()">
        Authorize Google Drive
    </button>

    <button id="pickerBtn" onclick="openPicker()" disabled>
        Select Existing File
    </button>

    <button id="driveBtn" onclick="openInGoogleDrive()" disabled>
        Open File in Google Drive
    </button>

    <button id="checkBtn" onclick="checkAuthorization()" disabled>
        Check App Authorization
    </button>

    <button id="renameBtn" onclick="renameFile()" disabled>
        Rename File
    </button>

    <button id="trashBtn" onclick="trashFile()" disabled>
        Move to Trash
    </button>

    <button onclick="signOut()">
        Sign Out
    </button>

</div>

<div class="box">

    <h3>Selected File</h3>

    <div id="fileInfo" class="fileInfo">
        No file selected.
    </div>

</div>

<div class="box">

    <h3>Status / Test Log</h3>

    <div id="log"></div>

</div>


<script>

const CLIENT_ID =
"203025420924-uvlehfup39hj4st7tpv7vud8uedafr9k.apps.googleusercontent.com";

const API_KEY =
"AIzaSyBSf3HKUR652Kja3l65D91FvCkQSoxgZDY";

const APP_ID =
"46681415809";

const FOLDER_ID =
"1LFkmK8l6dB6HtFlcApI0TW2jgp7cGEGT";

const SCOPES =
"https://www.googleapis.com/auth/drive.file";


let tokenClient = null;
let accessToken = null;

let pickerReady = false;
let selectedFile = null;


/* --------------------------------------------------
   LOG
-------------------------------------------------- */

function log(message, type = "") {

    const box = document.getElementById("log");

    const line = document.createElement("div");

    if (type) {
        line.className = type;
    }

    line.textContent =
        new Date().toLocaleTimeString() +
        "  " +
        message;

    box.appendChild(line);

    box.scrollTop = box.scrollHeight;
}


/* --------------------------------------------------
   GOOGLE API LOAD
-------------------------------------------------- */

function loadGoogleLibraries() {

    return new Promise((resolve, reject) => {

        if (window.gapi) {

            gapi.load(
                "picker",
                () => {
                    pickerReady = true;
                    resolve();
                }
            );

        } else {

            reject(
                new Error("Google API library not loaded.")
            );

        }

    });

}


/* --------------------------------------------------
   INITIALIZE
-------------------------------------------------- */

window.addEventListener("load", async () => {

    log("Loading Google libraries...");

    try {

        await loadGoogleLibraries();

        log(
            "Google Picker library loaded.",
            "success"
        );

        tokenClient =
            google.accounts.oauth2.initTokenClient({

                client_id: CLIENT_ID,

                scope: SCOPES,

                callback: handleToken

            });

        log(
            "Google authorization client initialized.",
            "success"
        );

    } catch (error) {

        log(
            "Initialization failed: " +
            error.message,
            "error"
        );

    }

});


/* --------------------------------------------------
   AUTHORIZATION
-------------------------------------------------- */

function authorizeGoogle() {

    if (!tokenClient) {

        log(
            "Authorization client is not ready.",
            "error"
        );

        return;
    }

    log("Requesting Google Drive authorization...");

    tokenClient.requestAccessToken({
        prompt: ""
    });

}


function handleToken(response) {

    if (!response) {

        log(
            "No authorization response received.",
            "error"
        );

        return;
    }

    if (response.error) {

        log(
            "Authorization error: " +
            JSON.stringify(response),
            "error"
        );

        return;
    }

    accessToken = response.access_token;

    log(
        "Google Drive authorization successful.",
        "success"
    );

    document.getElementById("pickerBtn").disabled = false;

}


/* --------------------------------------------------
   PICKER
-------------------------------------------------- */

function openPicker() {

    if (!accessToken) {

        log(
            "Please authorize Google Drive first.",
            "error"
        );

        return;
    }

    if (!pickerReady) {

        log(
            "Google Picker is not ready.",
            "error"
        );

        return;
    }

    log(
        "Opening Google Drive Picker..."
    );

    const docsView =
        new google.picker.DocsView()
            .setIncludeFolders(false)
            .setSelectFolderEnabled(false)
            .setParent(FOLDER_ID)
            .setMode(
                google.picker.DocsViewMode.LIST
            );

    const picker =
        new google.picker.PickerBuilder()

            .setDeveloperKey(API_KEY)

            .setAppId(APP_ID)

            .setOAuthToken(accessToken)

            .addView(docsView)

            .setCallback(pickerCallback)

            .build();

    picker.setVisible(true);

}


/* --------------------------------------------------
   PICKER CALLBACK
-------------------------------------------------- */

function pickerCallback(data) {

    const action =
        data[
            google.picker.Response.ACTION
        ];

    if (
        action ===
        google.picker.Action.PICKED
    ) {

        const docs =
            data[
                google.picker.Response.DOCUMENTS
            ];

        if (!docs || !docs.length) {

            log(
                "Picker returned no file.",
                "warning"
            );

            return;
        }

        const doc = docs[0];

        selectedFile = {

            id:
                doc[
                    google.picker.Document.ID
                ],

            name:
                doc[
                    google.picker.Document.NAME
                ],

            mimeType:
                doc[
                    google.picker.Document.MIME_TYPE
                ],

            url:
                doc[
                    google.picker.Document.URL
                ]

        };

        showSelectedFile();

        document.getElementById(
            "driveBtn"
        ).disabled = false;

        document.getElementById(
            "checkBtn"
        ).disabled = false;

        log(
            "File selected successfully.",
            "success"
        );

        log(
            "IMPORTANT: Selection alone does not necessarily grant app authorization."
        );

    }

    else if (
        action ===
        google.picker.Action.CANCEL
    ) {

        log(
            "Picker cancelled."
        );

    }

}


/* --------------------------------------------------
   SHOW FILE
-------------------------------------------------- */

function showSelectedFile() {

    const box =
        document.getElementById("fileInfo");

    box.innerHTML = "";

    const lines = [

        ["Name", selectedFile.name],

        ["ID", selectedFile.id],

        ["MIME", selectedFile.mimeType],

        ["URL", selectedFile.url]

    ];

    lines.forEach(item => {

        const div =
            document.createElement("div");

        const strong =
            document.createElement("b");

        strong.textContent =
            item[0] + ": ";

        div.appendChild(strong);

        if (item[0] === "URL") {

            const link =
                document.createElement("a");

            link.href = item[1];

            link.target = "_blank";

            link.textContent =
                item[1];

            div.appendChild(link);

        } else {

            div.appendChild(
                document.createTextNode(item[1])
            );

        }

        box.appendChild(div);

    });

}


/* --------------------------------------------------
   OPEN IN GOOGLE DRIVE
-------------------------------------------------- */

function openInGoogleDrive() {

    if (!selectedFile) {

        log(
            "No file selected.",
            "error"
        );

        return;
    }

    log(
        "Opening selected file in Google Drive..."
    );

    window.open(
        selectedFile.url,
        "_blank",
        "noopener,noreferrer"
    );

}


/* --------------------------------------------------
   CHECK APP AUTHORIZATION
-------------------------------------------------- */

async function checkAuthorization() {

    if (!accessToken) {

        log(
            "No Google Drive access token.",
            "error"
        );

        return;
    }

    if (!selectedFile) {

        log(
            "No file selected.",
            "error"
        );

        return;
    }

    log(
        "Checking file authorization..."
    );

    try {

        const url =
            "https://www.googleapis.com/drive/v3/files/" +
            encodeURIComponent(selectedFile.id) +
            "?fields=id,name,mimeType,webViewLink,parents,trashed,isAppAuthorized";

        const response =
            await fetch(url, {

                method: "GET",

                headers: {

                    Authorization:
                        "Bearer " + accessToken

                }

            });

        const text =
            await response.text();

        let data;

        try {

            data = JSON.parse(text);

        } catch {

            data = {
                raw: text
            };

        }

        if (!response.ok) {

            log(
                "Authorization check failed:\n" +
                JSON.stringify(
                    data,
                    null,
                    2
                ),
                "error"
            );

            document.getElementById(
                "renameBtn"
            ).disabled = true;

            document.getElementById(
                "trashBtn"
            ).disabled = true;

            return;
        }

        log(
            "Drive API file information received:\n" +
            JSON.stringify(
                data,
                null,
                2
            ),
            "success"
        );

        if (data.isAppAuthorized === true) {

            log(
                "SUCCESS: App is authorized for this file.",
                "success"
            );

            document.getElementById(
                "renameBtn"
            ).disabled = false;

            document.getElementById(
                "trashBtn"
            ).disabled = false;

        } else {

            log(
                "File is visible, but isAppAuthorized is FALSE.",
                "warning"
            );

        }

    } catch (error) {

        log(
            "Authorization check exception: " +
            error.message,
            "error"
        );

    }

}


/* --------------------------------------------------
   RENAME
-------------------------------------------------- */

async function renameFile() {

    if (!selectedFile || !accessToken) {

        log(
            "No authorized file available.",
            "error"
        );

        return;
    }

    const newName =
        prompt(
            "Enter new file name:",
            selectedFile.name
        );

    if (!newName) {
        return;
    }

    log(
        "Updating file name..."
    );

    try {

        const url =
            "https://www.googleapis.com/drive/v3/files/" +
            encodeURIComponent(selectedFile.id);

        const response =
            await fetch(url, {

                method: "PATCH",

                headers: {

                    Authorization:
                        "Bearer " + accessToken,

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    name: newName

                })

            });

        const data =
            await response.json();

        if (!response.ok) {

            log(
                "Rename failed:\n" +
                JSON.stringify(
                    data,
                    null,
                    2
                ),
                "error"
            );

            return;
        }

        selectedFile.name =
            data.name || newName;

        showSelectedFile();

        log(
            "File renamed successfully.",
            "success"
        );

    } catch (error) {

        log(
            "Rename exception: " +
            error.message,
            "error"
        );

    }

}


/* --------------------------------------------------
   TRASH
-------------------------------------------------- */

async function trashFile() {

    if (!selectedFile || !accessToken) {

        log(
            "No authorized file available.",
            "error"
        );

        return;
    }

    if (
        !confirm(
            "Move this file to Google Drive Trash?"
        )
    ) {

        return;
    }

    log(
        "Moving file to Trash..."
    );

    try {

        const url =
            "https://www.googleapis.com/drive/v3/files/" +
            encodeURIComponent(selectedFile.id);

        const response =
            await fetch(url, {

                method: "PATCH",

                headers: {

                    Authorization:
                        "Bearer " + accessToken,

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    trashed: true

                })

            });

        const data =
            await response.json();

        if (!response.ok) {

            log(
                "Move to Trash failed:\n" +
                JSON.stringify(
                    data,
                    null,
                    2
                ),
                "error"
            );

            return;
        }

        log(
            "File moved to Trash successfully.",
            "success"
        );

        document.getElementById(
            "renameBtn"
        ).disabled = true;

        document.getElementById(
            "trashBtn"
        ).disabled = true;

    } catch (error) {

        log(
            "Trash exception: " +
            error.message,
            "error"
        );

    }

}


/* --------------------------------------------------
   SIGN OUT
-------------------------------------------------- */

function signOut() {

    if (accessToken) {

        google.accounts.oauth2.revoke(
            accessToken,
            () => {

                log(
                    "Google Drive access revoked."
                );

            }
        );

    }

    accessToken = null;
    selectedFile = null;

    document.getElementById(
        "pickerBtn"
    ).disabled = true;

    document.getElementById(
        "driveBtn"
    ).disabled = true;

    document.getElementById(
        "checkBtn"
    ).disabled = true;

    document.getElementById(
        "renameBtn"
    ).disabled = true;

    document.getElementById(
        "trashBtn"
    ).disabled = true;

    document.getElementById(
        "fileInfo"
    ).textContent =
        "No file selected.";

    log(
        "Signed out."
    );

}

</script>

</body>
</html>
