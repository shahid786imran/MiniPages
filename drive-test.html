<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Google Drive Test 4</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #f5f5f5;
    color: #222;
}

.box {
    max-width: 850px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

h1 {
    margin-top: 0;
}

button {
    padding: 10px 15px;
    margin: 5px 5px 5px 0;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
    background: #1976d2;
    color: white;
}

button:disabled {
    background: #aaa;
    cursor: not-allowed;
}

input[type="text"] {
    padding: 10px;
    width: min(100%, 500px);
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 7px;
    margin: 5px 0;
}

.section {
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #ddd;
}

#status {
    margin-top: 15px;
    padding: 12px;
    background: #f0f0f0;
    border-radius: 7px;
    white-space: pre-wrap;
    word-break: break-word;
}

#error {
    margin-top: 15px;
    padding: 12px;
    background: #ffe5e5;
    color: #900;
    border: 1px solid #ffaaaa;
    border-radius: 7px;
    white-space: pre-wrap;
    word-break: break-word;
    display: none;
}

#selectedFile {
    margin-top: 15px;
    padding: 12px;
    background: #eef7ff;
    border-radius: 7px;
    white-space: pre-wrap;
    word-break: break-word;
}

.small {
    color: #666;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="box">

<h1>Google Drive Test 4</h1>

<p>
<b>Target Folder:</b> MyWebApps Attachments
</p>

<p>
<b>Folder ID:</b>
1LFkmK8l6dB6HtFlcApI0TW2jgp7cGEGT
</p>

<div id="status">
Loading Google libraries...
</div>

<div id="error"></div>

<div class="section">

<button id="authorizeBtn" disabled>
Authorize Google Drive
</button>

<button id="pickerBtn" disabled>
Open Google Picker
</button>

<button id="signoutBtn" disabled>
Sign Out
</button>

</div>


<div class="section">

<h2>Upload File</h2>

<input type="file" id="fileInput">

<br>

<button id="uploadBtn" disabled>
Upload to Drive Folder
</button>

</div>


<div class="section">

<h2>Selected File</h2>

<div id="selectedFile">
No file selected.
</div>

<br>

<input
type="text"
id="newName"
placeholder="New file name"
>

<br>

<button id="renameBtn" disabled>
Rename / Update
</button>

<button id="openBtn" disabled>
Open File
</button>

<button id="trashBtn" disabled>
Move to Trash
</button>

</div>


<div class="section">

<p class="small">
Google Drive API + Google Picker only.
Firebase is not used in this test.
</p>

</div>

</div>


<!-- Google API -->
<script
src="https://apis.google.com/js/api.js"
async
defer>
</script>

<!-- Google Identity Services -->
<script
src="https://accounts.google.com/gsi/client"
async
defer>
</script>


<script>

/* =========================================================
   CONFIG
   ========================================================= */

const CLIENT_ID =
"203025420924-uvlehfup39hj4st7tpv7vud8uedafr9k.apps.googleusercontent.com";

const API_KEY =
"AIzaSyBSf3HKUR652Kja3l65D91FvCkQSoxgZDY";

const APP_ID =
"46681415809";

const FOLDER_ID =
"1LFkmK8l6dB6HtFlcApI0TW2jgp7cGEGT";

const SCOPES =
"https://www.googleapis.com/auth/drive.file";


/* =========================================================
   STATE
   ========================================================= */

let tokenClient = null;
let accessToken = null;

let gapiReady = false;
let driveReady = false;
let pickerReady = false;
let gisReady = false;

let selectedFile = null;


/* =========================================================
   ELEMENTS
   ========================================================= */

const statusBox =
document.getElementById("status");

const errorBox =
document.getElementById("error");

const authorizeBtn =
document.getElementById("authorizeBtn");

const pickerBtn =
document.getElementById("pickerBtn");

const signoutBtn =
document.getElementById("signoutBtn");

const uploadBtn =
document.getElementById("uploadBtn");

const fileInput =
document.getElementById("fileInput");

const selectedFileBox =
document.getElementById("selectedFile");

const newNameInput =
document.getElementById("newName");

const renameBtn =
document.getElementById("renameBtn");

const openBtn =
document.getElementById("openBtn");

const trashBtn =
document.getElementById("trashBtn");


/* =========================================================
   STATUS
   ========================================================= */

function status(message) {

    statusBox.textContent = message;

}


function error(message) {

    errorBox.textContent =
        "ERROR\n\n" + message;

    errorBox.style.display =
        "block";

    console.error(message);

}


function clearError() {

    errorBox.textContent = "";

    errorBox.style.display =
        "none";

}


/* =========================================================
   BUTTON STATES
   ========================================================= */

function updateButtons() {

    authorizeBtn.disabled =
        !gisReady;

    pickerBtn.disabled =
        !pickerReady ||
        !accessToken;

    uploadBtn.disabled =
        !driveReady ||
        !accessToken ||
        !fileInput.files.length;

    signoutBtn.disabled =
        !accessToken;

    renameBtn.disabled =
        !selectedFile ||
        !accessToken;

    openBtn.disabled =
        !selectedFile;

    trashBtn.disabled =
        !selectedFile ||
        !accessToken;

}


/* =========================================================
   GOOGLE API LOADING
   ========================================================= */

function waitForGoogleAPI() {

    if (
        typeof gapi === "undefined"
    ) {

        setTimeout(
            waitForGoogleAPI,
            100
        );

        return;
    }

    loadGoogleAPI();

}


function loadGoogleAPI() {

    try {

        status(
            "Google API found.\n" +
            "Loading client + Picker..."
        );

        gapi.load(
            "client:picker",
            async function() {

                try {

                    gapiReady = true;

                    status(
                        "Google client + Picker library loaded.\n" +
                        "Loading Drive API..."
                    );

                    await gapi.client.load(
                        "https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"
                    );

                    driveReady = true;

                    status(
                        "Google Drive API loaded successfully."
                    );

                    checkEverythingReady();

                } catch (e) {

                    error(
                        "Drive API initialization failed:\n\n" +
                        getError(e)
                    );

                }

            }
        );

    } catch (e) {

        error(
            "Google API loading failed:\n\n" +
            getError(e)
        );

    }

}


/* =========================================================
   PICKER READY
   ========================================================= */

function checkPickerLibrary() {

    if (
        typeof google !== "undefined" &&
        google.picker &&
        google.picker.PickerBuilder
    ) {

        pickerReady = true;

        status(
            "Google Picker is ready.\n\n" +
            "Waiting for Google Drive authorization..."
        );

        updateButtons();

        return;
    }

    setTimeout(
        checkPickerLibrary,
        100
    );

}


/* =========================================================
   GIS
   ========================================================= */

function waitForGIS() {

    if (
        typeof google === "undefined" ||
        !google.accounts ||
        !google.accounts.oauth2
    ) {

        setTimeout(
            waitForGIS,
            100
        );

        return;
    }

    try {

        tokenClient =
        google.accounts.oauth2.initTokenClient({

            client_id:
                CLIENT_ID,

            scope:
                SCOPES,

            callback:
                handleTokenResponse

        });

        gisReady = true;

        authorizeBtn.disabled = false;

        status(
            "Google Identity Services ready.\n\n" +
            "Click Authorize Google Drive."
        );

        updateButtons();

    } catch (e) {

        error(
            "Google Identity Services initialization failed:\n\n" +
            getError(e)
        );

    }

}


/* =========================================================
   EVERYTHING READY
   ========================================================= */

function checkEverythingReady() {

    checkPickerLibrary();

    updateButtons();

}


/* =========================================================
   AUTHORIZATION
   ========================================================= */

authorizeBtn.addEventListener(
"click",
function() {

    clearError();

    if (!tokenClient) {

        error(
            "Google authorization client is not ready."
        );

        return;
    }

    status(
        "Opening Google authorization..."
    );

    tokenClient.requestAccessToken({

        prompt: ""

    });

});


/* =========================================================
   TOKEN RESPONSE
   ========================================================= */

function handleTokenResponse(response) {

    console.log(
        "Token response:",
        response
    );

    if (
        response.error
    ) {

        error(
            JSON.stringify(
                response,
                null,
                2
            )
        );

        return;
    }

    accessToken =
        response.access_token;

    status(
        "Google Drive authorization successful.\n\n" +
        "Access token received.\n\n" +
        "Google Picker: " +
        (
            pickerReady
            ? "READY"
            : "NOT READY"
        )
    );

    updateButtons();

}


/* =========================================================
   GOOGLE PICKER
   ========================================================= */

pickerBtn.addEventListener(
"click",
function() {

    clearError();

    if (!accessToken) {

        error(
            "Google Drive is not authorized."
        );

        return;
    }

    if (!pickerReady) {

        error(
            "Google Picker is not ready yet."
        );

        return;
    }

    openPicker();

});


function openPicker() {

    try {

        const docsView =
        new google.picker.DocsView(
            google.picker.ViewId.DOCS
        );

        docsView.setIncludeFolders(true);

        docsView.setSelectFolderEnabled(
            false
        );

        docsView.setParent(
            FOLDER_ID
        );


        const picker =
        new google.picker.PickerBuilder()

        .setDeveloperKey(
            API_KEY
        )

        .setAppId(
            APP_ID
        )

        .setOAuthToken(
            accessToken
        )

        .addView(
            docsView
        )

        .setCallback(
            pickerCallback
        )

        .build();


        picker.setVisible(true);


        status(
            "Google Picker opened.\n\n" +
            "Select a file from MyWebApps Attachments."
        );

    } catch (e) {

        error(
            "Could not open Google Picker:\n\n" +
            getError(e)
        );

    }

}


/* =========================================================
   PICKER CALLBACK
   ========================================================= */

async function pickerCallback(data) {

    console.log(
        "Picker callback:",
        data
    );


    if (
        data.action ===
        google.picker.Action.CANCEL
    ) {

        status(
            "Google Picker cancelled."
        );

        return;
    }


    if (
        data.action !==
        google.picker.Action.PICKED
    ) {

        return;
    }


    try {

        const documents =
        data[
            google.picker.Response.DOCUMENTS
        ];


        if (
            !documents ||
            !documents.length
        ) {

            error(
                "Picker returned no file."
            );

            return;
        }


        const doc =
            documents[0];


        const fileId =
        doc[
            google.picker.Document.ID
        ];


        const fileName =
        doc[
            google.picker.Document.NAME
        ] || "";


        const mimeType =
        doc[
            google.picker.Document.MIME_TYPE
        ] || "";


        const fileUrl =
        doc[
            google.picker.Document.URL
        ] || "";


        selectedFile = {

            id:
                fileId,

            name:
                fileName,

            mimeType:
                mimeType,

            url:
                fileUrl

        };


        newNameInput.value =
            fileName;


        selectedFileBox.textContent =
            "File selected successfully.\n\n" +

            "Name: " +
            fileName +

            "\n\nID: " +
            fileId +

            "\n\nMIME: " +
            mimeType +

            "\n\nURL: " +
            fileUrl;


        status(
            "File selected successfully."
        );


        updateButtons();


    } catch (e) {

        error(
            "Could not process selected file:\n\n" +
            getError(e)
        );

    }

}


/* =========================================================
   FILE INPUT
   ========================================================= */

fileInput.addEventListener(
"change",
function() {

    updateButtons();

});


/* =========================================================
   UPLOAD
   ========================================================= */

uploadBtn.addEventListener(
"click",
uploadFile
);


async function uploadFile() {

    clearError();

    const file =
        fileInput.files[0];


    if (!file) {

        error(
            "Please select a local file first."
        );

        return;
    }


    try {

        status(
            "Uploading file..."
        );


        const metadata = {

            name:
                file.name,

            mimeType:
                file.type ||
                "application/octet-stream",

            parents:
                [
                    FOLDER_ID
                ]

        };


        const boundary =
            "-------314159265358979323846";


        const delimiter =
            "\r\n--" +
            boundary +
            "\r\n";


        const closeDelimiter =
            "\r\n--" +
            boundary +
            "--";


        const body =
        new Blob(

            [

                delimiter,

                "Content-Type: application/json; charset=UTF-8\r\n\r\n",

                JSON.stringify(metadata),

                delimiter,

                "Content-Type: " +
                (
                    file.type ||
                    "application/octet-stream"
                ) +
                "\r\n\r\n",

                file,

                closeDelimiter

            ],

            {
                type:
                    "multipart/related; boundary=" +
                    boundary
            }

        );


        const response =
        await fetch(

            "https://www.googleapis.com/upload/drive/v3/files" +
            "?uploadType=multipart" +
            "&fields=id,name,mimeType,webViewLink,parents",

            {

                method:
                    "POST",

                headers: {

                    Authorization:
                        "Bearer " +
                        accessToken

                },

                body:
                    body

            }

        );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                JSON.stringify(
                    result,
                    null,
                    2
                )
            );

        }


        selectedFile =
            result;


        newNameInput.value =
            result.name || "";


        selectedFileBox.textContent =
            "Uploaded successfully.\n\n" +
            JSON.stringify(
                result,
                null,
                2
            );


        status(
            "UPLOAD SUCCESSFUL."
        );


        fileInput.value = "";

        updateButtons();

    } catch (e) {

        error(
            "Upload failed:\n\n" +
            getError(e)
        );

    }

}


/* =========================================================
   RENAME
   ========================================================= */

renameBtn.addEventListener(
"click",
renameFile
);


async function renameFile() {

    clearError();

    if (!selectedFile) {

        error(
            "No file selected."
        );

        return;
    }


    const newName =
        newNameInput.value.trim();


    if (!newName) {

        error(
            "Enter a new file name."
        );

        return;
    }


    try {

        status(
            "Updating file name..."
        );


        const response =
        await fetch(

            "https://www.googleapis.com/drive/v3/files/" +
            encodeURIComponent(
                selectedFile.id
            ) +
            "?fields=id,name,mimeType,webViewLink,parents",

            {

                method:
                    "PATCH",

                headers: {

                    Authorization:
                        "Bearer " +
                        accessToken,

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        name:
                            newName

                    })

            }

        );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                JSON.stringify(
                    result,
                    null,
                    2
                )
            );

        }


        selectedFile =
        {
            ...selectedFile,
            ...result
        };


        newNameInput.value =
            result.name;


        selectedFileBox.textContent =
            JSON.stringify(
                result,
                null,
                2
            );


        status(
            "File name updated successfully."
        );


    } catch (e) {

        error(
            "Rename failed:\n\n" +
            getError(e)
        );

    }

}


/* =========================================================
   OPEN
   ========================================================= */

openBtn.addEventListener(
"click",
function() {

    if (!selectedFile) {

        error(
            "No file selected."
        );

        return;
    }


    const url =
        selectedFile.webViewLink ||
        selectedFile.url ||
        (
            "https://drive.google.com/open?id=" +
            encodeURIComponent(
                selectedFile.id
            )
        );


    window.open(
        url,
        "_blank"
    );

});


/* =========================================================
   TRASH
   ========================================================= */

trashBtn.addEventListener(
"click",
trashFile
);


async function trashFile() {

    clearError();

    if (!selectedFile) {

        error(
            "No file selected."
        );

        return;
    }


    if (
        !confirm(
            "Move this file to Google Drive Trash?"
        )
    ) {

        return;
    }


    try {

        status(
            "Moving file to Trash..."
        );


        const response =
        await fetch(

            "https://www.googleapis.com/drive/v3/files/" +
            encodeURIComponent(
                selectedFile.id
            ) +
            "?fields=id,name,trashed",

            {

                method:
                    "PATCH",

                headers: {

                    Authorization:
                        "Bearer " +
                        accessToken,

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        trashed:
                            true

                    })

            }

        );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                JSON.stringify(
                    result,
                    null,
                    2
                )
            );

        }


        status(
            "File moved to Google Drive Trash successfully."
        );


        selectedFile = null;

        newNameInput.value = "";

        selectedFileBox.textContent =
            "No file selected.";

        updateButtons();


    } catch (e) {

        error(
            "Move to Trash failed:\n\n" +
            getError(e)
        );

    }

}


/* =========================================================
   SIGN OUT
   ========================================================= */

signoutBtn.addEventListener(
"click",
function() {

    if (!accessToken) {
        return;
    }


    google.accounts.oauth2.revoke(
        accessToken,
        function() {

            accessToken = null;

            selectedFile = null;

            newNameInput.value = "";

            selectedFileBox.textContent =
                "No file selected.";


            status(
                "Google Drive access revoked."
            );


            updateButtons();

        }
    );

});


/* =========================================================
   ERROR HELPER
   ========================================================= */

function getError(e) {

    if (!e) {
        return "Unknown error.";
    }


    if (e.message) {
        return e.message;
    }


    try {

        return JSON.stringify(
            e,
            null,
            2
        );

    } catch {

        return String(e);

    }

}


/* =========================================================
   START
   ========================================================= */

waitForGoogleAPI();

waitForGIS();

</script>

</body>
</html>
