<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Google Drive Test 5</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #f5f5f5;
    color: #222;
}

.box {
    max-width: 850px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

button {
    padding: 10px 15px;
    margin: 5px 5px 5px 0;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
    background: #1976d2;
    color: white;
}

button:disabled {
    background: #aaa;
    cursor: not-allowed;
}

input[type="text"] {
    padding: 10px;
    width: min(100%, 500px);
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 7px;
    margin: 5px 0;
}

.section {
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #ddd;
}

#status,
#selectedFile,
#error {
    margin-top: 15px;
    padding: 12px;
    border-radius: 7px;
    white-space: pre-wrap;
    word-break: break-word;
}

#status {
    background: #f0f0f0;
}

#selectedFile {
    background: #eef7ff;
}

#error {
    background: #ffe5e5;
    color: #900;
    border: 1px solid #ffaaaa;
    display: none;
}
</style>
</head>

<body>

<div class="box">

<h1>Google Drive Test 5</h1>

<p>
<b>Target Folder:</b> MyWebApps Attachments
</p>

<p>
<b>Folder ID:</b>
1LFkmK8l6dB6HtFlcApI0TW2jgp7cGEGT
</p>

<div id="status">
Loading Google libraries...
</div>

<div id="error"></div>


<div class="section">

<button id="authorizeBtn" disabled>
Authorize Google Drive
</button>

<button id="pickerBtn" disabled>
Select Existing File
</button>

<button id="authorizeFileBtn" disabled>
Authorize Selected File
</button>

<button id="signoutBtn" disabled>
Sign Out
</button>

</div>


<div class="section">

<h2>Selected File</h2>

<div id="selectedFile">
No file selected.
</div>

</div>


<div class="section">

<h2>After Authorization Test</h2>

<input
type="text"
id="newName"
placeholder="New file name"
>

<br>

<button id="renameBtn" disabled>
Rename / Update
</button>

<button id="openBtn" disabled>
Open File
</button>

<button id="trashBtn" disabled>
Move to Trash
</button>

</div>


<script
src="https://apis.google.com/js/api.js"
async
defer>
</script>

<script
src="https://accounts.google.com/gsi/client"
async
defer>
</script>


<script>

/* =========================================================
   CONFIG
   ========================================================= */

const CLIENT_ID =
"203025420924-uvlehfup39hj4st7tpv7vud8uedafr9k.apps.googleusercontent.com";

const API_KEY =
"AIzaSyBSf3HKUR652Kja3l65D91FvCkQSoxgZDY";

const APP_ID =
"46681415809";

const FOLDER_ID =
"1LFkmK8l6dB6HtFlcApI0TW2jgp7cGEGT";

const SCOPES =
"https://www.googleapis.com/auth/drive.file";


/* =========================================================
   STATE
   ========================================================= */

let tokenClient = null;

let accessToken = null;

let pickerReady = false;

let driveReady = false;

let gisReady = false;

let selectedFile = null;


/* =========================================================
   ELEMENTS
   ========================================================= */

const statusBox =
document.getElementById("status");

const errorBox =
document.getElementById("error");

const authorizeBtn =
document.getElementById("authorizeBtn");

const pickerBtn =
document.getElementById("pickerBtn");

const authorizeFileBtn =
document.getElementById("authorizeFileBtn");

const signoutBtn =
document.getElementById("signoutBtn");

const selectedFileBox =
document.getElementById("selectedFile");

const newNameInput =
document.getElementById("newName");

const renameBtn =
document.getElementById("renameBtn");

const openBtn =
document.getElementById("openBtn");

const trashBtn =
document.getElementById("trashBtn");


/* =========================================================
   HELPERS
   ========================================================= */

function setStatus(text) {

    statusBox.textContent = text;

}


function showError(text) {

    errorBox.textContent =
        "ERROR\n\n" + text;

    errorBox.style.display =
        "block";

    console.error(text);

}


function clearError() {

    errorBox.textContent = "";

    errorBox.style.display =
        "none";

}


function getError(error) {

    if (!error) {
        return "Unknown error.";
    }

    if (error.message) {
        return error.message;
    }

    try {

        return JSON.stringify(
            error,
            null,
            2
        );

    } catch {

        return String(error);

    }

}


/* =========================================================
   BUTTON STATE
   ========================================================= */

function updateButtons() {

    authorizeBtn.disabled =
        !gisReady;

    pickerBtn.disabled =
        !pickerReady ||
        !accessToken;

    authorizeFileBtn.disabled =
        !selectedFile ||
        !accessToken;

    signoutBtn.disabled =
        !accessToken;

    renameBtn.disabled =
        !selectedFile ||
        !accessToken;

    openBtn.disabled =
        !selectedFile;

    trashBtn.disabled =
        !selectedFile ||
        !accessToken;

}


/* =========================================================
   GOOGLE API
   ========================================================= */

function waitForGapi() {

    if (
        typeof gapi === "undefined"
    ) {

        setTimeout(
            waitForGapi,
            100
        );

        return;
    }

    gapi.load(
        "client:picker",
        async function() {

            try {

                await gapi.client.load(
                    "https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"
                );

                driveReady = true;

                checkPicker();

            } catch (error) {

                showError(
                    "Drive API failed:\n\n" +
                    getError(error)
                );

            }

        }
    );

}


/* =========================================================
   PICKER LIBRARY
   ========================================================= */

function checkPicker() {

    if (
        typeof google !== "undefined" &&
        google.picker &&
        google.picker.PickerBuilder
    ) {

        pickerReady = true;

        setStatus(
            "Google Drive API and Picker are ready.\n\n" +
            "Click Authorize Google Drive."
        );

        updateButtons();

        return;
    }

    setTimeout(
        checkPicker,
        100
    );

}


/* =========================================================
   GOOGLE IDENTITY SERVICES
   ========================================================= */

function waitForGIS() {

    if (
        typeof google === "undefined" ||
        !google.accounts ||
        !google.accounts.oauth2
    ) {

        setTimeout(
            waitForGIS,
            100
        );

        return;
    }


    try {

        tokenClient =
        google.accounts.oauth2.initTokenClient({

            client_id:
                CLIENT_ID,

            scope:
                SCOPES,

            callback:
                handleToken

        });


        gisReady = true;

        updateButtons();

        setStatus(
            "Google Identity Services ready.\n\n" +
            "Click Authorize Google Drive."
        );

    } catch (error) {

        showError(
            "Google Identity Services failed:\n\n" +
            getError(error)
        );

    }

}


/* =========================================================
   NORMAL AUTHORIZATION
   ========================================================= */

authorizeBtn.addEventListener(
"click",
function() {

    clearError();

    setStatus(
        "Opening Google authorization..."
    );

    tokenClient.requestAccessToken({

        prompt: ""

    });

});


/* =========================================================
   TOKEN
   ========================================================= */

function handleToken(response) {

    console.log(
        "Token:",
        response
    );

    if (response.error) {

        showError(
            JSON.stringify(
                response,
                null,
                2
            )
        );

        return;
    }

    accessToken =
        response.access_token;

    setStatus(
        "Google Drive authorization successful.\n\n" +
        "Access token received."
    );

    updateButtons();

}


/* =========================================================
   OPEN PICKER
   ========================================================= */

pickerBtn.addEventListener(
"click",
function() {

    clearError();

    openPicker();

});


function openPicker() {

    try {

        const docsView =
        new google.picker.DocsView(
            google.picker.ViewId.DOCS
        );

        docsView.setParent(
            FOLDER_ID
        );

        docsView.setIncludeFolders(
            true
        );

        docsView.setSelectFolderEnabled(
            false
        );


        const picker =
        new google.picker.PickerBuilder()

        .setDeveloperKey(
            API_KEY
        )

        .setAppId(
            APP_ID
        )

        .setOAuthToken(
            accessToken
        )

        .addView(
            docsView
        )

        .setCallback(
            pickerCallback
        )

        .build();


        picker.setVisible(
            true
        );


        setStatus(
            "Picker opened.\n\n" +
            "Select the existing Google Drive file."
        );


    } catch (error) {

        showError(
            "Could not open Picker:\n\n" +
            getError(error)
        );

    }

}


/* =========================================================
   PICKER CALLBACK
   ========================================================= */

function pickerCallback(data) {

    console.log(
        "Picker response:",
        data
    );


    if (
        data.action ===
        google.picker.Action.CANCEL
    ) {

        setStatus(
            "Picker cancelled."
        );

        return;
    }


    if (
        data.action !==
        google.picker.Action.PICKED
    ) {

        return;
    }


    const docs =
        data[
            google.picker.Response.DOCUMENTS
        ];


    if (
        !docs ||
        !docs.length
    ) {

        showError(
            "No file returned by Picker."
        );

        return;
    }


    const doc =
        docs[0];


    selectedFile = {

        id:
            doc[
                google.picker.Document.ID
            ],

        name:
            doc[
                google.picker.Document.NAME
            ] || "",

        mimeType:
            doc[
                google.picker.Document.MIME_TYPE
            ] || "",

        url:
            doc[
                google.picker.Document.URL
            ] || ""

    };


    newNameInput.value =
        selectedFile.name;


    selectedFileBox.textContent =
        "File selected.\n\n" +

        "Name: " +
        selectedFile.name +

        "\n\nID: " +
        selectedFile.id +

        "\n\nMIME: " +
        selectedFile.mimeType +

        "\n\nURL: " +
        selectedFile.url;


    setStatus(
        "Existing file selected.\n\n" +
        "Now click 'Authorize Selected File'."
    );


    updateButtons();

}


/* =========================================================
   AUTHORIZE EXISTING FILE
   ========================================================= */

authorizeFileBtn.addEventListener(
"click",
function() {

    if (!selectedFile) {

        showError(
            "First select an existing file."
        );

        return;
    }


    clearError();


    setStatus(
        "Requesting permission for the selected file..."
    );


    /*
       Force Google's consent screen again.
       This is intentional for this test.
    */

    tokenClient.requestAccessToken({

        prompt:
            "consent"

    });

});


/* =========================================================
   CHECK FILE AUTHORIZATION
   ========================================================= */

async function checkFileAuthorization() {

    if (!selectedFile) {
        return;
    }


    try {

        setStatus(
            "Checking file authorization..."
        );


        const response =
        await fetch(

            "https://www.googleapis.com/drive/v3/files/" +

            encodeURIComponent(
                selectedFile.id
            ) +

            "?fields=id,name,mimeType,webViewLink,parents,trashed,isAppAuthorized",

            {

                headers: {

                    Authorization:
                        "Bearer " +
                        accessToken

                }

            }

        );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                JSON.stringify(
                    result,
                    null,
                    2
                )
            );

        }


        selectedFile =
        {
            ...selectedFile,
            ...result
        };


        selectedFileBox.textContent =
            JSON.stringify(
                result,
                null,
                2
            );


        if (
            result.isAppAuthorized === true
        ) {

            setStatus(
                "SUCCESS!\n\n" +
                "This existing file is now authorized for the app.\n\n" +
                "Rename / Update / Trash can now be tested."
            );

        } else {

            setStatus(
                "The file is still NOT authorized for this app.\n\n" +
                "Google returned:\n" +
                "isAppAuthorized = " +
                String(
                    result.isAppAuthorized
                )
            );

        }


        updateButtons();


    } catch (error) {

        showError(
            "Could not check file authorization:\n\n" +
            getError(error)
        );

    }

}


/* =========================================================
   IMPORTANT:
   After consent token arrives, check file
   ========================================================= */

let authorizationTestRunning = false;


/* Replace token callback behavior */

const originalHandleToken =
handleToken;


/*
   Override the callback function used by GIS.
*/

function handleToken(response) {

    console.log(
        "Token response:",
        response
    );


    if (response.error) {

        showError(
            JSON.stringify(
                response,
                null,
                2
            )
        );

        return;
    }


    accessToken =
        response.access_token;


    updateButtons();


    if (
        authorizationTestRunning
    ) {

        authorizationTestRunning =
            false;

        checkFileAuthorization();

        return;

    }


    setStatus(
        "Google Drive authorization successful.\n\n" +
        "Access token received."
    );

}


/*
   Re-bind button specifically for
   existing-file authorization.
*/

authorizeFileBtn.onclick =
function() {

    if (!selectedFile) {

        showError(
            "First select an existing file."
        );

        return;
    }


    clearError();


    authorizationTestRunning =
        true;


    setStatus(
        "Opening Google permission screen for the selected file..."
    );


    tokenClient.requestAccessToken({

        prompt:
            "consent"

    });

};


/* =========================================================
   RENAME
   ========================================================= */

renameBtn.addEventListener(
"click",
async function() {

    clearError();


    if (!selectedFile) {

        showError(
            "No file selected."
        );

        return;
    }


    const newName =
        newNameInput.value.trim();


    if (!newName) {

        showError(
            "Enter a new name."
        );

        return;
    }


    try {

        setStatus(
            "Updating file name..."
        );


        const response =
        await fetch(

            "https://www.googleapis.com/drive/v3/files/" +

            encodeURIComponent(
                selectedFile.id
            ) +

            "?fields=id,name,mimeType,webViewLink,parents",

            {

                method:
                    "PATCH",

                headers: {

                    Authorization:
                        "Bearer " +
                        accessToken,

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        name:
                            newName

                    })

            }

        );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                JSON.stringify(
                    result,
                    null,
                    2
                )
            );

        }


        selectedFile =
        {
            ...selectedFile,
            ...result
        };


        selectedFileBox.textContent =
            JSON.stringify(
                result,
                null,
                2
            );


        setStatus(
            "RENAME SUCCESSFUL."
        );


    } catch (error) {

        showError(
            "Rename failed:\n\n" +
            getError(error)
        );

    }

});


/* =========================================================
   OPEN
   ========================================================= */

openBtn.addEventListener(
"click",
function() {

    if (!selectedFile) {
        return;
    }


    const url =
        selectedFile.webViewLink ||
        selectedFile.url ||
        (
            "https://drive.google.com/open?id=" +
            encodeURIComponent(
                selectedFile.id
            )
        );


    window.open(
        url,
        "_blank"
    );

});


/* =========================================================
   TRASH
   ========================================================= */

trashBtn.addEventListener(
"click",
async function() {

    clearError();


    if (!selectedFile) {

        showError(
            "No file selected."
        );

        return;
    }


    if (
        !confirm(
            "Move this file to Google Drive Trash?"
        )
    ) {

        return;
    }


    try {

        setStatus(
            "Moving file to Trash..."
        );


        const response =
        await fetch(

            "https://www.googleapis.com/drive/v3/files/" +

            encodeURIComponent(
                selectedFile.id
            ) +

            "?fields=id,name,trashed",

            {

                method:
                    "PATCH",

                headers: {

                    Authorization:
                        "Bearer " +
                        accessToken,

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        trashed:
                            true

                    })

            }

        );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                JSON.stringify(
                    result,
                    null,
                    2
                )
            );

        }


        setStatus(
            "TRASH SUCCESSFUL."
        );


        selectedFile =
            null;

        selectedFileBox.textContent =
            "No file selected.";

        newNameInput.value =
            "";

        updateButtons();


    } catch (error) {

        showError(
            "Trash failed:\n\n" +
            getError(error)
        );

    }

});


/* =========================================================
   SIGN OUT
   ========================================================= */

signoutBtn.addEventListener(
"click",
function() {

    if (!accessToken) {
        return;
    }


    google.accounts.oauth2.revoke(
        accessToken,
        function() {

            accessToken =
                null;

            selectedFile =
                null;

            selectedFileBox.textContent =
                "No file selected.";

            newNameInput.value =
                "";

            setStatus(
                "Google Drive access revoked."
            );

            updateButtons();

        }
    );

});


/* =========================================================
   START
   ========================================================= */

waitForGapi();

waitForGIS();

</script>

</body>
</html>
