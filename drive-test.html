<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Google Drive Test 4</title> <style> body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; color: #222; } .box { max-width: 850px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); } h1 { margin-top: 0; } button { padding: 10px 15px; margin: 5px 5px 5px 0; border: 0; border-radius: 7px; cursor: pointer; background: #1976d2; color: white; } button:disabled { background: #aaa; cursor: not-allowed; } input[type="text"] { padding: 10px; width: min(100%, 500px); box-sizing: border-box; border: 1px solid #ccc; border-radius: 7px; margin: 5px 0; } .section { margin-top: 20px; padding-top: 15px; border-top: 1px solid #ddd; } #status { margin-top: 15px; padding: 12px; background: #f0f0f0; border-radius: 7px; white-space: pre-wrap; word-break: break-word; } #error { margin-top: 15px; padding: 12px; background: #ffe5e5; color: #900; border: 1px solid #ffaaaa; border-radius: 7px; white-space: pre-wrap; word-break: break-word; display: none; } #selectedFile { margin-top: 15px; padding: 12px; background: #eef7ff; border-radius: 7px; white-space: pre-wrap; word-break: break-word; } .small { color: #666; font-size: 13px; } </style> </head> <body> <div class="box"> <h1>Google Drive Test 4</h1> <p> <b>Target Folder:</b> MyWebApps Attachments </p> <p> <b>Folder ID:</b> 1LFkmK8l6dB6HtFlcApI0TW2jgp7cGEGT </p> <div id="status"> Loading Google libraries... </div> <div id="error"></div> <div class="section"> <button id="authorizeBtn" disabled> Authorize Google Drive </button> <button id="pickerBtn" disabled> Open Google Picker </button> <button id="signoutBtn" disabled> Sign Out </button> </div> <div class="section"> <h2>Upload File</h2> <input type="file" id="fileInput"> <br> <button id="uploadBtn" disabled> Upload to Drive Folder </button> </div> <div class="section"> <h2>Selected File</h2> <div id="selectedFile"> No file selected. </div> <br> <input type="text" id="newName" placeholder="New file name" > <br> <button id="renameBtn" disabled> Rename / Update </button> <button id="openBtn" disabled> Open File </button> <button id="trashBtn" disabled> Move to Trash </button> </div> <div class="section"> <p class="small"> Google Drive API + Google Picker only. Firebase is not used in this test. </p> </div> </div> <!-- Google API Loader --> <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"> </script> <!-- Google Identity Services --> <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"> </script> <script> /* ========================================================= CONFIGURATION ========================================================= */ const CLIENT_ID = "203025420924-uvlehfup39hj4st7tpv7vud8uedafr9k.apps.googleusercontent.com"; const API_KEY = "AIzaSyBSf3HKUR652Kja3l65D91FvCkQSoxgZDY"; const APP_ID = "46681415809"; const FOLDER_ID = "1LFkmK8l6dB6HtFlcApI0TW2jgp7cGEGT"; const SCOPES = "https://www.googleapis.com/auth/drive.file"; /* ========================================================= VARIABLES ========================================================= */ let tokenClient = null; let accessToken = null; let pickerInited = false; let gisInited = false; let driveInited = false; let selectedFile = null; /* ========================================================= ELEMENTS ========================================================= */ const statusBox = document.getElementById("status"); const errorBox = document.getElementById("error"); const authorizeBtn = document.getElementById("authorizeBtn"); const pickerBtn = document.getElementById("pickerBtn"); const signoutBtn = document.getElementById("signoutBtn"); const uploadBtn = document.getElementById("uploadBtn"); const fileInput = document.getElementById("fileInput"); const selectedFileBox = document.getElementById("selectedFile"); const newNameInput = document.getElementById("newName"); const renameBtn = document.getElementById("renameBtn"); const openBtn = document.getElementById("openBtn"); const trashBtn = document.getElementById("trashBtn"); /* ========================================================= STATUS / ERROR ========================================================= */ function setStatus(message) { statusBox.textContent = message; } function showError(error) { let message = ""; if (error instanceof Error) { message = error.message + "\n\n" + (error.stack || ""); } else if (typeof error === "object") { try { message = JSON.stringify( error, null, 2 ); } catch { message = String(error); } } else { message = String(error); } errorBox.textContent = "ERROR:\n\n" + message; errorBox.style.display = "block"; console.error(error); } function clearError() { errorBox.textContent = ""; errorBox.style.display = "none"; } /* ========================================================= BUTTON STATE ========================================================= */ function updateButtons() { const ready = pickerInited && gisInited && driveInited; authorizeBtn.disabled = !gisInited; pickerBtn.disabled = !ready || !accessToken; uploadBtn.disabled = !ready || !accessToken || !fileInput.files.length; signoutBtn.disabled = !accessToken; renameBtn.disabled = !selectedFile || !accessToken; openBtn.disabled = !selectedFile; trashBtn.disabled = !selectedFile || !accessToken; } /* ========================================================= GOOGLE API LOADED ========================================================= */ function gapiLoaded() { setStatus( "Google API Loader loaded.\n" + "Loading Google client + Picker..." ); try { gapi.load( "client:picker", initializeGoogleAPIs ); } catch (error) { showError(error); } } /* ========================================================= INITIALIZE GOOGLE DRIVE + PICKER ========================================================= */ async function initializeGoogleAPIs() { try { setStatus( "Google client + Picker loaded.\n" + "Loading Google Drive API..." ); await gapi.client.load( "https://www.googleapis.com/discovery/v1/apis/drive/v3/rest" ); driveInited = true; setStatus( "Google Drive API loaded successfully.\n\n" + "Waiting for Google Identity Services..." ); updateButtons(); tryAutoAuthorize(); } catch (error) { showError( "Google Drive API initialization failed:\n\n" + getErrorMessage(error) ); } } /* ========================================================= GIS LOADED ========================================================= */ function gisLoaded() { try { tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPES, callback: handleTokenResponse }); gisInited = true; setStatus( "Google Identity Services loaded.\n" + "Waiting for Google Drive API..." ); updateButtons(); tryAutoAuthorize(); } catch (error) { showError( "Google Identity Services initialization failed:\n\n" + getErrorMessage(error) ); } } /* ========================================================= AUTO AUTHORIZE ========================================================= */ function tryAutoAuthorize() { if ( !gisInited || !driveInited ) { return; } setStatus( "Google libraries loaded successfully.\n\n" + "Click 'Authorize Google Drive' to continue." ); updateButtons(); } /* ========================================================= AUTHORIZATION ========================================================= */ authorizeBtn.addEventListener( "click", function () { clearError(); setStatus( "Opening Google authorization..." ); tokenClient.callback = handleTokenResponse; tokenClient.requestAccessToken({ prompt: "" }); } ); /* ========================================================= TOKEN RESPONSE ========================================================= */ function handleTokenResponse(response) { console.log( "Google token response:", response ); if (response.error) { showError( "Google authorization failed:\n\n" + JSON.stringify( response, null, 2 ) ); setStatus( "Authorization failed." ); return; } accessToken = response.access_token; setStatus( "Google Drive authorization successful.\n\n" + "Access token received." ); updateButtons(); } /* ========================================================= PICKER ========================================================= */ pickerBtn.addEventListener( "click", function () { clearError(); if (!accessToken) { showError( "Please authorize Google Drive first." ); return; } openPicker(); } ); function openPicker() { try { const docsView = new google.picker.DocsView( google.picker.ViewId.DOCS ); docsView.setIncludeFolders(true); docsView.setSelectFolderEnabled(false); docsView.setParent( FOLDER_ID ); const picker = new google.picker.PickerBuilder() .setDeveloperKey( API_KEY ) .setAppId( APP_ID ) .setOAuthToken( accessToken ) .addView( docsView ) .setCallback( pickerCallback ) .build(); picker.setVisible(true); setStatus( "Google Picker opened.\n\n" + "Select a file from MyWebApps Attachments." ); } catch (error) { showError( "Could not open Google Picker:\n\n" + getErrorMessage(error) ); } } /* ========================================================= PICKER CALLBACK ========================================================= */ async function pickerCallback(data) { console.log( "Picker response:", data ); if ( data.action === google.picker.Action.CANCEL ) { setStatus( "Google Picker cancelled." ); return; } if ( data.action !== google.picker.Action.PICKED ) { return; } try { const documents = data[ google.picker.Response.DOCUMENTS ]; if ( !documents || !documents.length ) { showError( "Picker returned no document." ); return; } const doc = documents[0]; const fileId = doc[ google.picker.Document.ID ]; const name = doc[ google.picker.Document.NAME ] || "Unknown"; const mimeType = doc[ google.picker.Document.MIME_TYPE ] || "Unknown"; selectedFile = { id: fileId, name: name, mimeType: mimeType, url: doc[ google.picker.Document.URL ] || "" }; newNameInput.value = selectedFile.name; selectedFileBox.textContent = "Name: " + selectedFile.name + "\n\n" + "ID: " + selectedFile.id + "\n\n" + "MIME: " + selectedFile.mimeType + "\n\n" + "URL: " + selectedFile.url; setStatus( "File selected successfully." ); updateButtons(); /* Get fresh Drive metadata */ const response = await fetch( "https://www.googleapis.com/drive/v3/files/" + encodeURIComponent(fileId) + "?fields=id,name,mimeType,webViewLink,parents,trashed", { headers: { Authorization: "Bearer " + accessToken } } ); const result = await response.json(); if (!response.ok) { throw new Error( JSON.stringify( result, null, 2 ) ); } selectedFile = { ...selectedFile, ...result }; newNameInput.value = selectedFile.name; selectedFileBox.textContent = "Name: " + (selectedFile.name || "") + "\n\nID: " + (selectedFile.id || "") + "\n\nMIME: " + (selectedFile.mimeType || "") + "\n\nParents: " + JSON.stringify( selectedFile.parents || [] ) + "\n\nTrashed: " + String( selectedFile.trashed ) + "\n\nURL: " + ( selectedFile.webViewLink || selectedFile.url || "" ); } catch (error) { showError( "Could not read selected file:\n\n" + getErrorMessage(error) ); } } /* ========================================================= FILE INPUT ========================================================= */ fileInput.addEventListener( "change", function () { updateButtons(); } ); /* ========================================================= UPLOAD ========================================================= */ uploadBtn.addEventListener( "click", uploadFile ); async function uploadFile() { clearError(); const file = fileInput.files[0]; if (!file) { showError( "Please select a local file first." ); return; } if (!accessToken) { showError( "Please authorize Google Drive first." ); return; } try { setStatus( "Uploading file to MyWebApps Attachments..." ); const metadata = { name: file.name, mimeType: file.type || "application/octet-stream", parents: [ FOLDER_ID ] }; const boundary = "-------314159265358979323846"; const delimiter = "\r\n--" + boundary + "\r\n"; const closeDelimiter = "\r\n--" + boundary + "--"; const multipartBody = new Blob( [ delimiter, "Content-Type: application/json; charset=UTF-8\r\n\r\n", JSON.stringify(metadata), delimiter, "Content-Type: " + ( file.type || "application/octet-stream" ) + "\r\n\r\n", file, closeDelimiter ], { type: "multipart/related; boundary=" + boundary } ); const response = await fetch( "https://www.googleapis.com/upload/drive/v3/files" + "?uploadType=multipart" + "&fields=id,name,mimeType,webViewLink,parents", { method: "POST", headers: { Authorization: "Bearer " + accessToken }, body: multipartBody } ); const result = await response.json(); if (!response.ok) { throw new Error( JSON.stringify( result, null, 2 ) ); } selectedFile = result; newNameInput.value = result.name || ""; selectedFileBox.textContent = "Uploaded successfully.\n\n" + "Name: " + (result.name || "") + "\n\nID: " + (result.id || "") + "\n\nMIME: " + (result.mimeType || "") + "\n\nParents: " + JSON.stringify( result.parents || [] ) + "\n\nURL: " + ( result.webViewLink || "" ); setStatus( "UPLOAD SUCCESSFUL.\n\n" + "File uploaded to MyWebApps Attachments." ); fileInput.value = ""; updateButtons(); } catch (error) { showError( "Upload failed:\n\n" + getErrorMessage(error) ); } } /* ========================================================= RENAME / UPDATE ========================================================= */ renameBtn.addEventListener( "click", renameFile ); async function renameFile() { clearError(); if (!selectedFile) { showError( "No file selected." ); return; } const newName = newNameInput.value.trim(); if (!newName) { showError( "Please enter a new file name." ); return; } try { setStatus( "Updating file name..." ); const response = await fetch( "https://www.googleapis.com/drive/v3/files/" + encodeURIComponent( selectedFile.id ) + "?fields=id,name,mimeType,webViewLink,parents", { method: "PATCH", headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" }, body: JSON.stringify( { name: newName } ) } ); const result = await response.json(); if (!response.ok) { throw new Error( JSON.stringify( result, null, 2 ) ); } selectedFile = { ...selectedFile, ...result }; newNameInput.value = result.name; selectedFileBox.textContent = JSON.stringify( result, null, 2 ); setStatus( "File name updated successfully." ); } catch (error) { showError( "Rename / Update failed:\n\n" + getErrorMessage(error) ); } } /* ========================================================= OPEN FILE ========================================================= */ openBtn.addEventListener( "click", function () { if (!selectedFile) { showError( "No file selected." ); return; } const url = selectedFile.webViewLink || selectedFile.url || ( "https://drive.google.com/open?id=" + encodeURIComponent( selectedFile.id ) ); window.open( url, "_blank" ); } ); /* ========================================================= MOVE TO TRASH ========================================================= */ trashBtn.addEventListener( "click", trashFile ); async function trashFile() { clearError(); if (!selectedFile) { showError( "No file selected." ); return; } const confirmed = confirm( "Move this file to Google Drive Trash?" ); if (!confirmed) { return; } try { setStatus( "Moving file to Trash..." ); const response = await fetch( "https://www.googleapis.com/drive/v3/files/" + encodeURIComponent( selectedFile.id ) + "?fields=id,name,trashed", { method: "PATCH", headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" }, body: JSON.stringify( { trashed: true } ) } ); const result = await response.json(); if (!response.ok) { throw new Error( JSON.stringify( result, null, 2 ) ); } setStatus( "File moved to Google Drive Trash successfully." ); selectedFile = null; newNameInput.value = ""; selectedFileBox.textContent = "No file selected."; updateButtons(); } catch (error) { showError( "Move to Trash failed:\n\n" + getErrorMessage(error) ); } } /* ========================================================= SIGN OUT ========================================================= */ signoutBtn.addEventListener( "click", function () { if (!accessToken) { return; } google.accounts.oauth2.revoke( accessToken, function () { accessToken = null; selectedFile = null; selectedFileBox.textContent = "No file selected."; newNameInput.value = ""; setStatus( "Google Drive access revoked." ); updateButtons(); } ); } ); /* ========================================================= ERROR MESSAGE HELPER ========================================================= */ function getErrorMessage(error) { if (!error) { return "Unknown error."; } if ( error.result && error.result.error ) { return JSON.stringify( error.result, null, 2 ); } if ( error.message ) { return error.message; } try { return JSON.stringify( error, null, 2 ); } catch { return String(error); } } /* ========================================================= GLOBAL ERROR HANDLERS ========================================================= */ window.addEventListener( "error", function (event) { showError( "JavaScript Error:\n\n" + event.message ); } ); window.addEventListener( "unhandledrejection", function (event) { showError( "Unhandled Promise Error:\n\n" + getErrorMessage( event.reason ) ); } ); /* Initial state */ updateButtons(); </script> </body> </html>
