<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Drive Test 3</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #f5f7fa;
        color: #222;
    }

    .container {
        max-width: 850px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 14px;
        box-shadow: 0 4px 18px rgba(0,0,0,.10);
    }

    h1 {
        margin-top: 0;
    }

    .info {
        background: #f0f4f8;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 15px;
        line-height: 1.6;
        word-break: break-word;
    }

    .status {
        padding: 12px;
        border-radius: 8px;
        margin: 15px 0;
        background: #fff3cd;
        color: #664d03;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 20px;
    }

    button {
        border: 0;
        padding: 11px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        background: #1976d2;
        color: white;
    }

    button:hover {
        opacity: .9;
    }

    button:disabled {
        opacity: .45;
        cursor: not-allowed;
    }

    .danger {
        background: #d32f2f;
    }

    .secondary {
        background: #616161;
    }

    .success {
        background: #2e7d32;
    }

    .file-box {
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 15px;
        margin-top: 15px;
        display: none;
    }

    .file-row {
        margin: 7px 0;
        word-break: break-word;
    }

    .label {
        font-weight: bold;
    }

    input[type="file"],
    input[type="text"] {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 15px;
    }

    .small {
        font-size: 13px;
        color: #666;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Google Drive Test 3</h1>

    <div class="info">
        <div><strong>Target Folder:</strong> MyWebApps Attachments</div>
        <div><strong>Folder ID:</strong> 1LFkmK8l6dB6HtFlcApI0TW2jgp7cGEGT</div>
    </div>

    <div id="status" class="status">
        Waiting for Google libraries...
    </div>

    <div class="buttons">

        <button id="authorizeBtn" onclick="authorizeGoogle()" disabled>
            Authorize Google Drive
        </button>

        <button id="signOutBtn"
                class="secondary"
                onclick="signOutGoogle()"
                disabled>
            Sign Out
        </button>

        <button id="pickerBtn"
                onclick="openPicker()"
                disabled>
            Open Google Picker
        </button>

    </div>

    <div id="uploadSection">
        <h3>Upload File</h3>

        <input type="file" id="fileInput">

        <button id="uploadBtn"
                class="success"
                onclick="uploadFile()"
                disabled>
            Upload to Drive Folder
        </button>
    </div>

    <div id="fileBox" class="file-box">

        <h3>Selected File</h3>

        <div class="file-row">
            <span class="label">Name:</span>
            <span id="fileName"></span>
        </div>

        <div class="file-row">
            <span class="label">ID:</span>
            <span id="fileId"></span>
        </div>

        <div class="file-row">
            <span class="label">MIME:</span>
            <span id="fileMime"></span>
        </div>

        <div class="file-row">
            <span class="label">URL:</span>
            <span id="fileUrl"></span>
        </div>

        <hr>

        <h3>Rename / Update</h3>

        <input
            type="text"
            id="newFileName"
            placeholder="Enter new file name">

        <button onclick="renameSelectedFile()">
            Rename / Update
        </button>

        <button
            class="secondary"
            onclick="openSelectedFile()">
            Open File
        </button>

        <button
            class="danger"
            onclick="deleteSelectedFile()">
            Delete File
        </button>

    </div>

    <p class="small">
        This test uses Google Drive API + Google Picker only.
        Firebase is not used in this test.
    </p>

</div>


<!-- Google API -->
<script src="https://apis.google.com/js/api.js"
        onload="gapiLoaded()"></script>

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client"
        onload="gisLoaded()"></script>


<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

/*
   اپنی Google Cloud OAuth Client ID یہاں ڈالیں۔
*/
const CLIENT_ID =
    "203025420924-uvlehfup39hj4st7tpv7vud8uedafr9k.apps.googleusercontent.com";


/*
   اپنی Google Cloud API Key یہاں ڈالیں۔
*/
const API_KEY =
    "AIzaSyBSf3HKUR652Kja3l65D91FvCkQSoxgZDY";


/*
   Google Cloud Project Number
*/
const APP_ID =
    "46681415809";


/*
   Target Google Drive folder
*/
const FOLDER_ID =
    "1LFkmK8l6dB6HtFlcApI0TW2jgp7cGEGT";


/*
   Required OAuth scope
*/
const SCOPES =
    "https://www.googleapis.com/auth/drive.file";


/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let tokenClient = null;
let accessToken = null;

let gapiReady = false;
let gisReady = false;
let pickerReady = false;

let selectedFile = null;

let pickerSelectionHandled = false;


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(message, type = "normal") {

    const status = document.getElementById("status");

    status.textContent = message;

    if (type === "success") {
        status.style.background = "#d1e7dd";
        status.style.color = "#0f5132";
    }

    else if (type === "error") {
        status.style.background = "#f8d7da";
        status.style.color = "#842029";
    }

    else if (type === "info") {
        status.style.background = "#cff4fc";
        status.style.color = "#055160";
    }

    else {
        status.style.background = "#fff3cd";
        status.style.color = "#664d03";
    }
}


/* =========================================================
   GOOGLE API LOADED
   ========================================================= */

function gapiLoaded() {

    gapi.load("picker", () => {

        pickerReady = true;

        gapiReady = true;

        updateButtons();

        setStatus(
            "Google API and Picker loaded. Ready.",
            "info"
        );
    });
}


/* =========================================================
   GOOGLE IDENTITY SERVICES LOADED
   ========================================================= */

function gisLoaded() {

    tokenClient =
        google.accounts.oauth2.initTokenClient({

            client_id: CLIENT_ID,

            scope: SCOPES,

            callback: handleTokenResponse

        });

    gisReady = true;

    updateButtons();

    setStatus(
        "Google authorization system loaded.",
        "info"
    );
}


/* =========================================================
   BUTTON STATE
   ========================================================= */

function updateButtons() {

    const authorizeBtn =
        document.getElementById("authorizeBtn");

    const signOutBtn =
        document.getElementById("signOutBtn");

    const pickerBtn =
        document.getElementById("pickerBtn");

    const uploadBtn =
        document.getElementById("uploadBtn");


    if (gisReady) {
        authorizeBtn.disabled = false;
    }

    if (accessToken) {

        authorizeBtn.disabled = false;
        authorizeBtn.textContent = "Refresh Authorization";

        signOutBtn.disabled = false;

        pickerBtn.disabled = !pickerReady;

        uploadBtn.disabled = false;
    }

    else {

        signOutBtn.disabled = true;

        pickerBtn.disabled = true;

        uploadBtn.disabled = true;
    }
}


/* =========================================================
   AUTHORIZE GOOGLE DRIVE
   ========================================================= */

function authorizeGoogle() {

    if (!tokenClient) {

        setStatus(
            "Google authorization system is not ready yet.",
            "error"
        );

        return;
    }


    setStatus(
        "Opening Google authorization...",
        "info"
    );


    /*
       prompt: ""

       اگر پہلے سے permission موجود ہے تو
       Google غیرضروری account/consent screen
       نہیں دکھائے گا۔

       یہ Google کے موجودہ JavaScript OAuth
       pattern کے مطابق ہے۔
    */

    tokenClient.requestAccessToken({
        prompt: ""
    });
}


/* =========================================================
   TOKEN RESPONSE
   ========================================================= */

function handleTokenResponse(response) {

    console.log("Google token response:", response);


    /*
       اگر error آیا ہے
    */

    if (response.error) {

        setStatus(
            "Google authorization error:\n" +
            JSON.stringify(response, null, 2),
            "error"
        );

        return;
    }


    /*
       Access token حاصل ہو گیا
    */

    if (!response.access_token) {

        setStatus(
            "Google did not return an access token.",
            "error"
        );

        return;
    }


    accessToken = response.access_token;


    setStatus(
        "Google Drive authorized successfully.",
        "success"
    );


    updateButtons();
}


/* =========================================================
   SIGN OUT
   ========================================================= */

function signOutGoogle() {

    if (!accessToken) {
        return;
    }


    google.accounts.oauth2.revoke(
        accessToken,
        () => {

            accessToken = null;

            selectedFile = null;

            hideSelectedFile();

            updateButtons();

            setStatus(
                "Google Drive authorization removed from this page.",
                "info"
            );
        }
    );
}


/* =========================================================
   CHECK AUTH
   ========================================================= */

function requireAuth() {

    if (!accessToken) {

        setStatus(
            "Please authorize Google Drive first.",
            "error"
        );

        return false;
    }

    return true;
}


/* =========================================================
   OPEN GOOGLE PICKER
   ========================================================= */

function openPicker() {

    if (!requireAuth()) {
        return;
    }

    if (!pickerReady) {

        setStatus(
            "Google Picker is not ready yet.",
            "error"
        );

        return;
    }


    pickerSelectionHandled = false;


    setStatus(
        "Opening Google Picker...",
        "info"
    );


    const docsView =
        new google.picker.DocsView()
            .setIncludeFolders(false)
            .setSelectFolderEnabled(false)
            .setParent(FOLDER_ID);


    const picker =
        new google.picker.PickerBuilder()

            .setDeveloperKey(API_KEY)

            .setAppId(APP_ID)

            .setOAuthToken(accessToken)

            .addView(docsView)

            .setCallback(pickerCallback)

            .setTitle("Select a file from MyWebApps Attachments")

            .build();


    picker.setVisible(true);
}


/* =========================================================
   PICKER CALLBACK
   ========================================================= */

function pickerCallback(data) {

    console.log("Picker callback:", data);


    /*
       File selected
    */

    if (
        data.action ===
        google.picker.Action.PICKED
    ) {

        pickerSelectionHandled = true;


        if (
            data.docs &&
            data.docs.length > 0
        ) {

            const doc = data.docs[0];


            selectedFile = {

                id:
                    doc.id || "",

                name:
                    doc.name || "",

                mimeType:
                    doc.mimeType || "",

                url:
                    doc.url || "",

                webViewLink:
                    doc.url || ""

            };


            showSelectedFile();


            setStatus(
                "File selected successfully.",
                "success"
            );
        }


        return;
    }


    /*
       Cancel event

       اگر PICKED پہلے آ چکا ہو تو
       CANCEL status کو overwrite نہیں کرے گا۔
    */

    if (
        data.action ===
        google.picker.Action.CANCEL
    ) {

        if (pickerSelectionHandled) {
            return;
        }


        setStatus(
            "Picker was cancelled.",
            "info"
        );

        return;
    }
}


/* =========================================================
   SHOW SELECTED FILE
   ========================================================= */

function showSelectedFile() {

    if (!selectedFile) {
        return;
    }


    document.getElementById("fileBox")
        .style.display = "block";


    document.getElementById("fileName")
        .textContent =
        selectedFile.name;


    document.getElementById("fileId")
        .textContent =
        selectedFile.id;


    document.getElementById("fileMime")
        .textContent =
        selectedFile.mimeType;


    document.getElementById("fileUrl")
        .textContent =
        selectedFile.webViewLink ||
        selectedFile.url;


    document.getElementById("newFileName")
        .value =
        selectedFile.name;
}


/* =========================================================
   HIDE SELECTED FILE
   ========================================================= */

function hideSelectedFile() {

    document.getElementById("fileBox")
        .style.display = "none";
}


/* =========================================================
   UPLOAD FILE
   ========================================================= */

async function uploadFile() {

    if (!requireAuth()) {
        return;
    }


    const input =
        document.getElementById("fileInput");


    if (
        !input.files ||
        input.files.length === 0
    ) {

        setStatus(
            "Please select a file first.",
            "error"
        );

        return;
    }


    const file = input.files[0];


    setStatus(
        "Uploading file to MyWebApps Attachments...",
        "info"
    );


    try {

        const metadata = {

            name: file.name,

            parents: [
                FOLDER_ID
            ]

        };


        const boundary =
            "-------314159265358979323846";


        const delimiter =
            "\r\n--" +
            boundary +
            "\r\n";


        const closeDelimiter =
            "\r\n--" +
            boundary +
            "--";


        const body =
            delimiter +
            "Content-Type: application/json; charset=UTF-8\r\n\r\n" +
            JSON.stringify(metadata) +
            delimiter +
            "Content-Type: " +
            (file.type || "application/octet-stream") +
            "\r\n\r\n";


        const multipartBody =
            new Blob(
                [
                    body,
                    file,
                    closeDelimiter
                ],
                {
                    type:
                    "multipart/related; boundary=" +
                    boundary
                }
            );


        const response =
            await fetch(
                "https://www.googleapis.com/upload/drive/v3/files" +
                "?uploadType=multipart" +
                "&fields=id,name,mimeType,webViewLink,parents",
                {

                    method: "POST",

                    headers: {

                        "Authorization":
                            "Bearer " +
                            accessToken

                    },

                    body:
                        multipartBody

                }
            );


        const result =
            await response.json();


        console.log(
            "Upload response:",
            result
        );


        if (!response.ok) {

            throw new Error(
                result.error?.message ||
                "Upload failed."
            );
        }


        selectedFile = {

            id:
                result.id,

            name:
                result.name,

            mimeType:
                result.mimeType,

            url:
                result.webViewLink || "",

            webViewLink:
                result.webViewLink || ""

        };


        showSelectedFile();


        setStatus(
            "File uploaded successfully.\n\n" +
            "File: " +
            result.name +
            "\nID: " +
            result.id,
            "success"
        );


        input.value = "";

    }

    catch (error) {

        console.error(error);


        setStatus(
            "Upload failed:\n" +
            error.message,
            "error"
        );
    }
}


/* =========================================================
   RENAME / UPDATE FILE
   ========================================================= */

async function renameSelectedFile() {

    if (!requireAuth()) {
        return;
    }


    if (!selectedFile) {

        setStatus(
            "Please select a file first.",
            "error"
        );

        return;
    }


    const newName =
        document.getElementById("newFileName")
            .value
            .trim();


    if (!newName) {

        setStatus(
            "Please enter a new file name.",
            "error"
        );

        return;
    }


    setStatus(
        "Updating file name...",
        "info"
    );


    try {

        const response =
            await fetch(
                "https://www.googleapis.com/drive/v3/files/" +
                encodeURIComponent(selectedFile.id),
                {

                    method: "PATCH",

                    headers: {

                        "Authorization":
                            "Bearer " +
                            accessToken,

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({
                            name: newName
                        })

                }
            );


        const result =
            await response.json();


        console.log(
            "Rename response:",
            result
        );


        if (!response.ok) {

            throw new Error(
                result.error?.message ||
                "Rename failed."
            );
        }


        selectedFile.name =
            result.name ||
            newName;


        showSelectedFile();


        setStatus(
            "File renamed successfully:\n" +
            selectedFile.name,
            "success"
        );

    }

    catch (error) {

        console.error(error);


        setStatus(
            "Rename failed:\n" +
            error.message,
            "error"
        );
    }
}


/* =========================================================
   OPEN SELECTED FILE
   ========================================================= */

function openSelectedFile() {

    if (!selectedFile) {

        setStatus(
            "Please select a file first.",
            "error"
        );

        return;
    }


    let url =
        selectedFile.webViewLink ||
        selectedFile.url;


    if (!url) {

        url =
            "https://drive.google.com/open?id=" +
            encodeURIComponent(
                selectedFile.id
            );
    }


    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );
}


/* =========================================================
   DELETE SELECTED FILE
   ========================================================= */

async function deleteSelectedFile() {

    if (!requireAuth()) {
        return;
    }


    if (!selectedFile) {

        setStatus(
            "Please select a file first.",
            "error"
        );

        return;
    }


    const confirmed =
        confirm(
            "Delete this file from Google Drive?\n\n" +
            selectedFile.name
        );


    if (!confirmed) {
        return;
    }


    setStatus(
        "Deleting file...",
        "info"
    );


    try {

        const response =
            await fetch(
                "https://www.googleapis.com/drive/v3/files/" +
                encodeURIComponent(
                    selectedFile.id
                ),
                {

                    method: "DELETE",

                    headers: {

                        "Authorization":
                            "Bearer " +
                            accessToken

                    }

                }
            );


        if (!response.ok) {

            let errorData = {};

            try {
                errorData =
                    await response.json();
            }

            catch (e) {}


            throw new Error(
                errorData.error?.message ||
                "Delete failed."
            );
        }


        const deletedName =
            selectedFile.name;


        selectedFile = null;


        hideSelectedFile();


        setStatus(
            "File deleted successfully:\n" +
            deletedName,
            "success"
        );

    }

    catch (error) {

        console.error(error);


        setStatus(
            "Delete failed:\n" +
            error.message,
            "error"
        );
    }
}


/* =========================================================
   INITIAL PAGE STATUS
   ========================================================= */

window.addEventListener(
    "load",
    () => {

        setStatus(
            "Loading Google Drive authorization system...",
            "info"
        );

    }
);

</script>

</body>
</html>
