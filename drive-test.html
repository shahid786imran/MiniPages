<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Google Drive Test 3</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    color: #222;
}

.container {
    max-width: 850px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,.10);
}

h1 {
    margin-top: 0;
}

.info {
    background: #f0f4f8;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    line-height: 1.6;
    word-break: break-word;
}

.status {
    padding: 12px;
    border-radius: 8px;
    margin: 15px 0;
    background: #fff3cd;
    color: #664d03;
    white-space: pre-wrap;
    word-break: break-word;
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
}

button {
    border: 0;
    padding: 11px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    background: #1976d2;
    color: white;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.secondary {
    background: #616161;
}

.success {
    background: #2e7d32;
}

.danger {
    background: #d32f2f;
}

input[type="file"],
input[type="text"] {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

.file-box {
    display: none;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    margin-top: 20px;
}

.file-row {
    margin: 8px 0;
    word-break: break-word;
}

.label {
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Google Drive Test 3</h1>

<div class="info">
    <div>
        <strong>Target Folder:</strong>
        MyWebApps Attachments
    </div>

    <div>
        <strong>Folder ID:</strong>
        1LFkmK8l6dB6HtFlcApI0TW2jgp7cGEGT
    </div>
</div>

<div id="status" class="status">
    Loading Google libraries...
</div>

<div class="buttons">

    <button id="authorizeBtn"
            onclick="authorizeGoogle()"
            disabled>
        Authorize Google Drive
    </button>

    <button id="signOutBtn"
            class="secondary"
            onclick="signOutGoogle()"
            disabled>
        Sign Out
    </button>

    <button id="pickerBtn"
            onclick="openPicker()"
            disabled>
        Open Google Picker
    </button>

</div>

<h3>Upload File</h3>

<input type="file" id="fileInput">

<button id="uploadBtn"
        class="success"
        onclick="uploadFile()"
        disabled>
    Upload to Drive Folder
</button>


<div id="fileBox" class="file-box">

    <h3>Selected File</h3>

    <div class="file-row">
        <span class="label">Name:</span>
        <span id="fileName"></span>
    </div>

    <div class="file-row">
        <span class="label">ID:</span>
        <span id="fileId"></span>
    </div>

    <div class="file-row">
        <span class="label">MIME:</span>
        <span id="fileMime"></span>
    </div>

    <div class="file-row">
        <span class="label">URL:</span>
        <span id="fileUrl"></span>
    </div>

    <hr>

    <h3>Rename / Update</h3>

    <input
        type="text"
        id="newFileName"
        placeholder="Enter new file name">

    <br>

    <button onclick="renameSelectedFile()">
        Rename / Update
    </button>

    <button
        class="secondary"
        onclick="openSelectedFile()">
        Open File
    </button>

    <button
        class="danger"
        onclick="deleteSelectedFile()">
        Delete File
    </button>

</div>

</div>


<!-- Google API -->
<script
    src="https://apis.google.com/js/api.js"
    onload="gapiLoaded()">
</script>


<!-- Google Identity Services -->
<script
    src="https://accounts.google.com/gsi/client"
    onload="gisLoaded()">
</script>


<script>

/* =========================================================
   CONFIG
   ========================================================= */

const CLIENT_ID =
    "203025420924-uvlehfup39hj4st7tpv7vud8uedafr9k.apps.googleusercontent.com";

const API_KEY =
    "AIzaSyBSf3HKUR652Kja3l65D91FvCkQSoxgZDY";

const APP_ID =
    "46681415809";

const FOLDER_ID =
    "1LFkmK8l6dB6HtFlcApI0TW2jgp7cGEGT";

const SCOPES =
    "https://www.googleapis.com/auth/drive.file";


/* =========================================================
   VARIABLES
   ========================================================= */

let tokenClient = null;

let accessToken = null;

let gapiReady = false;

let gisReady = false;

let pickerReady = false;

let selectedFile = null;

let pickerSelectionHandled = false;


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(message, type = "normal") {

    const status =
        document.getElementById("status");

    status.textContent = message;


    if (type === "success") {

        status.style.background = "#d1e7dd";
        status.style.color = "#0f5132";

    }

    else if (type === "error") {

        status.style.background = "#f8d7da";
        status.style.color = "#842029";

    }

    else if (type === "info") {

        status.style.background = "#cff4fc";
        status.style.color = "#055160";

    }

    else {

        status.style.background = "#fff3cd";
        status.style.color = "#664d03";
    }
}


/* =========================================================
   GAPI LOADED
   ========================================================= */

function gapiLoaded() {

    console.log("GAPI script loaded.");

    gapi.load("picker", function() {

        console.log("Google Picker loaded.");

        gapiReady = true;
        pickerReady = true;

        updateButtons();

        checkReady();

    });
}


/* =========================================================
   GIS LOADED
   ========================================================= */

function gisLoaded() {

    console.log("Google Identity Services loaded.");

    try {

        tokenClient =
            google.accounts.oauth2.initTokenClient({

                client_id: CLIENT_ID,

                scope: SCOPES,

                callback:
                    handleTokenResponse

            });

        gisReady = true;

        updateButtons();

        checkReady();

    }

    catch (error) {

        console.error(error);

        setStatus(
            "Google authorization initialization failed:\n" +
            error.message,
            "error"
        );
    }
}


/* =========================================================
   CHECK ALL LIBRARIES
   ========================================================= */

function checkReady() {

    if (gapiReady && gisReady) {

        setStatus(
            "Google Drive is ready. Click 'Authorize Google Drive'.",
            "success"
        );

        return;
    }

    if (gisReady && !gapiReady) {

        setStatus(
            "Google authorization loaded. Waiting for Google Picker...",
            "info"
        );

        return;
    }

    if (gapiReady && !gisReady) {

        setStatus(
            "Google Picker loaded. Waiting for Google authorization...",
            "info"
        );

        return;
    }

    setStatus(
        "Loading Google libraries...",
        "info"
    );
}


/* =========================================================
   BUTTONS
   ========================================================= */

function updateButtons() {

    const authorizeBtn =
        document.getElementById("authorizeBtn");

    const signOutBtn =
        document.getElementById("signOutBtn");

    const pickerBtn =
        document.getElementById("pickerBtn");

    const uploadBtn =
        document.getElementById("uploadBtn");


    authorizeBtn.disabled =
        !gisReady;


    pickerBtn.disabled =
        !accessToken || !pickerReady;


    uploadBtn.disabled =
        !accessToken;


    signOutBtn.disabled =
        !accessToken;


    if (accessToken) {

        authorizeBtn.textContent =
            "Google Drive Authorized";

    }

    else {

        authorizeBtn.textContent =
            "Authorize Google Drive";
    }
}


/* =========================================================
   AUTHORIZATION
   ========================================================= */

function authorizeGoogle() {

    if (!tokenClient) {

        setStatus(
            "Google authorization is not ready.",
            "error"
        );

        return;
    }


    setStatus(
        "Opening Google authorization...",
        "info"
    );


    /*
       Existing permission ہو تو
       Google دوبارہ consent screen
       نہیں دکھائے گا۔
    */

    tokenClient.requestAccessToken({
        prompt: ""
    });
}


/* =========================================================
   TOKEN RESPONSE
   ========================================================= */

function handleTokenResponse(response) {

    console.log(
        "Google OAuth response:",
        response
    );


    if (response.error) {

        console.error(
            "OAuth error:",
            response
        );


        /*
           اگر پہلے سے permission موجود نہیں
           تو ایک بار consent screen دکھائیں۔
        */

        if (
            response.error ===
                "interaction_required"
        ) {

            setStatus(
                "Google permission is required. Opening consent...",
                "info"
            );


            tokenClient.requestAccessToken({
                prompt: "consent"
            });

            return;
        }


        setStatus(
            "Google authorization failed:\n" +
            JSON.stringify(
                response,
                null,
                2
            ),
            "error"
        );

        return;
    }


    if (!response.access_token) {

        setStatus(
            "Google did not return an access token.",
            "error"
        );

        return;
    }


    accessToken =
        response.access_token;


    console.log(
        "Access token received."
    );


    updateButtons();


    setStatus(
        "Google Drive authorized successfully.",
        "success"
    );
}


/* =========================================================
   SIGN OUT
   ========================================================= */

function signOutGoogle() {

    if (!accessToken) {
        return;
    }


    google.accounts.oauth2.revoke(
        accessToken,
        function() {

            accessToken = null;

            selectedFile = null;

            hideSelectedFile();

            updateButtons();

            setStatus(
                "Google Drive authorization removed.",
                "info"
            );

        }
    );
}


/* =========================================================
   AUTH CHECK
   ========================================================= */

function requireAuth() {

    if (!accessToken) {

        setStatus(
            "Please authorize Google Drive first.",
            "error"
        );

        return false;
    }

    return true;
}


/* =========================================================
   PICKER
   ========================================================= */

function openPicker() {

    if (!requireAuth()) {
        return;
    }


    pickerSelectionHandled = false;


    setStatus(
        "Opening Google Picker...",
        "info"
    );


    const docsView =
        new google.picker.DocsView()

            .setIncludeFolders(false)

            .setSelectFolderEnabled(false)

            .setParent(FOLDER_ID);


    const picker =
        new google.picker.PickerBuilder()

            .setDeveloperKey(API_KEY)

            .setAppId(APP_ID)

            .setOAuthToken(accessToken)

            .addView(docsView)

            .setTitle(
                "Select a file from MyWebApps Attachments"
            )

            .setCallback(
                pickerCallback
            )

            .build();


    picker.setVisible(true);
}


/* =========================================================
   PICKER CALLBACK
   ========================================================= */

function pickerCallback(data) {

    console.log(
        "Picker callback:",
        data
    );


    if (
        data.action ===
        google.picker.Action.PICKED
    ) {

        pickerSelectionHandled = true;


        if (
            data.docs &&
            data.docs.length > 0
        ) {

            const doc =
                data.docs[0];


            selectedFile = {

                id:
                    doc.id || "",

                name:
                    doc.name || "",

                mimeType:
                    doc.mimeType || "",

                url:
                    doc.url || "",

                webViewLink:
                    doc.url || ""

            };


            showSelectedFile();


            setStatus(
                "File selected successfully.",
                "success"
            );
        }

        return;
    }


    if (
        data.action ===
        google.picker.Action.CANCEL
    ) {

        if (pickerSelectionHandled) {
            return;
        }


        setStatus(
            "Picker was cancelled.",
            "info"
        );
    }
}


/* =========================================================
   SHOW FILE
   ========================================================= */

function showSelectedFile() {

    if (!selectedFile) {
        return;
    }


    document.getElementById("fileBox")
        .style.display = "block";


    document.getElementById("fileName")
        .textContent =
        selectedFile.name;


    document.getElementById("fileId")
        .textContent =
        selectedFile.id;


    document.getElementById("fileMime")
        .textContent =
        selectedFile.mimeType;


    document.getElementById("fileUrl")
        .textContent =
        selectedFile.webViewLink ||
        selectedFile.url;


    document.getElementById("newFileName")
        .value =
        selectedFile.name;
}


/* =========================================================
   HIDE FILE
   ========================================================= */

function hideSelectedFile() {

    document.getElementById("fileBox")
        .style.display = "none";
}


/* =========================================================
   UPLOAD
   ========================================================= */

async function uploadFile() {

    if (!requireAuth()) {
        return;
    }


    const input =
        document.getElementById("fileInput");


    if (
        !input.files ||
        input.files.length === 0
    ) {

        setStatus(
            "Please select a file first.",
            "error"
        );

        return;
    }


    const file =
        input.files[0];


    setStatus(
        "Uploading file...",
        "info"
    );


    try {

        const metadata = {

            name:
                file.name,

            parents:
                [FOLDER_ID]

        };


        const boundary =
            "-------314159265358979323846";


        const delimiter =
            "\r\n--" +
            boundary +
            "\r\n";


        const closeDelimiter =
            "\r\n--" +
            boundary +
            "--";


        const body =
            delimiter +
            "Content-Type: application/json; charset=UTF-8\r\n\r\n" +
            JSON.stringify(metadata) +
            delimiter +
            "Content-Type: " +
            (file.type ||
             "application/octet-stream") +
            "\r\n\r\n";


        const multipartBody =
            new Blob(
                [
                    body,
                    file,
                    closeDelimiter
                ],
                {
                    type:
                        "multipart/related; boundary=" +
                        boundary
                }
            );


        const response =
            await fetch(
                "https://www.googleapis.com/upload/drive/v3/files" +
                "?uploadType=multipart" +
                "&fields=id,name,mimeType,webViewLink,parents",
                {

                    method: "POST",

                    headers: {

                        Authorization:
                            "Bearer " +
                            accessToken

                    },

                    body:
                        multipartBody

                }
            );


        const result =
            await response.json();


        console.log(
            "Upload result:",
            result
        );


        if (!response.ok) {

            throw new Error(
                result.error?.message ||
                "Upload failed."
            );
        }


        selectedFile = {

            id:
                result.id,

            name:
                result.name,

            mimeType:
                result.mimeType,

            url:
                result.webViewLink || "",

            webViewLink:
                result.webViewLink || ""

        };


        showSelectedFile();


        setStatus(
            "File uploaded successfully.\n\n" +
            "Name: " +
            result.name +
            "\nID: " +
            result.id,
            "success"
        );


        input.value = "";

    }

    catch (error) {

        console.error(error);

        setStatus(
            "Upload failed:\n" +
            error.message,
            "error"
        );
    }
}


/* =========================================================
   RENAME
   ========================================================= */

async function renameSelectedFile() {

    if (!requireAuth()) {
        return;
    }


    if (!selectedFile) {

        setStatus(
            "Please select a file first.",
            "error"
        );

        return;
    }


    const newName =
        document.getElementById("newFileName")
            .value
            .trim();


    if (!newName) {

        setStatus(
            "Please enter a new file name.",
            "error"
        );

        return;
    }


    setStatus(
        "Updating file name...",
        "info"
    );


    try {

        const response =
            await fetch(
                "https://www.googleapis.com/drive/v3/files/" +
                encodeURIComponent(
                    selectedFile.id
                ),
                {

                    method: "PATCH",

                    headers: {

                        Authorization:
                            "Bearer " +
                            accessToken,

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({
                            name: newName
                        })

                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error?.message ||
                "Rename failed."
            );
        }


        selectedFile.name =
            result.name ||
            newName;


        showSelectedFile();


        setStatus(
            "File renamed successfully.",
            "success"
        );

    }

    catch (error) {

        console.error(error);

        setStatus(
            "Rename failed:\n" +
            error.message,
            "error"
        );
    }
}


/* =========================================================
   OPEN FILE
   ========================================================= */

function openSelectedFile() {

    if (!selectedFile) {

        setStatus(
            "Please select a file first.",
            "error"
        );

        return;
    }


    const url =
        selectedFile.webViewLink ||
        selectedFile.url ||
        (
            "https://drive.google.com/open?id=" +
            encodeURIComponent(
                selectedFile.id
            )
        );


    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );
}


/* =========================================================
   DELETE
   ========================================================= */

async function deleteSelectedFile() {

    if (!requireAuth()) {
        return;
    }


    if (!selectedFile) {

        setStatus(
            "Please select a file first.",
            "error"
        );

        return;
    }


    if (
        !confirm(
            "Delete this file from Google Drive?\n\n" +
            selectedFile.name
        )
    ) {
        return;
    }


    setStatus(
        "Deleting file...",
        "info"
    );


    try {

        const response =
            await fetch(
                "https://www.googleapis.com/drive/v3/files/" +
                encodeURIComponent(
                    selectedFile.id
                ),
                {

                    method: "DELETE",

                    headers: {

                        Authorization:
                            "Bearer " +
                            accessToken

                    }

                }
            );


        if (!response.ok) {

            let errorData = {};

            try {
                errorData =
                    await response.json();
            }

            catch (e) {}


            throw new Error(
                errorData.error?.message ||
                "Delete failed."
            );
        }


        const deletedName =
            selectedFile.name;


        selectedFile = null;


        hideSelectedFile();


        setStatus(
            "File deleted successfully:\n" +
            deletedName,
            "success"
        );

    }

    catch (error) {

        console.error(error);

        setStatus(
            "Delete failed:\n" +
            error.message,
            "error"
        );
    }
}


/* =========================================================
   IMPORTANT:
   یہاں window.load سے status دوبارہ
   "Loading..." نہیں کیا جا رہا۔
   ========================================================= */

</script>

</body>
</html>
