<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Google Drive Test 7</title>

<script src="https://apis.google.com/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: #f5f5f5;
        color: #222;
    }

    h1 {
        margin-bottom: 8px;
    }

    .box {
        background: white;
        padding: 16px;
        margin: 12px 0;
        border-radius: 10px;
        box-shadow: 0 1px 5px rgba(0,0,0,.12);
    }

    button {
        padding: 10px 14px;
        margin: 5px 4px 5px 0;
        border: 0;
        border-radius: 7px;
        cursor: pointer;
        background: #1a73e8;
        color: white;
        font-size: 14px;
    }

    button:disabled {
        background: #aaa;
        cursor: not-allowed;
    }

    #log {
        white-space: pre-wrap;
        background: #111;
        color: #eee;
        padding: 14px;
        border-radius: 8px;
        min-height: 260px;
        font-family: Consolas, monospace;
        font-size: 13px;
        overflow-wrap: anywhere;
    }

    .fileInfo {
        line-height: 1.7;
        overflow-wrap: anywhere;
    }

    .success {
        color: green;
        font-weight: bold;
    }

    .error {
        color: #d93025;
        font-weight: bold;
    }

    .warning {
        color: #b06000;
        font-weight: bold;
    }

    .stateBox {
        background: #fff7d6;
        border: 1px solid #e2c35a;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 12px;
    }

    code {
        overflow-wrap: anywhere;
    }
</style>
</head>

<body>

<h1>Google Drive Test 7</h1>

<div class="box">

    <b>Google Account:</b>
    shahid786imran1@gmail.com

    <br><br>

    <b>Target Folder:</b>
    MyWebApps Attachments

    <br>

    <b>Folder ID:</b>
    1LFkmK8l6dB6HtFlcApI0TW2jgp7cGEGT

</div>


<div id="openWithBox"
     class="stateBox"
     style="display:none;">

    <b>Google Drive Open With request detected.</b>

    <br><br>

    File information was received from Google Drive.

</div>


<div class="box">

    <button id="authBtn"
            onclick="authorizeGoogle()">
        Authorize Google Drive
    </button>

    <button id="pickerBtn"
            onclick="openPicker()"
            disabled>
        Select Existing File
    </button>

    <button id="checkBtn"
            onclick="checkAuthorization()"
            disabled>
        Check Authorization
    </button>

    <button id="renameBtn"
            onclick="renameFile()"
            disabled>
        Rename File
    </button>

    <button id="trashBtn"
            onclick="trashFile()"
            disabled>
        Move to Trash
    </button>

    <button onclick="signOut()">
        Sign Out
    </button>

</div>


<div class="box">

    <h3>Selected File</h3>

    <div id="fileInfo"
         class="fileInfo">
        No file selected.
    </div>

</div>


<div class="box">

    <h3>Status / Test Log</h3>

    <div id="log"></div>

</div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const CLIENT_ID =
"203025420924-uvlehfup39hj4st7tpv7vud8uedafr9k.apps.googleusercontent.com";

const API_KEY =
"AIzaSyBSf3HKUR652Kja3l65D91FvCkQSoxgZDY";

const APP_ID =
"46681415809";

const FOLDER_ID =
"1LFkmK8l6dB6HtFlcApI0TW2jgp7cGEGT";

const GOOGLE_ACCOUNT =
"shahid786imran1@gmail.com";


/*
    drive.file
    = per-file Drive access

    drive.install
    = Drive "Open with" integration
*/

const SCOPES =
    "https://www.googleapis.com/auth/drive.file " +
    "https://www.googleapis.com/auth/drive.install";


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let tokenClient = null;

let accessToken = null;

let pickerReady = false;

let selectedFile = null;

let openWithState = null;


/* =========================================================
   LOGGING
========================================================= */

function log(message, type = "") {

    const box =
        document.getElementById("log");

    const line =
        document.createElement("div");

    if (type) {
        line.className = type;
    }

    line.textContent =
        new Date().toLocaleTimeString() +
        "  " +
        message;

    box.appendChild(line);

    box.scrollTop =
        box.scrollHeight;
}


/* =========================================================
   INITIALIZATION
========================================================= */

window.addEventListener("load", async function () {

    log("Loading Google libraries...");

    try {

        await loadPicker();

        log(
            "Google Picker library loaded.",
            "success"
        );


        tokenClient =
            google.accounts.oauth2.initTokenClient({

                client_id: CLIENT_ID,

                scope: SCOPES,

                callback: handleToken

            });


        log(
            "Google authorization client initialized.",
            "success"
        );


        detectOpenWithRequest();

    } catch (error) {

        log(
            "Initialization failed:\n" +
            error.message,
            "error"
        );

    }

});


/* =========================================================
   LOAD PICKER
========================================================= */

function loadPicker() {

    return new Promise((resolve, reject) => {

        if (!window.gapi) {

            reject(
                new Error(
                    "Google API library not available."
                )
            );

            return;
        }


        gapi.load(
            "picker",
            function () {

                pickerReady = true;

                resolve();

            }
        );

    });

}


/* =========================================================
   DETECT GOOGLE DRIVE OPEN WITH
========================================================= */

function detectOpenWithRequest() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const stateParameter =
        params.get("state");


    if (!stateParameter) {

        log(
            "No Google Drive Open With state detected."
        );

        return;
    }


    log(
        "Google Drive Open With state detected.",
        "success"
    );


    try {

        /*
            state is URL encoded.
        */

        const decoded =
            decodeURIComponent(
                stateParameter
            );


        openWithState =
            JSON.parse(decoded);


        log(
            "Open With state:\n" +
            JSON.stringify(
                openWithState,
                null,
                2
            ),
            "success"
        );


        document.getElementById(
            "openWithBox"
        ).style.display = "block";


        /*
            Google Drive app-specific files:
                ids

            Google Workspace files:
                exportIds
        */

        let fileIds = [];


        let isWorkspaceExport = false;


        if (
            Array.isArray(
                openWithState.ids
            )
        ) {

            fileIds =
                openWithState.ids;

        }


        if (
            Array.isArray(
                openWithState.exportIds
            )
        ) {

            if (
                openWithState.exportIds.length
            ) {

                fileIds =
                    openWithState.exportIds;

                isWorkspaceExport = true;

            }

        }


        if (!fileIds.length) {

            log(
                "No file ID was received in state.",
                "error"
            );

            return;
        }


        /*
            We test the first file.
        */

        const fileId =
            fileIds[0];


        /*
            Get resource key for this file,
            if Google supplied one.
        */

        let resourceKey = null;


        if (
            openWithState.resourceKeys &&
            typeof openWithState.resourceKeys === "object"
        ) {

            resourceKey =
                openWithState.resourceKeys[fileId]
                || null;

        }


        selectedFile = {

            id: fileId,

            resourceKey: resourceKey,

            name:
                "File received from Google Drive",

            mimeType: "",

            url: "",

            isWorkspaceExport:
                isWorkspaceExport

        };


        showSelectedFile();


        log(
            "File ID received:\n" +
            fileId,
            "success"
        );


        if (resourceKey) {

            log(
                "Resource key received:\n" +
                resourceKey,
                "success"
            );

        } else {

            log(
                "No resource key supplied for this file."
            );

        }


        if (
            openWithState.userId
        ) {

            log(
                "Drive user profile ID:\n" +
                openWithState.userId
            );

        }


        if (
            openWithState.action
        ) {

            log(
                "Drive action:\n" +
                openWithState.action
            );

        }


        if (
            openWithState.action !== "open"
        ) {

            log(
                "Warning: state action is not 'open'.",
                "warning"
            );

        }


        /*
            Request Google authorization.
        */

        authorizeGoogle();


    } catch (error) {

        log(
            "Could not decode Google Drive state:\n" +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   GOOGLE AUTHORIZATION
========================================================= */

function authorizeGoogle() {

    if (!tokenClient) {

        log(
            "Authorization client is not ready.",
            "error"
        );

        return;
    }


    log(
        "Requesting Google Drive authorization..."
    );


    tokenClient.requestAccessToken({

        prompt: "consent",

        login_hint: GOOGLE_ACCOUNT

    });

}


/* =========================================================
   TOKEN CALLBACK
========================================================= */

function handleToken(response) {

    if (!response) {

        log(
            "No authorization response.",
            "error"
        );

        return;
    }


    if (response.error) {

        log(
            "Google authorization error:\n" +
            JSON.stringify(
                response,
                null,
                2
            ),
            "error"
        );

        return;
    }


    accessToken =
        response.access_token;


    log(
        "Google Drive authorization successful.",
        "success"
    );


    document.getElementById(
        "pickerBtn"
    ).disabled = false;


    /*
        If Open With supplied a file,
        immediately check it.
    */

    if (
        selectedFile &&
        selectedFile.id
    ) {

        document.getElementById(
            "checkBtn"
        ).disabled = false;


        log(
            "Checking Open With file authorization..."
        );


        checkAuthorization();

    }

}


/* =========================================================
   PICKER
========================================================= */

function openPicker() {

    if (!accessToken) {

        log(
            "Authorize Google Drive first.",
            "error"
        );

        return;
    }


    if (!pickerReady) {

        log(
            "Google Picker is not ready.",
            "error"
        );

        return;
    }


    log(
        "Opening Google Drive Picker..."
    );


    const docsView =
        new google.picker.DocsView()

        .setIncludeFolders(false)

        .setSelectFolderEnabled(false)

        .setParent(FOLDER_ID)

        .setMode(
            google.picker.DocsViewMode.LIST
        );


    const picker =
        new google.picker.PickerBuilder()

        .setDeveloperKey(API_KEY)

        .setAppId(APP_ID)

        .setOAuthToken(accessToken)

        .addView(docsView)

        .setCallback(pickerCallback)

        .build();


    picker.setVisible(true);

}


/* =========================================================
   PICKER CALLBACK
========================================================= */

function pickerCallback(data) {

    const action =
        data[
            google.picker.Response.ACTION
        ];


    if (
        action ===
        google.picker.Action.PICKED
    ) {

        const docs =
            data[
                google.picker.Response.DOCUMENTS
            ];


        if (!docs || !docs.length) {

            log(
                "Picker returned no file.",
                "warning"
            );

            return;
        }


        const doc =
            docs[0];


        selectedFile = {

            id:
                doc[
                    google.picker.Document.ID
                ],

            name:
                doc[
                    google.picker.Document.NAME
                ],

            mimeType:
                doc[
                    google.picker.Document.MIME_TYPE
                ],

            url:
                doc[
                    google.picker.Document.URL
                ],

            resourceKey:
                null,

            isWorkspaceExport:
                false

        };


        showSelectedFile();


        document.getElementById(
            "checkBtn"
        ).disabled = false;


        log(
            "File selected successfully.",
            "success"
        );


        /*
            Important:
            Picker selection alone does NOT
            necessarily grant app authorization.
        */

        log(
            "Checking Drive API authorization..."
        );


        checkAuthorization();

    }


    else if (
        action ===
        google.picker.Action.CANCEL
    ) {

        log(
            "Picker cancelled."
        );

    }

}


/* =========================================================
   DISPLAY FILE
========================================================= */

function showSelectedFile() {

    const box =
        document.getElementById(
            "fileInfo"
        );


    box.innerHTML = "";


    if (!selectedFile) {

        box.textContent =
            "No file selected.";

        return;
    }


    const fields = [

        ["Name", selectedFile.name],

        ["ID", selectedFile.id],

        ["MIME", selectedFile.mimeType],

        ["Resource Key",
         selectedFile.resourceKey || "None"],

        ["URL", selectedFile.url]

    ];


    fields.forEach(function (item) {

        const div =
            document.createElement("div");


        const strong =
            document.createElement("b");


        strong.textContent =
            item[0] + ": ";


        div.appendChild(strong);


        if (
            item[0] === "URL" &&
            item[1]
        ) {

            const link =
                document.createElement("a");


            link.href =
                item[1];

            link.target =
                "_blank";

            link.textContent =
                item[1];


            div.appendChild(link);

        } else {

            div.appendChild(
                document.createTextNode(
                    item[1] || ""
                )
            );

        }


        box.appendChild(div);

    });

}


/* =========================================================
   BUILD RESOURCE KEY HEADER
========================================================= */

function getResourceKeyHeader() {

    if (
        !selectedFile ||
        !selectedFile.resourceKey
    ) {

        return null;
    }


    return (
        selectedFile.id +
        "/" +
        selectedFile.resourceKey
    );

}


/* =========================================================
   CHECK AUTHORIZATION
========================================================= */

async function checkAuthorization() {

    if (!accessToken) {

        log(
            "No Google Drive access token.",
            "error"
        );

        return;
    }


    if (
        !selectedFile ||
        !selectedFile.id
    ) {

        log(
            "No file selected.",
            "error"
        );

        return;
    }


    log(
        "Calling Drive files.get..."
    );


    try {

        const url =
            "https://www.googleapis.com/drive/v3/files/" +
            encodeURIComponent(
                selectedFile.id
            ) +
            "?fields=" +
            encodeURIComponent(
                "id,name,mimeType,webViewLink,parents,trashed,isAppAuthorized,capabilities,permissionIds"
            );


        const headers = {

            "Authorization":
                "Bearer " +
                accessToken,

            "Accept":
                "application/json"

        };


        const resourceKeyHeader =
            getResourceKeyHeader();


        if (resourceKeyHeader) {

            headers[
                "X-Goog-Drive-Resource-Keys"
            ] =
                resourceKeyHeader;

        }


        const response =
            await fetch(
                url,
                {
                    method: "GET",
                    headers: headers
                }
            );


        const text =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(text);

        } catch {

            data = {
                raw: text
            };

        }


        if (!response.ok) {

            log(
                "Drive files.get FAILED:\n" +
                JSON.stringify(
                    data,
                    null,
                    2
                ),
                "error"
            );


            if (
                response.status === 403
            ) {

                log(
                    "HTTP 403: The app can see the request but does not have the required permission.",
                    "warning"
                );

            }


            if (
                response.status === 404
            ) {

                log(
                    "HTTP 404: File was not accessible using the current token/resource key.",
                    "warning"
                );

            }


            return;
        }


        log(
            "Drive files.get SUCCESS:\n" +
            JSON.stringify(
                data,
                null,
                2
            ),
            "success"
        );


        selectedFile.name =
            data.name ||
            selectedFile.name;


        selectedFile.mimeType =
            data.mimeType ||
            selectedFile.mimeType;


        selectedFile.url =
            data.webViewLink ||
            selectedFile.url;


        showSelectedFile();


        /*
            Check app authorization.
        */

        if (
            data.isAppAuthorized === true
        ) {

            log(
                "SUCCESS: isAppAuthorized = true",
                "success"
            );

        } else if (
            data.isAppAuthorized === false
        ) {

            log(
                "isAppAuthorized = false",
                "warning"
            );

        } else {

            log(
                "isAppAuthorized was not returned.",
                "warning"
            );

        }


        /*
            Check capabilities.
        */

        if (data.capabilities) {

            log(
                "File capabilities:\n" +
                JSON.stringify(
                    data.capabilities,
                    null,
                    2
                )
            );


            if (
                data.capabilities.canEdit === true
            ) {

                log(
                    "SUCCESS: canEdit = true",
                    "success"
                );


                document.getElementById(
                    "renameBtn"
                ).disabled = false;


                document.getElementById(
                    "trashBtn"
                ).disabled = false;

            } else {

                log(
                    "canEdit is not true. Rename/Trash disabled.",
                    "warning"
                );

            }

        }


    } catch (error) {

        log(
            "files.get exception:\n" +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   RENAME FILE
========================================================= */

async function renameFile() {

    if (
        !selectedFile ||
        !accessToken
    ) {

        return;
    }


    const newName =
        prompt(
            "Enter new file name:",
            selectedFile.name
        );


    if (!newName) {

        return;
    }


    log(
        "Renaming file..."
    );


    try {

        const url =
            "https://www.googleapis.com/drive/v3/files/" +
            encodeURIComponent(
                selectedFile.id
            );


        const headers = {

            "Authorization":
                "Bearer " +
                accessToken,

            "Content-Type":
                "application/json"

        };


        const resourceKeyHeader =
            getResourceKeyHeader();


        if (resourceKeyHeader) {

            headers[
                "X-Goog-Drive-Resource-Keys"
            ] =
                resourceKeyHeader;

        }


        const response =
            await fetch(
                url,
                {

                    method: "PATCH",

                    headers: headers,

                    body:
                        JSON.stringify({
                            name: newName
                        })

                }
            );


        const text =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(text);

        } catch {

            data = {
                raw: text
            };

        }


        if (!response.ok) {

            log(
                "Rename FAILED:\n" +
                JSON.stringify(
                    data,
                    null,
                    2
                ),
                "error"
            );

            return;
        }


        selectedFile.name =
            data.name;


        showSelectedFile();


        log(
            "File renamed successfully.",
            "success"
        );


    } catch (error) {

        log(
            "Rename exception:\n" +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   MOVE TO TRASH
========================================================= */

async function trashFile() {

    if (
        !selectedFile ||
        !accessToken
    ) {

        return;
    }


    if (
        !confirm(
            "Move this file to Google Drive Trash?"
        )
    ) {

        return;
    }


    log(
        "Moving file to Trash..."
    );


    try {

        const url =
            "https://www.googleapis.com/drive/v3/files/" +
            encodeURIComponent(
                selectedFile.id
            );


        const headers = {

            "Authorization":
                "Bearer " +
                accessToken,

            "Content-Type":
                "application/json"

        };


        const resourceKeyHeader =
            getResourceKeyHeader();


        if (resourceKeyHeader) {

            headers[
                "X-Goog-Drive-Resource-Keys"
            ] =
                resourceKeyHeader;

        }


        const response =
            await fetch(
                url,
                {

                    method: "PATCH",

                    headers: headers,

                    body:
                        JSON.stringify({
                            trashed: true
                        })

                }
            );


        const text =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(text);

        } catch {

            data = {
                raw: text
            };

        }


        if (!response.ok) {

            log(
                "Move to Trash FAILED:\n" +
                JSON.stringify(
                    data,
                    null,
                    2
                ),
                "error"
            );

            return;
        }


        log(
            "File moved to Trash successfully.",
            "success"
        );


        document.getElementById(
            "renameBtn"
        ).disabled = true;


        document.getElementById(
            "trashBtn"
        ).disabled = true;


    } catch (error) {

        log(
            "Trash exception:\n" +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   SIGN OUT
========================================================= */

function signOut() {

    if (accessToken) {

        google.accounts.oauth2.revoke(
            accessToken,
            function () {

                log(
                    "Google Drive access revoked."
                );

            }
        );

    }


    accessToken = null;

    selectedFile = null;


    document.getElementById(
        "pickerBtn"
    ).disabled = true;


    document.getElementById(
        "checkBtn"
    ).disabled = true;


    document.getElementById(
        "renameBtn"
    ).disabled = true;


    document.getElementById(
        "trashBtn"
    ).disabled = true;


    document.getElementById(
        "fileInfo"
    ).textContent =
        "No file selected.";


    log(
        "Signed out."
    );

}

</script>

</body>
</html>
