<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Drive Test 3 - Diagnostic</title>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
    background: #f5f5f5;
}

.box {
    max-width: 800px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
}

.status {
    padding: 15px;
    margin: 15px 0;
    background: #fff3cd;
    border-radius: 8px;
    white-space: pre-wrap;
}

button {
    padding: 12px 18px;
    margin: 5px;
    border: 0;
    border-radius: 7px;
    background: #1976d2;
    color: white;
    cursor: pointer;
}

button:disabled {
    opacity: .4;
}
</style>
</head>

<body>

<div class="box">

<h1>Google Drive Test 3</h1>

<p>
<strong>Target Folder:</strong>
MyWebApps Attachments
</p>

<p>
<strong>Folder ID:</strong>
1LFkmK8l6dB6HtFlcApI0TW2jgp7cGEGT
</p>

<div id="status" class="status">
Page loaded.
Waiting for Google libraries...
</div>

<button
    id="authorizeBtn"
    onclick="authorizeGoogle()"
    disabled>
    Authorize Google Drive
</button>

<button
    id="pickerBtn"
    onclick="openPicker()"
    disabled>
    Open Google Picker
</button>

<button
    id="signOutBtn"
    onclick="signOutGoogle()"
    disabled>
    Sign Out
</button>

</div>


<script>

/* =========================================================
   CONFIG
   ========================================================= */

const CLIENT_ID =
    "203025420924-uvlehfup39hj4st7tpv7vud8uedafr9k.apps.googleusercontent.com";

const API_KEY =
    "AIzaSyBSf3HKUR652Kja3l65D91FvCkQSoxgZDY";

const APP_ID =
    "46681415809";

const FOLDER_ID =
    "1LFkmK8l6dB6HtFlcApI0TW2jgp7cGEGT";

const SCOPES =
    "https://www.googleapis.com/auth/drive.file";


/* =========================================================
   STATE
   ========================================================= */

let tokenClient = null;

let accessToken = null;

let pickerReady = false;

let gisReady = false;


/* =========================================================
   STATUS
   ========================================================= */

function status(text) {

    document.getElementById("status")
        .textContent = text;

    console.log(text);
}


/* =========================================================
   GOOGLE API LOADED
   ========================================================= */

function gapiLoaded() {

    console.log(
        "1. gapi.js loaded"
    );

    status(
        "Google API library loaded.\n" +
        "Loading Google Picker..."
    );


    /*
       Google کی موجودہ Picker documentation
       کے مطابق client:picker load کیا جا رہا ہے۔
    */

    gapi.load(
        "client:picker",
        initializePicker
    );
}


/* =========================================================
   PICKER INITIALIZATION
   ========================================================= */

async function initializePicker() {

    console.log(
        "2. client:picker loaded"
    );

    try {

        /*
           Drive discovery document بھی load کریں۔
        */

        await gapi.client.load(
            "https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"
        );


        pickerReady = true;


        console.log(
            "3. Google Picker initialized"
        );


        status(
            "Google API + Picker loaded successfully.\n\n" +
            "Waiting for Google authorization..."
        );


        updateButtons();

    }

    catch (error) {

        console.error(
            "Picker initialization error:",
            error
        );


        status(
            "Google Picker initialization failed:\n\n" +
            error.message
        );
    }
}


/* =========================================================
   GIS LOADED
   ========================================================= */

function gisLoaded() {

    console.log(
        "4. Google Identity Services loaded"
    );


    try {

        tokenClient =
            google.accounts.oauth2.initTokenClient({

                client_id:
                    CLIENT_ID,

                scope:
                    SCOPES,

                callback:
                    handleTokenResponse

            });


        gisReady = true;


        console.log(
            "5. GIS initialized"
        );


        status(
            "Google authorization system loaded.\n\n" +
            "You can now click Authorize Google Drive."
        );


        updateButtons();

    }

    catch (error) {

        console.error(
            "GIS initialization error:",
            error
        );


        status(
            "Google authorization initialization failed:\n\n" +
            error.message
        );
    }
}


/* =========================================================
   BUTTON STATE
   ========================================================= */

function updateButtons() {

    document.getElementById(
        "authorizeBtn"
    ).disabled = !gisReady;


    document.getElementById(
        "pickerBtn"
    ).disabled =
        !accessToken ||
        !pickerReady;


    document.getElementById(
        "signOutBtn"
    ).disabled =
        !accessToken;
}


/* =========================================================
   AUTHORIZE
   ========================================================= */

function authorizeGoogle() {

    if (!tokenClient) {

        status(
            "Authorization system is not ready."
        );

        return;
    }


    status(
        "Opening Google authorization..."
    );


    tokenClient.requestAccessToken({
        prompt: ""
    });
}


/* =========================================================
   TOKEN RESPONSE
   ========================================================= */

function handleTokenResponse(response) {

    console.log(
        "OAuth response:",
        response
    );


    if (response.error) {

        status(
            "Google authorization error:\n\n" +
            JSON.stringify(
                response,
                null,
                2
            )
        );

        return;
    }


    if (!response.access_token) {

        status(
            "Google did not return an access token."
        );

        return;
    }


    accessToken =
        response.access_token;


    updateButtons();


    status(
        "Google Drive authorized successfully.\n\n" +
        "Access token received.\n\n" +
        "You can now click Open Google Picker."
    );
}


/* =========================================================
   PICKER
   ========================================================= */

function openPicker() {

    if (!accessToken) {

        status(
            "Please authorize Google Drive first."
        );

        return;
    }


    if (!pickerReady) {

        status(
            "Google Picker is not ready yet."
        );

        return;
    }


    status(
        "Opening Google Picker..."
    );


    const view =
        new google.picker.DocsView()
            .setIncludeFolders(false)
            .setSelectFolderEnabled(false)
            .setParent(FOLDER_ID);


    const picker =
        new google.picker.PickerBuilder()

            .setDeveloperKey(
                API_KEY
            )

            .setAppId(
                APP_ID
            )

            .setOAuthToken(
                accessToken
            )

            .addView(
                view
            )

            .setTitle(
                "MyWebApps Attachments"
            )

            .setCallback(
                pickerCallback
            )

            .build();


    picker.setVisible(true);
}


/* =========================================================
   PICKER CALLBACK
   ========================================================= */

function pickerCallback(data) {

    console.log(
        "Picker callback:",
        data
    );


    if (
        data.action ===
        google.picker.Action.PICKED
    ) {

        const file =
            data.docs[0];


        status(
            "File selected successfully.\n\n" +

            "Name: " +
            (file.name || "") +

            "\n\nID: " +
            (file.id || "") +

            "\n\nMIME: " +
            (file.mimeType || "") +

            "\n\nURL: " +
            (file.url || "")
        );


        return;
    }


    if (
        data.action ===
        google.picker.Action.CANCEL
    ) {

        status(
            "Picker cancelled."
        );
    }
}


/* =========================================================
   SIGN OUT
   ========================================================= */

function signOutGoogle() {

    if (!accessToken) {
        return;
    }


    google.accounts.oauth2.revoke(
        accessToken,
        function() {

            accessToken = null;

            updateButtons();


            status(
                "Google Drive authorization revoked."
            );

        }
    );
}


/* =========================================================
   INITIAL
   ========================================================= */

status(
    "Page loaded.\n\n" +
    "Waiting for Google API and Google Identity Services..."
);

</script>


<!-- Google API -->
<script
    src="https://apis.google.com/js/api.js"
    onload="gapiLoaded()">
</script>


<!-- Google Identity Services -->
<script
    src="https://accounts.google.com/gsi/client"
    onload="gisLoaded()">
</script>

</body>
</html>
