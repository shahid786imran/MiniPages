<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>HTML File Merger</title> <style> *{box-sizing:border-box} body{ margin:0;padding:20px; font-family:Arial,sans-serif; background:#eef2f7;color:#172033 } .container{ max-width:700px;margin:20px auto; background:white;padding:22px; border-radius:15px; box-shadow:0 5px 25px #0001 } h2{text-align:center} p{line-height:1.5;color:#586579} .file-item{ display:flex;align-items:center; gap:10px;margin:12px 0;padding:12px; border:1px solid #d6deea;border-radius:9px; overflow-wrap:anywhere } .file-name{flex:1;min-width:0} .file-name small{display:block;color:#667085;margin-top:5px} button{ border:0;border-radius:8px;padding:12px 15px; background:#1769e0;color:white; font-size:15px;cursor:pointer } button:disabled{opacity:.5;cursor:not-allowed} .upload-btn{width:100%;background:#e8f1ff;color:#1457b8} .remove-btn{background:#fee2e2;color:#b91c1c;padding:8px 11px} #mergeBtn{width:100%;margin-top:20px} #status{white-space:pre-wrap;margin-top:15px} .note{font-size:13px} </style> </head> <body> <div class="container"> <h2>HTML File Merger</h2> <p> Upload HTML files one by one. Files will be joined in the same order in which you select them. </p> <div id="fileList"></div> <input id="fileInput" type="file" accept=".html,.htm,text/html" hidden> <button id="uploadBtn" class="upload-btn"> + Upload HTML File </button> <button id="mergeBtn" disabled> Merge & Download HTML </button> <div id="status" role="status"></div> <p class="note"> Files are processed locally in your browser. No file is uploaded to a server. </p> </div> <script> const fileInput = document.getElementById('fileInput'); const uploadBtn = document.getElementById('uploadBtn'); const mergeBtn = document.getElementById('mergeBtn'); const fileList = document.getElementById('fileList'); const status = document.getElementById('status'); let files = []; function formatSize(bytes) { if (bytes < 1024) return bytes + ' B'; if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB'; return (bytes / (1024 * 1024)).toFixed(2) + ' MB'; } function renderFiles() { fileList.replaceChildren(); files.forEach((file, index) => { const item = document.createElement('div'); item.className = 'file-item'; const name = document.createElement('div'); name.className = 'file-name'; const title = document.createElement('strong'); title.textContent = (index + 1) + '. ' + file.name; const size = document.createElement('small'); size.textContent = formatSize(file.size); name.append(title, size); const remove = document.createElement('button'); remove.className = 'remove-btn'; remove.textContent = 'Remove'; remove.setAttribute('aria-label', 'Remove ' + file.name); remove.addEventListener('click', () => { files.splice(index, 1); renderFiles(); status.textContent = ''; }); item.append(name, remove); fileList.append(item); }); uploadBtn.textContent = files.length ? '+ Upload Next HTML File' : '+ Upload HTML File'; mergeBtn.disabled = files.length === 0; } uploadBtn.addEventListener('click', () => { fileInput.value = ''; fileInput.click(); }); fileInput.addEventListener('change', () => { const selected = Array.from(fileInput.files); for (const file of selected) { if (!/\.(html|htm)$/i.test(file.name)) { status.textContent = 'Only .html and .htm files are allowed.'; continue; } files.push(file); } renderFiles(); if (selected.length) { status.textContent = files.length ? files.length + ' file(s) selected.' : 'No valid HTML files selected.'; } }); mergeBtn.addEventListener('click', async () => { if (!files.length) return; const totalSize = files.reduce( (sum, file) => sum + file.size, 0 ); if (totalSize > 100 * 1024 * 1024) { status.textContent = 'Total file size must not exceed 100 MB.'; return; } mergeBtn.disabled = true; uploadBtn.disabled = true; status.textContent = 'Merging files...'; try { const parts = []; for (let i = 0; i < files.length; i++) { const content = await files[i].text(); parts.push( '\n\n<!-- ===== FILE ' + (i + 1) + ': ' + files[i].name.replace(/--/g, '—') + ' : START ===== -->\n\n' + content + '\n\n<!-- ===== FILE ' + (i + 1) + ' : END ===== -->\n' ); } const blob = new Blob(parts, { type: 'text/html;charset=utf-8' }); const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = 'Merged.html'; document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); status.textContent = 'Merged.html download started. Total files: ' + files.length; } catch (error) { status.textContent = 'Error: ' + error.message; } finally { mergeBtn.disabled = false; uploadBtn.disabled = false; } }); renderFiles(); </script> </body> </html>
