<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously,
  createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc,
  collection, getDocs, query, limit, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getFirestore(app);

window._fb = { app, auth, db, doc, setDoc, getDoc, updateDoc, deleteDoc,
  collection, getDocs, query, limit, serverTimestamp };
window._firestoreRef = doc(db, FIRESTORE_COLLECTION, FIRESTORE_GLOBAL_DOC);

window._fbAuth = { signInAnonymously, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut };

onAuthStateChanged(auth, u => {
  const el = document.getElementById("authInfo");
  if (!el) return;
  if (u) {
    el.innerHTML = '<span class="ok">✔ Signed in</span> — UID: <code>' + u.uid + '</code>' +
      (u.email ? ' | Email: <code>' + u.email + '</code>' : ' | (anonymous)');
  } else {
    el.innerHTML = '<span class="fail">✘ Not signed in</span>';
  }
});
</script>

<!-- Main Script -->
<script>
const $ = id => document.getElementById(id);
const log = (id, m) => {
  const el = $(id);
  if (!el) return;
  el.textContent = (typeof m === "string") ? m : JSON.stringify(m, null, 2);
};
const esc = s => (s || "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

/* TABS */
$("tabFirebaseBtn").onclick = () => {
  $("tabFirebase").classList.remove("hidden");
  $("tabDrive").classList.add("hidden");
  $("tabFirebaseBtn").classList.add("active");
  $("tabDriveBtn").classList.remove("active");
};
$("tabDriveBtn").onclick = () => {
  $("tabDrive").classList.remove("hidden");
  $("tabFirebase").classList.add("hidden");
  $("tabDriveBtn").classList.add("active");
  $("tabFirebaseBtn").classList.remove("active");
};

/* STATUS */
function updateStatus() {
  const gapiOk = typeof gapi !== "undefined" && typeof gapi.client !== "undefined";
  const gsiOk  = typeof google !== "undefined" && google.accounts && google.accounts.oauth2;
  let html = '<b>Drive:</b> ';
  html += gapiOk ? '<span class="ok">✔ gapi</span> ' : '<span class="fail">✘ gapi</span> ';
  html += gsiOk  ? '<span class="ok">✔ GSI</span> ' : '<span class="fail">✘ GSI</span> ';
  html += window._accessToken ? '<span class="ok">✔ Token</span> ' : '<span class="fail">✘ No token</span>';
  html += window._subFolderId ? '<span class="ok">✔ Test1</span> ' : '<span class="warn">⚠ Subfolder</span>';
  html += window._binFolderId ? '<span class="ok">✔ Bin</span>' : '<span class="warn">⚠ Bin</span>';
  $("statusBox").innerHTML = html;
}

/* GAPI INIT */
function waitGapi(max = 8000) {
  return new Promise(r => {
    const t = Date.now();
    (function c() {
      if (typeof gapi !== "undefined" && typeof gapi.client !== "undefined") return r(true);
      if (Date.now() - t > max) return r(false);
      setTimeout(c, 150);
    })();
  });
}
async function initGapi() {
  if (typeof gapi === "undefined") return false;
  await new Promise(r => gapi.load("client", r));
  if (!(await waitGapi())) return false;
  try {
    await gapi.client.init({
      apiKey: DRIVE_CONFIG.apiKey,
      discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"]
    });
    updateStatus();
    return true;
  } catch (e) {
    console.error("gapi.client.init error:", e);
    return false;
  }
}

/* TOKEN */
function initToken() {
  if (typeof google === "undefined" || !google.accounts || !google.accounts.oauth2) {
    return setTimeout(initToken, 300);
  }
  window._tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: DRIVE_CONFIG.oauthClientId,
    scope: DRIVE_CONFIG.scope,
    callback: (r) => {
      if (r.access_token) {
        window._accessToken = r.access_token;
        gapi.client.setToken({ access_token: r.access_token });
        updateStatus();
        log("driveStatusOut", "✔ Access token acquired");
      } else {
        log("driveStatusOut", "✘ Token error: " + JSON.stringify(r));
      }
    }
  });
}
initToken();

function ensureToken() {
  return new Promise((res, rej) => {
    if (window._accessToken) return res();
    if (!window._tokenClient) return rej(new Error("Token client not ready"));
    const old = window._tokenClient.callback;
    window._tokenClient.callback = (r) => { old(r); res(); };
    window._tokenClient.requestAccessToken({ prompt: "consent" });
  });
}

/* FOLDERS */
async function findOrCreateFolder(parentId, folderName) {
  const q = `'${parentId}' in parents and name='${folderName}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
  const l = await gapi.client.drive.files.list({ q, fields: "files(id,name)" });
  if (l.result.files && l.result.files.length) return l.result.files[0].id;
  const c = await gapi.client.drive.files.create({
    resource: { name: folderName, mimeType: "application/vnd.google-apps.folder", parents: [parentId] },
    fields: "id"
  });
  return c.result.id;
}
async function getSubFolder() {
  if (window._subFolderId) return window._subFolderId;
  window._subFolderId = await findOrCreateFolder(DRIVE_CONFIG.universalFolderId, DRIVE_CONFIG.subFolderName);
  return window._subFolderId;
}
async function getBinFolder() {
  if (window._binFolderId) return window._binFolderId;
  window._binFolderId = await findOrCreateFolder(DRIVE_CONFIG.universalFolderId, DRIVE_CONFIG.binFolderName);
  return window._binFolderId;
}

/* FIREBASE BUTTONS */
$("anonBtn").onclick = async () => {
  try { await window._fbAuth.signInAnonymously(window._fb.auth); }
  catch (e) { alert("Auth error: " + e.message); }
};
$("emailLoginBtn").onclick = async () => {
  const email = prompt("Email:"); if (!email) return;
  const pass = prompt("Password:"); if (!pass) return;
  try {
    try { await window._fbAuth.signInWithEmailAndPassword(window._fb.auth, email, pass); }
    catch (e) {
      if (e.code === "auth/user-not-found") {
        await window._fbAuth.createUserWithEmailAndPassword(window._fb.auth, email, pass);
      } else throw e;
    }
  } catch (e) { alert("Login error: " + e.message); }
};
$("logoutBtn").onclick = async () => {
  try { await window._fbAuth.signOut(window._fb.auth); }
  catch (e) { alert("Error: " + e.message); }
};
$("fsSaveBtn").onclick = async () => {
  try {
    const name = $("fsName").value.trim();
    const note = $("fsNote").value.trim();
    if (!name) return alert("Name required");
    const docId = $("fsDocId").value.trim() || "global";
    const ref = window._fb.doc(window._fb.db, FIRESTORE_COLLECTION, docId);
    await window._fb.setDoc(ref, { name, note, updatedAt: window._fb.serverTimestamp() }, { merge: true });
    log("fsOut", "✔ Saved to " + FIRESTORE_COLLECTION + "/" + docId);
  } catch (e) { log("fsOut", "✘ Error: " + e.message); }
};
$("fsUpdateBtn").onclick = async () => {
  try {
    const docId = $("fsDocId").value.trim() || "global";
    const ref = window._fb.doc(window._fb.db, FIRESTORE_COLLECTION, docId);
    const update = { updatedAt: window._fb.serverTimestamp() };
    if ($("fsName").value.trim()) update.name = $("fsName").value.trim();
    if ($("fsNote").value.trim()) update.note = $("fsNote").value.trim();
    await window._fb.updateDoc(ref, update);
    log("fsOut", "✔ Updated " + docId);
  } catch (e) { log("fsOut", "✘ Error: " + e.message); }
};
$("fsDeleteBtn").onclick = async () => {
  if (!confirm("Delete this document?")) return;
  try {
    const docId = $("fsDocId").value.trim() || "global";
    await window._fb.deleteDoc(window._fb.doc(window._fb.db, FIRESTORE_COLLECTION, docId));
    log("fsOut", "✔ Deleted " + docId);
  } catch (e) { log("fsOut", "✘ Error: " + e.message); }
};
$("fsLoadBtn").onclick = async () => {
  try {
    const snap = await window._fb.getDoc(window._firestoreRef);
    if (snap.exists()) {
      const d = snap.data();
      $("fsName").value = d.name || "";
      $("fsNote").value = d.note || "";
      log("fsOut", JSON.stringify(d, null, 2));
    } else log("fsOut", "Document does not exist.");
  } catch (e) { log("fsOut", "✘ Error: " + e.message); }
};
$("fsQueryBtn").onclick = async () => {
  try {
    const col = $("fsQueryCol").value.trim();
    const lim = parseInt($("fsQueryLimit").value) || 20;
    const q = window._fb.query(window._fb.collection(window._fb.db, col), window._fb.limit(lim));
    const snap = await window._fb.getDocs(q);
    const arr = [];
    snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
    log("fsQueryOut", arr.length ? arr : "No documents.");
  } catch (e) { log("fsQueryOut", "✘ Error: " + e.message); }
};

/* DRIVE AUTH */
$("authDriveBtn").onclick = async () => {
  try {
    await ensureToken();
    await initGapi();
    await getSubFolder();
    await getBinFolder();
    updateStatus();
    log("driveStatusOut", "✔ Authorized.\nTest1 ID: " + window._subFolderId + "\nBin ID: " + window._binFolderId);
  } catch (e) { log("driveStatusOut", "✘ Error: " + e.message); }
};
$("refreshBtn").onclick = () => updateStatus();

/* UPLOAD */
$("uploadBtn").onclick = async () => {
  const fi = $("fileInput");
  if (!fi || !fi.files || fi.files.length === 0) return alert("Choose a file first.");
  try {
    await ensureToken();
    const sid = await getSubFolder();
    const file = fi.files[0];
    const form = new FormData();
    form.append("metadata", new Blob([JSON.stringify({ name: file.name, parents: [sid] })], { type: "application/json" }));
    form.append("file", file);
    const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name",
      { method: "POST", headers: { Authorization: "Bearer " + window._accessToken }, body: form });
    const data = await res.json();
    if (data.error) return log("uploadOut", "✘ Error: " + JSON.stringify(data.error));
    log("uploadOut", "✔ Uploaded: " + data.name + "\nID: " + data.id);
    fi.value = "";
    refreshList();
  } catch (e) { log("uploadOut", "✘ Error: " + e.message); }
};

/* CREATE */
$("createBtn").onclick = async () => {
  const name = $("createName").value.trim();
  if (!name) return alert("File name required.");
  const content = $("createContent").value || "";
  const mime = $("createMime").value;
  try {
    await ensureToken();
    const sid = await getSubFolder();
    const form = new FormData();
    form.append("metadata", new Blob([JSON.stringify({ name, parents: [sid], mimeType: mime })], { type: "application/json" }));
    form.append("file", new Blob([content], { type: mime }));
    const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name",
      { method: "POST", headers: { Authorization: "Bearer " + window._accessToken }, body: form });
    const data = await res.json();
    if (data.error) return log("createOut", "✘ Error: " + JSON.stringify(data.error));
    log("createOut", "✔ Created: " + data.name + "\nID: " + data.id);
    refreshList();
  } catch (e) { log("createOut", "✘ Error: " + e.message); }
};

/* LIST TEST1 */
async function refreshList() {
  try {
    await ensureToken();
    const sid = await getSubFolder();
    const res = await gapi.client.drive.files.list({
      q: `'${sid}' in parents and trashed=false`,
      fields: "files(id,name,mimeType,webViewLink,modifiedTime)",
      orderBy: "modifiedTime desc"
    });
    const files = res.result.files || [];
    const box = $("fileList");
    if (!files.length) { box.innerHTML = '<div style="padding:10px;color:#6b7488;">No files in Test1.</div>'; return; }
    box.innerHTML = files.map(f => `
      <div class="file-row">
        <div class="info">
          <div class="name">${esc(f.name)}</div>
          <small>${(f.mimeType || "").split(".").pop()} | ID: ${f.id}</small>
        </div>
        <div class="actions">
          <button data-open-id="${f.id}" data-open-name="${esc(f.name)}" data-open-mime="${f.mimeType}">✏ Open</button>
          <a href="${f.webViewLink}" target="_blank"><button>🔗 View</button></a>
        </div>
      </div>
    `).join("");
    box.querySelectorAll("button[data-open-id]").forEach(b => {
      b.onclick = () => openFile(b.dataset.openId, b.dataset.openName, b.dataset.openMime);
    });
  } catch (e) {
    $("fileList").innerHTML = '<div style="padding:10px;color:#d9453f;">Error: ' + esc(e.message) + '</div>';
  }
}
$("listBtn").onclick = refreshList;

/* OPEN / SAVE / RENAME / DELETE */
async function openFile(id, name, mime) {
  window._currentFileId = id;
  window._currentMime = mime;
  $("editorBox").style.display = "block";
  $("editName").textContent = name;
  $("editNewName").value = name;
  $("editContent").value = "(loading…)";
  log("editOut", "Loading " + name + "…");
  try {
    await ensureToken();
    const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,
      { headers: { Authorization: "Bearer " + window._accessToken } });
    $("editContent").value = await r.text();
    log("editOut", "✔ Loaded: " + name);
  } catch (e) {
    $("editContent").value = "";
    log("editOut", "✘ Error: " + e.message);
  }
}
$("saveContentBtn").onclick = async () => {
  if (!window._currentFileId) return;
  try {
    await ensureToken();
    const r = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${window._currentFileId}?uploadType=media`,
      { method: "PATCH",
        headers: { Authorization: "Bearer " + window._accessToken, "Content-Type": window._currentMime || "text/plain" },
        body: $("editContent").value });
    const d = await r.json();
    if (d.error) return log("editOut", "✘ Error: " + JSON.stringify(d.error));
    log("editOut", "✔ Content saved.");
    refreshList();
  } catch (e) { log("editOut", "✘ Error: " + e.message); }
};
$("renameBtn").onclick = async () => {
  if (!window._currentFileId) return;
  const nn = $("editNewName").value.trim();
  if (!nn) return alert("Enter new name.");
  try {
    await ensureToken();
    const r = await fetch(`https://www.googleapis.com/drive/v3/files/${window._currentFileId}`,
      { method: "PATCH",
        headers: { Authorization: "Bearer " + window._accessToken, "Content-Type": "application/json" },
        body: JSON.stringify({ name: nn }) });
    const d = await r.json();
    if (d.error) return log("editOut", "✘ Error: " + JSON.stringify(d.error));
    log("editOut", "✔ Renamed to: " + d.name);
    $("editName").textContent = nn;
    refreshList();
  } catch (e) { log("editOut", "✘ Error: " + e.message); }
};
$("deleteBtn").onclick = async () => {
  if (!window._currentFileId) return;
  if (!confirm("Move file to Bin folder?")) return;
  try {
    await ensureToken();
    const binId = await getBinFolder();
    const sid = await getSubFolder();
    const r = await fetch(
      `https://www.googleapis.com/drive/v3/files/${window._currentFileId}?addParents=${binId}&removeParents=${sid}&fields=id,name,parents`,
      { method: "PATCH", headers: { Authorization: "Bearer " + window._accessToken } });
    const d = await r.json();
    if (d.error) return log("editOut", "✘ Error: " + JSON.stringify(d.error));
    log("editOut", "✔ Moved to Bin: " + d.name);
    $("editorBox").style.display = "none";
    window._currentFileId = null;
    refreshList();
    listBin();
  } catch (e) { log("editOut", "✘ Error: " + e.message); }
};

/* BIN LIST */
async function listBin() {
  try {
    await ensureToken();
    const binId = await getBinFolder();
    const res = await gapi.client.drive.files.list({
      q: `'${binId}' in parents and trashed=false`,
      fields: "files(id,name,mimeType,modifiedTime)",
      orderBy: "modifiedTime desc"
    });
    const files = res.result.files || [];
    const box = $("binList");
    if (!files.length) { box.innerHTML = '<div style="padding:10px;color:#6b7488;">Bin is empty.</div>'; return; }
    box.innerHTML = files.map(f => `
      <div class="file-row">
        <div class="info">
          <div class="name">${esc(f.name)}</div>
          <small>${f.id}</small>
        </div>
        <div class="actions">
          <button data-restore-id="${f.id}" data-restore-name="${esc(f.name)}">♻ Restore</button>
        </div>
      </div>
    `).join("");
    box.querySelectorAll("button[data-restore-id]").forEach(b => {
      b.onclick = () => restoreFile(b.dataset.restoreId, b.dataset.restoreName);
    });
  } catch (e) {
    $("binList").innerHTML = '<div style="padding:10px;color:#d9453f;">Error: ' + esc(e.message) + '</div>';
  }
}
$("binListBtn").onclick = listBin;

/* RESTORE */
async function restoreFile(id, name) {
  try {
    await ensureToken();
    const sid = await getSubFolder();
    const binId = await getBinFolder();
    const r = await fetch(
      `https://www.googleapis.com/drive/v3/files/${id}?addParents=${sid}&removeParents=${binId}&fields=id,name,parents`,
      { method: "PATCH", headers: { Authorization: "Bearer " + window._accessToken } });
    const d = await r.json();
    if (d.error) { alert("Restore error: " + JSON.stringify(d.error)); return; }
    alert("✔ Restored: " + (d.name || name));
    listBin();
    refreshList();
  } catch (e) { alert("Error: " + e.message); }
}

/* PICKER */
$("pickerBtn").onclick = async () => {
  try {
    if (!window._accessToken) return alert("Authorize first.");
    gapi.load("picker", {
      callback: () => {
        if (!window.google || !window.google.picker) {
          return log("pickerOut", "✘ Picker library not loaded.");
        }
        const view = new google.picker.DocsView(google.picker.ViewId.DOCS)
          .setIncludeFolders(true).setSelectFolderEnabled(false);
        const picker = new google.picker.PickerBuilder()
          .addView(view)
          .setOAuthToken(window._accessToken)
          .setDeveloperKey(DRIVE_CONFIG.apiKey)
          .setAppId(DRIVE_CONFIG.appId)
          .setCallback((data) => {
            if (data.action === google.picker.Action.PICKED) {
              const f = data.docs[0];
              log("pickerOut", "✔ Picked: " + f.name + "\nID: " + f.id);
              openFile(f.id, f.name, f.mimeType);
            } else if (data.action === google.picker.Action.CANCEL) {
              log("pickerOut", "Picker cancelled.");
            }
          }).build();
        picker.setVisible(true);
        log("pickerOut", "Picker opened.");
      },
      onerror: () => log("pickerOut", "✘ Picker load error.")
    });
  } catch (e) { log("pickerOut", "✘ Error: " + e.message); }
};

/* INIT */
document.addEventListener("DOMContentLoaded", () => {
  updateStatus();
  setTimeout(updateStatus, 1500);
  initGapi();
});
</script>
