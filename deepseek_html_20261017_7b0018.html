<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MyWebApps — Test3</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --accent2:#0ea5e9;
    --ok:#22c55e; --err:#ef4444; --warn:#f59e0b;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);}
  header{background:linear-gradient(135deg,#0ea5e9,#6366f1);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  header h1{margin:0;font-size:18px;letter-spacing:.5px;}
  header .who{font-size:12px;opacity:.9;}
  .wrap{max-width:1000px;margin:0 auto;padding:18px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;}
  .card h2{margin:0 0 12px;font-size:15px;color:var(--accent);}
  label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px;}
  input[type=text],input[type=email],input[type=password],textarea,select{
    width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);
    background:var(--card2);color:var(--txt);font-size:14px;outline:none;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--accent);}
  textarea{resize:vertical;min-height:60px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:600px){.row{grid-template-columns:1fr;}}
  button{cursor:pointer;border:none;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:600;transition:.15s;}
  .btn{background:var(--accent2);color:#fff;}
  .btn:hover{background:var(--accent);}
  .btn.gray{background:#475569;}
  .btn.red{background:var(--err);}
  .btn.green{background:var(--ok);}
  .btn.sm{padding:5px 10px;font-size:12px;}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .msg{font-size:13px;padding:8px 12px;border-radius:8px;margin-top:10px;display:none;}
  .msg.ok{display:block;background:rgba(34,197,94,.15);color:var(--ok);border:1px solid var(--ok);}
  .msg.err{display:block;background:rgba(239,68,68,.15);color:var(--err);border:1px solid var(--err);}
  .msg.info{display:block;background:rgba(56,189,248,.12);color:var(--accent);border:1px solid var(--accent);}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;}
  th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;}
  tr:hover td{background:rgba(56,189,248,.05);}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:var(--card2);color:var(--muted);}
  .hidden{display:none !important;}
  .filelist a{color:var(--accent);word-break:break-all;}
  #authGate{max-width:420px;margin:60px auto;}
  .tag{font-size:11px;color:var(--muted);}
  .stack{display:flex;flex-direction:column;gap:6px;}
  .muted{color:var(--muted);}
  .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
</style>
</head>
<body>

  drive: {

    clientId: "103334413601-4msa4v80kgdir5k6c9kjj4m17h4f9djr.apps.googleusercontent.com",
    scope: "https://www.googleapis.com/auth/drive.file",
    universalFolderId: "1fkDwkqErHogFqYU4x2OwYBSMk-n5KsG_", // MyWebApps
    subFolderName: "Test3"                                       // this page's subfolder

<!-- ================= FIREBASE SDK (compat) ================= -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<header>
  <h1>MyWebApps · Test3</h1>
  <div class="who" id="who">Not signed in</div>
</header>

<div class="wrap">

  <!-- ============ AUTH GATE ============ -->
  <div id="authGate" class="card">
    <h2>Login / Sign Up</h2>
    <label>Email</label>
    <input type="email" id="authEmail" placeholder="you@example.com"/>
    <label>Password</label>
    <input type="password" id="authPass" placeholder="min 6 chars"/>
    <div class="actions">
      <button class="btn" id="btnLogin">Login</button>
      <button class="btn green" id="btnSignup">Sign Up</button>
      <button class="btn gray" id="btnReset">Reset Password</button>
    </div>
    <div class="msg" id="authMsg"></div>
  </div>

  <!-- ============ APP (hidden until login) ============ -->
  <div id="app" class="hidden">

    <!-- Page Settings -->
    <div class="card">
      <h2>Page Settings <span class="tag">(collection: Test3 / doc: global)</span></h2>
      <div class="row">
        <div>
          <label>Page Title</label>
          <input type="text" id="setTitle" placeholder="e.g. My Test Page"/>
        </div>
        <div>
          <label>Theme</label>
          <select id="setTheme">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </div>
      </div>
      <label>Notes / Description</label>
      <textarea id="setNotes" placeholder="Any page-level setting..."></textarea>
      <div class="actions">
        <button class="btn" id="btnSaveSettings">Save Settings</button>
        <button class="btn gray" id="btnLoadSettings">Reload</button>
      </div>
      <div class="msg" id="settingsMsg"></div>
    </div>

    <!-- Records (CRUD) -->
    <div class="card">
      <h2>Records</h2>
      <div class="row">
        <div>
          <label>Title</label>
          <input type="text" id="recTitle" placeholder="Record title"/>
        </div>
        <div>
          <label>Detail</label>
          <input type="text" id="recDetail" placeholder="Short detail"/>
        </div>
      </div>
      <div class="actions">
        <button class="btn green" id="btnAdd">Add Record</button>
        <button class="btn gray" id="btnRefresh">Refresh List</button>
      </div>
      <div class="msg" id="recMsg"></div>

      <table id="recTable">
        <thead>
          <tr>
            <th>Title</th><th>Detail</th><th>Attachments</th><th>Created</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="recBody">
          <tr><td colspan="5" class="muted">No records yet.</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Drive Attachments -->
    <div class="card">
      <h2>Drive Attachments <span class="tag">(folder: MyWebApps / Test3)</span></h2>
      <div class="row">
        <div>
          <label>Attach file to Record Title</label>
          <input type="text" id="attRecord" placeholder="Exact record title"/>
        </div>
        <div>
          <label>Choose File</label>
          <input type="file" id="attFile" style="padding:6px;"/>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="btnConnectDrive">Connect Google Drive</button>
        <button class="btn green" id="btnUpload">Upload File</button>
      </div>
      <div class="msg" id="driveMsg"></div>
    </div>

    <div class="actions" style="justify-content:flex-end;">
      <button class="btn red" id="btnLogout">Logout</button>
    </div>

  </div>
</div>

<!-- ================= APP LOGIC ================= -->
<script>
/* ---------- Firebase init ---------- */
const fbApp = firebase.initializeApp(CONFIG.firebase);
const auth  = firebase.auth();
const db    = firebase.firestore();
const COL   = CONFIG.firestoreCollection;       // "Test3" — single shared collection
const SETTINGS_DOC = CONFIG.firestoreSettingsDoc;

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
function showMsg(id, text, type='info'){
  const el = $(id);
  el.textContent = text;
  el.className = 'msg ' + type;
  if(type !== 'err'){ setTimeout(()=>{ if(el.textContent===text){ el.className='msg'; el.textContent=''; } }, 4000); }
}
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- AUTH ---------- */
$('btnLogin').onclick = async () => {
  try{
    await auth.signInWithEmailAndPassword($('authEmail').value.trim(), $('authPass').value);
  }catch(e){ showMsg('authMsg', e.message, 'err'); }
};
$('btnSignup').onclick = async () => {
  try{
    await auth.createUserWithEmailAndPassword($('authEmail').value.trim(), $('authPass').value);
  }catch(e){ showMsg('authMsg', e.message, 'err'); }
};
$('btnReset').onclick = async () => {
  const email = $('authEmail').value.trim();
  if(!email) return showMsg('authMsg','Enter email first','err');
  try{
    await auth.sendPasswordResetEmail(email);
    showMsg('authMsg','Reset email sent.','ok');
  }catch(e){ showMsg('authMsg', e.message, 'err'); }
};
$('btnLogout').onclick = () => auth.signOut();

auth.onAuthStateChanged(user => {
  if(user){
    $('authGate').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('who').innerHTML = '<span class="status-dot" style="background:#22c55e"></span>' + esc(user.email || 'user');
    loadSettings();
    loadRecords();
  }else{
    $('authGate').classList.remove('hidden');
    $('app').classList.add('hidden');
    $('who').textContent = 'Not signed in';
  }
});

/* ---------- PAGE SETTINGS (collection/Test3/global) ---------- */
async function loadSettings(){
  try{
    const snap = await db.collection(COL).doc(SETTINGS_DOC).get();
    if(snap.exists){
      const d = snap.data();
      $('setTitle').value = d.title || '';
      $('setTheme').value = d.theme || 'dark';
      $('setNotes').value = d.notes || '';
    }
  }catch(e){ showMsg('settingsMsg', 'Load error: '+e.message, 'err'); }
}
$('btnSaveSettings').onclick = async () => {
  try{
    await db.collection(COL).doc(SETTINGS_DOC).set({
      title: $('setTitle').value.trim(),
      theme: $('setTheme').value,
      notes: $('setNotes').value.trim(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});
    showMsg('settingsMsg', 'Settings saved.', 'ok');
  }catch(e){ showMsg('settingsMsg', 'Save error: '+e.message, 'err'); }
};
$('btnLoadSettings').onclick = loadSettings;

/* ---------- RECORDS CRUD ---------- */
async function loadRecords(){
  const body = $('recBody');
  body.innerHTML = '<tr><td colspan="5" class="muted">Loading…</td></tr>';
  try{
    const snap = await db.collection(COL)
      .where('type','==','record')
      .get();
    const rows = [];
    snap.forEach(doc => rows.push({id:doc.id, ...doc.data()}));
    rows.sort((a,b)=> (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));

    if(!rows.length){
      body.innerHTML = '<tr><td colspan="5" class="muted">No records yet.</td></tr>';
      return;
    }
    body.innerHTML = rows.map(r=>{
      const atts = (r.attachments||[]).map(a=>`<a href="${esc(a.webViewLink||'#')}" target="_blank">${esc(a.name)}</a>`).join('<br>') || '<span class="muted">—</span>';
      const created = r.createdAt?.seconds ? new Date(r.createdAt.seconds*1000).toLocaleString() : '—';
      return `<tr>
        <td>${esc(r.title)}</td>
        <td>${esc(r.detail)}</td>
        <td class="filelist">${atts}</td>
        <td>${created}</td>
        <td>
          <button class="btn sm gray" onclick="editRecord('${r.id}')">Edit</button>
          <button class="btn sm red" onclick="deleteRecord('${r.id}')">Delete</button>
        </td>
      </tr>`;
    }).join('');
  }catch(e){
    body.innerHTML = `<tr><td colspan="5" style="color:#ef4444">${esc(e.message)}</td></tr>`;
  }
}

$('btnAdd').onclick = async () => {
  const title = $('recTitle').value.trim();
  const detail = $('recDetail').value.trim();
  if(!title) return showMsg('recMsg','Title required','err');
  try{
    await db.collection(COL).add({
      type:'record',
      title, detail,
      attachments: [],
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    $('recTitle').value=''; $('recDetail').value='';
    showMsg('recMsg','Record added.','ok');
    loadRecords();
  }catch(e){ showMsg('recMsg', e.message, 'err'); }
};

$('btnRefresh').onclick = loadRecords;

window.editRecord = async (id) => {
  const nt = prompt('New title:'); if(nt===null) return;
  const nd = prompt('New detail:') || '';
  try{
    await db.collection(COL).doc(id).update({title:nt.trim(), detail:nd.trim()});
    showMsg('recMsg','Updated.','ok'); loadRecords();
  }catch(e){ showMsg('recMsg', e.message, 'err'); }
};
window.deleteRecord = async (id) => {
  if(!confirm('Delete this record? (Drive files remain in Bin unless you remove them.)')) return;
  try{
    await db.collection(COL).doc(id).delete();
    showMsg('recMsg','Deleted.','ok'); loadRecords();
  }catch(e){ showMsg('recMsg', e.message, 'err'); }
};

/* ---------- GOOGLE DRIVE ---------- */
let driveToken = null;
let gisLoaded = false;

function loadGis(){
  return new Promise((resolve,reject)=>{
    if(gisLoaded) return resolve();
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = ()=>{ gisLoaded = true; resolve(); };
    s.onerror = ()=> reject(new Error('Failed to load Google Identity Services'));
    document.head.appendChild(s);
  });
}

$('btnConnectDrive').onclick = async () => {
  try{
    await loadGis();
    const client = google.accounts.oauth2.initTokenClient({
      client_id: CONFIG.drive.clientId,
      scope: CONFIG.drive.scope,
      callback: (resp) => {
        if(resp.error){ showMsg('driveMsg', resp.error, 'err'); return; }
        driveToken = resp.access_token;
        showMsg('driveMsg','Drive connected.','ok');
      }
    });
    client.requestAccessToken();
  }catch(e){ showMsg('driveMsg', e.message, 'err'); }
};

async function ensureSubFolder(){
  // search for existing subfolder inside universal folder
  const q = `name='${CONFIG.drive.subFolderName}' and '${CONFIG.drive.universalFolderId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`;
  const r = await fetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&fields=files(id,name)',{
    headers:{Authorization:'Bearer '+driveToken}
  });
  const j = await r.json();
  if(j.files && j.files.length) return j.files[0].id;

  // create
  const c = await fetch('https://www.googleapis.com/drive/v3/files?fields=id',{
    method:'POST',
    headers:{Authorization:'Bearer '+driveToken, 'Content-Type':'application/json'},
    body: JSON.stringify({
      name: CONFIG.drive.subFolderName,
      mimeType:'application/vnd.google-apps.folder',
      parents:[CONFIG.drive.universalFolderId]
    })
  });
  const cj = await c.json();
  if(!cj.id) throw new Error('Subfolder create failed: '+JSON.stringify(cj));
  return cj.id;
}

async function uploadToDrive(file, subFolderId){
  const meta = { name:file.name, parents:[subFolderId] };
  const boundary = '-------mywebapps' + Date.now();
  const delimiter = "\r\n--" + boundary + "\r\n";
  const closeDelim = "\r\n--" + boundary + "--";

  const reader = new FileReader();
  const fileData = await new Promise((res,rej)=>{
    reader.onload = ()=> res(new Uint8Array(reader.result));
    reader.onerror = rej;
    reader.readAsArrayBuffer(file);
  });

  const metaPart = delimiter +
    'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
    JSON.stringify(meta);
  const filePart = delimiter +
    'Content-Type: ' + (file.type||'application/octet-stream') + '\r\n\r\n';

  const enc = new TextEncoder();
  const metaBytes = enc.encode(metaPart);
  const fileHeadBytes = enc.encode(filePart);
  const closeBytes = enc.encode(closeDelim);

  const body = new Blob([metaBytes, fileHeadBytes, fileData, closeBytes]);
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink,mimeType',{
    method:'POST',
    headers:{
      Authorization:'Bearer '+driveToken,
      'Content-Type':'multipart/related; boundary='+boundary
    },
    body
  });
  const j = await res.json();
  if(!j.id) throw new Error('Upload failed: '+JSON.stringify(j));
  return j;
}

$('btnUpload').onclick = async () => {
  try{
    if(!driveToken) return showMsg('driveMsg','Connect Drive first.','err');
    const file = $('attFile').files[0];
    const recTitle = $('attRecord').value.trim();
    if(!file) return showMsg('driveMsg','Choose a file.','err');
    if(!recTitle) return showMsg('driveMsg','Record title required.','err');

    showMsg('driveMsg','Uploading…','info');
    const subId = await ensureSubFolder();
    const up = await uploadToDrive(file, subId);

    // find matching record by title
    const snap = await db.collection(COL)
      .where('type','==','record')
      .where('title','==',recTitle)
      .get();
    if(snap.empty) return showMsg('driveMsg','Record title not found in Firestore.','err');

    const docRef = snap.docs[0].ref;
    const existing = snap.docs[0].data().attachments || [];
    existing.push({
      driveFileId: up.id,
      name: up.name,
      mimeType: up.mimeType,
      webViewLink: up.webViewLink,
      uploadedAt: Date.now()
    });
    await docRef.update({attachments: existing});

    $('attFile').value='';
    showMsg('driveMsg','Uploaded & linked to record.','ok');
    loadRecords();
  }catch(e){ showMsg('driveMsg', e.message, 'err'); }
};
</script>
