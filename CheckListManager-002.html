nt-size:11px;padding:2px 6px;border-radius:6px;background:var(--accent2);margin:2px;display:inline-block}.hidden-item{opacity:.55}.login{max-width:420px;margin:8vh auto;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.login h1{margin-top:0}.login .field{margin:6px 0 12px}.split{display:flex;gap:7px;flex-wrap:wrap}.smalltext{font-size:12px;color:var(--muted)}

firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();

const $=id=>document.getElementById(id);let uid=null,data={items:[],settings:{theme:'light',retention:30,dateFormat:'DD-MMM-YYYY',timeFormat:'12h'}},view='tree',editing=null,parentForAdd=null,addKind='task',undoStack=[],redoStack=[],saveTimer=null,remoteReady=false;
const now=()=>new Date().toISOString(),id=()=>crypto.randomUUID?crypto.randomUUID():('id'+Date.now()+Math.random().toString(16).slice(2));
function allItems(){return data.items}function find(idv){return allItems().find(x=>x.id===idv)}function descendants(item){let out=[];(item.children||[]).forEach(c=>{out.push(c);out=out.concat(descendants(c))});return out}
function walk(list,fn){list.forEach(x=>{fn(x);walk(x.children||[],fn)})}function countTasks(x){let n=x.type==='task'?1:0;(x.children||[]).forEach(c=>n+=countTasks(c));return n}function doneTasks(x){let n=x.type==='task'&&x.completed?1:0;(x.children||[]).forEach(c=>n+=doneTasks(c));return n}function pct(x){let n=countTasks(x);return n?Math.round(doneTasks(x)/n*100):0}
function hasPending(x){return countTasks(x)>doneTasks(x)}function updateParents(list){list.forEach(x=>{updateParents(x.children||[]);if(x.type==='checklist'){let tasks=countTasks(x);x.completed=tasks>0&&doneTasks(x)===tasks}})}
function dateText(v){if(!v)return '';let d=new Date(v);if(isNaN(d))return '';return d.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})}function isOverdue(x){return x.type==='task'&&!x.completed&&x.due&&new Date(x.due)<new Date()}
function snapshot(){undoStack.push(JSON.stringify(data));if(undoStack.length>40)undoStack.shift();redoStack=[];updateUndoButtons() }function updateUndoButtons(){$('undoBtn').disabled=!undoStack.length;$('redoBtn').disabled=!redoStack.length}
function changed(){data.settings=data.settings||{};scheduleSave();render()}function scheduleSave(){localStorage.setItem('nestedChecklistCache',JSON.stringify(data));$('sync').textContent=navigator.onLine?'Firebase: syncing…':'Offline: changes saved on this device';$('sync').className='status '+(navigator.onLine?'':'offline');clearTimeout(saveTimer);saveTimer=setTimeout(saveRemote,650)}async function saveRemote(){if(!uid||!navigator.onLine)return;try{await DOC.set({owner:uid,appData:data,updatedAt:now()},{merge:true});$('sync').textContent='Firebase: synced';$('sync').className='status online'}catch(e){$('sync').textContent='Sync pending: '+e.message;$('sync').className='status offline'}}
function applyTheme(){document.body.classList.toggle('dark',data.settings.theme==='dark')}
function itemForm(item,parentId,kind){editing=item?item.id:null;parentForAdd=parentId||null;addKind=item?item.type:kind;$('modalTitle').textContent=item?'Edit '+item.type:'Add '+kind;$('modalBody').innerHTML=`<div class="formgrid"><div class="wide"><label>Name *</label><input id="fName" class="field" maxlength="250" value="${esc(item?.name||'')}"></div><div class="wide"><label>Description</label><textarea id="fDesc" class="field" rows="3">${esc(item?.description||'')}</textarea></div>${kindFields(item)}</div>`;$('modal').classList.remove('hidden')}
function kindFields(x){return `<div><label>Priority</label><select id="fPriority" class="field"><option value="">None</option>${['Low','Medium','High','Urgent'].map(p=>`<option ${x?.priority===p?'selected':''}>${p}</option>`).join('')}</select></div><div><label>Due date & time</label><input id="fDue" class="field" type="datetime-local" value="${x?.due?new Date(x.due).toISOString().slice(0,16):''}"></div><div><label>Categories (comma separated)</label><input id="fCats" class="field" value="${esc((x?.categories||[]).join(', '))}"></div><div><label>Tags (comma separated)</label><input id="fTags" class="field" value="${esc((x?.tags||[]).join(', '))}"></div><div><label>Icon</label><input id="fIcon" class="field" maxlength="8" value="${esc(x?.icon|| (x?.type==='checklist'?'📁':'☑'))}"></div><div><label>Color</label><input id="fColor" class="field" type="color" value="${x?.color||'#5267d9'}"></div><div class="wide"><label>Recurrence</label><select id="fRepeat" class="field"><option value="">None</option>${['Daily','Weekly','Monthly','Yearly','Custom'].map(p=>`<option ${x?.recurrence===p?'selected':''}>${p}</option>`).join('')}</select></div></div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function saveItem(){let name=$('fName').value.trim();if(!name){$('fName').focus();return}let item=editing?find(editing):null;snapshot();let t=now();if(item){Object.assign(item,{name,description:$('fDesc').value,priority:$('fPriority').value,due:$('fDue').value?new Date($('fDue').value).toISOString():'',categories:split($('fCats').value),tags:split($('fTags').value),icon:$('fIcon').value||'☑',color:$('fColor').value,recurrence:$('fRepeat').value,updatedAt:t})}else{let fresh={id:id(),type:addKind,name,description:$('fDesc').value,priority:$('fPriority').value,due:$('fDue').value?new Date($('fDue').value).toISOString():'',categories:split($('fCats').value),tags:split($('fTags').value),icon:$('fIcon').value||'☑',color:$('fColor').value,recurrence:$('fRepeat').value,createdAt:t,updatedAt:t,completed:false,history:[],comments:[],children:[],favorite:false,pinned:false,hidden:false,archived:false,deletedAt:null};let p=parentForAdd?find(parentForAdd):null;(p?p.children:data.items).push(fresh)}updateParents(data.items);$('modal').classList.add('hidden');changed()}
function split(s){return s.split(',').map(x=>x.trim()).filter(Boolean)}
function locate(list,idv,parent=null){for(let i=0;i<list.length;i++){if(list[i].id===idv)return {list,index:i,item:list[i],parent};let r=locate(list[i].children||[],idv,list[i]);if(r)return r}return null}
function setComplete(item,val){snapshot();item.completed=val;item.updatedAt=now();item.history=item.history||[];item.history.push({status:val?'Completed':'Uncompleted',at:now()});updateParents(data.items);changed()}
function removeItem(idv){let r=locate(data.items,idv);if(!r)return;snapshot();r.item.deletedAt=now();r.item.updatedAt=now();r.list.splice(r.index,1);data.trash=data.trash||[];data.trash.push(r.item);changed()}
function restoreItem(idv){let i=(data.trash||[]).findIndex(x=>x.id===idv);if(i<0)return;snapshot();let x=data.trash.splice(i,1)[0];x.deletedAt=null;data.items.push(x);changed()}
function moveItem(idv,dir){let r=locate(data.items,idv);if(!r)return;let j=r.index+dir;if(j<0||j>=r.list.length)return;snapshot();[r.list[r.index],r.list[j]]=[r.list[j],r.list[r.index]];changed()}
function toggleFlag(idv,key){let x=find(idv);if(!x)return;snapshot();x[key]=!x[key];x.updatedAt=now();changed()}
function itemMatches(x){let q=$('search').value.toLowerCase().trim(),st=$('filterStatus').value;if(q&&!(`${x.name} ${x.description||''} ${(x.tags||[]).join(' ')} ${(x.categories||[]).join(' ')}`.toLowerCase().includes(q)))return false;if(st==='pending'&&x.completed)return false;if(st==='completed'&&!x.completed)return false;if(st==='overdue'&&!isOverdue(x))return false;return true}
function sortList(list){let mode=$('sort').value;return [...list].sort((a,b)=>{if(a.pinned!==b.pinned)return a.pinned?-1:1;if(mode==='az')return a.name.localeCompare(b.name);if(mode==='za')return b.name.localeCompare(a.name);if(mode==='priority')return ['Urgent','High','Medium','Low',''].indexOf(a.priority)-['Urgent','High','Medium','Low',''].indexOf(b.priority);if(mode==='due')return (a.due||'9999').localeCompare(b.due||'9999');if(mode==='created')return (b.createdAt||'').localeCompare(a.createdAt||'');if(mode==='updated')return (b.updatedAt||'').localeCompare(a.updatedAt||'');return 0})}
function renderTree(list,depth=0){return sortList(list.filter(x=>!x.hidden&&!x.archived)).map(x=>{let child=(x.children||[]).length,progress=pct(x),over=isOverdue(x);return `<div class="item ${x.hidden?'hidden-item':''}" data-id="${x.id}"><div class="itemline"><button class="iconbtn" data-act="collapse" data-id="${x.id}">${x.collapsed?'▸':'▾'}</button>${x.type==='task'?`<input class="check" type="checkbox" data-act="complete" data-id="${x.id}" ${x.completed?'checked':''}>`:'<span>📁</span>'}<div class="name ${x.completed?'done':''}" style="border-left:3px solid ${x.color||'transparent'};padding-left:7px"><span>${esc(x.icon||'')} ${esc(x.name)}</span><span class="meta">${x.type==='checklist'?`${progress}% · ${doneTasks(x)}/${countTasks(x)} tasks`:''}${x.due?` · Due: ${dateText(x.due)}`:''}${x.priority?` · ${esc(x.priority)}`:''}${over?' · OVERDUE':''}</span><span>${(x.categories||[]).map(t=>`<i class="tag">${esc(t)}</i>`).join('')}${(x.tags||[]).map(t=>`<i class="tag">#${esc(t)}</i>`).join('')}</span></div><button class="iconbtn" title="Add child" data-act="child" data-id="${x.id}">＋</button><button class="iconbtn" title="Favorite" data-act="favorite" data-id="${x.id}">${x.favorite?'⭐':'☆'}</button><button class="iconbtn" title="Pin" data-act="pin" data-id="${x.id}">${x.pinned?'📌':'⌖'}</button><button class="iconbtn" title="Edit" data-act="edit" data-id="${x.id}">✎</button><button class="iconbtn" title="Move up" data-act="up" data-id="${x.id}">↑</button><button class="iconbtn" title="Move down" data-act="down" data-id="${x.id}">↓</button><button class="iconbtn" title="Hide" data-act="hide" data-id="${x.id}">◉</button><button class="iconbtn" title="Delete" data-act="delete" data-id="${x.id}">🗑</button></div>${x.type==='checklist'?`<div class="progress" style="margin:0 12px 6px 42px"><i style="width:${progress}%"></i></div>`:''}<div class="children ${x.collapsed?'collapsed':''}">${renderTree(x.children||[],depth+1)}</div></div>`}).join('')}
function collect(predicate){let out=[];walk(data.items,x=>{if(predicate(x))out.push(x)});return out}
function render(){applyTheme();let title={tree:'Tree View',dashboard:'Dashboard',all:'All Tasks',completed:'Completed',overdue:'Overdue',favorites:'Favorites',pinned:'Pinned',calendar:'Calendar',trash:'Recycle Bin',settings:'Settings'};$('viewTitle').textContent=title[view]||'Tree View';$('filters').classList.toggle('hidden',['dashboard','calendar','settings','trash'].includes(view));$('addChecklist').classList.toggle('hidden',view!=='tree');$('addTask').classList.toggle('hidden',view!=='tree');let html='';if(view==='tree'){html=renderTree(data.items)}else if(view==='dashboard'){let tasks=collect(x=>x.type==='task'),completed=tasks.filter(x=>x.completed),over=tasks.filter(isOverdue);html=`<div class="stats"><div class="stat"><span class="muted">Total Tasks</span><strong>${tasks.length}</strong></div><div class="stat"><span class="muted">Completed</span><strong>${completed.length}</strong></div><div class="stat"><span class="muted">Pending</span><strong>${tasks.length-completed.length}</strong></div><div class="stat"><span class="muted">Overdue</span><strong class="overdue">${over.length}</strong></div></div><h3>Main Checklist Progress</h3>${data.items.filter(x=>x.type==='checklist').map(x=>`<div class="item" style="padding:12px"><b>${esc(x.name)}</b><span style="float:right">${pct(x)}%</span><div class="progress"><i style="width:${pct(x)}%"></i></div></div>`).join('')||'<div class="empty">No main checklists yet.</div>'}<h3>Today's Tasks</h3>${renderFlat(tasks.filter(x=>x.due&&new Date(x.due).toDateString()===new Date().toDateString()))}<h3>Completed Today</h3>${renderFlat(tasks.filter(x=>(x.history||[]).some(h=>h.status==='Completed'&&new Date(h.at).toDateString()===new Date().toDateString())))}`}else if(view==='trash'){html=(data.trash||[]).map(x=>`<div class="item"><div class="itemline"><div class="name">${esc(x.name)}<span class="meta">Deleted: ${dateText(x.deletedAt)}</span></div><button data-act="restore" data-id="${x.id}">Restore</button><button class="danger" data-act="purge" data-id="${x.id}">Delete forever</button></div></div>`).join('')}else if(view==='settings'){html=`<div class="card" style="padding:15px"><h3>Settings</h3><label>Theme</label><select id="settingTheme" class="field"><option value="light" ${data.settings.theme==='light'?'selected':''}>Light</option><option value="dark" ${data.settings.theme==='dark'?'selected':''}>Dark</option></select><br><br><label>Recycle Bin retention (days, 0 = keep forever)</label><input id="retention" class="field" type="number" min="0" value="${data.settings.retention??30}"><br><br><label>Date format</label><select id="dateFormat" class="field"><option>DD-MMM-YYYY</option><option>MM/DD/YYYY</option><option>YYYY-MM-DD</option></select><br><br><label>Time format</label><select id="timeFormat" class="field"><option value="12h">12-hour AM/PM</option><option value="24h">24-hour</option></select><div class="split" style="margin-top:12px"><button id="saveSettings">Save Settings</button><button class="secondary" id="exportJson">JSON Backup</button><button class="secondary" id="exportExcel">Excel Export</button><button class="secondary" id="exportPdf">Print / Save PDF</button><button class="danger" id="deleteAll">Delete All Data</button></div><p class="smalltext">Firebase sync: <span id="settingsSync">${$('sync').textContent}</span></p></div>`}else if(view==='calendar'){html=`<div class="card" style="padding:14px"><h3>Due Date Calendar</h3><input id="calendarMonth" type="month" class="field" value="${new Date().toISOString().slice(0,7)}"><div id="calendarItems"></div></div>`}else{let list=collect(x=>x.type==='task'&&(view==='all'||(view==='completed'&&x.completed)||(view==='overdue'&&isOverdue(x))||(view==='favorites'&&x.favorite)||(view==='pinned'&&x.pinned)));list=list.filter(itemMatches);html=renderFlat(list)}$('content').innerHTML=html||'<div class="empty">یہاں ابھی کوئی آئٹم موجود نہیں۔ + بٹن سے نیا Checklist یا Task بنائیں۔</div>';if(view==='calendar')renderCalendar();}
function renderFlat(list){return list.map(x=>`<div class="item"><div class="itemline"><input class="check" type="checkbox" data-act="complete" data-id="${x.id}" ${x.completed?'checked':''}><div class="name ${x.completed?'done':''}">${esc(x.icon||'☑')} ${esc(x.name)}<span class="meta">${esc(x.description||'')}${x.due?' · Due: '+dateText(x.due):''}${isOverdue(x)?' · OVERDUE':''}</span><span>${(x.categories||[]).map(t=>`<i class="tag">${esc(t)}</i>`).join('')}${(x.tags||[]).map(t=>`<i class="tag">#${esc(t)}</i>`).join('')}</span></div><button class="iconbtn" data-act="edit" data-id="${x.id}">✎</button><button class="iconbtn" data-act="delete" data-id="${x.id}">🗑</button></div></div>`).join('')}
function renderCalendar(){let m=$('calendarMonth').value||new Date().toISOString().slice(0,7);let list=collect(x=>x.type==='task'&&x.due&&x.due.slice(0,7)===m).sort((a,b)=>a.due.localeCompare(b.due));$('calendarItems').innerHTML=list.length?renderFlat(list):'<div class="empty">No tasks due this month.</div>'}
$('content').addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act,idv=b.dataset.id,x=find(idv);if(a==='collapse'){x.collapsed=!x.collapsed;render()}if(a==='child'){let choice=prompt('Add inside this item:\n1 = Checklist\n2 = Task','2');if(choice==='1')itemForm(null,idv,'checklist');else if(choice==='2')itemForm(null,idv,'task')}if(a==='edit')itemForm(x,null,x.type);if(a==='favorite')toggleFlag(idv,'favorite');if(a==='pin')toggleFlag(idv,'pinned');if(a==='hide'){snapshot();x.hidden=!x.hidden;changed()}if(a==='delete'&&confirm('Move this item to Recycle Bin?'))removeItem(idv);if(a==='up')moveItem(idv,-1);if(a==='down')moveItem(idv,1);if(a==='restore')restoreItem(idv);if(a==='purge'&&confirm('Permanently delete?')){data.trash=data.trash.filter(t=>t.id!==idv);changed()}});
$('content').addEventListener('change',e=>{let el=e.target;if(el.dataset.act==='complete'){let x=find(el.dataset.id);if(x)setComplete(x,el.checked)}});
$('addRoot').onclick=()=>{let choice=prompt('Add new item:\n1 = Checklist\n2 = Task','1');if(choice==='1')itemForm(null,null,'checklist');else if(choice==='2')itemForm(null,null,'task')};$('addChecklist').onclick=()=>itemForm(null,null,'checklist');$('addTask').onclick=()=>itemForm(null,null,'task');$('cancelModal').onclick=()=>$('modal').classList.add('hidden');$('saveModal').onclick=saveItem;
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n===b));render()});$('search').oninput=render;$('filterStatus').onchange=render;$('sort').onchange=render;$('calendarMonth').onchange=renderCalendar;
$('themeBtn').onclick=()=>{data.settings.theme=data.settings.theme==='dark'?'light':'dark';changed()};$('content').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.id==='saveSettings'){data.settings.theme=$('settingTheme').value;data.settings.retention=Number($('retention').value)||0;data.settings.dateFormat=$('dateFormat').value;data.settings.timeFormat=$('timeFormat').value;snapshot();changed();alert('Settings saved')}if(b.id==='exportJson')download('nested-checklist-backup.json',JSON.stringify(data,null,2),'application/json');if(b.id==='exportExcel'){let rows=[];walk(data.items,x=>rows.push({ID:x.id,Type:x.type,Name:x.name,Description:x.description,Completed:x.completed,Priority:x.priority,Due:x.due,Categories:(x.categories||[]).join(', '),Tags:(x.tags||[]).join(', '),Created:x.createdAt,Updated:x.updatedAt,ParentPath:parentPath(x.id)}));let ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Tasks');XLSX.writeFile(wb,'NestedChecklist.xlsx')}if(b.id==='exportPdf')window.print();if(b.id==='deleteAll'&&confirm('Delete ALL checklist data permanently?')){snapshot();data.items=[];data.trash=[];changed()}});$('content').addEventListener('change',e=>{if(e.target.id==='calendarMonth')renderCalendar()});
function parentPath(idv){let path=[];function rec(list){for(let x of list){if(x.id===idv){path.push(x.name);return true}if(rec(x.children||[])){path.unshift(x.name);return true}}return false}rec(data.items);return path.join(' > ')}function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
$('undoBtn').onclick=()=>{if(!undoStack.length)return;redoStack.push(JSON.stringify(data));data=JSON.parse(undoStack.pop());scheduleSave();render();updateUndoButtons()};$('redoBtn').onclick=()=>{if(!redoStack.length)return;undoStack.push(JSON.stringify(data));data=JSON.parse(redoStack.pop());scheduleSave();render();updateUndoButtons()};
$('logoutBtn').onclick=()=>auth.signOut();
// Auto sign-in on load; if account doesn't exist yet, create it silently.
async function autoLogin(){
  try{
    await auth.signInWithEmailAndPassword(AUTO_EMAIL,AUTO_PASS);
  }catch(e){
    if(e.code==='auth/user-not-found'||e.code==='auth/invalid-credential'||e.code==='auth/invalid-login-credentials'){
      try{await auth.createUserWithEmailAndPassword(AUTO_EMAIL,AUTO_PASS);}
      catch(e2){try{await auth.signInWithEmailAndPassword(AUTO_EMAIL,AUTO_PASS);}catch(e3){$('sync').textContent='Login error: '+e3.message;$('sync').className='status offline';}}
    }else{$('sync').textContent='Login error: '+e.message;$('sync').className='status offline';}
  }
}
auth.onAuthStateChanged(async user=>{if(!user){uid=null;return}uid=user.uid;$('app').classList.remove('hidden');try{let doc=await DOC.get();if(doc.exists&&doc.data().owner===uid&&doc.data().appData){data=doc.data().appData}else{let cached=localStorage.getItem('nestedChecklistCache');if(cached)data=JSON.parse(cached);await saveRemote()}remoteReady=true;$('sync').textContent='Firebase: synced';$('sync').className='status online'}catch(e){let cached=localStorage.getItem('nestedChecklistCache');if(cached)data=JSON.parse(cached);$('sync').textContent='Offline / Firebase error: '+e.message;$('sync').className='status offline'}render()});
window.addEventListener('online',saveRemote);window.addEventListener('offline',()=>{$('sync').textContent='Offline: local changes will sync later';$('sync').className='status offline'});
autoLogin();
