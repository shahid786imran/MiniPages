<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyWebApps - Shareable Drive Files</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ---------- Firebase Config ----------
  const firebaseConfig = {
    apiKey: "AIzaSyAFiJNThb3TJsqiPLIcqk20XU9ag59wdOs",
    authDomain: "mywebapps-e3b63.firebaseapp.com",
    projectId: "mywebapps-e3b63",
    storageBucket: "mywebapps-e3b63.firebasestorage.app",
    messagingSenderId: "46681415809",
    appId: "1:46681415809:web:c4528b9da97abc310a2d80"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);
  const FILES_COL = "Shareable Drive Files";

  // ---------- Drive Config ----------
  const DRIVE_CLIENT_ID = "103334413601-4msa4v80kgdir5k6c9kjj4m17h4f9djr.apps.googleusercontent.com";
  const DRIVE_SCOPE     = "https://www.googleapis.com/auth/drive.file";
  const MAIN_FOLDER_ID  = "1fkDwkqErHogFqYU4x2OwYBSMk-n5KsG_";
  const BIN_FOLDER_NAME = "Bin";

  // ---------- State ----------
  let driveToken = null;      // OAuth access token
  let driveReady = false;     // Drive connected?
  let currentFiles = [];      // selected File objects
  let foldersCache = [];      // {id, name}
  let binFolderId  = null;

  // ---------- DOM helpers ----------
  const $ = (id) => document.getElementById(id);

  // ---------- 1) Anonymous Auth ----------
  onAuthStateChanged(auth, (user) => {
    if (user) {
      $("authStatus").textContent = "✅ Signed in (anonymous)";
      initDrive();
    } else {
      signInAnonymously(auth).catch((e) => {
        console.error(e);
        $("authStatus").textContent = "❌ Auth error: " + e.message;
      });
    }
  });

  // ---------- 2) Google Drive OAuth ----------
  function initDrive() {
    // GIS script load
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.onload = () => {
      window.google.accounts.oauth2.initTokenClient({
        client_id: DRIVE_CLIENT_ID,
        scope: DRIVE_SCOPE,
        callback: (resp) => {
          if (resp.access_token) {
            driveToken = resp.access_token;
            driveReady = true;
            $("driveStatus").textContent = "✅ Drive connected";
            $("connectDriveBtn").style.display = "none";
            loadFolders();
            loadFiles();
          }
        }
      });
    };
    document.head.appendChild(s);

    $("connectDriveBtn").addEventListener("click", () => {
      const client = window.google.accounts.oauth2.initTokenClient({
        client_id: DRIVE_CLIENT_ID,
        scope: DRIVE_SCOPE,
        callback: (resp) => {
          if (resp.access_token) {
            driveToken = resp.access_token;
            driveReady = true;
            $("driveStatus").textContent = "✅ Drive connected";
            $("connectDriveBtn").style.display = "none";
            loadFolders();
            loadFiles();
          }
        }
      });
      client.requestAccessToken();
    });
  }

  // ---------- Drive API helpers ----------
  async function driveFetch(url, opts = {}) {
    opts.headers = { ...(opts.headers || {}), Authorization: "Bearer " + driveToken };
    const r = await fetch(url, opts);
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }

  async function loadFolders() {
    // MyWebApps ke andar ke folders (Bin ko chhod ke)
    const q = encodeURIComponent(
      `'${MAIN_FOLDER_ID}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`
    );
    const data = await driveFetch(
      `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&pageSize=1000`
    );
    foldersCache = data.files || [];
    binFolderId = (foldersCache.find((f) => f.name === BIN_FOLDER_NAME) || {}).id || null;
    renderFolderDropdown();
  }

  function renderFolderDropdown() {
    const sel = $("folderSelect");
    sel.innerHTML = `<option value="">-- folder select karein --</option>`;
    foldersCache
      .filter((f) => f.name !== BIN_FOLDER_NAME)
      .forEach((f) => {
        const o = document.createElement("option");
        o.value = f.id;
        o.textContent = f.name;
        sel.appendChild(o);
      });
    const oNew = document.createElement("option");
    oNew.value = "__new__";
    oNew.textContent = "➕ Naya folder banayein";
    sel.appendChild(oNew);
  }

  $("folderSelect").addEventListener("change", (e) => {
    $("newFolderWrap").style.display = e.target.value === "__new__" ? "block" : "none";
  });

  async function ensureBinFolder() {
    if (binFolderId) return binFolderId;
    const body = {
      name: BIN_FOLDER_NAME,
      mimeType: "application/vnd.google-apps.folder",
      parents: [MAIN_FOLDER_ID]
    };
    const res = await driveFetch("https://www.googleapis.com/drive/v3/files", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    binFolderId = res.id;
    return binFolderId;
  }

  async function ensureFolder(name) {
    // same naam ka folder ho to wahi, warna naya banao
    const found = foldersCache.find((f) => f.name === name);
    if (found) return found.id;
    const body = {
      name,
      mimeType: "application/vnd.google-apps.folder",
      parents: [MAIN_FOLDER_ID]
    };
    const res = await driveFetch("https://www.googleapis.com/drive/v3/files", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    foldersCache.push({ id: res.id, name });
    renderFolderDropdown();
    return res.id;
  }

  // ---------- 3) Upload ----------
  $("fileInput").addEventListener("change", (e) => {
    currentFiles = Array.from(e.target.files);
    renderFileInputs();
  });

  function renderFileInputs() {
    const wrap = $("fileInputs");
    wrap.innerHTML = "";
    if (!currentFiles.length) {
      wrap.innerHTML = `<p class="muted">Koi file select nahi ki.</p>`;
      return;
    }
    currentFiles.forEach((file, i) => {
      const div = document.createElement("div");
      div.className = "file-row";
      div.innerHTML = `
        <div class="file-row-head">
          <span class="file-type">${iconForType(file.type)}</span>
          <strong>${escapeHtml(file.name)}</strong>
          <span class="muted">(${fmtSize(file.size)})</span>
        </div>
        <input type="text" id="name-${i}" value="${escapeAttr(stripExt(file.name))}" placeholder="Custom name" />
        <textarea id="desc-${i}" rows="2" placeholder="Description"></textarea>
        <div class="progress"><div class="bar" id="bar-${i}"></div></div>
      `;
      wrap.appendChild(div);
    });
  }

  $("uploadBtn").addEventListener("click", async () => {
    if (!driveReady) return alert("Pehle 'Connect Google Drive' dabaein.");
    if (!currentFiles.length) return alert("File select karein.");

    let folderId;
    const sel = $("folderSelect").value;
    if (sel === "__new__") {
      const nm = $("newFolderName").value.trim();
      if (!nm) return alert("Naya folder ka naam likhein.");
      folderId = await ensureFolder(nm);
    } else if (sel) {
      folderId = sel;
    } else {
      return alert("Folder select karein ya naya naam likhein.");
    }

    $("uploadBtn").disabled = true;

    for (let i = 0; i < currentFiles.length; i++) {
      const file = currentFiles[i];
      const customName = $("name-" + i).value.trim() || stripExt(file.name);
      const desc = $("desc-" + i).value.trim();

      try {
        // 1) metadata (name + parents)
        const meta = {
          name: customName + extOf(file.name),
          description: desc,
          parents: [folderId],
          mimeType: file.type || "application/octet-stream"
        };
        const initRes = await fetch(
          "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,name,webViewLink",
          {
            method: "POST",
            headers: {
              Authorization: "Bearer " + driveToken,
              "Content-Type": "application/json; charset=UTF-8",
              "X-Upload-Content-Type": file.type || "application/octet-stream"
            },
            body: JSON.stringify(meta)
          }
        );
        if (!initRes.ok) throw new Error(await initRes.text());
        const uploadUrl = initRes.headers.get("Location");

        // 2) file bytes upload (progress ke saath)
        await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open("PUT", uploadUrl);
          xhr.setRequestHeader("Content-Type", file.type || "application/octet-stream");
          xhr.upload.onprogress = (ev) => {
            if (ev.lengthComputable) {
              const pct = Math.round((ev.loaded / ev.total) * 100);
              $("bar-" + i).style.width = pct + "%";
            }
          };
          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) resolve(JSON.parse(xhr.responseText));
            else reject(new Error(xhr.responseText));
          };
          xhr.onerror = () => reject(new Error("Network error"));
          xhr.send(file);
        });

        // 3) permission: anyone with link can view
        // file id chahiye — resumable response se
        // response me webViewLink + id milta hai (fields me maanga)
        // permission create karo
        const uploaded = await driveFetch(
          `https://www.googleapis.com/drive/v3/files?fields=files(id,name,webViewLink)&q=${encodeURIComponent(
            `name='${(customName + extOf(file.name)).replace(/'/g, "\\'")}' and '${folderId}' in parents and trashed=false`
          )}`
        ).catch(() => null);

        let fileId = null, link = null;
        if (uploaded && uploaded.files && uploaded.files.length) {
          fileId = uploaded.files[0].id;
          link = uploaded.files[0].webViewLink;
        }

        if (fileId) {
          await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}/permissions`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ role: "reader", type: "anyone" })
          });
        }

        // 4) Firestore me save
        await addDoc(collection(db, FILES_COL), {
          name: customName,
          description: desc,
          folder: sel === "__new__" ? $("newFolderName").value.trim() : (foldersCache.find(f => f.id === folderId)?.name || ""),
          folderId: folderId,
          fileId: fileId || "",
          link: link || "",
          type: file.type || "",
          size: file.size,
          createdAt: new Date().toISOString(),
          inBin: false
        });

        $("bar-" + i).style.width = "100%";
      } catch (e) {
        console.error(e);
        alert(`File "${file.name}" upload fail: ${e.message}`);
      }
    }

    $("uploadBtn").disabled = false;
    $("fileInput").value = "";
    currentFiles = [];
    renderFileInputs();
    loadFiles();
    alert("Upload complete! ✅");
  });

  // ---------- 4) Firestore list + search ----------
  async function loadFiles() {
    const snap = await getDocs(collection(db, FILES_COL));
    const all = [];
    snap.forEach((d) => all.push({ id: d.id, ...d.data() }));
    window.__allFiles = all;
    renderList();
  }

  $("searchBox").addEventListener("input", renderList);

  function renderList() {
    const all = window.__allFiles || [];
    const q = ($("searchBox").value || "").toLowerCase().trim();

    const active = all.filter((f) => !f.inBin);
    const bin    = all.filter((f) => f.inBin);

    const filterFn = (f) =>
      !q || (f.name || "").toLowerCase().includes(q) || (f.description || "").toLowerCase().includes(q);

    const activeFiltered = active.filter(filterFn).sort((a,b)=> (b.createdAt||"").localeCompare(a.createdAt||""));
    const binFiltered    = bin.filter(filterFn);

    $("filesList").innerHTML = activeFiltered.length
      ? activeFiltered.map(cardHtml).join("")
      : `<p class="muted">Koi file nahi.</p>`;

    $("binList").innerHTML = binFiltered.length
      ? binFiltered.map(cardHtml).join("")
      : `<p class="muted">Bin khali hai.</p>`;
  }

  function cardHtml(f) {
    const link = f.link || "";
    return `
      <div class="card">
        <div class="card-top">
          <span class="file-type">${iconForType(f.type)}</span>
          <div>
            <div class="card-name">${escapeHtml(f.name || "Untitled")}</div>
            <div class="muted small">${escapeHtml(f.folder || "")} • ${fmtDate(f.createdAt)}</div>
          </div>
        </div>
        ${f.description ? `<div class="card-desc">${escapeHtml(f.description)}</div>` : ""}
        ${link ? `
          <div class="link-row">
            <input readonly value="${escapeAttr(link)}" />
            <button data-copy="${escapeAttr(link)}">Copy</button>
          </div>` : ""}
        <div class="card-actions">
          ${f.inBin
            ? `<button data-restore="${f.id}">♻ Restore</button>
               <button data-perm="${f.id}" class="danger">🗑 Permanent delete</button>`
            : `<button data-del="${f.id}" class="danger">🗑 Delete (Bin)</button>`}
        </div>
      </div>`;
  }

  // ---------- 5) Delete / Restore / Permanent ----------
  document.addEventListener("click", async (e) => {
    const t = e.target;
    if (!(t instanceof HTMLElement)) return;

    if (t.dataset.copy) {
      navigator.clipboard.writeText(t.dataset.copy);
      t.textContent = "✅";
      setTimeout(() => (t.textContent = "Copy"), 1200);
    }

    if (t.dataset.del) {
      const id = t.dataset.del;
      const all = window.__allFiles || [];
      const f = all.find((x) => x.id === id);
      if (!f) return;
      if (!confirm("File Bin mein bhejni hai?")) return;

      // Drive: parent change -> Bin
      try {
        const binId = await ensureBinFolder();
        await driveFetch(
          `https://www.googleapis.com/drive/v3/files/${f.fileId}?addParents=${binId}&removeParents=${f.folderId}&fields=id`,
          { method: "PATCH" }
        );
      } catch (err) { console.warn("Drive move fail:", err); }

      // Firestore update
      const { updateDoc, doc: fdoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
      await updateDoc(fdoc(db, FILES_COL, id), { inBin: true, deletedAt: new Date().toISOString() });
      loadFiles();
    }

    if (t.dataset.restore) {
      const id = t.dataset.restore;
      const all = window.__allFiles || [];
      const f = all.find((x) => x.id === id);
      if (!f) return;

      try {
        await driveFetch(
          `https://www.googleapis.com/drive/v3/files/${f.fileId}?addParents=${f.folderId}&removeParents=${binFolderId}&fields=id`,
          { method: "PATCH" }
        );
      } catch (err) { console.warn("Drive restore fail:", err); }

      const { updateDoc, doc: fdoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
      await updateDoc(fdoc(db, FILES_COL, id), { inBin: false });
      loadFiles();
    }

    if (t.dataset.perm) {
      const id = t.dataset.perm;
      const all = window.__allFiles || [];
      const f = all.find((x) => x.id === id);
      if (!f) return;
      if (!confirm("Permanently delete? Wapas nahi aayegi.")) return;

      try {
        await driveFetch(`https://www.googleapis.com/drive/v3/files/${f.fileId}`, { method: "DELETE" });
      } catch (err) { console.warn("Drive delete fail:", err); }

      const { deleteDoc, doc: fdoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
      await deleteDoc(fdoc(db, FILES_COL, id));
      loadFiles();
    }
  });

  // ---------- Utilities ----------
  function stripExt(n) { return n.replace(/\.[^.]+$/, ""); }
  function extOf(n)    { const m = n.match(/(\.[^.]+)$/); return m ? m[1] : ""; }
  function fmtSize(b) {
    if (b < 1024) return b + " B";
    if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
    if (b < 1073741824) return (b / 1048576).toFixed(1) + " MB";
    return (b / 1073741824).toFixed(2) + " GB";
  }
  function fmtDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return d.toLocaleString();
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }
  function escapeAttr(s) { return escapeHtml(s).replace(/"/g, "&quot;"); }
  function iconForType(t) {
    if (!t) return "📄";
    if (t.startsWith("image/")) return "🖼️";
    if (t.startsWith("video/")) return "🎬";
    if (t.startsWith("audio/")) return "🎵";
    if (t.includes("pdf")) return "📕";
    if (t.includes("zip") || t.includes("rar")) return "🗜️";
    if (t.includes("word") || t.includes("document")) return "📝";
    if (t.includes("sheet") || t.includes("excel")) return "📊";
    return "📄";
  }

  // expose for debugging
  window.__driveToken = () => driveToken;
  window.__loadFiles = loadFiles;
</script>

<style>
  :root {
    --grad: linear-gradient(135deg, #4285f4 0%, #7b3ff2 60%, #b14bf4 100%);
    --bg: #f6f8fc;
    --text: #202124;
    --muted: #5f6368;
    --card: #ffffff;
    --border: #e3e6ec;
    --danger: #d93025;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app { max-width: 1080px; margin: 0 auto; padding: 22px 18px 60px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 14px 18px; border-radius: var(--radius);
    background: var(--grad); color: #fff; box-shadow: 0 10px 28px rgba(66,133,244,.28);
  }
  .topbar h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: .2px; }
  .topbar .status { font-size: 12.5px; opacity: .95; }
  .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.16); margin-left: 6px; }

  .section {
    margin-top: 22px; background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px;
  }
  .section h2 { margin: 0 0 12px; font-size: 15px; color: #2c2f36; }
  .muted { color: var(--muted); font-size: 13px; }
  .small { font-size: 12px; }

  input[type="text"], textarea, input[type="search"] {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 10px; font: inherit; outline: none; background: #fff;
    transition: border .15s, box-shadow .15s;
  }
  input:focus, textarea:focus {
    border-color: #4285f4; box-shadow: 0 0 0 3px rgba(66,133,244,.15);
  }
  textarea { resize: vertical; min-height: 40px; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row > * { flex: 0 0 auto; }
  .grow { flex: 1 1 240px; }

  button {
    font: inherit; cursor: pointer; border: none; border-radius: 10px;
    padding: 10px 16px; background: #eef1f6; color: #23262d; font-weight: 600;
    transition: transform .05s, box-shadow .15s, background .15s;
  }
  button:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--grad); color: #fff; box-shadow: 0 6px 18px rgba(66,133,244,.35); }
  button.danger { background: #fdeceb; color: var(--danger); }
  button:disabled { opacity: .6; cursor: not-allowed; }

  .drop {
    border: 2px dashed #c9d3e4; border-radius: 12px; padding: 22px;
    text-align: center; color: var(--muted); background: #fbfcff;
  }
  .drop input { display: block; margin: 0 auto; }

  .file-row {
    border: 1px solid var(--border); border-radius: 12px; padding: 12px;
    margin-top: 10px; background: #fafbff;
  }
  .file-row-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .file-type { font-size: 20px; }
  .file-row input, .file-row textarea { margin-top: 8px; }

  .progress { height: 8px; background: #e9edf5; border-radius: 999px; margin-top: 10px; overflow: hidden; }
  .progress .bar { height: 100%; width: 0; background: var(--grad); transition: width .25s; }

  #filesList, #binList { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card {
    background: #fff; border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.03);
  }
  .card-top { display: flex; gap: 10px; align-items: center; }
  .card-name { font-weight: 600; font-size: 14.5px; word-break: break-word; }
  .card-desc { font-size: 13px; color: #3c4043; }
  .link-row { display: flex; gap: 8px; }
  .link-row input { flex: 1; font-size: 12px; }
  .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .search-wrap { margin-bottom: 12px; }

  .bin-section { margin-top: 30px; }
  .bin-section h2 { color: var(--danger); }

  @media (max-width: 520px) {
    .topbar { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Topbar -->
  <div class="topbar">
    <div>
      <h1>MyWebApps — Shareable Drive Files</h1>
      <div class="status">
        <span id="authStatus" class="pill">Auth: checking…</span>
        <span id="driveStatus" class="pill">Drive: not connected</span>
      </div>
    </div>
    <button id="connectDriveBtn" class="primary">🔗 Connect Google Drive</button>
  </div>

  <!-- Upload section -->
  <div class="section">
    <h2>⬆ Upload Files</h2>

    <div class="drop">
      <input type="file" id="fileInput" multiple />
      <div class="muted">Multiple files select kar sakte hain. Koi size/type limit nahi.</div>
    </div>

    <div class="row" style="margin-top:14px;">
      <div class="grow">
        <label class="muted">Folder</label>
        <select id="folderSelect" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;">
          <option value="">-- folder select karein --</option>
        </select>
      </div>
      <div id="newFolderWrap" style="display:none;" class="grow">
        <label class="muted">Naya folder ka naam</label>
        <input type="text" id="newFolderName" placeholder="e.g. Test1" />
      </div>
    </div>

    <div id="fileInputs" style="margin-top:14px;">
      <p class="muted">Koi file select nahi ki.</p>
    </div>

    <div style="margin-top:14px;">
      <button id="uploadBtn" class="primary">⬆ Upload</button>
    </div>
  </div>

  <!-- Files list -->
  <div class="section">
    <h2>📁 Uploaded Files</h2>
    <div class="search-wrap">
      <input type="search" id="searchBox" placeholder="🔍 Search (naam ya description)…" />
    </div>
    <div id="filesList"><p class="muted">Loading…</p></div>
  </div>

  <!-- Bin section -->
  <div class="section bin-section">
    <h2>🗑 Bin</h2>
    <div id="binList"><p class="muted">Bin khali hai.</p></div>
  </div>

</div>
</body>
</html>
