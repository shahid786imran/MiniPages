<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b4fc4"><title>Nested Checklist Manager</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--text:#0f172a;--muted:#778096;--line:#e5e9f2;--accent:#5267d9;--accent2:#e9edff;--danger:#d94343;--green:#21865b;--shadow:0 8px 28px #26345b12;--font-size:14px;--task-h:22px;--cl-h:28px;--item-gap:4px;
  --task-bg:linear-gradient(135deg,#0e7490,#14b8a6);--task-border:#0f172a;--task-text:#000;
  --task-pct:#000;--task-date:#000;--task-handle:#000;
  --cl-bg:linear-gradient(135deg,#ccfbf1,#ecfccb);--cl-border:#0f172a;--cl-text:#000;
  --cl-handle:#000;--cl-plus-bg:#fff;--cl-plus-border:#000;--cl-plus-text:#000;
  --cl-done-bg:#cbd5e1;--cl-done-text:#000;
  --prog-bg:rgba(255,255,255,.2);--prog-fill:#06b6d4;
  --done-bg:linear-gradient(135deg,#cfd9e3,#e3ebf1);

  --g-text:#000;
  --g-muted:#334155;
  --g-border1:rgba(13,148,136,.5);
  --g-border2:rgba(6,182,212,.5);
  --g-bg1:linear-gradient(90deg,rgba(204,251,241,.55),rgba(236,252,203,.35) 50%,rgba(255,255,255,.6));
  --g-bg2:linear-gradient(90deg,rgba(165,243,252,.5),rgba(187,247,208,.35) 50%,rgba(255,255,255,.6));
  --g-shadow:0 6px 18px rgba(20,184,166,.18),0 2px 6px rgba(15,23,42,.08),inset 0 2px 3px rgba(255,255,255,.85),inset 0 -1px 2px rgba(15,23,42,.08),inset 0 0 0 1px rgba(20,184,166,.15);
  --g-pill-bg:#fff;
  --g-pill-fg:#000;
  --g-pill-border:rgba(20,184,166,.4);
  --g-del-bg:rgba(252,165,165,.3);
  --g-del-fg:#b91c1c;
  --g-del-border:rgba(252,165,165,.5);

  --g-task-bg1:linear-gradient(135deg,rgba(30,27,75,.92),rgba(67,56,202,.88));
  --g-task-bg2:linear-gradient(135deg,rgba(76,29,149,.92),rgba(190,24,93,.85));
  --g-task-border:rgba(255,255,255,.18);
  --g-task-text:#000;
  --g-task-muted:#000;
  --g-task-pill-bg:#fff;
  --g-task-pill-fg:#000;
  --g-task-pill-border:rgba(0,0,0,.25);
  --g-task-shadow:0 8px 22px rgba(30,27,75,.35),inset 0 2px 3px rgba(255,255,255,.25),inset 0 -1px 2px rgba(0,0,0,.25);

  --g-done-bg1:linear-gradient(135deg,rgba(203,213,225,.7),rgba(226,232,240,.55));
  --g-done-bg2:linear-gradient(135deg,rgba(214,222,233,.7),rgba(237,242,248,.55));
  --g-done-border:rgba(148,163,184,.6);
  --g-done-text:#000;

  --plus-glass-bg:rgba(255,255,255,.15);
  --plus-glass-border:#0d4759;
  --plus-glass-text:#000;
  --plus-glass-shadow:inset 0 1px 0 rgba(255,255,255,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:auto}
body{color:var(--g-text);font:var(--font-size)/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial;min-height:100dvh;overflow-x:hidden;-webkit-user-select:none;user-select:none;background:var(--page-bg,#ecfeff);background-attachment:fixed;transition:background .5s ease}
body.locked{overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:8px 12px;background:var(--accent);color:#fff;font-weight:600}
.hidden{display:none!important}

#fbPill{position:fixed;top:10px;left:50%;transform:translateX(-50%) translateY(-40px);background:#21865b;color:#fff;padding:6px 16px;border-radius:999px;font-size:12px;font-weight:700;box-shadow:0 6px 18px #21865b55;z-index:120;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
#fbPill.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fbPill.sync{background:#c07a1a;box-shadow:0 6px 18px #c07a1a55}
#fbPill.off{background:#d94343;box-shadow:0 6px 18px #d9434355}

#loader{position:fixed;inset:0;background:linear-gradient(135deg,#e0e7ff,#fce7f3);display:flex;align-items:center;justify-content:center;z-index:200;transition:opacity .3s}
#loader.hide{opacity:0;pointer-events:none}
.dots{display:flex;gap:8px}
.dots span{width:12px;height:12px;background:#8b5cf6;border-radius:50%;animation:dotBounce .6s ease-in-out infinite alternate}
.dots span:nth-child(2){animation-delay:.15s;background:#ec4899}
.dots span:nth-child(3){animation-delay:.3s;background:#38bdf8}
@keyframes dotBounce{from{transform:translateY(0);opacity:.6}to{transform:translateY(-14px);opacity:1}}

.app{max-width:1100px;margin:0 auto;padding:14px;padding-top:52px;min-height:100dvh;display:flex;flex-direction:column;justify-content:flex-start}
.main{background:transparent;padding:0;width:100%;max-width:480px;margin:0 auto}
.field{background:var(--panel);color:var(--g-text);border:1px solid var(--g-pill-border);border-radius:4px;padding:11px 12px;width:100%;font-size:var(--font-size);margin:2px 0;min-width:0}

.glass,.gRow{
  display:flex;align-items:center;gap:8px;
  padding:6px 8px;border-radius:10px;
  backdrop-filter:blur(18px) saturate(200%);
  -webkit-backdrop-filter:blur(18px) saturate(200%);
  box-shadow:var(--g-shadow);
  border:1.5px solid var(--g-border1);
  background:var(--g-bg1);
  transition:transform .12s ease,filter .15s ease,background .3s ease,color .3s ease;
  min-width:0;
}
.glass:nth-child(even),.gRow:nth-child(even){border-color:var(--g-border2);background:var(--g-bg2)}
.glass:active,.gRow:active{transform:scale(.985);filter:brightness(1.03)}

.listWrap{padding:0;position:relative}
.titem{margin:var(--item-gap) 0 0 0;position:relative;transition:opacity .3s ease;will-change:transform}

.titem.task > .line{
  position:relative;
  display:flex;align-items:center;gap:5px;
  padding:0 0 0 7px;
  border-radius:4px;
  min-height:var(--task-h);
  height:var(--task-h);
  overflow:hidden;
  backdrop-filter:blur(18px) saturate(200%);
  -webkit-backdrop-filter:blur(18px) saturate(200%);
  box-shadow:var(--g-task-shadow);
  border:1.5px solid var(--g-task-border);
  background:var(--g-task-bg1);
  color:var(--g-task-text);
  transition:transform .12s ease,filter .15s ease,background .5s ease,color .5s ease;
  cursor:pointer;
}
.titem.task:nth-child(even) > .line{background:var(--g-task-bg2)}
.titem.task > .line:active{transform:scale(.99)}
.titem.task > .line .handle{color:var(--g-task-muted);font-size:calc(var(--task-h) * 0.4);width:calc(var(--task-h) * 0.4)}
.titem.task > .line .lastDate{color:var(--g-task-muted);font-size:calc(8px + (var(--task-h) - 22px) * 0.05)}
.titem.task > .line .name{font-size:calc(var(--font-size) * 0.85);line-height:1.1}
.titem.task > .line .nameBlock{padding:0}
.titem.task > .line .pct{
  color:var(--g-task-text);background:transparent;border:0;padding:0 2px;
  font-size:calc(9.5px + (var(--task-h) - 22px) * 0.06);
  line-height:calc(var(--task-h) * 0.55);
  height:calc(var(--task-h) * 0.55);
  display:inline-flex;align-items:center;
}
.titem.task > .line .pencilBtn,.titem.task > .line .editBtn{color:#000}

.plus{
  background:var(--plus-glass-bg);
  color:var(--plus-glass-text);
  border:1px solid var(--plus-glass-border);
  border-radius:4px;
  padding:0;
  width:22px;height:22px;
  font-weight:800;font-size:12px;line-height:1;
  flex:none;display:inline-flex;align-items:center;justify-content:center;
  backdrop-filter:blur(14px) saturate(200%);
  box-shadow:var(--plus-glass-shadow);
  margin:0;cursor:pointer;
}
.plus:active{transform:scale(.95)}
.titem.task > .line .plus{
  width:calc(var(--task-h) * 0.65);
  height:calc(var(--task-h) * 0.65);
  min-width:16px;min-height:16px;
  font-size:calc(var(--task-h) * 0.4);
  margin:0;
}
.titem.task > .line .endGroup{padding-right:4px}

.titem.doneSub > .line{
  display:flex;align-items:center;gap:5px;
  padding:0 7px;border-radius:4px;
  min-height:var(--task-h);height:var(--task-h);
  overflow:hidden;
  background:var(--g-done-bg1);
  border:1.5px solid var(--g-done-border);
  box-shadow:0 4px 12px rgba(99,102,241,.12),inset 0 1px 2px rgba(255,255,255,.8);
  color:var(--g-done-text);cursor:pointer;
  transition:transform .12s ease,background .5s ease;
}
.titem.doneSub:nth-child(even) > .line{background:var(--g-done-bg2)}
.titem.doneSub > .line .name{font-size:calc(var(--font-size) * 0.85);line-height:1.1}
.titem.doneSub > .line .handle{font-size:calc(var(--task-h) * 0.4);width:calc(var(--task-h) * 0.4)}

.titem.checklist > .line{
  display:flex;align-items:center;gap:6px;
  padding:0 8px;
  border-radius:4px;
  min-height:var(--cl-h);height:var(--cl-h);
  overflow:hidden;
  backdrop-filter:blur(18px) saturate(200%);
  -webkit-backdrop-filter:blur(18px) saturate(200%);
  box-shadow:var(--g-shadow);
  border:1.5px solid var(--g-border1);
  background:var(--g-bg1);
  color:var(--g-text);
  transition:background .3s ease,color .3s ease,box-shadow .3s ease,border-color .3s ease;
  will-change:transform;
}
.titem.checklist:nth-child(even) > .line{border-color:var(--g-border2);background:var(--g-bg2)}

.titem.checklist.completed > .line{
  background:linear-gradient(90deg,rgba(203,213,225,.7),rgba(226,232,240,.55)) !important;
  border-color:rgba(148,163,184,.6) !important;
  color:#475569 !important;
}
.titem.checklist.completed .name{opacity:.75;transition:opacity .3s ease;color:#475569}
.titem.checklist .name{position:relative;display:inline-block}
.titem.checklist .name::after{
  content:"";position:absolute;left:0;top:50%;height:1px;width:0%;
  background:linear-gradient(90deg,transparent,currentColor 20%,currentColor 80%,transparent);
  transform:translateY(-50%);transition:width .25s ease;pointer-events:none;
}
.titem.checklist.completed .name::after{width:100%}

.titem.checklist.selected > .line{
  border-color:#f59e0b !important;
  box-shadow:0 0 0 2px rgba(245,158,11,.35),0 4px 14px rgba(217,119,6,.2),inset 0 1px 2px rgba(255,255,255,.85);
  background:linear-gradient(90deg,rgba(254,243,199,.6),rgba(255,255,255,.6)) !important;
}

.titem.pending-pulse > .line{
  border-color:#f59e0b !important;
  animation:pendingPulse .5s ease-in-out infinite;
}
@keyframes pendingPulse{
  0%,100%{box-shadow:0 0 0 2px rgba(245,158,11,.35),0 4px 14px rgba(217,119,6,.2),inset 0 1px 2px rgba(255,255,255,.85)}
  50%{box-shadow:0 0 0 5px rgba(245,158,11,.15),0 4px 14px rgba(217,119,6,.25),inset 0 1px 2px rgba(255,255,255,.85)}
}

.handle{color:var(--g-muted);font-size:13px;flex:none;padding:0;margin:0;width:13px;text-align:center;display:inline-flex;align-items:center;justify-content:center;line-height:1;cursor:grab;touch-action:none}
.handle:active{cursor:grabbing}

.iconBox{flex:none;width:26px;height:26px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;box-shadow:inset 0 1px 2px rgba(255,255,255,.6)}
.ic-purple{background:linear-gradient(135deg,#c4b5fd,#a5b4fc)}
.ic-green{background:linear-gradient(135deg,#86efac,#4ade80)}
.ic-yellow{background:linear-gradient(135deg,#fcd34d,#fbbf24)}
.ic-blue{background:linear-gradient(135deg,#7dd3fc,#38bdf8)}
.ic-pink{background:linear-gradient(135deg,#f9a8d4,#f472b6)}
.ic-slate{background:linear-gradient(135deg,#cbd5e1,#94a3b8)}
.ic-red{background:linear-gradient(135deg,#fca5a5,#f87171)}

.check{width:15px;height:15px;accent-color:#0d9488;flex:none;margin:0}
.check.hidden-check{display:none}

.titem.checklist > .line .check{width:calc(var(--cl-h) * 0.5);height:calc(var(--cl-h) * 0.5);min-width:8px;min-height:8px}
.titem.checklist > .line .nameBlock{padding:0}
.titem.checklist > .line .name{font-size:calc(var(--font-size) * 0.92);line-height:1.1}
.titem.checklist > .line .lastDate{font-size:calc(7.5px + (var(--cl-h) - 28px) * 0.05);line-height:1}
.titem.checklist > .line .handle{font-size:calc(var(--cl-h) * 0.42);width:calc(var(--cl-h) * 0.42)}
.titem.checklist > .line .pencilBtn,.titem.checklist > .line .delDoneBtn{font-size:calc(11px + (var(--cl-h) - 28px) * 0.05);height:calc(var(--cl-h) * 0.55);line-height:1;padding:0 4px}
.titem.checklist > .line .unblod{font-size:calc(9px + (var(--cl-h) - 28px) * 0.04)}

.countSlot{
  flex:none;
  width:22px;
  text-align:center;
  display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;
}
.countSlot.empty{visibility:hidden}
.titem.task .countSlot{display:none}

.nameBlock{
  flex:1 1 auto;min-width:0;
  display:inline-flex;align-items:center;gap:4px;
  overflow:hidden;
  white-space:nowrap;
  padding:0;
}
.name{display:inline-block;font-weight:700;font-size:var(--font-size);color:inherit;line-height:1.2;position:relative;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem.task .name{color:var(--g-task-text)}
.titem.checklist .name{color:var(--g-text)}
.titem.doneSub .name{color:var(--g-done-text)}

.lastDate{
  font-size:8px;font-weight:600;flex:none;opacity:.9;line-height:1.1;
  display:inline-flex;flex-direction:column;align-items:flex-end;
  white-space:nowrap;color:var(--g-muted);
}
.lastDate .dateCreated{color:#0d9488}
.lastDate .dateUpdated{color:#0369a1}
.spacer{flex:1 1 auto;min-width:0}

.pct{font-weight:800;font-size:9.5px;flex:none;line-height:15px;background:var(--g-pill-bg);color:var(--g-pill-fg);border:1px solid var(--g-pill-border);padding:0 7px;border-radius:99px}

.endGroup{display:flex;align-items:center;gap:4px;flex:none}

.editBtn{background:transparent;color:inherit;opacity:.85;border:0;padding:2px 5px;font-size:12px;border-radius:4px;flex:none;cursor:pointer;margin-left:2px}
.pencilBtn{background:transparent;color:inherit;opacity:.9;border:0;padding:2px 6px;font-size:12px;border-radius:4px;flex:none;cursor:pointer;margin-left:2px}
.delDoneBtn{background:var(--g-del-bg);color:var(--g-del-fg);border:1px solid var(--g-del-border);border-radius:4px;padding:0 5px;font-size:11px;flex:none;cursor:pointer;margin-left:2px;height:18px;line-height:16px}
.unblod{color:var(--g-muted);opacity:.95;font-size:10px;font-weight:700;flex:none;margin-left:0;cursor:pointer}

.progIn{
  position:absolute;left:0;right:0;bottom:0;height:4px;
  background:rgba(255,255,255,.2);overflow:hidden;
  border-bottom-left-radius:4px;border-bottom-right-radius:4px;
  pointer-events:none;
}
.progIn i{
  display:block;height:100%;width:0;background:var(--prog-fill);
  position:relative;transition:width .8s cubic-bezier(.22,1,.36,1);
  will-change:width;overflow:hidden;
}
.progIn i::after{
  content:"";position:absolute;top:0;left:-50%;width:50%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);
  animation:shimmer 1.8s linear infinite;
}
@keyframes shimmer{from{left:-50%}to{left:100%}}

.childrenWrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .4s cubic-bezier(.22,1,.36,1),opacity .35s ease}
.childrenWrap.collapsed{grid-template-rows:0fr;opacity:0}
.childrenInner{overflow:hidden;min-height:0;padding:0}

.childrenInner > .titem{margin-top:var(--item-gap)}
.childrenInner > .titem:first-child{margin-top:var(--item-gap)}
.doneSubBlock{margin-top:0;padding-top:0}
.doneSubBlock > .titem.doneSub{margin-top:var(--item-gap)}
.doneSubBlock .childrenInner > .titem{margin-top:var(--item-gap)}

.placeholder{border:1px dashed rgba(99,102,241,.35);background:rgba(255,255,255,.3);border-radius:10px;overflow:hidden}
.placeholder2{border:2px dashed #8b5cf6;border-radius:10px;margin:4px 0;background:rgba(196,181,253,.25)}
.floating{position:fixed;pointer-events:none;box-shadow:0 12px 28px #0005;z-index:9999;transform:scale(1.03);border:1px solid #c5cdf0;opacity:.95;border-radius:4px}

.inlineInput{display:flex;gap:6px;padding:4px 8px 6px 8px;transition:max-height .35s cubic-bezier(.22,1,.36,1),opacity .25s ease,padding .35s cubic-bezier(.22,1,.36,1);max-height:60px;opacity:1;overflow:hidden}
.inlineInput input{flex:1;border:1px solid var(--g-pill-border);border-radius:4px;padding:6px 9px;font-size:12px;min-width:0;background:#fff;color:#000}
.inlineEditRow{display:flex;gap:6px;align-items:center}
.inlineEditRow input{flex:1;border:1px solid var(--g-pill-border);border-radius:4px;padding:6px 9px;font-size:12px;min-width:0;background:#fff;color:#000}
.inlineEditRow.inline{flex:1 1 auto;min-width:0;display:flex;margin:0}
.inlineEditRow.inline input{font-size:var(--font-size);font-weight:700;padding:2px 6px;border-radius:4px;height:calc(var(--font-size) + 6px)}

.muted{color:var(--g-muted);font-size:12px}
.empty{text-align:center;color:var(--g-muted);padding:20px}
.pageFoot{text-align:center;font-size:11px;color:var(--g-muted);padding:14px 0 6px}

.modal{position:fixed;inset:0;background:rgba(30,27,75,.45);display:flex;align-items:flex-end;justify-content:center;padding:0;z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s ease}
.modal.open{opacity:1;pointer-events:auto}
.modal-card{width:92%;max-width:480px;max-height:80vh;overflow:auto;background:#fff;border:1px solid rgba(79,70,229,.5);border-radius:4px;box-shadow:0 -20px 60px rgba(165,180,252,.4);transform:translateY(100%);transition:transform .4s cubic-bezier(.22,1,.36,1)}
.modal.open .modal-card{transform:translateY(0)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;font-weight:800;font-size:13px;color:var(--g-text);backdrop-filter:blur(18px) saturate(200%);background:var(--g-bg1);border-bottom:1.5px solid var(--g-border1)}
.modal-head button{flex:none;width:24px;height:24px;background:#fff;color:var(--g-text);border:1px solid var(--g-pill-border);border-radius:4px;font-weight:800;padding:0;display:inline-flex;align-items:center;justify-content:center}
.modal-body{padding:10px;display:flex;flex-direction:column;gap:4px}
.modal-actions{display:flex;gap:6px;padding:0 12px 12px}
.modal-actions button{flex:1;padding:9px 10px;border:0;border-radius:4px;font-weight:700;font-size:12px;cursor:pointer}
.modal-actions .s{background:#e9edff;color:#000}
.modal-actions .p{background:#8b5cf6;color:#fff}

.optList{display:flex;flex-direction:column;gap:4px}
.optList .gRow{width:100%;cursor:pointer;color:var(--g-text);font-weight:700;padding:10px;text-align:left}
.optList .gRow .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}
.optRow{display:flex;gap:4px}
.optRow .gRow{flex:1;justify-content:center}
.optRow .gRow .txt{flex:none}

.sortInline{
  display:grid;grid-template-columns: 90px 1fr 1fr;gap:6px;align-items:stretch;height:38px;
}
.sortLabel{
  display:flex;align-items:center;justify-content:center;height:100%;
  border-radius:4px;border:1.5px solid var(--g-border1);background:var(--g-bg1);
  backdrop-filter:blur(18px) saturate(200%);box-shadow:var(--g-shadow);
  color:var(--g-text);font-size:13px;font-weight:800;
  white-space:nowrap;cursor:default;user-select:none;pointer-events:none;
}
.sortInline .gRow{height:100%;border-radius:4px;padding:0 8px;color:#000}
.sortInline .gRow .txt{font-size:13px;font-weight:800;text-align:center;color:#000}
.sortInline .gRow.active{outline:2px solid #8b5cf6;outline-offset:-2px;color:#000}

.moveTree{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow:auto}
.moveItem{display:flex;gap:6px;align-items:center;padding:8px 10px;font-size:13px;cursor:pointer;border-radius:4px;background:#fff;border:1px solid var(--g-pill-border);color:var(--g-text)}
.moveItem:hover{background:#f7f9ff;border-color:#8b5cf6}

.cdTable{width:100%;border-collapse:collapse;font-size:12px}

.cdTable td.sr{text-align:center;width:36px;color:#4338ca;font-weight:700}

.cdTable td.type.unchecked{color:#c07a1a;font-weight:700}
.cdTable td.del{width:36px;text-align:center}
.delEntryBtn{background:transparent;border:0;color:#a82020;font-size:14px;cursor:pointer;padding:2px 6px;border-radius:4px}

.settingsModal{
  background:#fff;border:1px solid rgba(79,70,229,.5);
  border-radius:4px;box-shadow:0 -20px 60px rgba(165,180,252,.4);
  width:92%;max-width:480px;
  max-height:80vh;
  display:flex;flex-direction:column;overflow:hidden;
}
.settingsModal .head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;font-weight:800;font-size:13px;color:var(--g-text);backdrop-filter:blur(18px) saturate(200%);background:var(--g-bg1);border-bottom:1.5px solid var(--g-border1)}
.settingsModal .head button{flex:none;width:24px;height:24px;background:#fff;color:var(--g-text);border:1px solid var(--g-pill-border);border-radius:4px;font-weight:800;padding:0;display:inline-flex;align-items:center;justify-content:center}
.settingsModal .body{padding:10px;overflow-y:auto;overflow-x:hidden;flex:1 1 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:4px}
.setItem{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:7px 10px;border-radius:4px;color:var(--g-text);
  backdrop-filter:blur(18px) saturate(200%);box-shadow:var(--g-shadow);border:1.5px solid var(--g-border1);background:var(--g-bg1);min-width:0}
.setItem:nth-child(even){border-color:var(--g-border2);background:var(--g-bg2)}
.setItem span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-weight:600}
.exportRow{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.miniBtn{background:#fff;color:#000;border:1px solid var(--g-pill-border);border-radius:4px;padding:5px 10px;font-weight:700;font-size:12px;white-space:nowrap}
.stepper{display:inline-flex;align-items:center;gap:4px;flex:none}
.stepper button{background:#fff;color:#000;border:1px solid var(--g-pill-border);border-radius:4px;width:24px;height:24px;font-weight:800;font-size:14px;padding:0;touch-action:manipulation}
.stepper span{min-width:36px;text-align:center;font-weight:700;font-size:13px}
.numInput{width:60px;border:1px solid var(--g-pill-border);border-radius:4px;padding:5px 8px;font-size:13px;background:#fff;color:#000;text-align:center}
.switch{position:relative;width:28px;height:16px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#cfd5e6;border-radius:20px;transition:.2s;cursor:pointer}
.slider:before{content:"";position:absolute;height:10px;width:10px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked + .slider{background:linear-gradient(135deg,#8b5cf6,#ec4899)}
.switch input:checked + .slider:before{transform:translateX(12px)}

.threeControls{display:flex;align-items:stretch;gap:10px}
.threeControls .opt{
  flex:1 1 0;min-width:0;
  display:grid;grid-template-rows:1fr auto;
  justify-items:center;align-items:center;
  background:var(--g-bg1);border:1.5px solid var(--g-border1);
  border-radius:4px;padding:6px 8px;min-height:44px;
  backdrop-filter:blur(18px) saturate(200%);
  box-shadow:var(--g-shadow);color:var(--g-text);gap:2px;text-align:center;
}
.threeControls .opt:nth-child(even){border-color:var(--g-border2);background:var(--g-bg2)}
.threeControls .opt .head{display:block;width:100%;margin:0 auto;padding:0;font-size:12px;font-weight:800;color:var(--g-muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.threeControls .opt .rowBelow{display:flex;align-items:center;justify-content:center;margin:0;padding:0;width:100%}
.threeControls .opt .stepper{display:inline-flex;align-items:center;gap:6px}
.threeControls .opt .stepper button{
  width:22px;height:22px;border-radius:4px;
  border:1px solid var(--g-pill-border);background:var(--g-pill-bg);color:var(--g-pill-fg);
  font-weight:800;font-size:13px;cursor:pointer;padding:0;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;
}
.threeControls .opt .stepper span{
  min-width:30px;text-align:center;font-weight:700;font-size:13px;
  background:var(--g-pill-bg);color:var(--g-pill-fg);
  border:1px solid var(--g-pill-border);border-radius:4px;
  height:22px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;
}

.cellRow{display:flex;align-items:stretch;gap:4px}
.cellRow .cell{
  flex:1 1 0;min-width:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;
  gap:1px;
  background:var(--g-bg1);border:1.5px solid var(--g-border1);border-radius:4px;
  padding:2px 3px 4px 3px;
  min-height:38px;height:38px;
  backdrop-filter:blur(18px) saturate(200%);
  box-shadow:var(--g-shadow);
  box-sizing:border-box;
}
.cellRow .cell:nth-child(even){border-color:var(--g-border2);background:var(--g-bg2)}
.cellRow .cell .head{font-size:10px;font-weight:800;color:var(--g-muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1;width:100%;margin:0;padding:0}

.line6Switches{
  display:grid;
  grid-template-columns:repeat(6, minmax(0,1fr));
  gap:3px;
}
.cardSwitch{
  display:flex;align-items:center;justify-content:center;
  padding:5px 2px;border-radius:4px;
  font-size:10px;font-weight:700;line-height:1.1;
  color:#0f172a;cursor:pointer;user-select:none;text-align:center;
  backdrop-filter:blur(18px) saturate(200%);
  box-shadow:var(--g-shadow);border:1.5px solid var(--g-border1);background:var(--g-bg1);
  transition:background .25s ease,color .25s ease,border-color .25s ease,box-shadow .25s ease;
  min-height:26px;box-sizing:border-box;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cardSwitch:nth-child(even){border-color:var(--g-border2);background:var(--g-bg2)}
.cardSwitch.on{
  background:linear-gradient(135deg,#8b5cf6,#ec4899);
  color:#fff;border-color:transparent;
  box-shadow:0 6px 18px rgba(139,92,246,.4);
}

.themeSection{
  border:1.5px solid var(--g-border1);
  border-radius:4px;
  background:var(--g-bg1);
  backdrop-filter:blur(18px) saturate(200%);
  box-shadow:var(--g-shadow);
  overflow:hidden;
  margin:2px 0;
  flex:none;
}
.themeHead{
  display:flex;align-items:center;gap:6px;
  padding:9px 12px;cursor:pointer;user-select:none;
  font-size:13px;font-weight:800;color:#0f172a;
  transition:background .2s ease;
}
.themeHead:hover{background:rgba(139,92,246,.08)}
.themeHead .arrow{
  flex:none;font-size:12px;color:#4338ca;
  transition:transform .3s cubic-bezier(.22,1,.36,1);
  display:inline-block;
}
.themeSection.open .themeHead .arrow{transform:rotate(90deg)}
.themeHead .title{flex:1 1 auto;min-width:0}
.themeHead .badge{
  flex:none;font-size:10px;font-weight:800;
  background:rgba(139,92,246,.2);color:#6d28d9;
  padding:1px 7px;border-radius:999px;
  height:16px;line-height:14px;
  display:inline-flex;align-items:center;
}
.themeBody{
  display:grid;grid-template-rows:0fr;
  transition:grid-template-rows .35s cubic-bezier(.22,1,.36,1);
}
.themeSection.open .themeBody{grid-template-rows:1fr}
.themeBody > .inner{
  overflow:hidden;min-height:0;
  padding:0 10px;
  transition:padding .3s ease;
}
.themeSection.open .themeBody > .inner{padding:0 10px 10px 10px}

.themeSection .shipRow{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:thin}
.themeSection .ship{flex:none;width:110px;border:2px solid transparent;border-radius:4px;background:#fff;padding:6px 6px 8px;cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.1);text-align:center}
.themeSection .ship.active{border-color:#8b5cf6;box-shadow:0 4px 14px rgba(139,92,246,.35)}
.themeSection .preview{height:56px;border-radius:4px;position:relative;overflow:hidden;margin-bottom:6px}
.themeSection .preview .mini{position:absolute;inset:8px;display:flex;flex-direction:column;gap:3px;justify-content:center}
.themeSection .preview .mtask{height:8px;border-radius:4px}
.themeSection .preview .mcl{height:6px;border-radius:4px;width:80%}
.themeSection .shipLabel{font-size:10px;font-weight:700;color:#000;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.themeSection .ship.active .shipLabel{color:#8b5cf6}

/* === CHANGE 3+4: Inline edit — smooth, all (incl count) hide === */
.titem.checklist > .line > .handle,
.titem.checklist > .line > .check,
.titem.checklist > .line .lastDate,
.titem.checklist > .line .countSlot,
.titem.checklist > .line .pencilBtn,
.titem.checklist > .line .delDoneBtn{
  transition:opacity .25s cubic-bezier(.22,1,.36,1),max-width .35s cubic-bezier(.22,1,.36,1),min-width .35s cubic-bezier(.22,1,.36,1),width .35s cubic-bezier(.22,1,.36,1),margin .35s cubic-bezier(.22,1,.36,1),padding .35s cubic-bezier(.22,1,.36,1);
}
.titem.checklist.editingInline > .line{padding:0 8px}
.titem.checklist.editingInline > .line > .handle,
.titem.checklist.editingInline > .line > .check,
.titem.checklist.editingInline > .line .lastDate,
.titem.checklist.editingInline > .line .countSlot,
.titem.checklist.editingInline > .line .pencilBtn,
.titem.checklist.editingInline > .line .delDoneBtn{
  opacity:0;max-width:0;min-width:0;width:0;overflow:hidden;margin:0;padding:0;pointer-events:none;
}
.titem.checklist .nameBlock{transition:flex-basis .35s cubic-bezier(.22,1,.36,1)}
.titem.checklist.editingInline .nameBlock{flex:1 1 100%}
.titem.checklist .name{transition:opacity .25s cubic-bezier(.22,1,.36,1),max-width .35s cubic-bezier(.22,1,.36,1)}
.titem.checklist.editingInline .name{opacity:0;max-width:0;overflow:hidden}
.titem.checklist.editingInline input[data-cledit]{
  animation:inlineIn .35s cubic-bezier(.22,1,.36,1);
}
@keyframes inlineIn{
  from{opacity:0;transform:scaleX(.6);transform-origin:left}
  to{opacity:1;transform:scaleX(1);transform-origin:left}
}

.toast{position:fixed;left:50%;bottom:24px;top:auto;transform:translateX(-50%) translateY(30px);z-index:1500;opacity:0;pointer-events:none;transition:.25s;width:260px;max-width:88vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toastButton{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  width:100%;padding:8px 16px 12px 16px;
  background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;border:0;border-radius:14px;
  box-shadow:0 10px 26px rgba(30,27,75,.45);
  transition:filter .15s ease,transform .12s ease;
  position:relative;overflow:hidden;cursor:pointer;box-sizing:border-box;text-align:center;
}
.toastButton .label{color:#fff;font-size:9.5px;font-weight:500;letter-spacing:.4px;background:transparent;border:0;padding:0;line-height:1}
.toastButton .main{font-weight:900;font-size:15px;letter-spacing:.6px;line-height:1.1;color:#fff}
.toastButton .progress{position:absolute;left:0;bottom:0;right:0;height:3px;background:rgba(255,255,255,.2)}
.toastButton .progress i{display:block;height:100%;background:rgba(255,255,255,.85);width:100%}
.toastButton .progress.anim i{animation:shrink var(--dur,5s) linear forwards}
@keyframes shrink{from{width:100%}to{width:0%}}

.histCard{width:96%;max-width:480px;background:#fff;border:1px solid rgba(79,70,229,.5);border-radius:4px;box-shadow:0 -8px 28px rgba(165,180,252,.4);overflow:hidden;display:flex;flex-direction:column;height:90vh;max-height:90vh;position:relative}

.histTitle{font-weight:800;font-size:13px;white-space:nowrap;flex:none}
.headSearch{flex:1;min-width:0;border:1px solid var(--g-pill-border);border-radius:4px;padding:5px 10px;font-size:12px;background:#fff;color:#000;box-sizing:border-box;height:26px}
.histHead button{flex:none;width:24px;height:24px;background:#fff;color:var(--g-text);border:1px solid var(--g-pill-border);border-radius:4px;font-weight:800;padding:0;display:inline-flex;align-items:center;justify-content:center}

.monthFloat{
  position:absolute;left:0;right:0;top:calc(40px + 30px);
  background:#fff;border-bottom:1px solid rgba(99,102,241,.2);
  padding:4px 8px;height:30px;box-sizing:border-box;
  display:flex;align-items:center;z-index:10;

  overflow:hidden;opacity:0;transform:translateY(-6px);
  pointer-events:none;transition:opacity .3s ease,transform .3s ease;
}
.monthFloat.open{opacity:1;transform:translateY(0);pointer-events:auto}
.monthFloat.closing{opacity:0;transform:translateY(-6px);pointer-events:none}

function relTime(iso){
  let t=new Date(iso).getTime();if(isNaN(t))return '';
  let diff=Math.max(0,Date.now()-t);
  let s=Math.floor(diff/1000);
  if(s<60)return s+'s';
  let m=Math.floor(s/60),sec=s%60;
  if(m<60){let parts=[];if(m)parts.push(m+'m');if(sec)parts.push(sec+'s');return parts.slice(0,2).join(' ')}
  let h=Math.floor(m/60),mm=m%60;
  if(h<24){let parts=[];if(h)parts.push(h+'h');if(mm)parts.push(mm+'m');return parts.join(' ')}
  let d=Math.floor(h/24),hh=h%24;
  if(d<30){let parts=[];if(d)parts.push(d+'d');if(hh)parts.push(hh+'h');return parts.join(' ')}
  let mo=Math.floor(d/30),dd=d%30;
  if(mo<12){let parts=[];if(mo)parts.push(mo+'mo');if(dd)parts.push(dd+'d');return parts.join(' ')}
  let y=Math.floor(mo/12),mo2=mo%12;
  let parts=[];if(y)parts.push(y+'y');if(mo2)parts.push(mo2+'mo');if(dd)parts.push(dd+'d');
  return parts.slice(0,3).join(' ');
}

function darken(hex,amt){
  try{
    let h=hex.replace('#','');
    if(h.length===3)h=h.split('').map(c=>c+c).join('');
    let r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
    r=Math.max(0,Math.floor(r*amt));g=Math.max(0,Math.floor(g*amt));b=Math.max(0,Math.floor(b*amt));
    return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){return hex}
}

    return `<span class="countSlot"><span class="unblod" data-act="showHistory" data-id="${x.id}" title="Check count">(${cnt})</span></span>`;
  }
  return `<span class="countSlot empty"></span>`;
}

function renderItem(x){
  let has=x.children&&x.children.length>0;
  let canHaveChildren=x.type==='task';
  let chkHide=data.settings.showCheckboxes===false;
  let chk=x.type==='checklist'?`<input class="check ${chkHide?'hidden-check':''}" type="checkbox" data-act="complete" data-id="${x.id}" ${x.completed?'checked':''}>`:'';
  let plusTask=canHaveChildren&&data.settings.display.addbtn?`<button class="plus" data-act="plustask" data-id="${x.id}" title="Add Task">＋</button>`:'';
  let plusCl=canHaveChildren&&data.settings.display.addbtn?`<button class="plus cl" data-act="pluscl" data-id="${x.id}" title="Add Checklist">＋</button>`:'';
  let countHtml=countSlotHtml(x);
  let pctHtml=(x.type==='task')?`<span class="pct">(${pct(x)}%)</span>`:'';
  let dateHtml=x.type==='checklist'?twoDatesHtml(x):(x.updatedAt?`<span class="lastDate"><span class="dateCreated">${shortDate(x.updatedAt)}</span></span>`:'');
  if(x.type==='task'&&data.settings.showDates===false)dateHtml='';
  let pinMark=x.pinned?'📌':'';
  let kids=applyFilterToChildren(x.children||[]);

  let childrenHtml='';
  let doneSubHtml='';
  if(x.type!=='checklist'&&has){
    if(activeFilter==='done'){
      childrenHtml=kids.map(c=>renderItem(c)).join('');
    } else {
      let pendingNormal=kids.filter(c=>!(c.type==='checklist'&&c.completed));
      let doneCl=kids.filter(c=>c.type==='checklist'&&c.completed);
      childrenHtml=sortItems(pendingNormal).map(c=>renderItem(c)).join('');
      if(doneCl.length){doneSubHtml=renderDoneSub(x,doneCl)}
    }
  }
  let progHtml='';
  if(x.type==='task'&&data.settings.display.progressbar){let p=pct(x);progHtml=`<div class="progIn"><i data-prog-id="${x.id}" style="width:${p}%"></i></div>`}
  let childrenBlock='';
  if(x.type!=='checklist'&&(childrenHtml||doneSubHtml)){
    childrenBlock=`<div class="childrenWrap ${x.collapsed?'collapsed':''}" data-children-id="${x.id}"><div class="childrenInner">${childrenHtml}${doneSubHtml}</div></div>`;
  }
  let completedCls=x.type==='checklist'&&x.completed?'completed':'';
  let selCls=(tickPending.has(x.id)||uncheckPending.has(x.id))?'selected':'';
  let rightIcons='';
  if(x.type==='checklist'&&!data.settings.editMode){
    if(x.completed){rightIcons+=`<button class="delDoneBtn" data-act="del" data-id="${x.id}" title="Delete">🗑</button>`}
    else if(data.settings.showPencil!==false){rightIcons+=`<button class="pencilBtn" data-act="editcl" data-id="${x.id}" title="Edit">✎</button>`}
  }
  let nameHtml;
  let editingCls='';
  if(x.type==='checklist'&&editingClId===x.id){
    editingCls=' editingInline';
    nameHtml=`<input id="clinp_${x.id}" data-cledit="${x.id}" value="${esc(x.name)}" style="flex:1 1 100%;width:100%;border:1px solid var(--g-pill-border);border-radius:4px;padding:2px 8px;font-size:var(--font-size);font-weight:700;height:calc(var(--font-size) + 8px);box-sizing:border-box;background:#fff;color:#000;outline:none;min-width:0">`;
  } else {
    nameHtml=`<span class="name ${x.completed?'done':''}">${pinMark}${esc(x.name)}</span>`;
  }
  return `<div class="titem ${x.type} ${x.completed?'done':''} ${completedCls} ${selCls}${editingCls}" data-id="${x.id}">
    <div class="line">
      <span class="handle" data-handle="1">⠿</span>
      ${chk}
      <div class="nameBlock">${nameHtml}<span class="spacer"></span>${dateHtml}</div>
      ${countHtml}
      <div class="endGroup">${pctHtml}${plusTask}${plusCl}</div>
      ${rightIcons}
      ${editBtns(x)}
      ${progHtml}
    </div>
    ${activeInput===x.id?`<div class="inlineInput"><input id="inp_${x.id}" data-parent="${x.id}" placeholder="Type and press Enter…"></div>`:''}
    ${childrenBlock}
  </div>`;
}

function renderDoneSub(parentTask,doneItems){
  let collapsed=parentTask.doneCollapsed!==false;
  return `<div class="doneSubBlock"><div class="titem doneSub" data-donesub="${parentTask.id}">
    <div class="line">
      <span class="handle">⠿</span>
      <div class="nameBlock"><span class="name">Done (${doneItems.length})</span></div>
    </div>
    <div class="childrenWrap ${collapsed?'collapsed':''}" data-done-children="${parentTask.id}">
      <div class="childrenInner">${doneItems.map(c=>renderItem(c)).join('')}</div>
    </div>
  </div></div>`;
}

function renderDoneFilter(){
  let activeList=[],doneList=[];
  data.items.forEach(i=>{(i.completed?doneList:activeList).push(i)});
  let groupsHtml='';
  function collectFromTask(task){
    let doneItems=[];
    (task.children||[]).forEach(c=>{
      if(c.type==='checklist'&&c.completed)doneItems.push(c);
      if(c.type==='task')collectFromTask(c);
    });
    if(doneItems.length){
      groupsHtml+=`<div class="titem task" data-id="${task.id}"><div class="line">
        <span class="handle">⠿</span>
        <div class="nameBlock"><span class="name">${esc(task.name)}</span></div>
        <div class="endGroup"><span class="pct">(${pct(task)}%)</span></div>
      </div>
      <div class="childrenWrap"><div class="childrenInner">${doneItems.map(c=>renderItem(c)).join('')}</div></div>
      </div>`;
    }
  }
  data.items.forEach(i=>{if(i.type==='task')collectFromTask(i)});
  let topDone=doneList.filter(i=>i.type==='checklist').map(c=>renderItem(c)).join('');
  let html=groupsHtml+topDone;
  if(!html)html='<div class="empty">No done items.</div>';
  return html;
}

function renderSortFilter(){
  let mode=activeFilter;
  let rows=[];
  function collectFromTask(task){
    (task.children||[]).forEach(c=>{
      if(c.type==='checklist'){
        rows.push({task:task.name, cl:c.name, created:c.createdAt, updated:c.updatedAt, item:c});
      }
      if(c.type==='task')collectFromTask(c);
    });
  }
  data.items.forEach(i=>{
    if(i.type==='checklist')rows.push({task:'—', cl:i.name, created:i.createdAt, updated:i.updatedAt, item:i});
    if(i.type==='task')collectFromTask(i);
  });
  let key = (mode==='created-asc'||mode==='created-desc')?'created':'updated';
  let asc = (mode==='created-asc'||mode==='updated-asc');
  rows.sort((a,b)=>{
    let av=new Date(a[key]||0).getTime(), bv=new Date(b[key]||0).getTime();
    return asc ? av-bv : bv-av;
  });
  if(!rows.length)return '<div class="empty">No checklists.</div>';
  return rows.map(r=>{
    let created=r.created?shortDate(r.created):'';
    let updated=r.updated?shortDate(r.updated):'';
    return `<div class="sortViewRow">
      <span class="rowTask">${esc(r.task)}</span>
      <span class="rowSep">-</span>
      <div class="rowClWrap"><span class="rowCl">${esc(r.cl)}</span></div>
      <span class="rowDates">
        ${created?`<span class="dCreated">${created}</span>`:''}
        ${updated?`<span class="dUpdated">${updated}</span>`:''}
      </span>
    </div>`;
  }).join('');
}

function requestDoneToggle(id){
  let it=find(id);if(!it)return;
  if(!it.completed){
    if(tickPending.has(id))tickPending.delete(id);else tickPending.add(id);
  } else {
    if(uncheckPending.has(id))uncheckPending.delete(id);else uncheckPending.add(id);
  }
  touchIdle();
  render();
}

function touchIdle(){
  if(doneIdleTimer)clearTimeout(doneIdleTimer);
  if(tickPending.size===0&&uncheckPending.size===0)return;
  doneIdleTimer=setTimeout(()=>{doneIdleTimer=null;flushDoneBatch()},IDLE_MS);
}

/* === CHANGE 5: Fly + fade smooth transition === */
function flushDoneBatch(){
  if(!tickPending.size&&!uncheckPending.size)return;
  const toDone=[...tickPending];
  const toActive=[...uncheckPending];
  tickPending=new Set();
  uncheckPending=new Set();
  if(doneIdleTimer){clearTimeout(doneIdleTimer);doneIdleTimer=null}
  toDone.forEach(id=>{
    let it=find(id);if(!it)return;
    it.completed=true;it.completedAt=now();it.updatedAt=now();
    it.checkCount=(it.checkCount||0)+1;it.history=it.history||[];
    it.history.push({status:'Checked',at:now()});
  });
  toActive.forEach(id=>{
    let it=find(id);if(!it)return;
    it.completed=false;it.completedAt=null;it.updatedAt=now();
    it.checkCount=(it.checkCount||0)+1;it.history=it.history||[];
    it.history.push({status:'Unchecked',at:now()});
  });

  /* First rects — capture BEFORE render */
  const firstRects=new Map();
  document.querySelectorAll('.titem').forEach(el=>{
    firstRects.set(el.dataset.id, el.getBoundingClientRect());
  });

  render();

  /* After render: FLIP animation — move + fade */
  document.querySelectorAll('.titem').forEach(el=>{
    const id=el.dataset.id;
    const first=firstRects.get(id);
    if(!first) return; // newly appeared items get fade-in
    const last=el.getBoundingClientRect();
    const dx=first.left-last.left;
    const dy=first.top-last.top;
    if(Math.abs(dx)<0.5 && Math.abs(dy)<0.5) return;
    el.style.transition='none';
    el.style.transform=`translate(${dx}px,${dy}px)`;
    el.style.opacity='0.4';
    requestAnimationFrame(()=>{
      el.style.transition=`transform ${MOVE_DURATION}s ${EASE_CURVE}, opacity .55s ease`;
      el.style.transform='translate(0,0)';
      el.style.opacity='1';
    });
  });

  scheduleSave();
}

function attachDrag(handle,el){
  let active=false,floating=null,placeholder=null,offsetY=0;
  function onDown(e){
    e.preventDefault();e.stopPropagation();active=true;
    let rect=el.getBoundingClientRect();let cy=(e.touches?e.touches[0].clientY:e.clientY);offsetY=cy-rect.top;
    floating=el.cloneNode(true);floating.classList.add('floating');
    floating.style.width=rect.width+'px';floating.style.left=rect.left+'px';floating.style.top=rect.top+'px';
    document.body.appendChild(floating);
    placeholder=document.createElement('div');placeholder.className='placeholder2';placeholder.style.height=rect.height+'px';
    el.style.display='none';el.parentNode.insertBefore(placeholder,el.nextSibling);
    window.addEventListener('touchmove',onMove,{passive:false});window.addEventListener('touchend',onUp);
    window.addEventListener('mousemove',onMove);window.addEventListener('mouseup',onUp);
  }
  function onMove(e){
    if(!active)return;if(e.cancelable)e.preventDefault();
    let cy=(e.touches?e.touches[0].clientY:e.clientY);floating.style.top=(cy-offsetY)+'px';
    let parent=el.parentNode;let all=[...parent.querySelectorAll(':scope > .titem')].filter(x=>x!==el);let target=null;
    all.forEach(x=>{let r=x.getBoundingClientRect();if(cy>r.top&&cy<r.bottom)target=x});
    if(target){let r=target.getBoundingClientRect();let mid=(r.top+r.bottom)/2;if(cy<mid)parent.insertBefore(placeholder,target);else parent.insertBefore(placeholder,target.nextSibling)}
  }
  function onUp(){
    if(!active)return;active=false;
    let parent=el.parentNode;let siblings=[...parent.children];let pos=siblings.indexOf(placeholder);
    let before=siblings.slice(0,pos).filter(n=>n.dataset&&n.dataset.id).map(n=>n.dataset.id);
    let after=siblings.slice(pos).filter(n=>n.dataset&&n.dataset.id).map(n=>n.dataset.id);
    let id=el.dataset.id;before=before.filter(x=>x!==id);after=after.filter(x=>x!==id);
    let finalIds=[...before,id,...after];
    let parentId=parent.closest('.titem')?.dataset.id;
    let arr=parentId?find(parentId).children:data.items;
    arr.sort((a,b)=>finalIds.indexOf(a.id)-finalIds.indexOf(b.id));
    floating.remove();placeholder.remove();
    window.removeEventListener('touchmove',onMove);window.removeEventListener('touchend',onUp);
    window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);
    changed();
  }
  handle.addEventListener('touchstart',onDown,{passive:false});
  handle.addEventListener('mousedown',onDown);
}

let pinPendingTimers=new Map();
function requestPinToggle(id){
  let it=find(id);if(!it)return;
  if(pinPendingTimers.has(id)){
    clearTimeout(pinPendingTimers.get(id));
    pinPendingTimers.delete(id);
    let row=document.querySelector('.titem[data-id="'+id+'"]');
    if(row)row.classList.remove('pending-pulse');
    return;
  }
  let row=document.querySelector('.titem[data-id="'+id+'"]');
  if(row)row.classList.add('pending-pulse');
  let t=setTimeout(()=>{
    pinPendingTimers.delete(id);
    let it2=find(id);if(!it2)return;
    let r=locate(data.items,id);if(!r)return;
    if(!it2.pinned){
      it2.pinned=true;
      let minOrder=0;
      r.list.forEach(x=>{if(x.pinned&&x.pinnedOrder!=null)minOrder=Math.min(minOrder,x.pinnedOrder)});
      it2.pinnedOrder=minOrder-1;
      r.list.splice(r.index,1);
      r.list.unshift(it2);
    } else {
      it2.pinned=false;
      it2.pinnedOrder=null;
      r.list.splice(r.index,1);
      let inserted=false;
      for(let i=0;i<r.list.length;i++){
        if(!r.list[i].pinned){r.list.splice(i,0,it2);inserted=true;break}
      }
      if(!inserted)r.list.push(it2);
    }
    it2.updatedAt=now();
    changed();
  },500);
  pinPendingTimers.set(id,t);
}

function openMoveTree(idv){
  $('modalTitle').textContent='Move to…';
  let r=locate(data.items,idv);
  let isRootLevel=!r||!r.parent;
  let html='<div class="moveTree">';
  if(!isRootLevel){
    html+=`<div class="moveItem" data-move-root="1" style="background:rgba(196,181,253,.5);font-weight:800;color:#000;border-color:#8b5cf6">🏠 Root (move to top level)</div>`;
  }
  function renderNode(x,depth){
    if(x.type!=='task')return;if(x.id===idv)return;
    html+=`<div class="moveItem indent${Math.min(depth,3)}" data-move-target="${x.id}">${'　'.repeat(depth)}☑ ${esc(x.name)}</div>`;
    (x.children||[]).forEach(c=>renderNode(c,depth+1));
  }
  data.items.forEach(x=>renderNode(x,0));
  html+='</div>';
  $('modalBody').innerHTML=html;
  $('modalActions').style.display='none';$('modalActions').innerHTML='';
  openModal();
  $('modalBody').querySelectorAll('[data-move-target]').forEach(el=>{el.onclick=()=>{doMove(idv,el.dataset.moveTarget);closeModal()}});
  let rootEl=$('modalBody').querySelector('[data-move-root]');
  if(rootEl){rootEl.onclick=()=>{doMoveToRoot(idv);closeModal()}}
}
function doMove(idv,targetId){
  let r=locate(data.items,idv);if(!r)return;
  let target=find(targetId);if(!target||target.type!=='task')return;
  r.list.splice(r.index,1);target.children=target.children||[];target.children.push(r.item);target.collapsed=false;target.updatedAt=now();
  changed();
}
function doMoveToRoot(idv){
  let r=locate(data.items,idv);if(!r)return;
  if(!r.parent)return;
  r.list.splice(r.index,1);data.items.push(r.item);

}

function pushTrash(item,parentName){
  let copy=JSON.parse(JSON.stringify(item));
  copy.deletedAt=now();
  copy.deletedParentTask=parentName||null;
  data.trash=data.trash||[];
  data.trash.push(copy);
}

function deleteItem(idv){
  let snap=JSON.stringify(data);
  let r=locate(data.items,idv);if(!r)return;
  let item=r.item;
  if(item.type==='task'){
    let taskName=item.name;
    let taskCopy=JSON.parse(JSON.stringify(item));
    taskCopy.deletedAt=now();
    taskCopy.deletedParentTask=r.parent?r.parent.name:null;
    data.trash=data.trash||[];
    data.trash.push(taskCopy);
    r.list.splice(r.index,1);
  } else {
    let parentName=r.parent?r.parent.name:null;
    pushTrash(item,parentName);
    r.list.splice(r.index,1);
  }
  changed();showUndoToast(snap);
}

function bindStepperHold(btn,fn){
  let t1=null,t2=null;
  function start(e){
    if(e)e.preventDefault();
    fn();
    t1=setTimeout(()=>{
      t2=setInterval(fn,60);
    },400);
  }
  function stop(){
    if(t1){clearTimeout(t1);t1=null}
    if(t2){clearInterval(t2);t2=null}
  }
  btn.addEventListener('mousedown',start);
  btn.addEventListener('touchstart',start,{passive:false});
  btn.addEventListener('mouseup',stop);
  btn.addEventListener('mouseleave',stop);
  btn.addEventListener('touchend',stop);
  btn.addEventListener('touchcancel',stop);
}

  bindStepperHold(m.querySelector('#undoMinus'),()=>{data.settings.undoSeconds=Math.max(1,(data.settings.undoSeconds||5)-1);undoVal.textContent=data.settings.undoSeconds;scheduleSave()});
  bindStepperHold(m.querySelector('#undoPlus'),()=>{data.settings.undoSeconds=Math.min(10,(data.settings.undoSeconds||5)+1);undoVal.textContent=data.settings.undoSeconds;scheduleSave()});

  const adVal=m.querySelector('#adVal');
  bindStepperHold(m.querySelector('#adMinus'),()=>{autoDeleteDaysTemp=Math.max(0,autoDeleteDaysTemp-1);adVal.textContent=autoDeleteDaysTemp;data.settings.autoDeleteDays=autoDeleteDaysTemp;scheduleSave()});
  bindStepperHold(m.querySelector('#adPlus'),()=>{autoDeleteDaysTemp=Math.min(365,autoDeleteDaysTemp+1);adVal.textContent=autoDeleteDaysTemp;data.settings.autoDeleteDays=autoDeleteDaysTemp;scheduleSave()});

  m.querySelector('#viewLog').onclick=()=>{closeSettings();openLogModal()};
  m.querySelector('#exportJson').onclick=()=>download('backup.json',JSON.stringify(data,null,2),'application/json');
  m.querySelector('#exportExcel').onclick=()=>{let rows=[];walk(data.items,x=>rows.push({ID:x.id,Name:x.name,Type:x.type,Completed:x.completed}));let ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Items');XLSX.writeFile(wb,'Checklist.xlsx')};
  m.querySelector('#exportPdf').onclick=exportTablePdf;
}

function exportTablePdf(){
  let w=window.open('','_blank');
  let html='<html><head><title>Export</title><style>body{font-family:system-ui;padding:24px}h3{margin-top:18px}table{width:100%;border-collapse:collapse;margin-top:8px;table-layout:fixed}th,td{border:1px solid #999;padding:6px 8px;text-align:left;vertical-align:top;word-break:break-word}th{background:#dbe3ff;font-weight:700}th.doneH{background:#bbf7d0;color:#166534}th.pendH{background:#fef08a;color:#a16207}ul{margin:0;padding-left:16px}li{margin:0 0 2px 0}li.done{color:#166534;font-weight:600}li.pend{color:#a16207;font-weight:600}.emptyMsg{color:#94a3b8;font-style:italic}</style></head><body>';
  function collectLists(task){
    let done=[],pend=[];
    (task.children||[]).forEach(c=>{
      if(c.type==='checklist'){
        if(c.completed)done.push(c.name);else pend.push(c.name);
      }
      if(c.type==='task'){
        let r=collectLists(c);
        done=done.concat(r.done);
        pend=pend.concat(r.pend);
      }
    });
    return {done,pend};
  }
  function walkV(list){
    list.forEach(x=>{
      if(x.type==='task'){
        let r=collectLists(x);
        html+=`<h3>${esc(x.name)}</h3>`;
        html+=`<table><thead><tr><th class="doneH" style="width:50%">Done</th><th class="pendH" style="width:50%">Pend</th></tr></thead><tbody><tr>`;
        html+=`<td>${r.done.length?`<ul>${r.done.map(n=>`<li class="done">${esc(n)}</li>`).join('')}</ul>`:`<span class="emptyMsg">—</span>`}</td>`;
        html+=`<td>${r.pend.length?`<ul>${r.pend.map(n=>`<li class="pend">${esc(n)}</li>`).join('')}</ul>`:`<span class="emptyMsg">—</span>`}</td>`;
        html+=`</tr></tbody></table>`;
      }
      walkV(x.children||[]);
    });
  }
  walkV(data.items);
  html+='</body></html>';
  w.document.write(html);w.document.close();
  setTimeout(()=>{w.print()},300);
}

    all=all.slice(0,7);
    if(!all.length)return '<div class="empty">No checks yet.</div>';
    return all.map(r=>`<div style="display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:4px;background:#fff;border:1px solid var(--g-border1);margin-bottom:3px;font-size:12px">
      <span style="flex:1;min-width:0;font-weight:700;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.name)}</span>
      <span style="flex:none;font-size:10px;color:#334155;font-weight:600">${relTime(r.at)}</span>
    </div>`).join('');
  }}
];

    <div class="histBody" id="statsBody2"></div>`;

function renderStatsPage(){
  let state=data.settings.statsState||{order:[],collapsed:{}};
  let allIds=STATS_DEFS.map(x=>x.id);
  state.order=(state.order||[]).filter(id=>allIds.includes(id));
  allIds.forEach(id=>{if(!state.order.includes(id))state.order.push(id)});
  if(!state.collapsed)state.collapsed={};
  data.settings.statsState=state;

  let html = state.order.map(id=>{
    let s=STATS_DEFS.find(x=>x.id===id);
    if(!s)return '';
    let collapsed=!!state.collapsed[id];
    let displayNum = state.order.indexOf(id)+1;
    let titleText = s.title.replace(/^\d+\.\s*/, displayNum+'. ');
    return `<div class="statCard ${collapsed?'collapsed':''}" data-id="${id}" style="margin-bottom:10px;background:var(--g-bg1);border:1.5px solid var(--g-border1);border-radius:4px;box-shadow:var(--g-shadow);overflow:hidden">
      <div class="cardHead" data-toggle="${id}" style="display:flex;align-items:center;gap:6px;padding:10px 12px;cursor:pointer;user-select:none">
        <span class="handle" data-handle="1" style="flex:none;width:14px;text-align:center;color:#334155;font-size:14px;cursor:grab;touch-action:none">⠿</span>
        <span style="flex:1;min-width:0;font-weight:800;font-size:13px;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${titleText}</span>

function attachStatsDrag(handle,card){
  let active=false,floating=null,placeholder=null,offsetY=0;
  function onDown(e){
    e.preventDefault();e.stopPropagation();active=true;
    let rect=card.getBoundingClientRect();
    let cy=(e.touches?e.touches[0].clientY:e.clientY);
    offsetY=cy-rect.top;
    floating=card.cloneNode(true);
    floating.style.cssText=`position:fixed;z-index:9999;pointer-events:none;box-shadow:0 12px 28px rgba(0,0,0,.25);opacity:.95;border-radius:4px;width:${rect.width}px;left:${rect.left}px;top:${rect.top}px`;
    document.body.appendChild(floating);
    placeholder=document.createElement('div');
    placeholder.style.cssText=`border:2px dashed #8b5cf6;border-radius:4px;background:rgba(196,181,253,.25);margin-bottom:10px;height:${rect.height}px`;
    card.parentNode.insertBefore(placeholder,card.nextSibling);
    card.style.display='none';
    window.addEventListener('touchmove',onMove,{passive:false});
    window.addEventListener('touchend',onUp);
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
  }
  function onMove(e){
    if(!active)return;
    if(e.cancelable)e.preventDefault();
    let cy=(e.touches?e.touches[0].clientY:e.clientY);
    floating.style.top=(cy-offsetY)+'px';
    let parent=card.parentNode;
    let all=[...parent.querySelectorAll(':scope > .statCard')].filter(x=>x!==card);
    let target=null;
    all.forEach(x=>{let r=x.getBoundingClientRect();if(cy>r.top&&cy<r.bottom)target=x});
    if(target){
      let r=target.getBoundingClientRect();
      let mid=(r.top+r.bottom)/2;
      if(cy<mid)parent.insertBefore(placeholder,target);
      else parent.insertBefore(placeholder,target.nextSibling);
    }
  }
  function onUp(){
    if(!active)return;active=false;
    let parent=card.parentNode;
    let siblings=[...parent.children];
    let pos=siblings.indexOf(placeholder);
    let before=siblings.slice(0,pos).filter(n=>n.classList&&n.classList.contains('statCard')).map(n=>n.dataset.id);
    let after=siblings.slice(pos).filter(n=>n.classList&&n.classList.contains('statCard')).map(n=>n.dataset.id);
    let id=card.dataset.id;
    before=before.filter(x=>x!==id);
    after=after.filter(x=>x!==id);
    let state=data.settings.statsState||{order:[],collapsed:{}};
    state.order=[...before,id,...after];
    data.settings.statsState=state;
    scheduleSave();
    floating.remove();placeholder.remove();
    card.style.display='';
    window.removeEventListener('touchmove',onMove);
    window.removeEventListener('touchend',onUp);
    window.removeEventListener('mousemove',onMove);
    window.removeEventListener('mouseup',onUp);
    renderStatsPage();
  }
  handle.addEventListener('touchstart',onDown,{passive:false});
  handle.addEventListener('mousedown',onDown);
}

function renderLogBox(wrap){
  let logs=(data.changelog||[]).slice();
  if(!logs.length){wrap.innerHTML='<div class="logEmpty">No changes yet.</div>';return}
  let groups={};
  logs.forEach(c=>{
    let d=new Date(c.at);
    let key=d.toDateString();
    if(!groups[key])groups[key]=[];
    groups[key].push(c);
  });
  let order=Object.keys(groups).sort((a,b)=>new Date(b)-new Date(a));
  let html='<div class="logBox">';
  order.forEach((day,dayIdx)=>{
    let entries=groups[day].sort((a,b)=>new Date(a.at)-new Date(b.at));
    let isMulti=entries.length>1;
    let vTag=isMulti?`<span class="logVTag">(V1–V${entries.length})</span>`:'';
    html+=`<div class="logGroup ${dayIdx===0?'open':''}">
      <div class="logDayRow">
        <span class="arrow">▸</span>
        <span class="logDayText">${day} ${vTag}</span>
        <span class="logCount">${entries.length}</span>
      </div>
      <div class="logEntries">
        <div class="inner">`;
    entries.forEach((c,i)=>{
      let t=new Date(c.at);
      let time=t.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
      let num=isMulti?`<span class="logNum">V${i+1}.</span>`:'';
      html+=`<div class="logEntry">${num}<span>${esc(c.text)}</span><span class="logTime">${time}</span></div>`;
    });
    html+=`</div></div></div>`;
  });
  html+='</div>';
  wrap.innerHTML=html;
  wrap.querySelectorAll('.logDayRow').forEach(row=>{
    row.onclick=()=>{row.parentElement.classList.toggle('open')};
  });
}

function addLogEntry(text){

let histState={display:'all',year:null,month:null,q:'',dropOpen:false};
const HMONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* === CHANGE 1: History fix — standalone + task items (no duplicates) === */
function collectHistoryTasks(){
  let tasks=[];
  (data.trash||[]).forEach(x=>{
    if(x.type==='task'){
      let kids=[];
      (function walkKids(node){
        (node.children||[]).forEach(c=>{
          if(c.type==='checklist')kids.push({id:c.id,name:c.name,completed:c.completed,deletedAt:c.deletedAt||x.deletedAt||now(),_ref:c});
          if(c.type==='task')walkKids(c);
        });
      })(x);
      tasks.push({id:x.id,taskName:x.name,deletedAt:x.deletedAt||now(),items:kids,_ref:x});
    }
  });
  return tasks;
}
/* Standalone = trash item that is checklist AND has no deletedParentTask */
function collectStandaloneChecklists(){
  return (data.trash||[]).filter(x=>x.type==='checklist' && !x.deletedParentTask);
}

let histCollapsedTasks={};

function histMatchQ(s){let q=histState.q.trim().toLowerCase();return !q||String(s||'').toLowerCase().includes(q)}

function histYearMonthMatch(dateStr){
  let d=new Date(dateStr);
  if(isNaN(d))return true;
  if(histState.year!==null && d.getFullYear()!==histState.year)return false;
  if(histState.month!==null && d.getMonth()!==histState.month)return false;
  return true;
}

function buildHistList(){
  let tasks=collectHistoryTasks();
  let standalone=collectStandaloneChecklists();
  let display=histState.display;

  function itemMatches(c){
    if(!histMatchQ(c.name))return false;
    if(!histYearMonthMatch(c.deletedAt))return false;
    if(display==='all')return true;
    if(display==='done')return c.completed;
    if(display==='pend')return !c.completed;
    return true;
  }

  let visibleTasks=[];
  tasks.forEach(t=>{
    let matching=(t.items||[]).filter(itemMatches);
    if(!matching.length)return;
    visibleTasks.push({...t, items:matching});
  });

  let visibleStandalone=standalone.filter(c=>{
    if(!histMatchQ(c.name))return false;
    if(!histYearMonthMatch(c.deletedAt||now()))return false;
    if(display==='all')return true;
    if(display==='done')return c.completed;
    if(display==='pend')return !c.completed;
    return true;
  });

  let html='';

  visibleTasks.forEach(t=>{
    let collapsed=!!histCollapsedTasks[t.id];
    let kidsHtml = t.items.map(c=>`
      <div class="histRow" data-is-task="0">
        <span class="histIcon">☑</span>
        <span class="histName">${esc(c.name)}</span>
        <span class="histStatus ${c.completed?'done':'pend'}">${c.completed?'Done':'Pend'}</span>
        <span class="histDate">${shortDate(c.deletedAt)}</span>
        <button class="histRestoreBtn" data-restore-cl="${c.id}" title="Restore">↩</button>
        <button class="histDeleteBtn" data-del-cl="${c.id}" title="Delete">🗑</button>
      </div>`).join('');

    html += `<div class="histRow taskRow ${collapsed?'collapsed':''}" data-task-toggle="${t.id}">
      <span class="arrow">▾</span>
      <span class="histIcon">📁</span>
      <span class="histName">${esc(t.taskName)}</span>
      <span class="histCount">${t.items.length} items</span>
      <span class="histDate">${shortDate(t.deletedAt)}</span>
      <button class="histRestoreBtn" data-restore-task="${t.id}" title="Restore task">↩</button>
      <button class="histDeleteBtn" data-del-task="${t.id}" title="Delete task">🗑</button>
    </div>
    <div class="histChildren">
      <div class="histChildrenInner">${kidsHtml||'<div style="font-size:11px;color:#334155;padding:4px 0">No items</div>'}</div>
    </div>`;
  });

  visibleStandalone.forEach(c=>{
    html += `<div class="histRow" data-is-task="0">
      <span class="histIcon">☑</span>
      <span class="histName">${esc(c.name)}</span>
      <span class="histStatus ${c.completed?'done':'pend'}">${c.completed?'Done':'Pend'}</span>
      <span class="histDate">${shortDate(c.deletedAt||now())}</span>
      <button class="histRestoreBtn" data-restore-cl="${c.id}" title="Restore">↩</button>
      <button class="histDeleteBtn" data-del-cl="${c.id}" title="Delete">🗑</button>
    </div>`;
  });

  if(!html)html='<div class="histEmpty">No items.</div>';
  document.getElementById('histBody2').innerHTML=html;

  document.querySelectorAll('.histRow.taskRow').forEach(row=>{
    row.addEventListener('click',e=>{
      if(e.target.closest('[data-restore-task],[data-del-task]'))return;
      let id=row.dataset.taskToggle;
      histCollapsedTasks[id]=!histCollapsedTasks[id];
      row.classList.toggle('collapsed',!!histCollapsedTasks[id]);
    });
  });

  document.querySelectorAll('[data-restore-task]').forEach(btn=>{
    btn.onclick=(e)=>{e.stopPropagation();restoreTaskFromHistory(btn.dataset.restoreTask)};
  });
  document.querySelectorAll('[data-del-task]').forEach(btn=>{
    btn.onclick=(e)=>{e.stopPropagation();permaDeleteTask(btn.dataset.delTask)};
  });
  document.querySelectorAll('[data-restore-cl]').forEach(btn=>{
    btn.onclick=(e)=>{e.stopPropagation();restoreFromHistory(btn.dataset.restoreCl)};
  });
  document.querySelectorAll('[data-del-cl]').forEach(btn=>{
    btn.onclick=(e)=>{e.stopPropagation();permaDeleteChecklist(btn.dataset.delCl)};
  });
}

function restoreTaskFromHistory(id){
  let snap=JSON.stringify(data);
  let idx=(data.trash||[]).findIndex(x=>x.id===id&&x.type==='task');
  if(idx<0)return;
  let task=data.trash.splice(idx,1)[0];
  task.deletedAt=null;
  task.deletedParentTask=null;
  (function clearKids(node){
    (node.children||[]).forEach(c=>{c.deletedAt=null;c.deletedParentTask=null;clearKids(c)});
  })(task);
  data.items.unshift(task);
  scheduleSave();
  if($('historyWrap').classList.contains('open'))fullRenderHist();
  showToast('Task restored',data.settings.undoSeconds||5,()=>{
    data=JSON.parse(snap);changed();
    if($('historyWrap').classList.contains('open'))fullRenderHist();
  });
}

function permaDeleteTask(id){
  let snap=JSON.stringify(data);
  data.trash=(data.trash||[]).filter(x=>!(x.id===id&&x.type==='task'));
  scheduleSave();
  showToast('Task deleted permanently',data.settings.undoSeconds||5,()=>{
    data=JSON.parse(snap);scheduleSave();
    if($('historyWrap').classList.contains('open'))fullRenderHist();
  });
  if($('historyWrap').classList.contains('open'))fullRenderHist();
}

function permaDeleteChecklist(id){
  let snap=JSON.stringify(data);
  data.trash=(data.trash||[]).filter(x=>x.id!==id);
  scheduleSave();
  showToast('Entry deleted',data.settings.undoSeconds||5,()=>{
    data=JSON.parse(snap);scheduleSave();
    if($('historyWrap').classList.contains('open'))fullRenderHist();
  });
  if($('historyWrap').classList.contains('open'))fullRenderHist();
}

function restoreFromHistory(id){
  let snap=JSON.stringify(data);
  let idx=(data.trash||[]).findIndex(x=>x.id===id);
  if(idx<0)return;
  let item=data.trash.splice(idx,1)[0];
  item.deletedAt=null;
  let taskName=item.deletedParentTask||null;
  item.deletedParentTask=null;
  let targetTask=null;
  if(taskName){walk(data.items,x=>{if(!targetTask&&x.type==='task'&&x.name===taskName)targetTask=x})}
  if(targetTask){targetTask.children=targetTask.children||[];targetTask.children.push(item);targetTask.collapsed=false;targetTask.updatedAt=now()}
  else if(taskName){let nt=newItem(taskName,'task');nt.children=[item];data.items.unshift(nt)}
  else data.items.push(item);
  scheduleSave();
  if($('historyWrap').classList.contains('open'))fullRenderHist();
  showToast('Item restored',data.settings.undoSeconds||5,()=>{
    data=JSON.parse(snap);changed();
    if($('historyWrap').classList.contains('open'))fullRenderHist();
  });
}

function fullRenderHist(){buildHistDisplayChips();buildHistYears();buildHistMonthDrop();buildHistList()}

function buildHistDisplayChips(){
  let allItems=[];
  (data.trash||[]).forEach(x=>{
    if(x.type==='checklist')allItems.push(x);
    if(x.type==='task'){(function w(n){(n.children||[]).forEach(c=>{if(c.type==='checklist')allItems.push(c);if(c.type==='task')w(c)})})(x)}
  });
  let matchQ = allItems.filter(x=>histMatchQ(x.name) && histYearMonthMatch(x.deletedAt||now()));
  document.getElementById('hcntAll').textContent='('+matchQ.length+')';
  document.getElementById('hcntDone').textContent='('+matchQ.filter(x=>x.completed).length+')';
  document.getElementById('hcntPend').textContent='('+matchQ.filter(x=>!x.completed).length+')';
}

function buildHistYears(){
  let years=new Set();
  (data.trash||[]).forEach(x=>{
    if(x.type==='checklist')years.add(new Date(x.deletedAt||now()).getFullYear());
    if(x.type==='task'){(function w(n){(n.children||[]).forEach(c=>{if(c.type==='checklist')years.add(new Date(c.deletedAt||x.deletedAt||now()).getFullYear());if(c.type==='task')w(c)})})(x)}
  });
  let sorted=[...years].sort((a,b)=>b-a);
  let yhtml=`<div class="hfchip ${histState.year===null?'active':''}" id="hAllTimeChip">All Time</div>`;
  sorted.forEach(y=>{yhtml+=`<div class="hfchip ${histState.year===y?'active':''}" data-hyear="${y}">${y}</div>`});
  document.getElementById('histYearRow').innerHTML=yhtml;
  document.getElementById('hAllTimeChip').onclick=()=>{histState.year=null;histState.month=null;histState.dropOpen=false;closeMonthRowFade();fullRenderHist()};
  document.querySelectorAll('[data-hyear]').forEach(el=>{
    el.onclick=(e)=>{
      e.stopPropagation();
      let y=+el.dataset.hyear;
      if(histState.year===y){histState.dropOpen=!histState.dropOpen}
      else{histState.year=y;histState.month=null;histState.dropOpen=true}
      fullRenderHist();
      if(histState.dropOpen)openMonthRow();else closeMonthRowFade();
    };
  });
}
function buildHistMonthDrop(){
  let drop=document.getElementById('monthFloat');
  if(histState.year===null){drop.classList.remove('open');return}
  let months=new Set();
  (data.trash||[]).forEach(x=>{
    if(x.type==='checklist'){let d=new Date(x.deletedAt||now());if(d.getFullYear()===histState.year)months.add(d.getMonth());}
    if(x.type==='task'){(function w(n){(n.children||[]).forEach(c=>{if(c.type==='checklist'){let d=new Date(c.deletedAt||x.deletedAt||now());if(d.getFullYear()===histState.year)months.add(d.getMonth());}if(c.type==='task')w(c)})})(x)}
  });
  let keys=[...months].sort((a,b)=>a-b);
  let mhtml='';
  keys.forEach(m=>{mhtml+=`<div class="hmchip ${histState.month===m?'active':''}" data-hmonth="${m}">${HMONTHS[m]}</div>`});
  document.getElementById('histMonthRow').innerHTML=mhtml;
  if(histState.dropOpen)drop.classList.add('open');else drop.classList.remove('open');
  document.querySelectorAll('[data-hmonth]').forEach(el=>{
    el.onclick=(e)=>{
      e.stopPropagation();
      let m=+el.dataset.hmonth;
      histState.month=(histState.month===m)?null:m;
      histState.dropOpen=false;
      closeMonthRowFade();

    };
  });
}

document.addEventListener('click',e=>{
  let btn=e.target.closest('#delFilteredBtn');
  if(!btn)return;
  e.stopPropagation();
  let snapshot=JSON.stringify(data);
  let display=histState.display;
  let toDelIds=new Set();
  (data.trash||[]).forEach(x=>{
    if(x.type==='checklist'){
      if(display==='all'||(display==='done'&&x.completed)||(display==='pend'&&!x.completed))toDelIds.add(x.id);
    }
    if(x.type==='task'){
      let taskMatches=false;
      (function w(n){(n.children||[]).forEach(c=>{if(c.type==='checklist'&&(display==='all'||(display==='done'&&c.completed)||(display==='pend'&&!c.completed)))taskMatches=true;if(c.type==='task')w(c)})})(x);
      if(taskMatches)toDelIds.add(x.id);
    }
  });
  if(!toDelIds.size)return;
  data.trash=(data.trash||[]).filter(x=>!toDelIds.has(x.id));
  changed();
  showToast('Deleted '+toDelIds.size+' entries',5,()=>{data=JSON.parse(snapshot);changed();if($('historyWrap').classList.contains('open'))fullRenderHist()});
  fullRenderHist();
});

auth.onAuthStateChanged(async user=>{
  if(!user){uid=null;startAnon();return}
  uid=user.uid;
  try{
    let doc=await DOC.get();
    if(doc.exists&&doc.data().owner===uid&&doc.data().appData){data=doc.data().appData}
    else{let c=localStorage.getItem('nestedChecklistCache');if(c)data=JSON.parse(c);await saveRemote()}

    if(!data.settings.fontSize)data.settings.fontSize=14;
    if(!data.settings.undoSeconds)data.settings.undoSeconds=5;

    if(!data.settings.checklistHeight)data.settings.checklistHeight=28;

    if(data.settings.showCount===undefined)data.settings.showCount=true;
    if(data.settings.showPencil===undefined)data.settings.showPencil=true;
    if(!data.settings.statsState)data.settings.statsState={order:[],collapsed:{}};
    if(!data.logCollapsed)data.logCollapsed={};
    if(data.settings.pageTheme===undefined)data.settings.pageTheme='t1';
    if(data.settings.showCheckboxes===undefined)data.settings.showCheckboxes=true;
    if(data.settings.themeFreeze===undefined)data.settings.themeFreeze=true;
    if(data.settings.editMode===undefined)data.settings.editMode=false;
    if(!data.changelog)data.changelog=[];
    walk(data.items,x=>{ if(x.pinned===undefined)x.pinned=false; if(x.pinnedOrder===undefined)x.pinnedOrder=null; });
    if(!data.settings.themeFreeze){
      let keys=Object.keys(THEMES);
      let pick=keys[Math.floor(Math.random()*keys.length)];
      data.settings.pageTheme=pick;
    }
    showFbPill('Synced');
  }catch(e){let c=localStorage.getItem('nestedChecklistCache');if(c)data=JSON.parse(c);showFbPill('Offline','off')}
  autoCleanup();
